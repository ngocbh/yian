# Branching — classify, route to one of two branches, then read the result.
# Exactly one branch runs; the other skips (its ref resolves to null).
# `${route.output}` reads whichever branch actually ran.
# Run:  yian run branching.yaml --input review="loved it"

id: branching
name: branching
description: Classify a review, route to a matching reply, return the reply.

typedefs:
  Sentiment: Literal(positive, negative)    # an enum — the AGENT node answers one tag

input:
  review: !str

nodes:
  classify:
    kind: agent
    input:
      review: ${input.review}
    output: !Sentiment
    prompt: |-
      Classify the sentiment of this review as exactly one of: positive, negative.
      Review: ${review}

  route:
    kind: case
    on: ${classify.output}         # match a Literal value
    cases:
      - when: positive
        then: thank
      - when: negative
        then: apologize
    # The Literal cases are exhaustive (positive | negative) — no `else:` needed.
    # On a searched case (no `on:`), use `when: "score.output >= 0.5"` etc.

  thank:
    kind: agent
    input:
      review: ${input.review}
    output: !str
    prompt: "Write a warm thank-you reply to: ${review}"

  apologize:
    kind: agent
    input:
      review: ${input.review}
    output: !str
    prompt: "Write an apologetic, helpful reply to: ${review}"

# The output of whichever branch ran.
output: ${route.output}
