# Conversational REPL — the same turn-by-turn LOOP shape used by `ac chat`.
# The turn boundary is STRUCTURAL: HUMAN_INPUT feeds a CASE; exact exit text builds the
# exit record, otherwise AGENT + a second CODE node build the normal transcript. The LLM
# only fills the reply; output bindings rejoin the branches into the carried record.
#
# Carried record ('a): {transcript: str, exited: bool} — threaded turn to turn ('a -> 'a).
# The loop body's `output:` MUST equal this record. A raw multi-ref coalesce has no
# inferable type, so adjacent defaulted spans preserve `str`; comparing the optional
# exit field with `true` proves `bool` below.

id: chat
name: chat
description: A turn-by-turn conversational assistant (plain agent, deterministic transcript).

input:
  opening: str            # seed transcript; `ac chat` passes "" (empty)

defs:
  turn:                   # body: 'a -> 'a over {transcript, exited}
    input:
      transcript: str
      exited: bool
    nodes:
      ask:
        kind: human_input       # blocks a worker until the broker returns the message
        prompt: "You:"
        output: str
      route:
        kind: case
        on: ${ask.output}
        cases:
          - when: /exit
            then: exit_turn
          - when: /quit
            then: exit_turn
        else: reply
      exit_turn:
        kind: code
        input:
          transcript: ${input.transcript}
        output:
          transcript: str
          exited: bool
        code: |
          return {"transcript": inputs["transcript"], "exited": True}
      reply:
        kind: agent
        mode: plain
        input:
          transcript: ${input.transcript}
          message:    ${ask.output}
        output: str
        prompt: |-
          You are a helpful conversational assistant.

          Conversation so far:
          ${transcript}

          User: ${message}
      normal_turn:
        kind: code
        input:
          transcript: ${input.transcript}
          message: ${ask.output}
          reply: ${reply.output}
        output: str
        code: |
          return (
              inputs["transcript"]
              + "\n\nUser: " + inputs["message"]
              + "\n\nAssistant: " + inputs["reply"]
          )
    output:                         # exact carried record type ('a -> 'a)
      transcript: '${exit_turn.output.transcript:-""}${normal_turn.output:-""}'
      exited: ${exit_turn.output.exited == true}  # comparison is always bool

nodes:
  chat:
    kind: loop
    call: turn
    input:                          # the SEED carried record — defines 'a
      transcript: ${input.opening}
      exited: false                 # CASE sets true for exact /exit or /quit input
    while: "not ${exited}"          # pre-check over a carried field
    max: 1000                       # required runaway safety cap
output: ${chat.output.transcript}
