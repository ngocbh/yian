# Conversational REPL — the turn-by-turn LOOP shape of examples/chat.yaml, with the
# older turns folded into a rolling summary by compact_history.yaml.
# The host sends each line the person types to the `messages` inbox (`send`), and each
# turn's `take` reads everything sent since the last one. A take with nothing to read
# waits: the run ends `waiting` and holds no worker until the next send. Beside the take,
# `compacted` CALLs compact_history on the turns so far (no model call under its budget);
# it runs after the reply, so the run ends `waiting` once any fold is done (a host that shows
# the next prompt only then, such as `yian chat`, shows it after the fold). `answered` calls `respond` with
# the summary and the kept turns flattened by a comprehension in the CALL's binding; the
# reply's system prompt renders the summary. Closing the inbox (`close`) ends the loop once
# the queued messages are answered: `closed` comes from the take, and a closed take with no
# events skips `answered` (the routing-only CASE matches nothing), so `answered.output :- []`
# appends nothing.
#
# Carried record ('a): {summary: str, history: list(list(Msg)), closed: bool} — one inner
# list per turn, threaded turn to turn ('a -> 'a). The inbox rides along as a carried input
# but is never returned. The AGENT records only its reply; CALL, LOOP and child END commits
# are pointers, so the run log grows linearly with the conversation.
# Run from this directory so the `uses:` sibling resolves.

id: chat
name: chat
description: A turn-by-turn conversational assistant that folds older turns into a rolling summary.

uses:
  compact_history: compact_history        # compact_history.yaml beside this file

input:
  messages: !Inbox(str)

typedefs:
  Msg:                    # one message of the history the AGENT sends
    role: Literal(user, assistant)
    text: str
  State: {summary: str, history: list(list(Msg)), closed: bool}   # the carried record
  Transcript: {summary: str, history: list(Msg)}                  # the flow's output

defs:
  respond:                # a def, so its CALL flattens the history in a derived binding
    input: {summary: !str, history: !list(Msg), message: !str}
    nodes:
      reply:
        kind: agent
        input:
          summary: ${input.summary}
          history: ${input.history}      # a plain reference: one route in a learnable capture
          message: ${input.message}
        output: str                      # only this turn's reply is recorded
        system_prompt: |-
          You are a helpful conversational assistant.

          Conversation so far: ${summary}
        prompt:
          - ${history}
          - user: ${message}
    # A one-turn list (hence the double brackets), so the body appends it with `+`, or `[]` when
    # `answered` is skipped.
    output: !list(list(Msg)) ${[[Msg(role="user", text=input.message), Msg(role="assistant", text=reply.output)]]}

  turn:                   # body: 'a -> 'a over {summary, history, closed, messages}
    input:
      summary: !str
      history: !list(list(Msg))
      closed: !bool
      messages: !Inbox(str)
    nodes:
      compacted:          # beside `heard`: compacts the history so far
        kind: call
        call: compact_history
        input: {summary: "${input.summary}", history: "${input.history}"}
      heard:
        kind: tool
        tool_id: take                    # waits until a message arrives or the inbox closes
        input:
          from: ${input.messages}
          take: all
      route:
        kind: case
        cases:
          - when: ${heard.output.events != []}   # skipped when the inbox closed with nothing left
            then: answered
      answered:
        kind: call
        call: respond
        input:
          summary: ${compacted.output.summary}
          history: ${[m for t in compacted.output.history for m in t]}
          message: ${join(heard.output.events)}  # one line per send
    output: !State
      summary: ${compacted.output.summary}
      history: ${compacted.output.history + (answered.output :- [])}
      closed: ${heard.output.closed}

nodes:
  chat:
    kind: loop
    call: turn
    input: {summary: "", history: [], closed: false, messages: "${input.messages}"}
    while: not closed
output: !Transcript
  summary: ${chat.output.summary}
  history: ${[m for t in chat.output.history for m in t]}
