# Conversational REPL — the turn-by-turn LOOP shape of examples/chat.yaml.
# The host sends each line the person types to the `messages` inbox (`send`), and each
# turn's `take` reads everything sent since the last one. A take with nothing to read
# waits: the run ends `waiting` and holds no worker until the next send. Closing the inbox
# (`close`) ends the loop once the queued messages are answered: the take returns no events
# and the CASE routes to the `ended` value entry, which keeps the transcript and sets
# `closed: true`. Anything else calls `respond`, where an AGENT node fills the reply and the
# `turn_end` value entry folds it into the transcript. The LLM only fills the reply.
#
# Carried record ('a): {transcript: str, closed: bool} — threaded turn to turn ('a -> 'a).
# The inbox rides along as a carried input but is never returned. A tagged `nodes:` entry
# such as `ended: !Turn` is a value: its tag checks the fields written out under it.
# `${route.output}` reads whichever branch ran, so the CASE must be exhaustive (`else:`
# here). `!Turn` on the body's output types the branch result as the carried record.

id: chat
name: chat
description: A turn-by-turn conversational assistant (one model call per turn, no tools).

input:
  messages: !Inbox(str)     # the lines the person types, sent while the run is live

typedefs:
  Turn:                     # the carried record, and each turn's result
    transcript: str
    closed: bool

defs:
  respond:                  # a CASE result is the routed node's output, so the reply chain is a def
    input:
      transcript: !str
      said: !str
    nodes:
      reply:
        kind: agent
        input:
          transcript: ${input.transcript}
          said: ${input.said}
        output: str
        prompt: |-
          You are a helpful conversational assistant.

          Conversation so far:
          ${transcript}

          User: ${said}
      turn_end: !Turn
        transcript: |-
          ${input.transcript}

          User: ${input.said}

          Assistant: ${reply.output}
        closed: false
    output: ${turn_end.output}

  turn:                     # body: 'a -> 'a over {transcript, closed}
    input:
      transcript: !str
      closed: !bool
      messages: !Inbox(str)
    nodes:
      heard:
        kind: tool
        tool_id: take               # waits until a message arrives or the inbox closes
        input:
          from: ${input.messages}
          take: all                 # every unread message, oldest first
      ended: !Turn                  # a value entry: the closing record itself
        transcript: ${input.transcript}
        closed: true
      route:
        kind: case
        cases:
          - when: ${heard.output.events == []}   # closed, nothing left to answer
            then: ended
        else: call(respond, transcript=${input.transcript}, said=${join(heard.output.events, "\n")})
    output: !Turn ${route.output}

nodes:
  chat:
    kind: loop
    call: turn
    input:                          # the SEED carried record — defines 'a
      transcript: ""
      closed: false
      messages: ${input.messages}
    while: not closed               # pre-check over a carried field
output: ${chat.output.transcript}
