# Compact (single-node) flow — the flow IS one node.
# Run:  yian run compact.yaml --input name=Ada   (needs a model provider configured)
#
# When a flow has exactly one node, skip the `nodes:` map and the redundant
# `output: ${node.output}` line — put the node `kind:` and its fields at the top
# level. The flow `id:` names the node; each flow input reaches the node under its
# own name, so the prompt reads it bare; the flow `output:` is the node's output
# TYPE, re-exported as the flow output.
#
# Allowed only for the LEAF kinds: agent, code, tool. case, call, map and loop
# need the full `nodes:` form (see minimal.yaml).

id: greet
name: greet
description: A one-node flow written inline — a name in, a greeting out.

input:
  name: !str                  # the prompt reads it as ${name}
output: str                  # the node's output TYPE; constrained types -> structured generation
kind: agent
prompt: |-
  Write a short, warm one-sentence greeting addressed to ${name}.
