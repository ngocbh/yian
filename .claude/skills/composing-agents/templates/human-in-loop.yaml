# Human in the loop — draft, ask a person, then finalize.
# An `ask` TOOL node ALWAYS asks, through the run's ask handler, for a typed answer
# (validated against its `output:`). The host answers at once (`yian run` asks in the
# terminal), or returns `pending()` and answers later while the run waits.
# For "ask only if the model decides it needs to", grant an AGENT node the `ask_user`
# tool instead.

id: human-in-loop
name: human_in_loop
description: Draft, ask a person to approve or revise, then finalize.

typedefs:
  Decision: Literal(approve, revise)

input:
  topic: !str

nodes:
  draft:
    kind: agent
    input:
      topic: ${input.topic}
    output: !str
    prompt: "Draft a short announcement about ${topic}."

  review:
    kind: tool
    tool_id: ask
    input:
      prompt: |-                   # a wiring template: it reads the pool, not local names
        Here is the draft:

        ${draft.output}

        Approve as-is or revise? (approve / revise)
    output: !Decision              # the typed answer

  finalize:
    kind: agent
    input:
      draft: ${draft.output}
      decision: ${review.output}
    output: !str
    prompt: |-
      The reviewer said: ${decision}.
      If "approve", return the draft unchanged. If "revise", improve it.

      Draft:
      ${draft}

output: ${finalize.output}
