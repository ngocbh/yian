# Inline `code:` source — a bare TypeScript/JavaScript body (no `./file.ts:fn` reference).
#
# The author writes statements that read the node's inputs from the `inputs` object and
# `return` a value. This is the SAME one-object convention a `./file.ts:fn` function gets, so
# a body promotes to a reference by copy-paste. A body must `return`, and the returned value
# must be a yian value. Bodies run on worker threads, so stopping the run ends even a body
# that never yields.

id: inline_code_demo
name: inline_code_demo
description: Classify a numeric rating with an inline `code:` node (no external module).

input:
  rating: !float
  label: !str

nodes:
  verdict:
    kind: code
    input:
      rating: ${input.rating}
      label:  ${input.label}
    output: str
    code: |
      const lean = inputs.rating >= 0 ? "positive" : "negative";
      const sign = inputs.rating >= 0 ? "+" : "";
      return `${inputs.label}: ${lean} (${sign}${inputs.rating.toFixed(2)})`;

output: ${verdict.output}
