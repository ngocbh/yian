# LLM config cascade — per-field fill-the-gap, most-specific wins.
#
# A flow-level `llm_config:` sets defaults for every AGENT node below it. Each AGENT node
# fills only the fields it leaves unset from the flow layer (then the parent flow, then the CLI
# `--provider`/`--model`, then process provider/model defaults captured once when the run
# initializes: YIAN_DEFAULT_PROVIDER/YIAN_DEFAULT_MODEL, then the `yian auth` saved login;
# none is built in). An AGENT node's own field always wins. `inherit: false` skips the authored
# flow/parent/CLI layers but still receives those process defaults.
#
# Request settings live in a block named after the provider (`anthropic:` below), shaped
# like that provider's API request body. Blocks merge the same way, one field at a time,
# and a node uses only the block of the provider it resolves to.
#
# Try the CLI layer (fills the gaps nothing else set):
#   yian run llm-config-cascade.yaml --provider anthropic --model claude-opus-4-8

id: llm-config-cascade
name: llm_config_cascade
description: Show the llm_config cascade — flow default, per-node override, inherit:false.

llm_config:                       # the flow layer: every AGENT node inherits these defaults
  provider: anthropic
  anthropic:
    max_tokens: 2048
    output_config: {effort: low}

nodes:
  drafter:                        # inherits provider, max_tokens; sets model, effort
    kind: agent
    prompt: Draft a one-line summary.
    llm_config:
      model: claude-opus-4-8
      anthropic:
        output_config: {effort: high}   # replaces the flow's output_config whole

  grader:                         # own selection + process defaults; no flow/CLI layer
    kind: agent
    depends_on: [drafter]
    prompt: Grade the draft pass/fail.
    llm_config:
      provider: openai
      model: gpt-5.5
      inherit: false

output: ${grader.output}
