# Loop — iterate a body until a predicate goes false (the engine's `while`).
# The loop threads ONE carried record from each turn into the next: the body reads
# the carried record and returns the fields that change ('a -> 'a); the loop re-runs it
# while `while:` holds. Here the body asks a person each turn through an `ask` TOOL node,
# so one run threads answer -> turn -> answer. (For a chat fed by a host's sends, take
# from an inbox instead: see chat.yaml.)
#
# The contract ('a -> 'a): the body's `output:` returns a SUBSET of the carried record
# (the loop `input:`); each omitted field keeps its previous value. The names the body
# reads must be a SUBSET of the carried names too. Field NAMES are checked at build; each
# returned field keeps its carried TYPE (load), enforced at runtime/replay.
#
# Pick EXACTLY ONE driver per loop node:
#   while: not exited   # PRE-check: 0+ runs, stop when the predicate goes false; max: optional
#   until: exited       # POST-check / do-while: 1+ runs, stop when the predicate becomes true; max: optional
#   times: 3               # fixed COUNT: exactly 3 runs, no predicate; max: is REDUNDANT and rejected

id: loop
name: loop
description: Chat-shaped loop — ask per turn, fold the message, stop on "bye".

defs:
  chat_turn:                       # the body flow ('a -> 'a over {messages, exited})
    input:
      messages: !list(str)          # a subset of the carried names is fine
    nodes:
      ask:
        kind: tool
        tool_id: ask
        input:
          prompt: "your message (type 'bye' to end)"
        output: str                # the typed answer
    output:                        # carried fields only; here it returns both
      messages: ${input.messages + [ask.output]}   # this turn's message appended
      exited: ${ask.output == "bye"}

nodes:
  loop:
    kind: loop
    call: chat_turn                # the body (a def here; may also be a `uses:` file)
    input:                         # the SEED carried record — defines 'a
      messages: []
      exited: false
    while: not exited              # pre-check; bare boolean predicate (no `${}`)
    max: 100                       # optional runaway guard, >= 1 (loop.max_exceeded)

output: ${loop.output}
