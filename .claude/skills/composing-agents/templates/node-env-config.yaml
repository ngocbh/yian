# Per-node config — the `env:` block.
#
# `env:` is a static mapping of config keys a node's own implementation reads (the engine
# never interprets it). A flow-level `env:` is the default for every node; each node overrides
# individual keys (the node wins). The merge happens at load, stays in this flow (a called
# child flow does NOT inherit this flow's env), and takes literals only.
#
# Keys yian reads:
#   max_tool_iterations (AGENT node) — tool-loop turns before the node fails with
#                                 agent.max_tool_iterations (default -1 = no cap; set a
#                                 positive int to bound it).

id: node-env-config
name: node_env_config
description: Show the env block — flow-level default plus a per-node override.

env:                              # the flow layer: every node inherits these by default
  max_tool_iterations: 50

nodes:
  researcher:                     # overrides the flow default for this node only
    kind: agent
    tools: [search]
    prompt: Investigate the topic thoroughly, then summarize.
    env:
      max_tool_iterations: 300

  grader:                         # no env: of its own — inherits the flow default (50)
    kind: agent
    depends_on: [researcher]
    prompt: Grade the research pass/fail.

output: ${grader.output}
