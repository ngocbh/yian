# Pipeline — an AGENT node drafts TEXT, a CODE node parses it into a TYPED record.
# Use this when you want DETERMINISTIC post-processing of an AGENT node's text (parsing,
# arithmetic, validation in code). To have the AGENT node emit a structured value directly,
# declare the typed shape as its `output:` instead — see `typed_output.yaml`.
#
# Customize: edit the inline body, or move it to a file and point `code:` at it as
# `./parsing.ts:parseNote`, resolved against the flow's folder:
#   export function parseNote(inputs: { text: string }) {   // receives its bound input record
#     const text = inputs.text;
#     return { title: text.split("\n", 1)[0], word_count: text.split(/\s+/).filter(Boolean).length };
#   }

id: pipeline
name: pipeline
description: An AGENT node drafts text; a CODE node parses it into a typed record.

typedefs:
  Parsed:                          # a record — fields recurse
    title: str
    word_count: int

input:
  topic: !str

nodes:
  draft:
    kind: agent
    input:
      topic: ${input.topic}
    output: str
    prompt: "Write a short note about ${topic}."

  parse:
    kind: code
    input:
      text: ${draft.output}        # the reference IS the edge draft -> parse
    output: Parsed                 # one typed value; an AGENT node supports records too
    code: |
      const text = inputs.text;
      return { title: text.split("\n", 1)[0], word_count: text.split(/\s+/).filter(Boolean).length };

output: ${parse.output}
