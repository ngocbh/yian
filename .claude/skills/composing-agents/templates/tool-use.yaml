# Tool use — a TOOL node (deterministic, no LLM) feeds an AGENT node.
# A `tool` uses `tool_id:` + `input:` (the tool's argument names), and may declare
# `output:`; every value the tool returns is checked against it. The host passes the tool
# to the run:
#
#   import { runFlow, tool } from "@ngocbh/yian";
#
#   const getFacts = tool({
#     name: "get_facts",
#     description: "Fetch recent facts for a subject.",   // what the model sees
#     parameters: {
#       type: "object",
#       properties: { query: { type: "string" }, limit: { type: "integer" } },
#       required: ["query"],
#     },
#     execute: async ({ query, limit }) => fetchFacts(String(query), Number(limit ?? 5)),
#   });
#
#   await runFlow(flow, { subject }, { tools: { get_facts: getFacts } });
#
# When the run starts, the node's inputs and output: are checked against get_facts's
# parameters and output schema; a missing tool fails the run before it starts.

id: tool-use
name: tool_use
description: Call a host tool, then have an AGENT node write from the result.

typedefs:
  Fact: {text: str, source: str}

input:
  subject: !str

nodes:
  facts:
    kind: tool
    tool_id: get_facts             # a tool the host passes to the run
    input:                         # each value is a ${...} ref or a literal
      query: ${input.subject}
      limit: 5
    output: list(Fact)

  summary:
    kind: agent
    input:
      subject: ${input.subject}
      facts: ${facts.output}
    output: str
    prompt: |-
      Using these facts, write a 3-sentence brief on ${subject}.

      Facts:
      ${facts}

output: ${summary.output}
