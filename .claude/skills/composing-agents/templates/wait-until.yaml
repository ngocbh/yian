# WAIT blocks one worker until an absolute UTC date/datetime, then returns None.
# Use depends_on when the next step needs ordering but not WAIT's value.
id: wait-until
name: wait_until
input:
  deadline: datetime
nodes:
  settle:
    kind: wait
    until: ${input.deadline}
  continue:
    kind: code
    depends_on: [settle]
    output: str
    code: |
      return "deadline reached"
output: ${continue.output}
