name: "🔧 Setup / Installation Help"
description: Having trouble installing or running Yian? Ask here.
title: "[Setup]: "
labels: ["setup"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry you're having trouble! Please fill out the details below so we can help.

        **Quick checks first:**
        - From a clone, run `bun install --frozen-lockfile` (see [CONTRIBUTING](https://github.com/ngocbh/yian/blob/main/CONTRIBUTING.md#development-setup))
        - Yian needs **Bun 1.4+** or **Node 22.18+**. Confirm with `bun --version` or `node --version`.
        - Run the CLI from a clone with `bun src/cli/index.ts`.
        - Check the [README](https://github.com/ngocbh/yian/blob/main/README.md).

  - type: textarea
    id: description
    attributes:
      label: What's Going Wrong?
      description: Describe what you're trying to do and where it fails.
      placeholder: |
        I ran `bun install` and then `bun src/cli/index.ts run flow.yaml`, but I get...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps Taken
      description: What did you do? Include the exact commands you ran.
      placeholder: |
        1. git clone https://github.com/ngocbh/yian
        2. cd yian && bun install --frozen-lockfile
        3. bun src/cli/index.ts run ../examples/....yaml
        4. Error appears: ...
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - From a clone, on Bun
        - From a clone, built and run on Node
        - A single-file binary
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS 15.2 / Windows 11
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime Version
      description: Bun (`bun --version`, 1.4+) or Node (`node --version`, 22.18+)
      placeholder: "Bun 1.4.2"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Yian Version / Commit
      description: Release version, or short commit hash (`git rev-parse --short HEAD`)
      placeholder: "45beb62"

  - type: textarea
    id: error-output
    attributes:
      label: Full Error Output
      description: Paste the complete error message or traceback. This will be auto-formatted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What I've Already Tried
      description: List any fixes or workarounds you've already attempted.
      placeholder: |
        - Upgraded Bun to 1.4
        - Reinstalled with `bun install --frozen-lockfile`
        - Ran a fresh clone
