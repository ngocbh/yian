name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Install pinned Mermaid validator
        env:
          MERMAID_TOOLS: ${{ runner.temp }}/mermaid-tools
        run: |
          npm install --prefix "$MERMAID_TOOLS" --no-save --no-package-lock \
            mermaid@11.16.1 \
            @mermaid-js/mermaid-cli@11.16.0

      - name: Validate tracked Mermaid diagrams
        shell: bash
        env:
          MERMAID_TOOLS: ${{ runner.temp }}/mermaid-tools
        run: |
          output_root="$RUNNER_TEMP/mermaid-output"
          puppeteer_config="$RUNNER_TEMP/puppeteer.json"
          printf '%s\n' '{"args":["--no-sandbox"]}' >"$puppeteer_config"
          diagram_documents=0
          while IFS= read -r -d '' path; do
            if grep -Eq '^[[:space:]]*(`{3,}|~{3,})[[:space:]]*mermaid([[:space:]]|$)' "$path"; then
              diagram_documents=$((diagram_documents + 1))
              output="$output_root/${path%.md}.md"
              mkdir -p "$(dirname "$output")"
              "$MERMAID_TOOLS/node_modules/.bin/mmdc" \
                --quiet \
                --puppeteerConfigFile "$puppeteer_config" \
                --input "$path" \
                --output "$output"
            fi
          done < <(git ls-files -z -- '*.md')
          if (( diagram_documents == 0 )); then
            echo "No tracked Mermaid documents found" >&2
            exit 1
          fi

      - name: Build documentation
        run: mkdocs build --strict

      - name: Verify Mermaid runtime pin
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("site/architecture/index.html").read_text()
          mermaid = "https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.min.js"
          initialize = "mermaid.initialize({ startOnLoad: false })"
          material = "assets/javascripts/bundle."
          scroller = 'className = "mermaid-scroll"'
          assert mermaid in html, "architecture page does not load pinned Mermaid runtime"
          assert html.index(mermaid) < html.index(initialize) < html.index(material), (
              "Mermaid auto-render must be disabled before Material loads"
          )
          assert html.index(material) < html.index(scroller), "Scroller must subscribe after Material"
          PY

      - name: Exercise documentation visuals in Material
        shell: bash
        env:
          MERMAID_TOOLS: ${{ runner.temp }}/mermaid-tools
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory site \
            >"$RUNNER_TEMP/docs-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8000/architecture/ >/dev/null; then
              break
            fi
            if (( attempt == 50 )); then
              cat "$RUNNER_TEMP/docs-server.log" >&2
              exit 1
            fi
            sleep 0.1
          done
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import path from "node:path"
          import { createRequire } from "node:module"

          const require = createRequire(path.join(process.env.MERMAID_TOOLS, "package.json"))
          const puppeteer = require("puppeteer")
          const browser = await puppeteer.launch({
            headless: true,
            args: ["--no-sandbox"]
          })
          try {
            const page = await browser.newPage()
            await page.setViewport({ width: 1440, height: 900 })
            await page.goto("http://127.0.0.1:8000/architecture/", {
              waitUntil: "networkidle0"
            })
            await page.waitForFunction(
              () => document.querySelectorAll(".mermaid-scroll > div.mermaid").length === 2
            )
            const diagrams = await page.evaluate(() =>
              [...document.querySelectorAll(".mermaid-scroll")].map(scroller => ({
                hostTag: scroller.firstElementChild.tagName,
                hostWidth: scroller.firstElementChild.getBoundingClientRect().width,
                viewportWidth: scroller.clientWidth,
                scrollWidth: scroller.scrollWidth
              }))
            )
            assert.equal(diagrams.length, 2)
            for (const diagram of diagrams) {
              assert.equal(diagram.hostTag, "DIV")
              assert.ok(diagram.hostWidth >= 1280)
              assert.ok(diagram.scrollWidth >= diagram.hostWidth)
              assert.ok(diagram.viewportWidth < diagram.scrollWidth)
            }

            await page.goto("http://127.0.0.1:8000/agent/", {
              waitUntil: "networkidle0"
            })
            const semantics = await page.evaluate(() => {
              const request = document.querySelector(".ac-request-visual")
              const timeline = document.querySelector(".ac-turn-visual")
              const messages = request?.querySelector(".ac-request-messages")
              const fields = request?.querySelector(".ac-request-fields")
              const stack = messages?.querySelector(".ac-request-message-stack")
              const frames = messages?.querySelector(".ac-request-memory-frames")
              const turns = timeline?.querySelector(".ac-turn-timeline")
              return {
                requestCount: document.querySelectorAll(".ac-request-visual").length,
                timelineCount: document.querySelectorAll(".ac-turn-visual").length,
                stackTag: stack?.tagName,
                messages: [...(stack?.children ?? [])].map(item => item.dataset.message),
                frameTag: frames?.tagName,
                frames: [...(frames?.children ?? [])].map(item => item.textContent.trim()),
                fieldsFollowMessages: messages?.nextElementSibling === fields,
                fieldsShareFrame: messages?.parentElement === fields?.parentElement,
                timelineTag: turns?.tagName,
                turnCount: turns?.children.length
              }
            })
            assert.equal(semantics.requestCount, 1)
            assert.equal(semantics.timelineCount, 1)
            assert.equal(semantics.stackTag, "OL")
            assert.deepEqual(semantics.messages, ["system", "human", "additional"])
            assert.equal(semantics.frameTag, "OL")
            assert.deepEqual(semantics.frames, [
              "Root-flow frame",
              "Child-flow frame(s)",
              "AGENT-local frame"
            ])
            assert.ok(semantics.fieldsFollowMessages)
            assert.ok(semantics.fieldsShareFrame)
            assert.equal(semantics.timelineTag, "OL")
            assert.equal(semantics.turnCount, 4)

            const inspectLayout = () => page.evaluate(() => {
              const bounds = item => {
                const { top, right, bottom, left } = item.getBoundingClientRect()
                return { top, right, bottom, left }
              }
              const rect = selector => bounds(document.querySelector(selector))
              const fieldCards = [...document.querySelectorAll(".ac-request-field")].map(
                bounds
              )
              const memoryFrames = [...document.querySelectorAll(".ac-request-memory-frames li")].map(
                bounds
              )
              return {
                messages: rect(".ac-request-messages"),
                fields: rect(".ac-request-fields"),
                fieldCards,
                memoryFrames,
                overflow: [...document.querySelectorAll(".ac-request-visual, .ac-turn-visual")].map(
                  item => item.scrollWidth - item.clientWidth
                )
              }
            })

            const desktop = await inspectLayout()
            assert.ok(desktop.fields.top >= desktop.messages.bottom)
            assert.ok(Math.abs(desktop.fieldCards[0].top - desktop.fieldCards[1].top) < 2)
            assert.ok(desktop.fieldCards[1].left > desktop.fieldCards[0].right)
            assert.ok(desktop.memoryFrames.every(
              frame => Math.abs(frame.top - desktop.memoryFrames[0].top) < 2
            ))
            assert.ok(desktop.memoryFrames[1].left > desktop.memoryFrames[0].right)
            assert.ok(desktop.overflow.every(amount => amount <= 1))

            await page.setViewport({ width: 390, height: 844 })
            const mobile = await inspectLayout()
            assert.ok(mobile.fieldCards[1].top >= mobile.fieldCards[0].bottom)
            assert.ok(mobile.memoryFrames[1].top >= mobile.memoryFrames[0].bottom)
            assert.ok(mobile.overflow.every(amount => amount <= 1))

            await page.setViewport({ width: 1440, height: 900 })
            for (const scheme of ["default", "slate"]) {
              const visualContrast = await page.evaluate(selectedScheme => {
                document.body.dataset.mdColorScheme = selectedScheme
                const canvas = document.createElement("canvas")
                canvas.width = 1
                canvas.height = 1
                const context = canvas.getContext("2d", { willReadFrequently: true })

                const color = value => {
                  context.clearRect(0, 0, 1, 1)
                  context.fillStyle = value
                  context.fillRect(0, 0, 1, 1)
                  const [red, green, blue, alpha] = context.getImageData(0, 0, 1, 1).data
                  return [red, green, blue, alpha / 255]
                }
                const composite = (foreground, background) => {
                  const alpha = foreground[3] + background[3] * (1 - foreground[3])
                  if (alpha === 0) return [0, 0, 0, 0]
                  const channels = [0, 1, 2].map(index => (
                    foreground[index] * foreground[3]
                    + background[index] * background[3] * (1 - foreground[3])
                  ) / alpha)
                  return [...channels, alpha]
                }
                const backdrop = element => {
                  let result = [0, 0, 0, 0]
                  for (let current = element; current; current = current.parentElement) {
                    result = composite(result, color(getComputedStyle(current).backgroundColor))
                    if (result[3] >= 0.999) break
                  }
                  return composite(result, [255, 255, 255, 1])
                }
                const luminance = rgba => {
                  const [red, green, blue] = rgba.slice(0, 3).map(channel => {
                    channel /= 255
                    return channel <= 0.04045
                      ? channel / 12.92
                      : ((channel + 0.055) / 1.055) ** 2.4
                  })
                  return 0.2126 * red + 0.7152 * green + 0.0722 * blue
                }
                const contrast = (first, second) => {
                  const high = Math.max(luminance(first), luminance(second))
                  const low = Math.min(luminance(first), luminance(second))
                  return (high + 0.05) / (low + 0.05)
                }
                const textContrast = element => {
                  const background = backdrop(element)
                  const foreground = composite(color(getComputedStyle(element).color), background)
                  return {
                    label: element.textContent.trim().replace(/\s+/g, " ").slice(0, 80),
                    contrast: contrast(foreground, background)
                  }
                }
                const borderContrast = (selector, side, minimum) => {
                  const element = document.querySelector(selector)
                  const style = getComputedStyle(element)
                  const property = side[0].toUpperCase() + side.slice(1)
                  const background = backdrop(element.parentElement)
                  const border = composite(color(style[`border${property}Color`]), background)
                  return {
                    selector,
                    side,
                    minimum,
                    width: Number.parseFloat(style[`border${property}Width`]),
                    style: style[`border${property}Style`],
                    contrast: contrast(border, background)
                  }
                }

                const textSelectors = [
                  ".ac-request-visual > figcaption > *",
                  ".ac-turn-visual > figcaption > *",
                  ".ac-request-section-title h3",
                  ".ac-request-badge",
                  ".ac-request-step",
                  ".ac-request-message-heading code",
                  ".ac-request-message-heading strong",
                  ".ac-request-content-block > strong",
                  ".ac-request-content-block > span",
                  ".ac-request-memory-title > strong",
                  ".ac-request-memory-frames li",
                  ".ac-request-memory > small",
                  ".ac-request-field > strong",
                  ".ac-request-field > span",
                  ".ac-request-adapter > *",
                  ".ac-request-model > strong",
                  ".ac-request-note",
                  ".ac-turn-timeline strong",
                  ".ac-turn-timeline p"
                ]
                const text = [...document.querySelectorAll(textSelectors.join(","))]
                  .map(textContrast)
                const borders = [
                  borderContrast(".ac-request-frame", "top", 1.5),
                  borderContrast(".ac-request-messages", "top", 1.5),
                  borderContrast(".ac-request-content-block", "top", 1.5),
                  borderContrast(".ac-request-field", "left", 3),
                  borderContrast(".ac-request-model", "top", 3),
                  borderContrast(".ac-turn-visual", "top", 1.5),
                  borderContrast(".ac-turn-timeline > li", "left", 1.5)
                ]

                const memoryFrame = document.querySelector(".ac-request-memory-frames li")
                const memoryConnector = getComputedStyle(memoryFrame, "::after")
                const memoryBackground = backdrop(memoryFrame.parentElement)
                const routeConnectors = [...document.querySelectorAll(".ac-request-route-arrow")]
                  .map(element => ({
                    content: element.textContent.trim(),
                    contrast: textContrast(element).contrast
                  }))
                return {
                  text,
                  borders,
                  connectors: [{
                    content: memoryConnector.content.replaceAll('"', ""),
                    contrast: contrast(
                      composite(color(memoryConnector.color), memoryBackground),
                      memoryBackground
                    )
                  }, ...routeConnectors]
                }
              }, scheme)
              for (const sample of visualContrast.text) {
                assert.ok(
                  sample.contrast >= 4.5,
                  `${scheme} text contrast ${sample.contrast.toFixed(2)}: ${sample.label}`
                )
              }
              for (const border of visualContrast.borders) {
                assert.ok(border.width >= 1, `${border.selector} has no ${border.side} border`)
                assert.notEqual(border.style, "none")
                assert.ok(
                  border.contrast >= border.minimum,
                  `${scheme} ${border.selector} ${border.side} border contrast `
                    + `${border.contrast.toFixed(2)}`
                )
              }
              for (const connector of visualContrast.connectors) {
                assert.ok(connector.content.length > 0)
                assert.ok(
                  connector.contrast >= 3,
                  `${scheme} connector contrast ${connector.contrast.toFixed(2)}`
                )
              }
            }
          } finally {
            await browser.close()
          }
          JS
