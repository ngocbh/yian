name: Publish to npm

# Publishes @ngocbh/yian through npm trusted publishing (OIDC), so no npm token is stored. Runs for a
# published GitHub Release, or by hand as a dry run that publishes nothing.
#
# No provenance while the repository is private: npm can't attest a private source. Once the repo is
# public and package.json has `repository` again, npm adds provenance itself under trusted
# publishing; `--provenance` on the publish line below would only make it explicit.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ngocbh/yian
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing exchanges
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1 && npm --version

      - run: bun install --frozen-lockfile

      - name: Check the tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "${TAG#v}" = "$version" ] || { echo "::error::tag $TAG != package.json version $version"; exit 1; }

      - run: bun run typecheck

      # Some tests run the built dist/ on Node.
      - run: bun run build

      - run: bun test ./tests

      - name: Test the packed tarball
        run: YIAN_TEST_PACK=1 bun test tests/packaging.test.ts -t "npm tarball"

      - run: npm publish --access public --dry-run

      # A version with a `-` (a prerelease) also needs `--tag next`.
      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --access public
