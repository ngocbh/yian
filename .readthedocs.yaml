# Read the Docs builds the Starlight site in docs/ with Node and bun.
# Docs: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    # astro 7.4.2 needs Node >= 22.23.4.
    nodejs: "24"
  jobs:
    install:
      - npm install -g bun@1.4.2
      - cd docs && bun install --frozen-lockfile
    build:
      html:
        - cd docs && bun run build
        - mkdir -p $READTHEDOCS_OUTPUT/html && cp -R docs/dist/. $READTHEDOCS_OUTPUT/html/
