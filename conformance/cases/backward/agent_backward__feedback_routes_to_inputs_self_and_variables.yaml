# Pins: one AGENT backward call whose reply gives input, self and variable feedback: the AGENT's
# result keeps all three, and only the input feedback reaches the flow input (positionally, per tag).
kind: backward
flow: |
  id: writer-flow
  name: writer_flow
  llm_config: {provider: openai, model: gpt-5.5}
  typedefs:
    Tone: Literal(concise, detailed)
  input:
    topic: !str
    tags: !list(str)
  nodes:
    writer:
      kind: agent
      variables:
        tone: !Tone concise
      input:
        topic: ${input.topic}
        tags: ${input.tags}
      prompt: '${topic}: ${tone}'
      output: str
  output: ${writer.output}
inputs:
  topic: reefs
  tags: [a, b]
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: recorded answer
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"tags": [[null, "Use a relevant tag."]]}, "self_feedback": ["Preserve uncertainty."], "variable_feedback": {"tone": ["Be precise."]}}'
backward:
- feedback: Explain the answer.
expect:
  output:
    status: succeeded
    output: recorded answer
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        tags: [a, b]
        topic: reefs
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        tags: [a, b]
        topic: reefs
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        evaluated_keys: [tags, topic]
        input_names: [topic, tags]
        route:
          children:
          - kind: source
            source:
              execution_seq: 0
              path: [topic]
              run_id: r1
          - kind: source
            source:
              execution_seq: 0
              path: [tags]
              run_id: r1
          kind: record
          names: [topic, tags]
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: recorded answer, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9d3569c0b91ae9281c0ca9e2eaafd2273812e1ffcbaa9a7e1baba74246ad960a
        response_id: null
        usage: null
  - - pool_commit
    - writer
    - value: recorded answer
  - - pool_commit
    - writer
    - key: writer.new_messages
      steps: [9]
  - - node_succeeded
    - writer
    - commit: 10
      forward_capture:
        evaluated_keys: [tags, topic]
        input_names: [topic, tags]
        route:
          children:
          - kind: source
            source:
              execution_seq: 5
              path: [topic]
              run_id: r1
          - kind: source
            source:
              execution_seq: 5
              path: [tags]
              run_id: r1
          kind: record
          names: [topic, tags]
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [writer]
        variable_names: [tone]
      messages: 11
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: recorded answer
  - - node_succeeded
    - __end__
    - commit: 14
      forward_capture:
        evaluated_keys: [result]
        input_names: [result]
        route:
          children:
          - kind: source
            source:
              execution_seq: 8
              path: []
              run_id: r1
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
  - - backward_started
    - null
    - attempt_id: 1
      feedback: Explain the answer.
  - - backward_ready
    - null
    - attempt_id: 1
      attributed_results:
      - attribution:
        - contribution_index: 0
          input_name: tags
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 8
            path: []
            run_id: r1
        feedback:
        - tags: [null, Use a relevant tag.]
        invoked: true
        result:
          input_feedback:
            tags:
            - [null, Use a relevant tag.]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 5
          path: []
          run_id: r1
      - attribution:
        - contribution_index: 0
          input_name: result
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 13
            path: []
            run_id: r1
        feedback: [Explain the answer.]
        invoked: true
        result:
          input_feedback:
            tags:
            - [null, Use a relevant tag.]
          self_feedback: [Preserve uncertainty.]
          variable_feedback:
            tone: [Be precise.]
        source:
          execution_seq: 8
          path: []
          run_id: r1
      - attribution:
        - contribution_index: null
          input_name: null
          message_index: 0
          parents: []
          sender: null
        feedback: [Explain the answer.]
        invoked: true
        result:
          input_feedback:
            result: [Explain the answer.]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 13
          path: []
          run_id: r1
      proposals: []
      root_result:
        input_feedback:
          tags:
          - [null, Use a relevant tag.]
        self_feedback: []
        variable_feedback: {}
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback:
            tags:
            - [null, Use a relevant tag.]
          self_feedback: []
          variable_feedback: {}
        learning: null
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        tags: [a, b]
        topic: reefs
      interrupted: false
  - - NodeStarted
    - node_id: writer
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: writer
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: writer
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: writer
      output: recorded answer
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: recorded answer
      interrupted: false
  - - RunSucceeded
    - output: recorded answer
  stream:
  - chunk: recorded answer
    final: false
    key: text
    node_id: writer
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: writer
    n: 1
    index: 1
  backward:
  - failure: null
    feedback:
      input_feedback:
        tags:
        - [null, Use a relevant tag.]
      self_feedback: []
      variable_feedback: {}
    learning: null
    status: succeeded
