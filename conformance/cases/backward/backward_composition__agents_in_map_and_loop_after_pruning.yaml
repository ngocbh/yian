# From tests/engine/test_backward_composition.py::test_call_and_map_loop_calls_retain_each_agent_after_pruning_and_terminal_resume
# (shortest form: a MAP of a LOOP of a CALL to the AGENT; str output, no provider blocks, no
# terminal-resume half).
# Pins: backward calls every AGENT occurrence once, the LOOP's earlier (pruned) iterations too, and
# returns the first iterations' input feedback to each MAP item's position.
kind: backward
rules: [run-log]
flow: |
  id: nested-agent-history
  name: nested_agent_history
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    values: !list(str)
  defs:
    agent_body:
      input:
        n: !str
      nodes:
        author:
          kind: agent
          input:
            n: ${input.n}
          prompt: 'concise: ${n}'
          output: str
      output: ${author.output}
    loop_body:
      input:
        n: !str
      nodes:
        invoke:
          kind: call
          call: agent_body
          input:
            n: ${input.n}
      output:
        n: ${invoke.output}
    mapped:
      input:
        n: !str
      nodes:
        loop:
          kind: loop
          call: loop_body
          input:
            n: ${input.n}
          times: 2
      output: ${loop.output.n}
  nodes:
    many:
      kind: map
      call: mapped
      over: ${input.values}
      input:
        n: ${item}
  output: ${many.output}
inputs:
  values: [ten, twenty]
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  models:
    many#0/loop#0/invoke/author:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: one
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"n": ["Refine n."]}, "self_feedback": [], "variable_feedback": {}}'
    many#0/loop#1/invoke/author:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: one
      backward:
      - reply:
          format: yian.message.v1
