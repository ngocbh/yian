# From tests/engine/test_backward_composition.py::test_public_map_preserves_equal_item_positions_after_reversed_completion,
# both parametrizations as two backward calls (serial here; the gate CODE that forced the reversed
# completion is dropped).
# Pins: MAP items with equal values keep their positions in backward: whole-output feedback calls
# each item's AGENT and returns one positional message per item; positional feedback [null, ""]
# calls only item 1 ("" is effective feedback).
kind: backward
rules: [run-log]
flow: |
  id: ordered-map-feedback
  name: ordered_map_feedback
  llm_config: {provider: ollama, model: local-test}
  input:
    values: !list(str)
  defs:
    item_flow:
      input:
        value: !str
      nodes:
        answer:
          kind: agent
          input:
            value: ${input.value}
          prompt: ${value}
      output: ${answer.output}
  nodes:
    each:
      kind: map
      call: item_flow
      over: ${input.values}
      input:
        value: ${item}
  output: ${each.output}
inputs:
  values: [same, same]
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  models:
    each#0/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: same
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"value": ["Review every item."]}, "self_feedback": [], "variable_feedback": {}}'
    each#1/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: same
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"value": ["Review every item."]}, "self_feedback": [], "variable_feedback": {}}'
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"value": [""]}, "self_feedback": [], "variable_feedback": {}}'
backward:
- feedback: Review every item.
- feedback: [null, '']
