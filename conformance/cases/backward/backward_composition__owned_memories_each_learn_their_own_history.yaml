# From tests/engine/test_backward_composition.py::test_owned_memories_learn_complete_history_and_reject_invalid_proposals
# (invalid_proposal False; built-in episodic memories in place of the fakes).
# Pins: memories declared on the flow (outer), on a called child (inner) and on its AGENT (local)
# each learn the episodes of their own scope: local only the AGENT's, inner the child's nodes,
# outer everything; one AGENT backward call serves all three.
kind: backward
flow: |
  id: owned-composition
  name: owned_composition
  long_term_memory: {outer: episodic}
  llm_config: {provider: ollama, model: local-test}
  input:
    topic: !str
  defs:
    child:
      long_term_memory: {inner: episodic}
      input:
        topic: !str
      nodes:
        work:
          kind: code
          code: return 7
          output: int
        author:
          kind: agent
          long_term_memory: {local: episodic}
          variables:
            tone: !str concise
          input:
            topic: ${input.topic}
          prompt: '${topic}: ${tone}'
      output: ${author.output}
  nodes:
    gate:
      kind: case
      cases:
        - when: 'true'
          then: invoke
      else: unused
    invoke:
      kind: call
      call: child
      input:
        topic: ${input.topic}
    unused:
      kind: call
      call: child
      input:
        topic: ${input.topic}
  output: ${invoke.output | unused.output}
inputs:
  topic: reefs
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    invoke/author:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: answer
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"topic": ["Refine topic."]}, "self_feedback": ["Keep context.", "Avoid guessing."], "variable_feedback": {"tone": ["Stay concise.", "Be precise."]}}'
backward:
- feedback: Review answer.
expect:
  output:
    status: succeeded
    output: answer
