# From tests/engine/test_backward_recovery.py::test_real_agent_failure_discards_partial_reverse_results_and_retries_every_callback.
# Pins: an AGENT backward reply naming an input the AGENT doesn't have fails the backward call
# (backward.result, at that AGENT), discarding the partial results; the next call is a whole new
# pass that calls every AGENT again, with the next attempt id.
kind: backward
rules: [run-log]
flow: |
  id: backward-recovery
  name: backward_recovery
  llm_config: {provider: ollama, model: local-test}
  input:
    topic: !str
  nodes:
    first:
      kind: agent
      input:
        topic: ${input.topic}
      prompt: 'Draft ${topic}'
    second:
      kind: agent
      input:
        draft: ${first.output}
      prompt: 'Review ${draft}'
  output: ${second.output}
inputs:
  topic: reefs
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  models:
    first:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: draft
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"topic": ["valid sibling"], "foreign": ["reject"]}, "self_feedback": [], "variable_feedback": {}}'
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"topic": ["fresh topic"]}, "self_feedback": [], "variable_feedback": {}}'
    second:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: answer
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"draft": ["temporary"]}, "self_feedback": [], "variable_feedback": {}}'
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"draft": ["fresh draft"]}, "self_feedback": [], "variable_feedback": {}}'
backward:
- feedback: First review.
- feedback: Second review.
expect:
  output:
    status: succeeded
    output: answer
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        first:
          model: local-test
          provider: ollama
        second:
          model: local-test
          provider: ollama
      learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: reefs}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: reefs
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        bound_inputs: {topic: reefs}
        evaluated_keys: [topic]
        input_names: [topic]
        node_data:
          input_output_paths:
            topic: [topic]
        route:
          children:
          - kind: source
            source:
              execution_seq: 0
              path: [topic]
              run_id: r1
          kind: record
          names: [topic]
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, first]
  - - pool_commit
    - first
    - value: draft
  - - node_succeeded
    - first
    - commit: 9
      forward_capture:
        bound_inputs: {topic: reefs}
        evaluated_keys: [topic]
        input_names: [topic]
        node_data:
          effective_llm_config: {model: local-test, provider: ollama}
          prompt_template: Draft ${topic}
          rendered_prompt: Draft reefs
          variable_domains: {}
          variables: {}
        route:
          children:
          - kind: source
            source:
              execution_seq: 5
              path: [topic]
              run_id: r1
          kind: record
          names: [topic]
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [first]
  - [node_started, second]
  - - pool_commit
    - second
    - value: answer
  - - node_succeeded
    - second
    - commit: 12
      forward_capture:
        bound_inputs: {draft: draft}
        evaluated_keys: [draft]
        input_names: [draft]
        node_data:
          effective_llm_config: {model: local-test, provider: ollama}
          prompt_template: Review ${draft}
          rendered_prompt: Review draft
          variable_domains: {}
          variables: {}
        route:
          children:
          - kind: source
            source:
              execution_seq: 8
              path: []
              run_id: r1
          kind: record
          names: [draft]
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [second]
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: answer
  - - node_succeeded
    - __end__
    - commit: 15
      forward_capture:
        bound_inputs: {result: answer}
        evaluated_keys: [result]
        input_names: [result]
        node_data:
          input_output_paths:
            result: []
        route:
          children:
          - kind: source
            source:
              execution_seq: 11
              path: []
              run_id: r1
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
  - - backward_started
    - null
    - attempt_id: 1
      feedback: First review.
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure:
          cause: null
          code: backward.result
          memory: null
          message: input_feedback selects undeclared input 'foreign'
          node_id: first
          node_started_seq: 8
          run_id: r1
          scope:
            boundary: null
            flow_path: []
            occurrence_path: []
            static_path: [first]
          stage: backward
        feedback: null
        learning: null
        status: failed
  - - backward_started
    - null
    - attempt_id: 2
      feedback: Second review.
  - - backward_ready
    - null
    - attempt_id: 2
      attributed_results:
      - attribution:
        - contribution_index: 0
          input_name: topic
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 8
            path: []
            run_id: r1
        feedback:
        - topic: fresh topic
        invoked: true
        result:
          input_feedback:
            topic: [fresh topic]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 5
          path: []
          run_id: r1
      - attribution:
        - contribution_index: 0
          input_name: draft
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 11
            path: []
            run_id: r1
        feedback: [fresh draft]
        invoked: true
        result:
          input_feedback:
            topic: [fresh topic]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 8
          path: []
          run_id: r1
      - attribution:
        - contribution_index: 0
          input_name: result
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 14
            path: []
            run_id: r1
        feedback: [Second review.]
        invoked: true
        result:
          input_feedback:
            draft: [fresh draft]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 11
          path: []
          run_id: r1
      - attribution:
        - contribution_index: null
          input_name: null
          message_index: 0
          parents: []
          sender: null
        feedback: [Second review.]
        invoked: true
        result:
          input_feedback:
            result: [Second review.]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 14
          path: []
          run_id: r1
      proposals: []
      root_result:
        input_feedback:
          topic: [fresh topic]
        self_feedback: []
        variable_feedback: {}
  - - backward_finished
    - null
    - attempt_id: 2
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback:
            topic: [fresh topic]
          self_feedback: []
          variable_feedback: {}
        learning: null
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: reefs
  - - NodeStarted
    - node_id: first
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: local-test
      node_id: first
      provider: ollama
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: local-test
      node_id: first
      provider: ollama
      purpose: chat
  - - NodeSucceeded
    - node_id: first
      output: draft
  - - NodeStarted
    - node_id: second
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: local-test
      node_id: second
      provider: ollama
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: local-test
      node_id: second
      provider: ollama
      purpose: chat
  - - NodeSucceeded
    - node_id: second
      output: answer
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: answer
  - - RunSucceeded
    - output: answer
  stream:
  - chunk: draft
    exchange_id: <id:1>
    final: false
    key: text
    node_id: first
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: first
  - chunk: answer
    exchange_id: <id:2>
    final: false
    key: text
    node_id: second
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: second
  backward:
  - failure:
      cause: null
      code: backward.result
      memory: null
      message: input_feedback selects undeclared input 'foreign'
      node_id: first
      node_started_seq: 8
      run_id: r1
      scope:
        boundary: null
        flow_path: []
        occurrence_path: []
        static_path: [first]
      stage: backward
    feedback: null
    learning: null
    status: failed
  - failure: null
    feedback:
      input_feedback:
        topic: [fresh topic]
      self_feedback: []
      variable_feedback: {}
    learning: null
    status: succeeded
