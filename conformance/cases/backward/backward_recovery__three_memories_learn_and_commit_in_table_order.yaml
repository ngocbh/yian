  YIAN_DEFAULT_PROVIDER: openai
  YIAN_DEFAULT_MODEL: gpt-5.5
inputs:
  topic: reefs
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    first:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: draft
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"topic": ["topic review"]}, "self_feedback": [], "variable_feedback": {}}'
    second:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: answer
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {"draft": ["draft review"]}, "self_feedback": [], "variable_feedback": {}}'
    __memory__:
      memory:B:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"actions":[{"action":"add","lesson_id":"topic","text":"Name the topic."}]}'
      memory:C:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: |-
              <profile>
              # Reviews
              - Review the draft.
              </profile>
backward:
- feedback: Review.
