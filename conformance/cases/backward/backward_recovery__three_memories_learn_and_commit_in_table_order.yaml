# Pins: three memories (episodic A on the flow, reflective B on one AGENT, profile C on the other)
# learn and commit in key order, each with its own disposition in the outcome.
# YIAN_DEFAULT_PROVIDER/MODEL: reflective and profile learners' model config comes from the defaults.
kind: backward
flow: |
  id: backward-recovery
  name: backward_recovery
  long_term_memory: {A: episodic}
  llm_config: {provider: ollama, model: local-test}
  input:
    topic: !str
  nodes:
    first:
      kind: agent
      long_term_memory: {B: reflective}
      input:
        topic: ${input.topic}
      prompt: 'Draft ${topic}'
    second:
      kind: agent
      long_term_memory: {C: profile}
      input:
        draft: ${first.output}
      prompt: 'Review ${draft}'
  output: ${second.output}
files:
  memory/backward-recovery/C.md: |
    # Reviews
