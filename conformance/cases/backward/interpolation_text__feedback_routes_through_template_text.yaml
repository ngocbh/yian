# TS-only (run-log). Pins: feedback routes through two templates with literal text, each an
# interpolation route in a recorded capture: the top-level END's output and `writer`'s `draft`
# input. Each AGENT's backward request shows the downstream context with the template's text
# (`result`), which the record leaves out and learning rebuilds by binding the node again.
kind: backward
rules: [run-log]
flow: |
  id: polish
  name: polish
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    topic: !str
  nodes:
    drafter:
      kind: agent
      input: {topic: '${input.topic}'}
      prompt: 'Draft a line about ${topic}.'
      output: str
    writer:
      kind: agent
      input: {draft: 'Polish this: ${drafter.output} (one line)'}
      prompt: '${draft}'
      output: str
  output: 'Final: ${writer.output}'
