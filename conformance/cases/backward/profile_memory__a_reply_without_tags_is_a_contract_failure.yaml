            message: [message]
        route:
          children:
          - kind: source
            source:
              execution_seq: 0
              path: [message]
              run_id: r1
          kind: record
          names: [message]
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, reply]
  - - node_step
    - reply
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - {text: Hello., type: text}
          role: assistant
        purpose: chat
        request_sha256: 6dab702638505d20410036d8ae56715c914b71eb105e235b2890ec3d61cd26f2
        response_id: null
