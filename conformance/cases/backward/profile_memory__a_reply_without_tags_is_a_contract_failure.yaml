# From tests/engine/test_profile_memory.py::test_parse_reply_enforces_tags_content_and_budget (the no-tags row)
# and ::test_provider_failure_is_retryable_and_bad_replies_are_not.
# Pins: a profile learner reply without <profile> tags fails the backward call at the learn stage as
# a final contract error, and the document stays as it was.
# YIAN_DEFAULT_PROVIDER/MODEL: a profile learner's model config comes from the defaults, not the flow.
kind: backward
rules: [run-log]
flow: |
  id: chat
  name: chat
  llm_config: {provider: openai, model: test-model}
  long_term_memory: profile
  input:
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        message: ${input.message}
      prompt: ${message}
      output: str
  output: ${reply.output}
files:
  memory/chat/profile.md: |
    # Ada
    - Works on reefs.
env:
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_DEFAULT_MODEL: gpt-5.5
inputs:
  message: hi
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Hello.
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {}, "self_feedback": [], "variable_feedback": {}}'
    __memory__:
      memory:profile:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '# Ada without tags'
backward:
- feedback: Keep replies brief.
expect:
  output:
    status: succeeded
    output: Hello.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        reply:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {message: hi}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        message: hi
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
