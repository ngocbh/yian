# From tests/engine/test_profile_memory.py::test_learn_without_feedback_calls_no_model.
# Pins: a backward call with no feedback makes no profile learner call (and no AGENT backward call),
# and the document stays as it was.
# YIAN_DEFAULT_PROVIDER/MODEL: a profile learner's model config comes from the defaults, not the flow.
kind: backward
flow: |
  id: chat
  name: chat
  llm_config: {provider: openai, model: test-model}
  long_term_memory: profile
  input:
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        message: ${input.message}
      prompt: ${message}
      output: str
  output: ${reply.output}
files:
  memory/chat/profile.md: |
    # Ada
    - Works on reefs.
env:
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_DEFAULT_MODEL: gpt-5.5
inputs:
  message: hi
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Hello.
backward:
- feedback: null
expect:
  output:
    status: succeeded
    output: Hello.
