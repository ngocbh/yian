# From tests/engine/test_profile_memory_integration.py::test_recall_learn_and_commit_through_a_public_run.
# Pins: a seeded profile document reaches the AGENT's system prompt; backward feedback makes the
# profile learner rewrite it (one call, a <profile> reply), and the commit writes the new document.
# YIAN_DEFAULT_PROVIDER/MODEL: a profile learner's model config comes from the defaults, not the flow.
kind: backward
rules: [run-log]
flow: |
  id: chat
  name: chat
  llm_config: {provider: openai, model: test-model}
  long_term_memory: profile
  input:
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        message: ${input.message}
      prompt: ${message}
      output: str
  output: ${reply.output}
files:
  memory/chat/profile.md: |
    # Ada
    - Works on reefs.
env:
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_DEFAULT_MODEL: gpt-5.5
inputs:
  message: hi
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Hello.
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: |-
                You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.

                Memory context (canonical JSON; sections are ordered from outer workflow to local agent):
                {"order":"outer-to-local","sections":[{"index":1,"memory":"profile","text":"# Ada\n- Works on reefs.\n"}]}
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
      backward:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"input_feedback": {}, "self_feedback": [], "variable_feedback": {}}'
    __memory__:
      memory:profile:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: |-
              <profile>
              # Ada
              - Works on reefs.
              - Prefers brief replies.
              </profile>
backward:
- feedback: Keep replies brief.
expect:
  output:
    status: succeeded
    output: Hello.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        reply:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {message: hi}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        message: hi
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        evaluated_keys: [message]
        input_names: [message]
        route:
          children:
          - kind: source
            source:
              execution_seq: 0
              path: [message]
              run_id: r1
          kind: record
          names: [message]
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, reply]
  - - node_step
    - reply
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - {text: Hello., type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - reply
    - value: Hello.
  - - pool_commit
    - reply
    - key: reply.new_messages
      steps: [9]
  - - node_succeeded
    - reply
    - commit: 10
      forward_capture:
        evaluated_keys: [message]
        input_names: [message]
        route:
          children:
          - kind: source
            source:
              execution_seq: 5
              path: [message]
              run_id: r1
          kind: record
          names: [message]
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [reply]
      messages: 11
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: Hello.
  - - node_succeeded
    - __end__
    - commit: 14
