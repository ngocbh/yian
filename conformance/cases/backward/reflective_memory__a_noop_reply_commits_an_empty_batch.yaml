# From tests/engine/test_reflective_memory.py::test_commit_is_atomic_idempotent_and_empty_batches_advance_revision
# and ::test_learn_uses_pinned_config_and_returns_deterministic_proposals (a lone noop action).
# Pins: a reflective learner that answers noop proposes nothing; the empty batch still commits.
# YIAN_DEFAULT_PROVIDER/MODEL: a reflective learner's model config comes from the defaults, not the flow.
kind: backward
flow: |
  id: memory-run
  name: memory_run
  long_term_memory: {lessons: reflective}
  nodes:
    work:
      kind: code
      code: return 7
      output: int
  output: ${work.output}
env:
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_DEFAULT_MODEL: gpt-5.5
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    __memory__:
      memory:lessons:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"actions":[{"action":"noop","lesson_id":null,"text":null}]}'
backward:
- feedback: Prefer eight.
expect:
  output:
    status: succeeded
    output: 7
  trace:
  - - run_started
    - null
    - learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        route: {kind: record}
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, work]
  - - pool_commit
    - work
    - value: 7
  - - node_succeeded
    - work
    - commit: 9
      forward_capture:
        route: {kind: record}
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [work]
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 7
  - - node_succeeded
    - __end__
    - commit: 12
      forward_capture:
        evaluated_keys: [result]
        input_names: [result]
        route:
          children:
          - kind: source
            source:
              execution_seq: 8
              path: []
              run_id: r1
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
  - - backward_started
    - null
    - attempt_id: 1
      feedback: Prefer eight.
  - - backward_ready
    - null
    - attempt_id: 1
      attributed_results:
      - attribution: []
        feedback: []
        invoked: false
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 5
          path: []
          run_id: r1
      - attribution:
        - contribution_index: 0
          input_name: result
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 11
            path: []
            run_id: r1
        feedback: [Prefer eight.]
        invoked: true
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 8
          path: []
          run_id: r1
      - attribution:
        - contribution_index: null
          input_name: null
          message_index: 0
          parents: []
          sender: null
        feedback: [Prefer eight.]
        invoked: true
        result:
          input_feedback:
            result: [Prefer eight.]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 11
          path: []
          run_id: r1
      proposals:
      - memory: lessons
        mutations: []
      root_result:
        input_feedback: {}
        self_feedback: []
        variable_feedback: {}
  - - memory_commit_requested
    - null
    - attempt_id: 1
      commit_id: <id:1>
      memory: lessons
      mutations: []
  - - memory_commit_succeeded
    - null
    - attempt_id: 1
      commit_id: <id:1>
      memory: lessons
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        learning:
          failures: []
          policies:
          - commit_id: <id:1>
            failure: null
            memory: lessons
            status: succeeded
          status: succeeded
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: work
  - - NodeSucceeded
    - node_id: work
      output: 7
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 7
  - - RunSucceeded
    - output: 7
  backward:
  - failure: null
    feedback:
      input_feedback: {}
      self_feedback: []
      variable_feedback: {}
    learning:
      failures: []
      policies:
      - commit_id: <id:1>
        failure: null
        memory: lessons
        status: succeeded
      status: succeeded
    status: succeeded
  memory:
    lessons: ''
