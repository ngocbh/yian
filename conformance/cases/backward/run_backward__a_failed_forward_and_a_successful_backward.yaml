# hand TS expect: the TS body throws `new Error('forward failed')`, whose failure message is "Error: forward failed"
# (as in run-map-call/seed_e24_nested_code_raise), and its throwing line `  throw new Error('forward failed')` ends at
# column 42; Python's "forward failed" and column 47 are in python_expect.
kind: backward
rules: [code, run-log]
flow: |
  id: failure
  name: failure
  nodes:
    work:
      kind: code
      code: |
        if (true)
          throw new Error('forward failed')
        return 0
  output: ${work.output}
python_flow: |
  id: failure
  name: failure
  nodes:
    work:
      kind: code
      code: |
        if True:
            raise RuntimeError('forward failed')
        return 0
  output: ${work.output}
run:
  num_workers: 0
  learnable: true
backward:
- feedback: Review failure.
expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [8, 7, 8, 42]
      message: 'Error: forward failed'
      node: work
  trace:
