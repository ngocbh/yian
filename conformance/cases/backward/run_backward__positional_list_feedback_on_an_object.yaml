kind: backward
flow: |
  id: identity
  name: identity
  input:
    text: !object
  nodes: {}
  output: ${input.text}
inputs:
  text:
    items: [1, 2]
run:
  num_workers: 0
  learnable: true
backward:
- feedback:
    items: [Review first., null]
expect:
  output:
    status: succeeded
    output:
      items: [1, 2]
  trace:
  - - run_started
    - null
    - inputs:
        text:
          items: [1, 2]
      learnable: true
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - forward_capture:
        bound_inputs:
          text:
            items: [1, 2]
        evaluated_keys: [text]
        input_names: [text]
        node_data:
          input_output_paths:
            text: [text]
        route:
          children:
          - kind: source
            source:
              execution_seq: 0
              path: [text]
              run_id: <id:1>
          kind: record
          names: [text]
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
      value:
        text:
          items: [1, 2]
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - forward_capture:
        bound_inputs:
          result:
            items: [1, 2]
        evaluated_keys: [result]
        input_names: [result]
        node_data:
          input_output_paths:
            result: []
        route:
          children:
          - kind: source
            source:
              execution_seq: 1
              path: [text]
              run_id: <id:1>
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
      value:
        items: [1, 2]
  - - backward_started
    - null
    - attempt_id: 1
      feedback:
        items: [Review first., null]
  - - backward_ready
    - null
    - attempt_id: 1
      attributed_results:
      - attribution:
        - contribution_index: 0
          input_name: result
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 3
            path: []
            run_id: <id:1>
        feedback:
        - text:
            items: [Review first., null]
        invoked: true
        result:
          input_feedback:
            text:
            - items: [Review first., null]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 1
          path: []
          run_id: <id:1>
      - attribution:
        - contribution_index: null
          input_name: null
          message_index: 0
          parents: []
          sender: null
        feedback:
        - items: [Review first., null]
        invoked: true
        result:
          input_feedback:
            result:
            - items: [Review first., null]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 3
          path: []
          run_id: <id:1>
      proposals: []
      root_result:
        input_feedback:
          text:
          - items: [Review first., null]
        self_feedback: []
        variable_feedback: {}
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback:
            text:
            - items: [Review first., null]
          self_feedback: []
          variable_feedback: {}
        learning: null
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        text:
          items: [1, 2]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        items: [1, 2]
  - - RunSucceeded
    - output:
        items: [1, 2]
  backward:
  - failure: null
    feedback:
      input_feedback:
        text:
        - items: [Review first., null]
      self_feedback: []
      variable_feedback: {}
    learning: null
    status: succeeded
