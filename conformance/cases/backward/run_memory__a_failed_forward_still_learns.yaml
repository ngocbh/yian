# From tests/engine/test_run_memory.py::test_primary_failure_still_learns_without_changing_its_failure
# (a reflective memory in place of the fake; never episodic, whose episode would hold the Python
# traceback of the failed node).
# Pins: backward on a failed run still learns and commits, and the run's failure is unchanged.
# YIAN_DEFAULT_PROVIDER/MODEL: a reflective learner's model config comes from the defaults, not the flow.
# hand TS expect: the TS body throws `new Error('forward failed')`, whose failure message is "Error: forward failed"
# (as in run-map-call/seed_e24_nested_code_raise), and its throwing line `  throw new Error('forward failed')` ends at
# column 42; Python's "forward failed" and column 47 are in python_expect.
kind: backward
flow: |
  id: failure
  name: failure
  long_term_memory: {lessons: reflective}
  nodes:
    work:
      kind: code
      code: |
        if (true)
          throw new Error('forward failed')
        return 0
  output: ${work.output}
env:
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_DEFAULT_MODEL: gpt-5.5
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
  models:
    __memory__:
      memory:lessons:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"actions":[{"action":"add","lesson_id":"failure","text":"Check the work step."}]}'
backward:
- feedback: Review the failure.
expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [9, 7, 9, 42]
      message: 'Error: forward failed'
      node: work
  trace:
  - - run_started
    - null
    - learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        route: {kind: record}
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, work]
  - - node_failed
    - work
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [9, 7, 9, 42]
        message: 'Error: forward failed'
        node: work
      forward_capture:
        route:
          kind: record
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [work]
  - - backward_started
    - null
    - attempt_id: 1
      feedback: Review the failure.
  - - backward_ready
    - null
    - attempt_id: 1
      attributed_results:
      - attribution: []
        feedback: []
        invoked: false
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 5
          path: []
          run_id: r1
      - attribution:
        - contribution_index: null
          input_name: null
          message_index: 0
          parents: []
          sender: null
        feedback: [Review the failure.]
        invoked: true
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 8
          path: []
          run_id: r1
      proposals:
      - memory: lessons
        mutations:
        - mutation_id: <id:1>
          payload:
            action: add
            lesson_id: failure
            source:
              run_id: r1
            text: Check the work step.
      root_result:
        input_feedback: {}
        self_feedback: []
        variable_feedback: {}
  - - memory_commit_requested
    - null
    - attempt_id: 1
      commit_id: <id:2>
      memory: lessons
      mutations:
      - mutation_id: <id:1>
        payload:
          action: add
          lesson_id: failure
          source:
            run_id: r1
          text: Check the work step.
  - - memory_commit_succeeded
    - null
    - attempt_id: 1
      commit_id: <id:2>
      memory: lessons
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        learning:
          failures: []
          policies:
          - commit_id: <id:2>
            failure: null
            memory: lessons
            status: succeeded
          status: succeeded
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: work
  - - NodeFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [9, 7, 9, 42]
        message: 'Error: forward failed'
        node: work
  - - RunFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [9, 7, 9, 42]
        message: 'Error: forward failed'
        node: work
  backward:
  - failure: null
    feedback:
      input_feedback: {}
      self_feedback: []
      variable_feedback: {}
    learning:
      failures: []
      policies:
      - commit_id: <id:2>
        failure: null
        memory: lessons
        status: succeeded
      status: succeeded
    status: succeeded
  memory:
    lessons: '[failure] Check the work step.'
