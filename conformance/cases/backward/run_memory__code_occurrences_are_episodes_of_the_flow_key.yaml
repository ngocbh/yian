# From tests/engine/test_run_memory.py::test_code_node_occurrences_are_episodes_of_the_flow_key,
# and ::test_learning_success_is_separate_from_the_primary_result.
# Pins: backward on a flow-level episodic memory commits one episode per node occurrence (a CODE
# node's among them), separately from the run's own success; the commit records come before
# backward_finished.
kind: backward
rules: [run-log]
flow: |
  id: memory-run
  name: memory_run
  long_term_memory: {test: episodic}
  nodes:
    work:
      kind: code
      code: return 7
      output: int
  output: ${work.output}
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
backward:
- feedback: Prefer eight.
expect:
  output:
    status: succeeded
    output: 7
  trace:
  - - run_started
    - null
    - learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        bound_inputs: {}
        node_data:
          input_output_paths: {}
        route: {kind: record}
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, work]
  - - pool_commit
    - work
    - value: 7
  - - node_succeeded
    - work
    - commit: 9
      forward_capture:
        bound_inputs: {}
        route: {kind: record}
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [work]
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 7
  - - node_succeeded
    - __end__
    - commit: 12
      forward_capture:
        bound_inputs: {result: 7}
        evaluated_keys: [result]
        input_names: [result]
        node_data:
          input_output_paths:
            result: []
        route:
          children:
          - kind: source
            source:
              execution_seq: 8
              path: []
              run_id: r1
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
  - - backward_started
    - null
    - attempt_id: 1
      feedback: Prefer eight.
  - - backward_ready
    - null
    - attempt_id: 1
      attributed_results:
      - attribution: []
        feedback: []
        invoked: false
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 5
          path: []
          run_id: r1
      - attribution:
        - contribution_index: 0
          input_name: result
          message_index: 0
          parents: [0]
          sender:
            execution_seq: 11
            path: []
            run_id: r1
        feedback: [Prefer eight.]
        invoked: true
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 8
          path: []
          run_id: r1
      - attribution:
        - contribution_index: null
          input_name: null
          message_index: 0
          parents: []
          sender: null
        feedback: [Prefer eight.]
        invoked: true
        result:
          input_feedback:
            result: [Prefer eight.]
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 11
          path: []
          run_id: r1
      proposals:
      - memory: test
        mutations:
        - mutation_id: <id:1>
          payload:
            entry:
              entry_id: <id:1>
              episode:
                base_system_prompt: null
                execution_seq: 5
                failure: null
                inputs: {}
                interactions: []
                memory_sections: []
                occurrence_path: []
                output: {}
                owner_static_path: [__start__]
                prompt: null
                run_id: r1
                status: succeeded
            operation: append
        - mutation_id: <id:2>
          payload:
            entry:
              entry_id: <id:2>
              episode:
                base_system_prompt: null
                execution_seq: 8
                failure: null
                inputs: {}
                interactions: []
                memory_sections: []
                occurrence_path: []
                output: 7
                owner_static_path: [work]
                prompt: null
                run_id: r1
                status: succeeded
            operation: append
        - mutation_id: <id:3>
          payload:
            entry:
              entry_id: <id:3>
              episode:
                base_system_prompt: null
                execution_seq: 11
                failure: null
                inputs:
                  result: 7
                interactions: []
                memory_sections: []
                occurrence_path: []
                output: 7
                owner_static_path: [__end__]
                prompt: null
                run_id: r1
                status: succeeded
            operation: append
      root_result:
        input_feedback: {}
        self_feedback: []
        variable_feedback: {}
  - - memory_commit_requested
    - null
    - attempt_id: 1
      commit_id: <id:4>
      memory: test
      mutations:
      - mutation_id: <id:1>
        payload:
          entry:
            entry_id: <id:1>
            episode:
              base_system_prompt: null
              execution_seq: 5
              failure: null
              inputs: {}
              interactions: []
              memory_sections: []
              occurrence_path: []
              output: {}
              owner_static_path: [__start__]
              prompt: null
              run_id: r1
              status: succeeded
          operation: append
      - mutation_id: <id:2>
        payload:
          entry:
            entry_id: <id:2>
            episode:
              base_system_prompt: null
              execution_seq: 8
              failure: null
              inputs: {}
              interactions: []
              memory_sections: []
              occurrence_path: []
              output: 7
              owner_static_path: [work]
              prompt: null
              run_id: r1
              status: succeeded
          operation: append
      - mutation_id: <id:3>
        payload:
          entry:
            entry_id: <id:3>
            episode:
              base_system_prompt: null
              execution_seq: 11
              failure: null
              inputs:
                result: 7
              interactions: []
              memory_sections: []
              occurrence_path: []
              output: 7
              owner_static_path: [__end__]
              prompt: null
              run_id: r1
              status: succeeded
          operation: append
  - - memory_commit_succeeded
    - null
    - attempt_id: 1
      commit_id: <id:4>
      memory: test
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        learning:
          failures: []
          policies:
          - commit_id: <id:4>
            failure: null
            memory: test
            status: succeeded
          status: succeeded
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: work
  - - NodeSucceeded
    - node_id: work
      output: 7
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 7
  - - RunSucceeded
    - output: 7
  backward:
  - failure: null
    feedback:
      input_feedback: {}
      self_feedback: []
      variable_feedback: {}
    learning:
      failures: []
      policies:
      - commit_id: <id:4>
        failure: null
        memory: test
        status: succeeded
      status: succeeded
    status: succeeded
  memory:
    test: |-
      {"entry_id":"<id:1>","episode":{"base_system_prompt":null,"execution_seq":5,"failure":null,"inputs":{},"interactions":[],"memory_sections":[],"occurrence_path":[],"output":{},"owner_static_path":["__start__"],"prompt":null,"run_id":"r1","status":"succeeded"}}
      {"entry_id":"<id:2>","episode":{"base_system_prompt":null,"execution_seq":8,"failure":null,"inputs":{},"interactions":[],"memory_sections":[],"occurrence_path":[],"output":7,"owner_static_path":["work"],"prompt":null,"run_id":"r1","status":"succeeded"}}
      {"entry_id":"<id:3>","episode":{"base_system_prompt":null,"execution_seq":11,"failure":null,"inputs":{"result":7},"interactions":[],"memory_sections":[],"occurrence_path":[],"output":7,"owner_static_path":["__end__"],"prompt":null,"run_id":"r1","status":"succeeded"}}
