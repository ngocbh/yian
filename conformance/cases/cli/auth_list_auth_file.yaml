kind: cli
files:
  auth.json: |
    {"version": 1, "default_provider": "openai", "providers": {
      "openai": {"method": "subscription", "model": "gpt-5.5", "credential_id": "id-1",
                 "credentials": {"access_token": "fake-access", "refresh_token": "fake-refresh",
                                 "expires_at": 4102444800, "account_id": "account-1",
                                 "residency": null}},
      "anthropic": {"method": "api_key", "model": "claude-sonnet-4-5", "credential_id": "id-2",
                    "credentials": {"api_key": "fake-key"}},
      "vllm": {"method": "none", "model": "llama", "credential_id": "id-3",
               "credentials": null}}}
args: [auth, --auth-file, auth.json]
expect:
  exit: 0
  stdout: |
    Saved logins:
      openai: subscription, model gpt-5.5 (default)
      anthropic: api-key, model claude-sonnet-4-5
      vllm: none, model llama
