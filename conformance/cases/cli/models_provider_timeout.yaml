kind: cli
stdin: "<key:1>\n"
args: [models, --provider, openrouter, --base-url, "https://gateway.example/api/v1",
       --timeout, "0.5", --json]
http:
  - request: {method: GET, url: "https://gateway.example/api/v1/models",
              headers: {authorization: "Bearer <key:1>"}}
    response: {status: 200, json: {data: [{id: vendor/model-a}]}, delay: 3}
expect:
  exit: 1
  json: {format: yian.cli.v1, error: {code: models.timeout, status: null}}
