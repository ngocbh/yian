kind: cli
flow: |
  id: wrong
  name: wrong
  nodes:
    bad:
      kind: code
      output: str
      code: |
        return 1;
  output: ${bad.output}
args: [run, flow.yaml, -w, "0", --log, run.jsonl, --json]
expect:
  exit: 1
  json:
    format: yian.cli.v1
    status: failed
    failure:
      code: contract.output
      node: bad
      frames: [{label: flow.yaml, range: [6, 13, 6, 16]}]
