kind: cli
flow: |
  id: pause
  name: pause
  nodes:
    first:
      kind: code
      output: str
      code: |
        console.log("ready");
        return "x";
    settle:
      kind: code
      depends_on: [first]
      # Keeps the run busy until the SIGINT; bounded so the CODE worker ends if none comes.
      code: |
        await new Promise((resolve) => setTimeout(resolve, 30_000));
        return null;
  output: ${first.output}
python_flow: |
  id: pause
  name: pause
  nodes:
    first:
      kind: code
      output: str
      code: |
        print("ready", flush=True)
        return "x"
    settle:
      kind: wait
      until: "2999-01-01"
      depends_on: [first]
  output: ${first.output}
args: [run, flow.yaml, -w, "0", --log, run.jsonl]
signal: {name: SIGINT, after: ready}
expect:
  exit: 130
