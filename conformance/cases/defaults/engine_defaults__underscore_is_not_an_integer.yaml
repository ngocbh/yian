kind: defaults
rules: [messages]
env:
  YIAN_MAX_VALUE_NESTING: 1_000
expect:
  raises:
    class: DefaultsError
    message: 'YIAN_MAX_VALUE_NESTING="1_000" is not an integer; use an integer from 1 to 100, or unset it'
python_expect:
  raises:
    class: DefaultsError
    message: "YIAN_MAX_VALUE_NESTING='1_000' is not an integer; use an integer from 1 to 100, or unset it"
