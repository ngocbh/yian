kind: defaults
# The message quotes the variable's text as a value: JSON text in TS, a repr in Python.
rules: [messages]
env: {YIAN_MAX_TOTAL_NODES: lots}
expect:
  raises:
    class: DefaultsError
    message: 'YIAN_MAX_TOTAL_NODES="lots" is not an integer; use an integer from 1 to 999999999999999999, or unset it'
python_expect:
  raises:
    class: DefaultsError
    message: "YIAN_MAX_TOTAL_NODES='lots' is not an integer; use an integer from 1 to 999999999999999999, or unset it"
