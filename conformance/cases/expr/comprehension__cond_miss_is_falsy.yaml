kind: expr
python_skip: "TS-only: list comprehensions (#1086)"
rules: [null-field-read]
# A `.` read of a key an untyped item lacks raises (#1149); `x?.flag` reads null (the ?. twin).
expr: "[x.k for x in ms if x.flag]"
values: {ms: [{k: 1, flag: true}, {k: 2}]}
expect:
  raises:
    class: ExpressionError
    message: "cannot read ${x.flag}: x has no field 'flag'"
