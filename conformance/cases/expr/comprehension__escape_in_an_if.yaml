kind: expr
python_skip: "TS-only: list comprehensions (#1086)"
expr: "[x for x in xs if a | b]"
expect:
  raises:
    class: ExpressionError
    message: "could not parse expression '[x for x in xs if a | b]': a comprehension's iterable and `if` stop before `:-`, `:?` and `|`; write `(a :- [])` at line 1, column 21"
