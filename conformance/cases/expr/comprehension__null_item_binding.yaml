kind: expr
# An item is returned as is; `.k` on a null item raises (#1149), `?.k` reads null.
expr: "[[x for x in [null, 1]], [x for x in [null, 1] if x], [x.k for x in [null]]]"
expect:
  raises:
    class: ExpressionError
    message: "cannot read ${x.k}: x is null; write x?.k to read null instead, or check x != null first"
