kind: expr
rules: [compare]
expr: x not in 'abc'
mode: condition
expect:
  raises:
    class: ExpressionError
    message: 'type error evaluating null not in "abc": unsupported operand kinds for `not in`: `null` and `str`'
python_expect:
  raises:
    class: ExpressionError
    message: '`in` rhs is not iterable: ''in <string>'' requires string as left operand, not NoneType'
