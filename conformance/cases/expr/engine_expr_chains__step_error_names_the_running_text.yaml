kind: expr
rules: [arithmetic, messages]
expr: '''a'' + ''b'' + 1'
expect:
  raises:
    class: ExpressionError
    message: 'type error evaluating "ab" + 1: unsupported operand kinds for `+`: `str` and `int`'
python_expect:
  raises:
    class: ExpressionError
    message: 'type error evaluating ''ab'' + 1: can only concatenate str (not "int") to str'
