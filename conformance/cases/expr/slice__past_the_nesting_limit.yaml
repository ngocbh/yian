kind: expr
python_skip: "TS-only: len() and list slicing (#1086)"
expr: "xs[1:][1:][1:]"
values: {xs: [1, 2, 3, 4]}
env: {YIAN_MAX_VALUE_NESTING: "2"}
expect:
  raises:
    class: ExpressionError
    message: expression nests deeper than 2 levels, the limit for a yian expression (each call, list, unary operator, comparison, and chain of operators is a level); split it into smaller bindings or steps
