kind: expr
# The base is a missing root: a field read of it would raise (#1149), a slice of it misses.
# The bound `n` misses and falls back; the message still names the base that missed.
template: "${missing[(n :- 0):]}"
values: {xs: [1, 2, 3, 4], ys: [5], a: 1, b: 1, m: 2, n: null, s: abc}
mode: strict
expect:
  raises:
    class: ExpressionError
    message: "unresolved reference ${missing} in expression"
