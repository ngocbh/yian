kind: expr
python_skip: "TS-only: len() and list slicing (#1086)"
# The bound `n` misses and falls back; the message still names the base that missed.
template: "${missing.output[(n :- 0):]}"
values: {xs: [1, 2, 3, 4], ys: [5], a: 1, b: 1, m: 2, n: null, s: abc}
mode: strict
expect:
  raises:
    class: ExpressionError
    message: "unresolved reference ${missing.output} in expression"
