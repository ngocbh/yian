# From tests/compose/test_agent_skills_yaml.py::test_skills_are_identity_but_empty_and_order_are_not.
# Granting `all` skills fingerprints differently from a list of skills.
kind: fingerprint
flow: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      skills: [a, b]
      output: str
  output: ${review.output}
other: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      skills: all
      output: str
  output: ${review.output}
expect:
  fingerprint: different
