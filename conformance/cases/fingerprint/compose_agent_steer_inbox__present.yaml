# TS-only: a steer inbox is identity through its wiring (yian #1025).
kind: fingerprint
flow: |
  id: steer
  name: steer
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      output: str
    keep:
      kind: tool
      tool_id: take
      input:
        from: ${input.notes}
  output: ${chat.output}
other: |
  id: steer
  name: steer
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox: ${input.notes}
      output: str
    keep:
      kind: tool
      tool_id: take
      input:
        from: ${input.notes}
  output: ${chat.output}
expect:
  fingerprint: different
