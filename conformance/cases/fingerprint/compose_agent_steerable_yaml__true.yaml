# From tests/compose/test_agent_steerable_yaml.py::test_steerable_is_identity_but_false_is_not.
# `steerable: true` changes the fingerprint.
kind: fingerprint
flow: |
  id: steer
  name: steer
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      output: str
  output: ${chat.output}
other: |
  id: steer
  name: steer
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steerable: true
      output: str
  output: ${chat.output}
expect:
  fingerprint: different
