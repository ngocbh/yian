# tests/compose/test_any_name_literals.py::test_a_call_argument_under_a_credential_name_is_identity
kind: fingerprint
flow: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !Optional(str) null
      nodes:
        run:
          kind: tool
          tool_id: run
          output: str
      output: ${run.output}
  nodes:
    n:
      kind: tool
      tool_id: n
      input:
        x: call(g, password=hunter2)
      output: str
  output: ${n.output}
other: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !Optional(str) null
      nodes:
        run:
          kind: tool
          tool_id: run
          output: str
      output: ${run.output}
  nodes:
    n:
      kind: tool
      tool_id: n
      input:
        x: call(g, password=hunter3)
      output: str
  output: ${n.output}
expect:
  fingerprint: different
