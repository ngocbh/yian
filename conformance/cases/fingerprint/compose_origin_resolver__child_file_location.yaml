# tests/compose/test_origin_resolver.py::test_two_aliases_rebase_canonical_child_without_mutating_it
kind: fingerprint
files:
  child.yaml: |
    id: child
    name: child
    nodes:
      worker:
        kind: tool
        tool_id: worker
        output: int
    output: ${worker.output}
  twin.yaml: |
    id: child
    name: child
    nodes:
      worker:
        kind: tool
        tool_id: worker
        output: int
    output: ${worker.output}
flow: |
  id: parent
  name: parent
  nodes:
    first:
      kind: call
      call: left
    second:
      kind: call
      call: right
  output: ${second.output}
  uses:
    left: child
    right: child
other: |
  id: parent
  name: parent
  nodes:
    first:
      kind: call
      call: left
    second:
      kind: call
      call: right
  output: ${second.output}
  uses:
    left: child
    right: twin
expect:
  fingerprint: same
