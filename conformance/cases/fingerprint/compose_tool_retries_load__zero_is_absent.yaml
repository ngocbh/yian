# From tests/compose/test_tool_retries_load.py::test_zero_retries_keeps_the_flow_fingerprint.
# `retries: 0` on a TOOL fingerprints the same as no retries key.
kind: fingerprint
flow: |
  id: retries
  name: retries
  nodes:
    place:
      kind: tool
      tool_id: place
  output: ${place.output}
other: |
  id: retries
  name: retries
  nodes:
    place:
      kind: tool
      tool_id: place
      retries: 0
  output: ${place.output}
expect:
  fingerprint: same
