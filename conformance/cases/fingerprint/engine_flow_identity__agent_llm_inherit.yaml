# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# An AGENT's llm_config `inherit:` is identity.
kind: fingerprint
flow: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      llm_config: {inherit: true}
      output: str
  output: ${ask.output}
other: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      llm_config: {inherit: false}
      output: str
  output: ${ask.output}
expect:
  fingerprint: different
