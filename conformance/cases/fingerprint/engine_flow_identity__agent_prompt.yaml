# An AGENT's prompt is identity.
kind: fingerprint
flow: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: first
      output: str
  output: ${ask.output}
other: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: second
      output: str
  output: ${ask.output}
expect:
  fingerprint: different
