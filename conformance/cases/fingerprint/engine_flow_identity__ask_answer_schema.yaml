# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# An ask's answer schema (its output type) is identity.
kind: fingerprint
flow: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      input:
        prompt: p
      output: {first: str}
  output: ${node.output}
other: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      input:
        prompt: p
      output: {second: str}
  output: ${node.output}
expect:
  fingerprint: different
