# An ask's question text is identity.
kind: fingerprint
flow: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      input:
        questions:
          - question: first
            header: Answer
  output: ${node.output}
other: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      input:
        questions:
          - question: second
            header: Answer
  output: ${node.output}
expect:
  fingerprint: different
