# From tests/engine/test_flow_identity.py::test_flow_manifest_includes_human_input_title_but_ignores_inert_map_parallel.
# An ask's title (`node_name:`) is identity.
kind: fingerprint
flow: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      node_name: First title
      input:
        prompt: answer
      output: str
  output: ${node.output}
other: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      node_name: Second title
      input:
        prompt: answer
      output: str
  output: ${node.output}
expect:
  fingerprint: different
