# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# The def a CALL calls is identity, even when the defs are alike.
kind: fingerprint
flow: |
  id: call
  name: call
  defs:
    first:
      nodes:
        run:
          kind: tool
          tool_id: run
      output: ${run.output}
    second:
      nodes:
        run:
          kind: tool
          tool_id: run
      output: ${run.output}
  nodes:
    node:
      kind: call
      call: first
  output: ${node.output}
other: |
  id: call
  name: call
  defs:
    first:
      nodes:
        run:
          kind: tool
          tool_id: run
      output: ${run.output}
    second:
      nodes:
        run:
          kind: tool
          tool_id: run
      output: ${run.output}
  nodes:
    node:
      kind: call
      call: second
  output: ${node.output}
expect:
  fingerprint: different
