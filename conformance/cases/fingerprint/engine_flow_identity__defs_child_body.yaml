# From tests/engine/test_flow_identity.py::test_flow_fingerprint_recursively_includes_static_child_flows.
# A called def's CODE body is part of the parent's identity.
kind: fingerprint
rules: [code]
flow: |
  id: recursive
  name: recursive
  defs:
    child:
      nodes:
        inner:
          kind: code
          output: str
          code: |
            return "ok"
      output: ${inner.output}
  nodes:
    invoke:
      kind: call
      call: child
  output: ${invoke.output}
other: |
  id: recursive
  name: recursive
  defs:
    child:
      nodes:
        inner:
          kind: code
          output: str
          code: |
            return "no"
      output: ${inner.output}
  nodes:
    invoke:
      kind: call
      call: child
  output: ${invoke.output}
expect:
  fingerprint: different
python_expect:
  fingerprint: different
