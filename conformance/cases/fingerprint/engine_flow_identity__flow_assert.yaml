# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_common_node_field.
# A flow assert is identity.
kind: fingerprint
flow: |
  id: asserted
  name: asserted
  input:
    x: !int
  asserts:
    - input.x > 0
  nodes:
    body:
      kind: tool
      tool_id: body
      output: int
  output: ${body.output}
other: |
  id: asserted
  name: asserted
  input:
    x: !int
  asserts:
    - input.x > 1
  nodes:
    body:
      kind: tool
      tool_id: body
      output: int
  output: ${body.output}
expect:
  fingerprint: different
