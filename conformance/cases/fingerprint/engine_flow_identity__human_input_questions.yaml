# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# A HUMAN_INPUT's question text is identity.
kind: fingerprint
flow: |
  id: human
  name: human
  nodes:
    node:
      kind: human_input
      questions:
        - question: first
          header: Answer
  output: ${node.output}
other: |
  id: human
  name: human
  nodes:
    node:
      kind: human_input
      questions:
        - question: second
          header: Answer
  output: ${node.output}
expect:
  fingerprint: different
