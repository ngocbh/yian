# The id of the CALL that owns an inline body is identity.
kind: fingerprint
flow: |
  id: inline-identity
  name: inline_identity
  nodes:
    wrapper:
      kind: call
      nodes:
        step:
          kind: tool
          tool_id: step
          output: int
      output: ${step.output}
  output: ${wrapper.output}
other: |
  id: inline-identity
  name: inline_identity
  nodes:
    renamed:
      kind: call
      nodes:
        step:
          kind: tool
          tool_id: step
          output: int
      output: ${step.output}
  output: ${renamed.output}
expect:
  fingerprint: different
