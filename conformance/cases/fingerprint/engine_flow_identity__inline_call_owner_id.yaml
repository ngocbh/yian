# From tests/engine/test_flow_identity.py::test_inline_identity_ignores_formatting_but_tracks_owner_and_child_semantics.
# The id of the CALL that owns an inline body is identity.
kind: fingerprint
flow: |
  id: inline-identity
  name: inline_identity
  nodes:
    wrapper:
      kind: call
      nodes:
        step:
          kind: tool
          tool_id: step
          output: int
      output: ${step.output}
  output: ${wrapper.output}
other: |
  id: inline-identity
  name: inline_identity
  nodes:
    renamed:
      kind: call
      nodes:
        step:
          kind: tool
          tool_id: step
          output: int
      output: ${step.output}
  output: ${renamed.output}
expect:
  fingerprint: different
