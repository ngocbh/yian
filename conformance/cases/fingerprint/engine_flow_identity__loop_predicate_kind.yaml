# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# `while:` and `until:` with the same condition fingerprint differently.
kind: fingerprint
flow: |
  id: loop
  name: loop
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: step
      input:
        n: 0
      while: n < 3
      max: 5
  output: ${node.output}
other: |
  id: loop
  name: loop
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: step
      input:
        n: 0
      until: n < 3
      max: 5
  output: ${node.output}
expect:
  fingerprint: different
