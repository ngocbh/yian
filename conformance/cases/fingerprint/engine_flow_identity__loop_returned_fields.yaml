# tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field
kind: fingerprint
flow: |
  id: loop
  name: loop
  defs:
    step:
      input:
        n: !int
        m: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: step
      input:
        n: 0
        m: 0
      times: 2
  output: ${node.output}
