# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# The def a MAP calls is identity, even when the defs are alike.
kind: fingerprint
flow: |
  id: map
  name: map
  defs:
    first:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
    second:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: map
      over: [1, 2]
      call: first
      input:
        n: ${item}
  output: ${node.output}
other: |
  id: map
  name: map
  defs:
    first:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
    second:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: map
      over: [1, 2]
      call: second
      input:
        n: ${item}
  output: ${node.output}
expect:
  fingerprint: different
