# A memory declaration's config alone changes the fingerprint.
kind: fingerprint
flow: |
  id: memory
  name: memory
  long_term_memory:
    outer:
      type: outer
      config: {limit: 3}
  nodes:
    body:
      kind: tool
      tool_id: body
      output: str
  output: ${body.output}
other: |
  id: memory
  name: memory
  long_term_memory:
    outer:
      type: outer
      config: {limit: 99}
  nodes:
    body:
      kind: tool
      tool_id: body
      output: str
  output: ${body.output}
expect:
  fingerprint: different
