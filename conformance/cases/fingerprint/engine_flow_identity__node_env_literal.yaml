# From tests/engine/test_flow_identity.py::test_env_literals_are_identity.
# A node env literal is identity.
kind: fingerprint
flow: |
  id: literal-env
  name: literal_env
  nodes:
    step:
      kind: tool
      tool_id: step
      env:
        token: "first-value"
  output: ${step.output}
other: |
  id: literal-env
  name: literal_env
  nodes:
    step:
      kind: tool
      tool_id: step
      env:
        token: "second-value"
  output: ${step.output}
expect:
  fingerprint: different
