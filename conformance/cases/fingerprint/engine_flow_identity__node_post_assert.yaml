# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_common_node_field.
# A node assert on its output is identity.
kind: fingerprint
flow: |
  id: common
  name: common
  input:
    x: !int
  nodes:
    body:
      kind: tool
      tool_id: body
      input:
        x: ${input.x}
      output: int
      asserts:
        - output > 0
  output: ${body.output}
other: |
  id: common
  name: common
  input:
    x: !int
  nodes:
    body:
      kind: tool
      tool_id: body
      input:
        x: ${input.x}
      output: int
      asserts:
        - output > 1
  output: ${body.output}
expect:
  fingerprint: different
