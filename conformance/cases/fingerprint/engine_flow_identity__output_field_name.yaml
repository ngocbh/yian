# A flow output field's name is identity.
kind: fingerprint
flow: |
  id: out
  name: out
  nodes:
    a:
      kind: tool
      tool_id: a
      output: int
  output:
    first: ${a.output}
other: |
  id: out
  name: out
  nodes:
    a:
      kind: tool
      tool_id: a
      output: int
  output:
    second: ${a.output}
expect:
  fingerprint: different
