# A sleep's `until` deadline is identity.
kind: fingerprint
flow: |
  id: wait
  name: wait
  nodes:
    node:
      kind: tool
      tool_id: sleep
      input:
        until: "2026-01-01T00:00:00+00:00"
  output: ${node.output}
other: |
  id: wait
  name: wait
  nodes:
    node:
      kind: tool
      tool_id: sleep
      input:
        until: "2026-01-02T00:00:00+00:00"
  output: ${node.output}
expect:
  fingerprint: different
