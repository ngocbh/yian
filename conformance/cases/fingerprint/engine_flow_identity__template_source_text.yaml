# A template's literal text is identity.
kind: fingerprint
flow: |
  id: template-input
  name: template_input
  input:
    t: !str
  nodes:
    step:
      kind: tool
      tool_id: step
      input:
        authorization: "Bearer ${input.t}"
  output: ${step.output}
other: |
  id: template-input
  name: template_input
  input:
    t: !str
  nodes:
    step:
      kind: tool
      tool_id: step
      input:
        authorization: "Basic ${input.t}"
  output: ${step.output}
expect:
  fingerprint: different
