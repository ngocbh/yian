# From tests/engine/test_flow_identity.py::test_flow_fingerprint_covers_each_included_kind_field.
# A TOOL's tool_id is identity.
kind: fingerprint
flow: |
  id: tool
  name: tool
  nodes:
    node:
      kind: tool
      tool_id: first
  output: ${node.output}
other: |
  id: tool
  name: tool
  nodes:
    node:
      kind: tool
      tool_id: second
  output: ${node.output}
expect:
  fingerprint: different
