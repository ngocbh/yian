# A Literal type's tags are identity.
kind: fingerprint
flow: |
  id: typed
  name: typed
  nodes:
    body:
      kind: tool
      tool_id: body
      output: Literal(first)
  output: ${body.output}
other: |
  id: typed
  name: typed
  nodes:
    body:
      kind: tool
      tool_id: body
      output: Literal(second)
  output: ${body.output}
expect:
  fingerprint: different
