# Adding a member to a union type changes the fingerprint.
kind: fingerprint
flow: |
  id: typed
  name: typed
  typedefs:
    Buy:
      action: Literal(buy)
      qty: int
    Sell:
      action: Literal(sell)
      price: float
    Hold:
      action: Literal(hold)
  nodes:
    body:
      kind: tool
      tool_id: body
      output: Union(Buy, Sell)
  output: ${body.output}
other: |
  id: typed
  name: typed
  typedefs:
    Buy:
      action: Literal(buy)
      qty: int
    Sell:
      action: Literal(sell)
      price: float
    Hold:
      action: Literal(hold)
  nodes:
    body:
      kind: tool
      tool_id: body
      output: Union(Buy, Sell, Hold)
  output: ${body.output}
expect:
  fingerprint: different
