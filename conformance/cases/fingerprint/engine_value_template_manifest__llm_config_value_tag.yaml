# From tests/engine/test_value_template_manifest.py::test_a_tag_on_an_llm_config_value_changes_the_fingerprint.
# A type tag on an llm_config value changes the fingerprint.
kind: fingerprint
flow: |
  id: f
  name: f
  input: {m: !str }
  llm_config: {provider: anthropic, anthropic: {max_tokens: 900}}
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config: {model: '${input.m}'}
  output: ${a.output}
other: |
  id: f
  name: f
  input: {m: !str }
  llm_config: {provider: anthropic, anthropic: {max_tokens: 900}}
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config: {model: !str '${input.m}'}
  output: ${a.output}
expect:
  fingerprint: different
