kind: json
# RFC 8785's `values` vector: every float in its output has `.` or `e`, so the log form is JCS.
rules: [canonical, numbers]
write:
  numbers: [333333333.33333329, 1.0e+30, 4.50, 2.0e-3, 1.0e-27]
  string: "€$\x0f\nA'B\"\\\\\"/"
  literals: [null, true, false]
form: log
expect:
  text: '{"literals":[null,true,false],"numbers":[333333333.3333333,1e+30,4.5,0.002,1e-27],"string":"€$\u000f\nA''B\"\\\\\"/"}'
