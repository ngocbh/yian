kind: load
flow: |
  id: cli-memory
  name: cli_memory
  nodes:
    work:
      kind: agent
      long_term_memory: {session: {type: session, config: {recent_turns: -1}}}
      prompt: hello
      output: str
  output: ${work.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'long_term_memory ''session'': session memory config recent_turns must be an integer of at least 0, got -1'
      frames:
      - label: flow.yaml
        range: [6, 23, 6, 77]
