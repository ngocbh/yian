# the rejected value is spelled in the text form: `true` in TS, Python's `True` in python_expect.
kind: load
rules: [messages]
flow: |
  id: shapes
  name: shapes
  nodes:
    a:
      kind: agent
      prompt: Help the user.
      retries: true
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'' (kind=agent): `retries:` must be a non-negative integer, got true'
      frames:
      - label: flow.yaml
        range: [7, 14, 7, 18]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'' (kind=agent): `retries:` must be a non-negative integer, got True'
      frames:
      - label: flow.yaml
        range: [7, 14, 7, 18]
