kind: load
flow: |
  id: gate
  name: gate
  nodes:
    ask:
      kind: human_input
      adaptive_questions:
        prompt: Ask
        mode: plain
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''ask'' (kind=human_input): `adaptive_questions.mode:` was removed: an AGENT with tools runs the tool loop, one without tools makes a single call; delete this line'
      frames:
      - label: flow.yaml
        range: [8, 7, 8, 11]
