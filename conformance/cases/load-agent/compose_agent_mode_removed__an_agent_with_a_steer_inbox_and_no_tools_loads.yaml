# TS-only: an agent with a steer inbox and no tools loads (yian #1025 replaced `steerable:`).
kind: load
python_skip: "steer_inbox reads an Inbox, which Python yian doesn't have (#1025)"
flow: |
  id: removed
  name: removed
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox: ${input.notes}
      output: str
  output: ${chat.output}
expect:
  load: ok
