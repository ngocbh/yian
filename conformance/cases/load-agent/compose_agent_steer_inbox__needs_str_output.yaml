# TS-only: an agent with a steer inbox has text output until interrupts move to the run log (yian #1025).
kind: load
python_skip: "steer_inbox reads an Inbox, which Python yian doesn't have (#1025)"
flow: |
  id: steer
  name: steer
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox: ${input.notes}
      output: int
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''chat'': a steer inbox needs `str` output'
      frames:
      - label: flow.yaml
        range: [9, 18, 9, 32]
