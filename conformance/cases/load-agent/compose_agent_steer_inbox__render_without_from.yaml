# TS-only: a `steer_inbox:` mapping needs `from:` (yian #1025).
kind: load
python_skip: "steer_inbox reads an Inbox, which Python yian doesn't have (#1025)"
flow: |
  id: steer
  name: steer
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox:
        render: |-
          From the owner: ${event}
      output: str
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "`steer_inbox:` needs `from:` naming an Inbox input"
      frames:
      - label: flow.yaml
        range: [9, 5, 9, 16]
