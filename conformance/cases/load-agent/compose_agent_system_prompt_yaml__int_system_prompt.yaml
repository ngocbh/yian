kind: load
flow: |
  id: chat
  name: chat
  input:
    name: !str
    title: !str
    message: !str
  nodes:
    reply:
      kind: agent
      input: {name: "${input.name}", title: "${input.title}", message: "${input.message}"}
      variables:
        tone: !str warm
      system_prompt: 123
      prompt: ${message}
      output: str
  output: ${reply.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''reply'' (kind=agent): `system_prompt:` must be a non-empty string'
      frames:
      - label: flow.yaml
        range: [13, 20, 13, 23]
