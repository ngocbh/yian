kind: load
flow: |
  id: chat
  name: chat
  input:
    name: !str
    title: !str
    message: !str
  nodes:
    reply:
      kind: agent
      input: {name: "${input.name}", title: "${input.title}", message: "${input.message}"}
      variables:
        tone: !str warm
      system_prompt: "You are ${nickname}."
      prompt: ${message}
      output: str
  output: ${reply.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'reply' system_prompt: ${nickname} is not a declared input or variable
      frames:
      - label: flow.yaml
        range: [13, 20, 13, 42]
