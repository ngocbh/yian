# No `message`: it is pydantic's text (with a versioned URL), which yian doesn't write.
kind: load
flow: |
  id: f
  name: f
  nodes:
    a:
      kind: agent
      prompt: hi
      llm_config:
        provider: openai
        openai: {text: {format: {type: text}}}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [8, 7, 10, 1]
