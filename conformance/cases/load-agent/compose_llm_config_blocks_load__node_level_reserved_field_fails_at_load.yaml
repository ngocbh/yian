# No `message`: the case pins the code and the frame, not the schema error's text.
kind: load
flow: |
  id: f
  name: f
  nodes:
    a:
      kind: agent
      prompt: hi
      llm_config:
        provider: openai
        openai: {text: {format: {type: text}}}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [8, 7, 10, 1]
