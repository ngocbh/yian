kind: load
flow: |
  id: f
  name: f
  input: {proj: !str , m: !str , t: !float }
  nodes:
    ask:
      kind: human_input
      input: {proj: '${input.proj}'}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config:
          model: ${input.m}
  output: ${ask.output}
expect:
  load: ok
