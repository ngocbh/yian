kind: load
python_skip: "human_input and wait are removed in TS yian, which uses tool_id: ask, sleep and take (#1025)"
flow: |
  id: f
  name: f
  input: {proj: !str , m: !str , t: !float }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: ${input.proj}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config:
          model: ${input.m}
  output: ${ask.output}
expect:
  load: ok
