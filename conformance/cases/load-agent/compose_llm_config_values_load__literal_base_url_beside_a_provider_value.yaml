kind: load
flow: |
  id: f
  name: f
  input:
    m: !str
    p: !str
    t: !float
    u: !str
    i: !bool
    a: !object
    cfg: !object
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config:
        provider: ${input.p}
        base_url: https://x.openai.azure.com
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'': llm_config.base_url decides where the host''s api_key is sent; pass it with that key in the run''s llm_config, not in a flow file. A flow file sets base_url only beside provider: azure, as the Azure resource endpoint'
      frames:
      - label: flow.yaml
        range: [17, 17, 17, 43]
