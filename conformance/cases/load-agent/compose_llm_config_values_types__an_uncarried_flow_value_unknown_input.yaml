kind: load
flow: |
  id: f
  name: f
  llm_config: {model: '${input.nope}'}
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: m0}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow llm_config.model: reference ${input.nope} points to unknown flow input ''nope'''
      frames:
      - label: flow.yaml
        range: [3, 21, 3, 36]
