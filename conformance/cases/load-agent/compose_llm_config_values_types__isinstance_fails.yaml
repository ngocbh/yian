kind: load
flow: |
  id: f
  name: f
  input:
    s: !str
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: '${isinstance(input.s, str)}'}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''chat'' llm_config.model: isinstance is not supported in an llm_config value; compute the value in a CODE node and read its output'
      frames:
      - label: flow.yaml
        range: [9, 25, 9, 54]
