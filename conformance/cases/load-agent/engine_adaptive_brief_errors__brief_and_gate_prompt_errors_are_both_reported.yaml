kind: load
python_skip: "human_input and wait are removed in TS yian, which uses tool_id: ask, sleep and take (#1025)"
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: ${input.proj}
        prompt: "${a}"
      adaptive_questions:
        prompt: "${b}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' adaptive_questions.prompt: ${b} is not a declared input or variable
          node 'ask' input 'prompt' from: reference ${a} uses unknown namespace 'a'
      frames:
      - label: flow.yaml
        range: [12, 15, 12, 21]
