kind: load
python_skip: "human_input and wait are removed in TS yian, which uses tool_id: ask, sleep and take (#1025)"
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    up:
      kind: code
      output: int
      code: "return 1"
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: "${input.nope}"
      adaptive_questions:
        prompt: "Q ${proj}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' input 'proj' from: reference ${input.nope} points to unknown flow input 'nope'
      frames:
      - label: flow.yaml
        range: [13, 13, 13, 28]
