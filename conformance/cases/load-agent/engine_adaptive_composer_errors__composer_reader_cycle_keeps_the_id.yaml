# TS spells the node list as JSON text (rules: messages); Python's repr in python_expect.
kind: load
rules: [messages]
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    b:
      kind: agent
      input: {a: '${ask__compose.output}'}
      prompt: "x ${a}"
    ask:
      kind: human_input
      input: {proj: '${b.output}'}
      adaptive_questions: {prompt: "Q ${proj}"}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow has a cycle involving ["ask__compose","b"]; flows must be acyclic'
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 4]
      - label: flow.yaml
        range: [9, 3, 9, 6]
      notes:
      - ask__compose depends on b (ask__compose.input.proj)
      - ask__compose is generated from node 'ask'
      - b depends on ask__compose (b.input.a)
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: flow has a cycle involving ['ask__compose', 'b']; flows must be acyclic
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 4]
      - label: flow.yaml
        range: [9, 3, 9, 6]
      notes:
      - ask__compose depends on b (ask__compose.input.proj)
      - ask__compose is generated from node 'ask'
      - b depends on ask__compose (b.input.a)
