# No `message`: the case pins the code and the frame, not the schema error's text.
kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: ${input.proj}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config: {temparature: 1}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [12, 19, 12, 35]
