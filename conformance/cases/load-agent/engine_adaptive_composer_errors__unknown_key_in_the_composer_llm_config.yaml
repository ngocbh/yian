# No `message`: it is pydantic's text (with a versioned URL), which yian doesn't write.
kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      input: {proj: '${input.proj}'}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config: {temparature: 1}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [10, 19, 10, 35]
