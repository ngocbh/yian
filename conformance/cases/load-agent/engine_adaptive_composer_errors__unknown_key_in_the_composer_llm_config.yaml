# No `message`: it is pydantic's text (with a versioned URL), which yian doesn't write.
kind: load
python_skip: "human_input and wait are removed in TS yian, which uses tool_id: ask, sleep and take (#1025)"
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: ${input.proj}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config: {temparature: 1}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [12, 19, 12, 35]
