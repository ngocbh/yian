kind: load
flow: |
  id: root
  name: root
  input:
    x: !str
  nodes:
    a: {kind: call, call: my.lib, input: {x: "${input.x}"}}
  output: {y: "${input.x}"}
  uses:
    my.lib: lib
files:
  lib.yaml: |
    id: lib
    name: lib
    long_term_memory: {notes: episodic}
    input:
      x: !str
    nodes:
      a: {kind: code, code: ./fixtures/compose_codefns.ts:echo_x, input: {x: "${input.x}"}, output: str}
    output: {y: "${a.output}"}
python_files:
  lib.yaml: |
    id: lib
    name: lib
    long_term_memory: {notes: episodic}
    input:
      x: !str
    nodes:
      a: {kind: code, code: tests.engine._compose_codefns:echo_x, input: {x: "${input.x}"}, output: str}
    output: {y: "${a.output}"}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'memory ''my.lib.notes'': uses: alias ''my.lib'' must match [A-Za-z_][A-Za-z0-9_-]* to scope memories'
      frames:
      - label: lib.yaml
        range: [3, 20, 3, 25]
