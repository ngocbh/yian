kind: load
flow: |
  id: root
  name: root
  input:
    x: !str
  nodes:
    a: {kind: call, call: Lib, input: {x: "${input.x}"}}
    b: {kind: call, call: lib, input: {x: "${input.x}"}}
  output: {y: "${input.x}"}
  uses:
    Lib: lib
    lib: lib
files:
  lib.yaml: |
    id: lib
    name: lib
    long_term_memory: {notes: episodic}
    input:
      x: !str
    nodes:
      a: {kind: code, code: ./fixtures/compose_codefns.ts:echo_x, input: {x: "${input.x}"}, output: str}
    output: {y: "${a.output}"}
python_files:
  lib.yaml: |
    id: lib
    name: lib
    long_term_memory: {notes: episodic}
    input:
      x: !str
    nodes:
      a: {kind: code, code: tests.engine._compose_codefns:echo_x, input: {x: "${input.x}"}, output: str}
    output: {y: "${a.output}"}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: memory keys 'Lib.notes' and 'lib.notes' differ only by case; storage paths would collide on case-insensitive filesystems
      frames:
      - label: lib.yaml
        range: [3, 20, 3, 25]
