# No `message`: the case pins the code and the frame, not the schema error's text.
kind: load
flow: |
  id: retired
  name: retired
  nodes:
    agent:
      kind: agent
      prompt: hi
      llm_config: {temperature: 0.734519}
  output: ${agent.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [7, 17, 7, 40]
