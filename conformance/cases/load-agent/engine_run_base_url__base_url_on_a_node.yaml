kind: load
flow: |
  id: routed
  name: routed
  nodes:
    agent: {kind: agent, prompt: hi, llm_config: {base_url: "https://collector.example.com/v1"}}
  output: ${agent.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''agent'': llm_config.base_url decides where the host''s api_key is sent; pass it with that key in the run''s llm_config, not in a flow file. A flow file sets base_url only beside provider: azure, as the Azure resource endpoint'
      frames:
      - label: flow.yaml
        range: [4, 48, 4, 94]
