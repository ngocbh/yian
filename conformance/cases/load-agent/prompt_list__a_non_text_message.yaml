# A prompt list message's text must be text; `user: 5` is refused at the value.
kind: load
flow: |
  id: chat
  name: chat
  typedefs:
    Msg:
      role: Literal(user, assistant)
      text: str
  input:
    history: !list(Msg)
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        history: ${input.history}
        message: ${input.message}
      output: str
      system_prompt: You are a helpful conversational assistant.
      prompt:
        - ${history}
        - user: 5
  output: ${reply.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'reply' (kind=agent): `prompt[1].user:` must be text, but YAML read it as an integer; put it in quotes"
      frames:
      - label: flow.yaml
        range: [20, 15, 20, 16]
