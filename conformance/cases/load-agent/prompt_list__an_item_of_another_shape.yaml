# TS-only: a prompt list item is `${name}` or `user:`/`assistant:` text; plain text is refused at the item.
kind: load
python_skip: "the prompt: list style is TS-only (#1002)"
flow: |
  id: chat
  name: chat
  typedefs:
    Msg:
      role: Literal(user, assistant)
      text: str
  input:
    history: !list(Msg)
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        history: ${input.history}
        message: ${input.message}
      output: str
      system_prompt: You are a helpful conversational assistant.
      prompt:
        - ${history}
        - ${message} please
  output: ${reply.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'reply' (kind=agent): a prompt list item is `${name}` or `user:`/`assistant:` text"
      frames:
      - label: flow.yaml
        range: [20, 9, 20, 26]
