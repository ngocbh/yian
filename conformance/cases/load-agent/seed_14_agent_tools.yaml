# From tests/seeds/14-agent-tools.yaml.
# An AGENT with a `tools:` grant (`ask_user` among them), an `llm_config:` with a provider block, and a record output loads.
kind: load
flow: |
  # 14 — AGENT knobs: tools, llm_config.
  #
  # An AGENT is more than a prompt — granted `tools` (TOOL_REGISTRY keys, vs a TOOL
  # *node* which is one direct call), it runs a tool loop and invokes them inside it.
  # The host-installed `ask_user` is an ordinary authored tool that blocks inside the
  # live loop. Shows: tools / llm_config and a structured (object) agent output.

  id: agent-tools
  name: agent_tools
  description: An AGENT running a tool loop with ordinary tools plus blocking ask_user.

  input:
    topic: !str

  nodes:
    reviewer:
      kind: agent
      tools: [get_web_data, web_search, ask_user]   # all explicit TOOL_REGISTRY grants
      llm_config:
        provider: anthropic
        model: claude-opus-4-8
        anthropic:
          temperature: 0.3
      input:
        topic: ${input.topic}
      output:                     # structured agent output (one object)
        claim: str
        confidence: float
      prompt: |-
        Research ${topic} with the available tools. If a key fact is ambiguous, ask
        the user. Return a neutral {claim, confidence in [0, 1]}. No recommendations.

  output:
    claim:     ${reviewer.output.claim}
    confidence: ${reviewer.output.confidence}
expect:
  load: ok
