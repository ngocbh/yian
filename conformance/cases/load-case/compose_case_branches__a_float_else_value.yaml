kind: load
flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: reply
      else: 1.5
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' else: a branch names a node or calls a flow; put the value in its own entry in `nodes:` and name it: `route_else: !float 1.5` and `else: route_else`'
      frames:
      - label: flow.yaml
        range: [12, 11, 12, 14]
