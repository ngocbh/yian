kind: load
# The template text is quoted as written, by reprText.
flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: {a: "${input.cmd"}
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' then: unbalanced ''${'' in template ''${input.cmd'''
      frames:
      - label: flow.yaml
        range: [11, 15, 11, 33]
