kind: load
flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: "call(take, x=${input.cmd})"
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
python_flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: "call(take, x=${input.cmd})"
      else: reply
    reply:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' then: a quoted `call(...)` is text, so it can''t hold `${...}` here; drop the quotes to call the flow, or reword the text'
      frames:
      - label: flow.yaml
        range: [11, 15, 11, 43]
