kind: load
flow: |
  id: f
  name: f
  typedefs:
    Buy:
      side: str
  input:
    cmd: !str
    n: !int
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      output: str
      cases:
        - when: a
          then: !str reply
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
