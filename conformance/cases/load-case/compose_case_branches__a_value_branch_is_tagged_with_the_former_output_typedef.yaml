kind: load
flow: |
  id: f
  name: f
  typedefs:
    Reply:
      reply: str
      exited: bool
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      output: Reply
      cases:
        - when: a
          then:
            reply: ok
            exited: true
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' then: a branch names a node or calls a flow; put the value in its own entry in `nodes:` and name it: `route_then_0: !Reply {reply: ok, exited: true}` and `then: route_then_0`'
      frames:
      - label: flow.yaml
        range: [17, 11, 19, 5]
