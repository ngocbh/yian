kind: load
flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: reply
      else: yes
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
