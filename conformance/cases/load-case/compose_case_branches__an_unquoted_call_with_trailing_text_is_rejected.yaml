kind: load
# The trailing text is quoted as written, the Python-repr way (TS reprText): shared.
flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: call(child, x=1) | x
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
python_flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: call(child, x=1) | x
      else: reply
    reply:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' then: a branch target must be a node id or a single call: text follows the closing `)`: ''| x''; a call(...) must be the whole value. For the text, add a value entry and name it: `route_then_0: !str "call(child, x=1) | x"`'
      frames:
      - label: flow.yaml
        range: [11, 15, 11, 35]
