kind: load
flow: |
  id: f
  name: f
  typedefs:
    Reply:
      reply: str
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      output: int
      cases:
        - when: a
          then: "3"
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
  output: ${route.output}
