expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' then: a branch names a node or calls a flow; put the value in its own entry in `nodes:` and name it: `route_then_0: !str "3"` and `then: route_then_0`'
      frames:
