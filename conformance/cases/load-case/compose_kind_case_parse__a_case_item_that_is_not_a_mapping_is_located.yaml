kind: load
# TS spells the text value JSON-quoted (rules: messages); Python's repr in python_expect.
rules: [messages]
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    gate:
      kind: case
      cases: [done]
    done:
      kind: code
      code: return 1
      output: int
  output: ${done.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''gate'': `cases[0]` must be a {when:, then:} mapping (got "done")'
      frames:
      - label: flow.yaml
        range: [8, 13, 8, 17]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''gate'': `cases[0]` must be a {when:, then:} mapping (got ''done'')'
      frames:
      - label: flow.yaml
        range: [8, 13, 8, 17]
