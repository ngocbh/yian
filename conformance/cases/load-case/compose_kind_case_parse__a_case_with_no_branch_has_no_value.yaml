kind: load
flow: |
  id: malformed-case
  name: malformed-case
  nodes:
    gate:
      kind: case
      cases: [{when: 1}]
  output: ${gate.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow outputs: ${gate.output} — case ''gate'' has no resolvable branch value (a case needs a `then:` or `else:`, and its targets must not form a cycle)'
      frames:
      - label: flow.yaml
        range: [7, 9, 7, 23]
