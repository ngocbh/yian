kind: load
flow: "\nid: nested_skips\nname: nested_skips\ninput:\n  approve: !bool\nnodes:\n  gate:\n    kind: case\n    cases:\n      - when: ${input.approve}\n        then: order\n    else: rejected\n  order:\n    kind: code\n    output: str\n    code: |\n      return \"filled\"\n  rejected:\n    kind: code\n    output: str\n    code: |\n      return \"no\"\n  c:\n    kind: code\n    input:\n      x: \n        a: ok\n        b: ${order.output + 1}\n    code: |\n      return inputs[\"x\"]\noutput: ${c.output}\n"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''c'' input ''x'': ${order.output + 1} does arithmetic on order.output, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output :- <default>)'
      frames:
      - label: flow.yaml
        range: [28, 12, 28, 31]
