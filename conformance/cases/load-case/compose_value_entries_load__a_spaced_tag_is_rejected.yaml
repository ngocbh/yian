kind: load
flow: |
  id: f
  name: f
  input:
    t: !str
  nodes:
    s:
      kind: code
      output: float
      code: |
        return 0.5
    x: !int (1..3) 2
  output: ${x.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''x'': a YAML tag ends at the first space; write `!int(1..3)` without spaces'
      frames:
      - label: flow.yaml
        range: [11, 6, 11, 19]
