# TS writes the missing-field list in the text form (rules: messages); Python's wording in python_expect.
kind: load
flow: |
  id: f
  name: f
  typedefs:
    Buy:
      action: Literal(buy)
      conviction: float
  input:
    t: !str
  nodes:
    s:
      kind: code
      output: float
      code: |
        return 0.5
    x: !Buy {conviction: 1}
  output: ${x.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''x'': the value is not a valid Buy: record missing required fields: ["action"] (at `x.action`)'
      frames:
      - label: flow.yaml
        range: [15, 6, 15, 26]
