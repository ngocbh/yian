kind: load
flow: |
  id: f
  name: f
  input:
    t: !str
  nodes:
    s:
      kind: code
      output: float
      code: |
        return 0.5
    x: !int
  output: ${x.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'value entry ''x'' needs a value after its tag, e.g. `x: !int ...`'
      frames:
      - label: flow.yaml
        range: [11, 6, 11, 10]
