kind: load
# `.inf` is a float value in TS (design 3.2, #554), so the entry loads; Python refuses it.
rules: [infinity]
flow: |
  id: f
  name: f
  input:
    t: !str
  nodes:
    s:
      kind: code
      output: float
      code: |
        return 0.5
    x: !float .inf
  output: ${x.output}
expect:
  load: ok
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''x'': numbers must be finite (got .inf)'
      frames:
      - label: flow.yaml
        range: [11, 6, 11, 17]
