kind: load
# The keyword and the call text are quoted as written, the Python-repr way (TS reprText): shared.
flow: |2

  id: bad
  name: bad
  input:
    score: !float

  defs:
    take:
      input:
        stance: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:took
          input:
            stance: ${input.stance}
          output: str
      output: ${x.output}

  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: call(take, stance="a", stance="b")
      else: nope
    nope:
      kind: code
      code: ./fixtures/compose_codefns.ts:took
      input:
        stance: x
      output: str
  output: ${gate.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''gate'' then: a branch target must be a node id or a single call: call(take, ...) passes keyword ''stance'' more than once. For the text, add a value entry and name it: `gate_then_0: !str ''call(take, stance="a", stance="b")''`'
      frames:
      - label: flow.yaml
        range: [25, 15, 25, 49]
