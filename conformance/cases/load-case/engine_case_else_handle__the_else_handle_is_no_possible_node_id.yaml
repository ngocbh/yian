kind: load
# The frame is the node's flow mapping (structure, not CODE text), and the quotes are yian's own: shared.
flow: |2

  id: f
  name: f
  nodes:
    "#else": {kind: code, code: "return 1", output: int}
  output: ${#else.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: node id '#else' uses a reserved separator ('#' and '/' are reserved for runtime graph expansion; '.' is reserved for reference paths)
      frames:
      - label: flow.yaml
        range: [5, 12, 5, 55]
