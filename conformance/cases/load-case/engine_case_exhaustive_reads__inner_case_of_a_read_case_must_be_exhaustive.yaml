kind: load
flow: |
  id: f
  name: f
  input:
    x: !str
  nodes:
    gate:
      kind: case
      on: ${input.x}
      cases:
        - when: a
          then: pa
      else: inner
    pa:
      kind: code
      code: |
        return "A"
      output: str
    pb:
      kind: code
      code: |
        return "B"
      output: str
    inner:
      kind: case
      on: ${input.x}
      cases:
        - when: b
          then: pb
  output: ${gate.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''inner'' produces a value, so it must be exhaustive: add an `else:` (on: ${input.x} is str, not a Literal or bool)'
      frames:
      - label: flow.yaml
        range: [23, 3, 23, 8]
