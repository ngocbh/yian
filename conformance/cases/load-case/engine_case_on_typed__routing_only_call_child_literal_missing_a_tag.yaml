kind: load
# TS spells the uncovered tags as JSON text (rules: messages); Python's repr in python_expect.
rules: [messages]
flow: |
  id: f
  name: f
  typedefs:
    K: Literal(a, b)
  input:
    k: !K
  defs:
    child:
      input:
        k: !K
      nodes:
        route:
          kind: case
          on: ${input.k}
          cases:
            - when: a
              then: one
        one:
          kind: code
          code: |
            return "one"
          output: str
      output: ${one.output}
  nodes:
    c:
      kind: call
      call: child
      input:
        k: ${input.k}
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''child'': case node ''route'' on ${input.k}: non-exhaustive — enum tag(s) ["b"] not covered by a case `when:` or an `else:`'
      frames:
      - label: flow.yaml
        range: [9, 5, 24, 1]
        note: definition 'child'
      - label: flow.yaml
        range: [12, 7, 12, 12]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''child'': case node ''route'' on ${input.k}: non-exhaustive — enum tag(s) [''b''] not covered by a case `when:` or an `else:`'
      frames:
      - label: flow.yaml
        range: [9, 5, 24, 1]
        note: definition 'child'
      - label: flow.yaml
        range: [12, 7, 12, 12]
