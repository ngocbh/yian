kind: load
flow: "id: f\nname: f\ninput:\n  approve: !bool\nnodes:\n  gate:\n    kind: case\n    cases:\n      - when: ${input.approve}\n        then: order\n    else: rejected\n  order:\n    kind: code\n    output: \n      qty: int\n    code: |\n      return {\"qty\": 2}\n  rejected:\n    kind: code\n    output: str\n    code: |\n      return \"no\"\n  route:\n    kind: case\n    on: ${order.output.qty + 1}\n    cases:\n      - when: 3\n        then: three\n    else: other\n  three:\n    kind: code\n    output: str\n    code: |\n      return \"3\"\n  other:\n    kind: code\n    output: str\n    code: |\n      return \"?\"\noutput:\n  v: ${three.output | other.output}\n"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''route'' on: ${order.output.qty + 1} does arithmetic on order.output.qty, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.qty :- <default>)'
      frames:
      - label: flow.yaml
        range: [25, 9, 25, 32]
