kind: load
rules: [null-field-read]
flow: |
  id: f
  name: f
  input:
    approve: !bool
  defs:
    child:
      input:
        n: !int
      nodes:
        k:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs['n']
      output: ${k.output}
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        items: list(int)
        s: str
      code: |
        return {"items": [1], "s": "2020"}
    rejected:
      kind: code
      output: str
      code: |
        return "no"
    m:
      kind: map
      over: ${order.output.items + [3]}
      call: child
      input:
        n: ${item}
  output:
    r: ${rejected.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'm' map over: ${order.output.items} reads field 'items' of order.output, which may be null (node 'order' may be skipped while 'm' runs); write (order.output?.items :- <default>)"
        frames:
          - label: flow.yaml
            range: [39, 11, 39, 38]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''m'' map over: ${order.output.items + [3]} does arithmetic on order.output.items, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.items :- <default>)'
      frames:
      - label: flow.yaml
        range: [39, 11, 39, 38]
