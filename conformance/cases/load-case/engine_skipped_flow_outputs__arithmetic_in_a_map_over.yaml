kind: load
flow: "id: f\nname: f\ninput:\n  approve: !bool\ndefs:\n  child:\n    input:\n      n: !int\n    nodes:\n      k:\n        kind: code\n        input:\n          n: ${input.n}\n        output: int\n        code: |\n          return inputs['n']\n    output: ${k.output}\nnodes:\n  gate:\n    kind: case\n    cases:\n      - when: ${input.approve}\n        then: order\n    else: rejected\n  order:\n    kind: code\n    output: \n      items: list(int)\n      s: str\n    code: |\n      return {\"items\": [1], \"s\": \"2020\"}\n  rejected:\n    kind: code\n    output: str\n    code: |\n      return \"no\"\n  m:\n    kind: map\n    over: ${order.output.items + [3]}\n    call: child\n    input:\n      n: ${item}\noutput:\n  r: ${rejected.output}\n"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''m'' map over: ${order.output.items + [3]} does arithmetic on order.output.items, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.items :- <default>)'
      frames:
      - label: flow.yaml
        range: [39, 11, 39, 38]
