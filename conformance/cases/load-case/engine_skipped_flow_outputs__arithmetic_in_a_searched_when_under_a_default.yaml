kind: load
rules: [null-field-read]
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: a
      else: rejected
    a:
      kind: code
      output:
        n: int
      code: |
        return {"n": 2}
    rejected:
      kind: code
      output: str
      code: |
        return "no"
    gate2:
      kind: case
      cases:
        - when: "((a.output.n + 1) :- 0) > 1"
          then: hot
      else: cold
    hot:
      kind: code
      output: str
      code: |
        return "hot"
    cold:
      kind: code
      output: str
      code: |
        return "cold"
  output:
    v: ${hot.output | cold.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'gate2' cases[0].when: ((a.output.n + 1) :- 0) > 1 does arithmetic on a.output.n, which is null when node 'a' is skipped; give it a default with :-, e.g. (a.output?.n :- <default>)"
        frames:
          - label: flow.yaml
            range: [26, 15, 26, 44]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''gate2'' cases[0].when: ((a.output.n + 1) :- 0) > 1 does arithmetic on a.output.n, which is null when node ''a'' is skipped; give it a default with :-, e.g. (a.output.n :- <default>)'
      frames:
      - label: flow.yaml
        range: [26, 15, 26, 44]
