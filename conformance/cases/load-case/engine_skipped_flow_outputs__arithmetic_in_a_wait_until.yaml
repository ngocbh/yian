kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        items: list(int)
        s: str
      code: |
        return {"items": [1], "s": "2020"}
    rejected:
      kind: code
      output: str
      code: |
        return "no"
    w:
      kind: wait
      until: ${order.output.s + '-01-01'}
  output:
    r: ${rejected.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''w'' wait until: ${order.output.s + ''-01-01''} does arithmetic on order.output.s, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.s :- <default>)'
      frames:
      - label: flow.yaml
        range: [26, 12, 26, 40]
