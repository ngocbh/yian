kind: load
flow: "id: f\nname: f\ninput:\n  approve: !bool\nnodes:\n  gate:\n    kind: case\n    cases:\n      - when: ${input.approve}\n        then: order\n    else: rejected\n  order:\n    kind: code\n    output: \n      items: list(int)\n      s: str\n    code: |\n      return {\"items\": [1], \"s\": \"2020\"}\n  rejected:\n    kind: code\n    output: str\n    code: |\n      return \"no\"\n  w:\n    kind: wait\n    until: ${order.output.s + '-01-01'}\noutput:\n  r: ${rejected.output}\n"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''w'' wait until: ${order.output.s + ''-01-01''} does arithmetic on order.output.s, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.s :- <default>)'
      frames:
      - label: flow.yaml
        range: [26, 12, 26, 40]
