kind: load
rules: [null-field-read]
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        qty: int
      code: |
        return {"qty": 2}
    rejected:
      kind: code
      output: str
      code: |
        return "no"
  output:
    q: ${order.output.qty + 1}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "output 'q': ${order.output.qty} reads field 'qty' of order.output, which may be null (node 'order' may be skipped); write (order.output?.qty :- <default>)"
        frames:
          - label: flow.yaml
            range: [24, 6, 24, 29]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'output ''q'': ${order.output.qty + 1} does arithmetic on order.output.qty, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.qty :- <default>)'
      frames:
      - label: flow.yaml
        range: [24, 6, 24, 29]
