kind: load
flow: "id: f\nname: f\ninput:\n  approve: !bool\nnodes:\n  gate:\n    kind: case\n    cases:\n      - when: ${input.approve}\n        then: order\n    else: rejected\n  order:\n    kind: code\n    output: \n      qty: int\n    code: |\n      return {\"qty\": 2}\n  rejected:\n    kind: code\n    output: str\n    code: |\n      return \"no\"\noutput:\n  q: ${order.output.qty + 1}\n"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'output ''q'': ${order.output.qty + 1} does arithmetic on order.output.qty, which is null when node ''order'' is skipped; give it a default with :-, e.g. (order.output.qty :- <default>)'
      frames:
      - label: flow.yaml
        range: [24, 6, 24, 29]
