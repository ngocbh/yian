expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''repeat'': the body returns ''note'' as Optional(str), but the carried field is typed str from its seed; declare the seed''s type: `note: !Optional(str) "start"`'
      frames:
      - label: flow.yaml
        range: [11, 13, 11, 20]
