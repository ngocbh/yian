kind: load
flow: |
  id: f
  name: f
  input:
    flip: !bool
  nodes:
    repeat:
      kind: loop
      times: 1
      input:
        n: 0
        note: "start"
        flip: ${input.flip}
      nodes:
          gate:
            kind: case
            cases:
              - when: ${input.flip}
                then: mk
          mk:
            kind: code
            output: str
            code: |
              return "made"
          bump:
            kind: code
            input:
              n: ${input.n}
            output: int
            code: |
              return inputs["n"] + 1n
      output:
        n: ${bump.output}
        note: ${mk.output}
  output: ${repeat.output}
