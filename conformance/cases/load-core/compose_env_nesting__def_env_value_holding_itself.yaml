kind: load
flow: |
  id: f
  name: f
  defs:
    d:
      env:
        K: &a [*a]
      nodes:
        keep:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: x
      output: ${keep.output}
