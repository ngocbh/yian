kind: load
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
    Rec3: {a: str, b: Optional(str)}
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)'}
    Order: Union(Buy, Sell)
  input:
    s: !str
    r: !Rec
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Rec
      code: "return ({a: \"x\"})"
    d:
      kind: code
      input:
        s: ${input.s}
      output: Order
      code: "return null"
  output: ${step.output}
  asserts:
    - "d.output != null and not isinstance(d.output, Buy) and d.output.qty > 0"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'assert ''d.output != null and not isinstance(d.output, Buy) and d.output.qty > 0'': reference ${d.output.qty} reads field ''qty'', which Sell doesn''t have; d.output is Sell here, by the checks before this read'
      frames:
      - label: flow.yaml
        range: [27, 5, 27, 78]
