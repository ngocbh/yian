# TS spells the compared value and the close tag as JSON text (rules: messages); Python's repr in python_expect.
kind: load
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
    Rec3: {a: str, b: Optional(str)}
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)'}
    Order: Union(Buy, Sell)
  input:
    s: !str
    r: !Rec
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Rec
      code: "return ({a: \"x\"})"
    d:
      kind: code
      input:
        s: ${input.s}
      output: Order
      code: "return null"
    c:
      kind: code
      input:
        v: ${d.output}
      output: str
      code: return 'x'
      asserts:
        - "v.action == 'byu' and v.zz > 0"
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has invalid node asserts:
          node 'c' assert: `v.action == "byu"` compares v.action with "byu", which is not one of its tags (buy, sell); did you mean "buy"?
      frames:
      - label: flow.yaml
        range: [32, 9, 32, 41]
