kind: load
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: str
      code: "return null"
  output:
    o: ${step.output.order}
python_flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: str
      code: return None
  output:
    o: ${step.output.order}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          flow output from: reference ${step.output.order} reads field 'order' on type str, which has no fields
      frames:
      - label: flow.yaml
        range: [13, 3, 14, 1]
