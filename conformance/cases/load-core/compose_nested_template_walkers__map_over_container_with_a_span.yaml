kind: load
flow: |

  id: m
  name: m
  defs:
    echo:
      input:
        v: !int
      nodes: {}
      output: ${input.v}
  nodes:
    a:
      kind: code
      code: return 1
    m:
      kind: map
      call: echo
      over:
        x: ${a.output}
      input:
        v: ${item}
  output: ${m.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'map node ''m'' over: a value holding ${...} can''t be a list or mapping; write the list as an expression, e.g. `${[a.output, b.output]}`'
      frames:
      - label: flow.yaml
        range: [18, 7, 19, 5]
