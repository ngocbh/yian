kind: load
flow: |
  id: input-shape
  name: input_shape
  input:
    z: !int
  defs:
    step:
      input:
        n: !int
      nodes:
        b:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
          code: |
            return {"n": inputs["n"] + 1}
      output: ${b.output}
  nodes:
    seed:
      kind: code
      input:
        z: ${input.z}
      output:
        n: int
      code: |
        return {"n": inputs["z"]}
    under_test:
      kind: agent
      prompt: hi
      input: ${seed.output}
