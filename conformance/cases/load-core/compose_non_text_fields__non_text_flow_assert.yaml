kind: load
flow: |
  id: f
  name: f
  nodes:
    a:
      kind: code
      output: str
      code: "return 'x'"
  output: ${a.output}
  asserts:
    - "true"
    - true
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '`asserts[1]:` must be text, but YAML read it as a boolean; put it in quotes'
      frames:
      - label: flow.yaml
        range: [11, 5, 11, 9]
