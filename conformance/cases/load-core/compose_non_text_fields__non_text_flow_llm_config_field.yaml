kind: load
flow: |
  id: f
  name: f
  llm_config: {model: 5}
  nodes:
    a:
      kind: agent
      prompt: hi
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow: llm_config: `model:` must be text, but YAML read it as an integer; put it in quotes'
      frames:
      - label: flow.yaml
        range: [3, 13, 3, 23]
