kind: load
flow: |
  id: f
  name: f
  nodes:
    a:
      kind: code
      node_name: {x: 1}
      output: str
      code: "return 'x'"
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'' (kind=code): `node_name:` must be text, but YAML read it as a mapping; put it in quotes'
      frames:
      - label: flow.yaml
        range: [6, 16, 6, 22]
