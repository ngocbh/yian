kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      adaptive_questions:
        prompt: true
      input: {proj: '${input.proj}'}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''ask'' (kind=human_input): `adaptive_questions.prompt:` must be text, but YAML read it as a boolean; put it in quotes'
      frames:
      - label: flow.yaml
        range: [8, 15, 8, 19]
