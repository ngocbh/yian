kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      prompt: [a, b]
      input: {proj: '${input.proj}'}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''ask'' (kind=human_input): `prompt:` must be text, but YAML read it as a list; put it in quotes'
      frames:
      - label: flow.yaml
        range: [7, 13, 7, 19]
