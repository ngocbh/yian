kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "5"
        proj: ${input.proj}
  output: ${ask.output}
python_flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      prompt: "5"
      input: {proj: '${input.proj}'}
  output: ${ask.output}
expect:
  load: ok
