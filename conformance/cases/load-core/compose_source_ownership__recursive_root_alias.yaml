# The harvest tagged this `code`, but the frame is flow structure, the same in both languages.
kind: load
flow: |
  &root
  id: recursive-boundary
  name: recursive_boundary
  input: *root
  nodes:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input: {value: hello}
      output: str
  output: ${echo.output}
python_flow: |
  &root
  id: recursive-boundary
  name: recursive_boundary
  input: *root
  nodes:
    echo:
      kind: code
      code: tests.engine._compose_codefns:echo
      input: {value: hello}
      output: str
  output: ${echo.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: cannot descend through a recursive alias occurrence
      frames:
      - label: flow.yaml
        range: [1, 1, 12, 1]
