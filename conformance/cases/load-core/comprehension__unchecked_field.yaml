kind: load
rules: [null-field-read]
python_skip: "TS-only: list comprehensions (#1086)"
# Reads through a variable are checked at load: m.txt on a Msg is a load error.
flow: |
  id: p
  name: p
  typedefs:
    Msg: {role: str, text: str}
  input:
    ms: !list(Msg)
  nodes:
    use:
      kind: code
      input:
        v: ${[m.txt for m in input.ms]}
      code: "return inputs['v']"
  output: ${use.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'use' input 'v': reference ${m.txt} reads unknown field 'txt' on record"
        frames:
          - label: flow.yaml
            range: [11, 10, 11, 38]
