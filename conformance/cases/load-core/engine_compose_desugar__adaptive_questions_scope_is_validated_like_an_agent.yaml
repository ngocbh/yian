kind: load
flow: |2

  id: f
  name: f
  input:
    ctx: !str
  nodes:
    ask:
      kind: human_input
      input: {ctx: "${input.ctx}"}
      prompt: "Help me with ${ctx}."
      adaptive_questions:
        prompt: "Design 1-3 questions with options for: ${undeclared}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' adaptive_questions.prompt: ${undeclared} is not a declared input or variable
      frames:
      - label: flow.yaml
        range: [12, 15, 12, 69]
