# The message spells the name list as JSON text.
kind: load
flow: |2

  id: l
  name: l
  defs:
    empty:
      nodes:
        step:
          kind: code
          output: int
          code: |
            return 1
      output: {}
  nodes:
    lp:
      kind: loop
      times: 2
      input:
        count: 0
      nodes:
        inner:
          kind: call
          call: empty
      output: ${inner.output}
  output: ${lp.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''lp'': body inline body of node ''lp'' must return a record with at least one carried field (a subset of the carried record ["count"]); write `output: {field: ...}` or a whole reference to a node with a record output'
      frames:
      - label: flow.yaml
        range: [14, 3, 14, 5]
