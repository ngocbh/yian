# TS spells the name list as JSON text (rules: messages); Python's repr in python_expect.
kind: load
rules: [messages]
flow: |2

  id: l
  name: l
  nodes:
    lp:
      kind: loop
      times: 2
      input:
        count: 0
      nodes:
        bump:
          kind: code
          output: int
          code: |
            return 1
      output: {}
  output: ${lp.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''lp'': body inline body of node ''lp'' must return a record with at least one carried field (a subset of the carried record ["count"]); write `output: {field: ...}` or a whole reference to a node with a record output'
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 5]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''lp'': body inline body of node ''lp'' must return a record with at least one carried field (a subset of the carried record [''count'']); write `output: {field: ...}` or a whole reference to a node with a record output'
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 5]
