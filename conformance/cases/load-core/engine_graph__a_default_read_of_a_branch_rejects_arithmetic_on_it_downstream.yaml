      input:
        s: ${input.s}
      output: Decision
      code: return None
    router:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: a
      else: e
    a:
      kind: code
      input:
        s: ${input.s}
      output: int
      code: return 1
    e:
      kind: code
      code: return 1
    gate:
      kind: case
      cases:
        - when: "(a.output :- 0) >= 1"
          then: hot
      else: cold
    hot:
      kind: code
      input:
        v: ${a.output + 1}
      code: return 1
    cold:
      kind: code
