kind: load
flow: |2

  id: bg
  name: bg
  typedefs:
    Buy: {action: 'Literal(buy)', limit: float}
    Sell: {action: 'Literal(sell)'}
    Decision: Union(Buy, Sell)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: Decision
      code: "return null"
    router:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: a
      else: e
    a:
      kind: code
      input:
        s: ${input.s}
      output: int
      code: return 1
    e:
      kind: code
      code: return 1
    gate:
      kind: case
      cases:
        - when: "(a.output :- 0) >= 1"
          then: hot
      else: cold
    hot:
      kind: code
      input:
        v: ${a.output + 1}
      code: return 1
    cold:
      kind: code
      code: return 1
  output: ${hot.output | cold.output | e.output}
python_flow: |2

  id: bg
  name: bg
  typedefs:
    Buy: {action: 'Literal(buy)', limit: float}
    Sell: {action: 'Literal(sell)'}
