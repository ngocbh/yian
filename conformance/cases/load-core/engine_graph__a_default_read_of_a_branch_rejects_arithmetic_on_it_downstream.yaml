expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''hot'' input ''v'': ${a.output + 1} does arithmetic on a.output, which is null when node ''a'' is skipped; give it a default with :-, e.g. (a.output :- <default>)'
      frames:
      - label: flow.yaml
        range: [42, 10, 42, 25]
