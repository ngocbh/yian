kind: load
flow: |2

  id: bg
  name: bg
  typedefs:
    Buy: {action: 'Literal(buy)', limit: float}
    Sell: {action: 'Literal(sell)'}
    Decision: Union(Buy, Sell)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: Decision
      code: "return null"
    router:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: a
      else: e
    a:
      kind: code
      input:
        s: ${input.s}
      output: int
      code: return 1
    e:
      kind: code
      code: return 1
    gate:
      kind: case
      cases:
        - when: "isinstance(d.output, Buy) and (d.output.limit :- 0) > 1"
          then: hot
      else: cold
    hot:
      kind: code
      input:
        v: ${input.s}
      code: return 1
    cold:
      kind: code
      code: return 1
  output: ${hot.output | cold.output | e.output}
expect:
  load: ok
