kind: load
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: [[[[1]]]]
      output: str
  output: ${use.output}
env:
  YIAN_MAX_VALUE_NESTING: '3'
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''use'' input ''topic'' at [0][0][0]: value nests deeper than 3 levels, the limit for a yian value (each record and list is a level)'
      frames:
      - label: flow.yaml
        range: [8, 14, 8, 23]
