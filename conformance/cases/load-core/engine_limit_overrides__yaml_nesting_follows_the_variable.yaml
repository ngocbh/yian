# The TS message has no location trailer; Python's carries PyYAML's (rules: yaml).
kind: load
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: [[1]]
      output: str
  output: ${use.output}
env:
  YIAN_MAX_VALUE_NESTING: '4'
  YIAN_MAX_YAML_NESTING: '5'
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'invalid YAML: this list nests deeper than 5 levels, the limit for a YAML document (each mapping and list is a level; a yian value nests at most 4); flatten it'
      frames:
      - label: flow.yaml
        range: [8, 15, 8, 16]
