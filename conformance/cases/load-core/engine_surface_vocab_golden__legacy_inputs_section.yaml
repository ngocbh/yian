kind: load
flow: |
  id: f
  name: f
  inputs:
    x: !str
  nodes:
    n:
      kind: code
      input:
        v: ${input.x}
      output: str
      code: return 1
  output:
    result: ${n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: unknown top-level key 'inputs' — flows use `input:` (rename the section)
      frames:
      - label: flow.yaml
        range: [3, 1, 3, 7]
