# TS spells the name list as JSON text (rules: messages); Python's repr in python_expect.
kind: load
rules: [messages]
flow: |
  id: f
  name: f
  input:
    x: !str
  nodes:
    a: {kind: code, code: ./fixtures/seeds.ts:one_line_summary, input: {x: "${input.x}"}}
  output: {y: "${a.output}"}
  system:
    bogus: 1
python_flow: |
  id: f
  name: f
  input:
    x: !str
  nodes:
    a: {kind: code, code: tests.seeds.fns:one_line_summary, input: {x: "${input.x}"}}
  output: {y: "${a.output}"}
  system:
    bogus: 1
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'system: unknown key(s) ["bogus"] (allowed: paths)'
      frames:
      - label: flow.yaml
        range: [9, 3, 9, 8]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'system: unknown key(s) [''bogus''] (allowed: paths)'
      frames:
      - label: flow.yaml
        range: [9, 3, 9, 8]
