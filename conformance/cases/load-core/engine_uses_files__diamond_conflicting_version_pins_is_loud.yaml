expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'uses: ref pinned child@v2 but the resolved file declares version: ''v1'' (file-per-version: name a file that declares ''v2'')'
      frames:
      - label: flow.yaml
        range: [11, 7, 11, 9]
        note: uses alias 'a2'
      - label: m2.yaml
        range: [9, 6, 9, 14]
        note: uses alias 'c'
