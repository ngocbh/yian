kind: load
flow: |
  id: p
  name: p
  input:
    x: !str
  nodes:
    a: {kind: call, call: a1, input: {x: "${input.x}"}}
    b: {kind: call, call: a2, input: {x: "${a.output}"}}
  output: {y: "${b.output}"}
  uses:
    a1: m1
    a2: m2
files:
  child.yaml: |
    id: child
    name: child
    version: "v1"
    input:
      x: !str
    nodes:
      a: {kind: code, code: ./fixtures/seeds.ts:one_line_summary, input: {x: "${input.x}"}}
    output: {y: "${a.output}"}
  m1.yaml: |
    id: m1
    name: m1
    input:
      x: !str
    nodes:
      a: {kind: call, call: c, input: {x: "${input.x}"}}
    output: {y: "${a.output}"}
    uses:
      c: child@v1
  m2.yaml: |
    id: m2
    name: m2
    input:
      x: !str
    nodes:
      a: {kind: call, call: c, input: {x: "${input.x}"}}
    output: {y: "${a.output}"}
    uses:
      c: child@v2
  p.yaml: |
    id: p
    name: p
    input:
      x: !str
    nodes:
      a: {kind: call, call: a1, input: {x: "${input.x}"}}
      b: {kind: call, call: a2, input: {x: "${a.output}"}}
    output: {y: "${b.output}"}
    uses:
      a1: m1
      a2: m2
