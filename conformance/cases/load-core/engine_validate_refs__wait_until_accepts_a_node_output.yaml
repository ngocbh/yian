kind: load
flow: |
  id: wait_refs
  name: wait_refs
  input:
    deadline: !datetime
  nodes:
    clock:
      kind: code
      output: datetime
      code: |
        return "2026-01-01T00:00:00Z"
    settle:
      kind: wait
      until: ${clock.output}
  output: ${settle.output}
expect:
  load: ok
