# A take reads the inbox whole; an inbox has no fields.
kind: load
flow: |
  id: f
  name: f
  input:
    m: !Inbox(str)
  nodes:
    heard:
      kind: tool
      tool_id: take
      input:
        from: ${input.m.text}
  output: null
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'heard' (tool_id: take): take's from must be an Inbox input of this flow, as ${input.<name>}"
      frames:
      - label: flow.yaml
        range: [10, 13, 10, 28]
