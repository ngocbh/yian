# An untyped producer narrowed by a CASE type branch is still untyped at run time, so a field its
# type doesn't require is read through ?. in the routed node.
kind: load
rules: [null-field-read]
flow: |
  id: f
  name: f
  typedefs:
    T: {f: Optional(str), g: str}
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      output: Any
      code: |
        return {"g": "a"}
    route:
      kind: case
      cases:
        - when: isinstance(mk.output, T)
          then: go
      else: other
    go:
      kind: code
      input:
        v: ${mk.output.f}
      output: str
      code: |
        return "go"
    other:
      kind: code
      output: str
      code: |
        return "other"
  output: ${go.output | other.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'go' input 'v': ${mk.output.f} reads field 'f', which T doesn't require, of mk.output, which is untyped and only narrowed to T; write mk.output?.f, or type mk.output as T where it is bound (`output: T` or `!T`)"
        frames:
          - label: flow.yaml
            range: [24, 10, 24, 24]
python_expect:
  load: ok
