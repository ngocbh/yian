# From tests/seeds/24-uses-external.yaml.
# A `uses:` alias with a `@v1` version guard names a sibling flow file, and a CALL of it loads.
kind: load
flow: |
  # 24 — USES: call an EXTERNAL flow (Python-import style).
  #
  # `uses:` declares an external callable bound to a local alias; a node then `call:`s the
  # alias like any in-file callable. The alias's ref (`lib_verdict`) is resolved on the
  # SEARCH PATH — by default the dir of this file (so a sibling `lib_verdict.yaml` is found).
  # A `@version` is an optional GUARD: `lib_verdict@v1` still resolves `lib_verdict.yaml`,
  # then asserts that file's declared `version:` field equals `v1`. A `hub:` scheme is
  # reserved for the future marketplace. CODE-only end to end -> runs locally, no model.
  #
  # Run it with the file resolver pointed at this dir:
  #   load_flow(text, search_paths=[<seeds dir>]); run_flow(loaded, {...})

  id: uses-external
  name: uses_external
  description: "Call an external (sibling-file) flow via uses: — the F demo."

  input:
    rating: !float
    rationale: !str

  uses:
    verdict: lib_verdict@v1       # external flow on the search path; @v1 = version guard

  nodes:
    say:
      kind: call
      call: verdict               # resolves: defs-first -> uses alias -> host
      input:
        rating: ${input.rating}
        rationale: ${input.rationale}

  output:
    line: ${say.output}          # the callee's value: lib_verdict returns its verdict string
files:
  lib_verdict.yaml: |
    # lib_verdict — a small reusable CODE flow, called as an EXTERNAL flow by seed 24.
    #
    # Lives next to 24-uses-external.yaml so the default file resolver finds it on the
    # search path (the importing file's own dir). CODE-only -> runs locally, no model.

    id: lib_verdict
    name: lib_verdict
    description: Turn a (rating, rationale) pair into a one-line verdict string.
    version: v1

    input:
      rating: !float
      rationale: !str

    nodes:
      v:
        kind: code
        code: ./fixtures/seeds.ts:one_line_summary   # {rating, rationale} -> str
        input:
          rating: ${input.rating}
          rationale: ${input.rationale}

    output: ${v.output}                    # the verdict string itself, not a record
# The child's CODE reference differs by language: `files` names the TS function, this the Python one.
python_files:
  lib_verdict.yaml: |
    # lib_verdict — a small reusable CODE flow, called as an EXTERNAL flow by seed 24.
    #
    # Lives next to 24-uses-external.yaml so the default file resolver finds it on the
    # search path (the importing file's own dir). CODE-only -> runs locally, no model.

    id: lib_verdict
    name: lib_verdict
    description: Turn a (rating, rationale) pair into a one-line verdict string.
    version: v1

    input:
      rating: !float
      rationale: !str

    nodes:
      v:
        kind: code
        code: tests.seeds.fns:one_line_summary   # {rating, rationale} -> str
        input:
          rating: ${input.rating}
          rationale: ${input.rationale}

    output: ${v.output}                    # the verdict string itself, not a record
expect:
  load: ok
