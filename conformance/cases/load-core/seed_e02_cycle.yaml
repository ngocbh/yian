# From tests/seeds/errors/e02-cycle.yaml.
# Two nodes that read each other fail as a cycle: one frame per node header, one note per edge.
kind: load
flow: |
  # e02 — Cyclic data graph.
  # EXPECT: compile error — the inferred graph has a cycle (a -> b -> a). The graph is inferred
  # from ${X.output} refs; cycle validation rejects the resulting non-DAG.

  id: err-cycle
  name: err_cycle

  input:
    seed: !str

  nodes:
    a:
      kind: agent
      input:
        x: ${b.output}          # a depends on b ...
      output: str
      prompt: "Echo ${x}."
    b:
      kind: agent
      input:
        x: ${a.output}          # ... and b depends on a -> cycle
      output: str
      prompt: "Echo ${x}."

  output: ${a.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: 'flow has a cycle involving ["a","b"]; flows must be acyclic'
        frames:
          - {label: flow.yaml, range: [12, 3, 12, 4]}
          - {label: flow.yaml, range: [18, 3, 18, 4]}
        notes: [a depends on b (a.input.x), b depends on a (b.input.x)]
