# From tests/seeds/errors/e06-type-mismatch-ref.yaml.
# A float output bound to a `uses:` child's str input fails at the CALL node's `input:` block.
kind: load
flow: |
  # e06 — type mismatch at a typed `call` boundary.
  #
  # A `call` applies a callable by signature; the callee's declared input types are
  # checked structurally against the bound sources. Here the callee
  # `research-one` (seed 03) declares  topic: str , but we bind it from a float-typed
  # node output. Sink bindings carry no type of their own — the type comes from the
  # SOURCE — so the mismatch surfaces at the callee boundary.
  #
  # Should fail with:  call.topic — child expects `str`, source is `float`.
  # The diagnostic must locate the incompatible cross-flow `call` binding.

  id: err-type-mismatch-ref
  name: err_type_mismatch_ref
  description: (negative) bind a float-typed output to a `call` child input declared str.

  input:
    topic: !str

  uses:
    research-one: research-one      # external callee (resolved by the test's child_resolver)

  nodes:
    score:
      kind: agent
      input:
        topic: ${input.topic}
      output: float                  # produces a number
      prompt: "Rate ${topic}'s relevance in [-1, 1]. Output only the number."

    call:
      kind: call
      call: research-one           # callee declares  topic: str
      input:
        topic: ${score.output}      # ERROR: float bound to a str-typed callee input

  output: ${call.output}
files:
  research-one.yaml: |
    # 03 — Single-topic research (a reusable child flow).
    #
    # A small CODE -> AGENT pipeline that researches ONE topic and returns {report, asof}.
    # This is the atomic unit; 04 (single call) and 05 (map) compose it. Shows: a CODE data-fetch
    # leaf (flat `code:`), ${input.X} + a typed parameter default (as_of), an
    # object output, and a node binding from another node's object field.

    id: research-one
    name: research_one
    description: Research a single topic into {report, asof} as of a date.

    input:
      topic: !str
      as_of: !date "2026-01-01"   # typed defaults must already satisfy their declared type

    nodes:
      fetch:
        kind: code
        input:
          topic: ${input.topic}
          as_of:  ${input.as_of}
        output:                    # an object: values + recent headlines
          values: list(float)
          news:   list(str)
        code: ./fixtures/seeds.ts:fetch_facts   # deterministic data pull

      synth:
        kind: agent
        input:
          topic: ${input.topic}
          asof:   ${input.as_of}
          values: ${fetch.output.values}          # dot into fetch's object output
          news:   ${fetch.output.news}
        output: str
        prompt: |-
          Write a neutral research brief for ${topic} as of ${asof}.
          Recent closes: ${values}. Headlines: ${news}.
          Cite the headlines as [n]. No recommendations.

    output:
      report: ${synth.output}
      asof:   ${input.as_of}
# The child (seed 03) has a CODE reference that differs by language: `files` names the TS function, this the Python one.
python_files:
  research-one.yaml: |
    # 03 — Single-topic research (a reusable child flow).
    #
    # A small CODE -> AGENT pipeline that researches ONE topic and returns {report, asof}.
    # This is the atomic unit; 04 (single call) and 05 (map) compose it. Shows: a CODE data-fetch
    # leaf (flat `code:`), ${input.X} + a typed parameter default (as_of), an
    # object output, and a node binding from another node's object field.

    id: research-one
    name: research_one
    description: Research a single topic into {report, asof} as of a date.

    input:
      topic: !str
      as_of: !date "2026-01-01"   # typed defaults must already satisfy their declared type

    nodes:
      fetch:
        kind: code
        input:
          topic: ${input.topic}
          as_of:  ${input.as_of}
        output:                    # an object: values + recent headlines
          values: list(float)
          news:   list(str)
        code: tests.seeds.fns:fetch_facts   # deterministic data pull

      synth:
        kind: agent
        input:
          topic: ${input.topic}
          asof:   ${input.as_of}
          values: ${fetch.output.values}          # dot into fetch's object output
          news:   ${fetch.output.news}
        output: str
        prompt: |-
          Write a neutral research brief for ${topic} as of ${asof}.
          Recent closes: ${values}. Headlines: ${news}.
          Cite the headlines as [n]. No recommendations.

    output:
      report: ${synth.output}
      asof:   ${input.as_of}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "call node 'call': binding 'topic' — child expects 'str', source is 'float'"
        # The `input:` block's value, from `topic:` on line 34 to the next key on line 36.
        frames: [{label: flow.yaml, range: [34, 7, 36, 1]}]
