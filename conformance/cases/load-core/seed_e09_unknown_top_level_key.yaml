# An unknown top-level key fails at the key, listing allowed keys as authored (`input`, `output`).
# The seed's line-14 comment names the retired `inputs`/`outputs`; flow text stays verbatim.
kind: load
flow: |
  # e09 — unknown top-level section key (strict schema, extra='forbid').
  # COMPILE: "unknown top-level key 'bogus'", located at that line. Everything else valid.
  id: err-unknown-top-key
  name: err_unknown_top_key
  input:
    topic: !str
  nodes:
    note:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Rate ${topic}."
  bogus: oops            # ERROR: not one of id/name/description/inputs/nodes/outputs/asserts/typedefs
  output: ${note.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "unknown top-level key 'bogus' (allowed: asserts, defs, description, env, id, input, llm_config, long_term_memory, name, nodes, output, system, typedefs, uses, version)"
        frames: [{label: flow.yaml, range: [14, 1, 14, 6]}]
