# From tests/seeds/errors/e33-input-named-like-field.yaml.
# An input named like a field (`env`) is located at the input (line 35), not the `env:` field.
kind: load
flow: |
  # e33 — An INPUT named like a flat field (`env`) must retain its own source range.
  # EXPECT: compile error — unresolved reference located at the input binding, not the field.
  #
  # The node deliberately gives both a flat field and an input the key `env`; source locations
  # are indexed by (kind, key), so the two authoring sites remain distinct.
  #
  # The node has BOTH an `env:` field (L31, value on L32) AND an input literally named `env` (L35).
  # They are different locations in the document. A flat `dict[str, SourceRange]` would key both as
  # the bare string "env", allowing the later stamp to overwrite the first and point a caret at the
  # wrong construct. Tuple keys include the location kind and keep the sites distinct:
  #
  #     ('field', 'env')     -> L32      # the env: block's VALUE
  #     ('input', 'env')     -> L35      # the input binding named `env`
  #     ('field', 'inputs')  -> L34      # the input: block (spans L34-L35)
  #
  # The invariant is that those two keys resolve to different lines. The
  # `env:` field's value (L32) sits above the input block, so a collision is visible as a caret on an
  # unrelated construct — with the field's value adjacent to the input, a last-wins bug could still
  # land on a plausible line and hide.
  #
  #   The unresolved-reference caret covers L35 alone, the offending `env:` input, rather than L32,
  #     the unrelated `env:` field value. Per-entry resolution and the (kind, key) tuple keep the two
  #     authoring sites distinct.
  id: err-input-named-like-field
  name: err_input_named_like_field
  input:
    topic: !str
  nodes:
    calc:
      kind: code
      env:                            # L31 — the FIELD `env`
        REGION: xyz                   # L32 — its value; a collision would caret HERE
      input:                          # L33 key; its VALUE block is L34-L35 (range_of -> the value)
        keep: ${input.topic}
        env: ${nope.output}           # L35 — an INPUT named `env` — THE ERROR
      output: int
      code: |
        return 1
  output: ${calc.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "flow has unresolved references:\n  node 'calc' input 'env' from: reference ${nope.output} uses unknown namespace 'nope'"
        frames: [{label: flow.yaml, range: [35, 12, 35, 26]}]
