# An ask's literal questions are checked at load.
kind: load
flow: |
  id: f
  name: f
  nodes:
    q:
      kind: tool
      tool_id: ask
      input:
        questions:
          - header: Ship
  output: null
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'q' (tool_id: ask) input 'questions': question[0] is invalid: missing key(s) [\"question\"]"
      frames:
      - label: flow.yaml
        range: [9, 9, 10, 1]
