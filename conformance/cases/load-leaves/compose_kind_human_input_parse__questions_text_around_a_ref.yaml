# TS writes the rejected `questions:` text as JSON text (rules: messages); Python's repr in python_expect.
kind: load
rules: [messages]
flow: |
  id: f
  name: f
  input:
    qs: !list(object)
  nodes:
    ask:
      kind: human_input
      input: {qs: "${input.qs}"}
      questions: "Answer these carefully: ${qs}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''ask'' (kind=human_input): `questions:` as a string must be exactly one `${name}` naming a declared input (e.g. `questions: ${qs}`), got "Answer these carefully: ${qs}"; put any text in `prompt:` instead'
      frames:
      - label: flow.yaml
        range: [9, 16, 9, 47]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''ask'' (kind=human_input): `questions:` as a string must be exactly one `${name}` naming a declared input (e.g. `questions: ${qs}`), got ''Answer these carefully: ${qs}''; put any text in `prompt:` instead'
      frames:
      - label: flow.yaml
        range: [9, 16, 9, 47]
