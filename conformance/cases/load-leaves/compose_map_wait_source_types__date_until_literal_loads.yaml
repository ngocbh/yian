kind: load
flow: |
  id: f
  name: f
  input:
    d: !date
  defs:
    items:
      nodes:
        c:
          kind: code
          output: list(str)
          code: |
            return ["a", "b"]
      output: ${c.output}
  nodes:
    w:
      kind: wait
      until: 2026-01-01
    after:
      kind: code
      depends_on: [w]
      output: int
      code: |
        return 1
  output: ${after.output}
expect:
  load: ok
