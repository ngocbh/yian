kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    w:
      kind: wait
      until: ${input.n}
    b:
      kind: code
      depends_on: [w]
      output: str
      code: return 'x'
  output: ${b.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''w'' (kind=wait): `until:` must be a date or datetime, but the value is int; write a reference to a date, datetime, or text'
      frames:
      - label: flow.yaml
        range: [8, 12, 8, 22]
