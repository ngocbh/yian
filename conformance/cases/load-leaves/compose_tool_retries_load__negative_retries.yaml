kind: load
flow: |
  id: old_tool_crash
  name: old_tool_crash
  nodes:
    place:
      kind: tool
      tool_id: place
      retries: -1
      input: {symbol: "ACME"}
  output: ${place.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''place'' (kind=tool): `retries:` must be a non-negative integer, got -1'
      frames:
      - label: flow.yaml
        range: [7, 14, 7, 16]
