kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      input: {proj: '${input.proj}'}
      prompt: "Cost $$5 for ${proj}"
      questions:
        - question: "${proj}"
          header: Framework
          options:
            - label: "${proj}"
              description: "${proj}"
  output: ${ask.output}
expect:
  load: ok
