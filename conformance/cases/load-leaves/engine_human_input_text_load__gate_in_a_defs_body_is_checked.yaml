kind: load
flow: |
  id: f
  name: f
  input:
    proj: !str
  defs:
    confirm:
      input:
        proj: !str
      nodes:
        ask:
          kind: tool
          tool_id: ask
          input:
            prompt: "${nope}"
      output: ${ask.output}
  nodes:
    run:
      kind: call
      call: confirm
      input:
        proj: ${input.proj}
  output: ${run.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        defs entry 'confirm': flow has unresolved references:
          node 'ask' input 'prompt' from: reference ${nope} uses unknown namespace 'nope'
      frames:
      - label: flow.yaml
        range: [7, 5, 16, 1]
        note: definition 'confirm'
      - label: flow.yaml
        range: [14, 19, 14, 28]
