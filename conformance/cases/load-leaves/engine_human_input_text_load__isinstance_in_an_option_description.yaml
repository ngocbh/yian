kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      input: {proj: '${input.proj}'}
      prompt: "${proj}"
      questions:
        - question: "${proj}"
          header: Framework
          options:
            - label: "${proj}"
              description: "${isinstance(proj, str)}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' questions[0].options[0].description: isinstance is not a prompt function; compute it in an input binding
      frames:
      - label: flow.yaml
        range: [14, 26, 14, 52]
