kind: load
python_skip: "human_input and wait are removed in TS yian, which uses tool_id: ask, sleep and take (#1025)"
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "${input.proj}"
        questions:
          - question: "${upper(${input.proj})}"
            header: Framework
            options:
              - label: "${input.proj}"
                description: "${input.proj}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "ask: `${...}` can't appear inside an expression; write `${upper(input.proj)}`"
      frames:
      - label: flow.yaml
        range: [11, 9, 16, 1]
