kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: human_input
      input: {proj: '${input.proj}'}
      prompt: "${proj}"
      questions:
        - question: "${input.proj}"
          header: Framework
          options:
            - label: "${proj}"
              description: "${proj}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' questions[0].question: ${input.proj} is not a declared input (a pool ref belongs in an input `from:`, not human_input text)
      frames:
      - label: flow.yaml
        range: [10, 19, 10, 34]
