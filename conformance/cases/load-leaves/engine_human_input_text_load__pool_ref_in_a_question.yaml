kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "${input.proj}"
        questions:
          - question: "${input.proj}"
            header: Framework
            options:
              - label: "${input.proj}"
                description: "${input.proj}"
  output: ${ask.output}
expect:
  load: ok
