# The quoted `${` and template are source text as written (shared, as the templates scanner cases are).
kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "x ${input.proj"
        questions:
          - question: "${input.proj}"
            header: Framework
            options:
              - label: "${input.proj}"
                description: "${input.proj}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "ask: unbalanced '${' in template 'x ${input.proj'"
      frames:
      - label: flow.yaml
        range: [9, 15, 9, 31]
