kind: load
python_skip: "human_input and wait are removed in TS yian, which uses tool_id: ask, sleep and take (#1025)"
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "${input.proj}"
        questions:
          - question: "${input.proj}"
            header: Framework
            options:
              - label: "${nosuch(input.proj)}"
                description: "${input.proj}"
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "ask: a flow call 'nosuch' inside ${...} is not supported — write it as the whole value with the call(...) directive: call(nosuch, ...)"
      frames:
      - label: flow.yaml
        range: [11, 9, 16, 1]
