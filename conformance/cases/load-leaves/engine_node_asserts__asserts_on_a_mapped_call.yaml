kind: load
flow: |2

  id: nam
  name: nam
  input:
    vs: !list(int)
  defs:
    dbl:
      input:
        n: !int
      nodes:
        y:
          kind: code
          code: ./fixtures/compose_codefns.ts:double
          input:
            n: ${input.n}
          output: int
      output: ${y.output}
  nodes:
    m:
      kind: map
      call: dbl
      over: ${input.vs}
      input:
        n: ${item}
      asserts:
        - "output >= 0"
  output: ${m.output}
python_flow: |2

