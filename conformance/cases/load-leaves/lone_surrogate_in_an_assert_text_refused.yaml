# A flow `asserts:` text holding a lone surrogate ("\ud800", a YAML escape) is not a yian value:
# it has no UTF-8 form.
kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  asserts:
    - "n > 0 or '\ud800' == 'x'"
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: ${input.n}
      output: int
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "flow field 'asserts[0]': text holding a lone surrogate is not a yian value"
      # The quoted assert on line 6.
      frames:
      - label: flow.yaml
        range: [6, 5, 6, 31]
