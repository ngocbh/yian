# From tests/seeds/errors/e11-field-not-allowed.yaml.
# A CODE node with a `prompt:` fails at its value, listing the allowed fields as authored.
kind: load
flow: |
  # e11 — a flat field illegal for the kind. COMPILE: "field 'prompt' is not allowed" (code).
  id: err-field-not-allowed
  name: err_field_not_allowed
  input:
    topic: !str
  nodes:
    calc:
      kind: code
      input:
        topic: ${input.topic}
      output: str
      code: ./fixtures/seeds.ts:echo_value
      prompt: "nope"     # ERROR: a CODE node has no prompt
  output: ${calc.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'calc' (kind=code): field 'prompt' is not allowed (allowed: asserts, code, depends_on, env, input, kind, node_name, output, runs_after)"
        # The `prompt:` value `"nope"` on line 13.
        frames: [{label: flow.yaml, range: [13, 13, 13, 19]}]
