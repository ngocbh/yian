# TS reads the unquoted date as text, which fills the `str` input (rules: dates); Python's error in python_expect.
kind: load
rules: [dates]
flow: |
  id: p
  name: p
  defs:
    body:
      input:
        n: !str
        k: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
            k: ${input.k}
          output:
            k: int
          code: "return {k: inputs[\"k\"] + 1n}"
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      times: 1
      input:
        n: 2026-01-01
        k: 0
        extra: "abc"
      call: body
  output: ${loop.output}
python_flow: |
  id: p
  name: p
  defs:
    body:
      input:
        n: !str
        k: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
            k: ${input.k}
          output:
            k: int
          code: return dict(k=inputs["k"] + 1)
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      times: 1
      input:
        n: 2026-01-01
        k: 0
        extra: "abc"
      call: body
  output: ${loop.output}
expect:
  load: ok
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''loop'': binding ''n'' — child expects ''str'', but the value 2026-01-01 does not fit; quote it to keep it as text: "2026-01-01"'
      frames:
      - label: flow.yaml
        range: [23, 7, 26, 5]
