# TS reads the unquoted date as text, which fills the `str` input (rules: dates); Python's error in python_expect.
kind: load
flow: |
  id: p
  name: p
  defs:
    body:
      input:
        n: !str
        k: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
            k: ${input.k}
          output:
            k: int
          code: 'return {k: inputs["k"] + 1}'
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      times: 1
      input:
        n: 2026-01-01
        k: 0
        extra: "abc"
      call: body
  output: ${loop.output}
expect:
  load: ok
