kind: load
flow: |2

  id: loop-never-ends
  name: loop_never_ends
  defs:
    body:
      input:
        done: !bool
        attempts: !int
      nodes: {}
      output:
        attempts: ${input.attempts + 1}
  nodes:
    wait:
      kind: loop
      call: body
      input:
        done: false
        attempts: 0
      until: done
      max: 0
  output: ${wait.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''wait'': `max:` must be >= 1 (got 0)'
      frames:
      - label: flow.yaml
        range: [13, 3, 13, 7]
