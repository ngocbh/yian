kind: load
flow: |2

  id: loop-partial-reference
  name: loop_partial_reference
  defs:
    body:
      input:
        n: !int
        note: !str
      nodes: {}
      output:
        n: ${input.n}
        note: ${input.note + "!"}
  nodes:
    loop:
      kind: loop
      call: body
      input:
        n: 1
        note: seed
      times: 1
    sink:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${loop.output.missing}
      output: str
  output: ${sink.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'sink' input 'x' from: reference ${loop.output.missing} reads unknown field 'missing' on record
      frames:
      - label: flow.yaml
        range: [25, 10, 25, 32]
