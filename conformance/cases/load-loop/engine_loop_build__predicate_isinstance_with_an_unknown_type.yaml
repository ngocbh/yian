kind: load
flow: |2

  id: loop-union
  name: loop_union
  typedefs:
    Done: {answer: str}
    More: {hint: str}
    Step: Union(Done, More)
  nodes:
    ask:
      kind: loop
      until: isinstance(r, Dnoe) and r.answer == 'ok'
      input:
        n: 0
        r: !Step {"hint":"start"}
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
            r: Step
          code: |
            const n = inputs["n"] + 1n
            return {"n": n, "r": n >= 3n ? {"answer": "ok"} : {"hint": "again"}}
      output: ${step.output}
  output: ${ask.output}
python_flow: |2

  id: loop-union
  name: loop_union
  typedefs:
    Done: {answer: str}
    More: {hint: str}
    Step: Union(Done, More)
  nodes:
    ask:
      kind: loop
      until: isinstance(r, Dnoe) and r.answer == 'ok'
      input:
        n: 0
        r: !Step {"hint":"start"}
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
            r: Step
          code: |
            n = inputs["n"] + 1
            return {"n": n, "r": {"answer": "ok"} if n >= 3 else {"hint": "again"}}
      output: ${step.output}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''ask'' until: unknown type ''Dnoe''; isinstance takes a typedefs: name or one of str, int, float, bool, date, datetime, object'
      frames:
      - label: flow.yaml
        range: [11, 12, 11, 52]
