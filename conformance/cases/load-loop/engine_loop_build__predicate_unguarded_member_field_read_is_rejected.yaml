kind: load
flow: |2

  id: loop-union
  name: loop_union
  typedefs:
    Done: {answer: str}
    More: {hint: str}
    Step: Union(Done, More)
  nodes:
    ask:
      kind: loop
      until: r.answer == 'ok'
      input:
        n: 0
        r: !Step {"hint":"start"}
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
            r: Step
          code: |
            const n = inputs["n"] + 1
            return {"n": n, "r": n >= 3 ? {"answer": "ok"} : {"hint": "again"}}
      output: ${step.output}
  output: ${ask.output}
