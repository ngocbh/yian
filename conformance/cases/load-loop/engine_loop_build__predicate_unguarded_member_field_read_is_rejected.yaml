expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''ask'': `until:` reference ${r.answer} reads field ''answer'', which only 1 of 2 union members have; check the member first with `isinstance(r, <Type>) and ...`'
      frames:
      - label: flow.yaml
        range: [9, 3, 9, 6]
