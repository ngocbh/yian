# TS spells the node list as JSON text (rules: messages); Python's repr in python_expect.
kind: load
flow: |2

  id: f
  name: f

  defs:
    child:
      input:
        y: !str
      nodes:
        x:
          kind: code
          code: "return inputs['y']"
          input:
            y: ${input.y}
          output: str
      output: ${x.output}

  nodes:
    n:
      kind: code
      code: "return inputs['a']"
      input:
        a: call(child, y=${n.output})
      output: str
  output: ${n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: flow has a cycle involving ["__call_0","n"]; flows must be acyclic
      frames:
      - label: flow.yaml
        range: [19, 3, 19, 4]
      - label: flow.yaml
        range: [23, 10, 23, 36]
      notes:
      - __call_0 depends on n (__call_0.input.y)
      - __call_0 is generated from node 'n'
      - n depends on __call_0 (n.input.a)
