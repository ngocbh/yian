# TS reads the unquoted date as text, which fills the `str` input (rules: dates); Python's error in python_expect.
kind: load
flow: |
  id: p
  name: p
  input:
    m: !Optional(str)
    n: !Optional(int)
    s: !str
    xs: !list(int)
    ds: !list(str)
    rs: !list(R)
    os: !list(Optional(str))
    d: !Optional(date)
  typedefs:
    R:
      a: int
    AB: Literal(a, b)
  defs:
    child:
      input:
        t: !str
      nodes:
        n:
          kind: code
          input:
            t: ${input.t}
          output: str
          code: "return String(inputs[\"t\"])"
      output: ${n.output}
  nodes:
    c:
      kind: call

      call: child
      input:
        t: 2026-01-01
  output: ${c.output}
expect:
  load: ok
