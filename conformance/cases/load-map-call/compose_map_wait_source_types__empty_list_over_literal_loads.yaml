kind: load
flow: |
  id: f
  name: f
  defs:
    child:
      input:
        x: !Any
      nodes:
        echo:
          kind: code
          input:
            x: ${input.x}
          code: |
            return inputs["x"]
      output: ${echo.output}
    items:
      nodes:
        c:
          kind: code
          output: list(str)
          code: |
            return ["a", "b"]
      output: ${c.output}
  nodes:
    m:
      kind: map
      over: []
      call: child
      input:
        x: 1
  output: ${m.output}
expect:
  load: ok
