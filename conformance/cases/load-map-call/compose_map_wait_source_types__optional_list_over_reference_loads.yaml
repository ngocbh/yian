kind: load
flow: |
  id: f
  name: f
  input:
    a: !Optional(list(str))
  defs:
    child:
      input:
        x: !Any
      nodes:
        echo:
          kind: code
          input:
            x: ${input.x}
          code: |
            return inputs["x"]
      output: ${echo.output}
    words:
      nodes:
        c:
          kind: code
          output: str
          code: |
            return "a"
      output: ${c.output}
  nodes:
    c:
      kind: code
      output: int
      code: |
        return 1
    u:
      kind: code
      code: |
        return [1]
    m:
      kind: map
      over: ${input.a}
      call: child
      input:
        x: 1
  output: ${m.output}
expect:
  load: ok
