kind: load
flow: |2

  id: ai
  name: ai
  input:
    v: !int

  defs:
    dbl:
      input:
        n: !int
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:double
          input:
            n: ${input.n}
          output: int
      output: ${x.output}

  nodes:
    main:
      kind: code
      code: ./fixtures/compose_codefns.ts:double
      input:
        n: ${input.v}
      output: int
    dbl_call:
      kind: call
      call: dbl
      input:
        n: ${input.v}
  output: ${main.output}
  asserts:
    - "dbl_call.output >= 0"
expect:
  load: ok
