# TS reads `2026-13-45` as text, which fills `d: !str` (rules: dates); Python's YAML-date error in python_expect.
kind: load
rules: [dates]
flow: |
  id: f
  name: f
  input:
    cmd: !str
  defs:
    g:
      input:
        d: !str
      nodes:
        run:
          kind: code
          output: str
          code: |
            return "x"
      output: ${run.output}
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(g, d=2026-13-45)
      output: str
  output: ${use.output}
expect:
  load: ok
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'use: call(g, ...) keyword ''d'' value can''t be read as YAML (not a valid date: month must be in 1..12); quote it to keep it as text'
      frames:
      - label: flow.yaml
        range: [21, 14, 21, 35]
