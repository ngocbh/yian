# TS spells the field list as JSON text (rules: messages); Python's repr in python_expect.
kind: load
flow: |2

  id: uf
  name: uf
  input:
    topic: !str
  defs:
    d:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
      bogus: 1
  nodes:
    go:
      kind: call
      call: d
      input:
        topic: ${input.topic}
  output: ${go.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''d'': unknown field(s) ["bogus"] (allowed: asserts, env, input, llm_config, long_term_memory, nodes, output)'
      frames:
      - label: flow.yaml
        range: [18, 5, 18, 10]
