kind: load
flow: |2

  id: ic_item
  name: ic_item
  input:
    topics: !list(str)
  defs:
    one:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
    wrap:
      input:
        t: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.t}
          output: str
      output: ${x.output}
  nodes:
    each:
      kind: map
      call: one
      over: ${input.topics}
      input:
        topic: call(wrap, t=${item})
  output: ${each.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''each'': inline call ''wrap'' cannot capture ${item} (arg ''t'') — it desugars to a top-level call node with no map-element scope; use a named `call` node (whose per-element `input:` may read `${item}`)'
      frames:
      - label: flow.yaml
        range: [35, 14, 35, 35]
