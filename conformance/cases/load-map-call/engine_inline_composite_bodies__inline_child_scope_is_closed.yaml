kind: load
flow: |
  id: inline-closed-scope
  name: inline_closed_scope
  nodes:
    parent:
      kind: code
      code: |
        return 'parent'
      output: str
    wrapper:
      kind: call
      nodes:
        leak:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo_x
          input:
            x: ${parent.output}
          output: str
      output: ${leak.output}
  output: ${wrapper.output}
