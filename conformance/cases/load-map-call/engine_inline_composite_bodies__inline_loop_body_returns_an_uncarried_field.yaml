# The message spells the field lists as JSON text.
kind: load
flow: |
  id: inline-loop-bad-contract
  name: inline_loop_bad_contract
  input:
    seed: !int
  nodes:
    repeat:
      kind: loop
      times: 1
      input:
        n: ${input.seed}
      nodes:
        step:
          kind: code
          code: |
            return {"value": inputs["n"]}
          input:
            n: ${input.n}
          output:
            value: int
      output: ${step.output}
  output: ${repeat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''repeat'': body output field(s) ["value"] are not carried record fields ["n"] (a body returns a subset of the carried record)'
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 9]
