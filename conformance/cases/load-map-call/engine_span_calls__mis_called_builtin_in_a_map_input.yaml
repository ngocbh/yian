kind: load
flow: |2

  id: f
  name: f
  input: {v: !str }
  defs:
    body:
      input: {item: !str }
      nodes:
        s: {kind: code, code: "return inputs['n']", input: {n: '${input.item}'}, output: str}
      output: ${s.output}
  nodes:
    m: {kind: map, over: '${[input.v]}', call: body, input: {item: '${upper(item, 1)}'}}
  output: ${m.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'm' map input 'item' from: expression function 'upper' takes (s): too many positional arguments
      frames:
      - label: flow.yaml
        range: [12, 66, 12, 85]
