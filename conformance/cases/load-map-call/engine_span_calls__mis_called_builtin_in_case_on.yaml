kind: load
flow: |2

  id: f
  name: f
  input: {v: !str }
  nodes:
    g:
      kind: case
      on: ${upper(input.v, 1)}
      cases:
        - when: "'A'"
          then: hot
      else: cold
    hot: {kind: code, code: "return 'hot'", output: str}
    cold: {kind: code, code: "return 'cold'", output: str}
  output: ${hot.output | cold.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'g' on: from: expression function 'upper' takes (s): too many positional arguments
      frames:
      - label: flow.yaml
        range: [8, 9, 8, 29]
