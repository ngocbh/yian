# From tests/seeds/errors/e37-synth-node-inherits-host-ranges.yaml.
# A dangling reference in an inline `call(...)` argument is named by the directive and located at the binding it is written in.
kind: load
flow: |
  # e37 — a SYNTHESIZED node's caret must resolve to its OWN source, not the host's. COMPILE:
  # "unresolved references". The synthesized call binding retains directive-owned provenance.
  # Fails at load; no inputs needed.
  # Run: `yian run tests/seeds/errors/e37-synth-node-inherits-host-ranges.yaml`.
  #
  # The inline `call(...)` on line 30 desugars to synth node `__call_0`.
  # The host `summary` node also has a `topic` input on line 29.
  # The synthesized CALL owns only the `topic` binding authored inside its directive.
  # Its source-catalog entry therefore points to the directive on line 30.
  # `__call_0` has no `prompt:` or `news` input inherited from the host.
  # Its one input is `topic`, authored inside the directive.
  # Retained origin data belongs to that synthesized binding, not the host descriptor.
  # This keeps like-named inputs on separate author-owned source sites.
  #
  # The failure is `node 'summary' input 'news' call(enrich) argument 'topic'`.
  # The expected caret is L30, the `call(...)` directive's binding line.
  # The message names the directive's `topic` argument, not the synth node.
  # The host's valid `topic:` binding on L29 remains unrelated.
  # Source positions are intentionally stable for the diagnostic assertion.
  #
  id: err-synth-inherits-host-ranges
  name: err_synth_inherits_host_ranges
  input:
    topic: !str
  nodes:
    summary:
      kind: agent
      input:
        topic: ${input.topic}                      # L29 — the HOST's topic (VALID)
        news: call(enrich, topic=${nope.output})   # L30 — the SYNTH's topic (THE ERROR)
      output: str
      prompt: "Summarize ${news} for ${topic}."
  defs:
    enrich:
      input:
        topic: !str
      nodes:
        fetch:
          kind: code
          code: ./fixtures/seeds.ts:fetch_facts
          input:
            topic: ${input.topic}
          output:
            values: list(float)
            news: list(str)
      output: ${fetch.output.news}
  output: ${summary.output}
# The CODE reference names a Python function; `flow` names its TS port.
