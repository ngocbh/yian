kind: load
flow: |
  id: w
  name: w
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    when: !date
  nodes:
    w:
      kind: wait
      until: ${Size(input.when)}
  output: ${w.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''w'': Size(...) is not supported in a wait node''s until:'
      frames:
      - label: flow.yaml
        range: [13, 12, 13, 31]
