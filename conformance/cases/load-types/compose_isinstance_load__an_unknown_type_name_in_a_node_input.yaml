kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
    Order: Union(Buy, Sell)
    Running: Literal(running)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: Order
      code: |
        return inputs["order"]
    check:
      kind: code
      input:
        ok: ${isinstance(d.output, Buyy)}
        known: ${isinstance(input.order, object)}
      code: |
        return [inputs["ok"], inputs["known"]]
  output: ${check.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''check'' input ''ok'': unknown type ''Buyy''; isinstance takes a typedefs: name or one of str, int, float, bool, date, datetime, object'
      frames:
      - label: flow.yaml
        range: [21, 11, 21, 40]
