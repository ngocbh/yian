kind: load
flow: |
  id: w
  name: w
  input:
    when: !date
  nodes:
    w:
      kind: wait
      until: ${isinstance(input.when, date)}
  output: ${w.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''w'': isinstance is not supported in a wait node''s until:'
      frames:
      - label: flow.yaml
        range: [8, 12, 8, 43]
