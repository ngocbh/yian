kind: load
flow: |
  id: p
  name: p
  typedefs:
    Item:
      qty: int
  input:
    s: !Optional(str)
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: ${input.s}
      output: Optional(Item)
      asserts:
        - "output != null and output.nosuch > 0"
  output: ${x.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has invalid node asserts:
          node 'x' assert: reference ${output.nosuch} reads field 'nosuch', which Item doesn't have; output is Item here, by the checks before this read
      frames:
      - label: flow.yaml
        range: [16, 9, 16, 47]
