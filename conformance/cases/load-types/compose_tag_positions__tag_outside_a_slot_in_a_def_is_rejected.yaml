kind: load
flow: |
  id: f
  name: f
  defs:
    sub:
      input:
        x: !int
      nodes:
        echo:
          kind: !str code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            value: !int ${input.x}
          output: int
      output: ${echo.output}
  nodes:
    n:
      kind: call
      call: sub
      input:
        x: 1
  output: ${n.output}
python_flow: |
  id: f
  name: f
  defs:
    sub:
      input:
        x: !int
      nodes:
        echo:
          kind: !str code
          code: tests.engine._compose_codefns:echo
          input:
            value: !int ${input.x}
          output: int
      output: ${echo.output}
  nodes:
    n:
      kind: call
      call: sub
      input:
        x: 1
  output: ${n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: a tag types a value — a flow input, a binding, a flow output, an agent variable, an `llm_config` value, a value entry in `nodes:`, or a value inside one; `kind:` is not one
      frames:
      - label: flow.yaml
        range: [9, 15, 9, 24]
