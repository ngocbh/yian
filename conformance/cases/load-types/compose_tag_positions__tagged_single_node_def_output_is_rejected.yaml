# The frames sit on def lines (flow structure), not CODE text: shared.
kind: load
flow: |
  id: f
  name: f
  defs:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        qty: !int
      output: !int
  nodes:
    n:
      kind: call
      call: echo
      input:
        qty: 1
  output: ${n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''echo'': `output:` declares a type; write `output: int`, without a tag'
      frames:
      - label: flow.yaml
        range: [5, 5, 10, 1]
        note: definition 'echo'
      - label: flow.yaml
        range: [9, 13, 9, 17]
