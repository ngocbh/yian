# Trailing text after call(...) is source text shown as written: Python-quoted, shared.
kind: load
flow: |2

  id: tagged
  name: tagged
  input:
    n: !int
  nodes:
    size:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: ${input.n}
      output:
        qty: int
    note:
      kind: code
      code: |
        return "hi"
      output: str
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        qty: !str call(f) and more
      output: int
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'use: text follows the closing `)`: ''and more''; a call(...) must be the whole value'
      frames:
      - label: flow.yaml
        range: [23, 12, 23, 33]
