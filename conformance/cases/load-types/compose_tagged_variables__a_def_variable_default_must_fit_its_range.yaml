kind: load
flow: |
  id: tagged_variables
  name: tagged_variables
  typedefs:
    Tone: Literal(concise, detailed)
  defs:
    child:
      kind: agent
      variables:
        tone: !Tone concise
        instruction: !str "Summarize clearly"
        num_sentences: !int(1..12) 13
      prompt: "${instruction} in ${num_sentences} sentences, ${tone}."
      output: str
  nodes:
    invoke:
      kind: call
      call: child
  output: ${invoke.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''child'': ''num_sentences'': `13` is not a valid int(1..12)'
      frames:
      - label: flow.yaml
        range: [7, 5, 14, 1]
        note: definition 'child'
      - label: flow.yaml
        range: [11, 22, 11, 36]
