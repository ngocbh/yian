kind: load
flow: |
  id: tagged_variables
  name: tagged_variables
  typedefs:
    Tone: Literal(concise, detailed)
  kind: agent
  variables:
    tone: !Tone concise
    instruction: !str "Summarize clearly"
    num_sentences: !int(1..12) 13
  prompt: "${instruction} in ${num_sentences} sentences, ${tone}."
  output: str
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''num_sentences'': `13` is not a valid int(1..12)'
      frames:
      - label: flow.yaml
        range: [9, 18, 9, 32]
