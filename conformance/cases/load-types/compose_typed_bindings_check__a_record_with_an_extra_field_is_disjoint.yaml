kind: load
flow: |2

  id: checked
  name: checked
  typedefs:
    Big:
      a: int
      b: str
    Small:
      a: int
  nodes:
    big:
      kind: code
      code: |
        return {"a": 1, "b": "x"}
      output: Big
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: !Small ${big.output}
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''use'' input ''x'': declared Small, but the value is {"a":int,"b":str}'
      frames:
      - label: flow.yaml
        range: [20, 10, 20, 30]
