kind: load
flow: |2

  id: downstream-loop
  name: downstream_loop
  defs:
    bump:
      input:
        n: !Any
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1
      output:
        n: ${step.output}
  nodes:
    opaque:
      kind: code
      code: |
        return 1
    loop:
      kind: loop
      times: 2
      input:
        n: !str ${opaque.output}
      call: bump
  output: ${loop.output}
