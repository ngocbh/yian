kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, note: str}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        x: ${input.s}
      output: Decision
      code: "return null"
    route:
      kind: case
      cases:
        - when: ${d.output.qty > 5}
          then: sink
      else: sink
    sink:
      kind: code
      input:
        x: ${input.s}
      output: str
      code: return 'x'
  output: ${sink.output}
