expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'route' cases[0].when from: reference ${d.output.qty} reads field 'qty', which only union members with action buy, sell have; read it inside a case on ${d.output.action}
      frames:
      - label: flow.yaml
        range: [23, 15, 23, 34]
