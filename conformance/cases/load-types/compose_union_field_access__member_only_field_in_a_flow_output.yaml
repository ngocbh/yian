kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, note: str}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        x: ${input.s}
      output: Decision
      code: "return null"
  output:
    q: ${d.output.qty}
python_flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, note: str}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        x: ${input.s}
      output: Decision
      code: return None
  output:
    q: ${d.output.qty}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          flow output from: reference ${d.output.qty} reads field 'qty', which only union members with action buy, sell have; read it inside a case on ${d.output.action}
      frames:
      - label: flow.yaml
        range: [21, 3, 22, 1]
