kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, note: str}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        x: ${input.s}
      output: Decision
      code: "return null"
    c:
      kind: call
      input:
        v: ${d.output}
      nodes:
        inner:
          kind: code
          input:
            w: ${input.v.qty}
          output: str
          code: return 'x'
      output: ${inner.output}
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'inner' input 'w' from: reference ${input.v.qty} reads field 'qty', which only union members with action buy, sell have; read it inside a case on ${input.v.action}
      frames:
      - label: flow.yaml
        range: [28, 14, 28, 28]
