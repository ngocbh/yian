kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, limit: float}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: Decision
      code: "return null"
    route:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: b
        - when: sell
          then: b
        - when: hold
          then: b
      else: e
    b:
      kind: code
      code: return 1
    e:
      kind: code
      input:
        a: ${d.output.action}
      code: return 1
  output: ${d.output.action}
