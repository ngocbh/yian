# The message spells the compared text and the suggested tag as JSON text.
kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, limit: float}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: Decision
      code: return 1
    route:
      kind: case
      cases:
        - when: input.s == 'x'
          then: b
        - when: "d.output.action == 'biy'"
          then: b
      else: e
    b:
      kind: code
      code: return 1
    e:
      kind: code
      code: return 1
  output: ${d.output.action}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `cases[1].when`: `d.output.action == "biy"` compares d.output.action with "biy", which is not one of its tags (buy, hold, sell); did you mean "buy"?'
      frames:
      - label: flow.yaml
        range: [22, 15, 22, 41]
