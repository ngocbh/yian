kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, limit: float}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    s: !str
    o: !Reply
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: Decision
      code: return 1
    route:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: inner
      else: e
    inner:
      kind: case
      cases:
        - when: "isinstance(input.o, Text) and d.output.nosuch > 0"
          then: t
      else: m
    t:
      kind: code
      code: return 1
    m:
      kind: code
      code: return 1
    e:
      kind: code
      code: return 1
  output: ${d.output.action}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'inner' cases[0].when from: reference ${d.output.nosuch} reads field 'nosuch', which Buy doesn't have; d.output is Buy here, by the case branch that routes this node
      frames:
      - label: flow.yaml
        range: [31, 15, 31, 66]
