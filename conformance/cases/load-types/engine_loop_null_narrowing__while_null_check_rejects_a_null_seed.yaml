kind: load
flow: |
  id: pages
  name: pages
  input:
    start: !Optional(str)
  defs:
    fetch_page:
      input:
        cursor: !str
      nodes:
        get:
          kind: code
          input:
            cursor: ${input.cursor}
          output: str
          code: |
            if (inputs["cursor"] === null) throw new Error("body saw a null cursor")
            return ({p1: "p2", p2: null})[inputs["cursor"]] ?? null
      output:
        cursor: ${get.output}
  nodes:
    pages:
      kind: loop
      while: cursor != null
      input:
        cursor: null
      call: fetch_page
  output: ${pages.output}
python_flow: |
  id: pages
  name: pages
  input:
    start: !Optional(str)
  defs:
    fetch_page:
      input:
        cursor: !str
      nodes:
        get:
          kind: code
          input:
            cursor: ${input.cursor}
          output: str
          code: |
            assert inputs["cursor"] is not None, "body saw a null cursor"
            return {"p1": "p2", "p2": None}.get(inputs["cursor"])
      output:
        cursor: ${get.output}
  nodes:
    pages:
      kind: loop
      while: cursor != null
      input:
        cursor: null
      call: fetch_page
  output: ${pages.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''pages'': binding ''cursor'' — child expects ''str'', but the value null does not fit'
      frames:
      - label: flow.yaml
        range: [25, 7, 26, 5]
