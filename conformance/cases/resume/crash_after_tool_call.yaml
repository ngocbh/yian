kind: resume
rules: [run-log]
flow: |
  id: crash-after-tool-call
  name: crash_after_tool_call
  input:
    q: !str
  nodes:
    fetch:
      kind: tool
      tool_id: lookup
      input:
        q: ${input.q}
    ok:
      kind: tool
      tool_id: ask
      input:
        prompt: "Use ${fetch.output}?"
      output: str
  output:
    found: ${fetch.output}
    answer: ${ok.output}
inputs: {q: x}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      parameters:
        type: object
        properties: {q: {type: string}}
        required: [q]
      # Attempt 1 runs before the cut, attempt 2 in the resumed run.
      results:
        - return: F1
        - return: F1
  human:
    ok: ["yes"]
  # Record 8 is fetch's node_started: the tool runs, then its pool_commit is refused.
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output: {found: F1, answer: "yes"}
  tool_calls:
    lookup:
      - {args: {q: x}, call_id: r1/fetch, attempt: 1, node: fetch}
      - {args: {q: x}, call_id: r1/fetch, attempt: 2, node: fetch}
    ask:
      - args:
          question: Use F1?
          answer_schema: [{name: answer, type: str, required: true}]
          node_id: ok
        call_id: r1/ok
        attempt: 1
        node: ok
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {q: x}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {q: x}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, fetch]
    - [run_resumed, null, {retry_node_ids: [fetch], num_workers: 0}]
    - [node_started, fetch]
    - [pool_commit, fetch, {value: F1}]
    - [node_succeeded, fetch, {commit: 11}]
    - [node_started, ok]
    - [pool_commit, ok, {value: "yes"}]
    - [node_succeeded, ok, {commit: 14}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: {found: F1, answer: "yes"}}]
    - [node_succeeded, __end__, {commit: 17}]
