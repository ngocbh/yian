# TS-only (decision 20): a resume after a crash mid-node publishes NodeAttemptResumed with the node's
# interrupted count, 1 for one start no stop covered.
# Record 3 is fetch's node_started: the tool runs, then its node_succeeded is refused, so attempt 2 runs on resume.
kind: resume
python_skip: TS-only (decision 20)
flow: |
  id: fetch-once
  name: fetch_once
  nodes:
    fetch:
      kind: tool
      tool_id: lookup
  output: ${fetch.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      parameters: {type: object, properties: {}}
      results:
      - return: F1
      - return: F1
  crash_after_record: 3
expect:
  output: {status: succeeded, output: F1}
  trace:
  - [run_started, null, {inputs: {}, learnable: false, num_workers: 0}]
  - [node_started, __start__]
  - [node_succeeded, __start__, {value: {}}]
  - [node_started, fetch]
  - [run_resumed, null, {num_workers: 0, retry_node_ids: [fetch]}]
  - [node_started, fetch]
  - [node_succeeded, fetch, {value: F1}]
  - [node_started, __end__]
  - [node_succeeded, __end__, {value: F1}]
  events:
  - [RunResumed]
  - [NodeAttemptResumed, {node_id: fetch, interrupted: 1}]
  - [NodeStarted, {node_id: fetch}]
  - [NodeSucceeded, {node_id: fetch, output: F1}]
  - [NodeStarted, {node_id: __end__}]
  - [NodeSucceeded, {node_id: __end__, output: F1}]
  - [RunSucceeded, {output: F1}]
  tool_calls:
    lookup:
    - {args: {}, call_id: r1/fetch, attempt: 1, node: fetch}
    - {args: {}, call_id: r1/fetch, attempt: 2, node: fetch}
resume: {}
