# From tests/engine/test_llm_config_values_records.py::test_resume_recomputes_the_recorded_config.
# A call-time llm_config agent records its resolved config as a step before its model call; resumed after a
# crash in that call, it recomputes the config and records an equal step.
# Record 6 is chat's effective_llm_config step: its model call runs, its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: f
  name: f
  llm_config: {provider: openai}
  nodes:
    pick: {kind: code, output: str, code: "return 'gpt-picked'"}
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: '${pick.output}'}
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: 6
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - call_time_llm:
        agents:
          chat: {}
      inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, pick]
  - - node_succeeded
    - pick
    - value: gpt-picked
  - [node_started, chat]
  - - node_step
    - chat
    - step:
        effective_llm_config:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-picked
          provider: openai
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [chat]
  - [node_started, chat]
  - - node_step
    - chat
    - step:
        effective_llm_config:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-picked
          provider: openai
  - - node_succeeded
    - chat
    - value: ok
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ok
  stream:
  - chunk: ok
    exchange_id: <id:1>
    final: false
    key: text
    node_id: chat
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: chat
resume: {}
