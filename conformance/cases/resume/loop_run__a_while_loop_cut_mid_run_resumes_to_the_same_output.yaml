# From tests/engine/test_loop_run.py::test_loop_without_max_resumes_from_its_log.
# A while LOOP without `max:` cut in the middle of its run resumes from the recorded drivers to the same output.
# Record 24 is loop#1/step's node_started (mid-iteration): the step runs, its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
rules: [run-log]
flow: |
  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: ./fixtures/compose_codefns.ts:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
  output: ${loop.output}
python_flow: |
  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: tests.engine._compose_codefns:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
  output: ${loop.output}
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: 24
expect:
  output:
    status: succeeded
    output:
      exited: true
      n: 3
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - node_expanded
    - loop
    - prune_ids: []
      seed:
      - exited: false
        n: 0
      - 0
  - [node_started, loop#0/__start__]
  - - pool_commit
    - loop#0/__start__
    - value:
        exited: false
        n: 0
  - - node_succeeded
