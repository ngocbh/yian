# From tests/engine/test_memory_storage_integration.py::test_resume_reopens_latest_saved_history_instead_of_the_old_run_snapshot.
# Pins: a session AGENT cut after it started (record 3) still saves its finished model exchange;
# the resume retries it over fresh memories, and its request holds that saved turn (the question
# twice), not the history of the cut run's start.
kind: resume
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: openai, model: test-model}
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      long_term_memory: session
      prompt: ${question}
      input:
        question: ${input.question}
      output: str
  output: ${agent.output}
inputs:
  question: question
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: 3
  memory: {}
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: reply saved before the cut
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: retry complete
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: question
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: reply saved before the cut
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: question
expect:
  output:
    status: succeeded
    output: retry complete
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      inputs:
        question: question
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        question: question
  - [node_started, agent]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [agent]
  - [node_started, agent]
  - - node_succeeded
    - agent
    - value: retry complete
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: retry complete
resume: {}
