# From tests/engine/test_run_api_key.py::test_resume_ignores_a_key_for_a_run_started_without_one.
# Also tests/engine/test_run_connection_settings.py::test_resume_ignores_headers_on_a_run_with_no_key_agents.
# A run that recorded no host-key agent ignores a resume's api_key and headers (one branch drops both).
# env: VLLM_API_KEY is the agent's own key, as in the test (the run's llm_config has none).
# Record 8 is agent's node_started: its first model call runs, its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: keyed
  name: keyed
  nodes:
    agent: {kind: agent, prompt: hi}
  output: ${agent.output}
env:
  VLLM_API_KEY: <key:2>
run:
  run_id: r1
  num_workers: 0
  llm_config:
    provider: vllm
    model: served-model
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: served-model
          provider: vllm
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [agent]
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: served-model
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - agent
    - value: ok
  - - pool_commit
    - agent
    - {key: agent.new_messages, steps: [11]}
  - - node_succeeded
    - agent
    - {commit: 12, messages: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 16}
  stream:
  - chunk: ok
    final: false
    key: text
    node_id: agent
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: agent
    n: 1
    index: 1
resume:
  api_key: <key:1>
  headers:
    X-Anything: <key:3>
