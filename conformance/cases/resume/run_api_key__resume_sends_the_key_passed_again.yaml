# From tests/engine/test_run_api_key.py::test_resume_sends_the_key_passed_again_and_records_none_of_it.
# Also ::test_openai_compatible_run_sends_the_key_and_records_none_of_it (the recorded `_host_key` marker).
# A run whose agent authenticates with the host's llm_config.api_key resumes with the key passed again; the key
# appears in no record, event or result.
# Record 8 is agent's node_started: its first model call runs, its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
rules: [run-log]
flow: |
  id: keyed
  name: keyed
  nodes:
    agent: {kind: agent, prompt: hi}
  output: ${agent.output}
run:
  run_id: r1
  num_workers: 0
  llm_config:
    provider: vllm
    model: served-model
    api_key: <key:1>
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _host_key: true
          model: served-model
          provider: vllm
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [agent]
  - [node_started, agent]
  - - pool_commit
    - agent
    - value: ok
  - - node_succeeded
    - agent
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 14}
  stream:
  - chunk: ok
    exchange_id: <id:1>
    final: false
    key: text
    node_id: agent
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: agent
resume:
  api_key: <key:1>
