# From tests/engine/test_run_connection_settings.py::test_a_finished_run_checks_the_given_header_names.
# A finished run's resume still checks the given header names against the recorded ones (and appends nothing).
kind: resume
flow: |
  id: keyed
  name: keyed
  nodes:
    agent: {kind: agent, prompt: hi}
  output: ${agent.output}
run:
  run_id: r1
  num_workers: 0
  llm_config:
    provider: openai
    model: gpt-5.4
    api_key: <key:1>
    headers:
      X-Gateway: <key:2>
      X-Trace: <key:3>
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: end
expect:
  raises:
    class: ValueError
    message: 'headers must have the header names this run recorded for its host key: missing X-Trace'
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _header_names: [X-Gateway, X-Trace]
          _host_key: true
          model: gpt-5.4
          provider: openai
          _connection:
            method: api_key
            source: host
            endpoint: https://api.openai.com/v1
      learnable: false
      num_workers: 0
      inputs: {}
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, agent]
  - - node_succeeded
    - agent
    - value: ok
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ok
  events: []
resume:
  api_key: <key:1>
  headers:
    X-Gateway: <key:2>
