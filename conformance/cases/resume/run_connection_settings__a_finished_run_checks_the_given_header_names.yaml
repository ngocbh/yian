# From tests/engine/test_run_connection_settings.py::test_a_finished_run_checks_the_given_header_names.
# A finished run's resume still checks the given header names against the recorded ones (and appends nothing).
kind: resume
flow: |
  id: keyed
  name: keyed
  nodes:
    agent: {kind: agent, prompt: hi}
  output: ${agent.output}
run:
  run_id: r1
  num_workers: 0
  llm_config:
    provider: openai
    model: gpt-5.4
    api_key: <key:1>
    headers:
      X-Gateway: <key:2>
      X-Trace: <key:3>
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: end
expect:
  raises:
    class: RangeError
    message: 'headers must have the header names this run recorded for its host key: missing X-Trace'
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _header_names: [X-Gateway, X-Trace]
          _host_key: true
          model: gpt-5.4
          provider: openai
          _connection:
            method: api_key
            source: host
            endpoint: https://api.openai.com/v1
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.4
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - agent
    - value: ok
  - - pool_commit
    - agent
    - {key: agent.new_messages, steps: [9]}
  - - node_succeeded
    - agent
    - {commit: 10, messages: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 14}
  events: []
resume:
  api_key: <key:1>
  headers:
    X-Gateway: <key:2>
