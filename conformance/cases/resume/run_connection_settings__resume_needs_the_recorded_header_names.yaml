# From tests/engine/test_run_connection_settings.py::test_resume_needs_exactly_the_recorded_header_names[None-missing X-Gateway, X-Trace].
# A resume of a run whose host key came with headers needs the same header names; with none it names both,
# shows no value, and appends nothing.
# Record 8 is agent's node_started: its first model call runs, its result is refused.
kind: resume
flow: |
  id: keyed
  name: keyed
  nodes:
    agent: {kind: agent, prompt: hi}
  output: ${agent.output}
run:
  run_id: r1
  num_workers: 0
  llm_config:
    provider: openai
    model: gpt-5.4
    api_key: <key:1>
    headers:
      X-Gateway: <key:2>
      X-Trace: <key:3>
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: 8
expect:
  raises:
    class: ValueError
    message: 'headers must have the header names this run recorded for its host key: missing X-Gateway, X-Trace'
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _header_names: [X-Gateway, X-Trace]
          _host_key: true
          model: gpt-5.4
          provider: openai
          _connection:
            method: api_key
            source: host
            endpoint: https://api.openai.com/v1
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  events: []
resume:
  api_key: <key:1>
