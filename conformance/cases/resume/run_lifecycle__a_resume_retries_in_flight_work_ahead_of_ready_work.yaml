# From tests/engine/test_run_lifecycle.py::test_nonterminal_resume_commits_exact_retries_and_selected_workers[recorded].
# Also tests/engine/test_run_recovery_matrix.py::test_resume_prepends_ordered_effect_retries_before_existing_ready_work.
# The node in flight at the crash is retried ahead of the siblings that were already ready, and an absent
# resume.num_workers keeps the recorded one. Record 3 is a's node_started (b and c ready): a runs, its result is
# refused.
kind: resume
flow: |
  id: lifecycle-parallel
  name: lifecycle_parallel
  input:
    n: !int
  nodes:
    a:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
    b:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
    c:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
  output:
    a: ${a.output}
    b: ${b.output}
    c: ${c.output}
python_flow: |
  id: lifecycle-parallel
  name: lifecycle_parallel
  input:
    n: !int
  nodes:
    a:
      kind: code
      code: tests.engine._compose_codefns:echo_x
      input:
        x: ${input.n}
      output: int
    b:
      kind: code
      code: tests.engine._compose_codefns:echo_x
      input:
        x: ${input.n}
      output: int
    c:
      kind: code
      code: tests.engine._compose_codefns:echo_x
      input:
        x: ${input.n}
      output: int
  output:
    a: ${a.output}
    b: ${b.output}
    c: ${c.output}
inputs:
  n: 7
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: 3
expect:
  output:
    status: succeeded
    output:
      a: 7
      b: 7
      c: 7
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs:
        n: 7
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        n: 7
  - [node_started, a]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [a]
  - [node_started, a]
  - - node_succeeded
    - a
    - value: 7
  - [node_started, b]
  - - node_succeeded
    - b
    - value: 7
  - [node_started, c]
  - - node_succeeded
    - c
    - value: 7
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        a: 7
        b: 7
        c: 7
  events:
  - [RunResumed]
  - - NodeStarted
    - node_id: a
  - - NodeSucceeded
    - node_id: a
      output: 7
  - - NodeStarted
    - node_id: b
  - - NodeSucceeded
    - node_id: b
      output: 7
  - - NodeStarted
    - node_id: c
  - - NodeSucceeded
    - node_id: c
      output: 7
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        a: 7
        b: 7
        c: 7
  - - RunSucceeded
    - output:
        a: 7
        b: 7
        c: 7
resume: {}
