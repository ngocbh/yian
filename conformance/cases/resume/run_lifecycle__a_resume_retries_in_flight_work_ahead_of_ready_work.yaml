# From tests/engine/test_run_lifecycle.py::test_nonterminal_resume_commits_exact_retries_and_selected_workers[recorded].
# Also tests/engine/test_run_recovery_matrix.py::test_resume_prepends_ordered_effect_retries_before_existing_ready_work.
# The node in flight at the crash is retried ahead of the siblings that were already ready, and an absent
# resume.num_workers keeps the recorded one. Record 8 is a's node_started (b and c ready): a runs, its result is
# refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: lifecycle-parallel
  name: lifecycle_parallel
  input:
    n: !int
  nodes:
    a:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
    b:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
    c:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
  output:
    a: ${a.output}
    b: ${b.output}
    c: ${c.output}
inputs:
  n: 7
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output:
      a: 7
      b: 7
      c: 7
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: 7}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: 7
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, a]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [a]
  - [node_started, a]
  - - pool_commit
    - a
    - value: 7
  - - node_succeeded
    - a
    - {commit: 11}
  - [node_started, b]
  - - pool_commit
    - b
    - value: 7
  - - node_succeeded
    - b
    - {commit: 14}
  - [node_started, c]
  - - pool_commit
    - c
    - value: 7
  - - node_succeeded
    - c
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        a: 7
        b: 7
        c: 7
  - - node_succeeded
    - __end__
    - {commit: 20}
resume: {}
