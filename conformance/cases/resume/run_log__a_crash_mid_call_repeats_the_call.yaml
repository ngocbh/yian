# TS-only: Python reruns an AGENT from its start on resume.
# The agent's first model call is made and lost when the crash refuses its model_call (the cut
# keeps only the agent's node_started, record 8). Nothing of the agent is recorded, so the
# resumed agent makes the call again as step 1; lookup runs only in the resumed run, under the
# idempotency key the lost call would have given it (r1/research/1/0).
kind: resume
flow: |
  id: replay-mid-call
  name: replay_mid_call
  nodes:
    research:
      kind: agent
      tools: [lookup]
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Look up x."
  output: ${research.output}
env: {OPENAI_API_KEY: "<key:1>"}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      parameters:
        type: object
        properties: {q: {type: string}}
        required: [q]
      results:
        - return: X1
  models:
    research:
      agent:
        # The first call before the cut, lost with its model_call; its tool never ran.
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: tool_call, id: c1, name: lookup, arguments: {q: x}}]
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: tool_call, id: c1, name: lookup, arguments: {q: x}}]
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: found X1}]
  crash_after_record: 8
expect:
  output: {status: succeeded, output: found X1}
  tool_calls:
    lookup: [{args: {q: x}, attempt: 1, call_id: r1/research/1/0, node: research}]
  trace:
    - - run_started
      - null
      - effective_llm_by_static_path:
          research:
            _connection:
              endpoint: https://api.openai.com/v1
              method: api_key
              source: environment
            model: gpt-5.5
            provider: openai
        learnable: false
        num_workers: 0
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, research]
    - [run_resumed, null, {num_workers: 0, retry_node_ids: [research]}]
    - [node_started, research]
    - - node_step
      - research
      - n: 1
        step:
          finish: null
          kind: model_call
          model: gpt-5.5
          output:
            format: yian.message.v1
            parts:
              - arguments: {q: x}
                id: c1
                name: lookup
                type: tool_call
            role: assistant
          purpose: chat
          request_sha256: 2a88ec7e550ecf7decec738ef550bce3f635cab265c5ff8bb506f4183b7e3b8d
          response_id: null
          usage: null
    - - node_step
      - research
      - n: 2
        step:
          call_id: c1
          is_error: false
          kind: tool_result
          output: X1
    - - node_step
      - research
      - n: 3
        step:
          finish: null
          kind: model_call
          model: gpt-5.5
          output:
            format: yian.message.v1
            parts:
              - {text: found X1, type: text}
            role: assistant
          purpose: chat
          request_sha256: c5c443f570114d6b2143a1e1a41a442c6fded5db5c112949a379461ee5d56fff
          response_id: null
          usage: null
    - [pool_commit, research, {value: found X1}]
    - [pool_commit, research, {key: research.new_messages, steps: [11, 12, 13]}]
    - [node_succeeded, research, {commit: 14, messages: 15}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: found X1}]
    - [node_succeeded, __end__, {commit: 18}]
  stream:
    - {chunk: '', final: true, key: text, node_id: research, n: 1, index: 0}
    - {chunk: found X1, final: false, key: text, node_id: research, n: 3, index: 0}
    - {chunk: '', final: true, key: text, node_id: research, n: 3, index: 1}
