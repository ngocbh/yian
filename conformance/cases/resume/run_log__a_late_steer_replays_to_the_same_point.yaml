# A steer sent during the final reply is read late, as a `steer` step; the crash comes right after
# that step. The resumed agent replays the first reply, feeds the recorded steer back and makes
# the second call live with it in the request (listed below); no second `steer` step is written.
# The cut run made that call too, before the crash refused its record, so the script holds its
# reply twice.
kind: resume
flow: |
  id: late
  name: late
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run: {run_id: r1, num_workers: 0}
host:
  sends:
  - inbox: notes
    event: and cite your sources
    after: {node: chat, model_call: 1}
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: draft
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: final, with sources
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Help the user.
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: draft
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: and cite your sources
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: final, with sources
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Help the user.
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: draft
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: and cite your sources
  crash_after_record: 11
expect:
  output:
    status: succeeded
    output: final, with sources
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          model: gpt-5.5
          provider: openai
          _connection: {method: api_key, source: missing, endpoint: https://api.openai.com/v1}
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        notes: {inbox: notes}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: and cite your sources}
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: draft, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7de94d825befe72ccf8ab4b0b2607e0d8e52aeda6c2004860876ee65a05e3882
        response_id: null
        usage: null
  - - node_step
    - chat
    - n: 2
      step:
        from: [9]
        inbox: notes
        kind: steer
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [chat]
  - [node_started, chat]
  - - node_step
    - chat
    - n: 3
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: 'final, with sources', type: text}
          role: assistant
        purpose: chat
        request_sha256: 645fd9612f696ece3b3c8d2b66d7905fda3376540cf8acfeee65faf332ff30fc
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - {value: 'final, with sources'}
  - - pool_commit
    - chat
    - key: chat.new_messages
      steps: [10, 11, 14]
  - - node_succeeded
    - chat
    - {commit: 15, messages: 16}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: 'final, with sources'}
  - - node_succeeded
    - __end__
    - {commit: 19}
