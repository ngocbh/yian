# TS-only: Python reruns an AGENT from its start on resume, and has no inboxes.
# A steer sent while lookup runs is read before the next model call as a `steer` step; the crash
# comes right after that step. The resumed agent replays the reply and lookup's result, feeds the
# recorded steer back, and makes the live call with it in the request (its `request` below), so
# the digest covers it; no second `steer` step is written. The cut run made that call too, before
# the crash refused its record, so the script holds its reply twice.
kind: resume
flow: |
  id: recorded-steer
  name: recorded_steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run: {run_id: r1, num_workers: 0}
host:
  sends:
    - {inbox: notes, event: only the 2024 rows, after: {node: chat, tool_call: 1}}
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties: {topic: {type: string}}
        required: [topic]
      results:
        - return: found a
  models:
    chat:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts:
              - {type: tool_call, id: call-1, name: lookup, arguments: {topic: a}}
        - reply:
            format: yian.message.v1
            role: assistant
            parts:
              - {type: text, text: Done with 2024.}
          request:
            messages:
              - format: yian.message.v1
                role: system
                parts: [{type: text, text: Help.}]
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: Help the user.}]
              - format: yian.message.v1
                role: assistant
                parts:
                  - {type: tool_call, id: call-1, name: lookup, arguments: {topic: a}}
              - format: yian.message.v1
                role: tool
                parts:
                  - type: tool_result
                    call_id: call-1
                    name: lookup
                    content: found a
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: only the 2024 rows}]
            tools:
              - name: lookup
                description: Look up a topic.
                parameters:
                  type: object
                  properties: {topic: {type: string}}
                  required: [topic]
        - reply:
            format: yian.message.v1
            role: assistant
            parts:
              - {type: text, text: Done with 2024.}
          request:
            messages:
              - format: yian.message.v1
                role: system
                parts: [{type: text, text: Help.}]
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: Help the user.}]
              - format: yian.message.v1
                role: assistant
                parts:
                  - {type: tool_call, id: call-1, name: lookup, arguments: {topic: a}}
              - format: yian.message.v1
                role: tool
                parts:
                  - type: tool_result
                    call_id: call-1
                    name: lookup
                    content: found a
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: only the 2024 rows}]
            tools:
              - name: lookup
                description: Look up a topic.
                parameters:
                  type: object
                  properties: {topic: {type: string}}
                  required: [topic]
  crash_after_record: 12
expect:
  output: {status: succeeded, output: Done with 2024.}
  tool_calls:
    lookup: [{args: {topic: a}, attempt: 1, call_id: r1/chat/1/0, node: chat}]
  trace:
    - - run_started
      - null
      - effective_llm_by_static_path:
          chat:
            _connection:
              endpoint: https://api.openai.com/v1
              method: api_key
              source: missing
            model: gpt-5.5
            provider: openai
        learnable: false
        num_workers: 0
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {notes: {inbox: notes}}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, chat]
    - - node_step
      - chat
      - n: 1
        step:
          finish: null
          kind: model_call
          model: gpt-5.5
          output:
            format: yian.message.v1
            parts:
              - arguments: {topic: a}
                id: call-1
                name: lookup
                type: tool_call
            role: assistant
          purpose: chat
          request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
          response_id: null
          usage: null
    - [pool_commit, __start__, {key: __start__.notes, value: only the 2024 rows}]
    - [node_step, chat, {n: 2, step: {call_id: call-1, is_error: false, kind: tool_result, output: found a}}]
    - [node_step, chat, {n: 3, step: {from: [10], inbox: notes, kind: steer}}]
    - [run_resumed, null, {num_workers: 0, retry_node_ids: [chat]}]
    - [node_started, chat]
    - - node_step
      - chat
      - n: 4
        step:
          kind: model_call
          output:
            format: yian.message.v1
            parts:
              - {text: Done with 2024., type: text}
            role: assistant
          finish: null
          model: gpt-5.5
          purpose: chat
          request_sha256: abadbcebfada0c53e7cf42d9c2a62fe8a14b1d8286901017360ce48d29f729b4
          response_id: null
          usage: null
    - [pool_commit, chat, {value: Done with 2024.}]
    - [pool_commit, chat, {key: chat.new_messages, steps: [9, 11, 12, 15]}]
    - [node_succeeded, chat, {commit: 16, messages: 17}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: Done with 2024.}]
    - [node_succeeded, __end__, {commit: 20}]
  stream:
    - {chunk: Done with 2024., final: false, key: text, node_id: chat, n: 4, index: 0}
    - {chunk: '', final: true, key: text, node_id: chat, n: 4, index: 1}
