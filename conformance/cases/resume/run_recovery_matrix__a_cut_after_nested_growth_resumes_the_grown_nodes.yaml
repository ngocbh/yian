  - [node_started, outer/repeated#0/bump]
  - - pool_commit
    - outer/repeated#0/bump
    - value:
        exited: false
        n: 1
  - - node_succeeded
    - outer/repeated#0/bump
    - {commit: 31}
  - [node_started, outer/mapped#0/echo]
