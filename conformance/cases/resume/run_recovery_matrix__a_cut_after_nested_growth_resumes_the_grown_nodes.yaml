# From tests/engine/test_run_recovery_matrix.py::test_every_nested_growth_prefix_replays_to_the_live_state[serial-named].
# Also ::test_recorded_nested_growth_resumes_with_exact_memory_and_trace (without its memory).
# A run cut after a nested MAP's expansion inside a CALL resumes the grown nodes from the recorded growth.
# Record 17 is outer/mapped's node_expanded: an expansion settles its spawner, so nothing is in flight.
# The LOOP after the cut stays because the source test asserts its output.
kind: resume
flow: |
  id: recovery-matrix-growth
  name: recovery_matrix_growth
  defs:
    echo_one:
      input:
        value: !int
      nodes:
        echo:
          kind: code
          input:
            x: ${input.value}
          output: int
          code: ./fixtures/compose_codefns.ts:echo_x
      output: ${echo.output}
    bump_once:
      input:
        n: !int
        exited: !bool
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
          code: ./fixtures/compose_codefns.ts:loop_bump
      output: ${bump.output}
    composite:
      nodes:
        mapped:
          kind: map
          call: echo_one
          over: ${[1, 2]}
          input:
            value: ${item}
        repeated:
          kind: loop
          call: bump_once
          input:
            n: 0
            exited: false
          times: 2
      output:
        mapped: ${mapped.output}
        repeated: ${repeated.output}
  nodes:
    outer:
      kind: call
      call: composite
  output: ${outer.output}
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: 17
expect:
  output:
    status: succeeded
    output:
      mapped: [1, 2]
      repeated:
        exited: false
        n: 2
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, outer]
  - - pool_commit
    - outer
    - from: {}
      key: outer/__start__
  - - node_expanded
    - outer
    - prune_ids: []
  - [node_started, outer/__start__]
