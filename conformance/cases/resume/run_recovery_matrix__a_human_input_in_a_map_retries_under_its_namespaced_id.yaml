# From tests/engine/test_run_recovery_matrix.py::test_namespaced_human_input_start_replays_without_host_interaction[map].
# A HUMAN_INPUT inside a grown MAP item is retried under its namespaced id.
# Record 19 is invoke#0/ask's node_started: the first answer is given, its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
rules: [run-log]
flow: |
  id: recovery-nested-human-map
  name: recovery_nested_human_map
  defs:
    gate:
      input:
        token: !str
      nodes:
        ask:
          kind: human_input
          prompt: nested map input
          output: str
      output: ${ask.output}
  nodes:
    invoke:
      kind: map
      call: gate
      over: ${["a", "b"]}
      input:
        token: ${item}
  output: ${invoke.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    invoke#0/ask: [lost, A]
    invoke#1/ask: [B]
  crash_after_record: 19
expect:
  output:
    status: succeeded
    output: [A, B]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {}
      key: invoke/__start__
  - - pool_commit
    - invoke
    - from: {}
      key: invoke#0/__start__
  - - pool_commit
    - invoke
    - from: {}
      key: invoke#1/__start__
  - - node_expanded
    - invoke
    - prune_ids: []
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 9
  - [node_started, invoke#0/__start__]
  - - node_succeeded
    - invoke#0/__start__
    - commit: 10
  - [node_started, invoke#1/__start__]
  - - node_succeeded
    - invoke#1/__start__
    - commit: 11
  - [node_started, invoke#0/ask]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [invoke#0/ask]
  - [node_started, invoke#0/ask]
  - - pool_commit
    - invoke#0/ask
    - value: A
  - - node_succeeded
    - invoke#0/ask
    - {commit: 22}
  - [node_started, invoke#1/ask]
  - - pool_commit
    - invoke#1/ask
    - value: B
  - - node_succeeded
    - invoke#1/ask
    - {commit: 25}
  - [node_started, invoke#0/__end__]
  - - pool_commit
    - invoke#0/__end__
    - from: {invoke#0/ask: 22}
  - - node_succeeded
    - invoke#0/__end__
    - {commit: 28}
  - [node_started, invoke#1/__end__]
  - - pool_commit
    - invoke#1/__end__
    - from: {invoke#1/ask: 25}
  - - node_succeeded
    - invoke#1/__end__
    - {commit: 31}
  - [node_started, invoke/__end__]
  - - pool_commit
    - invoke/__end__
    - key: invoke
      from: {invoke#0/__end__: 28, invoke#1/__end__: 31}
  - - node_succeeded
    - invoke/__end__
    - {commit: 34}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [A, B]
  - - node_succeeded
    - __end__
    - {commit: 37}
  tool_calls:
    ask_user:
    - args:
        question: nested map input
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: invoke#0/ask
      call_id: r1/invoke#0/ask
      attempt: 1
      node: invoke#0/ask
    - args:
        question: nested map input
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: invoke#0/ask
      call_id: r1/invoke#0/ask
      attempt: 1
      node: invoke#0/ask
    - args:
        question: nested map input
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: invoke#1/ask
      call_id: r1/invoke#1/ask
      attempt: 1
      node: invoke#1/ask
resume: {}
