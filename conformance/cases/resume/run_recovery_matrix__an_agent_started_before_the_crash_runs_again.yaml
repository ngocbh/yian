# From tests/engine/test_run_recovery_matrix.py::test_effect_start_prefix_replays_without_running_effect_work[agent].
# An AGENT that started before the crash is retried on resume, and its model is called again.
# Record 8 is effect's node_started: its first model call runs (the first reply), its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
rules: [run-log]
flow: |
  id: recovery-agent
  name: recovery_agent
  nodes:
    effect:
      kind: agent
      prompt: hi
      llm_config:
        provider: openai
        model: offline-test
  output: ${effect.output}
run:
  run_id: r1
  num_workers: 0
host:
  models:
    effect:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: lost
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: again
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output: again
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        effect:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: offline-test
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, effect]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [effect]
  - [node_started, effect]
  - - pool_commit
    - effect
    - value: again
  - - node_succeeded
    - effect
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: again
  - - node_succeeded
    - __end__
    - {commit: 14}
  stream:
  - chunk: again
    exchange_id: <id:1>
    final: false
    key: text
    node_id: effect
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: effect
resume: {}
