# From tests/engine/test_run_state_dispatch.py::test_run_resumed_allows_an_empty_retry_segment_and_changes_workers.
# Also tests/engine/test_run_recovery_prefixes.py::test_replay_every_prefix_matches_live_state_and_uses_commit_path.
# A run cut right after `run_started` has nothing in flight: the resume retries nothing and starts at __start__.
# Record 0 is run_started: __start__'s node_started is refused, so nothing ran before the resume.
kind: resume
flow: |
  id: one-tool
  name: one_tool
  input:
    x: !str
  nodes:
    n:
      kind: tool
      tool_id: lookup
      input:
        x: ${input.x}
  output: ${n.output}
inputs:
  x: Ada
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      parameters:
        type: object
        properties:
          x:
            type: string
        required: [x]
      results:
      - return: Ada
  crash_after_record: 0
expect:
  output:
    status: succeeded
    output: Ada
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs:
        x: Ada
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: []
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        x: Ada
  - [node_started, n]
  - - node_succeeded
    - n
    - value: Ada
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: Ada
  events:
  - [RunResumed]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        x: Ada
  - - NodeStarted
    - node_id: n
  - - NodeSucceeded
    - node_id: n
      output: Ada
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: Ada
  - - RunSucceeded
    - output: Ada
  tool_calls:
    lookup:
    - args:
        x: Ada
      call_id: r1/n
      attempt: 1
      node: n
resume: {}
