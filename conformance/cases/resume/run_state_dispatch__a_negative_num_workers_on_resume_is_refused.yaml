# A negative resume.num_workers is refused (RangeError) before run_resumed is appended. Only the raised error is
# compared: a resume with num_workers other than 0 is grouped as pooled, so its trace is not recorded.
# Record 8 is n's node_started: the tool runs, its result is refused.
kind: resume
flow: |
  id: one-tool
  name: one_tool
  input:
    x: !str
  nodes:
    n:
      kind: tool
      tool_id: lookup
      input:
        x: ${input.x}
  output: ${n.output}
inputs:
  x: Ada
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      parameters:
        type: object
        properties:
          x:
            type: string
        required: [x]
      results:
      - return: Ada
  crash_after_record: 8
expect:
  raises:
    class: RangeError
    message: num_workers must be a non-negative integer
resume:
  num_workers: -1
