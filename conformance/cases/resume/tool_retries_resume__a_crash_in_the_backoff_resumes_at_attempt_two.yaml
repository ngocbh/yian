# From tests/engine/test_tool_retries_resume.py::test_a_crash_during_the_backoff_wait_rewaits_and_resumes_at_attempt_two.
# A crash during the first backoff wait resumes at attempt 2 with the same call id; the restart waits the
# recorded retry_in again without a new draw (jitter holds one draw, for attempt 1's backoff), and the resumed
# attempt is the node's own start, so it records no `started` step.
# env: YIAN_TOOL_RETRY_DELAY_SECONDS=1 with draw 0.0 keeps each wait at 0.5 s.
# Record 9 is the `failed` step: the wait runs, then the `started` step is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
rules: [run-log]
flow: |
  id: t
  name: t
  nodes:
    call:
      kind: tool
      tool_id: x
      retries: 3
  output: ${call.output}
env:
  YIAN_TOOL_RETRY_DELAY_SECONDS: '1'
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    x:
      parameters:
        type: object
        properties: {}
      results:
      - raise:
          class: TimeoutError
          message: a
      - return: ok
  jitter: [0.0]
  crash_after_record: 9
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, call]
  - - node_step
    - call
    - step:
        attempt: 1
        error:
          message: a
          type: TimeoutError
        event: failed
        retry_in: 0.5
        kind: tool_attempt
      n: 1
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [call]
  - [node_started, call]
  - [pool_commit, call, {value: ok}]
  - - node_succeeded
    - call
    - commit: 12
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 15}
  tool_calls:
    x:
    - args: {}
      call_id: r1/call
      attempt: 1
      node: call
    - args: {}
      call_id: r1/call
      attempt: 2
      node: call
resume: {}
