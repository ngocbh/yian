# From tests/engine/test_typed_bindings_replay.py::test_typed_consumer_after_resume_accepts_a_matching_answer.
# Also tests/engine/test_run_recovery_matrix.py::test_effect_start_prefix_replays_without_running_effect_work[human_input].
# A HUMAN_INPUT that started before the crash is retried and asked again; the consumer binds the answer given
# on resume against its declared type. `use` returns its input (the test doubles it).
# Record 3 is ask's node_started: the first answer is given, its result is refused.
# hand TS expect: events left out: a TS resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: typed-gate-replay
  name: typed_gate_replay
  nodes:
    ask:
      kind: human_input
      prompt: "How many?"
    use:
      kind: code
      input:
        n: !int ${ask.output}
      code: |
        return inputs["n"]
  output: ${use.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: [1, 3]
  crash_after_record: 3
expect:
  output:
    status: succeeded
    output: 3
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs: {}
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, ask]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [ask]
  - [node_started, ask]
  - - node_succeeded
    - ask
    - value: 3
  - [node_started, use]
  - - node_succeeded
    - use
    - value: 3
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: 3
  tool_calls:
    ask_user:
    - args:
        question: How many?
        node_id: ask
      call_id: r1/ask
      attempt: 1
      node: ask
    - args:
        question: How many?
        node_id: ask
      call_id: r1/ask
      attempt: 1
      node: ask
resume: {}
