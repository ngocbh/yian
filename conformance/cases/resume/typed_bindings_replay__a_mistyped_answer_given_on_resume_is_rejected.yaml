# The consumer binds after the resume, so its declared `!int` checks the answer given on resume.
# Record 8 is ask's node_started: the first answer is given, its result is refused.
# Events left out: a resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: typed-gate-replay
  name: typed_gate_replay
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "How many?"
    use:
      kind: code
      input:
        n: !int ${ask.output}
      code: |
        return inputs["n"]
  output: ${use.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: [1, three]
  crash_after_record: 8
expect:
  output:
    status: failed
    failure:
      code: binding.type
      message: 'binding ''n'': "three" does not match declared type int'
      frames:
      - label: flow.yaml
        range: [12, 10, 12, 28]
      node: use
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [ask]
  - [node_started, ask]
  - - pool_commit
    - ask
    - value: three
  - - node_succeeded
    - ask
    - {commit: 11}
  - [node_started, use]
  - - node_failed
    - use
    - failure:
        code: binding.type
        message: 'binding ''n'': "three" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [12, 10, 12, 28]
        node: use
  tool_calls:
    ask:
    - args: {question: "How many?", node_id: ask}
      call_id: r1/ask
      attempt: 1
      node: ask
    - args: {question: "How many?", node_id: ask}
      call_id: r1/ask
      attempt: 2
      node: ask
resume: {}
