# The AGENT's model call fails with a 429 reply.
# No retry (YIAN_MODEL_RETRIES=0); TS fails provider.rate_limit and Python node.execute.
kind: run
flow: |
  id: agent-failure-rate-limit
  name: agent_failure_rate_limit
  nodes:
    write:
      kind: agent
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Write a line."
  output: ${write.output}
env: {OPENAI_API_KEY: "<key:1>", YIAN_MODEL_RETRIES: '0'}
run: {run_id: r1, num_workers: 0}
host:
  models:
    write:
      agent:
        - chunks: []
          raise: {class: RateLimitError, status: 429, message: Rate limit reached for gpt-5.5}
expect:
  output:
    status: failed
    failure:
      code: provider.rate_limit
      message: Rate limit reached for gpt-5.5
      node: write
      frames: [{label: flow.yaml, range: [4, 3, 4, 8]}]
