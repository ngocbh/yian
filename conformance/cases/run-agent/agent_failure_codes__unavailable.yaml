# The AGENT's model call fails with a 503 reply.
# No retry (YIAN_MODEL_RETRIES=0); TS fails provider.unavailable and Python node.execute.
kind: run
flow: |
  id: agent-failure-unavailable
  name: agent_failure_unavailable
  nodes:
    write:
      kind: agent
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Write a line."
  output: ${write.output}
env: {OPENAI_API_KEY: "<key:1>", YIAN_MODEL_RETRIES: '0'}
run: {run_id: r1, num_workers: 0}
host:
  models:
    write:
      agent:
        - chunks: []
          raise: {class: InternalServerError, status: 503, message: The server is temporarily unavailable}
expect:
  output:
    status: failed
    failure:
      code: provider.unavailable
      message: The server is temporarily unavailable
      node: write
      frames: [{label: flow.yaml, range: [4, 3, 4, 8]}]
