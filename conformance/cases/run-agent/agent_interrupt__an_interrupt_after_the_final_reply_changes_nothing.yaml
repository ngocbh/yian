# TS-only: interrupt(run, inbox) is TS yian's (#1025).
# From tests/engine/test_agent_steering.py::test_interrupt_for_a_finished_node_is_ignored.
# An interrupt delivered once `chat`'s final reply (no tool calls) has been taken is recorded
# (`interrupted {inbox, nodes: [chat]}`) but cuts nothing: the answer is whole, so `chat`
# succeeds with "chat done" and writes no honor step; the next AGENT renders it.
kind: run
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      system_prompt: Help.
      prompt: Help the user.
      output: Optional(str)
    after:
      kind: agent
      input: {draft: "${chat.output}"}
      system_prompt: Help.
      prompt: "summarize: ${draft}"
      output: str
  output: ${after.output}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {interrupt: notes, after: {node: chat, model_call: 1}}
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: chat done
    after:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: summary
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'summarize: chat done'
expect:
  output:
    status: succeeded
    output: summary
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        after:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {notes: {inbox: notes}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - interrupted
    - null
    - inbox: notes
      nodes: [chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: chat done, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7de94d825befe72ccf8ab4b0b2607e0d8e52aeda6c2004860876ee65a05e3882
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - value: chat done
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [10]}
  - - node_succeeded
    - chat
    - {commit: 11, messages: 12}
  - [node_started, after]
  - - node_step
    - after
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: summary, type: text}
          role: assistant
        purpose: chat
        request_sha256: f00ecd6b8e198032b2999410d1d6658d699a957395beaff48fa75783b23eed15
        response_id: null
        usage: null
  - - pool_commit
    - after
    - value: summary
  - - pool_commit
    - after
    - {key: after.new_messages, steps: [15]}
  - - node_succeeded
    - after
    - {commit: 16, messages: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: summary
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {notes: {inbox: notes}}
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: chat
      output: chat done
      interrupted: false
  - - NodeStarted
    - node_id: after
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: after
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: after
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: after
      output: summary
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: summary
      interrupted: false
  - - RunSucceeded
    - output: summary
  stream:
  - chunk: chat done
    final: false
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 1
  - chunk: summary
    final: false
    key: text
    node_id: after
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: after
    n: 1
    index: 1
