# An interrupt delivered while tool call 1 runs lets it finish and skips call 2 (ToolCallFinished
# error `interrupted`, which reaches the host), then the honor step; the agent's output is null.
kind: run
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: Optional(str)
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {interrupt: notes, after: {node: chat, tool_call: 1}}
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found a
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Checking both.
          - type: tool_call
            id: call-1
            name: lookup
            arguments:
              topic: a
          - type: tool_call
            id: call-2
            name: lookup
            arguments:
              topic: b
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {notes: {inbox: notes}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: Checking both., type: text}
          - arguments: {topic: a}
            id: call-1
            name: lookup
            type: tool_call
          - arguments: {topic: b}
            id: call-2
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
        response_id: null
        usage: null
  - - interrupted
    - null
    - inbox: notes
      nodes: [chat]
  - - node_step
    - chat
    - n: 2
      step: {call_id: call-1, is_error: false, kind: tool_result, output: found a}
  - - node_step
    - chat
    - n: 3
      step: {call_id: call-2, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}
  - - node_step
    - chat
    - n: 4
      step: {by: 10, kind: interrupted}
  - - pool_commit
    - chat
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [9, 11, 12, 13]}
  - - node_succeeded
    - chat
    - {commit: 14, messages: 15}
  - [node_started, __end__]
  - - pool_commit
    - __end__
  - - node_succeeded
    - __end__
    - {commit: 18}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {notes: {inbox: notes}}
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      name: lookup
      node_id: chat
      tool_call_id: call-1
      n: 1
  - - ToolCallFinished
    - call_index: 0
      name: lookup
      node_id: chat
      result: found a
      tool_call_id: call-1
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: b
      call_index: 1
      name: lookup
      node_id: chat
      tool_call_id: call-2
      n: 1
  - - ToolCallFinished
    - call_index: 1
      error: interrupted
      name: lookup
      node_id: chat
      tool_call_id: call-2
      n: 1
  - - NodeSucceeded
    - node_id: chat
      interrupted: true
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      interrupted: false
  - - RunSucceeded
  stream:
  - chunk: Checking both.
    final: false
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 1
  tool_calls:
    lookup:
    - args:
        topic: a
      attempt: 1
      call_id: r1/chat/1/0
      node: chat
