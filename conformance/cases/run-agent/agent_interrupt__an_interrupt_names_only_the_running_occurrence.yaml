# TS-only: interrupt(run, inbox) is TS yian's (#1025).
# From tests/engine/test_agent_steering.py::test_interrupted_agent_in_a_loop_lets_the_loop_continue
# (tests/engine/test_agent_in_loop.py's FLOW, with the fold CODE replaced by the body's output
# template). Both LOOP occurrences read inbox `notes`; an interrupt delivered once
# `loop#0/reply`'s model call finishes names only that running occurrence: it skips its ping call
# and ends null (folded as "-"). The Stop is remembered: no take or wait comes between the
# occurrences, so `loop#1/reply` opens while it stands, gets its own `interrupted` record and
# ends null before its model call: "s|-|-".
kind: run
python_skip: "interrupt(run, inbox) is TS-only (#1025)"
rules: [run-log]
flow: |
  id: t
  name: t
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    seed: !str
    notes: !Inbox(str)
  defs:
    body:
      input:
        transcript: !str
        notes: !Inbox(str)
      nodes:
        reply:
          kind: agent
          steer_inbox: ${input.notes}
          tools: [ping]
          input:
            transcript: ${input.transcript}
          system_prompt: Help.
          prompt: "history ${transcript}"
          output: Optional(str)
      output:
        transcript: '${input.transcript}|${reply.output :- "-"}'
  nodes:
    loop:
      kind: loop
      call: body
      input:
        transcript: ${input.seed}
        notes: ${input.notes}
      times: 2
  output: ${loop.output.transcript}
inputs:
  seed: s
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {interrupt: notes, after: {node: loop#0/reply, model_call: 1}}
  tools:
    ping:
      description: Ping.
      parameters:
        type: object
        properties: {}
      results: []
  models:
    loop#0/reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: partial
          - type: tool_call
            id: p-1
            name: ping
            arguments: {}
expect:
  output:
    status: succeeded
    output: s|-|-
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        loop/reply:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {seed: s}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        seed: s
        notes: {inbox: notes}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {__start__: 6}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/reply]
  - - interrupted
    - null
    - inbox: notes
      nodes: [loop#0/reply]
  - - node_step
    - loop#0/reply
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: partial, type: text}
          - arguments: {}
            id: p-1
            name: ping
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 22ffe4d7807bc8158dca50305f13c5e7ad570292f7069ca396abbcd409aa2363
        response_id: null
        usage: null
  - - node_step
    - loop#0/reply
    - n: 2
      step: {call_id: p-1, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}
  - - node_step
    - loop#0/reply
    - n: 3
      step: {by: 14, kind: interrupted}
  - - pool_commit
    - loop#0/reply
  - - pool_commit
    - loop#0/reply
    - {key: loop#0/reply.new_messages, steps: [15, 16, 17]}
  - - node_succeeded
    - loop#0/reply
    - {commit: 18, messages: 19}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/__start__: 9, loop#0/reply: 18}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 22}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 22}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/reply, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 25
  - [node_started, loop#1/reply]
  - - interrupted
    - null
    - inbox: notes
      nodes: [loop#1/reply]
  - - node_step
    - loop#1/reply
    - n: 1
      step: {by: 30, kind: interrupted}
  - - pool_commit
    - loop#1/reply
  - - pool_commit
    - loop#1/reply
    - {key: loop#1/reply.new_messages, steps: [31]}
  - - node_succeeded
    - loop#1/reply
    - {commit: 32, messages: 33}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/__start__: 25, loop#1/reply: 32}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 36}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - key: loop
      from: {loop#1/__end__: 36}
  - - node_succeeded
    - loop~2
    - {commit: 39}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: s|-|-
  - - node_succeeded
    - __end__
    - {commit: 42}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        seed: s
        notes: {inbox: notes}
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - transcript: s
          notes: {inbox: notes}
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        transcript: s
        notes: {inbox: notes}
  - - NodeStarted
    - node_id: loop#0/reply
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: loop#0/reply
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: loop#0/reply
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments: {}
      call_index: 0
      name: ping
      node_id: loop#0/reply
      tool_call_id: p-1
      n: 1
  - - ToolCallFinished
    - call_index: 0
      error: interrupted
      name: ping
      node_id: loop#0/reply
      tool_call_id: p-1
      n: 1
  - - NodeSucceeded
    - node_id: loop#0/reply
      interrupted: true
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        transcript: s|-
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/reply, loop~1]
        seed:
        - transcript: s|-
          notes: {inbox: notes}
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        transcript: s|-
        notes: {inbox: notes}
  - - NodeStarted
    - node_id: loop#1/reply
  - - NodeSucceeded
    - node_id: loop#1/reply
      interrupted: true
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        transcript: s|-|-
  - - NodeStarted
    - node_id: loop~2
  - - NodeSucceeded
    - commit_as: loop
      node_id: loop~2
      output:
        transcript: s|-|-
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: s|-|-
  - - RunSucceeded
    - output: s|-|-
  stream:
  - chunk: partial
    final: false
    key: text
    node_id: loop#0/reply
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: loop#0/reply
    n: 1
    index: 1
