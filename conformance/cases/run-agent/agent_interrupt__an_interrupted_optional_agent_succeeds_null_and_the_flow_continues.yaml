# TS-only: interrupt(run, inbox) is TS yian's (#1025).
# From tests/engine/test_agent_steering.py::test_interrupted_node_succeeds_and_the_flow_continues
# (Python's node succeeds with ""; TS yian's Optional(str) agent succeeds with null). An interrupt
# delivered once `chat`'s reply arrives skips its tool call and ends it null; the flow goes on: the
# next AGENT renders the draft's default ("summarize: (interrupted)") and its reply is the output.
kind: run
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: Optional(str)
    after:
      kind: agent
      input: {draft: "${chat.output}"}
      system_prompt: Help.
      prompt: 'summarize: ${draft :- "(interrupted)"}'
      output: str
  output: ${after.output}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {interrupt: notes, after: {node: chat, model_call: 1}}
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties: {topic: {type: string}}
        required: [topic]
      results: []
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Checking.
          - type: tool_call
            id: call-1
            name: lookup
            arguments:
              topic: a
    after:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: summary
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'summarize: (interrupted)'
expect:
  output:
    status: succeeded
    output: summary
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        after:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {notes: {inbox: notes}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - interrupted
    - null
    - inbox: notes
      nodes: [chat]
  - - node_step
    - chat
    - {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Checking., type: text}, {arguments: {topic: a}, id: call-1, name: lookup, type: tool_call}], role: assistant}, purpose: chat, request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6, response_id: null, usage: null}}
  - - node_step
    - chat
    - {n: 2, step: {call_id: call-1, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}}
  - - node_step
    - chat
    - n: 3
      step: {by: 9, kind: interrupted}
  - [pool_commit, chat]
  - - pool_commit
    - chat
    - key: chat.new_messages
      steps: [10, 11, 12]
  - - node_succeeded
    - chat
    - {commit: 13, messages: 14}
  - [node_started, after]
  - - node_step
    - after
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: summary, type: text}
          role: assistant
        purpose: chat
        request_sha256: 2dd029df165785e76fd2e55441521dc4accba1981f16c121eba1b6d8e49d7799
        response_id: null
        usage: null
  - - pool_commit
    - after
    - value: summary
  - - pool_commit
    - after
    - {key: after.new_messages, steps: [17]}
  - - node_succeeded
    - after
    - {commit: 18, messages: 19}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: summary
  - - node_succeeded
    - __end__
    - {commit: 22}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {notes: {inbox: notes}}
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - node_id: chat
      n: 1
      purpose: chat
      provider: openai
      model: gpt-5.5
  - - ModelCallFinished
    - {node_id: chat, n: 1, purpose: chat, provider: openai, model: gpt-5.5}
  - - ToolCallStarted
    - node_id: chat
      n: 1
      call_index: 0
      tool_call_id: call-1
      name: lookup
      arguments: {topic: a}
  - - ToolCallFinished
    - {node_id: chat, n: 1, call_index: 0, tool_call_id: call-1, name: lookup, error: interrupted}
  - - NodeSucceeded
    - {node_id: chat, interrupted: true}
  - - NodeStarted
    - node_id: after
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: after
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: after
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: after
      output: summary
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: summary
      interrupted: false
  - - RunSucceeded
    - output: summary
  stream:
  - {node_id: chat, key: text, chunk: Checking., final: false, n: 1, index: 0}
  - {node_id: chat, key: text, chunk: '', final: true, n: 1, index: 1}
  - chunk: summary
    final: false
    key: text
    node_id: after
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: after
    n: 1
    index: 1
