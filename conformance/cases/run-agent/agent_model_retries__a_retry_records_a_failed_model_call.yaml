# TS-only: Python records no step for a model retry.
# The AGENT's first model call fails with a 503 reply before any output; with one model retry
# (YIAN_MODEL_RETRIES=1) and a draw of 0, the node records the failed attempt as a model_call step
# with its error and wait, waits the first backoff (0.5 s), and the second attempt answers and is
# recorded as the next model_call step.
kind: run
rules: [run-log]
python_skip: model_call steps are TS-only
flow: |
  id: agent-model-retries
  name: agent_model_retries
  nodes:
    write:
      kind: agent
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Write a line."
  output: ${write.output}
env: {OPENAI_API_KEY: "<key:1>", YIAN_MODEL_RETRIES: '1'}
run: {run_id: r1, num_workers: 0}
host:
  models:
    write:
      agent:
        - chunks: []
          raise: {class: InternalServerError, status: 503, message: The server is temporarily unavailable}
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: A line.}]
  jitter: [0.0]
expect:
  output: {status: succeeded, output: A line.}
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        defaults: {MODEL_RETRIES: 1}
        effective_llm_by_static_path:
          write:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, write]
    - - node_step
      - write
      - step:
          kind: model_call
          error: {kind: server, message: The server is temporarily unavailable}
          model: gpt-5.5
          output: null
          purpose: chat
          request_sha256: 61d71014ca3090c0a6f8753602c207b5143734596ea410b26a367279a943b9f2
          retry_in: 0.5
          usage: null
        n: 1
    - [node_step, write, {n: 2, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: A line., type: text}], role: assistant}, purpose: chat, request_sha256: 61d71014ca3090c0a6f8753602c207b5143734596ea410b26a367279a943b9f2, response_id: null, usage: null}}]
    - [pool_commit, write, {value: A line.}]
    - [node_succeeded, write, {commit: 11}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: A line.}]
    - [node_succeeded, __end__, {commit: 14}]
