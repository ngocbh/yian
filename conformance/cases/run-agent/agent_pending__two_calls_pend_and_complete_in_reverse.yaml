# TS-only (#1025): both calls of a reply wait, so node_waiting names both. The host answers the
# second first: the agent still waits on the first, and the run waits again. Once both are
# answered the woken agent's next request reads the results in call order, not answer order.
kind: run
rules: [run-log]
python_skip: an agent's pending host call is TS-only (#1025)
flow: |
  id: pending
  name: pending
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    agent:
      kind: agent
      tools: [hold]
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    hold:
      description: Wait for an answer.
      parameters: {type: object, properties: {topic: {type: string}}}
      pending: true
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: call-1, name: hold, arguments: {topic: a}}
          - {type: tool_call, id: call-2, name: hold, arguments: {topic: b}}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: text, text: done}
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - {type: text, text: Help.}
          - format: yian.message.v1
            role: user
            parts:
            - {type: text, text: hi}
          - format: yian.message.v1
            role: assistant
            parts:
            - {type: tool_call, id: call-1, name: hold, arguments: {topic: a}}
            - {type: tool_call, id: call-2, name: hold, arguments: {topic: b}}
          - format: yian.message.v1
            role: tool
            parts:
            - {type: tool_result, call_id: call-1, name: hold, content: answer a}
          - format: yian.message.v1
            role: tool
            parts:
            - {type: tool_result, call_id: call-2, name: hold, content: no b, is_error: true}
          tools:
          - {name: hold, description: Wait for an answer., parameters: {type: object, properties: {topic: {type: string}}}}
  sends:
  - {complete: r1/agent/1/1, error: no b}
  - {complete: r1/agent/1/0, output: answer a}
expect:
  output:
    status: succeeded
    output: done
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, learnable: false, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {topic: a}, id: call-1, name: hold, type: tool_call}, {arguments: {topic: b}, id: call-2, name: hold, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 6f481519e77d17be9ce677cb4007593ad2f013b3a1b32b33080f4033527c8272, response_id: null, usage: null}}], [node_step, agent, {n: 2, step: {call_id: r1/agent/1/0, index: 0, kind: pending, reply: 1, tool: hold, tool_call_id: call-1}}], [node_step, agent, {n: 3, step: {call_id: r1/agent/1/1, index: 1, kind: pending, reply: 1, tool: hold, tool_call_id: call-2}}], [node_waiting, agent, {call_ids: [r1/agent/1/0, r1/agent/1/1]}], [run_waiting, null, {node_ids: [agent]}], [node_step, agent, {n: 4, step: {call_id: call-2, is_error: true, kind: tool_result, output: no b}}], [node_step, agent, {n: 5, step: {call_id: call-1, is_error: false, kind: tool_result, output: answer a}}], [node_woken, agent], [node_step, agent, {n: 6, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: 19af50cfc27a67572e8f3cf1d8535772efe9aaa594b89dc30547661c82001a25, response_id: null, usage: null}}], [pool_commit, agent, {value: done}], [pool_commit, agent, {key: agent.new_messages, steps: [9, 14, 15, 17]}], [node_succeeded, agent, {commit: 18, messages: 19}], [node_started, __end__], [pool_commit, __end__, {value: done}], [node_succeeded, __end__, {commit: 22}]]
  tool_calls: {hold: [{args: {topic: a}, call_id: r1/agent/1/0, attempt: 1, node: agent}, {args: {topic: b}, call_id: r1/agent/1/1, attempt: 1, node: agent}]}
