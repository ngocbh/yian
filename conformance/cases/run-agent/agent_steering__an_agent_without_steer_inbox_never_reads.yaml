# From tests/engine/test_agent_steering.py::test_non_steerable_agent_never_calls_the_inbox.
# Changed (yian #1025): an AGENT without `steer_inbox:` never reads the inbox: a send during its
# model call and a set interrupt change nothing, so the model gets the plain request and its
# reply is the output. The take after it gets the event.
kind: run
rules: [run-log]
python_skip: "steer_inbox reads an Inbox, which Python yian doesn't have (#1025)"
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      system_prompt: Help.
      prompt: Help the user.
      output: str
    heard:
      kind: tool
      tool_id: take
      input:
        from: ${input.notes}
      depends_on: [chat]
  output:
    answer: ${chat.output}
    heard: ${heard.output.events}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {inbox: notes, event: for the take, after: {node: chat, model_call: 1, chunk: 1}}
  steering:
    chat:
    - interrupt: true
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: done
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Help the user.
expect:
  output:
    status: succeeded
    output: {answer: done, heard: [for the take]}
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {notes: {inbox: notes}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: for the take}
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: done, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7de94d825befe72ccf8ab4b0b2607e0d8e52aeda6c2004860876ee65a05e3882
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - value: done
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [10]}
  - - node_succeeded
    - chat
    - {commit: 11, messages: 12}
  - [node_started, heard]
  - - pool_commit
    - heard
    - closed: false
      events: [9]
      inbox: notes
  - - node_succeeded
    - heard
    - {commit: 15}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        answer: done
        heard: [for the take]
  - - node_succeeded
    - __end__
    - {commit: 18}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {notes: {inbox: notes}}
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: chat
      output: done
  - - NodeStarted
    - {node_id: heard}
  - - NodeSucceeded
    - node_id: heard
      output:
        closed: false
        events: [for the take]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        answer: done
        heard: [for the take]
  - - RunSucceeded
    - output:
        answer: done
        heard: [for the take]
  stream:
  - chunk: done
    final: false
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 1
