# From tests/engine/test_agent_steering.py::test_interrupt_at_the_top_of_a_later_iteration_returns_the_latest_reply.
# A steer and an interrupt queued once tool call 1 returns are read at the top of the next
# iteration: the interrupt wins before any steer is drained, so there is no second model call
# and the output is the latest reply's text.
kind: run
rules: [run-log]
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    chat:
      kind: agent
      steerable: true
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  steering:
    chat:
    - after:
        tool_call: 1
      steer: [too late]
    - after:
        tool_call: 1
      interrupt: true
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Looking.
          - type: tool_call
            id: call-1
            name: lookup
            arguments:
              topic: a
expect:
  output:
    status: succeeded
    output: Looking.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: Looking., type: text}
          - arguments: {topic: a}
            id: call-1
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
        response_id: null
        usage: null
  - - node_step
    - chat
    - n: 2
      step: {call_id: call-1, is_error: false, kind: tool_result, output: found}
  - - pool_commit
    - chat
    - value: Looking.
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [9, 10]}
  - - node_succeeded
    - chat
    - {commit: 11, messages: 12}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: Looking.
  - - node_succeeded
    - __end__
    - {commit: 15}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      name: lookup
      node_id: chat
      tool_call_id: call-1
      n: 1
  - - ToolCallFinished
    - call_index: 0
      name: lookup
      node_id: chat
      result: found
      tool_call_id: call-1
      n: 1
  - - NodeSucceeded
    - node_id: chat
      output: Looking.
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: Looking.
  - - RunSucceeded
    - output: Looking.
  stream:
  - chunk: Looking.
    final: false
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 1
  tool_calls:
    lookup:
    - args:
        topic: a
      attempt: 1
      call_id: r1/chat/1/0
      node: chat
