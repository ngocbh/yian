# From tests/engine/test_agent_steering.py::test_interrupt_before_a_tool_call_skips_only_the_remaining_calls.
# Also ::test_skipped_tool_calls_reach_the_host_as_interrupted_tool_events.
# An interrupt set while tool call 1 runs (README: an interrupt before tool call 2 is
# after: {tool_call: 1}) lets call 1 finish and skips call 2: one model call, one tool call,
# the reply's text as the output, and the events Started/Finished for call-1 (result "found a")
# then Started/Finished for call-2 with error `interrupted`, all under the reply's step.
kind: run
rules: [run-log]
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    chat:
      kind: agent
      steerable: true
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  steering:
    chat:
    - after:
        tool_call: 1
      interrupt: true
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found a
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Checking both.
          - type: tool_call
            id: call-1
            name: lookup
            arguments:
              topic: a
          - type: tool_call
            id: call-2
            name: lookup
            arguments:
              topic: b
expect:
  output:
    status: succeeded
    output: Checking both.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: Checking both., type: text}
          - arguments: {topic: a}
            id: call-1
            name: lookup
            type: tool_call
          - arguments: {topic: b}
            id: call-2
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
        response_id: null
        usage: null
  - - node_step
    - chat
    - n: 2
      step: {call_id: call-1, is_error: false, kind: tool_result, output: found a}
  - - node_step
    - chat
    - n: 3
      step: {call_id: call-2, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}
  - - pool_commit
    - chat
    - value: Checking both.
  - - node_succeeded
    - chat
    - {commit: 12}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: Checking both.
  - - node_succeeded
    - __end__
    - {commit: 15}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      name: lookup
      node_id: chat
      tool_call_id: call-1
      n: 1
  - - ToolCallFinished
    - call_index: 0
      name: lookup
      node_id: chat
      result: found a
      tool_call_id: call-1
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: b
      call_index: 1
      name: lookup
      node_id: chat
      tool_call_id: call-2
      n: 1
  - - ToolCallFinished
    - call_index: 1
      error: interrupted
      name: lookup
      node_id: chat
      tool_call_id: call-2
      n: 1
  - - NodeSucceeded
    - node_id: chat
      output: Checking both.
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: Checking both.
  - - RunSucceeded
    - output: Checking both.
  stream:
  - chunk: Checking both.
    final: false
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 1
  tool_calls:
    lookup:
    - args:
        topic: a
      attempt: 1
      call_id: r1/chat/1/0
      node: chat
