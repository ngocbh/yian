# From tests/engine/test_agent_steering.py::test_interrupt_before_the_first_model_call_returns_empty_text.
# An interrupt set before the run ends the AGENT at the top of its first iteration: no model
# call is made (the case scripts none), the queued steer is never read, and the node succeeds
# with "".
kind: run
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    chat:
      kind: agent
      steerable: true
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  steering:
    chat:
    - steer: [never read]
    - interrupt: true
expect:
  output:
    status: succeeded
    output: ''
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          model: gpt-5.5
          provider: openai
          _connection:
            method: api_key
            source: missing
            endpoint: https://api.openai.com/v1
      learnable: false
      num_workers: 0
      inputs: {}
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, chat]
  - - node_succeeded
    - chat
    - value: ''
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ''
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: chat
  - - NodeSucceeded
    - node_id: chat
      output: ''
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ''
  - - RunSucceeded
    - output: ''
