# From tests/engine/test_agent_steering.py::test_interrupt_on_the_last_chunk_keeps_the_complete_reply.
# The tool-call and usage chunks come first, then the text; an interrupt set once the last chunk
# is delivered (here the finish chunk, chunk 5) leaves nothing to cut: the output is the whole
# text "ok go", the ModelCallFinished usage is 500/20/520, and the reply's tool call is skipped
# (ToolCallFinished error `interrupted`), so lookup never runs.
kind: run
rules: [run-log]
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    chat:
      kind: agent
      steerable: true
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  steering:
    chat:
    - after:
        model_call: 1
        chunk: 5
      interrupt: true
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results: []
  models:
    chat:
      agent:
      - chunks:
        - tool_call:
            index: 0
            id: call-1
            name: lookup
            arguments: '{"topic": "a"}'
        - usage:
            input_tokens: 500
            output_tokens: 20
            total_tokens: 520
        - text: ok
        - text: ' go'
        - finish: tool_calls
expect:
  output:
    status: succeeded
    output: ok go
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: tool_calls
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: ok go, type: text}
          - arguments: {topic: a}
            id: call-1
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
        response_id: null
        usage: {cache_read_tokens: null, input_tokens: 500, output_tokens: 20, reasoning_tokens: null}
  - - node_step
    - chat
    - n: 2
      step: {call_id: call-1, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}
  - - pool_commit
    - chat
    - value: ok go
  - - node_succeeded
    - chat
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok go
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      usage:
        cache_creation_tokens: null
        cache_read_tokens: null
        input_tokens: 500
        output_tokens: 20
        reasoning_tokens: null
        total_tokens: 520
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      exchange_id: <id:1>
      name: lookup
      node_id: chat
      tool_call_id: call-1
  - - ToolCallFinished
    - call_index: 0
      error: interrupted
      exchange_id: <id:1>
      name: lookup
      node_id: chat
      tool_call_id: call-1
  - - NodeSucceeded
    - node_id: chat
      output: ok go
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok go
  - - RunSucceeded
    - output: ok go
  stream:
  - chunk: ok
    exchange_id: <id:1>
    final: false
    key: text
    node_id: chat
  - chunk: ' go'
    exchange_id: <id:1>
    final: false
    key: text
    node_id: chat
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: chat
