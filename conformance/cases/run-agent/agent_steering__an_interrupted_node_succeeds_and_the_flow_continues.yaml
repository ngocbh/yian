# From tests/engine/test_agent_steering.py::test_interrupted_node_succeeds_and_the_flow_continues.
# An AGENT interrupted before its first call succeeds with "", and the flow goes on: the next
# (non-steerable) AGENT renders that empty draft into its prompt ("summarize: ") and its reply
# is the run's output.
kind: run
rules: [run-log]
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    chat:
      kind: agent
      steerable: true
      system_prompt: Help.
      prompt: Help the user.
      output: str
    after:
      kind: agent
      input: {draft: "${chat.output}"}
      system_prompt: Help.
      prompt: "summarize: ${draft}"
      output: str
  output: ${after.output}
run:
  run_id: r1
  num_workers: 0
host:
  steering:
    chat:
    - interrupt: true
  models:
    after:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: summary
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'summarize: '
expect:
  output:
    status: succeeded
    output: summary
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        after:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - pool_commit
    - chat
    - value: ''
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: []}
  - - node_succeeded
    - chat
    - {commit: 9, messages: 10}
  - [node_started, after]
  - - node_step
    - after
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: summary, type: text}
          role: assistant
        purpose: chat
        request_sha256: 52bf0f3cc45551fae17023c9ec3f183d12c45dac24166d96f5e46a9ffedeadc8
        response_id: null
        usage: null
  - - pool_commit
    - after
    - value: summary
  - - pool_commit
    - after
    - {key: after.new_messages, steps: [13]}
  - - node_succeeded
    - after
    - {commit: 14, messages: 15}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: summary
  - - node_succeeded
    - __end__
    - {commit: 18}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: chat
  - - NodeSucceeded
    - node_id: chat
      output: ''
  - - NodeStarted
    - node_id: after
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: after
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: after
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: after
      output: summary
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: summary
  - - RunSucceeded
    - output: summary
  stream:
  - chunk: summary
    final: false
    key: text
    node_id: after
    n: 1
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: after
    n: 1
    index: 1
