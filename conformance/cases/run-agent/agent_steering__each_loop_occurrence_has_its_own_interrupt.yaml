# From tests/engine/test_agent_steering.py::test_interrupted_agent_in_a_loop_lets_the_loop_continue.
# (tests/engine/test_agent_in_loop.py's FLOW, with the fold CODE replaced by the body's output
# template). The first occurrence `loop#0/reply` is interrupted once its model call finishes: it
# keeps "partial" and skips its ping call; the interrupt stays with that occurrence, so
# `loop#1/reply` runs normally ("turn2"), and the loop continues: "s|partial|turn2".
kind: run
rules: [run-log]
flow: |
  id: t
  name: t
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    seed: !str
  defs:
    body:
      input:
        transcript: !str
      nodes:
        reply:
          kind: agent
          steerable: true
          tools: [ping]
          input:
            transcript: ${input.transcript}
          system_prompt: Help.
          prompt: "history ${transcript}"
          output: str
      output:
        transcript: "${input.transcript}|${reply.output}"
  nodes:
    loop:
      kind: loop
      call: body
      input:
        transcript: ${input.seed}
      times: 2
  output: ${loop.output.transcript}
inputs:
  seed: s
run:
  run_id: r1
  num_workers: 0
host:
  steering:
    loop#0/reply:
    - after:
        model_call: 1
      interrupt: true
  tools:
    ping:
      description: Ping.
      parameters:
        type: object
        properties: {}
      results: []
  models:
    loop#0/reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: partial
          - type: tool_call
            id: p-1
            name: ping
            arguments: {}
    loop#1/reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: turn2
expect:
  output:
    status: succeeded
    output: s|partial|turn2
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        loop/reply:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {seed: s}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        seed: s
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {__start__: 6}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/reply]
  - - node_step
    - loop#0/reply
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: partial, type: text}
          - arguments: {}
            id: p-1
            name: ping
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 22ffe4d7807bc8158dca50305f13c5e7ad570292f7069ca396abbcd409aa2363
        response_id: null
        usage: null
  - - node_step
    - loop#0/reply
    - n: 2
      step: {call_id: p-1, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}
  - - pool_commit
    - loop#0/reply
    - value: partial
  - - node_succeeded
    - loop#0/reply
    - {commit: 16}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/__start__: 9, loop#0/reply: 16}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 19}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 19}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/reply, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 22
  - [node_started, loop#1/reply]
  - - node_step
    - loop#1/reply
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: turn2, type: text}
          role: assistant
        purpose: chat
        request_sha256: f7a225c3f82d79756ce5c23b59ddab45cf374e8fd6a3d2ffff961c21ac0f228b
        response_id: null
        usage: null
  - - pool_commit
    - loop#1/reply
    - value: turn2
  - - node_succeeded
    - loop#1/reply
    - {commit: 28}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/__start__: 22, loop#1/reply: 28}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 31}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - key: loop
      from: {loop#1/__end__: 31}
  - - node_succeeded
    - loop~2
    - {commit: 34}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: s|partial|turn2
  - - node_succeeded
    - __end__
    - {commit: 37}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        seed: s
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - transcript: s
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        transcript: s
  - - NodeStarted
    - node_id: loop#0/reply
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: gpt-5.5
      node_id: loop#0/reply
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: gpt-5.5
      node_id: loop#0/reply
      provider: openai
      purpose: chat
  - - ToolCallStarted
    - arguments: {}
      call_index: 0
      exchange_id: <id:1>
      name: ping
      node_id: loop#0/reply
      tool_call_id: p-1
  - - ToolCallFinished
    - call_index: 0
      error: interrupted
      exchange_id: <id:1>
      name: ping
      node_id: loop#0/reply
      tool_call_id: p-1
  - - NodeSucceeded
    - node_id: loop#0/reply
      output: partial
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        transcript: s|partial
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/reply, loop~1]
        seed:
        - transcript: s|partial
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        transcript: s|partial
  - - NodeStarted
    - node_id: loop#1/reply
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: gpt-5.5
      node_id: loop#1/reply
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: gpt-5.5
      node_id: loop#1/reply
      provider: openai
      purpose: chat
  - - NodeSucceeded
    - node_id: loop#1/reply
      output: turn2
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        transcript: s|partial|turn2
  - - NodeStarted
    - node_id: loop~2
  - - NodeSucceeded
    - commit_as: loop
      node_id: loop~2
      output:
        transcript: s|partial|turn2
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: s|partial|turn2
  - - RunSucceeded
    - output: s|partial|turn2
  stream:
  - chunk: partial
    exchange_id: <id:1>
    final: false
    key: text
    node_id: loop#0/reply
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: loop#0/reply
  - chunk: turn2
    exchange_id: <id:2>
    final: false
    key: text
    node_id: loop#1/reply
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: loop#1/reply
