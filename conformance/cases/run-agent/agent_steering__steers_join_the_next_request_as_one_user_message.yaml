# From tests/engine/test_agent_steering.py::test_steers_are_sent_as_user_messages_at_the_top_of_each_iteration.
# Changed (yian #1025): a steer is a send to the agent's `steer_inbox`. The two sent while tool
# call 1 runs are read together before the next model call, as one `steer` step: they join that
# request after the tool result as one user message with a text part each, in send order.
kind: run
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {inbox: notes, event: only the 2024 rows, after: {node: chat, tool_call: 1}}
  - {inbox: notes, event: and cite them, after: {node: chat, tool_call: 1}}
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found a
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-1
            name: lookup
            arguments:
              topic: a
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Help the user.
          tools:
          - name: lookup
            description: Look up a topic.
            parameters:
              type: object
              properties:
                topic:
                  type: string
              required: [topic]
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: done
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Help the user.
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: call-1
              name: lookup
              arguments:
                topic: a
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-1
              name: lookup
              content: found a
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: only the 2024 rows
            - type: text
              text: and cite them
          tools:
          - name: lookup
            description: Look up a topic.
            parameters:
              type: object
              properties:
                topic:
                  type: string
              required: [topic]
expect:
  output:
    status: succeeded
    output: done
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {notes: {inbox: notes}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - arguments: {topic: a}
            id: call-1
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
        response_id: null
        usage: null
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: only the 2024 rows}
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: and cite them}
  - - node_step
    - chat
    - n: 2
      step: {call_id: call-1, is_error: false, kind: tool_result, output: found a}
  - - node_step
    - chat
    - n: 3
      step:
        kind: steer
        from: [10, 11]
        inbox: notes
  - - node_step
    - chat
    - n: 4
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: done, type: text}
          role: assistant
        purpose: chat
        request_sha256: 02c0b5214f48e2f8554fa2ec2931bbc1080214d5c6db43b366be375e9279b86b
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - value: done
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [9, 12, 13, 14]}
  - - node_succeeded
    - chat
    - {commit: 15, messages: 16}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: done
  - - node_succeeded
    - __end__
    - {commit: 19}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {notes: {inbox: notes}}
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      name: lookup
      node_id: chat
      tool_call_id: call-1
      n: 1
  - - ToolCallFinished
    - call_index: 0
      name: lookup
      node_id: chat
      result: found a
      tool_call_id: call-1
      n: 1
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 3
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 3
  - - NodeSucceeded
    - node_id: chat
      output: done
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: done
  - - RunSucceeded
    - output: done
  stream:
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: done
    final: false
    key: text
    node_id: chat
    n: 3
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 3
    index: 1
  tool_calls:
    lookup:
    - args:
        topic: a
      attempt: 1
      call_id: r1/chat/1/0
      node: chat
