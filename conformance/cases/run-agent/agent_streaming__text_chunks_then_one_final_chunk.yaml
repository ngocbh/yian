# From tests/engine/test_agent_streaming.py::test_plain_agent_streams_text_chunks_then_one_final_chunk.
# A streamed text reply reaches the host chunk by chunk under its step's n, then one empty
# final chunk; a usage chunk carries no text, and ModelCallFinished reports its usage (5/3/8).
kind: run
rules: [run-log]
flow: |
  id: stream
  name: stream
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    writer:
      kind: agent
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${writer.output}
run:
  run_id: r1
  num_workers: 0
host:
  models:
    writer:
      agent:
      - chunks:
        - text: hello
        - text: ' big'
        - text: ' world'
        - usage:
            input_tokens: 5
            output_tokens: 3
            total_tokens: 8
        - finish: stop
expect:
  output:
    status: succeeded
    output: hello big world
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-test
          provider: anthropic
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: stop
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: hello big world, type: text}
          role: assistant
        purpose: chat
        request_sha256: 0c2d612474786e4d309464090eba530c35a97e3b3432cf6da0b668dd13355633
        response_id: null
        usage: {cache_read_tokens: null, input_tokens: 5, output_tokens: 3, reasoning_tokens: null}
  - - pool_commit
    - writer
    - value: hello big world
  - - node_succeeded
    - writer
    - {commit: 10}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: hello big world
  - - node_succeeded
    - __end__
    - {commit: 13}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: writer
  - - ModelCallStarted
    - model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
      usage:
        cache_creation_tokens: null
        cache_read_tokens: null
        input_tokens: 5
        output_tokens: 3
        reasoning_tokens: null
        total_tokens: 8
      n: 1
  - - NodeSucceeded
    - node_id: writer
      output: hello big world
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: hello big world
  - - RunSucceeded
    - output: hello big world
  stream:
  - chunk: hello
    final: false
    key: text
    node_id: writer
    n: 1
    index: 0
  - chunk: ' big'
    final: false
    key: text
    node_id: writer
    n: 1
    index: 1
  - chunk: ' world'
    final: false
    key: text
    node_id: writer
    n: 1
    index: 2
  - chunk: ''
    final: true
    key: text
    node_id: writer
    n: 1
    index: 3
