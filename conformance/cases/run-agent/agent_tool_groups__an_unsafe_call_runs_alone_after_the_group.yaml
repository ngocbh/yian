# TS-only (D29): Python runs a reply's tool calls one at a time.
# The reply calls [safe, safe, unsafe]: the two calls of the tool marked concurrency_safe start
# together; `save`, which isn't marked, waits for both to finish and runs alone. The next request
# holds the three tool messages in call order.
kind: run
rules: [run-log]
python_skip: concurrent tool calls are TS-only (D29)
flow: |
  id: groups
  name: groups
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    writer:
      kind: agent
      tools: [lookup, save]
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${writer.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      description: Look up a topic.
      concurrency_safe: true
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found:a
      - return: found:b
    save:
      description: Save a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: saved:c
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-a
            name: lookup
            arguments:
              topic: a
          - type: tool_call
            id: call-b
            name: lookup
            arguments:
              topic: b
          - type: tool_call
            id: call-c
            name: save
            arguments:
              topic: c
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: all done
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: call-a
              name: lookup
              arguments:
                topic: a
            - type: tool_call
              id: call-b
              name: lookup
              arguments:
                topic: b
            - type: tool_call
              id: call-c
              name: save
              arguments:
                topic: c
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-a
              name: lookup
              content: found:a
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-b
              name: lookup
              content: found:b
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-c
              name: save
              content: saved:c
          tools:
          - name: lookup
            description: Look up a topic.
            parameters:
              type: object
              properties:
                topic:
                  type: string
              required: [topic]
          - name: save
            description: Save a topic.
            parameters:
              type: object
              properties:
                topic:
                  type: string
              required: [topic]
expect:
  output:
    status: succeeded
    output: all done
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-test
          provider: anthropic
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - arguments: {topic: a}
            id: call-a
            name: lookup
            type: tool_call
          - arguments: {topic: b}
            id: call-b
            name: lookup
            type: tool_call
          - arguments: {topic: c}
            id: call-c
            name: save
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 1eefb4c12a64b7f25665183054e9e3d32bd28626a3c8106306e7afb9d60768bf
        response_id: null
        usage: null
  - - node_step
    - writer
    - n: 2
      step: {call_id: call-a, is_error: false, kind: tool_result, output: found:a}
  - - node_step
    - writer
    - n: 3
      step: {call_id: call-b, is_error: false, kind: tool_result, output: found:b}
  - - node_step
    - writer
    - n: 4
      step: {call_id: call-c, is_error: false, kind: tool_result, output: saved:c}
  - - node_step
    - writer
    - n: 5
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: all done, type: text}
          role: assistant
        purpose: chat
        request_sha256: 1b7e02a2f822aafbf24c854e410af50cc9434c933ca81c98b7908092cfc9e31a
        response_id: null
        usage: null
  - - pool_commit
    - writer
    - value: all done
  - - node_succeeded
    - writer
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: all done
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: writer
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      exchange_id: <id:1>
      name: lookup
      node_id: writer
      tool_call_id: call-a
  - - ToolCallStarted
    - arguments:
        topic: b
      call_index: 1
      exchange_id: <id:1>
      name: lookup
      node_id: writer
      tool_call_id: call-b
  - - ToolCallFinished
    - call_index: 0
      exchange_id: <id:1>
      name: lookup
      node_id: writer
      result: found:a
      tool_call_id: call-a
  - - ToolCallFinished
    - call_index: 1
      exchange_id: <id:1>
      name: lookup
      node_id: writer
      result: found:b
      tool_call_id: call-b
  - - ToolCallStarted
    - arguments:
        topic: c
      call_index: 2
      exchange_id: <id:1>
      name: save
      node_id: writer
      tool_call_id: call-c
  - - ToolCallFinished
    - call_index: 2
      exchange_id: <id:1>
      name: save
      node_id: writer
      result: saved:c
      tool_call_id: call-c
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
  - - NodeSucceeded
    - node_id: writer
      output: all done
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: all done
  - - RunSucceeded
    - output: all done
  stream:
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: writer
  - chunk: all done
    exchange_id: <id:2>
    final: false
    key: text
    node_id: writer
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: writer
  tool_calls:
    lookup:
    - args:
        topic: a
      attempt: 1
      call_id: r1/writer/1/0
      node: writer
    - args:
        topic: b
      attempt: 1
      call_id: r1/writer/1/1
      node: writer
    save:
    - args:
        topic: c
      attempt: 1
      call_id: r1/writer/1/2
      node: writer
