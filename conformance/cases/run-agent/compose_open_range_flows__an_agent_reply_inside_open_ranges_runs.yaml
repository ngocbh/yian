  - - NodeSucceeded
    - node_id: writer
      output:
        price: 9.5
        qty: 3
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        price: 9.5
        qty: 3
  - - RunSucceeded
    - output:
        price: 9.5
        qty: 3
