kind: run
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: openai, model: test-model}
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      long_term_memory: session
      prompt: ${question}
      input:
        question: ${input.question}
      output: str
  output: ${agent.output}
inputs:
  question: second
run:
  num_workers: 0
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: two
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: second
expect:
  output:
    status: succeeded
    output: two
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      inputs:
        question: second
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        question: second
  - [node_started, agent]
  - - node_succeeded
    - agent
    - value: two
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: two
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        question: second
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: test-model
      node_id: agent
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: test-model
      node_id: agent
      provider: openai
      purpose: chat
  - - NodeSucceeded
    - node_id: agent
      output: two
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: two
  - - RunSucceeded
    - output: two
  stream:
  - chunk: two
    exchange_id: <id:1>
    final: false
    key: text
    node_id: agent
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: agent
