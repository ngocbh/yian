kind: run
rules: [run-log]
flow: |
  id: chat
  name: chat
  llm_config: {provider: anthropic, model: claude-test}
  input:
    name: !str
    title: !str
    message: !str
  nodes:
    reply:
      kind: agent
      input: {name: "${input.name}", title: "${input.title}", message: "${input.message}"}
      system_prompt: "You are ${name}, ${title}. Speak as ${name} in the first person."
      prompt: ${message}
      output: str
    after:
      kind: agent
      input: {draft: "${reply.output}"}
      prompt: "polish: ${draft}"
      output: str
  output: ${after.output}
inputs:
  name: Ada
  title: CTO
  message: How are we doing?
run:
  num_workers: 0
host:
  models:
    reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: draft
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are Ada, CTO. Speak as Ada in the first person.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: How are we doing?
    after:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: final
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'polish: draft'
expect:
  output:
    status: succeeded
    output: final
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        after:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-test
          provider: anthropic
        reply:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-test
          provider: anthropic
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {message: "How are we doing?", name: Ada, title: CTO}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        message: How are we doing?
        name: Ada
        title: CTO
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, reply]
  - - node_step
    - reply
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: draft, type: text}
          role: assistant
        purpose: chat
        request_sha256: 112202a3a40c1e19e721585dc0f347141ff68ee83578433f73370cd1e06d0114
        response_id: null
        usage: null
  - - pool_commit
    - reply
    - value: draft
  - - node_succeeded
    - reply
    - {commit: 10}
  - [node_started, after]
  - - node_step
    - after
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: final, type: text}
          role: assistant
        purpose: chat
        request_sha256: 3f2e6dfade74abdc02f1c46c0473d69637516b5b1de3f3e9ceac764280623c18
        response_id: null
        usage: null
  - - pool_commit
    - after
    - value: final
  - - node_succeeded
    - after
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: final
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        message: How are we doing?
        name: Ada
        title: CTO
  - - NodeStarted
    - node_id: reply
  - - ModelCallStarted
    - model: claude-test
      node_id: reply
      provider: anthropic
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: claude-test
      node_id: reply
      provider: anthropic
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: reply
      output: draft
  - - NodeStarted
    - node_id: after
  - - ModelCallStarted
    - model: claude-test
      node_id: after
      provider: anthropic
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: claude-test
      node_id: after
      provider: anthropic
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: after
      output: final
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: final
  - - RunSucceeded
    - output: final
  stream:
  - chunk: draft
    final: false
    key: text
    node_id: reply
    index: 0
    n: 1
  - chunk: ''
    final: true
    key: text
    node_id: reply
    index: 1
    n: 1
  - chunk: final
    final: false
    key: text
    node_id: after
    index: 0
    n: 1
  - chunk: ''
    final: true
    key: text
    node_id: after
    index: 1
    n: 1
