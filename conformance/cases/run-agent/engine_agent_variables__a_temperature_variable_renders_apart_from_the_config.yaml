kind: run
flow: |
  id: variable_temperature
  name: variable_temperature
  input: {topic: !str }
  llm_config: {provider: ollama, model: test, ollama: {options: {temperature: 0.8}}}
  nodes:
    writer:
      kind: agent
      input: {topic: '${input.topic}'}
      variables:
        temperature: !float(0..1) 0.4
      prompt: '${topic}: ${temperature}'
      output: str
  output: ${writer.output}
inputs:
  topic: reefs
run:
  num_workers: 0
host:
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: answer
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'reefs: 0.4'
expect:
  output:
    status: succeeded
    output: answer
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          model: test
          ollama:
            options:
              temperature: 0.8
          provider: ollama
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: reefs}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: reefs
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test
        output:
          format: yian.message.v1
          parts:
          - {text: answer, type: text}
          role: assistant
        purpose: chat
        request_sha256: e128fd6ee78fb6ed40123e4abd1503c7ea0c7323f370858fd95af9cc34f085ef
        response_id: null
        usage: null
  - - pool_commit
    - writer
    - value: answer
  - - pool_commit
    - writer
    - {key: writer.new_messages, steps: [9]}
  - - node_succeeded
    - writer
    - {commit: 10, messages: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: answer
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: reefs
  - - NodeStarted
    - node_id: writer
  - - ModelCallStarted
    - model: test
      node_id: writer
      provider: ollama
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: test
      node_id: writer
      provider: ollama
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: writer
      output: answer
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: answer
  - - RunSucceeded
    - output: answer
  stream:
  - chunk: answer
    final: false
    key: text
    node_id: writer
    index: 0
    n: 1
  - chunk: ''
    final: true
    key: text
    node_id: writer
    index: 1
    n: 1
