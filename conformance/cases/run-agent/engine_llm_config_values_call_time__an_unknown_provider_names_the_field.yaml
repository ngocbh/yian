kind: run
flow: |
  id: f
  name: f
  typedefs:
    Some: Literal(openai, nope)
  nodes:
    pick: {kind: code, output: Some, code: "return 'nope'"}
    chat:
      kind: agent
      prompt: Go.
      llm_config: {provider: '${pick.output}', model: m}
  output: ${chat.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [10, 28, 10, 44]
      message: 'node ''chat'' llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
      node: chat
  trace:
  - - run_started
    - null
    - call_time_llm:
        agents:
          chat: {}
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - - pool_commit
    - pick
    - value: nope
  - - node_succeeded
    - pick
    - {commit: 9}
  - [node_started, chat]
  - - node_failed
    - chat
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [10, 28, 10, 44]
        message: 'node ''chat'' llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: chat
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: pick
  - - NodeSucceeded
    - node_id: pick
      output: nope
  - - NodeStarted
    - node_id: chat
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [10, 28, 10, 44]
        message: 'node ''chat'' llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: chat
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [10, 28, 10, 44]
        message: 'node ''chat'' llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: chat
