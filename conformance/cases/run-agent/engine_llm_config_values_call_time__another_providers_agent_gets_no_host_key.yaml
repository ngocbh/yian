kind: run
rules: [run-log]
flow: |
  id: f
  name: f
  nodes:
    pick: {kind: code, output: str, code: "return 'anthropic'"}
    chat:
      kind: agent
      prompt: Go.
      llm_config: {provider: '${pick.output}', model: c}
  output: ${chat.output}
run:
  num_workers: 0
  llm_config:
    provider: openai
    api_key: <key:1>
    headers:
      X-Tenant: <key:2>
host:
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Go.
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - call_time_llm:
        agents:
          chat:
            provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - - pool_commit
    - pick
    - value: anthropic
  - - node_succeeded
    - pick
    - {commit: 9}
  - [node_started, chat]
  - - node_step
    - chat
    - step:
        effective_llm_config:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: c
          provider: anthropic
  - - pool_commit
    - chat
    - value: ok
  - - node_succeeded
    - chat
    - {commit: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 16}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: pick
  - - NodeSucceeded
    - node_id: pick
      output: anthropic
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: c
      node_id: chat
      provider: anthropic
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: c
      node_id: chat
      provider: anthropic
      purpose: chat
  - - NodeSucceeded
    - node_id: chat
      output: ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
  - - RunSucceeded
    - output: ok
  stream:
  - chunk: ok
    exchange_id: <id:2>
    final: false
    key: text
    node_id: chat
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: chat
