# TS yian (#1149): `dict(str, str)` reads as untyped `object`, so `.zzz` on a dict without it raises
# before the tag check; Python reads it as None, which breaks the tag.
kind: run
rules: [messages, null-field-read]
flow: |
  id: f
  name: f
  typedefs: {D: "dict(str, str)"}
  input:
    d: !D
    t: !float 1.0
  llm_config: {provider: openai}
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: !str '${input.d.zzz}'}
  output: ${chat.output}
inputs:
  d: {}
run:
  num_workers: 0
expect:
  raises:
    class: ValueError
    message: "node 'chat' llm_config.model: cannot read ${input.d.zzz}: input.d has no field 'zzz'"
  trace: []
  events: []
python_expect:
  raises:
    class: ValueError
    message: 'node ''chat'' llm_config.model: None does not match declared type str'
  trace: []
  events: []
