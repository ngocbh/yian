kind: run
rules: [messages]
flow: |
  id: f
  name: f
  input:
    cfg: !object
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: '${input.cfg}'
  output: ${chat.output}
inputs:
  cfg:
    model: m
    bogus: 1
run:
  num_workers: 0
expect:
  raises:
    class: LayerFieldError
    message: 'node ''chat'' llm_config: llm_config has unknown field(s) ["bogus"] (allowed: anthropic, api_key, azure, base_url, deepseek, glm, glm-cn, google, headers, minimax, minimax-cn, model, ollama, openai, openrouter, organization, project, provider, qwen, qwen-cn, vllm, xai)'
  trace: []
  events: []
python_expect:
  raises:
    class: LayerFieldError
    message: 'node ''chat'' llm_config: llm_config has unknown field(s) [''bogus''] (allowed: anthropic, api_key, azure, base_url, deepseek, glm, glm-cn, google, headers, minimax, minimax-cn, model, ollama, openai, openrouter, organization, project, provider, qwen, qwen-cn, vllm, xai)'
  trace: []
  events: []
