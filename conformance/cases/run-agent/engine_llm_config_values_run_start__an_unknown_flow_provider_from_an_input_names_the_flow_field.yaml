kind: run
flow: |
  id: f
  name: f
  input: {m: !str , p: !str }
  llm_config: {provider: '${input.p}', model: '${input.m}'}
  defs:
    child:
      nodes:
        a: {kind: agent, prompt: Go.}
        b: {kind: agent, prompt: Go., llm_config: {model: own-model}}
      output: ${a.output}
  nodes:
    top: {kind: agent, prompt: Top.}
    c:
      kind: call
      call: child
      input: {}
      depends_on: [top]
  output: ${c.output}
inputs:
  m: x
  p: nope
run:
  num_workers: 0
expect:
  raises:
    class: LayerFieldError
    message: 'flow llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
  trace: []
  events: []
