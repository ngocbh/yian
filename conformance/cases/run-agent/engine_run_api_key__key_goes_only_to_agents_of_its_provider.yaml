kind: run
rules: [run-log]
flow: |
  id: two
  name: two
  defs:
    body:
      nodes:
        nested: {kind: agent, prompt: hi, llm_config: {model: nested-model}}
      output: ${nested.output}
  nodes:
    inherits: {kind: agent, prompt: hi}
    child: {kind: call, call: body, depends_on: [inherits]}
    other:
      kind: agent
      prompt: hi
      depends_on: [inherits]
      llm_config: {provider: anthropic, model: claude-sonnet-4-5}
    optout:
      kind: agent
      prompt: hi
      depends_on: [other]
      llm_config: {inherit: false, provider: vllm, model: other-model}
  output: ${optout.output}
run:
  num_workers: 0
  llm_config:
    provider: vllm
    model: served-model
    api_key: <key:1>
host:
  models:
    inherits:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
    other:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
    optout:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
    child/nested:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        child/nested:
          _host_key: true
          model: nested-model
          provider: vllm
        inherits:
          _host_key: true
          model: served-model
          provider: vllm
        optout:
          _host_key: true
          model: other-model
          provider: vllm
        other:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-sonnet-4-5
          provider: anthropic
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, inherits]
  - - node_step
    - inherits
    - n: 1
      step:
        finish: null
        kind: model_call
        model: served-model
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - inherits
    - value: ok
  - - node_succeeded
    - inherits
    - {commit: 10}
  - [node_started, child]
  - - pool_commit
    - child
    - from: {}
      key: child/__start__
  - - node_expanded
    - child
    - prune_ids: []
  - [node_started, other]
  - - node_step
    - other
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-sonnet-4-5
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - other
    - value: ok
  - - node_succeeded
    - other
    - {commit: 17}
  - [node_started, child/__start__]
  - - node_succeeded
    - child/__start__
    - commit: 13
  - [node_started, optout]
  - - node_step
    - optout
    - n: 1
      step:
        finish: null
        kind: model_call
        model: other-model
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - optout
    - value: ok
  - - node_succeeded
    - optout
    - {commit: 23}
  - [node_started, child/nested]
  - - node_step
    - child/nested
    - n: 1
      step:
        finish: null
        kind: model_call
        model: nested-model
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - child/nested
    - value: ok
  - - node_succeeded
    - child/nested
    - {commit: 27}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 30}
  - [node_started, child/__end__]
  - - pool_commit
    - child/__end__
    - key: child
      from: {child/nested: 27}
  - - node_succeeded
    - child/__end__
    - {commit: 33}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: inherits
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: served-model
      node_id: inherits
      provider: vllm
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: served-model
      node_id: inherits
      provider: vllm
      purpose: chat
  - - NodeSucceeded
    - node_id: inherits
      output: ok
  - - NodeStarted
    - node_id: child
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: child
  - - NodeStarted
    - node_id: other
  - - ModelCallStarted
    - exchange_id: <id:3>
      model: claude-sonnet-4-5
      node_id: other
      provider: anthropic
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:3>
      model: claude-sonnet-4-5
      node_id: other
      provider: anthropic
      purpose: chat
  - - NodeSucceeded
    - node_id: other
      output: ok
  - - NodeStarted
    - node_id: child/__start__
  - - NodeSucceeded
    - node_id: child/__start__
      output: {}
  - - NodeStarted
    - node_id: optout
  - - ModelCallStarted
    - exchange_id: <id:4>
      model: other-model
      node_id: optout
      provider: vllm
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:4>
      model: other-model
      node_id: optout
      provider: vllm
      purpose: chat
  - - NodeSucceeded
    - node_id: optout
      output: ok
  - - NodeStarted
    - node_id: child/nested
  - - ModelCallStarted
    - exchange_id: <id:5>
      model: nested-model
      node_id: child/nested
      provider: vllm
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:5>
      model: nested-model
      node_id: child/nested
      provider: vllm
      purpose: chat
  - - NodeSucceeded
    - node_id: child/nested
      output: ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
  - - NodeStarted
    - node_id: child/__end__
  - - NodeSucceeded
    - commit_as: child
      node_id: child/__end__
      output: ok
  - - RunSucceeded
    - output: ok
  stream:
  - chunk: ok
    exchange_id: <id:2>
    final: false
    key: text
    node_id: inherits
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: inherits
  - chunk: ok
    exchange_id: <id:3>
    final: false
    key: text
    node_id: other
  - chunk: ''
    exchange_id: <id:3>
    final: true
    key: text
    node_id: other
  - chunk: ok
    exchange_id: <id:4>
    final: false
    key: text
    node_id: optout
  - chunk: ''
    exchange_id: <id:4>
    final: true
    key: text
    node_id: optout
  - chunk: ok
    exchange_id: <id:5>
    final: false
    key: text
    node_id: child/nested
  - chunk: ''
    exchange_id: <id:5>
    final: true
    key: text
    node_id: child/nested
