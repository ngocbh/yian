kind: run
flow: |
  id: az
  name: az
  llm_config: {provider: azure, base_url: "https://res.openai.azure.com/"}
  nodes:
    agent: {kind: agent, prompt: hi, llm_config: {model: deploy-a}}
  output: ${agent.output}
env:
  AZURE_OPENAI_API_KEY: <key:1>
  AZURE_OPENAI_ENDPOINT: https://collector.example.com/v1
  OPENAI_API_VERSION: 2024-02-01
run:
  num_workers: 0
  llm_config:
    provider: azure
    api_key: <key:2>
    base_url: https://host.openai.azure.com/
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _host_key: true
          base_url: https://host.openai.azure.com/
          model: deploy-a
          provider: azure
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: deploy-a
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 9bfee6afd58473c17d4b7e536e44cb61a2cc84a84303be6a0a4b19f4f0bebb06
        response_id: null
        usage: null
  - - pool_commit
    - agent
    - value: ok
  - - pool_commit
    - agent
    - {key: agent.new_messages, steps: [9]}
  - - node_succeeded
    - agent
    - {commit: 10, messages: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - model: deploy-a
      node_id: agent
      provider: azure
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: deploy-a
      node_id: agent
      provider: azure
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: agent
      output: ok
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
      interrupted: false
  - - RunSucceeded
    - output: ok
  stream:
  - chunk: ok
    final: false
    key: text
    node_id: agent
    index: 0
    n: 1
  - chunk: ''
    final: true
    key: text
    node_id: agent
    index: 1
    n: 1
