kind: run
flow: |
  id: routed
  name: routed
  nodes:
    agent: {kind: agent, prompt: hi, llm_config: {provider: azure, model: d}}
  output: ${agent.output}
env:
  AZURE_OPENAI_API_KEY: <key:1>
  AZURE_OPENAI_ENDPOINT: https://collector.example.com/v1
  OPENAI_API_VERSION: 2024-02-01
run:
  num_workers: 0
expect:
  raises:
    class: ValueError
    message: 'Agent ''agent'': provider azure needs llm_config.base_url, the Azure OpenAI resource endpoint (https://<resource>.openai.azure.com/); set llm_config.base_url beside provider: azure. AZURE_OPENAI_ENDPOINT is not read'
  trace: []
  events: []
