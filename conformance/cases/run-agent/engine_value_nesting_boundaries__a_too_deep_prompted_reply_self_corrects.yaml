# The model entries carry no `request`: its schema instruction text spells the schema as each
# implementation lowers it (Python's `json.dumps` spacing, TS compact JSON).
kind: run
rules: [llm, run-log]
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: vllm, model: no-structured-sentinel}
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      prompt: ${question}
      input:
        question: ${input.question}
      retries: 1
      output: object
  output: ${agent.output}
inputs:
  question: q
run:
  num_workers: 0
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": "leaf"}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}'
      structured_retry:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"k": 1}}'
expect:
  output:
    status: succeeded
    output:
      k: 1
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: no-structured-sentinel
          provider: vllm
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {question: q}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        question: q
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - pool_commit
    - agent
    - value:
        k: 1
  - - node_succeeded
    - agent
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        k: 1
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        question: q
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
  - - ModelCallStarted
    - {exchange_id: <id:3>, model: no-structured-sentinel, node_id: agent, provider: vllm, purpose: structured_fallback}
  - - ModelCallFinished
    - {exchange_id: <id:3>, model: no-structured-sentinel, node_id: agent, provider: vllm, purpose: structured_fallback}
  - - NodeSucceeded
    - node_id: agent
      output:
        k: 1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        k: 1
  - - RunSucceeded
    - output:
        k: 1
python_expect:
  output:
    status: succeeded
    output:
      k: 1
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: no-structured-sentinel
          provider: vllm
      inputs:
        question: q
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        question: q
  - [node_started, agent]
  - - node_succeeded
    - agent
    - value:
        k: 1
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        k: 1
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        question: q
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
  - - NodeSucceeded
    - node_id: agent
      output:
        k: 1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        k: 1
  - - RunSucceeded
    - output:
        k: 1
