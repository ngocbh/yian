kind: run
rules: [llm]
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: openai, model: gpt-4o}
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      prompt: ${question}
      input:
        question: ${input.question}
      retries: 1
      output: object
  output: ${agent.output}
inputs:
  question: q
run:
  num_workers: 0
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": "leaf"}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}'
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: q
          schema:
            properties:
              value:
                additionalProperties: true
                type: object
            required: [value]
            type: object
      structured_retry:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"k": 1}}'
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: q
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'Your previous output was invalid: structured output at a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a.a: value nests deeper than 100 levels, the limit for a yian value (each record and list is a level). Respond with valid data matching the schema.'
          schema:
            properties:
              value:
                additionalProperties: true
                type: object
            required: [value]
            type: object
expect:
  output:
    status: succeeded
    output:
      k: 1
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-4o
          provider: openai
      inputs:
        question: q
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        question: q
  - [node_started, agent]
  - - node_succeeded
    - agent
    - value:
        k: 1
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        k: 1
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        question: q
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - NodeSucceeded
    - node_id: agent
      output:
        k: 1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        k: 1
  - - RunSucceeded
    - output:
        k: 1
