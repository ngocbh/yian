# From examples/chat.yaml.
# Turn 0's message takes the `else:` call to `respond`, whose AGENT gets the history as messages
# (the `prompt:` list style) and replies; `respond`'s output binding appends both messages. Turn
# 1's `/exit` takes the `exited` entry, and the loop stops on `not exited`.
# No `tool_calls`: docs/api.md's `ask_user` doesn't define the form of `answer_schema`.
kind: run
rules: [run-log]
python_skip: "the prompt: list style is TS-only (#1002)"
flow: |
  # chat — a turn-by-turn conversational REPL (agent without tools; deterministic history).
  #
  # The turn boundary is STRUCTURAL: HUMAN_INPUT feeds a CASE that picks the turn's record.
  # Exact exit text routes to the `exited` value entry, which keeps the history and sets
  # `exited: true`. Anything else calls `respond`, where the AGENT sends the history as messages
  # and replies; `respond`'s output binding appends the turn's two messages. The AGENT outputs only
  # its reply and a binding does the append, so the run log grows linearly with the conversation.
  # The `prompt:` list style is TS-only (#1002).
  id: chat
  name: chat
  description: A turn-by-turn conversational assistant (one model call per turn, no tools).

  typedefs:
    Msg:                    # one message of the history the AGENT sends
      role: Literal(user, assistant)
      text: str
    Turn: {history: list(Msg), exited: bool}   # the carried record, and each turn's result

  defs:
    respond:                # a CASE result is the routed node's output, so the reply chain is a def
      input: {history: !list(Msg), message: !str}
      nodes:
        reply:
          kind: agent
          input: {history: "${input.history}", message: "${input.message}"}
          output: str                      # only this turn's reply is recorded
          system_prompt: You are a helpful conversational assistant.
          prompt:
            - ${history}
            - user: ${message}
      output: !Turn
        history: ${input.history + [Msg(role="user", text=input.message), Msg(role="assistant", text=reply.output)]}
        exited: false

    turn:                   # body: 'a -> 'a over {history, exited}
      input: {history: !list(Msg), exited: !bool}
      nodes:
        ask: {kind: human_input, prompt: "You:", output: str}
        exited: !Turn {history: "${input.history}", exited: true}   # a value entry: the exit record
        route:
          kind: case
          on: ${ask.output}
          cases: [{when: /exit, then: exited}, {when: /quit, then: exited}]
          else: call(respond, history=${input.history}, message=${ask.output})
      output: !Turn ${route.output}   # whichever branch ran; the tag types it as the record

  nodes:
    chat: {kind: loop, call: turn, input: {history: [], exited: false}, while: not exited}
  output: ${chat.output.history}
env: {OPENAI_API_KEY: "<key:1>"}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  # Each turn's HUMAN_INPUT, by expanded id: one message, then the exit text.
  human:
    "chat#0/ask": [Hi]
    "chat#1/ask": [/exit]
  models:
    "chat#0/__call_0/reply":
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "Hello! How can I help?"}]
expect:
  output:
    status: succeeded
    output:
      - {role: user, text: Hi}
      - {role: assistant, text: "Hello! How can I help?"}
  trace:
    - [run_started, null, {effective_llm_by_static_path: {chat/__call_0/reply: {_connection: {endpoint: https://api.openai.com/v1, method: api_key, source: environment}, model: gpt-5.5, provider: openai}}, learnable: false, num_workers: 0}]
    - - pool_commit
      - __start__
      - {key: system.now}
    - - pool_commit
      - __start__
      - {key: system.run_id, value: r1}
    - - pool_commit
      - __start__
      - {key: system.today}
    - - pool_commit
      - __start__
      - value: {}
    - [node_started, __start__]
    - - pool_commit
      - __start__
      - value: {}
    - - node_succeeded
      - __start__
      - {commit: 6}
    - [node_started, chat]
    - - pool_commit
      - chat
      - from: {}
        key: chat#0/__start__
    - - node_expanded
      - chat
      - prune_ids: []
    - [node_started, chat#0/__start__]
    - - node_succeeded
      - chat#0/__start__
      - {commit: 9}
    - [node_started, chat#0/ask]
    - - pool_commit
      - chat#0/ask
      - {value: Hi}
    - - node_succeeded
      - chat#0/ask
      - {commit: 14}
    - [node_started, chat#0/route]
    - - node_routed
      - chat#0/route
      - {handle: '#else'}
    - [node_started, chat#0/__call_0]
    - - pool_commit
      - chat#0/__call_0
      - from: {chat#0/__start__: 9, chat#0/ask: 14}
        key: chat#0/__call_0/__start__
    - - node_expanded
      - chat#0/__call_0
      - prune_ids: []
    - [node_started, chat#0/__call_0/__start__]
    - - node_succeeded
      - chat#0/__call_0/__start__
      - {commit: 19}
    - [node_started, chat#0/__call_0/reply]
    - - node_step
      - chat#0/__call_0/reply
      - n: 1
        step:
          finish: null
          kind: model_call
          model: gpt-5.5
          output:
            format: yian.message.v1
            parts:
              - {text: "Hello! How can I help?", type: text}
            role: assistant
          purpose: chat
          request_sha256: ed99023b61c8c609346ad7da086201e12ce8eb58a64d9e8bb91e23bbcabea198
          response_id: null
          usage: null
    - - pool_commit
      - chat#0/__call_0/reply
      - {value: "Hello! How can I help?"}
    - - node_succeeded
      - chat#0/__call_0/reply
      - {commit: 25}
    - [node_started, chat#0/__call_0/__end__]
    - - pool_commit
      - chat#0/__call_0/__end__
      - from: {chat#0/__call_0/__start__: 19, chat#0/__call_0/reply: 25}
