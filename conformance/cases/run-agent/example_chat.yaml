                + "\n\nAssistant: " + inputs["reply"],
                "exited": False,
            }
      output: ${fold.output}

    turn:                   # body: 'a -> 'a over {transcript, exited}
      input:
        transcript: !str
        exited: !bool
      nodes:
        ask:
          kind: human_input       # blocks a worker until the broker returns the message
          prompt: "You:"
          output: str
        exited: !Turn             # a value entry: the exit record itself
          transcript: ${input.transcript}
          exited: true
        route:
          kind: case
