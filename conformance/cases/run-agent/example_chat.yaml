# From examples/chat.yaml.
# One turn: the host sends "Hi" to the `messages` inbox, the turn's `take` reads it, `respond`'s
# AGENT replies, and its output binding appends both messages to the history; closing the inbox
# routes the next turn to the `exited` value entry and ends the loop.
kind: run
rules: [run-log]
python_skip: "host.sends drives inbox runs, which Python yian doesn't have (#1025)"
flow: |
  # chat — a turn-by-turn conversational assistant (agent without tools; deterministic history).
  #
  # The host sends each line the user types to the `messages` inbox; each turn's `take` waits for
  # them and takes everything sent since the last turn. Closing the inbox (/exit in `yian chat`)
  # ends the loop once the queued messages are answered: a closed inbox with nothing left routes
  # to the `exited` value entry, which keeps the history and sets `exited: true`. Anything else
  # calls `respond`, where the AGENT sends the history as messages and replies; `respond`'s output
  # binding appends the turn's two messages. The AGENT outputs only its reply and a binding does
  # the append, so the run log grows linearly with the conversation.
  # The `prompt:` list style, `Inbox(str)` and `take` are TS-only.
  id: chat
  name: chat
  description: A turn-by-turn conversational assistant (one model call per turn, no tools).

  input:
    messages: !Inbox(str)

  typedefs:
    Msg:                    # one message of the history the AGENT sends
      role: Literal(user, assistant)
      text: str
    Turn: {history: list(Msg), exited: bool}   # the carried record, and each turn's result

  defs:
    respond:                # a CASE result is the routed node's output, so the reply chain is a def
      input: {history: !list(Msg), message: !str}
      nodes:
        reply:
          kind: agent
          input:
            history: ${input.history}
            message: ${input.message}
          output: str                      # only this turn's reply is recorded
          system_prompt: You are a helpful conversational assistant.
          prompt:
            - ${history}
            - user: ${message}
      output: !Turn
        history: ${input.history + [Msg(role="user", text=input.message), Msg(role="assistant", text=reply.output)]}
        exited: false

    turn:                   # body: 'a -> 'a over {history, exited, messages}
      input:
        history: !list(Msg)
        exited: !bool
        messages: !Inbox(str)
      nodes:
        heard:
          kind: tool
          tool_id: take                    # waits until a message arrives or the inbox closes
          input:
            from: ${input.messages}
            take: all
        exited: !Turn                      # a value entry: the exit record
          history: ${input.history}
          exited: true
        route:
          kind: case
          cases:
            - when: ${heard.output.events == []}   # closed, nothing left to answer
              then: exited
          else: call(respond, history=${input.history}, message=${join(heard.output.events, "\n")})
      output: !Turn ${route.output}   # whichever branch ran; the tag types it as the record

  nodes:
    chat:
      kind: loop
      call: turn
      input:
        history: []
        exited: false
        messages: ${input.messages}
      while: not exited
  output: ${chat.output.history}
env: {OPENAI_API_KEY: "<key:1>"}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  # Each line the user types, sent to the `messages` inbox; closing it ends the chat.
  sends:
    - {inbox: messages, event: Hi}
    - {close: messages}
  models:
    "chat#0/__call_0/reply":
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "Hello! How can I help?"}]
expect:
  output:
    status: succeeded
    output:
      - {role: user, text: Hi}
      - {role: assistant, text: "Hello! How can I help?"}
  trace:
    - [run_started, null, {effective_llm_by_static_path: {chat/__call_0/reply: {_connection: {endpoint: https://api.openai.com/v1, method: api_key, source: environment}, model: gpt-5.5, provider: openai}}, learnable: false, num_workers: 0}]
    - - pool_commit
      - __start__
      - {key: system.now}
    - - pool_commit
      - __start__
      - {key: system.run_id, value: r1}
    - - pool_commit
      - __start__
      - {key: system.today}
    - - pool_commit
      - __start__
      - value: {}
    - [node_started, __start__]
    - - pool_commit
      - __start__
      - value: {messages: {inbox: messages}}
    - - node_succeeded
      - __start__
      - {commit: 6}
    - [node_started, chat]
    - - pool_commit
      - chat
      - from: {__start__: 6}
        key: chat#0/__start__
    - - node_expanded
      - chat
      - prune_ids: []
    - [node_started, chat#0/__start__]
    - - node_succeeded
      - chat#0/__start__
      - {commit: 9}
    - [node_started, chat#0/heard]
    - - node_waiting
      - chat#0/heard
      - {call_ids: [r1/chat#0/heard], waits: [{call_id: r1/chat#0/heard, inbox: messages, mode: all, tool: take}]}
    - - run_waiting
      - null
      - {node_ids: [chat#0/heard]}
    - [pool_commit, __start__, {key: __start__.messages, value: Hi}]
    - [node_woken, chat#0/heard]
    - [pool_commit, chat#0/heard, {closed: false, events: [16], inbox: messages}]
    - [node_succeeded, chat#0/heard, {commit: 18}]
    - [node_started, chat#0/route]
    - - node_routed
      - chat#0/route
      - {handle: '#else'}
    - [node_started, chat#0/__call_0]
    - - pool_commit
      - chat#0/__call_0
      - from: {chat#0/__start__: 9, chat#0/heard: 18}
        key: chat#0/__call_0/__start__
    - - node_expanded
      - chat#0/__call_0
      - prune_ids: []
    - [node_started, chat#0/__call_0/__start__]
    - - node_succeeded
      - chat#0/__call_0/__start__
      - {commit: 23}
    - [node_started, chat#0/__call_0/reply]
    - - node_step
      - chat#0/__call_0/reply
      - n: 1
        step:
          finish: null
          kind: model_call
          model: gpt-5.5
          output:
            format: yian.message.v1
            parts:
              - {text: "Hello! How can I help?", type: text}
            role: assistant
          purpose: chat
          request_sha256: ed99023b61c8c609346ad7da086201e12ce8eb58a64d9e8bb91e23bbcabea198
          response_id: null
          usage: null
    - - pool_commit
      - chat#0/__call_0/reply
      - {value: "Hello! How can I help?"}
    - - node_succeeded
      - chat#0/__call_0/reply
      - {commit: 29}
    - [node_started, chat#0/__call_0/__end__]
    - - pool_commit
      - chat#0/__call_0/__end__
      - from: {chat#0/__call_0/__start__: 23, chat#0/__call_0/reply: 29}
        key: chat#0/__call_0
    - - node_succeeded
      - chat#0/__call_0/__end__
      - {commit: 32}
    - [node_started, chat#0/__end__]
    - - pool_commit
      - chat#0/__end__
      - from: {chat#0/__call_0: 32}
    - - node_succeeded
      - chat#0/__end__
      - {commit: 35}
    - [node_started, chat~1]
    - - pool_commit
      - chat~1
      - from: {chat#0/__end__: 35}
        key: chat#1/__start__
    - - node_expanded
      - chat~1
      - prune_ids: [chat#0/__call_0, chat#0/__end__, chat#0/__start__, chat#0/exited, chat#0/heard, chat#0/route, chat~1]
    - [node_started, chat#1/__start__]
    - - node_succeeded
      - chat#1/__start__
      - {commit: 38}
    - [node_started, chat#1/heard]
    - - node_waiting
      - chat#1/heard
      - {call_ids: [r1/chat#1/heard], waits: [{call_id: r1/chat#1/heard, inbox: messages, mode: all, tool: take}]}
    - - run_waiting
      - null
      - {node_ids: [chat#1/heard]}
    - [inbox_closed, null, {inbox: messages}]
    - [node_woken, chat#1/heard]
