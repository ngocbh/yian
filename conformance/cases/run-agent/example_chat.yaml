# From examples/chat.yaml.
# Turn 0's message takes the `else:` call to `respond`, whose AGENT reply is folded into the
# transcript; turn 1's `/exit` takes the `exited` entry, and the loop stops on `not exited`.
# Its header's `yian chat` is the Python CLI; TS yian drops that command.
# No `tool_calls`: docs/api.md's `ask_user` doesn't define the form of `answer_schema`.
kind: run
flow: |
  # chat — a turn-by-turn conversational REPL (agent without tools; deterministic transcript).
  #
  # The turn boundary is STRUCTURAL: HUMAN_INPUT feeds a CASE that picks the turn's record.
  # Exact exit text routes to the `exited` value entry, which keeps the transcript and sets
  # `exited: true`. Anything else calls `respond`, where the AGENT fills the reply and a CODE
  # node folds it into the transcript. The LLM only fills the reply.
  # Run it with:  yian chat examples/chat.yaml
  id: chat
  name: chat
  description: A turn-by-turn conversational assistant (one model call per turn, no tools).

  input:
    opening: !str            # seed transcript; the CLI passes "" (empty)

  typedefs:
    Turn:                   # the carried record, and each turn's result
      transcript: str
      exited: bool

  defs:
    respond:                # a CASE result is the routed node's output, so the reply chain is a def
      input:
        transcript: !str
        message: !str
      nodes:
        reply:
          kind: agent
          input:
            transcript: ${input.transcript}
            message:    ${input.message}
          output: str
          prompt: |-
            You are a helpful conversational assistant.

            Conversation so far:
            ${transcript}

            User: ${message}
        fold:
          kind: code
          input:
            transcript: ${input.transcript}
            message: ${input.message}
            reply: ${reply.output}
          output: Turn
          code: |
            return {
                "transcript": inputs["transcript"]
                + "\n\nUser: " + inputs["message"]
                + "\n\nAssistant: " + inputs["reply"],
                "exited": false,
            }
      output: ${fold.output}

    turn:                   # body: 'a -> 'a over {transcript, exited}
      input:
        transcript: !str
        exited: !bool
      nodes:
        ask:
          kind: human_input       # blocks a worker until the broker returns the message
          prompt: "You:"
          output: str
        exited: !Turn             # a value entry: the exit record itself
          transcript: ${input.transcript}
          exited: true
        route:
          kind: case
          on: ${ask.output}
          cases:
            - when: /exit
              then: exited
            - when: /quit
              then: exited
          else: call(respond, transcript=${input.transcript}, message=${ask.output})
      output: !Turn ${route.output}   # whichever branch ran; the tag types it as the record

  nodes:
    chat:
      kind: loop
      call: turn
      input:
        transcript: ${input.opening}
        exited: false                 # the `exited` entry sets true for exact /exit or /quit
      while: not exited               # a carried-field predicate
  output: ${chat.output.transcript}
# The CODE body differs by language: `flow` holds the TS body, this the Python one.
# Its `False` is `false` in the TS body.
python_flow: |
  # chat — a turn-by-turn conversational REPL (agent without tools; deterministic transcript).
  #
  # The turn boundary is STRUCTURAL: HUMAN_INPUT feeds a CASE that picks the turn's record.
  # Exact exit text routes to the `exited` value entry, which keeps the transcript and sets
  # `exited: true`. Anything else calls `respond`, where the AGENT fills the reply and a CODE
  # node folds it into the transcript. The LLM only fills the reply.
  # Run it with:  yian chat examples/chat.yaml
  id: chat
  name: chat
  description: A turn-by-turn conversational assistant (one model call per turn, no tools).

  input:
    opening: !str            # seed transcript; the CLI passes "" (empty)

  typedefs:
    Turn:                   # the carried record, and each turn's result
      transcript: str
      exited: bool

  defs:
    respond:                # a CASE result is the routed node's output, so the reply chain is a def
      input:
        transcript: !str
        message: !str
      nodes:
        reply:
          kind: agent
          input:
            transcript: ${input.transcript}
            message:    ${input.message}
          output: str
          prompt: |-
            You are a helpful conversational assistant.

            Conversation so far:
            ${transcript}

            User: ${message}
        fold:
          kind: code
          input:
            transcript: ${input.transcript}
            message: ${input.message}
            reply: ${reply.output}
          output: Turn
          code: |
