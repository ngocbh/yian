# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {opening: ""}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  # Each turn's HUMAN_INPUT, by expanded id: one message, then the exit text.
  human:
    "chat#0/ask": [Hi]
    "chat#1/ask": [/exit]
  models:
    "chat#0/__call_0/reply":
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "Hello! How can I help?"}]
expect:
  output: {status: succeeded, output: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"}
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          chat/__call_0/reply:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {opening: ''}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {opening: ""}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, chat]
    - [pool_commit, chat, {from: {__start__: 6}, key: chat#0/__start__, value: {exited: false, transcript: ''}}]
    - [node_expanded, chat, {seed: [{transcript: "", exited: false}, 0], prune_ids: []}]
    - [node_started, "chat#0/__start__"]
    - [node_succeeded, "chat#0/__start__", {commit: 9}]
    - [node_started, "chat#0/ask"]
    - [pool_commit, "chat#0/ask", {value: Hi}]
    - [node_succeeded, chat#0/ask, {commit: 14}]
    - [node_started, "chat#0/route"]
    # The `else:` route's handle is `#else` (docs/syntax.md, `case`).
    - [node_routed, "chat#0/route", {handle: "#else"}]
    # The inline `call(...)` is the generated CALL node `__call_0` (docs/syntax.md, Inline
    # `call(...)`); its child commits to it.
    - [node_started, "chat#0/__call_0"]
    - [pool_commit, chat#0/__call_0, {from: {chat#0/__start__: 9, chat#0/ask: 14}, key: chat#0/__call_0/__start__, value: {message: Hi, transcript: ''}}]
    - [node_expanded, "chat#0/__call_0", {seed: {transcript: "", message: Hi}, prune_ids: []}]
    - [node_started, "chat#0/__call_0/__start__"]
    - [node_succeeded, "chat#0/__call_0/__start__", {commit: 19}]
    - [node_started, "chat#0/__call_0/reply"]
    - [node_step, chat#0/__call_0/reply, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: "Hello! How can I help?", type: text}], role: assistant}, purpose: chat, request_sha256: e965285560ee73522c9ec1980d4ae0d0b8e0fa1108f514a7147eed671fcca09f, response_id: null, usage: null}}]
    - [pool_commit, "chat#0/__call_0/reply", {value: "Hello! How can I help?"}]
    - [node_succeeded, chat#0/__call_0/reply, {commit: 25}]
    - [node_started, "chat#0/__call_0/fold"]
    - - pool_commit
      - "chat#0/__call_0/fold"
      - value:
          transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"
          exited: false
    - [node_succeeded, chat#0/__call_0/fold, {commit: 28}]
    - [node_started, "chat#0/__call_0/__end__"]
    - - pool_commit
      - "chat#0/__call_0/__end__"
      - value:
          transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"
          exited: false
        key: chat#0/__call_0
        from: {chat#0/__call_0/fold: 28}
    - [node_succeeded, chat#0/__call_0/__end__, {commit: 31}]
    - [node_started, "chat#0/__end__"]
    - - pool_commit
      - "chat#0/__end__"
      - value:
          transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"
          exited: false
        from: {chat#0/__call_0: 31}
    - [node_succeeded, chat#0/__end__, {commit: 34}]
    # `docs/` doesn't give the LOOP driver ids (`<loop>~k`), the seed `[carried, k]` or
    # `prune_ids`; see src/yian/nodes/loop/node.py.
    - [node_started, chat~1]
    - [pool_commit, chat~1, {from: {chat#0/__end__: 34}, key: chat#1/__start__, value: {exited: false, transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"}}]
    - - node_expanded
      - chat~1
      - seed:
          - {transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?", exited: false}
          - 1
        prune_ids:
          - "chat#0/__call_0"
          - "chat#0/__end__"
          - "chat#0/__start__"
          - "chat#0/ask"
          - "chat#0/exited"
          - "chat#0/route"
          - chat~1
    - [node_started, "chat#1/__start__"]
    - - node_succeeded
      - "chat#1/__start__"
      - commit: 37
    - [node_started, "chat#1/ask"]
    - [pool_commit, "chat#1/ask", {value: /exit}]
    - [node_succeeded, chat#1/ask, {commit: 42}]
    - [node_started, "chat#1/route"]
    - [node_routed, "chat#1/route", {handle: exited}]
    # The value entry runs as a node under its own id (docs/syntax.md, How a value entry runs).
    - [node_started, "chat#1/exited"]
    - - pool_commit
      - "chat#1/exited"
      - value:
          transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"
          exited: true
    - [node_succeeded, chat#1/exited, {commit: 47}]
    - [node_started, "chat#1/__end__"]
    - - pool_commit
      - "chat#1/__end__"
      - value:
          transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"
          exited: true
        from: {chat#1/exited: 47}
    - [node_succeeded, chat#1/__end__, {commit: 50}]
    - [node_started, chat~2]
    # The stopping driver commits the carried record under the loop's own id.
    - - pool_commit
      - chat~2
      - value:
          transcript: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"
          exited: true
        key: chat
        from: {chat#1/__end__: 50}
    - [node_succeeded, chat~2, {commit: 53}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: "\n\nUser: Hi\n\nAssistant: Hello! How can I help?"}]
    - [node_succeeded, __end__, {commit: 56}]
