    - {inbox: owner_messages, event: {role: user, parts: [{type: text, text: "Message 2: mmmmmmmmmmmmmmmmmmm"}]}}
    - {inbox: owner_messages, event: {role: user, parts: [{type: text, text: "Message 3: mmmmmmmmmmmmmmmmmmm"}]}}
