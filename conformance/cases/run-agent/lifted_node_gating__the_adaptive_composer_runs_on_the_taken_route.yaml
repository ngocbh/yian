# From tests/engine/test_lifted_node_gating.py::test_adaptive_composer_runs_on_the_taken_route.
# On the taken CASE route, the ask's synthetic composer AGENT `ask__compose` makes one
# structured call (consumer `compose`); its one question (header DB) reaches the host's
# ask from node `ask` (its question is the ask's prompt), and the answer is the ask's
# output: {r: {DB: Postgres}}.
kind: run
flow: |
  id: t
  name: t
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    go: !bool
  nodes:
    router:
      kind: case
      cases:
        - when: ${input.go}
          then: ask
      else: done
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "Pick one"
        ctx: ${input.go}
      adaptive_questions:
        prompt: "Design one question for: ${ctx}"
    done:
      kind: code
      output: str
      code: return "done"
  output:
    r: ${router.output}
inputs:
  go: true
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask:
    - DB: Postgres
  models:
    ask__compose:
      compose:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"items": [{"question": "Which database?", "header": "DB", "options": [{"label": "Postgres", "description": "Relational."}], "multi_select": false}]}'
expect:
  output:
    status: succeeded
    output:
      r:
        DB: Postgres
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        ask__compose:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {go: true}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        go: true
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, router]
  - - node_routed
    - router
    - handle: ask
  - [node_started, ask__compose]
  - - node_step
    - ask__compose
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: "{\"items\": [{\"question\": \"Which database?\", \"header\": \"DB\", \"options\": [{\"label\": \"Postgres\", \"description\": \"Relational.\"}], \"multi_select\": false}]}", type: text}
          role: assistant
        purpose: structured_native
        request_sha256: 9c651b277a4fff05846391b1c43a6aac0a54382876c0af724af55cb400ea107c
        response_id: null
        usage: null
  - - pool_commit
    - ask__compose
    - value:
      - header: DB
        multi_select: false
        options:
        - description: Relational.
          label: Postgres
        question: Which database?
  - - pool_commit
    - ask__compose
    - {key: ask__compose.new_messages, steps: [11]}
  - - node_succeeded
    - ask__compose
    - {commit: 12, messages: 13}
  - [node_started, ask]
  - - pool_commit
    - ask
    - value:
        DB: Postgres
  - - node_succeeded
    - ask
    - {commit: 16}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        r:
          DB: Postgres
  - - node_succeeded
    - __end__
    - {commit: 19}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        go: true
      interrupted: false
  - - NodeStarted
    - node_id: router
  - - NodeRouted
    - handle: ask
      node_id: router
  - - NodeSkipped
    - node_id: done
  - - NodeStarted
    - node_id: ask__compose
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: ask__compose
      provider: openai
      purpose: structured_native
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: ask__compose
      provider: openai
      purpose: structured_native
      n: 1
  - - NodeSucceeded
    - node_id: ask__compose
      output:
      - header: DB
        multi_select: false
        options:
        - description: Relational.
          label: Postgres
        question: Which database?
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeSucceeded
    - node_id: ask
      output:
        DB: Postgres
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r:
          DB: Postgres
      interrupted: false
  - - RunSucceeded
    - output:
        r:
          DB: Postgres
  tool_calls:
    ask:
    - args:
        question: Pick one
        questions:
        - question: Which database?
          header: DB
          options:
          - {label: Postgres, description: Relational.}
          multi_select: false
        answer_schema:
        - {name: answer, type: object, required: true}
        node_id: ask
        ctx: true
      call_id: r1/ask
      attempt: 1
      node: ask
