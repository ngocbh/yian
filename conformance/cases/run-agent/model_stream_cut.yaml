kind: run
flow: |
  id: model-stream-cut
  name: model_stream_cut
  nodes:
    write:
      kind: agent
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Write a line."
  output: ${write.output}
env: {OPENAI_API_KEY: "<key:1>"}
run: {run_id: r1, num_workers: 0}
host:
  models:
    write:
      agent:
        - chunks: [{text: hel}, {text: lo}]
          raise: {class: ConnectionError, message: connection reset}
expect:
  # A provider error that isn't a refused credential fails the node as node.execute, with the
  # error's text.
  output:
    status: failed
    failure:
      code: node.execute
      message: connection reset
      node: write
      frames: [{label: flow.yaml, range: [4, 3, 4, 8]}]
  # The chunks shown before the failure, and no final chunk: the host discards that attempt's
  # partial text.
  stream:
    - {node_id: write, key: text, chunk: hel, final: false, n: 1, index: 0}
    - {node_id: write, key: text, chunk: lo, final: false, n: 1, index: 1}
