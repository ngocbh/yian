kind: run
rules: [run-log]
flow: |
  id: model-tool-loop
  name: model_tool_loop
  nodes:
    research:
      kind: agent
      tools: [lookup]
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Look up x."
  output: ${research.output}
env: {OPENAI_API_KEY: "<key:1>"}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      description: Look up a term.
      parameters:
        type: object
        properties: {q: {type: string}}
        required: [q]
      results:
        - return: X1
  models:
    research:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: tool_call, id: c1, name: lookup, arguments: {q: x}}]
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: found X1}]
          # The first request, then the reply's tool call and the tool's result, named after
          # its call; the bound tool as the model sees it.
          request:
            messages:
              - format: yian.message.v1
                role: system
                parts:
                  - type: text
                    text: >-
                      You are an analysis agent inside a larger workflow. Follow the
                      instructions precisely, use the available tools to gather any facts you
                      need, and return a clear, self-contained answer. Ask the user only
                      through an explicitly granted tool.
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: Look up x.}]
              - format: yian.message.v1
                role: assistant
                parts: [{type: tool_call, id: c1, name: lookup, arguments: {q: x}}]
              - format: yian.message.v1
                role: tool
                parts: [{type: tool_result, call_id: c1, name: lookup, content: X1}]
            tools:
              - name: lookup
                description: Look up a term.
                parameters:
                  type: object
                  properties: {q: {type: string}}
                  required: [q]
expect:
  output: {status: succeeded, output: found X1}
  # An AGENT tool call id is <run>/<node>/<n>/<index>, n the reply's model_call step.
  tool_calls:
    lookup:
      - {args: {q: x}, call_id: r1/research/1/0, attempt: 1, node: research}
