# TS-only: a spliced history whose tool call has no result before the next user message isn't a
# conversation a model route can send, so the node fails before any model call.
kind: run
flow: |
  id: chat
  name: chat
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    history: !list(Message)
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        history: ${input.history}
        message: ${input.message}
      output: str
      system_prompt: You are a helpful conversational assistant.
      prompt:
        - ${history}
        - user: ${message}
  output: ${reply.output}
inputs:
  history:
  - role: user
    parts:
    - {type: text, text: Read a.txt}
  - role: assistant
    parts:
    - {type: tool_call, id: c1, name: read_file, arguments: {path: a.txt}}
  message: again
run: {run_id: r1, num_workers: 0}
host:
  models:
    reply:
      agent: []
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: "node 'reply' prompt[0]: rendered message 1: tool call 'c1' (read_file) has no result before the next user message"
      node: reply
      frames: [{label: flow.yaml, range: [8, 3, 8, 8]}]
