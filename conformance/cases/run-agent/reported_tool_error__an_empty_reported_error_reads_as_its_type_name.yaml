# From tests/engine/test_reported_tool_error.py::test_an_empty_reported_error_reads_as_its_type_name.
# A ReportedToolError with no message reads as its type name: the model gets a tool_result whose
# content is "ReportedToolError" (the test's subclass NotFound reads "NotFound"; a stub raises
# the class itself), with is_error true, and the run succeeds.
kind: run
flow: |
  id: reported
  name: reported
  llm_config: {provider: openai, model: test-model}
  nodes:
    worker:
      kind: agent
      system_prompt: Help.
      prompt: go
      tools: [read_file]
      output: str
  output: ${worker.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    read_file:
      description: Read one file.
      parameters:
        type: object
        properties:
          path:
            type: string
      results:
      - raise:
          class: ReportedToolError
          message: ''
  models:
    worker:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: c0
            name: read_file
            arguments:
              path: a.txt
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: the file is missing
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: go
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: c0
              name: read_file
              arguments:
                path: a.txt
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: c0
              name: read_file
              content: ReportedToolError
              is_error: true
          tools:
          - name: read_file
            description: Read one file.
            parameters:
              type: object
              properties:
                path:
                  type: string
expect:
  output:
    status: succeeded
    output: the file is missing
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        worker:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, worker]
  - - node_step
    - worker
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - arguments: {path: a.txt}
            id: c0
            name: read_file
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 30f869a441bc0c613f8ed3397486487dcbbf31cd7f50c74a8d8032f5e68bc6ba
        response_id: null
        usage: null
  - - node_step
    - worker
    - n: 2
      step: {call_id: c0, is_error: true, kind: tool_result, output: ReportedToolError}
  - - node_step
    - worker
    - n: 3
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - {text: the file is missing, type: text}
          role: assistant
        purpose: chat
        request_sha256: a274497ce5a235e35f3a0ac775af5b60b8a856aa5c63914c4816b405336983fa
        response_id: null
        usage: null
  - - pool_commit
    - worker
    - value: the file is missing
  - - pool_commit
    - worker
    - {key: worker.new_messages, steps: [9, 10, 11]}
  - - node_succeeded
    - worker
    - {commit: 12, messages: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: the file is missing
  - - node_succeeded
    - __end__
    - {commit: 16}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: worker
  - - ModelCallStarted
    - model: test-model
      node_id: worker
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: test-model
      node_id: worker
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        path: a.txt
      call_index: 0
      name: read_file
      node_id: worker
      tool_call_id: c0
      n: 1
  - - ToolCallFinished
    - call_index: 0
      error: ReportedToolError
      name: read_file
      node_id: worker
      tool_call_id: c0
      n: 1
  - - ModelCallStarted
    - model: test-model
      node_id: worker
      provider: openai
      purpose: chat
      n: 3
  - - ModelCallFinished
    - model: test-model
      node_id: worker
      provider: openai
      purpose: chat
      n: 3
  - - NodeSucceeded
    - node_id: worker
      output: the file is missing
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: the file is missing
  - - RunSucceeded
    - output: the file is missing
  stream:
  - chunk: ''
    final: true
    key: text
    node_id: worker
    n: 1
    index: 0
  - chunk: the file is missing
    final: false
    key: text
    node_id: worker
    n: 3
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: worker
    n: 3
    index: 1
  tool_calls:
    read_file:
    - args:
        path: a.txt
      attempt: 1
      call_id: r1/worker/1/0
      node: worker
