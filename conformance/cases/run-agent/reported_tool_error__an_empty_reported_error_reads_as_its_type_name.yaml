# From tests/engine/test_reported_tool_error.py::test_an_empty_reported_error_reads_as_its_type_name.
# A ReportedToolError with no message reads as its type name: the model gets a tool_result whose
# content is "ReportedToolError" (the test's subclass NotFound reads "NotFound"; a stub raises
# the class itself), with is_error true, and the run succeeds.
kind: run
rules: [run-log]
flow: |
  id: reported
  name: reported
  llm_config: {provider: openai, model: test-model}
  nodes:
    worker:
      kind: agent
      system_prompt: Help.
      prompt: go
      tools: [read_file]
      output: str
  output: ${worker.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    read_file:
      description: Read one file.
      parameters:
        type: object
        properties:
          path:
            type: string
      results:
      - raise:
          class: ReportedToolError
          message: ''
  models:
    worker:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: c0
            name: read_file
            arguments:
              path: a.txt
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: the file is missing
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: go
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: c0
              name: read_file
              arguments:
                path: a.txt
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: c0
              name: read_file
              content: ReportedToolError
              is_error: true
          tools:
          - name: read_file
            description: Read one file.
            parameters:
              type: object
              properties:
                path:
                  type: string
expect:
  output:
    status: succeeded
    output: the file is missing
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        worker:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, worker]
  - - pool_commit
    - worker
    - value: the file is missing
  - - node_succeeded
    - worker
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: the file is missing
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: worker
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: test-model
      node_id: worker
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: test-model
      node_id: worker
      provider: openai
      purpose: chat
  - - ToolCallStarted
    - arguments:
        path: a.txt
      call_index: 0
      exchange_id: <id:1>
      name: read_file
      node_id: worker
      tool_call_id: c0
  - - ToolCallFinished
    - call_index: 0
      error: ReportedToolError
      exchange_id: <id:1>
      name: read_file
      node_id: worker
      tool_call_id: c0
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: test-model
      node_id: worker
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: test-model
      node_id: worker
      provider: openai
      purpose: chat
  - - NodeSucceeded
    - node_id: worker
      output: the file is missing
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: the file is missing
  - - RunSucceeded
    - output: the file is missing
  stream:
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: worker
  - chunk: the file is missing
    exchange_id: <id:2>
    final: false
    key: text
    node_id: worker
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: worker
  tool_calls:
    read_file:
    - args:
        path: a.txt
      attempt: 1
      call_id: r1/worker/<id:1>/0
      node: worker
