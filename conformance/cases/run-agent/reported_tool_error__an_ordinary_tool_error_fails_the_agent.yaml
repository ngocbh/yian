# Any other tool error fails the AGENT node with the error's message ("disk on fire") after one
# model call; the call's ToolCallFinished names the error by its type (RuntimeError).
kind: run
flow: |
  id: reported
  name: reported
  llm_config: {provider: openai, model: test-model}
  nodes:
    worker:
      kind: agent
      system_prompt: Help.
      prompt: go
      tools: [read_file]
      output: str
  output: ${worker.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    read_file:
      description: Read one file.
      parameters:
        type: object
        properties:
          path:
            type: string
      results:
      - raise:
          class: RuntimeError
          message: disk on fire
  models:
    worker:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: c0
            name: read_file
            arguments:
              path: a.txt
expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 9]
      message: disk on fire
      node: worker
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        worker:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, worker]
  - - node_step
    - worker
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - arguments: {path: a.txt}
            id: c0
            name: read_file
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 30f869a441bc0c613f8ed3397486487dcbbf31cd7f50c74a8d8032f5e68bc6ba
        response_id: null
        usage: null
  - - node_failed
    - worker
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 9]
        message: disk on fire
        node: worker
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: worker
  - - ModelCallStarted
    - model: test-model
      node_id: worker
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: test-model
      node_id: worker
      provider: openai
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        path: a.txt
      call_index: 0
      name: read_file
      node_id: worker
      tool_call_id: c0
      n: 1
  - - ToolCallFinished
    - call_index: 0
      error: RuntimeError
      name: read_file
      node_id: worker
      tool_call_id: c0
      n: 1
  - - NodeFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 9]
        message: disk on fire
        node: worker
  - - RunFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 9]
        message: disk on fire
        node: worker
  stream:
  - chunk: ''
    final: true
    key: text
    node_id: worker
    n: 1
    index: 0
  tool_calls:
    read_file:
    - args:
        path: a.txt
      attempt: 1
      call_id: r1/worker/1/0
      node: worker
