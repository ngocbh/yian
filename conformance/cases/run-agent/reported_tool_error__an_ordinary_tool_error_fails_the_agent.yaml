# From tests/engine/test_reported_tool_error.py::test_an_ordinary_tool_error_still_fails_the_agent_node.
# Also tests/engine/test_agent_live_events.py::test_tool_error_is_reported_by_type_then_fails_the_node.
# Any other tool error fails the AGENT node with the error's message ("disk on fire") after one
# model call; the call's ToolCallFinished names the error by its type (RuntimeError).
kind: run
rules: [run-log]
flow: |
  id: reported
  name: reported
  llm_config: {provider: openai, model: test-model}
  nodes:
    worker:
      kind: agent
      system_prompt: Help.
      prompt: go
      tools: [read_file]
      output: str
  output: ${worker.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    read_file:
      description: Read one file.
      parameters:
        type: object
        properties:
          path:
            type: string
      results:
      - raise:
          class: RuntimeError
          message: disk on fire
  models:
    worker:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: c0
            name: read_file
            arguments:
              path: a.txt
expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 9]
      message: disk on fire
      node: worker
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        worker:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, worker]
  - - node_failed
    - worker
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 9]
        message: disk on fire
        node: worker
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: worker
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: test-model
      node_id: worker
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: test-model
      node_id: worker
      provider: openai
      purpose: chat
  - - ToolCallStarted
    - arguments:
        path: a.txt
      call_index: 0
      exchange_id: <id:1>
      name: read_file
      node_id: worker
      tool_call_id: c0
  - - ToolCallFinished
    - call_index: 0
      error: RuntimeError
      exchange_id: <id:1>
      name: read_file
      node_id: worker
      tool_call_id: c0
  - - NodeFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 9]
        message: disk on fire
        node: worker
  - - RunFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 9]
        message: disk on fire
        node: worker
  stream:
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: worker
  tool_calls:
    read_file:
    - args:
        path: a.txt
      attempt: 1
      call_id: r1/worker/<id:1>/0
      node: worker
