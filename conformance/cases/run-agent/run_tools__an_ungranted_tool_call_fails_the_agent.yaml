# From tests/engine/test_run_tools.py::test_agent_grant_check_sees_expanded_group_names.
# (Also ::test_agent_cannot_call_a_per_run_tool_the_flow_did_not_grant).
# A model call to a tool the AGENT wasn't granted fails the node before anything runs: the
# message names the tool and the granted list ("requested tool 'shout', but it is not granted;
# granted tools: ['lookup']").
kind: run
flow: |
  id: grant
  name: grant
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    agent:
      kind: agent
      tools: [lookup]
      system_prompt: Help.
      prompt: go
      output: str
  output: ${agent.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
      results: []
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-1
            name: shout
            arguments:
              text: x
expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 8]
      message: 'agent node ''agent'' requested tool ''shout'', but it is not granted; granted tools: ["lookup"]'
      node: agent
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - arguments: {text: x}
            id: call-1
            name: shout
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: d3a6341473d5e7c672e605fbc57f782737f3dbd896ba6f07a1c850505c0d9ea2
        response_id: null
        usage: null
  - - node_failed
    - agent
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 8]
        message: 'agent node ''agent'' requested tool ''shout'', but it is not granted; granted tools: ["lookup"]'
        node: agent
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: agent
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: agent
      provider: openai
      purpose: chat
      n: 1
  - - NodeFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 8]
        message: 'agent node ''agent'' requested tool ''shout'', but it is not granted; granted tools: ["lookup"]'
        node: agent
  - - RunFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 8]
        message: 'agent node ''agent'' requested tool ''shout'', but it is not granted; granted tools: ["lookup"]'
        node: agent
  stream:
  - chunk: ''
    final: true
    key: text
    node_id: agent
    n: 1
    index: 0
