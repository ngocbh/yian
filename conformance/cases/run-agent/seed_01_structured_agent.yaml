    verdict: ${verdict.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: ACME}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    score:
      agent:
        # A record output is its own carrier: the reply's text is the record as JSON.
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"rating": 0.6, "rationale": "Demand is steady."}'}]
expect:
  output:
    status: succeeded
    output: {rating: 0.6, verdict: "positive (+0.60): Demand is steady."}
  trace:
    - - run_started
      - null
      - inputs: {topic: ACME}
        learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          score:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: ACME}}]
    - [node_started, score]
    - [node_succeeded, score, {value: {rating: 0.6, rationale: Demand is steady.}}]
    - [node_started, verdict]
    - [node_succeeded, verdict, {value: "positive (+0.60): Demand is steady."}]
    - [node_started, __end__]
    - [node_succeeded, __end__, {value: {rating: 0.6, verdict: "positive (+0.60): Demand is steady."}}]
