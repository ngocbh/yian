# From tests/seeds/03-research-one.yaml.
# A CODE leaf's record feeds an AGENT; the flow returns the AGENT's text and the given date.
kind: run
# `fetch_facts` returns the integral float 100.0 into a `list(float)`; TS stores the int 100 (an
# integral host number reads as an int and a float slot keeps it); `expect` leaves out the trace
# until the TS runtime can produce it, and `python_expect` pins Python's.
rules: [numbers, int-in-float]
flow: |
  # 03 — Single-topic research (a reusable child flow).
  #
  # A small CODE -> AGENT pipeline that researches ONE topic and returns {report, asof}.
  # This is the atomic unit; 04 (single call) and 05 (map) compose it. Shows: a CODE data-fetch
  # leaf (flat `code:`), ${input.X} + a typed parameter default (as_of), an
  # object output, and a node binding from another node's object field.

  id: research-one
  name: research_one
  description: Research a single topic into {report, asof} as of a date.

  input:
    topic: !str
    as_of: !date "2026-01-01"   # typed defaults must already satisfy their declared type

  nodes:
    fetch:
      kind: code
      input:
        topic: ${input.topic}
        as_of:  ${input.as_of}
      output:                    # an object: values + recent headlines
        values: list(float)
        news:   list(str)
      code: ./fixtures/seeds.ts:fetch_facts   # deterministic data pull

    synth:
      kind: agent
      input:
        topic: ${input.topic}
        asof:   ${input.as_of}
        values: ${fetch.output.values}          # dot into fetch's object output
        news:   ${fetch.output.news}
      output: str
      prompt: |-
        Write a neutral research brief for ${topic} as of ${asof}.
        Recent closes: ${values}. Headlines: ${news}.
        Cite the headlines as [n]. No recommendations.

  output:
    report: ${synth.output}
    asof:   ${input.as_of}
# The CODE reference differs by language: `flow` names the TS function, this the Python one.
python_flow: |
  # 03 — Single-topic research (a reusable child flow).
  #
  # A small CODE -> AGENT pipeline that researches ONE topic and returns {report, asof}.
  # This is the atomic unit; 04 (single call) and 05 (map) compose it. Shows: a CODE data-fetch
  # leaf (flat `code:`), ${input.X} + a typed parameter default (as_of), an
  # object output, and a node binding from another node's object field.

  id: research-one
  name: research_one
  description: Research a single topic into {report, asof} as of a date.

  input:
    topic: !str
    as_of: !date "2026-01-01"   # typed defaults must already satisfy their declared type

  nodes:
    fetch:
      kind: code
      input:
        topic: ${input.topic}
        as_of:  ${input.as_of}
      output:                    # an object: values + recent headlines
        values: list(float)
        news:   list(str)
      code: tests.seeds.fns:fetch_facts   # deterministic data pull

    synth:
      kind: agent
      input:
        topic: ${input.topic}
        asof:   ${input.as_of}
        values: ${fetch.output.values}          # dot into fetch's object output
        news:   ${fetch.output.news}
      output: str
      prompt: |-
        Write a neutral research brief for ${topic} as of ${asof}.
        Recent closes: ${values}. Headlines: ${news}.
        Cite the headlines as [n]. No recommendations.

  output:
    report: ${synth.output}
    asof:   ${input.as_of}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: ACME, as_of: "2026-01-15"}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    synth:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "ACME closed near 102 [1][2]."}]
expect:
  output:
    status: succeeded
    output: {report: "ACME closed near 102 [1][2].", asof: "2026-01-15"}
python_expect:
  output:
    status: succeeded
    output: {report: "ACME closed near 102 [1][2].", asof: "2026-01-15"}
  trace:
    - - run_started
      - null
      - inputs: {topic: ACME, as_of: "2026-01-15"}
        learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          synth:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: ACME, as_of: "2026-01-15"}}]
    - [node_started, fetch]
    - - node_succeeded
      - fetch
      - value:
          values: [100.0, 101.5, 99.75, 102.25]
          news: ["ACME: quarterly update", "ACME: reviewer note"]
    - [node_started, synth]
    - [node_succeeded, synth, {value: "ACME closed near 102 [1][2]."}]
    - [node_started, __end__]
    - [node_succeeded, __end__, {value: {report: "ACME closed near 102 [1][2].", asof: "2026-01-15"}}]
