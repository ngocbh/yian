# From tests/seeds/08-tool-news.yaml.
# A TOOL node calls a stub `get_facts` with a reference and a literal argument; an AGENT reads
# the tool's whole list value.
# The header's TOOL_REGISTRY key is the case's stub tool here.
kind: run
flow: |
  # 08 — TOOL: a direct, deterministic tool invocation.
  #
  # Pull recent news for a topic via a registered tool, then an AGENT summarizes.
  # Shows: kind: tool with flat tool_id (a TOOL_REGISTRY key) + `input` named by the tool's
  # arguments (bound like any node's inputs — ${...} or literal), the tool's whole value
  # consumed downstream, and the whole-string (typed) vs embedded (stringified) ${...}
  # distinction. This node declares no `output:`, so any JSON value or file passes; a date,
  # set, or model fails `contract.output`. With one, every returned value is checked
  # against it.

  id: tool-news
  name: tool_news
  description: Pull recent news for a topic via a registered tool, then summarize neutrally.

  input:
    topic: !str

  nodes:
    news:
      kind: tool
      tool_id: get_facts    # a real TOOL_REGISTRY key
      input:                       # the tool's argument names — each value is a ${...} ref or a literal
        symbol: ${input.topic}
        limit: 10

    summarize:
      kind: agent
      input:
        topic:   ${input.topic}
        articles: ${news.output}  # whole-string ${...} -> the tool's typed value (a list)
      output: str
      prompt: |-
        Summarize the key themes across these ${topic} news items in three neutral
        bullet points; cite item indices. No recommendations.
        ${articles}

  output: ${summarize.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: ACME}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  tools:
    get_facts:
      description: Recent news items for a symbol.
      parameters:
        type: object
        properties: {symbol: {type: string}, limit: {type: integer}}
        required: [symbol, limit]
      results:
        - return: ["ACME opens a plant", "ACME beats estimates"]
  models:
    summarize:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "- Growth [0]\n- Earnings [1]\n- Outlook [0][1]"}]
expect:
  output: {status: succeeded, output: "- Growth [0]\n- Earnings [1]\n- Outlook [0][1]"}
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          summarize:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: ACME}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: ACME}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, news]
    - [pool_commit, news, {value: ["ACME opens a plant", "ACME beats estimates"]}]
    - [node_succeeded, news, {commit: 9}]
    - [node_started, summarize]
    - [
        node_step,
        summarize,
        {
            n: 1,
            step:
              {
                finish: null,
                kind: model_call,
                model: gpt-5.5,
                output:
                  {
                    format: yian.message.v1,
                    parts:
                      [
                        {
                            text: '- Growth [0]

                              - Earnings [1]

                              - Outlook [0][1]',
                            type: text
                          }
                      ],
                    role: assistant
                  },
                purpose: chat,
                request_sha256: f39d069f85105f80b2c619b76439d4a9a72cce0d3a609e61a9b6be0d50d41bd1,
                response_id: null,
                usage: null
              }
          }
      ]
    - [pool_commit, summarize, {value: "- Growth [0]\n- Earnings [1]\n- Outlook [0][1]"}]
    - [pool_commit, summarize, {key: summarize.new_messages, steps: [12]}]
    - [node_succeeded, summarize, {commit: 13, messages: 14}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: "- Growth [0]\n- Earnings [1]\n- Outlook [0][1]"}]
    - [node_succeeded, __end__, {commit: 17}]
  # A TOOL node's call id is <run>/<node>.
  tool_calls:
    get_facts:
      - {args: {symbol: ACME, limit: 10}, call_id: r1/news, attempt: 1, node: news}
