# From tests/seeds/10-asserts-arithmetic.yaml.
# Node and flow asserts pass, and the `when:` with arithmetic and `and` holds, so `take` runs;
# `skip` is skipped and gets no model call.
kind: run
rules: [run-log]
flow: |
  # 10 — Arithmetic + boolean logic in when: / asserts:.
  #
  # A position-sizing gate. Shows: simple arithmetic (`* 100`) and boolean logic
  # (and / or / not / parens) inside a `case` `when:`, the `in` membership test, a
  # top-level `asserts:` block mixing arithmetic ranges with enum membership,
  # NODE-level `asserts:` on `score` (a per-node contract: bare `name` = a declared
  # input (PRE), `output` = the node's own value (POST)), and dataclass-style
  # defaults. Numbers only in arithmetic; no function calls. Conditions use the bare
  # spelling — `a > 5`, no `${}` — which is the canonical form.

  id: asserts-arithmetic
  name: asserts_arithmetic
  description: Position-sizing gate showcasing arithmetic + boolean logic in when:/asserts:.

  input:
    topic: !str
    window: !int 30           # calendar days (dataclass-style default)
    weight: !float 0.02           # fraction of capital in [0, 1]
    style: !str relevance

  nodes:
    score:
      kind: agent
      input:
        topic:   ${input.topic}
        window: ${input.window}
      output: float
      prompt: "Rate ${topic}'s ${window}-day relevance in [-1, 1]. Output only the number."
      asserts:                       # node-level (per-node contract): bare `name` = a declared
        - "window >= 1"            #   input (PRE — checked before the node runs)
        - "output >= -1 and output <= 1"  # `output` = this node's output (POST)

    size:
      kind: case
      cases:
        # arithmetic (weight * 100 = percent) + comparison + boolean `and`
        - when: "score.output > 0 and input.weight * 100 <= 5"
          then: take
      else: skip

    take:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Write a neutral two-sentence position rationale for ${topic}. No advice."

    skip:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Write a neutral two-sentence note on why ${topic} is passed for now. No advice."

  output:
    decision: ${take.output | skip.output}

  asserts:                       # any false fails the run
    - "input.window >= 5 and input.window <= 252"   # arithmetic range + `and`
    - "input.weight * 100 <= 10"                               # arithmetic
    - "input.style in [\"relevance\", \"value\", \"quality\"]" # enum membership (`in`)
    - "not (input.weight < 0)"                                  # `not` + parens
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: ACME, window: 30, weight: 0.02, style: relevance}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    score:
      agent:
        # A wrapped scalar's carrier: 0.4 is in [-1, 1] and above 0.
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"value": 0.4}'}]
    take:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME scores above zero. The weight is small.}]
expect:
  output: {status: succeeded, output: {decision: ACME scores above zero. The weight is small.}}
  # Run start resolves every AGENT, the skipped ones included; asserts that pass write no
  # record, and a skipped node writes none either.
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          score:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          take:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          skip:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {style: relevance, topic: ACME, weight: 0.02, window: 30}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: ACME, window: 30, weight: 0.02, style: relevance}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, score]
    - [node_step, score, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: '{"value": 0.4}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 8ff3d71f538d0ec7f512215cd49cc58a4d47e3b3ff7e734ccc310a1271cb4ba9, response_id: null, usage: null}}]
    - [pool_commit, score, {value: 0.4}]
    - [pool_commit, score, {key: score.new_messages, steps: [9]}]
    - [node_succeeded, score, {commit: 10, messages: 11}]
    - [node_started, size]
    - [node_routed, size, {handle: take}]
    - [node_started, take]
    - [node_step, take, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: ACME scores above zero. The weight is small., type: text}], role: assistant}, purpose: chat, request_sha256: 0555ec01231b956c0272459d33c9d70091624d70718e2dd199075304011d1927, response_id: null, usage: null}}]
    - [pool_commit, take, {value: ACME scores above zero. The weight is small.}]
    - [pool_commit, take, {key: take.new_messages, steps: [16]}]
    - [node_succeeded, take, {commit: 17, messages: 18}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: {decision: ACME scores above zero. The weight is small.}}]
    - [node_succeeded, __end__, {commit: 21}]
