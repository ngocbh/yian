# From tests/seeds/11-reuse-anchors.yaml.
# Three AGENTs merged from one anchored block share its provider and provider block; `judge`
# reads the other two's text.
# The header's PyYAML note describes the Python loader.
kind: run
flow: |
  # 11 — DRY reuse with YAML anchors + x- extension keys.
  #
  # Three near-identical AGENT nodes share one config block via a YAML anchor parked
  # under an x- key. Shows: x-* extension keys (ignored by the strict schema — custom
  # metadata + a holder for the anchor), &anchor / *alias / <<: merge, and llm_config.
  # The merge is pure YAML — PyYAML expands it before the engine sees the nodes.

  id: reuse-anchors
  name: reuse_anchors
  description: Pro/con/synthesis sharing one node config via a YAML anchor under x-.

  x-owner: ngocbh                  # custom metadata — opaque to the engine
  x-agent-defaults: &agent_defaults    # parked under x- so the strict schema ignores it
    kind: agent
    output: str
    llm_config:
      provider: anthropic
      anthropic:
        temperature: 0.2

  input:
    topic: !str

  nodes:
    pro:
      <<: *agent_defaults          # merge the shared block in (kind + outputs + llm_config)
      input:
        topic: ${input.topic}
      prompt: "Write a neutral two-sentence pro case for ${topic}. No advice."

    con:
      <<: *agent_defaults
      input:
        topic: ${input.topic}
      prompt: "Write a neutral two-sentence con case for ${topic}. No advice."

    judge:
      <<: *agent_defaults
      input:
        topic: ${input.topic}
        pro:   ${pro.output}
        con:   ${con.output}
      prompt: |-
        Given a pro case (${pro}) and a con case (${con}) for ${topic},
        write a neutral one-paragraph synthesis. No advice.

  output: ${judge.output}
# The merged `llm_config` names `anthropic` with no model, and run start needs one, so
# `run.llm_config` gives it; the node's own provider and `anthropic` block win over that layer.
# With no saved login, Python records a non-OpenAI provider's connection as from the environment
# with no endpoint, key or no key; the key is set so a real run could authenticate.
env: {ANTHROPIC_API_KEY: "<key:1>"}
inputs: {topic: ACME}
run: {run_id: r1, num_workers: 0, llm_config: {provider: anthropic, model: claude-opus-4-8}}
host:
  models:
    pro:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME grows. Margins widen.}]
    con:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME is costly. Rivals gain.}]
    judge:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME grows while rivals gain.}]
expect:
  output: {status: succeeded, output: ACME grows while rivals gain.}
  # For a provider other than OpenAI, Python records `source: environment` and `endpoint: null`
  # (src/yian/llm_clients/connection.py); `docs/` doesn't give these fields, and TS has to
  # record the same.
  trace:
    - - run_started
      - null
      - inputs: {topic: ACME}
        learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          pro:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.2}
            _connection: {method: api_key, source: environment, endpoint: null}
          con:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.2}
            _connection: {method: api_key, source: environment, endpoint: null}
          judge:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.2}
            _connection: {method: api_key, source: environment, endpoint: null}
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: ACME}}]
    - [node_started, pro]
    - [node_succeeded, pro, {value: ACME grows. Margins widen.}]
    - [node_started, con]
    - [node_succeeded, con, {value: ACME is costly. Rivals gain.}]
    - [node_started, judge]
    - [node_succeeded, judge, {value: ACME grows while rivals gain.}]
    - [node_started, __end__]
    - [node_succeeded, __end__, {value: ACME grows while rivals gain.}]
