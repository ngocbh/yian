# Run start resolves the AGENT's config even though it never runs: it has no `llm_config:`, so
# `run.llm_config` gives its provider and model; the key makes the recorded connection source
# `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: rates}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: 'record has unknown fields: ["news"]'
      node: fetch
      # The declared record `values: list(float)`, from line 34 to the next key.
      frames: [{label: flow.yaml, range: [34, 7, 35, 5]}]
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          note:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: rates}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: rates}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, warm_cache]
    - [pool_commit, warm_cache, {value: true}]
    - [node_succeeded, warm_cache, {commit: 9}]
    - [node_started, fetch]
    - - node_failed
      - fetch
      - failure:
          code: contract.output
          message: 'record has unknown fields: ["news"]'
          node: fetch
          frames: [{label: flow.yaml, range: [34, 7, 35, 5]}]
python_expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: "record has unknown fields: ['news']"
      node: fetch
      frames: [{label: flow.yaml, range: [34, 7, 35, 5]}]
  trace:
    - - run_started
      - null
      - inputs: {topic: rates}
        learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          note:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: rates}}]
    - [node_started, warm_cache]
    - [node_succeeded, warm_cache, {value: true}]
    - [node_started, fetch]
    - - node_failed
      - fetch
      - failure:
          code: contract.output
          message: "record has unknown fields: ['news']"
          node: fetch
          frames: [{label: flow.yaml, range: [34, 7, 35, 5]}]
