# From tests/seeds/14-agent-tools.yaml.
# A structured AGENT with tools runs its tool loop (a text reply, no tool call), then the
# structured call; the flow's own `llm_config:` (anthropic, with a provider block) is recorded.
kind: run
flow: |
  # 14 — AGENT knobs: tools, llm_config.
  #
  # An AGENT is more than a prompt — granted `tools` (TOOL_REGISTRY keys, vs a TOOL
  # *node* which is one direct call), it runs a tool loop and invokes them inside it.
  # The host-installed `ask_user` is an ordinary authored tool that blocks inside the
  # live loop. Shows: tools / llm_config and a structured (object) agent output.

  id: agent-tools
  name: agent_tools
  description: An AGENT running a tool loop with ordinary tools plus blocking ask_user.

  input:
    topic: !str

  nodes:
    reviewer:
      kind: agent
      tools: [get_web_data, web_search, ask_user]   # all explicit TOOL_REGISTRY grants
      llm_config:
        provider: anthropic
        model: claude-opus-4-8
        anthropic:
          temperature: 0.3
      input:
        topic: ${input.topic}
      output:                     # structured agent output (one object)
        claim: str
        confidence: float
      prompt: |-
        Research ${topic} with the available tools. If a key fact is ambiguous, ask
        the user. Return a neutral {claim, confidence in [0, 1]}. No recommendations.

  output:
    claim:     ${reviewer.output.claim}
    confidence: ${reviewer.output.confidence}
# The flow's `llm_config:` gives provider and model, so the run has no `llm_config`. With no saved
# login, Python records a non-OpenAI provider's connection as from the environment with no endpoint,
# key or no key; the key is set so a real run could authenticate.
env: {ANTHROPIC_API_KEY: "<key:1>"}
inputs: {topic: rates}
run: {run_id: r1, num_workers: 0}
host:
  # Stubs for the granted tools; the model calls none of them, so they have no results.
  tools:
    get_web_data:
      description: Fetch a web page.
      parameters:
        type: object
        properties: {url: {type: string}}
        required: [url]
      results: []
    web_search:
      description: Search the web.
      parameters:
        type: object
        properties: {query: {type: string}}
        required: [query]
      results: []
  # Installs `ask_user` for the grant; the model never asks.
  human: {}
  models:
    reviewer:
      agent:
        # The tool loop's one call: a text reply ends the loop.
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates held steady this quarter.}]
        # The structured call after the loop. A record output is its own carrier: the reply's
        # text is the record as JSON.
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"claim": "Rates held steady.", "confidence": 0.7}'}]
expect:
  output: {status: succeeded, output: {claim: Rates held steady., confidence: 0.7}}
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          reviewer:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.3}
            # For a provider other than OpenAI, Python records `source: environment` and
            # `endpoint: null` (src/yian/llm_clients/connection.py); `docs/` doesn't give these
            # fields, and TS has to record the same.
            _connection: {method: api_key, source: environment, endpoint: null}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: rates}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: rates}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, reviewer]
    - [node_step, reviewer, {n: 1, step: {finish: null, kind: model_call, model: claude-opus-4-8, output: {format: yian.message.v1, parts: [{text: Rates held steady this quarter., type: text}], role: assistant}, purpose: chat, request_sha256: 4e7506b6087d69e969bdcdfa00c47a9f1fcc9c26381aaf2ff6c80e11723fd711, response_id: null, usage: null}}]
    - [node_step, reviewer, {n: 2, step: {finish: null, kind: model_call, model: claude-opus-4-8, output: {format: yian.message.v1, parts: [{text: '{"claim": "Rates held steady.", "confidence": 0.7}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 2bfc05d15326df01ca6d2750c89f679403353ca89645094ef7201e5468f13845, response_id: null, usage: null}}]
    - [pool_commit, reviewer, {value: {claim: Rates held steady., confidence: 0.7}}]
    - [pool_commit, reviewer, {key: reviewer.new_messages, steps: [9, 10]}]
    - [node_succeeded, reviewer, {commit: 11, messages: 12}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: {claim: Rates held steady., confidence: 0.7}}]
    - [node_succeeded, __end__, {commit: 15}]
