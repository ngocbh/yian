# From tests/seeds/19-binding-stances.yaml.
# A score of 0.6 takes the `pro` branch: `con` is skipped, `pro_detail` runs with `pro`, and
# `assemble` binds every stance (plain, join, `:-`, a bare-ref default, `:?`).
# On `con`, `detail` is null, and a null span fails `assemble`'s strict prompt, so this takes `pro`.
kind: run
rules: [run-log]
flow: |
  # 19 — Input-binding stances: required, optional, branch-join, fail-loud, co-skip.
  #
  # Every way a node input can relate to its source, in one flow. Pins the per-input
  # readiness model:
  # a node runs iff EVERY input is satisfied, where an input is satisfied if its plain
  # ref is TAKEN, or a coalesce has >=1 alternative TAKEN, or it has a literal fallback.
  # So OPTIONALITY IS A PROPERTY OF THE BINDING (a fallback), not a flag:
  #
  #   ${x.output}                       required (plain)      -> co-skip if x was skipped
  #   ${x.output:-null}                 optional (default)    -> run anyway, bind null
  #   ${a.output | b.output}           branch-join           -> run if either ran
  #   ${a.output | b.output:-null}     join + survive        -> always runs
  #   ${x.output:?msg}                  required, fail-loud   -> run fails with msg
  #
  # Shows: a `case` branch, a node that CO-SKIPS with its branch (pro_detail), and an
  # assembler exercising every stance. Trace both branches to see co-skip vs optional.

  id: binding-stances
  name: binding_stances
  description: One flow exercising every input-binding stance (required / optional / join / fail-loud / co-skip).

  input:
    topic: !str
    as_of: !Optional(date)            # optional param — omitted -> null

  nodes:
    # --- roots: read only flow inputs, so they always run ---
    score:
      kind: agent
      input:
        topic: ${input.topic}
      output: float
      prompt: "Rate ${topic}'s near-term relevance in [-1, 1]. Output only the number."

    macro:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Write one neutral sentence on the macro backdrop for ${topic}. No advice."

    # --- the branch: exactly one of pro/con runs ---
    gate:
      kind: case
      cases:
        - when: "score.output >= 0.5"
          then: pro
      else: con

    pro:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Write a neutral 2-sentence pro case for ${topic}. No advice."

    con:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Write a neutral 2-sentence cautionary note for ${topic}. No advice."

    # --- co-skip: a plain (required) ref to a branch output. Runs ONLY in the pro
    #     branch; when gate routes to con, pro is skipped and pro_detail co-skips. ---
    pro_detail:
      kind: agent
      input:
        claim: ${pro.output}            # plain -> REQUIRED -> co-skips with pro
      output: str
      prompt: "Expand this pro claim into one extra neutral sentence: ${claim}"

    # --- the assembler: every stance in one node's inputs ---
    assemble:
      kind: agent
      input:
        backdrop: ${macro.output}                       # REQUIRED (plain) — macro always runs
        claim:   ${pro.output | con.output}         # BRANCH-JOIN — whichever branch ran
        detail:   ${pro_detail.output:-null}           # OPTIONAL — null when the pro branch didn't run
        when:     ${input.as_of :- system.today}        # OPTIONAL param — a bare-ref default
                                                         #   default: as_of, else the host clock
        topic:   ${input.topic:?"a topic is required"} # REQUIRED + FAIL-LOUD at the use site
                                                         #   (belt-and-suspenders: topic is already a required param)
      output: str
      prompt: |-
        Backdrop: ${backdrop}
        Claim: ${claim}
        Extra colour (may be empty): ${detail}
        As of: ${when}  ·  Topic: ${topic}
        Compose one neutral paragraph from the above. No recommendations advice.

  output: ${assemble.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
# `as_of` is given, so `assemble` doesn't read the host clock.
inputs: {topic: rates, as_of: "2026-01-01"}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    score:
      agent:
        # A wrapped scalar's carrier: 0.6 takes the `pro` branch.
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"value": 0.6}'}]
    macro:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Inflation is cooling.}]
    pro:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates may ease. Demand holds.}]
    pro_detail:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Wages are steady.}]
    assemble:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates may ease as inflation cools.}]
expect:
  output: {status: succeeded, output: Rates may ease as inflation cools.}
  # Run start resolves every AGENT, the skipped ones included; a skipped node writes no record.
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          score:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          macro:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          pro:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          con:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          pro_detail:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          assemble:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {as_of: 2026-01-01, topic: rates}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: rates, as_of: "2026-01-01"}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, score]
    - [node_step, score, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: '{"value": 0.6}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 4af99eec852aa8ad195767346ad92a2a176da302d576b9d56cd167716b4d2e81, response_id: null, usage: null}}]
    - [pool_commit, score, {value: 0.6}]
    - [node_succeeded, score, {commit: 10}]
    - [node_started, macro]
    - [node_step, macro, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Inflation is cooling., type: text}], role: assistant}, purpose: chat, request_sha256: d1bdbe79470f03ee5f22a6a2e24c58da086e9483254ad9f25df5b565236c03db, response_id: null, usage: null}}]
    - [pool_commit, macro, {value: Inflation is cooling.}]
    - [node_succeeded, macro, {commit: 14}]
    - [node_started, gate]
    - [node_routed, gate, {handle: pro}]
    - [node_started, pro]
    - [node_step, pro, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Rates may ease. Demand holds., type: text}], role: assistant}, purpose: chat, request_sha256: 77421014d325026d3e8f73896c5792ddf143042e1ae975c18028a3b12161ffaf, response_id: null, usage: null}}]
    - [pool_commit, pro, {value: Rates may ease. Demand holds.}]
    - [node_succeeded, pro, {commit: 20}]
    - [node_started, pro_detail]
    - [node_step, pro_detail, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Wages are steady., type: text}], role: assistant}, purpose: chat, request_sha256: c06ea0765ec2583cc44757da5da13be6dc6cf162254d47070f7e85a5f9faf77c, response_id: null, usage: null}}]
    - [pool_commit, pro_detail, {value: Wages are steady.}]
    - [node_succeeded, pro_detail, {commit: 24}]
    - [node_started, assemble]
    - [node_step, assemble, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Rates may ease as inflation cools., type: text}], role: assistant}, purpose: chat, request_sha256: a678c31dd7b11362890fbd8fcc7d08b4ef38f07a8523f53eae8fdefae714da9d, response_id: null, usage: null}}]
    - [pool_commit, assemble, {value: Rates may ease as inflation cools.}]
    - [node_succeeded, assemble, {commit: 28}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: Rates may ease as inflation cools.}]
