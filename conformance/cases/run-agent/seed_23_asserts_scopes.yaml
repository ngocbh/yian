# From tests/seeds/23-asserts-scopes.yaml.
# Asserts at every scope pass: both calls grow the def, whose inline score is -0.6 for a
# four-letter topic, so the `case` takes its `else:` route (`#else`) to `skip`.
kind: run
flow: |
  # 23 — Asserts at every scope (flow / def-child / node).
  #
  # One relevance-desk flow that exercises all THREE assert scopes plus a named-call-node
  # post assert. A false (or raising) assert at any scope fails the run loudly.
  #
  #   - FLOW   asserts: top-level `asserts:` — boundary (${input.X} only, before any
  #            node) or post (${X.output}, after the terminal); a flow-level post assert
  #            can read a named `call` node's `.output` like any other node's output.
  #            `${system.X}` is NOT allowed in a flow assert (it is ambient — no producer
  #            to draw an edge from; a `system` ref is a LoadError).
  #   - DEF    asserts: a `defs:` callable's top-level `asserts:` — lowered onto the def's
  #            own START/END, which are cloned into the parent when the def is called, so they
  #            fire on the ordinary node path (boundary before the child runs, post after it
  #            terminates), exactly like the top-level flow's asserts.
  #   - NODE   asserts: a node's `asserts:` — the per-node contract; node-LOCAL refs only:
  #            bare `name` = a declared input (PRE, before _run), `output`/`output.field`
  #            = the node's own output (POST, after _run). Not on a `case` or a mapped `call`;
  #            no inline `${call}` inside (those are flow-level). Conditions use the bare
  #            spelling — `a > 5`, no `${}` — the canonical form.

  id: asserts-scopes
  name: asserts_scopes
  description: Asserts at every scope — flow (boundary/post + named-call post), def-child, and node.

  input:
    topic: !str
    window: !int 30
    weight: !float 0.02

  defs:
    # A callable sub-flow. Its top-level `asserts:` are DEF/CHILD-scope — enforced at the
    # call seam when `score_one` runs (NOT in this file's top-level run).
    score_one:
      input:
        topic: !str
        window: !int
      nodes:
        raw:
          kind: code
          input:
            topic: ${input.topic}
            window: ${input.window}
          output: float
          code: |
            // A deterministic stand-in score in [-1, 1], so the asserts below hold.
            return (inputs.topic.length % 21 - 10) / 10
      output: ${raw.output}
      asserts:
        - "input.window >= 5"                       # child BOUNDARY — before the child runs
        - "raw.output >= -1 and raw.output <= 1"  # child POST — after the child terminates

  nodes:
    # A `call` to the def. Its OWN `asserts:` are NODE-scope (this call node's contract);
    # the def's asserts above fire independently, inside the call, at the child seam.
    score:
      kind: call
      call: score_one
      input:
        topic: ${input.topic}
        window: ${input.window}
      asserts:
        - "window >= 5"     # NODE PRE  — bare `name` = this node's declared input, before _run
        - "output >= -1"      # NODE POST — `output` = the call's re-exported value, after _run

    # A named call whose .output a flow-level assert reads — the hoisted form of what used
    # to be a span-wrapped inline ${call} in the asserts section.
    score_one_call:
      kind: call
      call: score_one
      input:
        topic: ${input.topic}
        window: ${input.window}

    # A `case` routes only — it cannot carry `asserts:` (assert the branch targets instead).
    size:
      kind: case
      cases:
        - when: "score.output > 0 and input.weight * 100 <= 5"
          then: take
      else: skip

    take:
      kind: agent
      input:
        topic: ${input.topic}
        rating: ${score.output}
      output: str
      prompt: "Write a two-sentence rationale for buying ${topic} (rating ${rating}). No advice."
      asserts:
        - "output != \"\""    # NODE POST — the rationale must be non-empty

    skip:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Write a two-sentence note on why ${topic} is passed for now. No advice."

  output:
    decision: ${take.output | skip.output}

  asserts:
    # FLOW boundary — only ${input.X} (NOT ${system}); checked BEFORE any node (fail-fast).
    - "input.window >= 5 and input.window <= 252"
    - "input.weight >= 0 and input.weight <= 1"
    # FLOW post — reads <node>.output (a node's output); checked AFTER the terminal.
    - "score.output >= -1 and score.output <= 1"
    # FLOW post — reads a named call node's .output (the hoisted inline-call form).
    - "score_one_call.output >= -1"
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
# A four-letter topic makes the score (4 % 21 - 10) / 10 = -0.6, a non-integral float.
inputs: {topic: bond, window: 30, weight: 0.02}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    skip:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Bonds score below zero. They are passed for now.}]
expect:
  output: {status: succeeded, output: {decision: Bonds score below zero. They are passed for now.}}
  # Run start resolves every AGENT, the skipped ones included; a skipped node writes no record.
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          take:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          skip:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: bond, weight: 0.02, window: 30}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: bond, window: 30, weight: 0.02}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, score]
    - [pool_commit, score, {from: {__start__: 6}, key: score/__start__}]
    - [node_expanded, score, {prune_ids: []}]
    - [node_started, score_one_call]
    - [pool_commit, score_one_call, {from: {__start__: 6}, key: score_one_call/__start__}]
    - [node_expanded, score_one_call, {prune_ids: []}]
    - [node_started, score/__start__]
    - [node_succeeded, score/__start__, {commit: 9}]
    - [node_started, score_one_call/__start__]
    - [node_succeeded, score_one_call/__start__, {commit: 12}]
    - [node_started, score/raw]
    - [pool_commit, score/raw, {value: -0.6}]
    - [node_succeeded, score/raw, {commit: 19}]
    - [node_started, score_one_call/raw]
    - [pool_commit, score_one_call/raw, {value: -0.6}]
    - [node_succeeded, score_one_call/raw, {commit: 22}]
    - [node_started, score/__end__]
    - [pool_commit, score/__end__, {key: score, from: {score/raw: 19}}]
    - [node_succeeded, score/__end__, {commit: 25}]
    - [node_started, score_one_call/__end__]
    - [pool_commit, score_one_call/__end__, {key: score_one_call, from: {score_one_call/raw: 22}}]
    - [node_succeeded, score_one_call/__end__, {commit: 28}]
    - [node_started, size]
    - [node_routed, size, {handle: "#else"}]
    - [node_started, skip]
    - [node_step, skip, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Bonds score below zero. They are passed for now., type: text}], role: assistant}, purpose: chat, request_sha256: 635d4adf2f1eb72165561dafeaa9eac6bd05927569555d74376716a05893efee, response_id: null, usage: null}}]
    - [pool_commit, skip, {value: Bonds score below zero. They are passed for now.}]
    - [pool_commit, skip, {key: skip.new_messages, steps: [33]}]
    - [node_succeeded, skip, {commit: 34, messages: 35}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: {decision: Bonds score below zero. They are passed for now.}}]
    - [node_succeeded, __end__, {commit: 38}]
