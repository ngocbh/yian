# From tests/seeds/27-expr-ops.yaml.
# Every input given, the expression forms bind, the flow asserts pass and the AGENT's reply is the
# output. Its prompt isn't pinned: it shows `sizable`, an `and` result.
kind: run
flow: |
  # 27 — Every new ${...} expression form, in one flow.
  #
  # The unified grammar makes the FULL expression language available inside every
  # ${...} — bindings, conditions, and prompts.
  # This seed exercises each form once:
  #   arithmetic  + - * / % ** and unary minus, with parens for precedence
  #   strings     concatenation with +  (and the upper/lower builtins)
  #   lists       [ ... ] literals and list + list concatenation
  #   logic       comparisons, and / or / not, membership (in / not in)
  #   operators   coalesce |, default :- "quoted", required :? "quoted"
  #   builtins    upper / lower / join / render_as_json
  #   escape      $$ -> a literal $ in a prompt
  # Agent nodes load without a model (running one needs a provider).

  id: expr-ops
  name: expr_ops
  description: One flow exercising every new unified-${...} expression form.

  input:
    topic: !str
    base_weight: !float 0.02      # fraction of capital in [0, 1]
    extra_bps: !int 0             # extra basis points (1 bp = 0.01%)
    tags: !Optional(list(str))      # optional -> coalesce falls through to a literal list
    note: !Optional(str)            # optional -> shows a quoted :- default
    as_of: !Optional(date)

  nodes:
    brief:
      kind: agent
      input:
        # required AT THE USE SITE — the message is QUOTED (a bare word reads a variable)
        topic:      ${input.topic:?"a topic is required"}

        # --- arithmetic (one span each) ---
        weight_pct: ${(input.base_weight * 100) + (input.extra_bps / 100)}  # * + / + parens
        headroom:   ${5 - input.base_weight * 100}                          # - with precedence
        budget:     ${2 ** 4}                                               # ** (power)
        remainder:  ${input.extra_bps % 10}                                 # % (modulo)
        neg_bps:    ${-input.extra_bps}                                     # unary minus

        # --- strings + builtins ---
        heading:    ${upper(input.topic) + " - position brief"}            # concat + upper()
        slug:       ${lower(input.topic)}                                   # lower()

        # --- lists + coalesce/default ---
        tag_list:   ${input.tags | ["watch", "review"]}                    # coalesce onto a list literal
        tag_line:   ${join(["#" + lower(input.topic)] + (input.tags | []), " ")}  # list + list, join()
        note_line:  ${input.note:-"n/a"}                                    # quoted :- default

        # --- logic: comparison + membership + boolean ---
        sizable:    ${input.base_weight * 100 <= 5 and input.topic not in ["", "n/a"]}

        as_of:      ${input.as_of | system.today}                          # coalesce onto the host clock
        run_id:     ${system.run_id}                                       # host-ambient namespace
      output: str
      prompt: |-
        ${heading}   (${slug})
        As of ${as_of}, run ${run_id}.
        Weight ${weight_pct}% - headroom ${headroom}%, sizable=${sizable}.
        Budget lots: ${budget}, remainder ${remainder}, neg_bps ${neg_bps}.
        Tags: ${tag_line}
        Note: ${note_line}
        All figures are in US dollars ($$).
        Raw tags: ${ render_as_json(tag_list, 2) }
        Write a neutral one-paragraph brief on ${topic}. No advice.

  output: ${brief.output}

  asserts:                                                # any false fails the run
    # A condition is ALWAYS a whole boolean expression, written bare (no `${}`) or as one
    # whole `${...}` span; bare is the canonical form shown throughout.
    - input.base_weight * 100 <= 10 and not (input.base_weight < 0)   # arithmetic + not + parens
    - input.extra_bps in [0, 25, 50, 100] or input.extra_bps >= 0     # membership + or
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
# `as_of` is given, so the binding doesn't read the host clock.
inputs:
  topic: rates
  base_weight: 0.03
  extra_bps: 25
  tags: [macro]
  note: watch
  as_of: "2026-01-01"
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    brief:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates were steady through the week.}]
expect:
  output: {status: succeeded, output: Rates were steady through the week.}
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          brief:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {as_of: 2026-01-01, base_weight: 0.03, extra_bps: 25, note: watch, tags: [macro], topic: rates}}]
    - [node_started, __start__]
    - - pool_commit
      - __start__
      - value:
          topic: rates
          base_weight: 0.03
          extra_bps: 25
          tags: [macro]
          note: watch
          as_of: "2026-01-01"
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, brief]
    - [node_step, brief, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Rates were steady through the week., type: text}], role: assistant}, purpose: chat, request_sha256: 0d38588531b3f6238d061b990b13f5a49ced4b618db725e17697a59e4793332d, response_id: null, usage: null}}]
    - [pool_commit, brief, {value: Rates were steady through the week.}]
    - [pool_commit, brief, {key: brief.new_messages, steps: [9]}]
    - [node_succeeded, brief, {commit: 10, messages: 11}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: Rates were steady through the week.}]
    - [node_succeeded, __end__, {commit: 14}]
