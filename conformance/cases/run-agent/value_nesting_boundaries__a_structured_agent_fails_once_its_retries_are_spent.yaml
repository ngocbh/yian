# From tests/engine/test_value_nesting_boundaries.py::test_a_structured_agent_over_the_limit_without_retries_fails.
# Also ::test_a_structured_agent_over_the_limit_self_corrects_under_retries (retries: 1 takes a
# second attempt). Both replies nest deeper than the value limit (YIAN_MAX_VALUE_NESTING=3
# keeps them short), so the one retry is spent and the node fails at `agent` with the yian
# message "structured output at a.a.a: value nests deeper than 3 levels ...". TS fails
# agent.output_invalid and Python node.execute.
kind: run
rules: [llm, failure-codes, run-log]
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: openai, model: gpt-4o}
  nodes:
    agent:
      kind: agent
      system_prompt: Help.
      prompt: q
      retries: 1
      output: object
  output: ${agent.output}
env:
  YIAN_MAX_VALUE_NESTING: '3'
run:
  run_id: r1
  num_workers: 0
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"a": {"a": {"a": {"a": 1}}}}}'
      structured_retry:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"a": {"a": {"a": {"a": 2}}}}}'
expect:
  output:
    status: failed
    failure:
      code: agent.output_invalid
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 8]
      message: 'structured output at a.a.a: value nests deeper than 3 levels, the limit for a yian value (each record and list is a level)'
      node: agent
  trace:
  - - run_started
    - null
    - defaults:
        MAX_VALUE_NESTING: 3
      effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-4o
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_failed
    - agent
    - failure:
        code: agent.output_invalid
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 8]
        message: 'structured output at a.a.a: value nests deeper than 3 levels, the limit for a yian value (each record and list is a level)'
        node: agent
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: gpt-4o
      node_id: agent
      provider: openai
      purpose: structured_native
  - - NodeFailed
    - failure:
        code: agent.output_invalid
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 8]
        message: 'structured output at a.a.a: value nests deeper than 3 levels, the limit for a yian value (each record and list is a level)'
        node: agent
  - - RunFailed
    - failure:
        code: agent.output_invalid
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 8]
        message: 'structured output at a.a.a: value nests deeper than 3 levels, the limit for a yian value (each record and list is a level)'
        node: agent
python_expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 8]
      message: 'structured output at a.a.a: value nests deeper than 3 levels, the limit for a yian value (each record and list is a level)'
      node: agent
  trace:
  - - run_started
    - null
    - defaults:
        MAX_VALUE_NESTING: 3
      effective_llm_by_static_path:
        agent:
          _connection:
