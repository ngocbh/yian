# From tests/compose/test_kind_case_parse.py::test_named_definition_case_failure_keeps_child_predicate_origin.
# A CASE `when:` inside a called child that fails to evaluate fails the gate, located at the call
# and at the child's arm. TS fails condition.evaluate and Python node.execute.
kind: run
rules: [failure-codes, run-log]
flow: |
  id: named-case-origin
  name: named-case-origin
  defs:
    child:
      nodes:
        zero:
          kind: code
          code: "return 0"
          output: int
        gate:
          kind: case
          cases:
            - when: "zero.output > 0"
              then: positive
            - when: "1 / zero.output > 0"
              then: broken
          else: negative
        positive:
          kind: code
          code: 'return "positive"'
          output: str
        broken:
          kind: code
          code: 'return "broken"'
          output: str
        negative:
          kind: code
          code: 'return "negative"'
          output: str
      output: ${positive.output | broken.output | negative.output}
  nodes:
    invoke:
      kind: call
      call: child
  output: ${invoke.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: condition.evaluate
      frames:
      - label: flow.yaml
        range: [32, 3, 32, 9]
      - label: flow.yaml
        range: [15, 19, 15, 40]
      message: 'division by zero: 1 / 0'
      node: invoke/gate
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {}
      key: invoke/__start__
      value: {}
  - - node_expanded
    - invoke
    - prune_ids: []
      seed: {}
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 9
  - [node_started, invoke/zero]
  - - pool_commit
    - invoke/zero
    - value: 0
  - - node_succeeded
    - invoke/zero
    - {commit: 14}
  - [node_started, invoke/gate]
  - - node_failed
    - invoke/gate
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [32, 3, 32, 9]
        - label: flow.yaml
          range: [15, 19, 15, 40]
        message: 'division by zero: 1 / 0'
        node: invoke/gate
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: invoke
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: invoke
  - - NodeStarted
    - node_id: invoke/__start__
  - - NodeSucceeded
    - node_id: invoke/__start__
      output: {}
  - - NodeStarted
    - node_id: invoke/zero
  - - NodeSucceeded
    - node_id: invoke/zero
      output: 0
  - - NodeStarted
    - node_id: invoke/gate
  - - NodeFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [32, 3, 32, 9]
        - label: flow.yaml
          range: [15, 19, 15, 40]
        message: 'division by zero: 1 / 0'
        node: invoke/gate
  - - RunFailed
