kind: run
rules: [run-log]
flow: |2

  id: cc
  name: cc
  input:
    score: !float

  defs:
    take:
      input:
        stance: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:took
          input:
            stance: ${input.stance}
          output: str
      output: ${x.output}

  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: call(take, stance="pro")
      else: call(take, stance="con")
  output: ${gate.output}
python_flow: |2

  id: cc
  name: cc
  input:
    score: !float

  defs:
    take:
      input:
        stance: !str
      nodes:
        x:
          kind: code
          code: tests.engine._compose_codefns:took
          input:
            stance: ${input.stance}
          output: str
      output: ${x.output}

  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: call(take, stance="pro")
      else: call(take, stance="con")
  output: ${gate.output}
inputs:
  score: 0.2
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: took:con
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {score: 0.2}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        score: 0.2
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, __call_1]
  - - pool_commit
    - __call_1
    - from: {}
      key: __call_1/__start__
  - - node_expanded
    - __call_1
    - prune_ids: []
  - [node_started, __call_1/__start__]
  - - node_succeeded
    - __call_1/__start__
    - commit: 11
  - [node_started, __call_1/x]
  - - pool_commit
    - __call_1/x
    - value: took:con
  - - node_succeeded
    - __call_1/x
    - {commit: 16}
  - [node_started, __call_1/__end__]
  - - pool_commit
    - __call_1/__end__
    - key: __call_1
      from: {__call_1/x: 16}
  - - node_succeeded
    - __call_1/__end__
    - {commit: 19}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: took:con
  - - node_succeeded
    - __end__
    - {commit: 22}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        score: 0.2
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: __call_1
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          stance: con
      node_id: __call_1
  - - NodeStarted
    - node_id: __call_1/__start__
  - - NodeSucceeded
    - node_id: __call_1/__start__
      output:
        stance: con
  - - NodeStarted
    - node_id: __call_1/x
  - - NodeSucceeded
    - node_id: __call_1/x
      output: took:con
  - - NodeStarted
    - node_id: __call_1/__end__
  - - NodeSucceeded
    - commit_as: __call_1
      node_id: __call_1/__end__
      output: took:con
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: took:con
  - - RunSucceeded
    - output: took:con
