kind: run
flow: |
  id: f
  name: f
  typedefs:
    Choice: Literal(a, b)
  input:
    choice: !Choice
  nodes:
    gate:
      kind: case
      on: ${input.choice}
      cases:
        - when: a
          then: pa
        - when: b
          then: pb
    pa:
      kind: code
      code: |
        return "A"
      output: str
    pb:
      kind: code
      code: |
        return "B"
      output: str
  output: ${gate.output}
inputs:
  choice: b
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: B
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {choice: b}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        choice: b
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: pb
  - [node_started, pb]
  - - pool_commit
    - pb
    - value: B
  - - node_succeeded
    - pb
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: B
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        choice: b
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: pb
      node_id: gate
  - - NodeSkipped
    - node_id: pa
  - - NodeStarted
    - node_id: pb
  - - NodeSucceeded
    - node_id: pb
      output: B
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: B
  - - RunSucceeded
    - output: B
