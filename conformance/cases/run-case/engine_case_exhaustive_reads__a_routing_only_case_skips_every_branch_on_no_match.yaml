kind: run
flow: |
  id: f
  name: f
  input:
    x: !str
  nodes:
    gate:
      kind: case
      on: ${input.x}
      cases:
        - when: a
          then: pa
        - when: b
          then: pb
    pa:
      kind: code
      code: |
        return "A"
      output: str
    pb:
      kind: code
      code: |
        return "B"
      output: str
  output: ${pa.output | pb.output:-'none'}
inputs:
  x: c
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: none
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {x: c}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        x: c
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: none
  - - node_succeeded
    - __end__
    - {commit: 11}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        x: c
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: pa
  - - NodeSkipped
    - node_id: pb
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: none
  - - RunSucceeded
    - output: none
