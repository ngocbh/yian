kind: run
flow: |
  id: f
  name: f
  input:
    pick: !str
  nodes:
    src:
      kind: code
      input:
        p: ${input.pick}
      code: |
        return inputs["p"] == "t" ? true : 1
    route:
      kind: case
      on: ${src.output}
      cases:
        - when: 1
          then: one
        - when: true
          then: two
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: str
    two:
      kind: code
      code: |
        return "two"
      output: str
    other:
      kind: code
      code: |
        return "other"
      output: str
  output: ${one.output | two.output | other.output}
python_flow: |
  id: f
  name: f
  input:
    pick: !str
  nodes:
    src:
      kind: code
      input:
        p: ${input.pick}
      code: |
        return True if inputs["p"] == "t" else 1
    route:
      kind: case
      on: ${src.output}
      cases:
        - when: 1
          then: one
        - when: true
          then: two
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: str
    two:
      kind: code
      code: |
        return "two"
      output: str
    other:
      kind: code
      code: |
        return "other"
      output: str
  output: ${one.output | two.output | other.output}
inputs:
  pick: t
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: two
  trace:
  - - run_started
    - null
    - inputs:
        pick: t
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        pick: t
  - [node_started, src]
  - - node_succeeded
    - src
    - value: true
  - [node_started, route]
  - - node_routed
    - route
    - handle: two
  - [node_started, two]
  - - node_succeeded
    - two
    - value: two
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: two
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        pick: t
  - - NodeStarted
    - node_id: src
  - - NodeSucceeded
    - node_id: src
      output: true
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: two
      node_id: route
  - - NodeSkipped
    - node_id: one
  - - NodeSkipped
    - node_id: other
  - - NodeStarted
    - node_id: two
  - - NodeSucceeded
    - node_id: two
      output: two
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: two
  - - RunSucceeded
    - output: two
