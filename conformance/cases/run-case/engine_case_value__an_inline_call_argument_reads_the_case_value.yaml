kind: run
flow: |2

  id: cvi
  name: case_value_into_inline
  input:
    seed: !float
    topic: !str
  defs:
    passthru:
      input:
        v: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.v}
          output: str
      output: ${x.output}
  nodes:
    s:
      kind: code
      code: ./fixtures/compose_codefns.ts:score
      input:
        seed: ${input.seed}
      output: float
    gate:
      kind: case
      cases:
        - when: "s.output >= 0.5"
          then: pro
      else: caut
    pro:
      kind: code
      code: ./fixtures/compose_codefns.ts:positive
      input:
        topic: ${input.topic}
      output: str
    caut:
      kind: code
      code: ./fixtures/compose_codefns.ts:cautious
      input:
        topic: ${input.topic}
      output: str
    wrap:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(passthru, v=${gate.output})
      output: str
  output: ${wrap.output}
