# From tests/engine/test_case_when_escape_e2e.py::test_a_call_on_a_skipped_branch_under_a_default_fails_in_the_predicate.
# A CASE `when:` calling `upper` on a skipped branch's null fails the gate. TS fails
# condition.evaluate and Python node.execute.
kind: run
rules: [failure-codes, run-log]
flow: |2

  id: when_escape
  name: when_escape
  input:
    score: !float
    topic: !str
  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: pro
      else: con
    pro:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_pro
      input:
        topic: ${input.topic}
      output: str
    con:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_con
      input:
        topic: ${input.topic}
      output: str
    gate2:
      kind: case
      cases:
        - when: '(upper(pro.output) :- con.output) == "con: ACME"'
          then: hot
      else: cold
    hot:
      kind: code
      code: ./fixtures/compose_codefns.ts:positive
      input:
        topic: ${input.topic}
      output: str
    cold:
      kind: code
      code: ./fixtures/compose_codefns.ts:cautious
      input:
        topic: ${input.topic}
      output: str
  output: ${gate2.output}
