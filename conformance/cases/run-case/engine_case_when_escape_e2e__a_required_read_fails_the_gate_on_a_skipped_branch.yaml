# From tests/engine/test_case_when_escape_e2e.py::test_a_required_read_fails_the_gate_on_a_skipped_branch.
# A CASE `when:` with a required read (`:?`) of a skipped branch fails the gate with the read's
# message. TS fails condition.evaluate and Python node.execute.
kind: run
flow: |2

  id: when_escape
  name: when_escape
  input:
    score: !float
    topic: !str
  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: pro
      else: con
    pro:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_pro
      input:
        topic: ${input.topic}
      output: str
    con:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_con
      input:
        topic: ${input.topic}
      output: str
    gate2:
      kind: case
      cases:
        - when: '(pro.output :? "pro must run") == "x"'
          then: hot
      else: cold
    hot:
      kind: code
      code: ./fixtures/compose_codefns.ts:positive
      input:
        topic: ${input.topic}
      output: str
    cold:
      kind: code
      code: ./fixtures/compose_codefns.ts:cautious
      input:
        topic: ${input.topic}
      output: str
  output: ${gate2.output}
inputs:
  score: 0.2
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: condition.evaluate
      frames:
      - label: flow.yaml
        range: [29, 15, 29, 54]
      message: pro must run
      node: gate2
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {score: 0.2, topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        score: 0.2
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, gate2]
  - - node_failed
    - gate2
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [29, 15, 29, 54]
        message: pro must run
        node: gate2
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        score: 0.2
        topic: ACME
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: pro
  - - NodeStarted
    - node_id: gate2
  - - NodeFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [29, 15, 29, 54]
        message: pro must run
        node: gate2
  - - RunFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [29, 15, 29, 54]
        message: pro must run
        node: gate2
