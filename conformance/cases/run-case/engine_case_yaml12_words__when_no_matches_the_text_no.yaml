kind: run
rules: [run-log]
flow: |
  id: f
  name: f
  typedefs:
    Cmd: Literal(yes, no)
  input:
    cmd: !Cmd
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: yes
          then: agree
        - when: no
          then: refuse
    agree:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: agreed
      output: str
    refuse:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: refused
      output: str
  output: ${agree.output | refuse.output}
python_flow: |
  id: f
  name: f
  typedefs:
    Cmd: Literal(yes, no)
  input:
    cmd: !Cmd
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: yes
          then: agree
        - when: no
          then: refuse
    agree:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: agreed
      output: str
    refuse:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: refused
      output: str
  output: ${agree.output | refuse.output}
inputs:
  cmd: no
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: refused
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {cmd: no}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        cmd: no
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: refuse
  - [node_started, refuse]
  - - pool_commit
    - refuse
    - value: refused
  - - node_succeeded
    - refuse
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: refused
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        cmd: no
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: refuse
      node_id: route
  - - NodeSkipped
    - node_id: agree
  - - NodeStarted
    - node_id: refuse
  - - NodeSucceeded
    - node_id: refuse
      output: refused
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: refused
  - - RunSucceeded
    - output: refused
