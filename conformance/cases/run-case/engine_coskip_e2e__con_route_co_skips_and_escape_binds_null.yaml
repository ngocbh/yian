# hand TS expect: assemble_join's TS port interpolates a null `detail` as `null`; Python's f-string
# writes `None`, kept in python_expect.
kind: run
rules: [code, run-log]
flow: |2

  id: coskip
  name: coskip
  input:
    score: !float
    topic: !str
  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: pro
      else: con
    pro:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_pro
      input:
        topic: ${input.topic}
      output: str
    con:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_con
      input:
        topic: ${input.topic}
      output: str
    pro_detail:
      kind: code
      code: ./fixtures/compose_codefns.ts:detail_of
      input:
        base: ${pro.output}
      output: str
    assemble:
      kind: code
      code: ./fixtures/compose_codefns.ts:assemble_join
      input:
        claim: ${pro.output | con.output}
        detail: ${pro_detail.output:-null}
      output: str
  output: ${assemble.output}
python_flow: |2

  id: coskip
  name: coskip
  input:
    score: !float
    topic: !str
  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: pro
      else: con
    pro:
      kind: code
      code: tests.engine._compose_codefns:pick_pro
      input:
        topic: ${input.topic}
      output: str
    con:
      kind: code
      code: tests.engine._compose_codefns:pick_con
      input:
        topic: ${input.topic}
      output: str
    pro_detail:
      kind: code
      code: tests.engine._compose_codefns:detail_of
      input:
        base: ${pro.output}
      output: str
    assemble:
      kind: code
      code: tests.engine._compose_codefns:assemble_join
      input:
        claim: ${pro.output | con.output}
        detail: ${pro_detail.output:-null}
      output: str
  output: ${assemble.output}
inputs:
  score: 0.2
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 'con: ACME|detail=null'
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {score: 0.2, topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        score: 0.2
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, con]
  - - pool_commit
    - con
    - value: 'con: ACME'
  - - node_succeeded
    - con
    - {commit: 11}
  - [node_started, assemble]
  - - pool_commit
    - assemble
    - value: 'con: ACME|detail=null'
  - - node_succeeded
    - assemble
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 'con: ACME|detail=null'
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        score: 0.2
        topic: ACME
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: pro
  - - NodeSkipped
    - node_id: pro_detail
  - - NodeStarted
    - node_id: con
  - - NodeSucceeded
    - node_id: con
      output: 'con: ACME'
  - - NodeStarted
    - node_id: assemble
  - - NodeSucceeded
    - node_id: assemble
      output: 'con: ACME|detail=null'
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 'con: ACME|detail=null'
  - - RunSucceeded
    - output: 'con: ACME|detail=null'
python_expect:
  output:
    status: succeeded
    output: 'con: ACME|detail=None'
  trace:
  - - run_started
    - null
    - inputs:
        score: 0.2
        topic: ACME
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        score: 0.2
        topic: ACME
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, con]
  - - node_succeeded
    - con
    - value: 'con: ACME'
  - [node_started, assemble]
  - - node_succeeded
    - assemble
    - value: 'con: ACME|detail=None'
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: 'con: ACME|detail=None'
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        score: 0.2
        topic: ACME
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: pro
  - - NodeSkipped
    - node_id: pro_detail
  - - NodeStarted
    - node_id: con
  - - NodeSucceeded
    - node_id: con
      output: 'con: ACME'
  - - NodeStarted
    - node_id: assemble
  - - NodeSucceeded
    - node_id: assemble
      output: 'con: ACME|detail=None'
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 'con: ACME|detail=None'
  - - RunSucceeded
    - output: 'con: ACME|detail=None'
