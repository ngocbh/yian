kind: run
flow: |
  id: nested_skips
  name: nested_skips
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output: str
      code: |
        return "filled"
    rejected:
      kind: code
      output: str
      code: |
        return "no"
  output:
    r: {a: {b: '${order.output}'}, n: 1}
inputs:
  approve: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r:
        a:
          b: null
        n: 1
  trace:
  - - run_started
    - null
    - inputs:
        approve: false
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        approve: false
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        r:
          a:
            b: null
          n: 1
  - [node_started, rejected]
  - - node_succeeded
    - rejected
    - value: no
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: order
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r:
          a:
            b: null
          n: 1
  - - NodeStarted
    - node_id: rejected
  - - NodeSucceeded
    - node_id: rejected
      output: no
  - - RunSucceeded
    - output:
        r:
          a:
            b: null
          n: 1
