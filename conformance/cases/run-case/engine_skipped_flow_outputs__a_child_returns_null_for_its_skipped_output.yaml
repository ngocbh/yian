kind: run
flow: |
  id: f
  name: f
  input:
    approve: !bool
  defs:
    child:
      input:
        approve: !bool
      nodes:
        gate:
          kind: case
          cases:
            - when: ${input.approve}
              then: order
        order:
          kind: code
          output: str
          code: |
            return "filled"
      output: ${order.output}
  nodes:
    c:
      kind: call
      call: child
      input:
        approve: ${input.approve}
  output: ${c.output}
inputs:
  approve: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - inputs:
        approve: false
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        approve: false
  - [node_started, c]
  - - node_expanded
    - c
    - prune_ids: []
      seed:
        approve: false
  - [node_started, c/__start__]
  - - node_succeeded
    - c/__start__
    - value:
        approve: false
  - [node_started, c/gate]
  - - node_routed
    - c/gate
    - handle: '#else'
  - [node_started, c/__end__]
  - - node_succeeded
    - c/__end__
    - commit_target: c
  - [node_started, __end__]
  - [node_succeeded, __end__]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
  - - NodeStarted
    - node_id: c
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          approve: false
      node_id: c
  - - NodeStarted
    - node_id: c/__start__
  - - NodeSucceeded
    - node_id: c/__start__
      output:
        approve: false
  - - NodeStarted
    - node_id: c/gate
  - - NodeRouted
    - handle: '#else'
      node_id: c/gate
  - - NodeSkipped
    - node_id: c/order
  - - NodeStarted
    - node_id: c/__end__
  - - NodeSucceeded
    - commit_as: c
      node_id: c/__end__
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
  - [RunSucceeded]
