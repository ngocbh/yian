kind: run
rules: [run-log]
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    each:
      kind: map
      over: [true, false]
      input:
        flag: ${item}
      nodes:
        gate:
          kind: case
          cases:
            - when: ${input.flag}
              then: mk
        mk:
          kind: code
          output: str
          code: |
            return "made"
      output: ${mk.output}
  output: ${each.output}
inputs:
  approve: true
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [made, null]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {approve: true}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        approve: true
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, each]
  - - pool_commit
    - each
    - from: {}
      key: each/__start__
      value: {}
  - - pool_commit
    - each
    - from: {}
      key: each#0/__start__
      value: {flag: true}
  - - pool_commit
    - each
    - from: {}
      key: each#1/__start__
      value: {flag: false}
  - - node_expanded
    - each
    - prune_ids: []
      seed:
      - flag: true
      - flag: false
  - [node_started, each/__start__]
  - - node_succeeded
    - each/__start__
    - commit: 9
  - [node_started, each#0/__start__]
  - - node_succeeded
    - each#0/__start__
    - commit: 10
  - [node_started, each#1/__start__]
  - - node_succeeded
    - each#1/__start__
    - commit: 11
  - [node_started, each#0/gate]
  - - node_routed
    - each#0/gate
    - handle: mk
  - [node_started, each#1/gate]
  - - node_routed
    - each#1/gate
    - handle: '#else'
  - [node_started, each#0/mk]
  - - pool_commit
    - each#0/mk
    - value: made
  - - node_succeeded
    - each#0/mk
    - {commit: 24}
  - [node_started, each#1/__end__]
  - [pool_commit, each#1/__end__, {from: {}}]
  - - node_succeeded
    - each#1/__end__
    - {commit: 27}
  - [node_started, each#0/__end__]
  - - pool_commit
    - each#0/__end__
    - value: made
      from: {each#0/mk: 24}
  - - node_succeeded
    - each#0/__end__
    - {commit: 30}
  - [node_started, each/__end__]
  - - pool_commit
    - each/__end__
    - value: [made, null]
      key: each
      from: {each#0/__end__: 30, each#1/__end__: 27}
  - - node_succeeded
    - each/__end__
    - {commit: 33}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [made, null]
  - - node_succeeded
    - __end__
    - {commit: 36}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: true
  - - NodeStarted
    - node_id: each
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - flag: true
        - flag: false
      node_id: each
  - - NodeStarted
    - node_id: each/__start__
  - - NodeSucceeded
    - node_id: each/__start__
      output: {}
  - - NodeStarted
    - node_id: each#0/__start__
  - - NodeSucceeded
    - node_id: each#0/__start__
      output:
        flag: true
  - - NodeStarted
    - node_id: each#1/__start__
  - - NodeSucceeded
    - node_id: each#1/__start__
      output:
        flag: false
  - - NodeStarted
    - node_id: each#0/gate
  - - NodeRouted
    - handle: mk
      node_id: each#0/gate
  - - NodeStarted
    - node_id: each#1/gate
  - - NodeRouted
    - handle: '#else'
      node_id: each#1/gate
  - - NodeSkipped
    - node_id: each#1/mk
  - - NodeStarted
    - node_id: each#0/mk
  - - NodeSucceeded
    - node_id: each#0/mk
      output: made
  - - NodeStarted
    - node_id: each#1/__end__
  - - NodeSucceeded
    - node_id: each#1/__end__
  - - NodeStarted
    - node_id: each#0/__end__
  - - NodeSucceeded
    - node_id: each#0/__end__
      output: made
  - - NodeStarted
    - node_id: each/__end__
  - - NodeSucceeded
    - commit_as: each
      node_id: each/__end__
      output: [made, null]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [made, null]
  - - RunSucceeded
    - output: [made, null]
