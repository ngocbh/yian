kind: run
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output: str
      code: |
        return "filled"
    rejected:
      kind: code
      output: str
      code: |
        return "no"
  output:
    order: ${order.output}
inputs:
  approve: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      order: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {approve: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        approve: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        order: null
  - - node_succeeded
    - __end__
    - {commit: 11}
  - [node_started, rejected]
  - - pool_commit
    - rejected
    - value: no
  - - node_succeeded
    - rejected
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: order
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        order: null
  - - NodeStarted
    - node_id: rejected
  - - NodeSucceeded
    - node_id: rejected
      output: no
  - - RunSucceeded
    - output:
        order: null
