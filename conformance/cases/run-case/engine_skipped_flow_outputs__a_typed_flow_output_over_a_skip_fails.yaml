kind: run
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output: str
      code: |
        return "filled"
    rejected:
      kind: code
      output: str
      code: |
        return "no"
  output:
    order: !str ${order.output}
inputs:
  approve: false
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [23, 10, 23, 30]
      message: 'flow output ''order'': null does not match declared type str'
      node: __end__
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {approve: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        approve: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, __end__]
  - - node_failed
    - __end__
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [23, 10, 23, 30]
        message: 'flow output ''order'': null does not match declared type str'
        node: __end__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
      interrupted: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: order
  - - NodeStarted
    - node_id: __end__
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [23, 10, 23, 30]
        message: 'flow output ''order'': null does not match declared type str'
        node: __end__
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [23, 10, 23, 30]
        message: 'flow output ''order'': null does not match declared type str'
        node: __end__
