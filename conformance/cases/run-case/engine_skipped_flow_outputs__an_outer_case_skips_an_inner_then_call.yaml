kind: run
rules: [run-log]
flow: |
  id: f
  name: f
  input:
    approve: !bool
    inner: !bool
  defs:
    take:
      input:
        stance: !str
      nodes:
        x:
          kind: code
          output: str
          input:
            stance: ${input.stance}
          code: |
            return inputs["stance"]
      output: ${x.output}
  nodes:
    outer:
      kind: case
      cases:
        - when: ${input.approve}
          then: inner
    inner:
      kind: case
      cases:
        - when: ${input.inner}
          then: call(take, stance="pro")
      else: call(take, stance="con")
  output:
    v: ${inner.output}
inputs:
  approve: false
  inner: true
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      v: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {approve: false, inner: true}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        approve: false
        inner: true
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, outer]
  - - node_routed
    - outer
    - handle: '#else'
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        v: null
  - - node_succeeded
    - __end__
    - {commit: 11}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
        inner: true
  - - NodeStarted
    - node_id: outer
  - - NodeRouted
    - handle: '#else'
      node_id: outer
  - - NodeSkipped
    - node_id: inner
  - - NodeSkipped
    - node_id: __call_0
  - - NodeSkipped
    - node_id: __call_1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        v: null
  - - RunSucceeded
    - output:
        v: null
