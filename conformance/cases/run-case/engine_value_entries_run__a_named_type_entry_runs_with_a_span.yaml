kind: run
flow: |
  id: f
  name: f
  typedefs:
    Buy:
      action: Literal(buy)
      conviction: float
  nodes:
    s:
      kind: code
      output: float
      code: |
        return 0.5
    d: !Buy
      action: buy
      conviction: ${s.output}
  output: ${d.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      action: buy
      conviction: 0.5
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, s]
  - - pool_commit
    - s
    - value: 0.5
  - - node_succeeded
    - s
    - {commit: 9}
  - [node_started, d]
  - - pool_commit
    - d
    - value:
        action: buy
        conviction: 0.5
  - - node_succeeded
    - d
    - {commit: 12}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        action: buy
        conviction: 0.5
  - - node_succeeded
    - __end__
    - {commit: 15}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: s
  - - NodeSucceeded
    - node_id: s
      output: 0.5
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        action: buy
        conviction: 0.5
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        action: buy
        conviction: 0.5
  - - RunSucceeded
    - output:
        action: buy
        conviction: 0.5
