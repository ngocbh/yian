kind: run
rules: [run-log]
flow: |
  defs:
    f:
      input:
        x: !str
      nodes:
        up:
          kind: code
          input:
            x: ${input.x}
          output: str
          code: |
            return inputs['x'].toUpperCase()
      output: ${up.output}

  id: f
  name: f
  input:
    cmd: !str
    t: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: go
          then: e
      else: other
    other:
      kind: code
      code: |
        return 'other'
    e: !str call(f, x=${input.t})
  output: ${route.output}
python_flow: |
  defs:
    f:
      input:
        x: !str
      nodes:
        up:
          kind: code
          input:
            x: ${input.x}
          output: str
          code: |
            return inputs['x'].upper()
      output: ${up.output}

  id: f
  name: f
  input:
    cmd: !str
    t: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: go
          then: e
      else: other
    other:
      kind: code
      code: |
        return 'other'
    e: !str call(f, x=${input.t})
  output: ${route.output}
inputs:
  cmd: no
  t: ada
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: other
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {cmd: no, t: ada}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        cmd: no
        t: ada
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: '#else'
  - [node_started, other]
  - - pool_commit
    - other
    - value: other
  - - node_succeeded
    - other
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: other
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        cmd: no
        t: ada
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: '#else'
      node_id: route
  - - NodeSkipped
    - node_id: e
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: other
  - - NodeSucceeded
    - node_id: other
      output: other
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: other
  - - RunSucceeded
    - output: other
