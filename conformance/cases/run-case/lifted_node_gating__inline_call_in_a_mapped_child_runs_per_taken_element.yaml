      node_id: m#0/gate
  - - NodeSkipped
    - node_id: m#0/skip_it
  - - NodeStarted
    - node_id: m#1/gate
  - - NodeRouted
    - handle: '#else'
      node_id: m#1/gate
  - - NodeSkipped
    - node_id: m#1/publish
  - - NodeSkipped
    - node_id: m#1/__call_0
  - - NodeStarted
    - node_id: m#0/__call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          tag: child
      node_id: m#0/__call_0
  - - NodeStarted
    - node_id: m#1/skip_it
  - - NodeSucceeded
    - node_id: m#1/skip_it
      output: skipped
  - - NodeStarted
    - node_id: m#0/__call_0/__start__
  - - NodeSucceeded
    - node_id: m#0/__call_0/__start__
      output:
        tag: child
  - - NodeStarted
    - node_id: m#1/__end__
  - - NodeSucceeded
    - node_id: m#1/__end__
      output: skipped
  - - NodeStarted
    - node_id: m#0/__call_0/fx
  - - NodeSucceeded
    - node_id: m#0/__call_0/fx
      output: child
  - - NodeStarted
    - node_id: m#0/__call_0/__end__
  - - NodeSucceeded
    - commit_as: m#0/__call_0
      node_id: m#0/__call_0/__end__
      output: child
  - - NodeStarted
    - node_id: m#0/publish
  - - NodeSucceeded
    - node_id: m#0/publish
      output: child
  - - NodeStarted
