# From tests/engine/test_lifted_node_gating.py::test_inline_call_in_a_mapped_child_flow_runs_once_per_taken_element.
# Pins: in a MAP over a child flow, the child's lifted call runs only for the element on its route.
# The test's shared `defs:` are cut to the ones this flow calls (`meet` is never called).
kind: run
rules: [run-log]
flow: |
  id: t
  name: t
  input:
    go: !bool
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: ./fixtures/compose_codefns.ts:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
    child:
      input:
        go: !bool
      nodes:
        gate:
          kind: case
          cases:
            - when: ${input.go}
              then: publish
          else: skip_it
        publish:
          kind: code
          input:
            draft: call(side, tag="child")
          output: str
          code: return inputs["draft"]
        skip_it:
          kind: code
          output: str
          code: return "skipped"
      output: ${gate.output}
  nodes:
    m:
      kind: map
      call: child
      over: ${[input.go, input.other]}
      input:
        go: ${item}
  output:
    r: ${m.output}
python_flow: |
  id: t
  name: t
  input:
    go: !bool
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: tests.engine._compose_codefns:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
    child:
      input:
        go: !bool
      nodes:
        gate:
          kind: case
          cases:
            - when: ${input.go}
              then: publish
          else: skip_it
        publish:
          kind: code
          input:
            draft: call(side, tag="child")
          output: str
          code: return inputs["draft"]
        skip_it:
          kind: code
          output: str
          code: return "skipped"
      output: ${gate.output}
  nodes:
    m:
      kind: map
      call: child
      over: ${[input.go, input.other]}
      input:
        go: ${item}
  output:
    r: ${m.output}
inputs:
  go: true
  other: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: [child, skipped]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {go: true, other: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        go: true
        other: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, m]
  - - node_expanded
    - m
    - prune_ids: []
      seed:
      - go: true
      - go: false
  - [node_started, m/__start__]
  - - pool_commit
    - m/__start__
    - value: {}
  - - node_succeeded
    - m/__start__
    - {commit: 11}
  - [node_started, m#0/__start__]
  - - pool_commit
    - m#0/__start__
    - value:
        go: true
  - - node_succeeded
    - m#0/__start__
    - {commit: 14}
  - [node_started, m#1/__start__]
  - - pool_commit
    - m#1/__start__
    - value:
        go: false
  - - node_succeeded
    - m#1/__start__
    - {commit: 17}
  - [node_started, m#0/gate]
  - - node_routed
    - m#0/gate
    - handle: publish
  - [node_started, m#1/gate]
  - - node_routed
    - m#1/gate
    - handle: '#else'
  - [node_started, m#0/__call_0]
  - - node_expanded
    - m#0/__call_0
    - prune_ids: []
      seed:
        tag: child
  - [node_started, m#1/skip_it]
  - - pool_commit
    - m#1/skip_it
    - value: skipped
  - - node_succeeded
    - m#1/skip_it
    - {commit: 26}
  - [node_started, m#0/__call_0/__start__]
  - - pool_commit
    - m#0/__call_0/__start__
    - value:
        tag: child
  - - node_succeeded
    - m#0/__call_0/__start__
    - {commit: 29}
  - [node_started, m#1/__end__]
  - - pool_commit
    - m#1/__end__
    - value: skipped
  - - node_succeeded
    - m#1/__end__
    - {commit: 32}
  - [node_started, m#0/__call_0/fx]
  - - pool_commit
    - m#0/__call_0/fx
    - value: child
  - - node_succeeded
    - m#0/__call_0/fx
    - {commit: 35}
  - [node_started, m#0/__call_0/__end__]
  - - pool_commit
    - m#0/__call_0/__end__
    - value: child
      key: m#0/__call_0
  - - node_succeeded
    - m#0/__call_0/__end__
    - {commit: 38}
  - [node_started, m#0/publish]
  - - pool_commit
    - m#0/publish
    - value: child
  - - node_succeeded
    - m#0/publish
    - {commit: 41}
  - [node_started, m#0/__end__]
  - - pool_commit
    - m#0/__end__
    - value: child
  - - node_succeeded
    - m#0/__end__
    - {commit: 44}
  - [node_started, m/__end__]
  - - pool_commit
    - m/__end__
    - value: [child, skipped]
      key: m
  - - node_succeeded
    - m/__end__
    - {commit: 47}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        r: [child, skipped]
  - - node_succeeded
    - __end__
    - {commit: 50}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        go: true
        other: false
  - - NodeStarted
    - node_id: m
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - go: true
        - go: false
      node_id: m
  - - NodeStarted
    - node_id: m/__start__
  - - NodeSucceeded
    - node_id: m/__start__
      output: {}
  - - NodeStarted
    - node_id: m#0/__start__
  - - NodeSucceeded
    - node_id: m#0/__start__
      output:
        go: true
  - - NodeStarted
    - node_id: m#1/__start__
  - - NodeSucceeded
