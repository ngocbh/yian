# From tests/engine/test_lifted_node_gating.py::test_inline_call_is_skipped_with_a_host_data_input.
# Pins: the lifted call is skipped when another plain data input of its host is skipped.
# The test's shared `defs:` are cut to the ones this flow calls (`meet` is never called).
kind: run
flow: |
  id: t
  name: t
  input:
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: ./fixtures/compose_codefns.ts:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    pick:
      kind: case
      cases:
        - when: ${input.other}
          then: maybe
    maybe:
      kind: code
      output: str
      code: return "m"
    publish:
      kind: code
      input:
        draft: call(side, tag="draft")
        notes: ${maybe.output}
      output: str
      code: return inputs["draft"] + inputs["notes"]
  output:
    r: ${publish.output}
python_flow: |
  id: t
  name: t
  input:
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: tests.engine._compose_codefns:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    pick:
      kind: case
      cases:
        - when: ${input.other}
          then: maybe
    maybe:
      kind: code
      output: str
      code: return "m"
    publish:
      kind: code
      input:
        draft: call(side, tag="draft")
        notes: ${maybe.output}
      output: str
      code: return inputs["draft"] + inputs["notes"]
  output:
    r: ${publish.output}
inputs:
  other: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: null
  trace:
  - - run_started
    - null
    - inputs:
        other: false
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        other: false
  - [node_started, pick]
  - - node_routed
    - pick
    - handle: '#else'
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        r: null
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        other: false
  - - NodeStarted
    - node_id: pick
  - - NodeRouted
    - handle: '#else'
      node_id: pick
  - - NodeSkipped
    - node_id: maybe
  - - NodeSkipped
    - node_id: publish
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r: null
  - - RunSucceeded
    - output:
        r: null
