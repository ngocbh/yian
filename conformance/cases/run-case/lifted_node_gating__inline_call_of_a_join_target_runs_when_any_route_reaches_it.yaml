# From tests/engine/test_lifted_node_gating.py::test_inline_call_of_a_join_target_runs_when_any_route_reaches_it.
# Pins: a call lifted from a host two CASEs route to runs when the second one reaches it.
# The test's shared `defs:` are cut to the ones this flow calls (`meet` is never called).
kind: run
rules: [run-log]
flow: |
  id: t
  name: t
  input:
    go: !bool
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: ./fixtures/compose_codefns.ts:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    c1:
      kind: case
      cases:
        - when: ${input.go}
          then: publish
    c2:
      kind: case
      cases:
        - when: ${input.other}
          then: publish
    publish:
      kind: code
      input:
        draft: call(side, tag="publish")
      output: str
      code: return "published " + inputs["draft"]
  output:
    r: ${publish.output :- "none"}
python_flow: |
  id: t
  name: t
  input:
    go: !bool
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: tests.engine._compose_codefns:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    c1:
      kind: case
      cases:
        - when: ${input.go}
          then: publish
    c2:
      kind: case
      cases:
        - when: ${input.other}
          then: publish
    publish:
      kind: code
      input:
        draft: call(side, tag="publish")
      output: str
      code: return "published " + inputs["draft"]
  output:
    r: ${publish.output :- "none"}
inputs:
  go: false
  other: true
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: published publish
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {go: false, other: true}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        go: false
        other: true
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, c1]
  - - node_routed
    - c1
    - handle: '#else'
  - [node_started, c2]
  - - node_routed
    - c2
    - handle: publish
  - [node_started, __call_0]
  - - pool_commit
    - __call_0
    - from: {}
      key: __call_0/__start__
      value: {tag: publish}
  - - node_expanded
    - __call_0
    - prune_ids: []
      seed:
        tag: publish
  - [node_started, __call_0/__start__]
  - - node_succeeded
    - __call_0/__start__
    - commit: 13
  - [node_started, __call_0/fx]
  - - pool_commit
    - __call_0/fx
    - value: publish
  - - node_succeeded
    - __call_0/fx
    - {commit: 18}
  - [node_started, __call_0/__end__]
  - - pool_commit
    - __call_0/__end__
    - value: publish
      key: __call_0
      from: {__call_0/fx: 18}
  - - node_succeeded
    - __call_0/__end__
    - {commit: 21}
  - [node_started, publish]
  - - pool_commit
    - publish
    - value: published publish
  - - node_succeeded
    - publish
    - {commit: 24}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        r: published publish
  - - node_succeeded
    - __end__
    - {commit: 27}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        go: false
        other: true
  - - NodeStarted
    - node_id: c1
  - - NodeRouted
    - handle: '#else'
      node_id: c1
  - - NodeStarted
    - node_id: c2
  - - NodeRouted
    - handle: publish
      node_id: c2
  - - NodeStarted
    - node_id: __call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          tag: publish
      node_id: __call_0
  - - NodeStarted
    - node_id: __call_0/__start__
  - - NodeSucceeded
    - node_id: __call_0/__start__
      output:
        tag: publish
  - - NodeStarted
    - node_id: __call_0/fx
  - - NodeSucceeded
    - node_id: __call_0/fx
      output: publish
  - - NodeStarted
    - node_id: __call_0/__end__
  - - NodeSucceeded
    - commit_as: __call_0
      node_id: __call_0/__end__
      output: publish
  - - NodeStarted
    - node_id: publish
  - - NodeSucceeded
    - node_id: publish
      output: published publish
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r: published publish
  - - RunSucceeded
    - output:
        r: published publish
