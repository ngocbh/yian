# From tests/engine/test_lifted_node_gating.py::test_inline_call_only_waits_for_a_defaulted_host_input.
# Pins: a defaulted (`:-`) host input only makes the lifted call wait: it runs after the skip.
# The test's shared `defs:` are cut to the ones this flow calls (`meet` is never called).
kind: run
rules: [run-log]
flow: |
  id: t
  name: t
  input:
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: ./fixtures/compose_codefns.ts:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    pick:
      kind: case
      cases:
        - when: ${input.other}
          then: maybe
    maybe:
      kind: code
      output: str
      code: return "m"
    publish:
      kind: code
      input:
        draft: call(side, tag="draft")
        notes: ${maybe.output :- "none"}
      output: str
      code: return inputs["draft"] + inputs["notes"]
  output:
    r: ${publish.output}
python_flow: |
  id: t
  name: t
  input:
    other: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: tests.engine._compose_codefns:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    pick:
      kind: case
      cases:
        - when: ${input.other}
          then: maybe
    maybe:
      kind: code
      output: str
      code: return "m"
    publish:
      kind: code
      input:
        draft: call(side, tag="draft")
        notes: ${maybe.output :- "none"}
      output: str
      code: return inputs["draft"] + inputs["notes"]
  output:
    r: ${publish.output}
inputs:
  other: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: draftnone
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {other: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        other: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - - node_routed
    - pick
    - handle: '#else'
  - [node_started, __call_0]
  - - node_expanded
    - __call_0
    - prune_ids: []
      seed:
        tag: draft
  - [node_started, __call_0/__start__]
  - - pool_commit
    - __call_0/__start__
    - value:
        tag: draft
  - - node_succeeded
    - __call_0/__start__
    - {commit: 13}
  - [node_started, __call_0/fx]
  - - pool_commit
    - __call_0/fx
    - value: draft
  - - node_succeeded
    - __call_0/fx
    - {commit: 16}
  - [node_started, __call_0/__end__]
  - - pool_commit
    - __call_0/__end__
    - value: draft
      key: __call_0
  - - node_succeeded
    - __call_0/__end__
    - {commit: 19}
  - [node_started, publish]
  - - pool_commit
    - publish
    - value: draftnone
  - - node_succeeded
    - publish
    - {commit: 22}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        r: draftnone
  - - node_succeeded
    - __end__
    - {commit: 25}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        other: false
  - - NodeStarted
    - node_id: pick
  - - NodeRouted
    - handle: '#else'
      node_id: pick
  - - NodeSkipped
    - node_id: maybe
  - - NodeStarted
    - node_id: __call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          tag: draft
      node_id: __call_0
  - - NodeStarted
    - node_id: __call_0/__start__
  - - NodeSucceeded
    - node_id: __call_0/__start__
      output:
        tag: draft
  - - NodeStarted
    - node_id: __call_0/fx
  - - NodeSucceeded
    - node_id: __call_0/fx
      output: draft
  - - NodeStarted
    - node_id: __call_0/__end__
  - - NodeSucceeded
    - commit_as: __call_0
      node_id: __call_0/__end__
      output: draft
  - - NodeStarted
    - node_id: publish
  - - NodeSucceeded
    - node_id: publish
      output: draftnone
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r: draftnone
  - - RunSucceeded
    - output:
        r: draftnone
