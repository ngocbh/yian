# From tests/engine/test_lifted_node_gating.py::test_loop_seed_call_does_not_run_on_an_untaken_route.
# Pins: a LOOP seed `call(...)` never starts on the untaken route.
# The test's shared `defs:` are cut to the ones this flow calls (`meet` is never called).
kind: run
flow: |
  id: t
  name: t
  input:
    go: !bool
  defs:
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: ./fixtures/compose_codefns.ts:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.go}
          then: lp
      else: skip_it
    lp:
      kind: loop
      times: 1
      input:
        s: call(side, tag="seed")
      nodes:
        k:
          kind: code
          input:
            s: ${input.s}
          output:
            s: str
          code: |
            return {"s": inputs["s"]}
      output: ${k.output}
    skip_it:
      kind: code
      output: str
      code: return "skipped"
  output:
    r: ${skip_it.output :- "none"}
inputs:
  go: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: skipped
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {go: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        go: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, skip_it]
  - - pool_commit
    - skip_it
    - value: skipped
  - - node_succeeded
    - skip_it
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        r: skipped
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        go: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: lp
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: skip_it
  - - NodeSucceeded
    - node_id: skip_it
      output: skipped
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r: skipped
  - - RunSucceeded
    - output:
        r: skipped
