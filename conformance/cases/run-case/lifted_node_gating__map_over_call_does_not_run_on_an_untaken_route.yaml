inputs:
  go: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: skipped
  trace:
  - - run_started
    - null
    - inputs:
        go: false
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        go: false
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, skip_it]
  - - node_succeeded
    - skip_it
    - value: skipped
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        r: skipped
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        go: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: m
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: skip_it
  - - NodeSucceeded
    - node_id: skip_it
      output: skipped
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r: skipped
  - - RunSucceeded
    - output:
        r: skipped
