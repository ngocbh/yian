# From tests/engine/test_lifted_node_gating.py::test_nested_inline_call_looks_through_to_its_siblings_inputs.
# Pins: the inner call of `call(pair, x=call(side, ...), y=${maybe.output})` is skipped with the outer call's skipped argument.
# The test's shared `defs:` are cut to the ones this flow calls (`meet` is never called).
kind: run
flow: |
  id: t
  name: t
  input:
    other: !bool
  defs:
    pair:
      input:
        x: !str
        y: !str
      nodes:
        j:
          kind: code
          input:
            x: ${input.x}
            y: ${input.y}
          output: str
          code: return inputs["x"] + inputs["y"]
      output: ${j.output}
    side:
      input:
        tag: !str
      nodes:
        fx:
          kind: code
          code: ./fixtures/compose_codefns.ts:record
          input:
            tag: ${input.tag}
          output: str
      output: ${fx.output}
  nodes:
    pick:
      kind: case
      cases:
        - when: ${input.other}
          then: maybe
    maybe:
      kind: code
      output: str
      code: return "m"
    publish:
      kind: code
      input:
        draft: call(pair, x=call(side, tag="inner"), y=${maybe.output})
      output: str
      code: return inputs["draft"]
  output:
    r: ${publish.output}
inputs:
  other: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      r: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {other: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        other: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - - node_routed
    - pick
    - handle: '#else'
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        r: null
  - - node_succeeded
    - __end__
    - {commit: 11}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        other: false
  - - NodeStarted
    - node_id: pick
  - - NodeRouted
    - handle: '#else'
      node_id: pick
  - - NodeSkipped
    - node_id: maybe
  - - NodeSkipped
    - node_id: __call_1
  - - NodeSkipped
    - node_id: publish
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        r: null
  - - RunSucceeded
    - output:
        r: null
