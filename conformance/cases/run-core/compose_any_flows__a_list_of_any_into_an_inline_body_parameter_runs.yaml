kind: run
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      output: list(Any)
      code: |
        return [1, "two"]
    c:
      kind: call
      input:
        xs: ${mk.output}
      nodes:
        inner:
          kind: code
          input:
            xs: ${input.xs}
          code: return inputs['xs']
      output: ${inner.output}
  output: ${c.output}
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [1, two]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, mk]
  - - pool_commit
    - mk
    - value: [1, two]
  - - node_succeeded
    - mk
    - {commit: 9}
  - [node_started, c]
  - - pool_commit
    - c
    - from: {mk: 9}
      key: c/__start__
  - - node_expanded
    - c
    - prune_ids: []
  - [node_started, c/__start__]
  - - node_succeeded
    - c/__start__
    - commit: 12
  - [node_started, c/inner]
  - - pool_commit
    - c/inner
    - value: [1, two]
  - - node_succeeded
    - c/inner
    - {commit: 17}
  - [node_started, c/__end__]
  - - pool_commit
    - c/__end__
    - key: c
      from: {c/inner: 17}
  - - node_succeeded
    - c/__end__
    - {commit: 20}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [1, two]
  - - node_succeeded
    - __end__
    - {commit: 23}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
  - - NodeStarted
    - node_id: mk
  - - NodeSucceeded
    - node_id: mk
      output: [1, two]
  - - NodeStarted
    - node_id: c
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          xs: [1, two]
      node_id: c
  - - NodeStarted
    - node_id: c/__start__
  - - NodeSucceeded
    - node_id: c/__start__
      output:
        xs: [1, two]
  - - NodeStarted
    - node_id: c/inner
  - - NodeSucceeded
    - node_id: c/inner
      output: [1, two]
  - - NodeStarted
    - node_id: c/__end__
  - - NodeSucceeded
    - commit_as: c
      node_id: c/__end__
      output: [1, two]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [1, two]
  - - RunSucceeded
    - output: [1, two]
