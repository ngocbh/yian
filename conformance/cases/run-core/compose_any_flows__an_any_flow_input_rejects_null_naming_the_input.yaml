# hand TS expect: The null value is shown in the text form in TS (rules: messages).
kind: run
flow: |
  id: p
  name: p
  input:
    v: !Any
  nodes:
    n:
      kind: code
      input:
        v: ${input.v}
      code: return inputs['v']
  output: ${n.output}
inputs:
  v: null
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [4, 6, 4, 10]
      message: 'input ''v'': null does not match declared type Any'
      node: __start__
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {v: null}
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [4, 6, 4, 10]
        message: 'input ''v'': null does not match declared type Any'
        node: __start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [4, 6, 4, 10]
        message: 'input ''v'': null does not match declared type Any'
        node: __start__
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [4, 6, 4, 10]
        message: 'input ''v'': null does not match declared type Any'
        node: __start__
