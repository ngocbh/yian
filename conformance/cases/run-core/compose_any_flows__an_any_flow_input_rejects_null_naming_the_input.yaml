# The null value is shown in the text form in TS (rules: messages).
kind: run
rules: [messages]
flow: |
  id: p
  name: p
  input:
    v: !Any
  nodes:
    n:
      kind: code
      input:
        v: ${input.v}
      code: return inputs['v']
  output: ${n.output}
inputs:
  v: null
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [4, 6, 4, 10]
      message: 'input ''v'': null does not match declared type Any'
      node: __start__
  trace:
  - - run_started
    - null
    - inputs:
        v: null
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [4, 6, 4, 10]
        message: 'input ''v'': null does not match declared type Any'
        node: __start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [4, 6, 4, 10]
        message: 'input ''v'': null does not match declared type Any'
        node: __start__
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [4, 6, 4, 10]
        message: 'input ''v'': null does not match declared type Any'
        node: __start__
