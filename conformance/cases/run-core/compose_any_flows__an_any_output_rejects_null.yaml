# hand TS expect: The TS CODE body returns null; the message shows it in the text form (rules: messages).
kind: run
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      output: Any
      code: |
        return null
  output: ${mk.output}
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.output
      frames:
      - label: flow.yaml
        range: [10, 13, 10, 16]
      message: null does not match declared type Any
      node: mk
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, mk]
  - - node_failed
    - mk
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [10, 13, 10, 16]
        message: null does not match declared type Any
        node: mk
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
  - - NodeStarted
    - node_id: mk
  - - NodeFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [10, 13, 10, 16]
        message: null does not match declared type Any
        node: mk
  - - RunFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [10, 13, 10, 16]
        message: null does not match declared type Any
        node: mk
