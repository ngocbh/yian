kind: run
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      output: Any
      code: |
        return "1"
    route:
      kind: case
      on: ${mk.output}
      cases:
        - when: 1
          then: hit
      else: miss
    hit:
      kind: code
      output: str
      code: return 'hit'
    miss:
      kind: code
      output: str
      code: return 'miss'
  output: ${hit.output | miss.output}
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: miss
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, mk]
  - - pool_commit
    - mk
    - value: '1'
  - - node_succeeded
    - mk
    - {commit: 9}
  - [node_started, route]
  - - node_routed
    - route
    - handle: '#else'
  - [node_started, miss]
  - - pool_commit
    - miss
    - value: miss
  - - node_succeeded
    - miss
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: miss
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
      interrupted: false
  - - NodeStarted
    - node_id: mk
  - - NodeSucceeded
    - node_id: mk
      output: '1'
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: '#else'
      node_id: route
  - - NodeSkipped
    - node_id: hit
  - - NodeStarted
    - node_id: miss
  - - NodeSucceeded
    - node_id: miss
      output: miss
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: miss
      interrupted: false
  - - RunSucceeded
    - output: miss
