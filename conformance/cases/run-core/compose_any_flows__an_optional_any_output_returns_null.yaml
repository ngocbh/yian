kind: run
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      output: Optional(Any)
      code: |
        return null
  output: ${mk.output}
python_flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      output: Optional(Any)
      code: |
        return None
  output: ${mk.output}
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - inputs:
        s: x
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        s: x
  - [node_started, mk]
  - [node_succeeded, mk]
  - [node_started, __end__]
  - [node_succeeded, __end__]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
  - - NodeStarted
    - node_id: mk
  - - NodeSucceeded
    - node_id: mk
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
  - [RunSucceeded]
