kind: run
rules: [messages]
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: object
      code: |
        return inputs["order"]
    c:
      kind: code
      input:
        nested:
          first: ${Buy(d.output)}
      code: |
        return inputs["nested"]
  output: ${c.output}
inputs:
  order:
    action: sell
    price: 1.5
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [22, 16, 22, 32]
      message: 'binding ''nested.first'': Buy(...): record missing required fields: ["conviction"]'
      node: c
  trace:
  - - run_started
    - null
    - inputs:
        order:
          action: sell
          price: 1.5
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        order:
          action: sell
          price: 1.5
  - [node_started, d]
  - - node_succeeded
    - d
    - value:
        action: sell
        price: 1.5
  - [node_started, c]
  - - node_failed
    - c
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [22, 16, 22, 32]
        message: 'binding ''nested.first'': Buy(...): record missing required fields: ["conviction"]'
        node: c
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        order:
          action: sell
          price: 1.5
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        action: sell
        price: 1.5
  - - NodeStarted
    - node_id: c
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [22, 16, 22, 32]
        message: 'binding ''nested.first'': Buy(...): record missing required fields: ["conviction"]'
        node: c
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [22, 16, 22, 32]
        message: 'binding ''nested.first'': Buy(...): record missing required fields: ["conviction"]'
        node: c
