kind: run
rules: [messages, run-log]
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: object
      code: |
        return inputs["order"]
    c:
      kind: code
      input:
        x: ${Decision(d.output.decision)}
        size: ${Size(d.output.size)}
      code: |
        return [inputs["x"]["action"], inputs["size"]]
  output: ${c.output}
inputs:
  order:
    decision:
      action: sell
      price: 1.5
    size: xl
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [22, 13, 22, 35]
      message: 'Size(...): "xl" is not a member of variant ["l","m","s"]'
      node: c
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        order:
          decision: {action: sell, price: 1.5}
          size: xl
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        order:
          decision:
            action: sell
            price: 1.5
          size: xl
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - pool_commit
    - d
    - value:
        decision:
          action: sell
          price: 1.5
        size: xl
  - - node_succeeded
    - d
    - {commit: 9}
  - [node_started, c]
  - - node_failed
    - c
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [22, 13, 22, 35]
        message: 'Size(...): "xl" is not a member of variant ["l","m","s"]'
        node: c
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        order:
          decision:
            action: sell
            price: 1.5
          size: xl
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        decision:
          action: sell
          price: 1.5
        size: xl
  - - NodeStarted
    - node_id: c
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [22, 13, 22, 35]
        message: 'Size(...): "xl" is not a member of variant ["l","m","s"]'
        node: c
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [22, 13, 22, 35]
        message: 'Size(...): "xl" is not a member of variant ["l","m","s"]'
        node: c
