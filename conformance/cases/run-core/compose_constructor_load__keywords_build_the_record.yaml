kind: run
rules: [run-log]
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: object
      code: |
        return inputs["order"]
    c:
      kind: code
      input:
        x: ${Buy(action="buy", conviction=d.output.conviction)}
      code: |
        return inputs["x"]
  output: ${c.output}
inputs:
  order:
    action: buy
    conviction: 0.5
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      action: buy
      conviction: 0.5
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        order: {action: buy, conviction: 0.5}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        order:
          action: buy
          conviction: 0.5
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - pool_commit
    - d
    - value:
        action: buy
        conviction: 0.5
  - - node_succeeded
    - d
    - {commit: 9}
  - [node_started, c]
  - - pool_commit
    - c
    - value:
        action: buy
        conviction: 0.5
  - - node_succeeded
    - c
    - {commit: 12}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        action: buy
        conviction: 0.5
  - - node_succeeded
    - __end__
    - {commit: 15}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        order:
          action: buy
          conviction: 0.5
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        action: buy
        conviction: 0.5
  - - NodeStarted
    - node_id: c
  - - NodeSucceeded
    - node_id: c
      output:
        action: buy
        conviction: 0.5
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        action: buy
        conviction: 0.5
  - - RunSucceeded
    - output:
        action: buy
        conviction: 0.5
