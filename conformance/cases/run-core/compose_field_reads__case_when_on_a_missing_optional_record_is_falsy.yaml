kind: run
rules: [run-log, null-field-read]
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
  input:
    s: !str
    maybe: !Optional(Rec)
  nodes:
    route:
      kind: case
      cases:
        - when: ${input.maybe?.a == 'x'}
          then: hit
      else: miss
    hit:
      kind: code
      input:
        s: ${input.s}
      output: str
      code: return 'hit'
    miss:
      kind: code
      input:
        s: ${input.s}
      output: str
      code: return 'miss'
  output: ${hit.output | miss.output}
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: miss
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: '#else'
  - [node_started, miss]
  - - pool_commit
    - miss
    - value: miss
  - - node_succeeded
    - miss
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: miss
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: '#else'
      node_id: route
  - - NodeSkipped
    - node_id: hit
  - - NodeStarted
    - node_id: miss
  - - NodeSucceeded
    - node_id: miss
      output: miss
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: miss
  - - RunSucceeded
    - output: miss
