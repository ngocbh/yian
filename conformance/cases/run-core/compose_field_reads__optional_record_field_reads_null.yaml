kind: run
rules: [run-log]
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
  input:
    s: !str
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Optional(Rec)
      code: "return null"
  output:
    a: ${step.output.a}
    note: 'a=${step.output.a}'
python_flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
  input:
    s: !str
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Optional(Rec)
      code: return None
  output:
    a: ${step.output.a}
    note: 'a=${step.output.a}'
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      a: null
      note: a=
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, step]
  - [pool_commit, step]
  - - node_succeeded
    - step
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        a: null
        note: a=
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
  - - NodeStarted
    - node_id: step
  - - NodeSucceeded
    - node_id: step
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        a: null
        note: a=
  - - RunSucceeded
    - output:
        a: null
        note: a=
