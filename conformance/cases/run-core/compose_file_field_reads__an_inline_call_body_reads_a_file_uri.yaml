kind: run
rules: [run-log]
flow: |
  id: p
  name: p
  input:
    f: !file
  nodes:
    b:
      kind: call
      input:
        s: ${input.f.uri}
      nodes:
        k: {kind: code, input: {s: "${input.s}"}, code: "return inputs['s']"}
      output: ${k.output}
  output: ${b.output}
inputs:
  f:
    uri: f
    mime: text/plain
    name: null
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: f
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        f: {mime: text/plain, name: null, uri: f}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        f:
          mime: text/plain
          name: null
          uri: f
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, b]
  - - pool_commit
    - b
    - from: {__start__: 6}
      key: b/__start__
      value: {s: f}
  - - node_expanded
    - b
    - prune_ids: []
      seed:
        s: f
  - [node_started, b/__start__]
  - - node_succeeded
    - b/__start__
    - commit: 9
  - [node_started, b/k]
  - - pool_commit
    - b/k
    - value: f
  - - node_succeeded
    - b/k
    - {commit: 14}
  - [node_started, b/__end__]
  - - pool_commit
    - b/__end__
    - value: f
      key: b
      from: {b/k: 14}
  - - node_succeeded
    - b/__end__
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: f
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        f:
          mime: text/plain
          name: null
          uri: f
  - - NodeStarted
    - node_id: b
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          s: f
      node_id: b
  - - NodeStarted
    - node_id: b/__start__
  - - NodeSucceeded
    - node_id: b/__start__
      output:
        s: f
  - - NodeStarted
    - node_id: b/k
  - - NodeSucceeded
    - node_id: b/k
      output: f
  - - NodeStarted
    - node_id: b/__end__
  - - NodeSucceeded
    - commit_as: b
      node_id: b/__end__
      output: f
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: f
  - - RunSucceeded
    - output: f
