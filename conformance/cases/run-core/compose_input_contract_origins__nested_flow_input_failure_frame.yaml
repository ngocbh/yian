kind: run
rules: [messages]
flow: |
  id: input-contract-origins
  name: input-contract-origins
  typedefs:
    Profile:
      age: int
      nickname: Optional(str)
    Payload:
      profile: Profile
    Limits:
      count: int
    Flags:
      enabled: bool
      limits: Limits
  input:
    topic: !str
    window: !int 30
    payload: !Payload
    flags: !Flags
  nodes:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.topic}
      output: str
  output: ${echo.output}
python_flow: |
  id: input-contract-origins
  name: input-contract-origins
  typedefs:
    Profile:
      age: int
      nickname: Optional(str)
    Payload:
