# hand TS expect: Python prints `(from=None)` in this message and no shim converts it; TS shows the null in the text form (rules: messages).
kind: run
rules: [messages]
flow: |
  id: input-contract-origins
  name: input-contract-origins
  typedefs:
    Profile:
      age: int
      nickname: Optional(str)
    Payload:
      profile: Profile
    Limits:
      count: int
    Flags:
      enabled: bool
      limits: Limits
  input:
    topic: !str
    window: !int 30
    payload: !Payload
    flags: !Flags
  nodes:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.topic}
      output: str
  output: ${echo.output}
python_flow: |
  id: input-contract-origins
  name: input-contract-origins
  typedefs:
    Profile:
      age: int
      nickname: Optional(str)
    Payload:
      profile: Profile
    Limits:
      count: int
    Flags:
      enabled: bool
      limits: Limits
  input:
    topic: !str
    window: !int 30
    payload: !Payload
    flags: !Flags
  nodes:
    echo:
      kind: code
      code: tests.engine._compose_codefns:echo_x
      input:
        x: ${input.topic}
      output: str
  output: ${echo.output}
inputs:
  payload:
    profile:
      age: 7
  flags:
    enabled: true
    limits:
      count: 1
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [15, 3, 15, 8]
      message: required input 'topic' is unbound (from=null)
      node: __start__
  trace:
  - - run_started
    - null
    - inputs:
        flags:
          enabled: true
          limits:
            count: 1
        payload:
          profile:
            age: 7
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [15, 3, 15, 8]
        message: required input 'topic' is unbound (from=null)
        node: __start__
  events:
  - [RunStarted]
