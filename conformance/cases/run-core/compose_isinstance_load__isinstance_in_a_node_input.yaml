kind: run
rules: [run-log]
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
    Order: Union(Buy, Sell)
    Running: Literal(running)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: Order
      code: |
        return inputs["order"]
    check:
      kind: code
      input:
        ok: ${isinstance(d.output, Buy)}
        known: ${isinstance(input.order, object)}
      code: |
        return [inputs["ok"], inputs["known"]]
  output: ${check.output}
inputs:
  order:
    action: sell
    price: 1.5
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [false, true]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        order: {action: sell, price: 1.5}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        order:
          action: sell
          price: 1.5
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - pool_commit
    - d
    - value:
        action: sell
        price: 1.5
  - - node_succeeded
    - d
    - {commit: 9}
  - [node_started, check]
  - - pool_commit
    - check
    - value: [false, true]
  - - node_succeeded
    - check
    - {commit: 12}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [false, true]
  - - node_succeeded
    - __end__
    - {commit: 15}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        order:
          action: sell
          price: 1.5
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        action: sell
        price: 1.5
  - - NodeStarted
    - node_id: check
  - - NodeSucceeded
    - node_id: check
      output: [false, true]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [false, true]
  - - RunSucceeded
    - output: [false, true]
