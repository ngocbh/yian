kind: run
rules: [run-log]
flow: |2

  id: nested_map
  name: nested_map
  defs:
    wrap:
      input:
        v: !int
      nodes:
        e:
          kind: code
          input:
            v: ${input.v}
          code: "return inputs[\"v\"] * 10"
        w:
          kind: code
          input:
            x:
              v: ${input.v}
              e: ['${e.output}']
              note: v=${input.v}
          code: return inputs["x"]
      output: ${w.output}
  nodes:
    m:
      kind: map
      call: wrap
      over: [1, 2]
      input:
        v: ${item}
  output: ${m.output}
python_flow: |2

  id: nested_map
  name: nested_map
  defs:
    wrap:
      input:
        v: !int
      nodes:
        e:
          kind: code
          input:
            v: ${input.v}
          code: return inputs["v"] * 10
        w:
          kind: code
          input:
            x:
              v: ${input.v}
              e: ['${e.output}']
              note: v=${input.v}
          code: return inputs["x"]
      output: ${w.output}
  nodes:
    m:
      kind: map
      call: wrap
      over: [1, 2]
      input:
        v: ${item}
  output: ${m.output}
run:
  num_workers: 0
expect:
