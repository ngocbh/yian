    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, m]
  - - node_expanded
    - m
    - prune_ids: []
      seed:
      - v: 1
      - v: 2
  - [node_started, m/__start__]
  - - node_succeeded
    - m/__start__
    - value: {}
  - [node_started, m#0/__start__]
  - - node_succeeded
    - m#0/__start__
    - value:
        v: 1
  - [node_started, m#1/__start__]
  - - node_succeeded
    - m#1/__start__
    - value:
        v: 2
  - [node_started, m#0/e]
  - - node_succeeded
    - m#0/e
    - value: 10
  - [node_started, m#1/e]
  - - node_succeeded
    - m#1/e
    - value: 20
  - [node_started, m#0/w]
  - - node_succeeded
    - m#0/w
    - value:
        e: [10]
        note: v=1
        v: 1
  - [node_started, m#1/w]
  - - node_succeeded
    - m#1/w
    - value:
        e: [20]
        note: v=2
        v: 2
