    - value:
        e: [20]
        note: v=2
        v: 2
  - [node_started, m/__end__]
  - - node_succeeded
    - m/__end__
    - commit_target: m
      value:
      - e: [10]
        note: v=1
        v: 1
      - e: [20]
        note: v=2
        v: 2
