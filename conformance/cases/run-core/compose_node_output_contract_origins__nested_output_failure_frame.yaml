kind: run
rules: [messages]
flow: |
  id: nested-output-contract
  name: nested-output-contract
  nodes:
    emit:
      kind: code
      code: |-
        return {"profile": {"age": "bad", "name": "Ada"}, "ok": true}
      output:
        profile:
          age: int
          name: str
        ok: bool
  output: ${emit.output}
python_flow: |
  id: nested-output-contract
