kind: run
flow: |
  id: old_bindings
  name: old_bindings
  typedefs:
    Buy: {action: Literal(buy)}
    Sell: {action: Literal(sell)}
  input:
    n: !int
  nodes:
    size:
      kind: code
      code: "return {'qty': inputs['n']}"
      input:
        n: ${input.n}
      output: {qty: int}
    use:
      kind: code
      code: return inputs['note']
      input:
        note: "int = 5"
      output: str
  output: ${use.output}
inputs:
  n: 3
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: int = 5
  trace:
  - - run_started
    - null
    - inputs:
        n: 3
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        n: 3
  - [node_started, size]
  - - node_succeeded
    - size
    - value:
        qty: 3
  - [node_started, use]
  - - node_succeeded
    - use
    - value: int = 5
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: int = 5
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: 3
  - - NodeStarted
    - node_id: size
  - - NodeSucceeded
    - node_id: size
      output:
        qty: 3
  - - NodeStarted
    - node_id: use
  - - NodeSucceeded
    - node_id: use
      output: int = 5
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: int = 5
  - - RunSucceeded
    - output: int = 5
