kind: run
flow: |2

  id: checked
  name: checked
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: !str $${x}
  output: ${use.output}
python_flow: |2

  id: checked
  name: checked
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo_x
      input:
        x: !str $${x}
  output: ${use.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ${x}
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, use]
  - - node_succeeded
    - use
    - value: ${x}
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ${x}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: use
  - - NodeSucceeded
    - node_id: use
      output: ${x}
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ${x}
  - - RunSucceeded
    - output: ${x}
