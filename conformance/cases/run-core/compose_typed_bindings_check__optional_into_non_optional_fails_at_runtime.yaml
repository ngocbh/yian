kind: run
rules: [messages]
flow: |2

  id: checked
  name: checked
  nodes:
    maybe:
      kind: code
      code: |
        return null
      output: Optional(int)
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: !int ${maybe.output}
  output: ${use.output}
python_flow: |2

  id: checked
  name: checked
  nodes:
