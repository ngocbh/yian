run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [14, 10, 14, 30]
      message: 'binding ''x'': null does not match declared type int'
      node: use
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, maybe]
  - [node_succeeded, maybe]
  - [node_started, use]
  - - node_failed
