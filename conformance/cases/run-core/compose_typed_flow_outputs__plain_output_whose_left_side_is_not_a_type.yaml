kind: run
flow: |2

  id: plain
  name: plain
  nodes:
    n:
      kind: code
      code: |
        return 1
  output: a = b
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: a = b
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, n]
  - - node_succeeded
    - n
    - value: 1
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: a = b
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: n
  - - NodeSucceeded
    - node_id: n
      output: 1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: a = b
  - - RunSucceeded
    - output: a = b
