kind: run
flow: |
  id: p
  name: p
  nodes:
    b:
      kind: code
      code: return 1
  output:
    as_of: "2026-01-01"
    h: ${b.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      as_of: 2026-01-01
      h: 1
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, b]
  - - pool_commit
    - b
    - value: 1
  - - node_succeeded
    - b
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        as_of: 2026-01-01
        h: 1
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: b
  - - NodeSucceeded
    - node_id: b
      output: 1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        as_of: 2026-01-01
        h: 1
  - - RunSucceeded
    - output:
        as_of: 2026-01-01
        h: 1
