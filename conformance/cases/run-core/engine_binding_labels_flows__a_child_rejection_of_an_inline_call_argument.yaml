  - - NodeStarted
    - node_id: m
  - - NodeSucceeded
    - node_id: m
      output: x
  - - NodeStarted
    - node_id: __call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          y: x
      node_id: __call_0
  - - NodeStarted
