kind: run
rules: [messages]
flow: |
  id: f
  name: f

  defs:
    child:
      input:
        y: !float
      nodes:
        c:
          kind: code
          code: "return inputs['y']"
          input:
            y: ${input.y}
          output: float
      output: ${c.output}
    check:
      input:
        y: !float
      nodes:
        c:
          kind: code
          code: "return true"
          input:
            y: ${input.y}
          output: bool
      output: ${c.output}
    lister:
      input:
        n: !float
      nodes:
        c:
          kind: code
          code: "return [inputs['n']]"
          input:
            n: ${input.n}
          output: list(float)
      output: ${c.output}

  nodes:
    m:
      kind: code
      code: return "x"
    n:
      kind: code
      code: "return inputs['a']"
      input:
        a: call(child, y=${m.output})
      output: float
  output: ${n.output}
