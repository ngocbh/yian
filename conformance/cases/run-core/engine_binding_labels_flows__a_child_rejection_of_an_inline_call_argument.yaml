run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [47, 10, 47, 36]
      - label: flow.yaml
        range: [7, 10, 7, 16]
      message: 'input ''y'': "x" does not match declared type float'
      node: __call_0/__start__
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, m]
  - - node_succeeded
    - m
    - value: x
  - [node_started, __call_0]
  - - node_expanded
    - __call_0
    - prune_ids: []
      seed:
        y: x
  - [node_started, __call_0/__start__]
  - - node_failed
    - __call_0/__start__
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [47, 10, 47, 36]
        - label: flow.yaml
          range: [7, 10, 7, 16]
        message: 'input ''y'': "x" does not match declared type float'
        node: __call_0/__start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
