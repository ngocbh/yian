kind: run
rules: [messages]
flow: "\nid: f\nname: f\nnodes:\n  m:\n    kind: code\n    code: |\n      return \"x\"\noutput: \n  r: !int ${m.output}\n"
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [10, 6, 10, 22]
      message: 'flow output ''r'': "x" does not match declared type int'
      node: __end__
