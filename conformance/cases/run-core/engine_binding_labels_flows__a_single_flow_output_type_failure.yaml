kind: run
flow: |2

  id: f
  name: f
  nodes:
    m:
      kind: code
      code: |
        return "x"
  output: !int ${m.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [9, 9, 9, 25]
      message: 'flow output: "x" does not match declared type int'
      node: __end__
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, m]
  - - pool_commit
    - m
    - value: x
  - - node_succeeded
    - m
    - {commit: 9}
  - [node_started, __end__]
  - - node_failed
    - __end__
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [9, 9, 9, 25]
        message: 'flow output: "x" does not match declared type int'
        node: __end__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: m
  - - NodeSucceeded
    - node_id: m
      output: x
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [9, 9, 9, 25]
        message: 'flow output: "x" does not match declared type int'
        node: __end__
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [9, 9, 9, 25]
        message: 'flow output: "x" does not match declared type int'
        node: __end__
