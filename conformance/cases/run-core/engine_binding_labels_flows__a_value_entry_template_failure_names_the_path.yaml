kind: run
flow: |2

  id: f
  name: f
  input:
    x: !float
    z: !float
  nodes:
    v: !object {a: "${input.x / input.z}"}
  output: ${v.output}
inputs:
  x: 1.0
  z: 0.0
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [8, 18, 8, 40]
      message: 'value entry ''v'' at a: division by zero: 1 / 0'
      node: v
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {x: 1, z: 0}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        x: 1
        z: 0
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, v]
  - - node_failed
    - v
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 18, 8, 40]
        message: 'value entry ''v'' at a: division by zero: 1 / 0'
        node: v
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        x: 1
        z: 0
      interrupted: false
  - - NodeStarted
    - node_id: v
  - - NodeFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 18, 8, 40]
        message: 'value entry ''v'' at a: division by zero: 1 / 0'
        node: v
  - - RunFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 18, 8, 40]
        message: 'value entry ''v'' at a: division by zero: 1 / 0'
        node: v
