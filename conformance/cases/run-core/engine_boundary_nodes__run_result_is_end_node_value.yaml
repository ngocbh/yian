kind: run
flow: |2

  id: f
  name: f
  input:
    x: !str
  nodes:
    n:
      kind: code
      input:
        x: ${input.x}
      output: str
      code: ./fixtures/compose_codefns.ts:echo_x
  output: ${n.output}
python_flow: |2

  id: f
  name: f
  input:
    x: !str
  nodes:
    n:
      kind: code
      input:
        x: ${input.x}
      output: str
      code: tests.engine._compose_codefns:echo_x
  output: ${n.output}
inputs:
  x: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ACME
  trace:
  - - run_started
    - null
    - inputs:
        x: ACME
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        x: ACME
  - [node_started, n]
  - - node_succeeded
    - n
    - value: ACME
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ACME
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        x: ACME
  - - NodeStarted
    - node_id: n
  - - NodeSucceeded
    - node_id: n
      output: ACME
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ACME
  - - RunSucceeded
