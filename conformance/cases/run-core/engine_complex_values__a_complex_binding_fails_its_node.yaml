kind: run
rules: [arithmetic, run-log]
flow: |2

  id: complex
  name: complex
  nodes:
    n:
      kind: code
      input:
        v: ${(0 - 8) ** 0.5}
      code: |
        return inputs["v"]
  output: ${n.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [8, 10, 8, 27]
      message: '** on -8 and 0.5 has no numeric result'
      node: n
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, n]
  - - node_failed
    - n
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 10, 8, 27]
        message: '** on -8 and 0.5 has no numeric result'
        node: n
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: n
  - - NodeFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 10, 8, 27]
        message: '** on -8 and 0.5 has no numeric result'
        node: n
  - - RunFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 10, 8, 27]
        message: '** on -8 and 0.5 has no numeric result'
        node: n
