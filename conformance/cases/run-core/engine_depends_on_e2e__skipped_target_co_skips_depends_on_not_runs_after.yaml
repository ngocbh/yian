kind: run
flow: |2

  id: ordering-e2e
  name: ordering_e2e
  input:
    score: !float
    topic: !str
  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: warm
    warm:
      kind: code
      code: ./fixtures/compose_codefns.ts:pick_pro
      input:
        topic: ${input.topic}
      output: str
    dep_fetch:
      kind: code
      depends_on: [warm]
      code: ./fixtures/compose_codefns.ts:positive
      input:
        topic: ${input.topic}
      output: str
    after_fetch:
      kind: code
      runs_after: [warm]
      code: ./fixtures/compose_codefns.ts:cautious
      input:
        topic: ${input.topic}
      output: str
  output: ${dep_fetch.output | after_fetch.output}
inputs:
  score: 0.2
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: cautious note for ACME
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {score: 0.2, topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        score: 0.2
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, after_fetch]
  - - pool_commit
    - after_fetch
    - value: cautious note for ACME
  - - node_succeeded
    - after_fetch
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: cautious note for ACME
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        score: 0.2
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: warm
  - - NodeSkipped
    - node_id: dep_fetch
  - - NodeStarted
    - node_id: after_fetch
  - - NodeSucceeded
    - node_id: after_fetch
      output: cautious note for ACME
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: cautious note for ACME
      interrupted: false
  - - RunSucceeded
    - output: cautious note for ACME
