# hand TS expect: 2.0 ** 5000 is inf in TS (infinity is a float value) and inf > 0 holds, so the START assert passes
# and the run succeeds; output only (no TS trace or events). python_expect is Python's assertion failure.
kind: run
rules: [arithmetic, infinity]
flow: |2

  id: arith
  name: arith
  input:
    n: !int
  asserts:
    - 2.0 ** input.n > 0
  nodes:
    n:
      kind: code
      output: str
      code: return "ok"
  output: ${n.output}
inputs:
  n: 5000
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ok
python_expect:
  output:
    status: failed
    failure:
      code: assertion.failed
      frames:
      - label: flow.yaml
        range: [7, 5, 7, 23]
      message: 'node ''__start__'' post-assert failed: 2.0 ** input.n > 0'
      node: __start__
  trace:
  - - run_started
    - null
    - inputs:
        n: 5000
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [7, 5, 7, 23]
        message: 'node ''__start__'' post-assert failed: 2.0 ** input.n > 0'
        node: __start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [7, 5, 7, 23]
        message: 'node ''__start__'' post-assert failed: 2.0 ** input.n > 0'
        node: __start__
  - - RunFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [7, 5, 7, 23]
        message: 'node ''__start__'' post-assert failed: 2.0 ** input.n > 0'
        node: __start__
