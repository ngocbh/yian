kind: run
flow: |2

  id: f
  name: f
  input:
    a: !Optional(str) null
    b: !Optional(str) null
  nodes:
    n:
      kind: code
      code: "return inputs['v']"
      input:
        v: ${input.a :- (input.b :- "lit")}
      output: Optional(str)
  output: ${n.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: lit
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        a: null
        b: null
  - [node_started, n]
  - - node_succeeded
    - n
    - value: lit
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: lit
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        a: null
        b: null
  - - NodeStarted
    - node_id: n
  - - NodeSucceeded
    - node_id: n
      output: lit
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: lit
  - - RunSucceeded
    - output: lit
