kind: run
flow: |2

  id: f
  name: f
  input:
    n: !Optional(int) null
    approve: !bool false
    label: !str none
  nodes:
    score:
      kind: code
      code: "return inputs['n']"
      input: {n: '${input.n}'}
      output: Optional(int)
    gate:
      kind: case
      on: ${input.label}
      cases:
        - when: go
          then: hot
      else: cold
    hot: {kind: code, code: "return 'hot'", output: str}
    cold: {kind: code, code: "return 'cold'", output: str}
  output: ${hot.output | cold.output}
inputs:
  label: go
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: hot
  trace:
  - - run_started
    - null
    - inputs:
        label: go
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        approve: false
        label: go
        n: null
  - [node_started, score]
  - [node_succeeded, score]
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: hot
  - [node_started, hot]
  - - node_succeeded
    - hot
    - value: hot
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: hot
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
        label: go
        n: null
  - - NodeStarted
    - node_id: score
  - - NodeSucceeded
    - node_id: score
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: hot
      node_id: gate
  - - NodeSkipped
    - node_id: cold
  - - NodeStarted
    - node_id: hot
  - - NodeSucceeded
    - node_id: hot
      output: hot
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: hot
  - - RunSucceeded
    - output: hot
