kind: run
rules: [run-log]
flow: |
  id: nested
  name: nested
  nodes:
    n:
      kind: code
      output: str
      code: |
        return "hi"
  output:
    a:
      b: ${n.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      a:
        b: hi
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, n]
  - - pool_commit
    - n
    - value: hi
  - - node_succeeded
    - n
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        a:
          b: hi
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: n
  - - NodeSucceeded
    - node_id: n
      output: hi
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        a:
          b: hi
  - - RunSucceeded
    - output:
        a:
          b: hi
