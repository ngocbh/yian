kind: run
flow: |2

  id: p
  name: p
  typedefs:
    Item:
      qty: int
  input:
    item: !Optional(Item)
  defs:
    take:
      input:
        item: !Item
      nodes:
        d:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.item.qty}
          output: int
      output: ${d.output}
  nodes:
    gate:
      kind: case
      cases:
        - when: input.item != null
          then: use
      else: skip
    use:
      kind: call
      call: take
      input:
        item: ${input.item}
    skip:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: 0
      output: int
  output: ${use.output :- skip.output}
python_flow: |2

  id: p
  name: p
  typedefs:
    Item:
      qty: int
  input:
    item: !Optional(Item)
  defs:
    take:
      input:
        item: !Item
      nodes:
        d:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.item.qty}
          output: int
      output: ${d.output}
  nodes:
    gate:
      kind: case
      cases:
        - when: input.item != null
          then: use
      else: skip
    use:
      kind: call
      call: take
      input:
        item: ${input.item}
    skip:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: 0
      output: int
  output: ${use.output :- skip.output}
inputs:
  item: null
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 0
  trace:
  - - run_started
    - null
    - inputs:
        item: null
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        item: null
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, skip]
  - - node_succeeded
    - skip
    - value: 0
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: 0
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        item: null
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: use
  - - NodeStarted
    - node_id: skip
  - - NodeSucceeded
    - node_id: skip
      output: 0
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 0
  - - RunSucceeded
    - output: 0
