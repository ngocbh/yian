kind: run
rules: [run-log]
flow: |2

  id: p
  name: p
  input:
    s: !Optional(str)
    items: !list(int)
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: ${input.s}
      output: Optional(str)
    gate:
      kind: case
      cases:
        - when: x.output != null
          then: use
      else: skip
    use:
      kind: call
      call: take
      input:
        v: ${x.output}
    skip:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: skipped
      output: str
  output: ${use.output :- skip.output}
  defs:
    take:
      input:
        v: !str
      nodes:
        d:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.v}
          output: str
      output: ${d.output}
    take_each:
      input:
        i: !int
        v: !str
      nodes:
        d:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.v}
          output: str
      output: ${d.output}
python_flow: |2

  id: p
  name: p
  input:
    s: !Optional(str)
    items: !list(int)
  nodes:
    x:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: ${input.s}
      output: Optional(str)
    gate:
      kind: case
      cases:
        - when: x.output != null
          then: use
      else: skip
    use:
      kind: call
      call: take
      input:
        v: ${x.output}
    skip:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: skipped
      output: str
  output: ${use.output :- skip.output}
  defs:
    take:
      input:
        v: !str
      nodes:
        d:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.v}
          output: str
      output: ${d.output}
    take_each:
      input:
        i: !int
        v: !str
      nodes:
        d:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.v}
          output: str
      output: ${d.output}
inputs:
  s: null
  items: [1, 2]
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: skipped
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        items: [1, 2]
        s: null
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        items: [1, 2]
        s: null
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, x]
  - [pool_commit, x]
  - - node_succeeded
    - x
    - {commit: 9}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, skip]
  - - pool_commit
    - skip
    - value: skipped
  - - node_succeeded
    - skip
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: skipped
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        items: [1, 2]
        s: null
  - - NodeStarted
    - node_id: x
  - - NodeSucceeded
    - node_id: x
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: use
  - - NodeStarted
    - node_id: skip
  - - NodeSucceeded
    - node_id: skip
      output: skipped
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: skipped
  - - RunSucceeded
    - output: skipped
