kind: run
flow: |2

  id: bool_flag
  name: bool_flag
  input:
    flag: !bool
  nodes:
    echo:
      kind: code
      input:
        flag: ${input.flag}
      code: |
        return inputs["flag"]
  output: ${echo.output}
inputs:
  flag: no
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: false
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {flag: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        flag: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, echo]
  - - pool_commit
    - echo
    - value: false
  - - node_succeeded
    - echo
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: false
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        flag: false
  - - NodeStarted
    - node_id: echo
  - - NodeSucceeded
    - node_id: echo
      output: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: false
  - - RunSucceeded
    - output: false
