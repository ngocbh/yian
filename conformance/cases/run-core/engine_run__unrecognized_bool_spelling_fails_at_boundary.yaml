kind: run
rules: [messages, run-log]
flow: |2

  id: bool_flag
  name: bool_flag
  input:
    flag: !bool
  nodes:
    echo:
      kind: code
      input:
        flag: ${input.flag}
      code: |
        return inputs["flag"]
  output: ${echo.output}
inputs:
  flag: ture
run:
  num_workers: 0
