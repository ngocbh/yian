kind: run
flow: |2

  id: angles
  name: angles
  input:
    topic: !str
  nodes:
    pro:
      kind: code
      input:
        topic: ${input.topic}
      output: str
      code: ./fixtures/compose_codefns.ts:positive
    con:
      kind: code
      input:
        topic: ${input.topic}
      output: str
      code: ./fixtures/compose_codefns.ts:cautious
    merge:
      kind: code
      input:
        pro: ${pro.output}
        con: ${con.output}
      output: str
      code: ./fixtures/compose_codefns.ts:join_two
  output: ${merge.output}
python_flow: |2

  id: angles
  name: angles
  input:
    topic: !str
  nodes:
    pro:
      kind: code
      input:
        topic: ${input.topic}
      output: str
      code: tests.engine._compose_codefns:positive
    con:
      kind: code
      input:
        topic: ${input.topic}
      output: str
      code: tests.engine._compose_codefns:cautious
    merge:
      kind: code
      input:
        pro: ${pro.output}
        con: ${con.output}
      output: str
      code: tests.engine._compose_codefns:join_two
  output: ${merge.output}
inputs:
  topic: X
expect:
