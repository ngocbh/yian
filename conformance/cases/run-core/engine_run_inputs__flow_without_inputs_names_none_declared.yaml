kind: run
flow: |
  id: hello
  name: hello
  nodes:
    greet:
      kind: code
      input:
        t: x
      output: str
      code: |
        return "hello " + inputs["t"]
  output: ${greet.output}
inputs:
  b: 1
  a: 2
run:
  num_workers: 0
expect:
  raises:
    class: RangeError
    message: 'unknown inputs "a", "b"; declared inputs: (none)'
  trace: []
  events: []
