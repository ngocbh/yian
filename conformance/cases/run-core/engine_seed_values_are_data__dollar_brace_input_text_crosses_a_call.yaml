kind: run
rules: [run-log]
flow: |2

  id: seed-call
  name: seed_call
  input:
    text: !str
  nodes:
    probe:
      kind: code
      output: str
      code: |
        return "SECRET"
    echo:
      kind: call
      input:
        text: ${input.text}
      nodes:
        inner:
          kind: code
          input:
            text: ${input.text}
          output: str
          code: |
            return inputs["text"]
      output: ${inner.output}
  output: ${echo.output}
inputs:
  text: ${input.text}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ${input.text}
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {text: '${input.text}'}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        text: ${input.text}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, echo]
  - - pool_commit
    - echo
    - from: {__start__: 6}
      key: echo/__start__
  - - node_expanded
    - echo
    - prune_ids: []
  - [node_started, probe]
  - - pool_commit
    - probe
    - value: SECRET
  - - node_succeeded
    - probe
    - {commit: 12}
  - [node_started, echo/__start__]
  - - node_succeeded
    - echo/__start__
    - commit: 9
  - [node_started, echo/inner]
  - - pool_commit
    - echo/inner
    - value: ${input.text}
  - - node_succeeded
    - echo/inner
    - {commit: 17}
  - [node_started, echo/__end__]
  - - pool_commit
    - echo/__end__
    - key: echo
      from: {echo/inner: 17}
  - - node_succeeded
    - echo/__end__
    - {commit: 20}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ${input.text}
  - - node_succeeded
    - __end__
    - {commit: 23}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        text: ${input.text}
  - - NodeStarted
    - node_id: echo
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          text: ${input.text}
      node_id: echo
  - - NodeStarted
    - node_id: probe
  - - NodeSucceeded
    - node_id: probe
      output: SECRET
  - - NodeStarted
    - node_id: echo/__start__
  - - NodeSucceeded
    - node_id: echo/__start__
      output:
        text: ${input.text}
  - - NodeStarted
    - node_id: echo/inner
  - - NodeSucceeded
    - node_id: echo/inner
      output: ${input.text}
  - - NodeStarted
    - node_id: echo/__end__
  - - NodeSucceeded
    - commit_as: echo
      node_id: echo/__end__
      output: ${input.text}
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ${input.text}
  - - RunSucceeded
    - output: ${input.text}
