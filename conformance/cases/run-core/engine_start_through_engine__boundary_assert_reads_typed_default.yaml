kind: run
rules: [run-log]
flow: |2

  id: da
  name: da
  input:
    n: !int 5
  nodes:
    echo:
      kind: code
      input:
        x: ${input.n}
      output: int
      code: ./fixtures/compose_codefns.ts:echo_x
  output: ${echo.output}
  asserts:
    - "input.n >= 5"
python_flow: |2

  id: da
  name: da
  input:
    n: !int 5
  nodes:
    echo:
      kind: code
      input:
        x: ${input.n}
      output: int
      code: tests.engine._compose_codefns:echo_x
  output: ${echo.output}
  asserts:
    - "input.n >= 5"
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 5
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: 5
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, echo]
  - - pool_commit
    - echo
    - value: 5
  - - node_succeeded
    - echo
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 5
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: 5
  - - NodeStarted
    - node_id: echo
  - - NodeSucceeded
    - node_id: echo
      output: 5
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 5
  - - RunSucceeded
    - output: 5
