kind: run
flow: |2

  id: dflt
  name: dflt
  input:
    n: !int 5
  nodes:
    echo:
      kind: code
      input:
        x: ${input.n}
      output: int
      code: ./fixtures/compose_codefns.ts:echo_x
  output: ${echo.output}
python_flow: |2

  id: dflt
  name: dflt
  input:
    n: !int 5
  nodes:
    echo:
      kind: code
      input:
        x: ${input.n}
      output: int
      code: tests.engine._compose_codefns:echo_x
  output: ${echo.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 5
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        n: 5
  - [node_started, echo]
  - - node_succeeded
    - echo
    - value: 5
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: 5
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: 5
  - - NodeStarted
    - node_id: echo
  - - NodeSucceeded
    - node_id: echo
      output: 5
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 5
  - - RunSucceeded
    - output: 5
