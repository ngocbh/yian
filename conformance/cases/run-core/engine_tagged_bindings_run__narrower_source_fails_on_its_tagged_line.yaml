kind: run
flow: |2

  id: tagged_consumer
  name: tagged_consumer
  nodes:
    p:
      kind: code
      code: |
        return '5'
    c:
      kind: code
      input:
        x: !int ${p.output}
      code: |
        return inputs["x"]
  output: ${c.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [12, 10, 12, 26]
      message: 'binding ''x'': "5" does not match declared type int'
      node: c
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, p]
  - - pool_commit
    - p
    - value: '5'
  - - node_succeeded
    - p
    - {commit: 9}
  - [node_started, c]
  - - node_failed
    - c
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [12, 10, 12, 26]
        message: 'binding ''x'': "5" does not match declared type int'
        node: c
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: p
  - - NodeSucceeded
    - node_id: p
      output: '5'
  - - NodeStarted
    - node_id: c
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [12, 10, 12, 26]
        message: 'binding ''x'': "5" does not match declared type int'
        node: c
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [12, 10, 12, 26]
        message: 'binding ''x'': "5" does not match declared type int'
        node: c
