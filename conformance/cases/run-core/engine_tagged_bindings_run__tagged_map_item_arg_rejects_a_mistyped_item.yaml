kind: run
rules: [messages]
flow: |2

  id: tagged_map
  name: tagged_map
  nodes:
    src:
      kind: code
      code: |
        return [1, "2"]
    m:
      kind: map
      over: ${src.output}
      input:
        t: !int ${item}
      nodes:
        twice:
          kind: code
          input:
            t: ${input.t}
          code: |
            return inputs["t"] * 2n
      output: ${twice.output}
  output: ${m.output}
