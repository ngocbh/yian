kind: run
flow: |2

  id: tagged_output
  name: tagged_output
  typedefs:
    Size:
      qty: int
    T:
      a: int
  nodes:
    size:
      kind: code
      code: |
        return {"qty": 1}
  output: !T {a: 1}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      a: 1
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, size]
  - - node_succeeded
    - size
    - value:
        qty: 1
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        a: 1
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: size
  - - NodeSucceeded
    - node_id: size
      output:
        qty: 1
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        a: 1
  - - RunSucceeded
    - output:
        a: 1
