kind: run
rules: [messages]
flow: |2

  id: narrow
  name: narrow
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', qty: int, price: float}
    Decision: Union(Buy, Sell)
  input:
    decision: !object

  defs:
    pick:
      input:
        decision: !object
      nodes:
        decide:
          kind: code
          input:
            decision: ${input.decision}
          code: return inputs['decision']
          output: Decision
      output: !Buy ${decide.output}
  nodes:
    picked:
      kind: call
      call: pick
      input:
        decision: ${input.decision}
    widen:
      kind: code
      input:
        d: !Decision ${picked.output}
      code: return inputs['d']['qty']
      output: int
  output: ${widen.output}
inputs:
  decision:
    action: sell
    qty: 2
    price: 1.5
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [24, 3, 24, 9]
      - label: flow.yaml
        range: [22, 13, 22, 34]
      message: 'flow output: record has unknown fields: ["price"]'
      node: picked/__end__
  trace:
  - - run_started
    - null
    - inputs:
        decision:
          action: sell
          price: 1.5
          qty: 2
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        decision:
          action: sell
          price: 1.5
          qty: 2
  - [node_started, picked]
  - - node_expanded
    - picked
    - prune_ids: []
      seed:
        decision:
          action: sell
          price: 1.5
          qty: 2
  - [node_started, picked/__start__]
  - - node_succeeded
    - picked/__start__
    - value:
        decision:
          action: sell
          price: 1.5
          qty: 2
  - [node_started, picked/decide]
  - - node_succeeded
    - picked/decide
    - value:
        action: sell
        price: 1.5
        qty: 2
  - [node_started, picked/__end__]
  - - node_failed
    - picked/__end__
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [24, 3, 24, 9]
        - label: flow.yaml
          range: [22, 13, 22, 34]
        message: 'flow output: record has unknown fields: ["price"]'
        node: picked/__end__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        decision:
          action: sell
          price: 1.5
          qty: 2
  - - NodeStarted
    - node_id: picked
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          decision:
            action: sell
            price: 1.5
            qty: 2
      node_id: picked
  - - NodeStarted
    - node_id: picked/__start__
  - - NodeSucceeded
    - node_id: picked/__start__
      output:
        decision:
          action: sell
          price: 1.5
          qty: 2
  - - NodeStarted
    - node_id: picked/decide
  - - NodeSucceeded
    - node_id: picked/decide
      output:
        action: sell
        price: 1.5
        qty: 2
  - - NodeStarted
    - node_id: picked/__end__
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [24, 3, 24, 9]
        - label: flow.yaml
          range: [22, 13, 22, 34]
        message: 'flow output: record has unknown fields: ["price"]'
        node: picked/__end__
  - - RunFailed
