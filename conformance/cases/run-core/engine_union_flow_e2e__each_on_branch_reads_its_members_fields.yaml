inputs:
  decision:
    action: hold
    note: wait
  note:
    num: 1
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      action: hold
      note: number
      trade: 'hold: wait'
  trace:
  - - run_started
    - null
    - inputs:
        decision:
          action: hold
          note: wait
        note:
          num: 1
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        decision:
          action: hold
          note: wait
        note:
          num: 1
  - [node_started, d]
  - - node_succeeded
    - d
    - value:
        action: hold
        note: wait
  - [node_started, n]
  - - node_succeeded
    - n
    - value:
        num: 1
  - [node_started, route]
  - - node_routed
    - route
    - handle: '#else'
  - [node_started, kind_of]
  - - node_routed
    - kind_of
    - handle: '#else'
  - [node_started, log_hold]
  - - node_succeeded
    - log_hold
    - value: 'hold: wait'
  - [node_started, double]
  - - node_succeeded
    - double
    - value: number
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        action: hold
        note: number
        trade: 'hold: wait'
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        decision:
          action: hold
          note: wait
        note:
          num: 1
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        action: hold
        note: wait
  - - NodeStarted
    - node_id: n
  - - NodeSucceeded
    - node_id: n
      output:
        num: 1
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: '#else'
      node_id: route
  - - NodeSkipped
    - node_id: place_buy
  - - NodeSkipped
    - node_id: __call_0
  - - NodeStarted
    - node_id: kind_of
  - - NodeRouted
    - handle: '#else'
      node_id: kind_of
  - - NodeSkipped
    - node_id: shout
  - - NodeStarted
    - node_id: log_hold
  - - NodeSucceeded
    - node_id: log_hold
      output: 'hold: wait'
  - - NodeStarted
    - node_id: double
  - - NodeSucceeded
    - node_id: double
      output: number
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        action: hold
        note: number
        trade: 'hold: wait'
  - - RunSucceeded
    - output:
        action: hold
        note: number
        trade: 'hold: wait'
