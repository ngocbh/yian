kind: run
flow: |2

  id: nesting
  name: nesting
  nodes:
    m:
      kind: map
      over: "${[1, 2]}"
      input:
        y: !int ${item}
      nodes:
        work:
          kind: code
          input:
            y: ${input.y}
          code: |
            let v = inputs["y"]
            for (let i = 0; i < 100; i++)
                v = [v]
            return v
      output: ${work.output}
  output: ${m.output}
python_flow: |2

  id: nesting
  name: nesting
  nodes:
    m:
      kind: map
      over: "${[1, 2]}"
      input:
        y: !int ${item}
      nodes:
        work:
          kind: code
          input:
            y: ${input.y}
          code: |
            v = inputs["y"]
            for _ in range(100):
                v = [v]
            return v
      output: ${work.output}
  output: ${m.output}
run:
  num_workers: 0
expect:
