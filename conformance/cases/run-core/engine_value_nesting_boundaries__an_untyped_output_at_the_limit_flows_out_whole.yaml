kind: run
flow: |2

  id: nesting
  name: nesting
  nodes:
    deep:
      kind: code

      code: |
        let v = "leaf"
        for (let i = 0; i < 100; i++)
            v = [v]
        return v
  output: ${deep.output}
python_flow: |2

  id: nesting
  name: nesting
  nodes:
    deep:
      kind: code

      code: |
        v = "leaf"
        for _ in range(100):
            v = [v]
        return v
  output: ${deep.output}
run:
  num_workers: 0
expect:
