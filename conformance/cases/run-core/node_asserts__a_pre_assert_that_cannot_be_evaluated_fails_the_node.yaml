# A node pre-assert that fails to evaluate (`10 / n` with n 0) fails the node before its body.
# TS fails condition.evaluate, naming the assert and the evaluation error; Python counts an assert
# that raises as false and fails assertion.failed.
kind: run
flow: |
  id: na
  name: na
  input:
    v: !int
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:double
      input:
        n: ${input.v}
      output: int
      asserts:
        - "10 / n > 0"
  output: ${x.output}
inputs: {v: 0}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: failed
    failure:
      code: condition.evaluate
      message: "node 'x' pre-assert '10 / n > 0' could not be evaluated: division by zero: 10 / 0"
      node: x
      # The assert `"10 / n > 0"` on line 13.
      frames: [{label: flow.yaml, range: [13, 9, 13, 21]}]
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {v: 0}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {v: 0}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, x]
    - - node_failed
      - x
      - failure:
          code: condition.evaluate
          message: "node 'x' pre-assert '10 / n > 0' could not be evaluated: division by zero: 10 / 0"
          node: x
          frames: [{label: flow.yaml, range: [13, 9, 13, 21]}]
