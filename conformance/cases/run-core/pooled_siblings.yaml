kind: run
flow: |
  id: pooled-siblings
  name: pooled_siblings
  input:
    q: !str
  nodes:
    a:
      kind: tool
      tool_id: lookup
      input:
        q: ${input.q}
    b:
      kind: tool
      tool_id: lookup
      input:
        q: ${input.q}
  output:
    a: ${a.output}
    b: ${b.output}
inputs: {q: x}
run: {run_id: r1}
host:
  tools:
    lookup:
      parameters:
        type: object
        properties: {q: {type: string}}
        required: [q]
      results:
        a: [{return: A}]
        b: [{return: B}]
expect:
  output:
    status: succeeded
    output: {a: A, b: B}
  trace:
    - [run_started, null, {learnable: false, num_workers: 8}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: {a: A, b: B}}]
    - [node_succeeded, __end__]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {q: x}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {q: x}}]
    - [node_succeeded, __start__]
    - [node_started, a]
    - [pool_commit, a, {value: A}]
    - [node_succeeded, a]
    - [node_started, b]
    - [pool_commit, b, {value: B}]
    - [node_succeeded, b]
  events:
    - [RunStarted]
    - [RunSucceeded, {output: {a: A, b: B}}]
    - [NodeStarted, {node_id: __end__}]
    - [NodeSucceeded, {node_id: __end__, output: {a: A, b: B}}]
    - [NodeStarted, {node_id: __start__}]
    - [NodeSucceeded, {node_id: __start__, output: {q: x}}]
    - [NodeStarted, {node_id: a}]
    - [NodeSucceeded, {node_id: a, output: A}]
    - [NodeStarted, {node_id: b}]
    - [NodeSucceeded, {node_id: b, output: B}]
  tool_calls:
    lookup:
      - {args: {q: x}, call_id: r1/a, attempt: 1, node: a}
      - {args: {q: x}, call_id: r1/b, attempt: 1, node: b}
