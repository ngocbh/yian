# TS-only: a run takes no input for an inbox; the host sends its events by name.
kind: run
flow: |
  id: f
  name: f
  input:
    m: !Inbox(str)
  nodes:
    heard:
      kind: tool
      tool_id: take
      input:
        from: ${input.m}
  output: ${heard.output.events}
inputs: {m: x}
run: {run_id: r1, num_workers: 0}
expect:
  raises:
    class: ValueError
    message: "inbox `m` receives events through send(); it takes no run input"
  trace: []
