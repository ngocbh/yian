kind: run
rules: [run-log]
flow: |
  id: tool-failure-before-agent
  name: tool_failure_before_agent
  input:
    x: !str
  nodes:
    check:
      kind: tool
      tool_id: probe
      input:
        x: ${input.x}
    write:
      kind: agent
      input:
        found: ${check.output}
      output: str
      llm_config: {provider: openai, model: gpt-5.5}
      prompt: "Write about ${found}."
    review:
      kind: agent
      input:
        found: ${check.output}
      output: str
      llm_config: {provider: openai, model: !str "${check.output}"}
      prompt: "Review ${found}."
  output:
    write: ${write.output}
    review: ${review.output}
# The recorded connections carry the key's hash, which the trace leaves out.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {x: a}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    probe:
      parameters:
        type: object
        properties: {x: {type: string}}
        required: [x]
      results:
        - raise: {class: PermanentToolError, message: bad x}
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: bad x
      node: check
      frames: [{label: flow.yaml, range: [6, 3, 6, 8]}]
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          write:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
        call_time_llm: {agents: {review: {}}}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {x: a}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {x: a}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, check]
    - - node_failed
      - check
      - failure:
          code: node.execute
          message: bad x
          node: check
          frames: [{label: flow.yaml, range: [6, 3, 6, 8]}]
