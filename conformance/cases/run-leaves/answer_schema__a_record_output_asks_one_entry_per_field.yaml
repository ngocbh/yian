# From tests/engine/test_answer_schema.py::test_record_expands_per_field_with_required.
# An ask with a record `output:` sends one answer-schema entry per field (an Optional field not
# required), and a record answer with a null field passes.
kind: run
flow: |
  id: rate
  name: rate
  nodes:
    rate:
      kind: tool
      tool_id: ask
      input:
        prompt: "Rate the release"
      output: {rating: float, note: Optional(str)}
  output: ${rate.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    rate:
    - rating: 4.5
      note: null
expect:
  output:
    status: succeeded
    output:
      note: null
      rating: 4.5
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, rate]
  - - pool_commit
    - rate
    - value:
        note: null
        rating: 4.5
  - - node_succeeded
    - rate
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        note: null
        rating: 4.5
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: rate
  - - NodeSucceeded
    - node_id: rate
      output:
        note: null
        rating: 4.5
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        note: null
        rating: 4.5
      interrupted: false
  - - RunSucceeded
    - output:
        note: null
        rating: 4.5
  tool_calls:
    ask:
    - args:
        question: Rate the release
        answer_schema:
        - name: rating
          type: float
          required: true
        - name: note
          type: str
          required: false
        node_id: rate
      call_id: r1/rate
      attempt: 1
      node: rate
