# An ask typed Literal(...) sends its tags as the answer schema's enum, and its `node_name:` as
# the title.
kind: run
flow: |
  id: approval
  name: approval
  input:
    plan: !str
  nodes:
    approval:
      kind: tool
      tool_id: ask
      node_name: Plan approval
      input:
        prompt: "Approve ${input.plan}?"
      output: Literal(approve, revise)
  output: ${approval.output}
inputs:
  plan: release
run:
  run_id: r1
  num_workers: 0
host:
  human:
    approval: [approve]
expect:
  output:
    status: succeeded
    output: approve
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {plan: release}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        plan: release
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, approval]
  - - pool_commit
    - approval
    - value: approve
  - - node_succeeded
    - approval
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: approve
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        plan: release
      interrupted: false
  - - NodeStarted
    - node_id: approval
  - - NodeSucceeded
    - node_id: approval
      output: approve
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: approve
      interrupted: false
  - - RunSucceeded
    - output: approve
  tool_calls:
    ask:
    - args:
        question: Approve release?
        answer_schema:
        - name: answer
          type: str
          required: true
          enum: [approve, revise]
        title: Plan approval
        node_id: approval
      call_id: r1/approval
      attempt: 1
      node: approval
