# From tests/engine/test_answer_schema.py::test_literal_enum_carries_values (the gate's enum) and
# docs/syntax.md, `human_input`: "The answer is validated against the declared `output:` before the
# flow continues." (no Python test runs it).
# An answer outside the ask's Literal fails the ask with contract.output.
kind: run
rules: [messages, run-log]
flow: |
  id: approval
  name: approval
  input:
    plan: !str
  nodes:
    approval:
      kind: tool
      tool_id: ask
      node_name: Plan approval
      input:
        prompt: "Approve ${input.plan}?"
      output: Literal(approve, revise)
  output: ${approval.output}
# Python yian has no ask built-in: it runs the human_input gate.
python_flow: |
  id: approval
  name: approval
  input:
    plan: !str
  nodes:
    approval:
      kind: human_input
      node_name: Plan approval
      input:
        plan: ${input.plan}
      prompt: "Approve ${plan}?"
      output: Literal(approve, revise)
  output: ${approval.output}
inputs:
  plan: release
run:
  run_id: r1
  num_workers: 0
host:
  human:
    approval: [maybe]
expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: '"maybe" is not a member of variant ["approve","revise"]'
      frames:
      - label: flow.yaml
        range: [12, 13, 12, 37]
      node: approval
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {plan: release}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        plan: release
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, approval]
  - - node_failed
    - approval
    - failure:
        code: contract.output
        message: '"maybe" is not a member of variant ["approve","revise"]'
        frames:
        - label: flow.yaml
          range: [12, 13, 12, 37]
        node: approval
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        plan: release
  - - NodeStarted
    - node_id: approval
  - - NodeFailed
    - failure:
        code: contract.output
        message: '"maybe" is not a member of variant ["approve","revise"]'
        frames:
        - label: flow.yaml
          range: [12, 13, 12, 37]
        node: approval
  - - RunFailed
    - failure:
        code: contract.output
        message: '"maybe" is not a member of variant ["approve","revise"]'
        frames:
        - label: flow.yaml
          range: [12, 13, 12, 37]
        node: approval
  tool_calls:
    ask:
    - args:
        question: Approve release?
        answer_schema:
        - name: answer
          type: str
          required: true
          enum: [approve, revise]
        title: Plan approval
        node_id: approval
      call_id: r1/approval
      attempt: 1
      node: approval
python_expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: '''maybe'' is not a member of variant [''approve'', ''revise'']'
      frames:
      - label: flow.yaml
        range: [12, 13, 12, 37]
      node: approval
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs:
        plan: release
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        plan: release
  - [node_started, approval]
  - - node_failed
    - approval
    - failure:
        code: contract.output
        message: '''maybe'' is not a member of variant [''approve'', ''revise'']'
        frames:
        - label: flow.yaml
          range: [12, 13, 12, 37]
        node: approval
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        plan: release
  - - NodeStarted
    - node_id: approval
  - - NodeFailed
    - failure:
        code: contract.output
        message: '''maybe'' is not a member of variant [''approve'', ''revise'']'
        frames:
        - label: flow.yaml
          range: [12, 13, 12, 37]
        node: approval
  - - RunFailed
    - failure:
        code: contract.output
        message: '''maybe'' is not a member of variant [''approve'', ''revise'']'
        frames:
        - label: flow.yaml
          range: [12, 13, 12, 37]
        node: approval
  tool_calls:
    ask_user:
    - args:
        question: Approve release?
        answer_schema:
        - name: answer
          type: str
          required: true
          enum: [approve, revise]
        title: Plan approval
        node_id: approval
      call_id: r1/approval
      attempt: 1
      node: approval
