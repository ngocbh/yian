# From tests/engine/test_blocking_human_input.py::test_literal_questions_are_rendered_validated_and_injected.
# An ask's literal questions render `${...}` in the question, and in each option's label and
# description; the request carries the validated list.
kind: run
flow: |
  id: choose
  name: choose
  input:
    project: !str
    candidate: !str
  nodes:
    choose:
      kind: tool
      tool_id: ask
      input:
        prompt: "Choose for ${input.project}"
        questions:
          - question: "Which framework for ${input.project}?"
            header: Framework
            options:
              - label: "${input.candidate}"
                description: "Use ${input.candidate}"
  output: ${choose.output}
inputs:
  project: Atlas
  candidate: Vue
run:
  run_id: r1
  num_workers: 0
host:
  human:
    choose:
    - Framework: Vue
expect:
  output:
    status: succeeded
    output:
      Framework: Vue
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {candidate: Vue, project: Atlas}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        candidate: Vue
        project: Atlas
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, choose]
  - - pool_commit
    - choose
    - value:
        Framework: Vue
  - - node_succeeded
    - choose
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        Framework: Vue
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        candidate: Vue
        project: Atlas
  - - NodeStarted
    - node_id: choose
  - - NodeSucceeded
    - node_id: choose
      output:
        Framework: Vue
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        Framework: Vue
  - - RunSucceeded
    - output:
        Framework: Vue
  tool_calls:
    ask:
    - args:
        question: Choose for Atlas
        questions:
        - question: Which framework for Atlas?
          header: Framework
          options:
          - label: Vue
            description: Use Vue
          multi_select: false
        answer_schema:
        - name: answer
          type: object
          required: true
        node_id: choose
      call_id: r1/choose
      attempt: 1
      node: choose
