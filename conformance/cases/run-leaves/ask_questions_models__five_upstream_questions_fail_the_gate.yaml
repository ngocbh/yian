# From tests/engine/test_human_input_questions_models.py::test_parse_questions_rejects_empty_too_many_dups_badtype
# and docs/syntax.md ("1–4 questions").
# Five upstream questions fail the ask before it asks.
kind: run
flow: |
  id: manual_ref
  name: manual_ref
  input:
    qs: !list(object)
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        questions: ${input.qs}
  output: ${ask.output}
inputs:
  qs:
  - question: q0
    header: H0
  - question: q1
    header: H1
  - question: q2
    header: H2
  - question: q3
    header: H3
  - question: q4
    header: H4
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: []
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: expected 1..4 questions, got 5
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 6]
      node: ask
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        qs:
        - {header: H0, question: q0}
        - {header: H1, question: q1}
        - {header: H2, question: q2}
        - {header: H3, question: q3}
        - {header: H4, question: q4}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        qs:
        - header: H0
          question: q0
        - header: H1
          question: q1
        - header: H2
          question: q2
        - header: H3
          question: q3
        - header: H4
          question: q4
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - node_failed
    - ask
    - failure:
        code: node.execute
        message: expected 1..4 questions, got 5
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        qs:
        - header: H0
          question: q0
        - header: H1
          question: q1
        - header: H2
          question: q2
        - header: H3
          question: q3
        - header: H4
          question: q4
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeFailed
    - failure:
        code: node.execute
        message: expected 1..4 questions, got 5
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
  - - RunFailed
    - failure:
        code: node.execute
        message: expected 1..4 questions, got 5
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
