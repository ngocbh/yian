# The body throws `new Error("boom")`, whose failure message is "Error: boom", and its
# throwing line `throw new Error("boom")` ends at column 34.
kind: run
flow: |
  id: code-origin-inline-failure
  name: code-origin-inline-failure
  nodes:
    invoke:
      kind: call
      nodes:
        worker:
          kind: code
          output: int
          code: |-
            const marker = 1
            throw new Error("boom")
            return marker
      output: ${worker.output}
  output: ${invoke.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: node.execute
      frames:
      - label: flow.yaml
        range: [4, 3, 4, 9]
      - label: flow.yaml
        range: [12, 11, 12, 34]
      message: "Error: boom"
      node: invoke/worker
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {}
      key: invoke/__start__
  - - node_expanded
    - invoke
    - prune_ids: []
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 9
  - [node_started, invoke/worker]
  - - node_failed
    - invoke/worker
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 9]
        - label: flow.yaml
          range: [12, 11, 12, 34]
        message: "Error: boom"
        node: invoke/worker
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: invoke
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: invoke
  - - NodeStarted
    - node_id: invoke/__start__
  - - NodeSucceeded
    - node_id: invoke/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: invoke/worker
  - - NodeFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 9]
        - label: flow.yaml
          range: [12, 11, 12, 34]
        message: "Error: boom"
        node: invoke/worker
  - - RunFailed
    - failure:
        code: node.execute
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 9]
        - label: flow.yaml
          range: [12, 11, 12, 34]
        message: "Error: boom"
        node: invoke/worker
