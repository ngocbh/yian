          output: {n: int}
          code: |
            return {"n": inputs["seed"] + 1}
      output: ${emit.output}
      asserts:
        - "emit.output.n >= 1"

  nodes:
    fan:
      kind: map
      call: child
      over: ${input.seeds}
      input:
        seed: ${item}
  output: ${fan.output}
inputs:
  seeds: [5, -5, 7]
