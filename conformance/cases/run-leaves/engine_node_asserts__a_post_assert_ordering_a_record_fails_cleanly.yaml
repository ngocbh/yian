inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: assertion.failed
      frames:
      - label: flow.yaml
        range: [16, 9, 16, 22]
      message: 'node ''x'' post-assert failed: output >= 0'
      node: x
  trace:
  - - run_started
    - null
    - inputs:
        topic: ACME
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        topic: ACME
  - [node_started, x]
  - - node_failed
    - x
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert failed: output >= 0'
        node: x
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: x
  - - NodeFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert failed: output >= 0'
        node: x
  - - RunFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert failed: output >= 0'
        node: x
