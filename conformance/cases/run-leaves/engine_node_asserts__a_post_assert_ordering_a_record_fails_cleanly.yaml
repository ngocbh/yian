kind: run
flow: |2

  id: rec
  name: rec
  input:
    topic: !str
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:make_report
      input:
        topic: ${input.topic}
      output:
        report: str
        n: int
      asserts:
        - "output >= 0"
  output: ${x.output}
python_flow: |2

  id: rec
  name: rec
  input:
    topic: !str
  nodes:
    x:
      kind: code
      code: tests.engine._compose_codefns:make_report
      input:
        topic: ${input.topic}
      output:
        report: str
        n: int
      asserts:
        - "output >= 0"
