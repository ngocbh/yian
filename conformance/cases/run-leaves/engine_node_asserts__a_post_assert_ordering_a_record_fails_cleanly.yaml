# A post-assert ordering a record (`output >= 0`) fails the node cleanly. Ordering a record is an
# error, so the assert can't be evaluated: the node fails condition.evaluate, writing the record in
# the text form.
kind: run
flow: |2

  id: rec
  name: rec
  input:
    topic: !str
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:make_report
      input:
        topic: ${input.topic}
      output:
        report: str
        n: int
      asserts:
        - "output >= 0"
  output: ${x.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: condition.evaluate
      frames:
      - label: flow.yaml
        range: [16, 9, 16, 22]
      message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
      node: x
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, x]
  - - node_failed
    - x
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
        node: x
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: x
  - - NodeFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
        node: x
  - - RunFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
        node: x
