# From tests/engine/test_node_asserts.py::test_post_assert_on_nonscalar_output_fails_cleanly.
# A post-assert ordering a record (`output >= 0`) fails the node cleanly. Ordering a record is an
# error in TS, so the assert can't be evaluated: TS fails condition.evaluate, writing the record in
# the text form; in Python the comparison raises, the assert counts as false and fails
# assertion.failed.
kind: run
rules: [compare, failure-codes, messages]
flow: |2

  id: rec
  name: rec
  input:
    topic: !str
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:make_report
      input:
        topic: ${input.topic}
      output:
        report: str
        n: int
      asserts:
        - "output >= 0"
  output: ${x.output}
python_flow: |2

  id: rec
  name: rec
  input:
    topic: !str
  nodes:
    x:
      kind: code
      code: tests.engine._compose_codefns:make_report
      input:
        topic: ${input.topic}
      output:
        report: str
        n: int
      asserts:
        - "output >= 0"
  output: ${x.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: condition.evaluate
      frames:
      - label: flow.yaml
        range: [16, 9, 16, 22]
      message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
      node: x
  trace:
  - - run_started
    - null
    - inputs:
        topic: ACME
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        topic: ACME
  - [node_started, x]
  - - node_failed
    - x
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
        node: x
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: x
  - - NodeFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
        node: x
  - - RunFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert ''output >= 0'' could not be evaluated: type error evaluating {"report":"report for ACME","n":4} >= 0: unsupported operand kinds for `>=`: `record` and `int`'
        node: x
python_expect:
  output:
    status: failed
    failure:
      code: assertion.failed
      frames:
      - label: flow.yaml
        range: [16, 9, 16, 22]
      message: 'node ''x'' post-assert failed: output >= 0'
      node: x
  trace:
  - - run_started
    - null
    - inputs:
        topic: ACME
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        topic: ACME
  - [node_started, x]
  - - node_failed
    - x
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert failed: output >= 0'
        node: x
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: x
  - - NodeFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [16, 9, 16, 22]
        message: 'node ''x'' post-assert failed: output >= 0'
        node: x
  - - RunFailed
    - failure:
