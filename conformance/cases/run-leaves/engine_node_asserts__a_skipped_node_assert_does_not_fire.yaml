kind: run
flow: |2

  id: skp
  name: skp
  input:
    v: !int
  nodes:
    gate:
      kind: case
      cases:
        - when: "input.v >= 100"
          then: hi
      else: lo
    hi:
      kind: code
      code: ./fixtures/compose_codefns.ts:double
      input:
        n: ${input.v}
      output: int
      asserts:
        - "output > 1000000"
    lo:
      kind: code
      code: ./fixtures/compose_codefns.ts:double
      input:
        n: ${input.v}
      output: int
  output: ${gate.output}
inputs:
  v: 5
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 10
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {v: 5}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        v: 5
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, lo]
  - - pool_commit
    - lo
    - value: 10
  - - node_succeeded
    - lo
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 10
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        v: 5
      interrupted: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: hi
  - - NodeStarted
    - node_id: lo
  - - NodeSucceeded
    - node_id: lo
      output: 10
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 10
      interrupted: false
  - - RunSucceeded
    - output: 10
