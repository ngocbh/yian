# From tests/engine/test_human_input_questions_models.py::test_parse_questions_rejects_empty_too_many_dups_badtype
# and docs/syntax.md ("headers unique").
# Upstream questions with a repeated header fail the gate before it asks.
kind: run
rules: [messages]
flow: |
  id: manual_ref
  name: manual_ref
  input:
    qs: !list(object)
  nodes:
    ask:
      kind: human_input
      input: {qs: "${input.qs}"}
      questions: "${qs}"
  output: ${ask.output}
inputs:
  qs:
  - question: a
    header: D
  - question: b
    header: D
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: []
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: question headers must be unique, got ["D","D"]
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 6]
      node: ask
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs:
        qs:
        - header: D
          question: a
        - header: D
          question: b
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        qs:
        - header: D
          question: a
        - header: D
          question: b
  - [node_started, ask]
  - - node_failed
    - ask
    - failure:
        code: node.execute
        message: question headers must be unique, got ["D","D"]
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        qs:
        - header: D
          question: a
        - header: D
          question: b
  - - NodeStarted
    - node_id: ask
  - - NodeFailed
    - failure:
        code: node.execute
        message: question headers must be unique, got ["D","D"]
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
  - - RunFailed
    - failure:
        code: node.execute
        message: question headers must be unique, got ["D","D"]
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
