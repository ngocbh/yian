# From tests/engine/test_reported_tool_error.py::test_a_tool_node_fails_on_a_reported_error.
# A ReportedToolError (an error meant for a model) fails a TOOL node with its message.
kind: run
flow: |
  id: t
  name: t
  nodes:
    call:
      kind: tool
      tool_id: flaky
  output: ${call.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    flaky:
      parameters:
        type: object
        properties: {}
      results:
      - raise:
          class: ReportedToolError
          message: no such file
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: no such file
      frames:
      - label: flow.yaml
        range: [4, 3, 4, 7]
      node: call
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs: {}
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, call]
  - - node_failed
    - call
    - failure:
        code: node.execute
        message: no such file
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 7]
        node: call
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: call
  - - NodeFailed
    - failure:
        code: node.execute
        message: no such file
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 7]
        node: call
  - - RunFailed
    - failure:
        code: node.execute
        message: no such file
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 7]
        node: call
  tool_calls:
    flaky:
    - args: {}
      call_id: r1/call
      attempt: 1
      node: call
