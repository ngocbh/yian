# From tests/engine/test_resolve_until.py::test_literal_outside_the_grammar_names_the_accepted_forms[basic-format].
# A WAIT `until:` text outside the date/datetime grammar fails contract.input, naming the accepted
# forms. The text comes from an input: a literal `until:` is checked at load (load-leaves).
# hand TS expect: the message shows the resolved `until` text, an input value, with Python's `!r`
# ('20260102'); under the messages rule TS writes it in the text form ("20260102"). No shim covers
# this site (src/yian/nodes/wait/node.py), so the TS spelling is written by hand; Python's is in python_expect.
kind: run
rules: [messages]
flow: |
  id: wait_bad
  name: wait_bad
  input:
    t: !str
  nodes:
    settle:
      kind: wait
      until: ${input.t}
  output: ${settle.output}
inputs:
  t: '20260102'
run:
  run_id: r1
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      message: 'wait `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
      frames:
      - label: flow.yaml
        range: [8, 12, 8, 22]
      node: settle
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs:
        t: '20260102'
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        t: '20260102'
  - [node_started, settle]
  - - node_failed
    - settle
    - failure:
        code: contract.input
        message: 'wait `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [8, 12, 8, 22]
        node: settle
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        t: '20260102'
  - - NodeStarted
    - node_id: settle
  - - NodeFailed
    - failure:
        code: contract.input
        message: 'wait `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [8, 12, 8, 22]
        node: settle
  - - RunFailed
    - failure:
        code: contract.input
        message: 'wait `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [8, 12, 8, 22]
        node: settle
python_expect:
  output:
    status: failed
    failure:
      code: contract.input
      message: 'wait `until` ''20260102'': must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
      frames:
      - label: flow.yaml
        range: [8, 12, 8, 22]
      node: settle
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
      inputs:
        t: '20260102'
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        t: '20260102'
  - [node_started, settle]
  - - node_failed
    - settle
    - failure:
        code: contract.input
        message: 'wait `until` ''20260102'': must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [8, 12, 8, 22]
        node: settle
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        t: '20260102'
  - - NodeStarted
    - node_id: settle
  - - NodeFailed
    - failure:
        code: contract.input
        message: 'wait `until` ''20260102'': must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [8, 12, 8, 22]
        node: settle
  - - RunFailed
    - failure:
        code: contract.input
        message: 'wait `until` ''20260102'': must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
