# An ask in a called child asks with the CALL occurrence's id (c1/ask, c2/ask).
kind: run
flow: |
  id: call_ask
  name: call_ask
  defs:
    one:
      nodes:
        ask:
          kind: tool
          tool_id: ask
          input:
            prompt: "q"
          output: str
      output: ${ask.output}
  nodes:
    c1:
      kind: call
      call: one
    c2:
      kind: call
      call: one
      runs_after: [c1]
  output: ${c2.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    c1/ask: [first]
    c2/ask: [second]
expect:
  output:
    status: succeeded
    output: second
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, c1]
  - - pool_commit
    - c1
    - from: {}
      key: c1/__start__
  - - node_expanded
    - c1
    - prune_ids: []
  - [node_started, c1/__start__]
  - - node_succeeded
    - c1/__start__
    - commit: 9
  - [node_started, c1/ask]
  - - pool_commit
    - c1/ask
    - value: first
  - - node_succeeded
    - c1/ask
    - {commit: 14}
  - [node_started, c1/__end__]
  - - pool_commit
    - c1/__end__
    - key: c1
      from: {c1/ask: 14}
  - - node_succeeded
    - c1/__end__
    - {commit: 17}
  - [node_started, c2]
  - - pool_commit
    - c2
    - from: {}
      key: c2/__start__
  - - node_expanded
    - c2
    - prune_ids: []
  - [node_started, c2/__start__]
  - - node_succeeded
    - c2/__start__
    - commit: 20
  - [node_started, c2/ask]
  - - pool_commit
    - c2/ask
    - value: second
  - - node_succeeded
    - c2/ask
    - {commit: 25}
  - [node_started, c2/__end__]
  - - pool_commit
    - c2/__end__
    - key: c2
      from: {c2/ask: 25}
  - - node_succeeded
    - c2/__end__
    - {commit: 28}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: second
  - - node_succeeded
    - __end__
    - {commit: 31}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c1
  - - NodeExpanded
    - node_id: c1
      grow:
        seed: {}
        prune: []
  - - NodeStarted
    - node_id: c1/__start__
  - - NodeSucceeded
    - node_id: c1/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c1/ask
  - - NodeSucceeded
    - node_id: c1/ask
      output: first
      interrupted: false
  - - NodeStarted
    - node_id: c1/__end__
  - - NodeSucceeded
    - node_id: c1/__end__
      output: first
      commit_as: c1
      interrupted: false
  - - NodeStarted
    - node_id: c2
  - - NodeExpanded
    - node_id: c2
      grow:
        seed: {}
        prune: []
  - - NodeStarted
    - node_id: c2/__start__
  - - NodeSucceeded
    - node_id: c2/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c2/ask
  - - NodeSucceeded
    - node_id: c2/ask
      output: second
      interrupted: false
  - - NodeStarted
    - node_id: c2/__end__
  - - NodeSucceeded
    - node_id: c2/__end__
      output: second
      commit_as: c2
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: second
      interrupted: false
  - - RunSucceeded
    - output: second
  tool_calls:
    ask:
    - args:
        question: q
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: c1/ask
      call_id: r1/c1/ask
      attempt: 1
      node: c1/ask
    - args:
        question: q
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: c2/ask
      call_id: r1/c2/ask
      attempt: 1
      node: c2/ask
