# An ask's static questions get an answer record keyed by header; CODE reads its label.
# No `tool_calls`: the `ask_user` tool's `question` for a questions-only gate isn't documented, so it
# isn't pinned.
kind: run
flow: |
  # 26 — ask questions: the three question surfaces.
  #
  # A `tool_id: ask` node asks a person and collects a STRUCTURED answer keyed by each
  # question's `header`. It carries questions in one of three forms:
  #
  #   static   — a literal `questions` input list written in the YAML (THIS seed).
  #   upstream — a `code`/agent node produces the list, bound as the input
  #              `questions: ${src.output}`.
  #   adaptive — an `adaptive_questions:` block (a `prompt:` brief, ...) that
  #              desugars at load into a synth compose-agent + the ask.
  #
  # This seed pins the static form: two questions (one single-select with options, one
  # free-text), `${input.proj}` templated into a question to prove rendering. The ask's
  # output defaults to `object` — a record keyed by header (e.g. {Framework: React,
  # Notes: "..."}) — and the flow routes its terminal value on that answer.

  id: human_questions
  name: human_questions_static
  description: Ask a person a static set of questions, then route on the keyed answer.

  input:
    proj: !str

  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        questions:
          - question: "Which framework for ${input.proj}?"   # renders against the pool
            header: Framework                                # the answer key — {Framework: <label>}
            options:
              - label: React
                description: A component library.
              - label: Vue
                description: A progressive framework.
          - question: "Any notes for the build?"             # no options -> a free-text question
            header: Notes
      # output omitted -> defaults to `object`: the answer record keyed by header.

    pick:
      kind: code
      input:
        ans: ${ask.output}             # the delivered {Framework, Notes} record
      output: str
      code: ./fixtures/seeds.ts:chosen_framework

  output: ${pick.output}
inputs: {proj: Atlas}
run: {run_id: r1, num_workers: 0}
host:
  human:
    ask: [{Framework: React, Notes: none}]
expect:
  output: {status: succeeded, output: React}
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {proj: Atlas}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {proj: Atlas}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, ask]
    - [pool_commit, ask, {value: {Framework: React, Notes: none}}]
    - [node_succeeded, ask, {commit: 9}]
    - [node_started, pick]
    - [pool_commit, pick, {value: React}]
    - [node_succeeded, pick, {commit: 12}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: React}]
    - [node_succeeded, __end__, {commit: 15}]
