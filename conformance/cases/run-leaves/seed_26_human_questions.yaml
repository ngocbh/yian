inputs: {proj: Atlas}
run: {run_id: r1, num_workers: 0}
host:
  human:
    ask: [{Framework: React, Notes: none}]
expect:
  output: {status: succeeded, output: React}
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {proj: Atlas}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {proj: Atlas}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, ask]
    - [pool_commit, ask, {value: {Framework: React, Notes: none}}]
    - [node_succeeded, ask, {commit: 9}]
    - [node_started, pick]
    - [pool_commit, pick, {value: React}]
    - [node_succeeded, pick, {commit: 12}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: React}]
    - [node_succeeded, __end__, {commit: 15}]
