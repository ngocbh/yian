# From tests/seeds/26-human-questions.yaml.
# A HUMAN_INPUT's static questions get an answer record keyed by header; CODE reads its label.
# No `tool_calls`: docs/api.md's `ask_user` doesn't define `question` for a questions-only gate.
kind: run
rules: [run-log]
flow: |
  # 26 — HUMAN_INPUT questions: the three question surfaces.
  #
  # A `human_input` gate blocks its worker for a person and collects a STRUCTURED
  # answer keyed by each question's `header` in the same live call. It carries questions in one
  # of three forms:
  #
  #   static   — a literal `questions:` list written in the YAML (THIS seed).
  #   upstream — a `code`/agent node produces the list, fed via
  #              `input: {qs: ${src.output}}` + `questions: ${qs}`.
  #   adaptive — an `adaptive_questions:` block `{prompt: <brief>, ...}` that
  #              desugars at load into a synth compose-agent + the gate.
  #
  # This seed pins the static form: two questions (one single-select with options, one
  # free-text), `${proj}` templated into a question to prove rendering. The gate's
  # output defaults to `object` — a record keyed by header (e.g. {Framework: React,
  # Notes: "..."}) — and the flow routes its terminal value on that answer.

  id: human_questions
  name: human_questions_static
  description: Ask a person a static set of questions, then route on the keyed answer.

  input:
    proj: !str

  nodes:
    ask:
      kind: human_input
      input:
        proj: ${input.proj}            # context the question text may reference (bare ${proj})
      questions:
        - question: "Which framework for ${proj}?"   # ${proj} renders against the bound input
          header: Framework                          # the answer key — {Framework: <label>}
          options:
            - label: React
              description: A component library.
            - label: Vue
              description: A progressive framework.
        - question: "Any notes for the build?"       # no options -> a free-text question
          header: Notes
      # output omitted -> defaults to `object`: the answer record keyed by header.

    pick:
      kind: code
      input:
        ans: ${ask.output}             # the delivered {Framework, Notes} record
      output: str
      code: ./fixtures/seeds.ts:chosen_framework

  output: ${pick.output}
# The CODE reference differs by language: `flow` names the TS function, this the Python one.
python_flow: |
