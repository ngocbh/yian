# From tests/seeds/29-inline-code.yaml.
# An inline CODE body reads `inputs` and returns the verdict line.
# The header (`def main(inputs)`, `module:function`) describes the Python form.
# String concatenation, not a template literal: `${...}` in flow text reads as a yian reference.
kind: run
rules: [run-log]
flow: |
  # 29 — inline CODE source. A `code:` node carries a bare body that reads `inputs` and
  # `return`s a value; the engine wraps it as `def main(inputs)` and runs it IN-PROCESS
  # (stdlib compile/exec) — the alternative to the `module:function` reference form (seed
  # 30, its reference twin). It uses the same one-dict `inputs` convention as reference mode, so a
  # body promotes to a `module:function` by copy-paste. The source is author-written and
  # static (it lives in this version-controlled YAML), shipped WITH the flow, under the
  # author == operator trust model. The return is validated against `output:` by the same
  # write boundary reference mode uses, so inline outputs must be JSON values (or files).

  id: inline-code
  name: inline_code
  description: Inline `code:` source — a bare body run as `def main(inputs)` in-process.

  input:
    rating: !float
    label: !str

  nodes:
    verdict:
      kind: code
      input:
        rating: ${input.rating}
        label:  ${input.label}
      output: str
      code: |
        const [lean, sign] = inputs.rating >= 0 ? ["positive", "+"] : ["negative", ""]
        return inputs.label + ": " + lean + " (" + sign + inputs.rating.toFixed(2) + ")"

  output: ${verdict.output}
# The CODE body differs by language: `flow` holds the TS body, this the Python one.
python_flow: |
  # 29 — inline CODE source. A `code:` node carries a bare body that reads `inputs` and
  # `return`s a value; the engine wraps it as `def main(inputs)` and runs it IN-PROCESS
  # (stdlib compile/exec) — the alternative to the `module:function` reference form (seed
  # 30, its reference twin). It uses the same one-dict `inputs` convention as reference mode, so a
  # body promotes to a `module:function` by copy-paste. The source is author-written and
  # static (it lives in this version-controlled YAML), shipped WITH the flow, under the
  # author == operator trust model. The return is validated against `output:` by the same
  # write boundary reference mode uses, so inline outputs must be JSON values (or files).

  id: inline-code
  name: inline_code
  description: Inline `code:` source — a bare body run as `def main(inputs)` in-process.

  input:
    rating: !float
    label: !str

  nodes:
    verdict:
      kind: code
      input:
        rating: ${input.rating}
        label:  ${input.label}
      output: str
      code: |
        lean = "positive" if inputs["rating"] >= 0 else "negative"
        return f"{inputs['label']}: {lean} ({inputs['rating']:+.2f})"

  output: ${verdict.output}
inputs: {rating: 0.42, label: ACME}
run: {run_id: r1, num_workers: 0}
expect:
  output: {status: succeeded, output: "ACME: positive (+0.42)"}
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {label: ACME, rating: 0.42}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {rating: 0.42, label: ACME}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, verdict]
    - [pool_commit, verdict, {value: "ACME: positive (+0.42)"}]
    - [node_succeeded, verdict, {commit: 9}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: "ACME: positive (+0.42)"}]
    - [node_succeeded, __end__, {commit: 12}]
