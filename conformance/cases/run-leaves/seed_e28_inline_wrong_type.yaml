# From tests/seeds/errors/e28-inline-wrong-type.yaml.
# An inline CODE body's text return into an `int` output fails `contract.output`.
kind: run
# The message quotes the returned text as a value: JSON text in TS, a repr in Python.
rules: [messages]
flow: |
  # e28 — an inline CODE body returns the wrong type for its declared `output:`. RUNTIME:
  # the engine's typed write boundary rejects it — the SAME path that rejects a wrong-typed
  # reference-mode return (e21), reused, not reinvented.
  id: err-inline-wrong-type
  name: err_inline_wrong_type
  input:
    topic: !str
  nodes:
    calc:
      kind: code
      input:
        topic: ${input.topic}
      output: int
      code: |
        return "not-an-int"
  output: ${calc.output}
inputs: {topic: X}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: '"not-an-int" does not match declared type int'
      node: calc
      # The declared type `int` on line 13.
      frames: [{label: flow.yaml, range: [13, 13, 13, 16]}]
  trace:
    - [run_started, null, {inputs: {topic: X}, learnable: false, num_workers: 0}]
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: X}}]
    - [node_started, calc]
    - - node_failed
      - calc
      - failure:
          code: contract.output
          message: '"not-an-int" does not match declared type int'
          node: calc
          frames: [{label: flow.yaml, range: [13, 13, 13, 16]}]
python_expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: "'not-an-int' does not match declared type int"
      node: calc
      frames: [{label: flow.yaml, range: [13, 13, 13, 16]}]
  trace:
    - [run_started, null, {inputs: {topic: X}, learnable: false, num_workers: 0}]
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: X}}]
    - [node_started, calc]
    - - node_failed
      - calc
      - failure:
          code: contract.output
          message: "'not-an-int' does not match declared type int"
          node: calc
          frames: [{label: flow.yaml, range: [13, 13, 13, 16]}]
