# From tests/seeds/errors/e29-inline-nonserializable.yaml.
# An inline CODE return holding a non-yian value fails `contract.output` at its `output:`.
kind: run
# The non-yian value and its message differ by language.
rules: [code, run-log]
flow: |
  # e29 — an inline CODE body returns a value with a non-JSON member nested inside (a bare
  # object in a dict). RUNTIME: the output boundary rejects it, as it does for any node
  # output, before the value is recorded: `contract.output` at `bad`, traced to its
  # `output:` contract.
  id: err-inline-nonserializable
  name: err_inline_nonserializable
  input:
    topic: !str
  nodes:
    bad:
      kind: code
      input:
        topic: ${input.topic}
      output: object
      code: |
        return {topic: inputs.topic, handle: new Date(0)}
  output: ${bad.output}
# The CODE body differs by language: `flow` holds the TS body, this the Python one.
# The source's `object()` is `b"x"` here, since an object's text names its memory address.
python_flow: |
  # e29 — an inline CODE body returns a value with a non-JSON member nested inside (a bare
  # object in a dict). RUNTIME: the output boundary rejects it, as it does for any node
  # output, before the value is recorded: `contract.output` at `bad`, traced to its
  # `output:` contract.
  id: err-inline-nonserializable
  name: err_inline_nonserializable
  input:
    topic: !str
  nodes:
    bad:
      kind: code
      input:
        topic: ${input.topic}
      output: object
      code: |
        return {"topic": inputs["topic"], "handle": b"x"}
  output: ${bad.output}
inputs: {topic: X}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: "output at handle: Date is not a yian value"
      node: bad
      # The declared type `object` on line 14.
      frames: [{label: flow.yaml, range: [14, 13, 14, 19]}]
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: X}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: X}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, bad]
    - - node_failed
      - bad
      - failure:
          code: contract.output
          message: "output at handle: Date is not a yian value"
          node: bad
          frames: [{label: flow.yaml, range: [14, 13, 14, 19]}]
python_expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: "b'x' is not a JSON value"
      node: bad
      frames: [{label: flow.yaml, range: [14, 13, 14, 19]}]
  trace:
    - [run_started, null, {inputs: {topic: X}, learnable: false, num_workers: 0}]
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {topic: X}}]
    - [node_started, bad]
    - - node_failed
      - bad
      - failure:
          code: contract.output
          message: "b'x' is not a JSON value"
          node: bad
          frames: [{label: flow.yaml, range: [14, 13, 14, 19]}]
