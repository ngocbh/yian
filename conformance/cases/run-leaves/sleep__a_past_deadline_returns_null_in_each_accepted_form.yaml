# From tests/engine/test_blocking_wait.py::test_deadline_at_or_before_now_returns_immediately, with the
# forms of ::test_naive_datetime_means_utc, ::test_aware_datetime_is_normalized_to_utc and
# ::test_deadline_accepts_z_short_fraction_and_space_separator, moved into the past (no clock).
# A sleep whose deadline has passed returns null at once, in each accepted spelling.
kind: run
rules: [run-log]
flow: |
  id: waits
  name: waits
  nodes:
    naive:
      kind: tool
      tool_id: sleep
      input:
        until: "2020-01-01T01:02:03"
    aware:
      kind: tool
      tool_id: sleep
      input:
        until: "2020-01-02T05:30:00+05:30"
    zulu:
      kind: tool
      tool_id: sleep
      input:
        until: "2020-01-02T00:00:00Z"
    spaced:
      kind: tool
      tool_id: sleep
      input:
        until: "2020-01-01 01:00"
  output:
    naive: ${naive.output}
    aware: ${aware.output}
    zulu: ${zulu.output}
    spaced: ${spaced.output}
run:
  run_id: r1
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      aware: null
      naive: null
      spaced: null
      zulu: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, aware]
  - [pool_commit, aware]
  - - node_succeeded
    - aware
    - {commit: 9}
  - [node_started, naive]
  - [pool_commit, naive]
  - - node_succeeded
    - naive
    - {commit: 12}
  - [node_started, spaced]
  - [pool_commit, spaced]
  - - node_succeeded
    - spaced
    - {commit: 15}
  - [node_started, zulu]
  - [pool_commit, zulu]
  - - node_succeeded
    - zulu
    - {commit: 18}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        aware: null
        naive: null
        spaced: null
        zulu: null
  - - node_succeeded
    - __end__
    - {commit: 21}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: aware
  - - NodeSucceeded
    - node_id: aware
  - - NodeStarted
    - node_id: naive
  - - NodeSucceeded
    - node_id: naive
  - - NodeStarted
    - node_id: spaced
  - - NodeSucceeded
    - node_id: spaced
  - - NodeStarted
    - node_id: zulu
  - - NodeSucceeded
    - node_id: zulu
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        aware: null
        naive: null
        spaced: null
        zulu: null
  - - RunSucceeded
    - output:
        aware: null
        naive: null
        spaced: null
        zulu: null
