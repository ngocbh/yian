# A tagged ask input (`!int`, a context input the host declares) over an untyped value "three"
# fails binding.type before the ask asks; an `!Any` flow input stands in for the test's untyped
# CODE source.
kind: run
flow: |
  id: tagged_gate
  name: tagged_gate
  input:
    n: !Any
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        count: !int ${input.n}
        prompt: "Proceed with ${input.n} items?"
  output: ${ask.output}
inputs:
  n: three
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: []
expect:
  output:
    status: failed
    failure:
      code: binding.type
      message: 'binding ''count'': "three" does not match declared type int'
      frames:
      - label: flow.yaml
        range: [10, 14, 10, 29]
      node: ask
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: three}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: three
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - node_failed
    - ask
    - failure:
        code: binding.type
        message: 'binding ''count'': "three" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [10, 14, 10, 29]
        node: ask
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: three
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeFailed
    - failure:
        code: binding.type
        message: 'binding ''count'': "three" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [10, 14, 10, 29]
        node: ask
  - - RunFailed
    - failure:
        code: binding.type
        message: 'binding ''count'': "three" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [10, 14, 10, 29]
        node: ask
