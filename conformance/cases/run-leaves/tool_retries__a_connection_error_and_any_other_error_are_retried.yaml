# From tests/engine/test_tool_retries.py::test_two_failures_then_success_records_each_attempt (a
# TimeoutError is retried) and the ToolNode docstring (src/yian/nodes/tool/node.py): every error but
# PermanentToolError and ToolCheckError is retried.
# A ConnectionError and an error of any other class are retried; each failed step names the class.
kind: run
flow: |
  id: t
  name: t
  nodes:
    call:
      kind: tool
      tool_id: flaky
      retries: 2
  output: ${call.output}
env:
  YIAN_TOOL_RETRY_DELAY_SECONDS: '0'
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    flaky:
      parameters:
        type: object
        properties: {}
      results:
      - raise:
          class: ConnectionError
          message: reset
      - raise:
          class: QuotaGlitch
          message: slow
      - return: ok
  jitter: [0.0, 0.0]
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - defaults:
        TOOL_RETRY_DELAY_SECONDS: 0
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, call]
  - - node_step
    - call
    - step:
        attempt: 1
        error:
          message: reset
          type: ConnectionError
        event: failed
        retry_in: 0.0
        kind: tool_attempt
      n: 1
  - - node_step
    - call
    - step:
        attempt: 2
        event: started
        kind: tool_attempt
      n: 2
  - - node_step
    - call
    - step:
        attempt: 2
        error:
          message: slow
          type: QuotaGlitch
        event: failed
        retry_in: 0.0
        kind: tool_attempt
      n: 3
  - - node_step
    - call
    - step:
        attempt: 3
        event: started
        kind: tool_attempt
      n: 4
  - - pool_commit
    - call
    - value: ok
  - - node_succeeded
    - call
    - {commit: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 16}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: call
  - - NodeSucceeded
    - node_id: call
      output: ok
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
      interrupted: false
  - - RunSucceeded
    - output: ok
  tool_calls:
    flaky:
    - args: {}
      call_id: r1/call
      attempt: 1
      node: call
    - args: {}
      call_id: r1/call
      attempt: 2
      node: call
    - args: {}
      call_id: r1/call
      attempt: 3
      node: call
