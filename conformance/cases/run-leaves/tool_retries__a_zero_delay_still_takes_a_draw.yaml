# From tests/engine/test_reported_tool_error.py::test_tool_retries_retry_a_reported_error (retries at
# TOOL_RETRY_DELAY_SECONDS=0) and conformance/README.md `host.jitter` ("one per retry that waits a
# backoff, even a zero one").
# A zero base delay still takes one draw per retry; the wait is 0.0 s.
kind: run
flow: |
  id: t
  name: t
  nodes:
    call:
      kind: tool
      tool_id: flaky
      retries: 1
  output: ${call.output}
env:
  YIAN_TOOL_RETRY_DELAY_SECONDS: '0'
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    flaky:
      parameters:
        type: object
        properties: {}
      results:
      - raise:
          class: TimeoutError
          message: a
      - return: ok
  jitter: [0.5]
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - defaults:
        TOOL_RETRY_DELAY_SECONDS: 0
      learnable: false
      num_workers: 0
      inputs: {}
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, call]
  - - node_step
    - call
    - step:
        attempt: 1
        error:
          message: a
          type: TimeoutError
        event: failed
        retry_in: 0.0
  - - node_step
    - call
    - step:
        attempt: 2
        event: started
  - - node_succeeded
    - call
    - value: ok
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ok
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: call
  - - NodeSucceeded
    - node_id: call
      output: ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
  - - RunSucceeded
    - output: ok
  tool_calls:
    flaky:
    - args: {}
      call_id: r1/call
      attempt: 1
      node: call
    - args: {}
      call_id: r1/call
      attempt: 2
      node: call
