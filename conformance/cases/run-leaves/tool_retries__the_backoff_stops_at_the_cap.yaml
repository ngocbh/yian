# From tests/engine/test_tool_retries.py::test_backoff_stops_at_the_cap.
# The cap stops the doubling: with base 1 s and cap 1 s the second delay stays 1 s (0.5 s waits
# at draw 0.0) instead of doubling to 2 s.
kind: run
flow: |
  id: t
  name: t
  nodes:
    call:
      kind: tool
      tool_id: flaky
      retries: 2
  output: ${call.output}
env:
  YIAN_TOOL_RETRY_DELAY_SECONDS: '1'
  YIAN_TOOL_RETRY_MAX_DELAY_SECONDS: '1'
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    flaky:
      parameters:
        type: object
        properties: {}
      results:
      - raise:
          class: TimeoutError
          message: a
      - raise:
          class: TimeoutError
          message: b
      - return: ok
  jitter: [0.0, 0.0]
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - defaults:
        TOOL_RETRY_MAX_DELAY_SECONDS: 1
      learnable: false
      num_workers: 0
      inputs: {}
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, call]
  - - node_step
    - call
    - step:
        attempt: 1
        error:
          message: a
          type: TimeoutError
        event: failed
        retry_in: 0.5
  - - node_step
    - call
    - step:
        attempt: 2
        event: started
  - - node_step
    - call
    - step:
        attempt: 2
        error:
          message: b
          type: TimeoutError
        event: failed
        retry_in: 0.5
  - - node_step
    - call
    - step:
        attempt: 3
        event: started
  - - node_succeeded
    - call
    - value: ok
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: ok
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: call
  - - NodeSucceeded
    - node_id: call
      output: ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
  - - RunSucceeded
    - output: ok
  tool_calls:
    flaky:
    - args: {}
      call_id: r1/call
      attempt: 1
      node: call
    - args: {}
      call_id: r1/call
      attempt: 2
      node: call
    - args: {}
      call_id: r1/call
      attempt: 3
      node: call
