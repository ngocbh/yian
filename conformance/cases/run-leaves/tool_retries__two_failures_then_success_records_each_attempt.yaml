# From tests/engine/test_tool_retries.py::test_two_failures_then_success_records_each_attempt.
# Two failures, then success: three attempts under one call id, each retry recorded as a failed
# step (doubling delay) and a started step.
# Retries wait delay/2 + draw * delay/2 with delays 1 s and 2 s: 0.5 s, then 1.0 s.
kind: run
rules: [run-log]
flow: |
  id: t
  name: t
  nodes:
    call:
      kind: tool
      tool_id: flaky
      retries: 2
  output: ${call.output}
env:
  YIAN_TOOL_RETRY_DELAY_SECONDS: '1'
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    flaky:
      parameters:
        type: object
        properties: {}
      results:
      - raise:
          class: TimeoutError
          message: a
      - raise:
          class: TimeoutError
          message: b
      - return: ok
  jitter: [0.0, 0.0]
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, call]
  - - node_step
    - call
    - step:
        attempt: 1
        error:
          message: a
          type: TimeoutError
        event: failed
        retry_in: 0.5
        kind: tool_attempt
      n: 1
  - - node_step
    - call
    - step:
        attempt: 2
        event: started
        kind: tool_attempt
      n: 2
  - - node_step
    - call
    - step:
        attempt: 2
        error:
          message: b
          type: TimeoutError
        event: failed
        retry_in: 1.0
        kind: tool_attempt
      n: 3
  - - node_step
    - call
    - step:
        attempt: 3
        event: started
        kind: tool_attempt
      n: 4
  - - pool_commit
    - call
    - value: ok
  - - node_succeeded
    - call
    - {commit: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 16}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: call
  - - NodeSucceeded
    - node_id: call
      output: ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
  - - RunSucceeded
    - output: ok
  tool_calls:
    flaky:
    - args: {}
      call_id: r1/call
      attempt: 1
      node: call
    - args: {}
      call_id: r1/call
      attempt: 2
      node: call
    - args: {}
      call_id: r1/call
      attempt: 3
      node: call
