kind: run
flow: |
  id: tool-retry-then-human
  name: tool_retry_then_human
  input:
    q: !str
  nodes:
    fetch:
      kind: tool
      tool_id: lookup
      retries: 1
      input:
        q: ${input.q}
    ok:
      kind: human_input
      input:
        found: ${fetch.output}
      prompt: "Use ${found}?"
      output: str
  output:
    found: ${fetch.output}
    answer: ${ok.output}
# The retry waits delay/2 + draw * delay/2 = 0.5 s.
env: {YIAN_TOOL_RETRY_DELAY_SECONDS: "1"}
inputs: {q: x}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      parameters:
        type: object
        properties: {q: {type: string}}
        required: [q]
      results:
        - raise: {class: TransientToolError, message: busy}
        - return: F1
  human:
    ok: ["yes"]
  jitter: [0.0]
expect:
  output:
    status: succeeded
    output: {found: F1, answer: "yes"}
  tool_calls:
    lookup:
      - {args: {q: x}, call_id: r1/fetch, attempt: 1, node: fetch}
      - {args: {q: x}, call_id: r1/fetch, attempt: 2, node: fetch}
    ask_user:
      - args:
          question: Use F1?
          answer_schema: [{name: answer, type: str, required: true}]
          node_id: ok
        call_id: r1/ok
        attempt: 1
        node: ok
  trace:
    - [run_started, null, {inputs: {q: x}, learnable: false, num_workers: 0}]
    - [node_started, __start__]
    - [node_succeeded, __start__, {value: {q: x}}]
    - [node_started, fetch]
    - [node_step, fetch, {step: {event: failed, attempt: 1, error: {type: TransientToolError, message: busy}, retry_in: 0.5}}]
    - [node_step, fetch, {step: {event: started, attempt: 2}}]
    - [node_succeeded, fetch, {value: F1}]
    - [node_started, ok]
    - [node_succeeded, ok, {value: "yes"}]
    - [node_started, __end__]
    - [node_succeeded, __end__, {value: {found: F1, answer: "yes"}}]
