# From tests/engine/test_typed_tool_node.py::test_a_wider_return_type_runs_and_the_gate_still_checks_each_value.
# A TOOL node's record `output:` checks each field of the return: a text `qty` fails contract.output.
kind: run
rules: [messages, run-log]
flow: |
  id: placing
  name: placing
  nodes:
    place:
      kind: tool
      tool_id: place_order
      input:
        qty: 5
      output: {qty: int}
  output: ${place.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    place_order:
      parameters:
        type: object
        properties:
          qty:
            type: integer
        required: [qty]
      results:
      - return:
          qty: bad
expect:
  output:
    status: failed
    failure:
      code: contract.output
      message: '"bad" does not match declared type int'
      frames:
      - label: flow.yaml
        range: [9, 19, 9, 22]
      node: place
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, place]
  - - node_failed
    - place
    - failure:
        code: contract.output
        message: '"bad" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [9, 19, 9, 22]
        node: place
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: place
  - - NodeFailed
    - failure:
        code: contract.output
        message: '"bad" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [9, 19, 9, 22]
        node: place
  - - RunFailed
    - failure:
        code: contract.output
        message: '"bad" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [9, 19, 9, 22]
        node: place
  tool_calls:
    place_order:
    - args:
        qty: 5
      call_id: r1/place
      attempt: 1
      node: place
