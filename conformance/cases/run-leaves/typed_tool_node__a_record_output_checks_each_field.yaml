  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, place]
  - - node_failed
    - place
    - failure:
        code: contract.output
        message: '''bad'' does not match declared type int'
        frames:
        - label: flow.yaml
          range: [9, 19, 9, 22]
        node: place
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: place
  - - NodeFailed
    - failure:
        code: contract.output
        message: '''bad'' does not match declared type int'
        frames:
        - label: flow.yaml
          range: [9, 19, 9, 22]
        node: place
  - - RunFailed
    - failure:
        code: contract.output
        message: '''bad'' does not match declared type int'
        frames:
