# An Optional(int) binding into an integer parameter passes the run-start check; a null fails the
# node when its arguments are checked, before any call.
kind: run
flow: |
  id: placing
  name: placing
  input:
    n: !Optional(int)
  nodes:
    place:
      kind: tool
      tool_id: place_order
      input:
        qty: ${input.n}
  output: ${place.output}
inputs:
  n: null
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    place_order:
      parameters:
        type: object
        properties:
          qty:
            type: integer
        required: [qty]
      results: []
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: 'tool ''place_order'' argument ''qty'': null does not match declared type int'
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 8]
      node: place
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: null}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: null
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, place]
  - - node_failed
    - place
    - failure:
        code: node.execute
        message: 'tool ''place_order'' argument ''qty'': null does not match declared type int'
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 8]
        node: place
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: null
      interrupted: false
  - - NodeStarted
    - node_id: place
  - - NodeFailed
    - failure:
        code: node.execute
        message: 'tool ''place_order'' argument ''qty'': null does not match declared type int'
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 8]
        node: place
  - - RunFailed
    - failure:
        code: node.execute
        message: 'tool ''place_order'' argument ''qty'': null does not match declared type int'
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 8]
        node: place
