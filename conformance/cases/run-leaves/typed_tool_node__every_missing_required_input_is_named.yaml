# From tests/engine/test_typed_tool_node.py::test_every_missing_required_input_is_named.
# Required tool parameters the TOOL node doesn't bind fail the run at its start, all of them named.
kind: run
flow: |
  id: placing
  name: placing
  nodes:
    place:
      kind: tool
      tool_id: place_order
      input:
        qty: 5
  output: ${place.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    place_order:
      parameters:
        type: object
        properties:
          qty:
            type: integer
          sym:
            type: string
          side:
            type: string
        required: [qty, sym, side]
      results: []
expect:
  raises:
    class: RangeError
    message: TOOL node 'place' is missing inputs ["side","sym"] that tool 'place_order' requires
  trace: []
  events: []
