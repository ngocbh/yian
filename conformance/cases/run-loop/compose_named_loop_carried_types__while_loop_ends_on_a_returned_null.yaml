kind: run
flow: |2

  id: named
  name: named
  input:
    z: !int
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
          output:
            n: Optional(int)
          code: |
            return {"n": inputs["n"] >= 2n ? null : inputs["n"] + 1n}
      output: ${bump.output}
  nodes:
    repeat:
      kind: loop
      while: ${n != null}
      max: 10
      call: step
      input:
        n: ${input.z}
  output: ${repeat.output}
python_flow: |2

  id: named
  name: named
  input:
    z: !int
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
          output:
            n: Optional(int)
          code: |
            return {"n": None if inputs["n"] >= 2 else inputs["n"] + 1}
      output: ${bump.output}
  nodes:
    repeat:
      kind: loop
      while: ${n != null}
      max: 10
      call: step
      input:
        n: ${input.z}
  output: ${repeat.output}
inputs:
  z: 0
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: null
  trace:
  - - run_started
    - null
    - inputs:
        z: 0
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        z: 0
  - [node_started, repeat]
  - - node_expanded
    - repeat
    - prune_ids: []
      seed:
      - n: 0
      - 0
  - [node_started, repeat#0/__start__]
  - - node_succeeded
    - repeat#0/__start__
    - value:
        n: 0
  - [node_started, repeat#0/bump]
  - - node_succeeded
    - repeat#0/bump
    - value:
        n: 1
  - [node_started, repeat#0/__end__]
  - - node_succeeded
    - repeat#0/__end__
    - value:
        n: 1
  - [node_started, repeat~1]
  - - node_expanded
    - repeat~1
    - prune_ids: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
      seed:
      - n: 1
      - 1
  - [node_started, repeat#1/__start__]
  - - node_succeeded
    - repeat#1/__start__
    - value:
        n: 1
  - [node_started, repeat#1/bump]
  - - node_succeeded
    - repeat#1/bump
    - value:
        n: 2
  - [node_started, repeat#1/__end__]
  - - node_succeeded
    - repeat#1/__end__
    - value:
        n: 2
  - [node_started, repeat~2]
  - - node_expanded
    - repeat~2
    - prune_ids: [repeat#1/__end__, repeat#1/__start__, repeat#1/bump, repeat~2]
      seed:
      - n: 2
      - 2
  - [node_started, repeat#2/__start__]
  - - node_succeeded
    - repeat#2/__start__
    - value:
        n: 2
  - [node_started, repeat#2/bump]
  - - node_succeeded
    - repeat#2/bump
    - value:
        n: null
  - [node_started, repeat#2/__end__]
  - - node_succeeded
    - repeat#2/__end__
    - value:
        n: null
  - [node_started, repeat~3]
  - - node_succeeded
    - repeat~3
    - commit_target: repeat
      value:
        n: null
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        n: null
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        z: 0
  - - NodeStarted
    - node_id: repeat
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 0
        - 0
      node_id: repeat
  - - NodeStarted
    - node_id: repeat#0/__start__
  - - NodeSucceeded
    - node_id: repeat#0/__start__
      output:
        n: 0
  - - NodeStarted
    - node_id: repeat#0/bump
  - - NodeSucceeded
    - node_id: repeat#0/bump
      output:
        n: 1
  - - NodeStarted
    - node_id: repeat#0/__end__
  - - NodeSucceeded
    - node_id: repeat#0/__end__
      output:
        n: 1
  - - NodeStarted
    - node_id: repeat~1
  - - NodeExpanded
    - grow:
        prune: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
        seed:
        - n: 1
        - 1
      node_id: repeat~1
  - - NodeStarted
    - node_id: repeat#1/__start__
  - - NodeSucceeded
    - node_id: repeat#1/__start__
      output:
        n: 1
  - - NodeStarted
    - node_id: repeat#1/bump
  - - NodeSucceeded
    - node_id: repeat#1/bump
      output:
        n: 2
  - - NodeStarted
    - node_id: repeat#1/__end__
  - - NodeSucceeded
    - node_id: repeat#1/__end__
      output:
        n: 2
  - - NodeStarted
    - node_id: repeat~2
  - - NodeExpanded
    - grow:
        prune: [repeat#1/__end__, repeat#1/__start__, repeat#1/bump, repeat~2]
        seed:
        - n: 2
        - 2
      node_id: repeat~2
  - - NodeStarted
    - node_id: repeat#2/__start__
  - - NodeSucceeded
    - node_id: repeat#2/__start__
      output:
        n: 2
  - - NodeStarted
    - node_id: repeat#2/bump
  - - NodeSucceeded
    - node_id: repeat#2/bump
      output:
        n: null
  - - NodeStarted
    - node_id: repeat#2/__end__
  - - NodeSucceeded
    - node_id: repeat#2/__end__
      output:
        n: null
  - - NodeStarted
    - node_id: repeat~3
  - - NodeSucceeded
    - commit_as: repeat
      node_id: repeat~3
      output:
        n: null
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: null
  - - RunSucceeded
    - output:
        n: null
