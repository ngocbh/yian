kind: run
rules: [run-log]
flow: |2

  id: loop-value-body-carried-result
  name: loop_value_body_carried_result
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
          code: |
            return {"n": inputs["n"] + 1}
      output: ${step.output}
  nodes:
    chat_loop:
      kind: loop
      call: bump
      input:
        result: start
        n: 0
      times: 2
  output: ${chat_loop.output}
python_flow: |2

  id: loop-value-body-carried-result
  name: loop_value_body_carried_result
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
          code: |
            return {"n": inputs["n"] + 1}
      output: ${step.output}
  nodes:
    chat_loop:
      kind: loop
      call: bump
      input:
        result: start
        n: 0
      times: 2
  output: ${chat_loop.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: 2
      result: start
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat_loop]
  - - node_expanded
    - chat_loop
    - prune_ids: []
      seed:
      - n: 0
        result: start
      - 0
  - [node_started, chat_loop#0/__start__]
  - - pool_commit
    - chat_loop#0/__start__
    - value:
        n: 0
  - - node_succeeded
    - chat_loop#0/__start__
    - {commit: 11}
  - [node_started, chat_loop#0/step]
  - - pool_commit
    - chat_loop#0/step
    - value:
        n: 1
  - - node_succeeded
    - chat_loop#0/step
    - {commit: 14}
  - [node_started, chat_loop#0/__end__]
  - - pool_commit
    - chat_loop#0/__end__
    - value:
        n: 1
  - - node_succeeded
    - chat_loop#0/__end__
    - {commit: 17}
  - [node_started, chat_loop~1]
  - - node_expanded
    - chat_loop~1
    - prune_ids:
      - chat_loop#0/__end__
      - chat_loop#0/__start__
      - chat_loop#0/step
      - chat_loop~1
      seed:
      - n: 1
        result: start
      - 1
  - [node_started, chat_loop#1/__start__]
  - - pool_commit
    - chat_loop#1/__start__
    - value:
        n: 1
  - - node_succeeded
    - chat_loop#1/__start__
    - {commit: 22}
  - [node_started, chat_loop#1/step]
  - - pool_commit
    - chat_loop#1/step
    - value:
        n: 2
  - - node_succeeded
    - chat_loop#1/step
    - {commit: 25}
  - [node_started, chat_loop#1/__end__]
  - - pool_commit
    - chat_loop#1/__end__
    - value:
        n: 2
  - - node_succeeded
    - chat_loop#1/__end__
    - {commit: 28}
  - [node_started, chat_loop~2]
  - - pool_commit
    - chat_loop~2
    - value:
        n: 2
        result: start
      key: chat_loop
  - - node_succeeded
    - chat_loop~2
    - {commit: 31}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: 2
        result: start
  - - node_succeeded
    - __end__
    - {commit: 34}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: chat_loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 0
          result: start
        - 0
      node_id: chat_loop
  - - NodeStarted
    - node_id: chat_loop#0/__start__
  - - NodeSucceeded
    - node_id: chat_loop#0/__start__
      output:
        n: 0
  - - NodeStarted
    - node_id: chat_loop#0/step
  - - NodeSucceeded
    - node_id: chat_loop#0/step
      output:
        n: 1
  - - NodeStarted
    - node_id: chat_loop#0/__end__
  - - NodeSucceeded
    - node_id: chat_loop#0/__end__
      output:
        n: 1
  - - NodeStarted
    - node_id: chat_loop~1
  - - NodeExpanded
    - grow:
        prune:
        - chat_loop#0/__end__
        - chat_loop#0/__start__
        - chat_loop#0/step
        - chat_loop~1
        seed:
        - n: 1
          result: start
        - 1
      node_id: chat_loop~1
  - - NodeStarted
    - node_id: chat_loop#1/__start__
  - - NodeSucceeded
    - node_id: chat_loop#1/__start__
      output:
        n: 1
  - - NodeStarted
    - node_id: chat_loop#1/step
  - - NodeSucceeded
    - node_id: chat_loop#1/step
      output:
        n: 2
  - - NodeStarted
    - node_id: chat_loop#1/__end__
  - - NodeSucceeded
    - node_id: chat_loop#1/__end__
      output:
        n: 2
  - - NodeStarted
    - node_id: chat_loop~2
  - - NodeSucceeded
    - commit_as: chat_loop
      node_id: chat_loop~2
      output:
        n: 2
        result: start
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: 2
        result: start
  - - RunSucceeded
    - output:
        n: 2
        result: start
