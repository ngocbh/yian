          count: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/__end__
  - - NodeSucceeded
    - node_id: repeat#0/__end__
      output:
        state:
          count: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat~1
  - - NodeExpanded
    - grow:
        prune: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
        seed:
        - state:
            count: 1
        - 1
      node_id: repeat~1
  - - NodeStarted
    - node_id: repeat#1/__start__
  - - NodeSucceeded
    - node_id: repeat#1/__start__
      output:
        state:
          count: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat#1/bump
  - - NodeSucceeded
    - node_id: repeat#1/bump
      output:
        state:
          count: 2
      interrupted: false
  - - NodeStarted
    - node_id: repeat#1/__end__
  - - NodeSucceeded
    - node_id: repeat#1/__end__
      output:
        state:
          count: 2
      interrupted: false
  - - NodeStarted
    - node_id: repeat~2
  - - NodeExpanded
    - grow:
        prune: [repeat#1/__end__, repeat#1/__start__, repeat#1/bump, repeat~2]
        seed:
        - state:
            count: 2
        - 2
      node_id: repeat~2
  - - NodeStarted
    - node_id: repeat#2/__start__
  - - NodeSucceeded
    - node_id: repeat#2/__start__
      output:
        state:
          count: 2
      interrupted: false
  - - NodeStarted
    - node_id: repeat#2/bump
  - - NodeSucceeded
    - node_id: repeat#2/bump
      output:
        state:
          count: 3
      interrupted: false
  - - NodeStarted
    - node_id: repeat#2/__end__
  - - NodeSucceeded
    - node_id: repeat#2/__end__
      output:
        state:
          count: 3
      interrupted: false
  - - NodeStarted
    - node_id: repeat~3
  - - NodeSucceeded
    - commit_as: repeat
      node_id: repeat~3
      output:
        state:
          count: 3
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        state:
          count: 3
      interrupted: false
  - - RunSucceeded
    - output:
        state:
          count: 3
