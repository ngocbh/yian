kind: run
flow: |
  id: pages
  name: pages
  input:
    start: !Optional(str)
  defs:
    fetch_page:
      input:
        cursor: !str
      nodes:
        get:
          kind: code
          input:
            cursor: ${input.cursor}
          output: Optional(str)
          code: |
            if (inputs["cursor"] === null) throw new Error("body saw a null cursor")
            return ({p1: "p2", p2: null})[inputs["cursor"]] ?? null
      output:
        cursor: ${get.output}
  nodes:
    pages:
      kind: loop
      while: cursor != null
      input:
        cursor: ${input.start}
      call: fetch_page
  output: ${pages.output}
inputs:
  start: p1
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      cursor: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {start: p1}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        start: p1
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pages]
  - - pool_commit
    - pages
    - from: {__start__: 6}
      key: pages#0/__start__
  - - node_expanded
    - pages
    - prune_ids: []
  - [node_started, pages#0/__start__]
  - - node_succeeded
    - pages#0/__start__
    - commit: 9
  - [node_started, pages#0/get]
  - - pool_commit
    - pages#0/get
    - value: p2
  - - node_succeeded
    - pages#0/get
    - {commit: 14}
  - [node_started, pages#0/__end__]
  - - pool_commit
    - pages#0/__end__
    - from: {pages#0/get: 14}
  - - node_succeeded
    - pages#0/__end__
    - {commit: 17}
  - [node_started, pages~1]
  - - pool_commit
    - pages~1
    - from: {pages#0/__end__: 17}
      key: pages#1/__start__
  - - node_expanded
    - pages~1
    - prune_ids: [pages#0/__end__, pages#0/__start__, pages#0/get, pages~1]
  - [node_started, pages#1/__start__]
  - - node_succeeded
    - pages#1/__start__
    - commit: 20
  - [node_started, pages#1/get]
  - [pool_commit, pages#1/get]
  - - node_succeeded
    - pages#1/get
    - {commit: 25}
  - [node_started, pages#1/__end__]
  - - pool_commit
    - pages#1/__end__
    - from: {pages#1/get: 25}
  - - node_succeeded
    - pages#1/__end__
    - {commit: 28}
  - [node_started, pages~2]
  - - pool_commit
    - pages~2
    - key: pages
      from: {pages#1/__end__: 28}
  - - node_succeeded
    - pages~2
    - {commit: 31}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        cursor: null
  - - node_succeeded
    - __end__
    - {commit: 34}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        start: p1
  - - NodeStarted
    - node_id: pages
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - cursor: p1
        - 0
      node_id: pages
  - - NodeStarted
    - node_id: pages#0/__start__
  - - NodeSucceeded
    - node_id: pages#0/__start__
      output:
        cursor: p1
  - - NodeStarted
    - node_id: pages#0/get
  - - NodeSucceeded
    - node_id: pages#0/get
      output: p2
  - - NodeStarted
    - node_id: pages#0/__end__
  - - NodeSucceeded
    - node_id: pages#0/__end__
      output:
        cursor: p2
  - - NodeStarted
    - node_id: pages~1
  - - NodeExpanded
    - grow:
        prune: [pages#0/__end__, pages#0/__start__, pages#0/get, pages~1]
        seed:
        - cursor: p2
        - 1
      node_id: pages~1
  - - NodeStarted
    - node_id: pages#1/__start__
  - - NodeSucceeded
    - node_id: pages#1/__start__
      output:
        cursor: p2
  - - NodeStarted
    - node_id: pages#1/get
  - - NodeSucceeded
    - node_id: pages#1/get
  - - NodeStarted
    - node_id: pages#1/__end__
  - - NodeSucceeded
    - node_id: pages#1/__end__
      output:
        cursor: null
  - - NodeStarted
    - node_id: pages~2
  - - NodeSucceeded
    - commit_as: pages
      node_id: pages~2
      output:
        cursor: null
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        cursor: null
  - - RunSucceeded
    - output:
        cursor: null
