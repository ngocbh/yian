kind: run
flow: |2

  id: direct_side
  name: direct_side
  defs:
    body:
      input:
        n: !int
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1n
        side:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"]


        side2:
          kind: code
          input:
            n: ${side.output}
            m: ${bump.output}
          output: int
          code: |
            return inputs["n"] + inputs["m"]
      output:
        n: ${bump.output}

  nodes:
    loop:
      kind: loop
      call: body
      input:
        n: 0
      times: 4
  output: ${loop.output}
python_flow: |2

  id: direct_side
  name: direct_side
  defs:
    body:
      input:
        n: !int
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1
        side:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            import time
            time.sleep(0)
            return inputs["n"]
        side2:
          kind: code
          input:
            n: ${side.output}
            m: ${bump.output}
          output: int
          code: |
            return inputs["n"] + inputs["m"]
      output:
        n: ${bump.output}

  nodes:
    loop:
      kind: loop
      call: body
      input:
        n: 0
      times: 4
  output: ${loop.output}
