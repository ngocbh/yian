kind: run
flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: ./fixtures/compose_codefns.ts:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
      max: 10
    after:
      kind: code
      code: ./fixtures/compose_codefns.ts:double
      input:
        n: ${loop.output.n}
      output: int
  output: ${after.output}
python_flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: tests.engine._compose_codefns:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
      max: 10
    after:
      kind: code
      code: tests.engine._compose_codefns:double
      input:
        n: ${loop.output.n}
      output: int
  output: ${after.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 6
