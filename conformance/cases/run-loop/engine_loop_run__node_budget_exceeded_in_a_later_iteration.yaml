# From tests/engine/test_loop_run.py::test_loop_budget_exceeded_in_step_fails_run.
# The test's budget of 6 now trips the first growth (at `loop`); 7 lets iteration 0 grow and trips the next
# driver's growth (at `loop~1`), the later-iteration failure the test describes.
kind: run
rules: [run-log]
flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: ./fixtures/compose_codefns.ts:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
      max: 10
  output: ${loop.output}
python_flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: tests.engine._compose_codefns:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
      max: 10
  output: ${loop.output}
env:
  YIAN_MAX_TOTAL_NODES: '7'
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.growth
      frames:
      - label: flow.yaml
        range: [21, 3, 21, 7]
      message: expansion exceeded node budget (7) at spawner 'loop~1'
      node: loop~1
  trace:
  - - run_started
    - null
    - defaults:
        MAX_TOTAL_NODES: 7
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - node_expanded
    - loop
    - prune_ids: []
      seed:
      - exited: false
        n: 0
      - 0
  - [node_started, loop#0/__start__]
  - - pool_commit
    - loop#0/__start__
    - value:
        exited: false
        n: 0
  - - node_succeeded
    - loop#0/__start__
    - {commit: 11}
  - [node_started, loop#0/step]
  - - pool_commit
    - loop#0/step
    - value:
        exited: false
        n: 1
  - - node_succeeded
    - loop#0/step
    - {commit: 14}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - value:
        exited: false
        n: 1
  - - node_succeeded
    - loop#0/__end__
    - {commit: 17}
  - [node_started, loop~1]
  - - node_failed
    - loop~1
    - failure:
        code: contract.growth
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 7]
        message: expansion exceeded node budget (7) at spawner 'loop~1'
        node: loop~1
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - exited: false
          n: 0
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        exited: false
        n: 0
  - - NodeStarted
    - node_id: loop#0/step
  - - NodeSucceeded
    - node_id: loop#0/step
      output:
        exited: false
        n: 1
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        exited: false
        n: 1
  - - NodeStarted
    - node_id: loop~1
  - - NodeFailed
    - failure:
        code: contract.growth
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 7]
        message: expansion exceeded node budget (7) at spawner 'loop~1'
        node: loop~1
  - - RunFailed
    - failure:
        code: contract.growth
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 7]
        message: expansion exceeded node budget (7) at spawner 'loop~1'
        node: loop~1
