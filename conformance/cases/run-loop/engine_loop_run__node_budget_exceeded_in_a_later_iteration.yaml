kind: run
flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: ./fixtures/compose_codefns.ts:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
      max: 10
  output: ${loop.output}
python_flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: tests.engine._compose_codefns:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: false
      while: not exited
      max: 10
  output: ${loop.output}
env:
  YIAN_MAX_TOTAL_NODES: '6'
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.growth
      frames:
      - label: flow.yaml
        range: [21, 3, 21, 7]
      message: expansion exceeded node budget (6) at spawner 'loop'
      node: loop
  trace:
  - - run_started
    - null
    - defaults:
        MAX_TOTAL_NODES: 6
      inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, loop]
  - - node_failed
    - loop
    - failure:
        code: contract.growth
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 7]
        message: expansion exceeded node budget (6) at spawner 'loop'
        node: loop
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: loop
  - - NodeFailed
    - failure:
        code: contract.growth
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 7]
        message: expansion exceeded node budget (6) at spawner 'loop'
        node: loop
  - - RunFailed
    - failure:
        code: contract.growth
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 7]
        message: expansion exceeded node budget (6) at spawner 'loop'
        node: loop
