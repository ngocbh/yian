          input:
            n: ${input.n}
          output:
            n: int
      output: ${step.output}
    counter:
      input:
        tag: !str
      nodes:
        loop:
          kind: loop
          call: bump
          input:
            n: 0
            tag: ${input.tag}
          times: 2
      output: ${loop.output}
  nodes:
