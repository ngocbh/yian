kind: run
flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: ./fixtures/compose_codefns.ts:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: true
      while: not exited
      max: 10
  output: ${loop.output}
python_flow: |2

  id: counter
  name: counter
  defs:
    bump:
      input:
        n: !int
        exited: !bool
      nodes:
        step:
          kind: code
          code: tests.engine._compose_codefns:loop_bump
          input:
            n: ${input.n}
            exited: ${input.exited}
          output:
            n: int
            exited: bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: bump
      input:
        n: 0
        exited: true
      while: not exited
      max: 10
  output: ${loop.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      exited: true
      n: 0
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, loop]
  - - node_succeeded
    - loop
    - value:
        exited: true
        n: 0
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        exited: true
        n: 0
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: loop
  - - NodeSucceeded
    - node_id: loop
      output:
        exited: true
        n: 0
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        exited: true
        n: 0
  - - RunSucceeded
    - output:
        exited: true
        n: 0
