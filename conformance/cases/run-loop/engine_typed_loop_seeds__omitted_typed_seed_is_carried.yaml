kind: run
flow: |2

  id: partial-typed-seed
  name: partial_typed_seed
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1n
      output:
        n: ${step.output}
  nodes:
    p:
      kind: code
      code: |
        return "seed"
    loop:
      kind: loop
      times: 2
      input:
        n: 0
        label: !Optional(str) ${p.output}
      call: bump
  output: ${loop.output}
python_flow: |2

  id: partial-typed-seed
  name: partial_typed_seed
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1
      output:
        n: ${step.output}
  nodes:
    p:
      kind: code
      code: |
        return "seed"
    loop:
      kind: loop
      times: 2
      input:
        n: 0
        label: !Optional(str) ${p.output}
      call: bump
  output: ${loop.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      label: seed
      n: 2
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, p]
  - - node_succeeded
    - p
    - value: seed
  - [node_started, loop]
  - - node_expanded
    - loop
    - prune_ids: []
      seed:
      - label: seed
        n: 0
      - 0
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - value:
        n: 0
  - [node_started, loop#0/step]
  - - node_succeeded
    - loop#0/step
    - value: 1
  - [node_started, loop#0/__end__]
  - - node_succeeded
    - loop#0/__end__
    - value:
        n: 1
  - [node_started, loop~1]
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
      seed:
      - label: seed
        n: 1
      - 1
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - value:
        n: 1
  - [node_started, loop#1/step]
  - - node_succeeded
    - loop#1/step
    - value: 2
  - [node_started, loop#1/__end__]
  - - node_succeeded
    - loop#1/__end__
    - value:
        n: 2
  - [node_started, loop~2]
  - - node_succeeded
    - loop~2
    - commit_target: loop
      value:
        label: seed
        n: 2
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value:
        label: seed
        n: 2
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: p
  - - NodeSucceeded
    - node_id: p
      output: seed
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - label: seed
          n: 0
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        n: 0
  - - NodeStarted
    - node_id: loop#0/step
  - - NodeSucceeded
    - node_id: loop#0/step
      output: 1
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        n: 1
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
        seed:
        - label: seed
          n: 1
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        n: 1
  - - NodeStarted
    - node_id: loop#1/step
  - - NodeSucceeded
    - node_id: loop#1/step
      output: 2
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        n: 2
  - - NodeStarted
    - node_id: loop~2
  - - NodeSucceeded
    - commit_as: loop
      node_id: loop~2
      output:
        label: seed
        n: 2
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        label: seed
        n: 2
  - - RunSucceeded
    - output:
        label: seed
        n: 2
