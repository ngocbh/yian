kind: run
rules: [run-log]
flow: |2

  id: partial-typed-seed
  name: partial_typed_seed
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1
      output:
        n: ${step.output}
  nodes:
    p:
      kind: code
      code: |
        return "seed"
    loop:
      kind: loop
      times: 2
      input:
        n: 0
        label: !Optional(str) ${p.output}
      call: bump
  output: ${loop.output}
python_flow: |2

  id: partial-typed-seed
  name: partial_typed_seed
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1
      output:
        n: ${step.output}
  nodes:
    p:
      kind: code
      code: |
        return "seed"
    loop:
      kind: loop
      times: 2
      input:
        n: 0
        label: !Optional(str) ${p.output}
      call: bump
  output: ${loop.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      label: seed
      n: 2
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, p]
  - - pool_commit
    - p
    - value: seed
  - - node_succeeded
    - p
    - {commit: 9}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {p: 9}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 12
  - [node_started, loop#0/step]
  - - pool_commit
    - loop#0/step
    - value: 1
  - - node_succeeded
    - loop#0/step
    - {commit: 17}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/step: 17}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 20}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 20}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 23
  - [node_started, loop#1/step]
  - - pool_commit
    - loop#1/step
    - value: 2
  - - node_succeeded
    - loop#1/step
    - {commit: 28}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/step: 28}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 31}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - key: loop
      from: {loop#1/__end__: 31}
  - - node_succeeded
    - loop~2
    - {commit: 34}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        label: seed
        n: 2
  - - node_succeeded
    - __end__
    - {commit: 37}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: p
  - - NodeSucceeded
    - node_id: p
      output: seed
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - label: seed
          n: 0
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        n: 0
  - - NodeStarted
    - node_id: loop#0/step
  - - NodeSucceeded
    - node_id: loop#0/step
      output: 1
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        n: 1
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
        seed:
        - label: seed
          n: 1
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        n: 1
  - - NodeStarted
    - node_id: loop#1/step
  - - NodeSucceeded
    - node_id: loop#1/step
      output: 2
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        n: 2
  - - NodeStarted
    - node_id: loop~2
  - - NodeSucceeded
    - commit_as: loop
      node_id: loop~2
      output:
        label: seed
        n: 2
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        label: seed
        n: 2
  - - RunSucceeded
    - output:
        label: seed
        n: 2
