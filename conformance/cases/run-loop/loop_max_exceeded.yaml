    - [NodeExpanded, {node_id: repeat, grow: {seed: [{n: 0}, 0], prune: []}}]
    - [NodeStarted, {node_id: "repeat#0/__start__"}]
    - [NodeSucceeded, {node_id: "repeat#0/__start__", output: {n: 0}}]
    - [NodeStarted, {node_id: "repeat#0/bump"}]
