# A learnable chat loop whose turn output appends to the history with `+` and to the log with a
# template. The golden log pins the captured transforming bindings: the last turn's END binding
# holds six messages (four carried in, two appended) and an interpolation route.
kind: run
rules: [run-log]
flow: |
  id: chat
  name: chat
  llm_config: {provider: anthropic, model: claude-test}
  typedefs:
    Msg: {role: str, text: str}
  defs:
    turn:
      input: {history: !list(Msg), log: !str}
      nodes:
        ask: {kind: human_input, prompt: "You:", output: str}
        reply:
          kind: agent
          input: {history: "${input.history}", message: "${ask.output}"}
          output: str
          prompt: |-
            Conversation so far: ${history}
            User: ${message}
      output:
        history: ${input.history + [Msg(role="user", text=ask.output), Msg(role="assistant", text=reply.output)]}
        log: "${input.log}\nUser: ${ask.output}\nAssistant: ${reply.output}"
  nodes:
    chat: {kind: loop, call: turn, input: {history: [], log: ""}, times: 3}
  output: ${chat.output.log}
run: {run_id: r1, num_workers: 0, learnable: true}
host:
  human: {"chat#0/ask": [a], "chat#1/ask": [b], "chat#2/ask": [c]}
  models:
    "chat#0/reply":
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts: [{type: text, text: A}]
    "chat#1/reply":
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts: [{type: text, text: B}]
    "chat#2/reply":
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts: [{type: text, text: C}]
expect:
  output: {status: succeeded, output: "\nUser: a\nAssistant: A\nUser: b\nAssistant: B\nUser: c\nAssistant: C"}
