kind: run
rules: [run-log]
flow: |
  id: p
  name: p
  typedefs:
    Row: {output: str}
  input:
    rows: !list(Row)
  defs:
    leaf:
      input:
        x: !str
      nodes:
        up:
          kind: code
          input:
            x: ${input.x}
          output: str
          code: "return inputs['x'].toUpperCase()"
      output: ${up.output}
  nodes:
    m:
      kind: map
      over: ${input.rows}
      call: leaf
      input:
        x: ${item.output}
  output: ${m.output}
python_flow: |
  id: p
  name: p
  typedefs:
    Row: {output: str}
  input:
    rows: !list(Row)
  defs:
    leaf:
      input:
        x: !str
      nodes:
        up:
          kind: code
          input:
            x: ${input.x}
          output: str
          code: return inputs['x'].upper()
      output: ${up.output}
  nodes:
    m:
      kind: map
      over: ${input.rows}
      call: leaf
      input:
        x: ${item.output}
  output: ${m.output}
inputs:
  rows:
  - output: a
  - output: b
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [A, B]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        rows:
        - {output: a}
        - {output: b}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        rows:
        - output: a
        - output: b
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, m]
  - - pool_commit
    - m
    - from: {__start__: 6}
      key: m/__start__
  - - pool_commit
    - m
    - from: {__start__: 6}
      key: m#0/__start__
  - - pool_commit
    - m
    - from: {__start__: 6}
      key: m#1/__start__
  - - node_expanded
    - m
    - prune_ids: []
  - [node_started, m/__start__]
  - - node_succeeded
    - m/__start__
    - commit: 9
  - [node_started, m#0/__start__]
  - - node_succeeded
    - m#0/__start__
    - commit: 10
  - [node_started, m#1/__start__]
  - - node_succeeded
    - m#1/__start__
    - commit: 11
  - [node_started, m#0/up]
  - - pool_commit
    - m#0/up
    - value: A
  - - node_succeeded
    - m#0/up
    - {commit: 20}
  - [node_started, m#1/up]
  - - pool_commit
    - m#1/up
    - value: B
  - - node_succeeded
    - m#1/up
    - {commit: 23}
  - [node_started, m#0/__end__]
  - - pool_commit
    - m#0/__end__
    - from: {m#0/up: 20}
  - - node_succeeded
    - m#0/__end__
    - {commit: 26}
  - [node_started, m#1/__end__]
  - - pool_commit
    - m#1/__end__
    - from: {m#1/up: 23}
  - - node_succeeded
    - m#1/__end__
    - {commit: 29}
  - [node_started, m/__end__]
  - - pool_commit
    - m/__end__
    - key: m
      from: {m#0/__end__: 26, m#1/__end__: 29}
  - - node_succeeded
    - m/__end__
    - {commit: 32}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [A, B]
  - - node_succeeded
    - __end__
    - {commit: 35}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        rows:
        - output: a
        - output: b
  - - NodeStarted
    - node_id: m
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - x: a
        - x: b
      node_id: m
  - - NodeStarted
    - node_id: m/__start__
  - - NodeSucceeded
    - node_id: m/__start__
      output: {}
  - - NodeStarted
    - node_id: m#0/__start__
  - - NodeSucceeded
    - node_id: m#0/__start__
      output:
        x: a
  - - NodeStarted
    - node_id: m#1/__start__
  - - NodeSucceeded
    - node_id: m#1/__start__
      output:
        x: b
  - - NodeStarted
    - node_id: m#0/up
  - - NodeSucceeded
    - node_id: m#0/up
      output: A
  - - NodeStarted
    - node_id: m#1/up
  - - NodeSucceeded
    - node_id: m#1/up
      output: B
  - - NodeStarted
    - node_id: m#0/__end__
  - - NodeSucceeded
    - node_id: m#0/__end__
      output: A
  - - NodeStarted
    - node_id: m#1/__end__
  - - NodeSucceeded
    - node_id: m#1/__end__
      output: B
  - - NodeStarted
    - node_id: m/__end__
  - - NodeSucceeded
    - commit_as: m
      node_id: m/__end__
      output: [A, B]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [A, B]
  - - RunSucceeded
    - output: [A, B]
