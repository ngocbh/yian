kind: run
flow: |
  id: echo
  name: echo
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: "call(f, x=1)"
      output: str
  output: ${use.output}
python_flow: |
  id: echo
  name: echo
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: "call(f, x=1)"
      output: str
  output: ${use.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: call(f, x=1)
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, use]
  - - node_succeeded
    - use
    - value: call(f, x=1)
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: call(f, x=1)
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: use
  - - NodeSucceeded
    - node_id: use
      output: call(f, x=1)
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: call(f, x=1)
  - - RunSucceeded
    - output: call(f, x=1)
