kind: run
rules: [run-log]
flow: |
  id: echo
  name: echo
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: "call(f, x=1)"
      output: str
  output: ${use.output}
python_flow: |
  id: echo
  name: echo
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: "call(f, x=1)"
      output: str
  output: ${use.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: call(f, x=1)
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, use]
  - - pool_commit
    - use
    - value: call(f, x=1)
  - - node_succeeded
    - use
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: call(f, x=1)
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: use
  - - NodeSucceeded
    - node_id: use
      output: call(f, x=1)
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: call(f, x=1)
  - - RunSucceeded
    - output: call(f, x=1)
