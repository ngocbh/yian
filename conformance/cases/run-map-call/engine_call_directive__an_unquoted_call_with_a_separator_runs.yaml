kind: run
rules: [run-log]
flow: |
  id: spaced
  name: spaced
  defs:
    f:
      input:
        topic: !str
      nodes:
        e:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${e.output}
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(f, topic = "a = b")
      output: str
  output: ${use.output}
python_flow: |
  id: spaced
  name: spaced
  defs:
    f:
      input:
        topic: !str
      nodes:
        e:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${e.output}
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: call(f, topic = "a = b")
      output: str
  output: ${use.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: a = b
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, __call_0]
  - - node_expanded
    - __call_0
    - prune_ids: []
      seed:
        topic: a = b
  - [node_started, __call_0/__start__]
  - - pool_commit
    - __call_0/__start__
    - value:
        topic: a = b
  - - node_succeeded
    - __call_0/__start__
    - {commit: 11}
  - [node_started, __call_0/e]
  - - pool_commit
    - __call_0/e
    - value: a = b
  - - node_succeeded
    - __call_0/e
    - {commit: 14}
  - [node_started, __call_0/__end__]
  - - pool_commit
    - __call_0/__end__
    - value: a = b
      key: __call_0
  - - node_succeeded
    - __call_0/__end__
    - {commit: 17}
  - [node_started, use]
  - - pool_commit
    - use
    - value: a = b
  - - node_succeeded
    - use
    - {commit: 20}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: a = b
  - - node_succeeded
    - __end__
    - {commit: 23}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: __call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: a = b
      node_id: __call_0
  - - NodeStarted
    - node_id: __call_0/__start__
  - - NodeSucceeded
    - node_id: __call_0/__start__
      output:
        topic: a = b
  - - NodeStarted
    - node_id: __call_0/e
  - - NodeSucceeded
    - node_id: __call_0/e
      output: a = b
  - - NodeStarted
    - node_id: __call_0/__end__
  - - NodeSucceeded
    - commit_as: __call_0
      node_id: __call_0/__end__
      output: a = b
  - - NodeStarted
    - node_id: use
  - - NodeSucceeded
    - node_id: use
      output: a = b
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: a = b
  - - RunSucceeded
    - output: a = b
