kind: run
flow: |2

  id: nested
  name: nested
  input:
    topic: !str
  defs:
    inner:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:make_report
          input:
            topic: ${input.topic}
          output:
            report: str
            n: int
      output: ${x.output.report}
    outer:
      input:
        topic: !str
      nodes:
        inner_call:
          kind: call
          call: inner
          input:
            topic: ${input.topic}
      output: ${inner_call.output}
  nodes:
    go:
      kind: call
      call: outer
      input:
        topic: ${input.topic}
  output: ${go.output}
python_flow: |2

  id: nested
  name: nested
  input:
    topic: !str
  defs:
    inner:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: tests.engine._compose_codefns:make_report
          input:
            topic: ${input.topic}
          output:
            report: str
            n: int
      output: ${x.output.report}
    outer:
      input:
        topic: !str
      nodes:
        inner_call:
          kind: call
          call: inner
          input:
            topic: ${input.topic}
      output: ${inner_call.output}
  nodes:
    go:
      kind: call
      call: outer
      input:
        topic: ${input.topic}
  output: ${go.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: report for ACME
  trace:
  - - run_started
    - null
    - inputs:
        topic: ACME
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        topic: ACME
  - [node_started, go]
  - - node_expanded
    - go
    - prune_ids: []
      seed:
        topic: ACME
  - [node_started, go/__start__]
  - - node_succeeded
    - go/__start__
    - value:
        topic: ACME
  - [node_started, go/inner_call]
  - - node_expanded
    - go/inner_call
    - prune_ids: []
      seed:
        topic: ACME
  - [node_started, go/inner_call/__start__]
  - - node_succeeded
    - go/inner_call/__start__
    - value:
        topic: ACME
  - [node_started, go/inner_call/x]
  - - node_succeeded
    - go/inner_call/x
    - value:
        n: 4
        report: report for ACME
  - [node_started, go/inner_call/__end__]
  - - node_succeeded
    - go/inner_call/__end__
    - commit_target: go/inner_call
      value: report for ACME
  - [node_started, go/__end__]
  - - node_succeeded
    - go/__end__
    - commit_target: go
      value: report for ACME
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: report for ACME
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: go
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: go
  - - NodeStarted
    - node_id: go/__start__
  - - NodeSucceeded
    - node_id: go/__start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: go/inner_call
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: go/inner_call
  - - NodeStarted
    - node_id: go/inner_call/__start__
  - - NodeSucceeded
    - node_id: go/inner_call/__start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: go/inner_call/x
  - - NodeSucceeded
    - node_id: go/inner_call/x
      output:
        n: 4
        report: report for ACME
  - - NodeStarted
    - node_id: go/inner_call/__end__
  - - NodeSucceeded
    - commit_as: go/inner_call
      node_id: go/inner_call/__end__
      output: report for ACME
  - - NodeStarted
    - node_id: go/__end__
  - - NodeSucceeded
    - commit_as: go
      node_id: go/__end__
      output: report for ACME
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: report for ACME
  - - RunSucceeded
    - output: report for ACME
