kind: run
flow: |
  id: omitted-null-default
  name: omitted_null_default
  defs:
    child:
      kind: code
      code: |
        return inputs["maybe"]
      input:
        maybe: !Optional(int) null
      output: Optional(int)
  nodes:
    go:
      kind: call
      call: child
  output: ${go.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, go]
  - - node_expanded
    - go
    - prune_ids: []
      seed: {}
  - [node_started, go/__start__]
  - - node_succeeded
    - go/__start__
    - value:
        maybe: null
  - [node_started, go/child]
  - [node_succeeded, go/child]
  - [node_started, go/__end__]
  - - node_succeeded
    - go/__end__
    - commit_target: go
  - [node_started, __end__]
  - [node_succeeded, __end__]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: go
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: go
  - - NodeStarted
    - node_id: go/__start__
  - - NodeSucceeded
    - node_id: go/__start__
      output:
        maybe: null
  - - NodeStarted
    - node_id: go/child
  - - NodeSucceeded
    - node_id: go/child
  - - NodeStarted
    - node_id: go/__end__
  - - NodeSucceeded
    - commit_as: go
      node_id: go/__end__
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
  - [RunSucceeded]
