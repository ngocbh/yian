kind: run
rules: [run-log]
flow: |2

  id: shadow
  name: shadow
  input:
    x: !Optional(str)
  defs:
    child:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: !Optional(str) "fallback"
      output: Optional(str)
  nodes:
    go:
      kind: call
      call: child
      input:
        topic: ${input.x}
  output: ${go.output}
python_flow: |2

  id: shadow
  name: shadow
  input:
    x: !Optional(str)
  defs:
    child:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: !Optional(str) "fallback"
      output: Optional(str)
  nodes:
    go:
      kind: call
      call: child
      input:
        topic: ${input.x}
  output: ${go.output}
inputs:
  x: null
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {x: null}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        x: null
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, go]
  - - pool_commit
    - go
    - from: {__start__: 6}
      key: go/__start__
      value: {topic: null}
  - - node_expanded
    - go
    - prune_ids: []
      seed:
        topic: null
  - [node_started, go/__start__]
  - - node_succeeded
    - go/__start__
    - commit: 9
  - [node_started, go/child]
  - [pool_commit, go/child]
  - - node_succeeded
    - go/child
    - {commit: 14}
  - [node_started, go/__end__]
  - - pool_commit
    - go/__end__
    - key: go
      from: {go/child: 14}
  - - node_succeeded
    - go/__end__
    - {commit: 17}
  - [node_started, __end__]
  - [pool_commit, __end__]
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        x: null
  - - NodeStarted
    - node_id: go
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: null
      node_id: go
  - - NodeStarted
    - node_id: go/__start__
  - - NodeSucceeded
    - node_id: go/__start__
      output:
        topic: null
  - - NodeStarted
    - node_id: go/child
  - - NodeSucceeded
    - node_id: go/child
  - - NodeStarted
    - node_id: go/__end__
  - - NodeSucceeded
    - commit_as: go
      node_id: go/__end__
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
  - [RunSucceeded]
