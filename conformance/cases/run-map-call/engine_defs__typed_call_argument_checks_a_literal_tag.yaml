kind: run
rules: [messages]
flow: |2

  id: str-to-literal
  name: str_to_literal
  typedefs:
    Mode: Literal(a, b)
  input:
    s: !str
  defs:
    child:
      kind: code
      code: |
        return inputs["mode"]
      input:
        mode: !Mode
      output: str
  nodes:
    go:
      kind: call
      call: child
      input:
        mode: !Mode ${input.s}
  output: ${go.output}
inputs:
  s: c
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [21, 13, 21, 29]
      message: 'binding ''mode'': "c" is not a member of variant ["a","b"]'
      node: go
  trace:
  - - run_started
    - null
    - inputs:
        s: c
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        s: c
  - [node_started, go]
  - - node_failed
    - go
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 13, 21, 29]
        message: 'binding ''mode'': "c" is not a member of variant ["a","b"]'
        node: go
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: c
  - - NodeStarted
    - node_id: go
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 13, 21, 29]
        message: 'binding ''mode'': "c" is not a member of variant ["a","b"]'
        node: go
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 13, 21, 29]
        message: 'binding ''mode'': "c" is not a member of variant ["a","b"]'
        node: go
