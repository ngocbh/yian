      nodes:
        repeat:
          kind: loop
          times: 3
          input:
            n: ${input.x}
          nodes:
            inner:
              kind: call
              input:
                n: ${input.n}
              nodes:
                a:
                  kind: code
                  input: {n: "${input.n}"}
                  output: int
                  code: |
                    return inputs["n"] + 1
              output: ${a.output}
          output:
            n: ${inner.output}
      output: ${repeat.output}
  output: ${each.output}
