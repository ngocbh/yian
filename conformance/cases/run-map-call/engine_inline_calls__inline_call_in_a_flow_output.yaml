kind: run
flow: |2

  id: ic_out
  name: ic_out
  input:
    topic: !str

  defs:
    enrich:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}

  nodes:
