kind: run
rules: [run-log]
flow: |2

  id: ic_out
  name: ic_out
  input:
    topic: !str

  defs:
    enrich:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}

  nodes:
    seed:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: ${input.topic}
      output: str
  output: call(enrich, topic=${seed.output})
python_flow: |2

  id: ic_out
  name: ic_out
  input:
    topic: !str

  defs:
    enrich:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}

  nodes:
    seed:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: ${input.topic}
      output: str
  output: call(enrich, topic=${seed.output})
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ACME
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, seed]
  - - pool_commit
    - seed
    - value: ACME
  - - node_succeeded
    - seed
    - {commit: 9}
  - [node_started, __call_0]
  - - pool_commit
    - __call_0
    - from: {seed: 9}
      key: __call_0/__start__
  - - node_expanded
    - __call_0
    - prune_ids: []
  - [node_started, __call_0/__start__]
  - - node_succeeded
    - __call_0/__start__
    - commit: 12
  - [node_started, __call_0/x]
  - - pool_commit
    - __call_0/x
    - value: ACME
  - - node_succeeded
    - __call_0/x
    - {commit: 17}
  - [node_started, __call_0/__end__]
  - - pool_commit
    - __call_0/__end__
    - key: __call_0
      from: {__call_0/x: 17}
  - - node_succeeded
    - __call_0/__end__
    - {commit: 20}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ACME
  - - node_succeeded
    - __end__
    - {commit: 23}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: seed
  - - NodeSucceeded
    - node_id: seed
      output: ACME
  - - NodeStarted
    - node_id: __call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: __call_0
  - - NodeStarted
    - node_id: __call_0/__start__
  - - NodeSucceeded
    - node_id: __call_0/__start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: __call_0/x
  - - NodeSucceeded
    - node_id: __call_0/x
      output: ACME
  - - NodeStarted
    - node_id: __call_0/__end__
  - - NodeSucceeded
    - commit_as: __call_0
      node_id: __call_0/__end__
      output: ACME
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ACME
  - - RunSucceeded
    - output: ACME
