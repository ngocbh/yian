kind: run
flow: |2

  id: ic_defbody
  name: ic_defbody
  input:
    topic: !str
  defs:
    helper:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
    enrich:
      input:
        topic: !str
      nodes:
        y:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: call(helper, topic=${input.topic})
          output: str
      output: ${y.output}
  nodes:
    go:
      kind: call
      call: enrich
      input:
        topic: ${input.topic}
  output: ${go.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ACME
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, go]
  - - pool_commit
    - go
    - from: {__start__: 6}
      key: go/__start__
  - - node_expanded
    - go
    - prune_ids: []
  - [node_started, go/__start__]
  - - node_succeeded
    - go/__start__
    - commit: 9
  - [node_started, go/__call_0]
  - - pool_commit
    - go/__call_0
    - from: {go/__start__: 9}
      key: go/__call_0/__start__
  - - node_expanded
    - go/__call_0
    - prune_ids: []
  - [node_started, go/__call_0/__start__]
  - - node_succeeded
    - go/__call_0/__start__
    - commit: 14
  - [node_started, go/__call_0/x]
  - - pool_commit
    - go/__call_0/x
    - value: ACME
  - - node_succeeded
    - go/__call_0/x
    - {commit: 19}
  - [node_started, go/__call_0/__end__]
  - - pool_commit
    - go/__call_0/__end__
    - key: go/__call_0
      from: {go/__call_0/x: 19}
  - - node_succeeded
    - go/__call_0/__end__
    - {commit: 22}
  - [node_started, go/y]
  - - pool_commit
    - go/y
    - value: ACME
  - - node_succeeded
    - go/y
    - {commit: 25}
  - [node_started, go/__end__]
  - - pool_commit
    - go/__end__
    - key: go
      from: {go/y: 25}
  - - node_succeeded
    - go/__end__
    - {commit: 28}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ACME
  - - node_succeeded
    - __end__
    - {commit: 31}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: go
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: go
  - - NodeStarted
    - node_id: go/__start__
  - - NodeSucceeded
    - node_id: go/__start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: go/__call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: go/__call_0
  - - NodeStarted
    - node_id: go/__call_0/__start__
  - - NodeSucceeded
    - node_id: go/__call_0/__start__
      output:
        topic: ACME
  - - NodeStarted
    - node_id: go/__call_0/x
  - - NodeSucceeded
    - node_id: go/__call_0/x
      output: ACME
  - - NodeStarted
    - node_id: go/__call_0/__end__
  - - NodeSucceeded
    - commit_as: go/__call_0
      node_id: go/__call_0/__end__
      output: ACME
  - - NodeStarted
    - node_id: go/y
  - - NodeSucceeded
    - node_id: go/y
      output: ACME
  - - NodeStarted
    - node_id: go/__end__
  - - NodeSucceeded
    - commit_as: go
      node_id: go/__end__
      output: ACME
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ACME
  - - RunSucceeded
    - output: ACME
