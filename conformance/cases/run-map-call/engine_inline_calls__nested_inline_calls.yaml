kind: run
rules: [run-log]
flow: |2

  id: ic_nested
  name: ic_nested
  input:
    topic: !str
  defs:
    inner:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
    outer:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(outer, topic=call(inner, topic=${input.topic}))
      output: str
  output: ${use.output}
python_flow: |2

  id: ic_nested
  name: ic_nested
  input:
    topic: !str
  defs:
    inner:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
    outer:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: call(outer, topic=call(inner, topic=${input.topic}))
      output: str
  output: ${use.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
