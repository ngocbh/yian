kind: run
flow: |
  id: inline-named-equivalence
  name: inline_named_equivalence
  defs:
    named:
      input:
        x: !int
      nodes:
        echo:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo_x
          input:
            x: ${input.x}
          output: int
        pack:
          kind: code
          code: |
            return {"value": inputs["value"]}
          input:
            value: ${echo.output}
          output:
            value: int
      output: ${pack.output}
  nodes:
    named_call:
      kind: call
      call: named
      input:
        x: 5
    inline_call:
      kind: call
      input:
        x: 5
      nodes:
        echo:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo_x
          input:
            x: ${input.x}
          output: int
        pack:
          kind: code
          code: |
            return {"value": inputs["value"]}
          input:
            value: ${echo.output}
          output:
            value: int
      output: ${pack.output}
  output:
    named: ${named_call.output}
    inline: ${inline_call.output}
