kind: run
rules: [run-log]
flow: |
  id: eager-def-inline-call
  name: eager_def_inline_call
  defs:
    outer:
      nodes:
        wrapper:
          kind: call
          nodes:
            constant:
              kind: code
              code: ./fixtures/compose_codefns.ts:echo
              input:
                topic: inline-ok
              output: str
          output: ${constant.output}
      output: ${wrapper.output}
  nodes:
    invoke:
      kind: call
      call: outer
  output: ${invoke.output}
python_flow: |
  id: eager-def-inline-call
  name: eager_def_inline_call
  defs:
    outer:
      nodes:
        wrapper:
          kind: call
          nodes:
            constant:
              kind: code
              code: tests.engine._compose_codefns:echo
              input:
                topic: inline-ok
              output: str
          output: ${constant.output}
      output: ${wrapper.output}
  nodes:
    invoke:
      kind: call
      call: outer
  output: ${invoke.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: inline-ok
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {}
      key: invoke/__start__
  - - node_expanded
    - invoke
    - prune_ids: []
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 9
  - [node_started, invoke/wrapper]
  - - pool_commit
    - invoke/wrapper
    - from: {}
      key: invoke/wrapper/__start__
  - - node_expanded
    - invoke/wrapper
    - prune_ids: []
  - [node_started, invoke/wrapper/__start__]
  - - node_succeeded
    - invoke/wrapper/__start__
    - commit: 14
  - [node_started, invoke/wrapper/constant]
  - - pool_commit
    - invoke/wrapper/constant
    - value: inline-ok
  - - node_succeeded
    - invoke/wrapper/constant
    - {commit: 19}
  - [node_started, invoke/wrapper/__end__]
  - - pool_commit
    - invoke/wrapper/__end__
    - key: invoke/wrapper
      from: {invoke/wrapper/constant: 19}
  - - node_succeeded
    - invoke/wrapper/__end__
    - {commit: 22}
  - [node_started, invoke/__end__]
  - - pool_commit
    - invoke/__end__
    - key: invoke
      from: {invoke/wrapper: 22}
  - - node_succeeded
    - invoke/__end__
    - {commit: 25}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: inline-ok
  - - node_succeeded
    - __end__
    - {commit: 28}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: invoke
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: invoke
  - - NodeStarted
    - node_id: invoke/__start__
  - - NodeSucceeded
    - node_id: invoke/__start__
      output: {}
  - - NodeStarted
    - node_id: invoke/wrapper
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: invoke/wrapper
  - - NodeStarted
    - node_id: invoke/wrapper/__start__
  - - NodeSucceeded
    - node_id: invoke/wrapper/__start__
      output: {}
  - - NodeStarted
    - node_id: invoke/wrapper/constant
  - - NodeSucceeded
    - node_id: invoke/wrapper/constant
      output: inline-ok
  - - NodeStarted
    - node_id: invoke/wrapper/__end__
  - - NodeSucceeded
    - commit_as: invoke/wrapper
      node_id: invoke/wrapper/__end__
      output: inline-ok
  - - NodeStarted
    - node_id: invoke/__end__
  - - NodeSucceeded
    - commit_as: invoke
      node_id: invoke/__end__
      output: inline-ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: inline-ok
  - - RunSucceeded
    - output: inline-ok
