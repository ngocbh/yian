kind: run
rules: [run-log]
flow: |
  id: inline-outer-assert
  name: inline_outer_assert
  nodes:
    composite:
      kind: call
      asserts:
        - output == 999
      nodes:
        inner:
          kind: code
          code: |
            return 1
          output: int
      output: ${inner.output}
  output: ${composite.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: assertion.failed
      frames:
      - label: flow.yaml
        range: [4, 3, 4, 12]
      - label: flow.yaml
        range: [7, 9, 7, 22]
      message: 'node ''composite/__end__'' post-assert failed: output == 999'
      node: composite/__end__
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, composite]
  - - node_expanded
    - composite
    - prune_ids: []
      seed: {}
  - [node_started, composite/__start__]
  - - pool_commit
    - composite/__start__
    - value: {}
  - - node_succeeded
    - composite/__start__
    - {commit: 11}
  - [node_started, composite/inner]
  - - pool_commit
    - composite/inner
    - value: 1
  - - node_succeeded
    - composite/inner
    - {commit: 14}
  - [node_started, composite/__end__]
  - - node_failed
    - composite/__end__
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 12]
        - label: flow.yaml
          range: [7, 9, 7, 22]
        message: 'node ''composite/__end__'' post-assert failed: output == 999'
        node: composite/__end__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: composite
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: composite
  - - NodeStarted
    - node_id: composite/__start__
  - - NodeSucceeded
    - node_id: composite/__start__
      output: {}
  - - NodeStarted
    - node_id: composite/inner
  - - NodeSucceeded
    - node_id: composite/inner
      output: 1
  - - NodeStarted
    - node_id: composite/__end__
  - - NodeFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 12]
        - label: flow.yaml
          range: [7, 9, 7, 22]
        message: 'node ''composite/__end__'' post-assert failed: output == 999'
        node: composite/__end__
  - - RunFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [4, 3, 4, 12]
        - label: flow.yaml
          range: [7, 9, 7, 22]
        message: 'node ''composite/__end__'' post-assert failed: output == 999'
        node: composite/__end__
