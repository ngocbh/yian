kind: run
rules: [run-log, null-field-read]
flow: |
  id: inline-map-nullable-items
  name: inline_map_nullable_items
  typedefs:
    Detail:
      name: str
    Row:
      detail: Optional(Detail)
  input:
    items: !list(Optional(Row))
  nodes:
    each:
      kind: map
      over: ${input.items}
      input:
        row: ${item}
        name: ${item?.detail?.name}
      nodes:
        collect:
          kind: code
          code: |
            return {"row": inputs["row"], "name": inputs["name"]}
          input:
            row: ${input.row}
            name: ${input.name}
          output:
            row: Optional(Row)
            name: Optional(str)
      output: ${collect.output}
  output: ${each.output}
inputs:
  items:
  - null
  - detail: null
  - detail:
      name: ready
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
    - name: null
      row: null
    - name: null
      row:
        detail: null
    - name: ready
      row:
        detail:
          name: ready
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
