kind: run
flow: |
  id: nested-inline-composites
  name: nested_inline_composites
  input:
    items: !list(int)
  nodes:
    outer_call:
      kind: call
      input:
        items: ${input.items}
      nodes:
        inner:
          kind: map
          over: ${input.items}
          input:
            value: ${item}
          nodes:
            echo:
              kind: code
              code: ./fixtures/compose_codefns.ts:echo_x
              input:
                x: ${input.value}
              output: int
          output: ${echo.output}
      output: ${inner.output}
    outer_loop:
      kind: loop
      times: 2
      input:
        n: 0
        exited: false
      nodes:
        inner:
          kind: call
          input:
            n: ${input.n}
            exited: ${input.exited}
          nodes:
            bump:
              kind: code
              code: ./fixtures/compose_codefns.ts:loop_bump
              input:
                n: ${input.n}
                exited: ${input.exited}
              output:
                n: int
                exited: bool
          output: ${bump.output}
      output: ${inner.output}
  output:
    mapped: ${outer_call.output}
    looped: ${outer_loop.output}
