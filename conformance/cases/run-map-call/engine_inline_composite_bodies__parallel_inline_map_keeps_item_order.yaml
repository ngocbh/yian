kind: run
rules: [run-log]
flow: |
  id: inline-map-typed-records
  name: inline_map_typed_records
  typedefs:
    Row:
      name: str
      position: int
  input:
    rows: !list(Row)
  nodes:
    prepare:
      kind: code
      code: |
        return inputs["rows"]
      input:
        rows: ${input.rows}
      output: list(Row)
    each:
      kind: map
      parallel: true
      over: ${prepare.output}
      input:
        row: ${item}
        name: ${item.name}
      nodes:
        render:
          kind: code
          code: |
            return {"row": inputs["row"], "name": inputs["name"]}
          input:
            row: ${input.row}
            name: ${input.name}
          output:
            row: Row
            name: str
      output: ${render.output}
  output: ${each.output}
inputs:
  rows:
  - name: third
    position: 3
  - name: first
    position: 1
  - name: second
    position: 2
run:
  num_workers: 4
expect:
  output:
    status: succeeded
    output:
    - name: third
      row:
        name: third
        position: 3
    - name: first
      row:
        name: first
        position: 1
    - name: second
      row:
        name: second
        position: 2
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 4
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
