kind: run
flow: |
  id: inline-call-zero-input
  name: inline_call_zero_input
  nodes:
    wrapper:
      kind: call
      nodes:
        constant:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: inline-ok
          output: str
      output: ${constant.output}
  output: ${wrapper.output}
python_flow: |
  id: inline-call-zero-input
  name: inline_call_zero_input
  nodes:
    wrapper:
      kind: call
      nodes:
        constant:
          kind: code
          code: tests.engine._compose_codefns:echo
          input:
            topic: inline-ok
          output: str
      output: ${constant.output}
  output: ${wrapper.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: inline-ok
  trace:
  - - run_started
    - null
    - inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, wrapper]
  - - node_expanded
    - wrapper
    - prune_ids: []
      seed: {}
  - [node_started, wrapper/__start__]
  - - node_succeeded
    - wrapper/__start__
    - value: {}
  - [node_started, wrapper/constant]
  - - node_succeeded
    - wrapper/constant
    - value: inline-ok
  - [node_started, wrapper/__end__]
  - - node_succeeded
    - wrapper/__end__
    - commit_target: wrapper
      value: inline-ok
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: inline-ok
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: wrapper
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: wrapper
  - - NodeStarted
    - node_id: wrapper/__start__
  - - NodeSucceeded
    - node_id: wrapper/__start__
      output: {}
  - - NodeStarted
    - node_id: wrapper/constant
  - - NodeSucceeded
    - node_id: wrapper/constant
      output: inline-ok
  - - NodeStarted
    - node_id: wrapper/__end__
  - - NodeSucceeded
    - commit_as: wrapper
      node_id: wrapper/__end__
      output: inline-ok
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: inline-ok
  - - RunSucceeded
    - output: inline-ok
