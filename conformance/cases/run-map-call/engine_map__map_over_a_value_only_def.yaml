kind: run
flow: |2

  id: opaque-output-map
  name: opaque_output_map
  input:
    values: !list(int)
  defs:
    increment:
      input:
        value: !int
      nodes: {}
      output: ${input.value + 1}
  nodes:
    each:
      kind: map
      call: increment
      over: ${input.values}
      input:
        value: ${item}
  output: ${each.output}
inputs:
  values: [1, 4]
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [2, 5]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        values: [1, 4]
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        values: [1, 4]
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, each]
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each/__start__
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each#0/__start__
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each#1/__start__
  - - node_expanded
    - each
    - prune_ids: []
  - [node_started, each/__start__]
  - - node_succeeded
    - each/__start__
    - commit: 9
  - [node_started, each#0/__start__]
  - - node_succeeded
    - each#0/__start__
    - commit: 10
  - [node_started, each#1/__start__]
  - - node_succeeded
    - each#1/__start__
    - commit: 11
  - [node_started, each#0/__end__]
  - - pool_commit
    - each#0/__end__
    - from: {each#0/__start__: 10}
  - - node_succeeded
    - each#0/__end__
    - {commit: 20}
  - [node_started, each#1/__end__]
  - - pool_commit
    - each#1/__end__
    - from: {each#1/__start__: 11}
  - - node_succeeded
    - each#1/__end__
    - {commit: 23}
  - [node_started, each/__end__]
  - - pool_commit
    - each/__end__
    - key: each
      from: {each#0/__end__: 20, each#1/__end__: 23}
  - - node_succeeded
    - each/__end__
    - {commit: 26}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [2, 5]
  - - node_succeeded
    - __end__
    - {commit: 29}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        values: [1, 4]
  - - NodeStarted
    - node_id: each
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - value: 1
        - value: 4
      node_id: each
  - - NodeStarted
    - node_id: each/__start__
  - - NodeSucceeded
    - node_id: each/__start__
      output: {}
  - - NodeStarted
    - node_id: each#0/__start__
  - - NodeSucceeded
    - node_id: each#0/__start__
      output:
        value: 1
  - - NodeStarted
    - node_id: each#1/__start__
  - - NodeSucceeded
    - node_id: each#1/__start__
      output:
        value: 4
  - - NodeStarted
    - node_id: each#0/__end__
  - - NodeSucceeded
    - node_id: each#0/__end__
      output: 2
  - - NodeStarted
    - node_id: each#1/__end__
  - - NodeSucceeded
    - node_id: each#1/__end__
      output: 5
  - - NodeStarted
    - node_id: each/__end__
  - - NodeSucceeded
    - commit_as: each
      node_id: each/__end__
      output: [2, 5]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [2, 5]
  - - RunSucceeded
    - output: [2, 5]
