kind: run
flow: |2

  id: opaque-output-map
  name: opaque_output_map
  input:
    values: !list(int)
  defs:
    increment:
      input:
        value: !int
      nodes: {}
      output: ${input.value + 1}
  nodes:
    each:
      kind: map
      call: increment
      over: ${input.values}
      input:
        value: ${item}
  output: ${each.output}
inputs:
  values: [1, 4]
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [2, 5]
  trace:
  - - run_started
    - null
    - inputs:
        values: [1, 4]
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        values: [1, 4]
  - [node_started, each]
  - - node_expanded
    - each
    - prune_ids: []
      seed:
      - value: 1
      - value: 4
  - [node_started, each/__start__]
  - - node_succeeded
    - each/__start__
    - value: {}
  - [node_started, each#0/__start__]
  - - node_succeeded
    - each#0/__start__
    - value:
        value: 1
  - [node_started, each#1/__start__]
  - - node_succeeded
    - each#1/__start__
    - value:
        value: 4
  - [node_started, each#0/__end__]
  - - node_succeeded
    - each#0/__end__
    - value: 2
  - [node_started, each#1/__end__]
  - - node_succeeded
    - each#1/__end__
    - value: 5
  - [node_started, each/__end__]
  - - node_succeeded
    - each/__end__
    - commit_target: each
      value: [2, 5]
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: [2, 5]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        values: [1, 4]
  - - NodeStarted
    - node_id: each
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - value: 1
        - value: 4
      node_id: each
  - - NodeStarted
    - node_id: each/__start__
  - - NodeSucceeded
    - node_id: each/__start__
      output: {}
  - - NodeStarted
    - node_id: each#0/__start__
  - - NodeSucceeded
    - node_id: each#0/__start__
      output:
        value: 1
  - - NodeStarted
    - node_id: each#1/__start__
  - - NodeSucceeded
    - node_id: each#1/__start__
      output:
        value: 4
  - - NodeStarted
    - node_id: each#0/__end__
  - - NodeSucceeded
    - node_id: each#0/__end__
      output: 2
  - - NodeStarted
    - node_id: each#1/__end__
  - - NodeSucceeded
    - node_id: each#1/__end__
      output: 5
  - - NodeStarted
    - node_id: each/__end__
  - - NodeSucceeded
    - commit_as: each
      node_id: each/__end__
      output: [2, 5]
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [2, 5]
  - - RunSucceeded
    - output: [2, 5]
