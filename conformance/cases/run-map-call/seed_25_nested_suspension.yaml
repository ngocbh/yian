# From tests/seeds/25-nested-suspension.yaml.
# A HUMAN_INPUT inside a called child asks and answers under growth; the child returns the answer.
# The header's `review/approve` is stale: the CALL node `gate` namespaces the leaf, `gate/approve`.
# No `tool_calls`: docs/api.md's `ask_user` doesn't define the form of `answer_schema`.
kind: run
rules: [run-log]
flow: |
  # 25 — Nested interaction: a HUMAN_INPUT inside a called child.
  #
  # The parent `call`s an in-file `defs:` callable whose body blocks on HUMAN_INPUT. The
  # engine grows the live graph via Grow, then the namespaced leaf (`review/approve`) calls
  # the host-owned ask_user tool and stays live until the handler returns. Its ordinary typed
  # Output feeds the next child node. Shows: blocking interaction under graph growth, a
  # HUMAN_INPUT in a child, and the child re-exporting its confirmed value to the parent.
  # No checkpoint pause or synthetic continuation is involved.
  # The source layout stays stable because diagnostic tests pin its nested frame locations.

  id: nested-suspension
  name: nested_suspension
  description: Call a child that blocks for human approval, then confirm inside the same live run.

  typedefs:
    Approval: Literal(approve, reject)

  input:
    action: !str

  defs:
    review:                       # an in-file callable that BLOCKS on a HUMAN_INPUT
      input:
        action: !str
      nodes:
        approve:
          kind: human_input
          input:
            action: ${input.action}
          prompt: "Approve this action? ${action}  (approve / reject)"
          output: Approval       # the injected answer, validated against Approval's tags
        record:
          kind: code
          input:
            answer: ${approve.output}
          output: str
          code: ./fixtures/seeds.ts:confirm_action
      output: ${record.output}  # the child's codomain (the confirmed answer)

  nodes:
    gate:
      kind: call
      call: review                # resolves to the in-file def above (defs-first)
      input:
        action: ${input.action}

  output: ${gate.output}
# The CODE reference differs by language: `flow` names the TS function, this the Python one.
python_flow: |
  # 25 — Nested interaction: a HUMAN_INPUT inside a called child.
  #
  # The parent `call`s an in-file `defs:` callable whose body blocks on HUMAN_INPUT. The
  # engine grows the live graph via Grow, then the namespaced leaf (`review/approve`) calls
  # the host-owned ask_user tool and stays live until the handler returns. Its ordinary typed
  # Output feeds the next child node. Shows: blocking interaction under graph growth, a
  # HUMAN_INPUT in a child, and the child re-exporting its confirmed value to the parent.
  # No checkpoint pause or synthetic continuation is involved.
  # The source layout stays stable because diagnostic tests pin its nested frame locations.

  id: nested-suspension
  name: nested_suspension
  description: Call a child that blocks for human approval, then confirm inside the same live run.

  typedefs:
    Approval: Literal(approve, reject)

  input:
    action: !str

  defs:
    review:                       # an in-file callable that BLOCKS on a HUMAN_INPUT
      input:
        action: !str
      nodes:
        approve:
          kind: human_input
          input:
            action: ${input.action}
          prompt: "Approve this action? ${action}  (approve / reject)"
          output: Approval       # the injected answer, validated against Approval's tags
        record:
          kind: code
          input:
            answer: ${approve.output}
          output: str
          code: tests.seeds.fns:confirm_action
      output: ${record.output}  # the child's codomain (the confirmed answer)

  nodes:
