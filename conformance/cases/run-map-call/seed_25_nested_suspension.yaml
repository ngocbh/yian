# An ask inside a called child asks and is answered under growth; the child returns the answer.
# The header's `review/approve` is stale: the CALL node `gate` namespaces the leaf, `gate/approve`.
# No `tool_calls`: the form of the `ask_user` tool's `answer_schema` isn't documented, so it isn't pinned.
kind: run
flow: |
  # 25 — Nested interaction: an ask inside a called child.
  #
  # The parent `call`s an in-file `defs:` callable whose body asks (tool_id: ask). The
  # engine grows the live graph via Grow, then the namespaced leaf (`review/approve`) calls
  # the host's ask handler, which answers or holds the call. Its ordinary typed
  # Output feeds the next child node. Shows: an interaction under graph growth, an
  # ask in a child, and the child re-exporting its confirmed value to the parent.
  # No checkpoint pause or synthetic continuation is involved.
  # The source layout stays stable because diagnostic tests pin its nested frame locations.

  id: nested-suspension
  name: nested_suspension
  description: Call a child that blocks for human approval, then confirm inside the same live run.

  typedefs:
    Approval: Literal(approve, reject)

  input:
    action: !str

  defs:
    review:                       # an in-file callable that asks
      input:
        action: !str
      nodes:
        approve:
          kind: tool
          tool_id: ask
          input:
            prompt: "Approve this action? ${input.action}  (approve / reject)"
          output: Approval       # the injected answer, validated against Approval's tags
        record:
          kind: code
          input:
            answer: ${approve.output}
          output: str
          code: ./fixtures/seeds.ts:confirm_action
      output: ${record.output}  # the child's codomain (the confirmed answer)

  nodes:
    gate:
      kind: call
      call: review                # resolves to the in-file def above (defs-first)
      input:
        action: ${input.action}

  output: ${gate.output}
inputs: {action: deploy}
run: {run_id: r1, num_workers: 0}
host:
  human:
    gate/approve: [approve]
expect:
  output: {status: succeeded, output: approve}
  trace:
    - [run_started, null, {learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {action: deploy}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {action: deploy}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, gate]
    - [pool_commit, gate, {from: {__start__: 6}, key: gate/__start__}]
    - [node_expanded, gate, {prune_ids: []}]
    - [node_started, gate/__start__]
    - [node_succeeded, gate/__start__, {commit: 9}]
    - [node_started, gate/approve]
    - [pool_commit, gate/approve, {value: approve}]
    - [node_succeeded, gate/approve, {commit: 14}]
    - [node_started, gate/record]
    - [pool_commit, gate/record, {value: approve}]
    - [node_succeeded, gate/record, {commit: 17}]
    - [node_started, gate/__end__]
    - [pool_commit, gate/__end__, {key: gate, from: {gate/record: 17}}]
    - [node_succeeded, gate/__end__, {commit: 20}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: approve}]
    - [node_succeeded, __end__, {commit: 23}]
