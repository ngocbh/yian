# From tests/engine/test_agent_session.py::test_provider_change_requires_reset_then_starts_fresh.
# Pins: a session whose history was made under one provider refuses a run under another (it needs a
# reset) before any model call. The provider comes from the run's `llm_config` layer, since `before`
# runs share the flow.
kind: run
flow: |
  id: plain-session
  name: plain_session
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      long_term_memory: session
      prompt: ${question}
      input:
        question: ${input.question}
      output: str
  output: ${agent.output}
inputs:
  question: second
run:
  run_id: r2
  num_workers: 0
  llm_config:
    provider: anthropic
    model: test-model
host:
  memory:
    before:
    - inputs:
        question: first
      run:
        run_id: r1
        num_workers: 0
        llm_config:
          provider: openai
          model: test-model
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: one
expect:
  raises:
    class: MemoryOperationError
    message: conversation compatibility changed; reset is required
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          model: test-model
          provider: anthropic
          _connection:
            method: api_key
            source: environment
            endpoint: null
      learnable: false
      num_workers: 0
      inputs:
        question: second
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        question: second
  - [node_started, agent]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        question: second
  - - NodeStarted
    - node_id: agent
