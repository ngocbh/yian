# From tests/engine/test_agent_session_execution.py::test_loop_iterations_share_one_authored_conversation.
# Pins: a session AGENT in a LOOP body keeps one conversation across iterations: each iteration's
# request holds the earlier iterations' turns.
kind: run
flow: |
  id: session-loop
  name: session_loop
  llm_config: {provider: openai, model: fake-model}
  defs:
    body:
      input:
        question: !str
      nodes:
        answer:
          kind: agent
          long_term_memory: session
          input: {question: "${input.question}"}
          prompt: ${question}
          output: str
        carry:
          kind: code
          input: {answer: "${answer.output}"}
          code: "return {'question': inputs['answer']}"
          output: {question: str}
      output: ${carry.output}
  nodes:
    repeat:
      kind: loop
      call: body
      input: {question: first}
      times: 3
  output: ${repeat.output.question}
run:
  run_id: r1
  num_workers: 0
host:
  memory: {}
  models:
    repeat#0/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: reply-1
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: first
    repeat#1/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: reply-2
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: first
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: reply-1
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: reply-1
    repeat#2/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: reply-3
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: first
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: reply-1
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: reply-1
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: reply-2
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: reply-2
expect:
  output:
    status: succeeded
    output: reply-3
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        repeat/answer:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: fake-model
          provider: openai
      inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, repeat]
  - - node_expanded
    - repeat
    - prune_ids: []
      seed:
      - question: first
      - 0
  - [node_started, repeat#0/__start__]
  - - node_succeeded
    - repeat#0/__start__
    - value:
        question: first
  - [node_started, repeat#0/answer]
  - - node_succeeded
    - repeat#0/answer
    - value: reply-1
  - [node_started, repeat#0/carry]
  - - node_succeeded
