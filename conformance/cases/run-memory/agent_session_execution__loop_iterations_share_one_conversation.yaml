    - value:
        question: reply-1
  - [node_started, repeat#0/__end__]
  - - node_succeeded
    - repeat#0/__end__
    - value:
        question: reply-1
  - [node_started, repeat~1]
  - - node_expanded
    - repeat~1
    - prune_ids:
      - repeat#0/__end__
      - repeat#0/__start__
      - repeat#0/answer
      - repeat#0/carry
      - repeat~1
      seed:
      - question: reply-1
      - 1
  - [node_started, repeat#1/__start__]
  - - node_succeeded
    - repeat#1/__start__
    - value:
