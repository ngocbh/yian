  - [node_started, repeat#1/answer]
  - - node_succeeded
    - repeat#1/answer
    - value: reply-2
  - [node_started, repeat#1/carry]
  - - node_succeeded
    - repeat#1/carry
    - value:
        question: reply-2
  - [node_started, repeat#1/__end__]
  - - node_succeeded
    - repeat#1/__end__
    - value:
        question: reply-2
  - [node_started, repeat~2]
  - - node_expanded
    - repeat~2
    - prune_ids:
      - repeat#1/__end__
      - repeat#1/__start__
      - repeat#1/answer
      - repeat#1/carry
      - repeat~2
      seed:
      - question: reply-2
      - 2
  - [node_started, repeat#2/__start__]
  - - node_succeeded
    - repeat#2/__start__
    - value:
        question: reply-2
  - [node_started, repeat#2/answer]
  - - node_succeeded
    - repeat#2/answer
    - value: reply-3
  - [node_started, repeat#2/carry]
  - - node_succeeded
