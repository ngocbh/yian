        question: reply-3
  - [node_started, repeat~3]
  - - node_succeeded
    - repeat~3
    - commit_target: repeat
      value:
        question: reply-3
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: reply-3
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: repeat
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - question: first
        - 0
      node_id: repeat
  - - NodeStarted
    - node_id: repeat#0/__start__
  - - NodeSucceeded
    - node_id: repeat#0/__start__
      output:
        question: first
  - - NodeStarted
    - node_id: repeat#0/answer
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: fake-model
