  - - NodeStarted
    - node_id: repeat#1/__start__
  - - NodeSucceeded
    - node_id: repeat#1/__start__
      output:
        question: reply-1
  - - NodeStarted
    - node_id: repeat#1/answer
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: fake-model
      node_id: repeat#1/answer
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: fake-model
      node_id: repeat#1/answer
