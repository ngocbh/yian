  - - NodeSucceeded
    - node_id: repeat#1/answer
      output: reply-2
  - - NodeStarted
    - node_id: repeat#1/carry
  - - NodeSucceeded
    - node_id: repeat#1/carry
      output:
        question: reply-2
  - - NodeStarted
    - node_id: repeat#1/__end__
  - - NodeSucceeded
    - node_id: repeat#1/__end__
      output:
