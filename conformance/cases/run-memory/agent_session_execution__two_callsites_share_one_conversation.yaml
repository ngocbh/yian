# From tests/engine/test_agent_session_execution.py::test_two_callsites_of_one_child_share_one_conversation.
# Pins: two CALL sites of one child share its AGENT's session: the second call's request holds the
# first call's turn. Shortest form: one run (the test's second run adds nothing new).
kind: run
flow: |
  id: session-calls
  name: session_calls
  llm_config: {provider: openai, model: fake-model}
  defs:
    body:
      input:
        question: !str
      nodes:
        answer:
          kind: agent
          long_term_memory: session
          input: {question: "${input.question}"}
          prompt: ${question}
          output: str
      output: ${answer.output}
  nodes:
    left: {kind: call, call: body, input: {question: left}}
    right: {kind: call, call: body, input: {question: right}}
  output: ${[left.output, right.output]}
run:
  run_id: r1
  num_workers: 0
host:
  memory: {}
  models:
    left/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: left
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: left
    right/answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: right
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: left
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: left
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: right
expect:
  output:
    status: succeeded
    output: [left, right]
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        left/answer:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: fake-model
          provider: openai
        right/answer:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: fake-model
          provider: openai
      inputs: {}
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value: {}
  - [node_started, left]
  - - node_expanded
    - left
    - prune_ids: []
      seed:
        question: left
  - [node_started, right]
  - - node_expanded
    - right
    - prune_ids: []
      seed:
        question: right
  - [node_started, left/__start__]
  - - node_succeeded
    - left/__start__
    - value:
        question: left
  - [node_started, right/__start__]
  - - node_succeeded
    - right/__start__
    - value:
        question: right
  - [node_started, left/answer]
  - - node_succeeded
    - left/answer
    - value: left
  - [node_started, right/answer]
  - - node_succeeded
    - right/answer
    - value: right
  - [node_started, left/__end__]
  - - node_succeeded
    - left/__end__
    - commit_target: left
      value: left
  - [node_started, right/__end__]
  - - node_succeeded
    - right/__end__
    - commit_target: right
      value: right
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: [left, right]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
  - - NodeStarted
    - node_id: left
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          question: left
      node_id: left
  - - NodeStarted
    - node_id: right
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          question: right
      node_id: right
  - - NodeStarted
    - node_id: left/__start__
  - - NodeSucceeded
    - node_id: left/__start__
      output:
        question: left
  - - NodeStarted
    - node_id: right/__start__
  - - NodeSucceeded
    - node_id: right/__start__
      output:
        question: right
  - - NodeStarted
    - node_id: left/answer
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: fake-model
      node_id: left/answer
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: fake-model
      node_id: left/answer
      provider: openai
      purpose: chat
  - - NodeSucceeded
    - node_id: left/answer
      output: left
  - - NodeStarted
    - node_id: right/answer
  - - ModelCallStarted
    - exchange_id: <id:2>
      model: fake-model
      node_id: right/answer
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:2>
      model: fake-model
      node_id: right/answer
      provider: openai
      purpose: chat
  - - NodeSucceeded
    - node_id: right/answer
      output: right
  - - NodeStarted
    - node_id: left/__end__
  - - NodeSucceeded
    - commit_as: left
      node_id: left/__end__
      output: left
  - - NodeStarted
    - node_id: right/__end__
  - - NodeSucceeded
    - commit_as: right
      node_id: right/__end__
      output: right
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [left, right]
  - - RunSucceeded
    - output: [left, right]
  stream:
  - chunk: left
    exchange_id: <id:1>
    final: false
    key: text
    node_id: left/answer
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: left/answer
  - chunk: right
    exchange_id: <id:2>
    final: false
    key: text
    node_id: right/answer
  - chunk: ''
    exchange_id: <id:2>
    final: true
    key: text
    node_id: right/answer
