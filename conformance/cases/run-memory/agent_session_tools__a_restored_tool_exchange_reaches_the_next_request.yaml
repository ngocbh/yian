# From tests/engine/test_agent_session_tools.py::test_two_runs_restore_tool_exchanges_without_executing_old_calls.
# Pins: a session AGENT's tool exchange from an earlier run (a `before` run) is restored in this
# run's request: the assistant tool call and its tool result under the provider's call id, then
# the reply; the old call isn't run again (the stub has one result).
kind: run
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: openai, model: test-model}
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      tools: [lookup]
      long_term_memory: session
      prompt: ${question}
      input:
        question: ${input.question}
      output: str
  output: ${agent.output}
inputs:
  question: second
run:
  run_id: r2
  num_workers: 0
host:
  memory:
    before:
    - inputs:
        question: first
      run:
        run_id: r1
        num_workers: 0
  tools:
    lookup:
      parameters:
        type: object
        properties:
          value:
            type: integer
        required: [value]
      results:
      - return: result:1
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: provider-call
            name: lookup
            arguments:
              value: 1
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: one
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: two
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: first
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: provider-call
              name: lookup
              arguments:
                value: 1
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: provider-call
              name: lookup
              content: result:1
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: one
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: second
          tools:
          - name: lookup
            description: ''
            parameters:
              type: object
              properties:
                value:
                  type: integer
              required: [value]
expect:
  output:
    status: succeeded
    output: two
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      inputs:
        question: second
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        question: second
  - [node_started, agent]
  - - node_succeeded
    - agent
    - value: two
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: two
