# From tests/engine/test_episodic_memory_integration.py::test_backward_commits_episode_recalled_by_a_fresh_run.
# Pins: an AGENT-level episodic memory commits the earlier run's episode (the AGENT's only) on its
# backward, and it persists for a later run (fresh memories over the same root); the earlier run's
# request has no memory block. The main run's request (the episode recalled in the memory block)
# is pinned by episodic_memory_integration__a_recalled_episode_reaches_the_request.
kind: run
rules: [run-log]
flow: |
  id: episodic-history
  name: episodic_history
  llm_config: {provider: openai, model: test-model}
  input:
    topic: !str
  nodes:
    answer:
      kind: agent
      long_term_memory:
        episodic: {type: episodic, config: {max_episodes: 4, recall_limit: 2}}
      input: {topic: "${input.topic}"}
      prompt: Explain ${topic}.
      output: str
  output: ${answer.output}
inputs:
  topic: queue ordering
run:
  run_id: r2
  num_workers: 0
host:
  memory:
    before:
    - inputs:
        topic: queue ordering
      run:
        run_id: r1
        num_workers: 0
        learnable: true
      backward:
      - feedback: null
  models:
    answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Use a queue to preserve arrival order.
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Explain queue ordering.
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Use a queue again.
expect:
  output:
    status: succeeded
    output: Use a queue again.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        answer:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r2}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: queue ordering}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: queue ordering
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, answer]
  - - node_step
    - answer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - {text: Use a queue again., type: text}
          role: assistant
        purpose: chat
        request_sha256: fb7257c27516794f93645c700096ed1978271a08183668569b58371f48736a70
        response_id: null
        usage: null
  - - pool_commit
    - answer
    - value: Use a queue again.
  - - node_succeeded
    - answer
    - {commit: 10}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: Use a queue again.
  - - node_succeeded
    - __end__
    - {commit: 13}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: queue ordering
  - - NodeStarted
    - node_id: answer
  - - ModelCallStarted
    - model: test-model
      node_id: answer
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: test-model
      node_id: answer
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: answer
      output: Use a queue again.
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: Use a queue again.
  - - RunSucceeded
    - output: Use a queue again.
  stream:
  - chunk: Use a queue again.
    final: false
    key: text
    node_id: answer
    index: 0
    n: 1
  - chunk: ''
    final: true
    key: text
    node_id: answer
    index: 1
    n: 1
  memory:
    episodic: '{"entry_id":"<id:1>","episode":{"base_system_prompt":"You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.","execution_seq":8,"failure":null,"inputs":{"topic":"queue ordering"},"interactions":[{"kind":"model_text","text":"Use a queue to preserve arrival order."}],"memory_sections":[],"occurrence_path":[],"output":"Use a queue to preserve arrival order.","owner_static_path":["answer"],"prompt":"Explain queue ordering.","run_id":"r1","status":"succeeded"}}'
