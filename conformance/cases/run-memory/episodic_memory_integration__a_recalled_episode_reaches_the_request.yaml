# From tests/engine/test_episodic_memory_integration.py::test_backward_commits_episode_recalled_by_a_fresh_run.
# Pins: the episode an earlier run's backward commits is recalled into a later run's system prompt:
# the stored entry as canonical JSON, with its entry_id (the SHA-256 of the episode's identity) and
# the float input `weight` written `1.0`. The entry_id is a literal hash, not a placeholder,
# because a model request is compared exactly, without placeholders.
kind: run
rules: [run-log]
flow: |
  id: episodic-history
  name: episodic_history
  llm_config: {provider: openai, model: test-model}
  input:
    topic: !str
  nodes:
    answer:
      kind: agent
      long_term_memory:
        episodic: {type: episodic, config: {max_episodes: 4, recall_limit: 2}}
      input: {topic: "${input.topic}", weight: "${1.0}"}
      prompt: Explain ${topic}.
      output: str
  output: ${answer.output}
inputs:
  topic: queue ordering
run:
  run_id: r2
  num_workers: 0
host:
  memory:
    before:
    - inputs:
        topic: queue ordering
      run:
        run_id: r1
        num_workers: 0
        learnable: true
      backward:
      - feedback: null
  models:
    answer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Use a queue to preserve arrival order.
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Use a queue again.
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: |-
                You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.

                Memory context (canonical JSON; sections are ordered from outer workflow to local agent):
                {"order":"outer-to-local","sections":[{"index":1,"memory":"episodic","text":"{\"entry_id\":\"4e4cedab5de472183200b64622729b09e4af049c24c3b79eed80a517424f45a3\",\"episode\":{\"base_system_prompt\":\"You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.\",\"execution_seq\":8,\"failure\":null,\"inputs\":{\"topic\":\"queue ordering\",\"weight\":1.0},\"interactions\":[{\"kind\":\"model_text\",\"text\":\"Use a queue to preserve arrival order.\"}],\"memory_sections\":[],\"occurrence_path\":[],\"output\":\"Use a queue to preserve arrival order.\",\"owner_static_path\":[\"answer\"],\"prompt\":\"Explain queue ordering.\",\"run_id\":\"r1\",\"status\":\"succeeded\"}}"}]}
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Explain queue ordering.
expect:
  output:
    status: succeeded
    output: Use a queue again.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        answer:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r2}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: queue ordering}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: queue ordering
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, answer]
  - - node_step
    - answer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: test-model
        output:
          format: yian.message.v1
          parts:
          - {text: Use a queue again., type: text}
          role: assistant
        purpose: chat
        request_sha256: f6c065e3232d324d283673337c903bcc979bcafe72f2a577df7a0754cf784b8b
        response_id: null
        usage: null
  - - pool_commit
    - answer
    - value: Use a queue again.
  - - node_succeeded
    - answer
    - {commit: 10}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: Use a queue again.
  - - node_succeeded
    - __end__
    - {commit: 13}
