    notes: |-
      {"entry_id":"<id:4>","episode":{"base_system_prompt":null,"execution_seq":5,"failure":null,"inputs":{"question":"q1"},"interactions":[],"memory_sections":[],"occurrence_path":[],"output":{"question":"q1"},"owner_static_path":["__start__"],"prompt":null,"run_id":"r1","status":"succeeded"}}
