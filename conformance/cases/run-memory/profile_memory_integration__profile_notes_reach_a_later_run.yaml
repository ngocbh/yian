# From tests/engine/test_profile_memory_integration.py::test_profile_notes_and_a_session_transcript_share_one_agent_context,
# profile only (TS yian has no session memory).
# Pins: a flow-level profile reaches the AGENT's context on a later run: the profile document in the
# system prompt once, then this run's message, and no earlier turn.
kind: run
flow: |
  id: office
  name: office
  llm_config: {provider: openai, model: test-model}
  long_term_memory: profile
  input:
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        message: ${input.message}
      prompt: ${message}
      output: str
  output: ${reply.output}
files:
  memory/office/profile.md: |
    # Ada
    - Works on reefs.
inputs:
  message: again
run:
  run_id: r2
  num_workers: 0
host:
  memory:
    before:
    - inputs:
        message: hello
      run:
        run_id: r1
        num_workers: 0
  models:
    reply:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: First reply.
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: Second reply.
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: |-
                You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.

                Memory context (canonical JSON; sections are ordered from outer workflow to local agent):
                {"order":"outer-to-local","sections":[{"index":1,"memory":"profile","text":"# Ada\n- Works on reefs.\n"}]}
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: again
expect:
  output:
    status: succeeded
    output: Second reply.
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        reply:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: test-model
          provider: openai
      inputs:
        message: again
      learnable: false
      num_workers: 0
  - [node_started, __start__]
  - - node_succeeded
    - __start__
    - value:
        message: again
  - [node_started, reply]
  - - node_succeeded
    - reply
    - value: Second reply.
  - [node_started, __end__]
  - - node_succeeded
    - __end__
    - value: Second reply.
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        message: again
  - - NodeStarted
    - node_id: reply
  - - ModelCallStarted
    - exchange_id: <id:1>
      model: test-model
      node_id: reply
      provider: openai
      purpose: chat
  - - ModelCallFinished
    - exchange_id: <id:1>
      model: test-model
      node_id: reply
      provider: openai
      purpose: chat
  - - NodeSucceeded
    - node_id: reply
      output: Second reply.
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: Second reply.
  - - RunSucceeded
    - output: Second reply.
  stream:
  - chunk: Second reply.
    exchange_id: <id:1>
    final: false
    key: text
    node_id: reply
  - chunk: ''
    exchange_id: <id:1>
    final: true
    key: text
    node_id: reply
