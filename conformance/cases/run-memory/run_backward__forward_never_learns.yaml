# From tests/engine/test_run_backward.py::test_forward_returns_before_any_learning_or_commit (the forward half).
# Pins: a learnable run with memory and no backward learns nothing: no backward or memory commit
# record, and the memory's whole recall is empty.
kind: run
rules: [run-log]
flow: |
  id: identity
  name: identity
  long_term_memory: {notes: episodic}
  input:
    text: !str
  nodes: {}
  output: ${input.text}
inputs:
  text: hello
run:
  run_id: r1
  num_workers: 0
  learnable: true
host:
  memory: {}
expect:
  output:
    status: succeeded
    output: hello
  trace:
  - - run_started
    - null
    - learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {text: hello}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        text: hello
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        evaluated_keys: [text]
        input_names: [text]
        route:
          children:
          - kind: source
            source:
              execution_seq: 0
              path: [text]
              run_id: r1
          kind: record
          names: [text]
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: hello
  - - node_succeeded
    - __end__
    - commit: 9
      forward_capture:
        evaluated_keys: [result]
        input_names: [result]
        route:
          children:
          - kind: source
            source:
              execution_seq: 5
              path: [text]
              run_id: r1
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        text: hello
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: hello
  - - RunSucceeded
    - output: hello
  memory:
    notes: ''
