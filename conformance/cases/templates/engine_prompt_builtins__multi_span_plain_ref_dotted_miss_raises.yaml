kind: expr
rules: [null-field-read]
template: x ${sig.nope} y
values:
  sig:
    value: 0.8
mode: strict
expect:
  raises:
    class: ExpressionError
    message: "cannot read ${sig.nope}: sig has no field 'nope'"
python_expect:
  raises:
    class: ExpressionError
    message: unresolved reference ${sig.nope} in expression
