kind: load
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: x
      output: {k: {k: {k: {k: {k: "str"}}}}}
  output: ${use.output}
python_flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: x
      output: {k: {k: {k: {k: {k: "str"}}}}}
  output: ${use.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_MAX_TYPE_NESTING: '5'
  YIAN_MAX_YAML_NODES: '10000000'
expect:
  load: ok
