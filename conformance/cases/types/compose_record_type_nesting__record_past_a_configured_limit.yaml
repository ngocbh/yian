kind: load
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: x
      output: {k: {k: {k: {k: {k: {k: "str"}}}}}}
  output: ${use.output}
