kind: load
flow: |
  id: t
  name: t
  typedefs:
    T0: {a: int}
    T1: {a: T0}
    T2: {a: T1}
    T3: {a: T2}
    T4: {a: T3}
    T5: {a: T4}
  input:
    n: !int
  output: 'int'
  kind: code
  code: |
    return 1
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
  YIAN_MAX_TYPE_NESTING: '5'
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'bad typedefs: typedef ''T5'' field ''a'': type nests deeper than 5 levels, the limit for a type (each record and list is a level); its type ''T4'' adds 5'
      frames:
      - label: flow.yaml
        range: [9, 11, 9, 13]
