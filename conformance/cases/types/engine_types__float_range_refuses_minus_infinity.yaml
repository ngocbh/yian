kind: value
rules: [infinity, messages]
type: float(2..2)
value:
  $float: -inf
expect:
  raises:
    class: TypeCheckError
    message: -Infinity is outside inclusive float bounds (2, 2)
    path: []
python_expect:
  raises:
    class: TypeCheckError
    message: -inf is outside inclusive float bounds (2, 2)
    path: []
