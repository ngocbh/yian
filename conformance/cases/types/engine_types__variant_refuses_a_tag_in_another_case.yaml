kind: value
rules: [messages]
typedefs:
  Action: Literal(Approve, Reject, Defer)
type: Action
value: approve
expect:
  raises:
    class: TypeCheckError
    message: '"approve" is not a member of variant [''Approve'', ''Defer'', ''Reject'']'
    path: []
python_expect:
  raises:
    class: TypeCheckError
    message: '''approve'' is not a member of variant [''Approve'', ''Defer'', ''Reject'']'
    path: []
