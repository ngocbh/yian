kind: load
flow: |
  id: t
  name: t
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
  input:
    n: !int
  output: 'Union(Buy, None)'
  kind: code
  code: |
    return 1
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'bad type expression ''Union(Buy, None)'': None is not a union member in ''Union(Buy, None)''; use Optional(Union(...))'
      frames:
      - label: flow.yaml
        range: [8, 9, 8, 27]
