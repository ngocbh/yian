kind: value
rules: [messages]
type: datetime
value: 2026-06-12
expect:
  raises:
    class: TypeCheckError
    message: '"2026-06-12" does not match declared type datetime: datetime must look like 2026-05-21T14:30[:00][Z|+07:00]'
    path: []
python_expect:
  raises:
    class: TypeCheckError
    message: '''2026-06-12'' does not match declared type datetime: datetime must look like 2026-05-21T14:30[:00][Z|+07:00]'
    path: []
