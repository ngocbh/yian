kind: load
flow: |
  id: f
  name: f
  x-base: &base
    kind: code
    code: return 1
    output: int
  x-other: &other
    code: return 3
  nodes:
    a:
      <<: [*base, *other]
      code: return 2
  output: ${a.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load: ok
