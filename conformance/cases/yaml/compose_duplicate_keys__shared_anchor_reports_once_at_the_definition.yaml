kind: load
flow: |
  id: f
  name: f
  x-base: &base
    kind: code
    code: return 1
    code: return 2
    output: int
  nodes:
    a: *base
    b: *base
  output: ${a.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      message: duplicate key 'code' (first at line 5); a YAML mapping's keys must be unique, so remove or rename one
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 7]
