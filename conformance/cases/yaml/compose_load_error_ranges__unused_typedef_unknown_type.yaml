kind: load
flow: |
  id: typedefs
  name: typedefs
  typedefs:
    Al: Nope
  input:
    n: !int
  output: int
  kind: code
  code: |
    return inputs["n"]
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'bad typedefs: typedef ''Al'': unknown type ''Nope'''
      frames:
      - label: flow.yaml
        range: [4, 3, 4, 5]
