kind: load
flow: |
  id: f
  name: f
  typedefs:
    R:
      a: int
      n_field: int
    T:
      a: int
  defs:
    child:
      nodes:
        n_def_node:
          kind: code
          code: return 1
          output: int
      output: 1
  input:
    q: !str
    n_flow_input: !str
  nodes:
    a:
      kind: code
      code: return inputs["v"]
      input:
        v: ${input.q}
        n_node_input: x
        w: {2026-10-13: a}
      output: str
    b:
      kind: call
      nodes:
        inner:
          kind: code
          code: return 1
          output: int
        n_inline_node:
          kind: code
          code: return 2
          output: int
      output: ${inner.output}
    n_root_node:
      kind: code
      code: return 3
      output: int
  output:
    r: ${a.output}
    n_flow_output: ${a.output}
  x-meta:
    n_x_block: v
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      message: the key `2026-10-13` was read by YAML as a date, but names in a flow must be text. Quote it ("2026-10-13") or choose another name.
      frames:
      - label: flow.yaml
        range: [27, 11, 27, 21]
