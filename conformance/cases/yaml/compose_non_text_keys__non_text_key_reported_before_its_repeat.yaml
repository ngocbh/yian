kind: load
flow: |
  id: f
  name: f
  x-meta: {1: a, true: b}
  nodes:
    a:
      kind: code
      code: return 1
      output: int
  output: ${a.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      message: the key `1` was read by YAML as an integer, but names in a flow must be text. Quote it ("1") or choose another name.
      frames:
      - label: flow.yaml
        range: [3, 10, 3, 11]
