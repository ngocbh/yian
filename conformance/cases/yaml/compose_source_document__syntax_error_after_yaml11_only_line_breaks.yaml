flow: "id: x\nname: x\ndescription: \"a\Nb\Lc\Pd\"\nnodes: [\n"
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
