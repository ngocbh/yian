kind: load
rules: [yaml]
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: 2026-13-45
      output: str
  output: ${use.output}
python_flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: 2026-13-45
      output: str
  output: ${use.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [8, 14, 8, 15]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        invalid YAML: not a valid date: month must be in 1..12; quote it to keep it as text
          in "<unicode string>", line 8, column 14:
                  topic: 2026-13-45
                         ^
      frames:
      - label: flow.yaml
        range: [8, 14, 8, 15]
