kind: load
rules: [yaml]
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: 2026-01-01T10:00:00+05:99
      output: str
  output: ${use.output}
python_flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: 2026-01-01T10:00:00+05:99
      output: str
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [8, 14, 8, 15]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        invalid YAML: not a valid datetime: UTC offset minutes must be under 60; quote it to keep it as text
          in "<unicode string>", line 8, column 14:
                  topic: 2026-01-01T10:00:00+05:99
                         ^
      frames:
      - label: flow.yaml
        range: [8, 14, 8, 15]
