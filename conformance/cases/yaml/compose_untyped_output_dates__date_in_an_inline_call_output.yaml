# TS reads the unquoted date as text (rules: dates); Python's error in python_expect.
kind: load
flow: |
  id: p
  name: p
  nodes:
    c:
      kind: call
      nodes:
        b:
          kind: code
          code: return 1
      output:
        d: 2026-01-01
        h: ${b.output}
  output: ${c.output}
expect:
  load: ok
