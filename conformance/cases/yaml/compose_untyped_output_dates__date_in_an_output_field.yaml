# TS reads the unquoted date as text (rules: dates); Python's error in python_expect.
kind: load
rules: [dates]
flow: |
  id: p
  name: p
  nodes:
    b:
      kind: code
      code: return 1
  output:
    as_of: 2026-01-01
    h: ${b.output}
expect:
  load: ok
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''as_of'': `2026-01-01` is not a JSON value (YAML reads it as a date); quote it to keep it as text: `as_of: "2026-01-01"`'
      frames:
      - label: flow.yaml
        range: [8, 10, 8, 20]
