kind: load
flow: |
  id: p
  name: p
  nodes:
    b:
      kind: code
      code: return 1
  output:
    as_of: 2026-01-01T10:00:00
    h: ${b.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''as_of'': `2026-01-01T10:00:00` is not a JSON value (YAML reads it as a datetime); quote it to keep it as text: `as_of: "2026-01-01T10:00:00"`'
      frames:
      - label: flow.yaml
        range: [8, 10, 8, 29]
