kind: load
rules: [infinity]
flow: |
  id: p
  name: p
  nodes:
    b:
      kind: code
      code: return 1
  output:
    g: 1e400
    h: ${b.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [8, 6, 8, 7]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''g'': numbers must be finite (got 1e400, which YAML reads as .inf)'
      frames:
      - label: flow.yaml
        range: [8, 6, 8, 11]
