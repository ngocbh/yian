kind: load
rules: [yaml]
flow: |
  id: f
  name: f
  x-anchors:
    - &a0 [1]
    - &a1 [*a0, *a0]
    - &a2 [*a1, *a1]
    - &a3 [*a2, *a2]
    - &a4 [*a3, *a3]
    - &a5 [*a4, *a4]
    - &a6 [*a5, *a5]
    - &a7 [*a6, *a6]
    - &a8 [*a7, *a7]
    - &a9 [*a8, *a8]
    - &a10 [*a9, *a9]
    - &a11 [*a10, *a10]
    - &a12 [*a11, *a11]
    - &a13 [*a12, *a12]
    - &a14 [*a13, *a13]
    - &a15 [*a14, *a14]
    - &a16 [*a15, *a15]
    - &a17 [*a16, *a16]
    - &a18 [*a17, *a17]
    - &a19 [*a18, *a18]
    - &a20 [*a19, *a19]
    - &a21 [*a20, *a20]
    - &a22 [*a21, *a21]
    - &a23 [*a22, *a22]
    - &a24 [*a23, *a23]
    - &a25 [*a24, *a24]
    - &a26 [*a25, *a25]
    - &a27 [*a26, *a26]
    - &a28 [*a27, *a27]
    - &a29 [*a28, *a28]
  nodes:
    use:
      kind: code
      code: return 1
      input:
        topic: *a29
      output: str
  output: ${use.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [20, 5, 20, 6]
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        invalid YAML: this list holds more than 100000 YAML nodes, counting each alias as a copy of what it names; the limit for a YAML document is 100000 (YIAN_MAX_YAML_NODES; each mapping, list, and scalar is a node)
          in "<unicode string>", line 20, column 5:
              - &a16 [*a15, *a15]
                ^
      frames:
      - label: flow.yaml
        range: [20, 5, 20, 6]
