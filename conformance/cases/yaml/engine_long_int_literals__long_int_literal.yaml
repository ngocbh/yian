kind: load
rules: [numbers]
flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: 
      output: str
  output: ${use.output}
python_flow: |
  id: f
  name: f
  nodes:
    use:
      kind: code
      code: tests.engine._compose_codefns:echo
      input:
        topic: 
      output: str
  output: ${use.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
expect:
  load: ok
python_expect:
  load:
    diagnostics:
    - code: compose.load
      message: "invalid YAML: integer with 5000 digits is larger than yian allows (4300 digits)\n  in \"<unicode string>\", line 8, column 14:\n          topic: 11111111111111111111111111111111 ... \n                 ^"
      frames:
      - label: flow.yaml
        range: [8, 14, 8, 15]
