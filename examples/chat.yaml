# chat — a turn-by-turn conversational REPL (agent without tools; deterministic transcript).
#
# The turn boundary is STRUCTURAL: HUMAN_INPUT feeds a typed CASE that returns the turn's
# record. Exact exit text is a value branch: it keeps the transcript and sets `exited`.
# Anything else calls `respond`, where the AGENT fills the reply and a CODE node folds it
# into the transcript. The LLM only fills the reply.
# Run it with:  yian chat examples/chat.yaml
id: chat
name: chat
description: A turn-by-turn conversational assistant (one model call per turn, no tools).

input:
  opening: str            # seed transcript; the CLI passes "" (empty)

typedefs:
  Turn:                   # the carried record, and each turn's result
    transcript: str
    exited: bool

defs:
  respond:                # a CASE result is the routed node's output, so the reply chain is a def
    input:
      transcript: str
      message: str
    nodes:
      reply:
        kind: agent
        input:
          transcript: ${input.transcript}
          message:    ${input.message}
        output: str
        prompt: |-
          You are a helpful conversational assistant.

          Conversation so far:
          ${transcript}

          User: ${message}
      fold:
        kind: code
        input:
          transcript: ${input.transcript}
          message: ${input.message}
          reply: ${reply.output}
        output: Turn
        code: |
          return {
              "transcript": inputs["transcript"]
              + "\n\nUser: " + inputs["message"]
              + "\n\nAssistant: " + inputs["reply"],
              "exited": False,
          }
    output: ${fold.output}

  turn:                   # body: 'a -> 'a over {transcript, exited}
    input:
      transcript: str
      exited: bool
    nodes:
      ask:
        kind: human_input       # blocks a worker until the broker returns the message
        prompt: "You:"
        output: str
      route:
        kind: case
        on: ${ask.output}
        output: Turn            # every branch produces a Turn
        cases:
          - when: /exit
            then:               # a value branch: the exit record itself
              transcript: ${input.transcript}
              exited: true
          - when: /quit
            then:
              transcript: ${input.transcript}
              exited: true
        else: call(respond, transcript=${input.transcript}, message=${ask.output})
    output: ${route.output}

nodes:
  chat:
    kind: loop
    call: turn
    input:
      transcript: ${input.opening}
      exited: false                 # the CASE's exit branch sets true for exact /exit or /quit
    while: not exited               # a carried-field predicate
output: ${chat.output.transcript}
