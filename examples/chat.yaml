# chat — a turn-by-turn conversational assistant that folds older turns into a rolling summary
# (agent without tools; deterministic history).
#
# The host sends each line the user types to the `messages` inbox; each turn's `take` waits for
# them and takes everything sent since the last turn. Beside that take, `compacted` calls
# compact_history.yaml on the history so far: under its budget (32,000 characters of message
# text) it passes it through with no model call; over it, one model call folds the older turns
# into the summary and keeps the last 4 turns. `answered` calls `respond` with the summary and
# the kept turns flattened into one list of messages; the reply's system prompt carries the
# summary. Closing the inbox (/exit in `yian chat`) ends the loop once the queued messages are
# answered. The run log grows linearly (see "Growing a carried value" in docs/syntax.md).
# Comprehensions, len(), slices, the `prompt:` list style, `Inbox(str)` and `take` are TS-only.
id: chat
name: chat
description: A turn-by-turn conversational assistant that folds older turns into a rolling summary.

uses:
  compact_history: compact_history        # examples/compact_history.yaml

input:
  messages: !Inbox(str)

typedefs:
  Msg:                    # one message of the history the AGENT sends
    role: Literal(user, assistant)
    text: str
  State: {summary: str, history: list(list(Msg)), closed: bool}   # the carried record
  Transcript: {summary: str, history: list(Msg)}                  # the flow's output

defs:
  respond:                # a def, so its CALL flattens the history in a derived binding
    input: {summary: !str, history: !list(Msg), message: !str}
    nodes:
      reply:
        kind: agent
        input:
          summary: ${input.summary}
          history: ${input.history}      # a plain reference: one route in a learnable capture
          message: ${input.message}
        output: str                      # only this turn's reply is recorded
        system_prompt: |-
          You are a helpful conversational assistant.

          Conversation so far: ${summary}
        prompt:
          - ${history}
          - user: ${message}
    # A one-turn list (hence the double brackets), so the body appends it with `+`, or `[]` when
    # `answered` is skipped.
    output: !list(list(Msg)) ${[[Msg(role="user", text=input.message), Msg(role="assistant", text=reply.output)]]}

  turn:                   # body: 'a -> 'a over {summary, history, closed, messages}
    input:
      summary: !str
      history: !list(list(Msg))
      closed: !bool
      messages: !Inbox(str)
    nodes:
      compacted:          # beside `heard`: compacts the history so far
        kind: call
        call: compact_history
        input: {summary: "${input.summary}", history: "${input.history}"}
      heard:
        kind: tool
        tool_id: take                    # waits until a message arrives or the inbox closes
        input:
          from: ${input.messages}
          take: all
      route:
        kind: case
        cases:
          - when: ${heard.output.events != []}   # skipped when the inbox closed with nothing left
            then: answered
      answered:
        kind: call
        call: respond
        input:
          summary: ${compacted.output.summary}
          history: ${[m for t in compacted.output.history for m in t]}
          message: ${join(heard.output.events)}  # one line per send
    output: !State
      summary: ${compacted.output.summary}
      history: ${compacted.output.history + (answered.output :- [])}
      closed: ${heard.output.closed}

nodes:
  chat:
    kind: loop
    call: turn
    input: {summary: "", history: [], closed: false, messages: "${input.messages}"}
    while: not closed
output: !Transcript
  summary: ${chat.output.summary}
  history: ${[m for t in chat.output.history for m in t]}
