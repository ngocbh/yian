# chat — a turn-by-turn conversational REPL whose history lives in a session memory.
#
# The turn boundary is STRUCTURAL: HUMAN_INPUT feeds a CASE; exact exit text ends the
# loop, otherwise the AGENT replies. The reply agent owns one session memory, so each
# turn's model request starts from the earlier turns' messages; the flow passes only
# the new message. composer chat keeps the memory under
# ~/.agent_composer/sessions/<session id>/ and prints the id; continue later with
#   composer chat examples/chat.yaml --session <session id>
# examples/chat_no_memory.yaml is the same chat carrying its own transcript instead.
# Run it with:  composer chat examples/chat.yaml
id: chat
name: chat
description: A turn-by-turn conversational assistant with session memory (plain agent, no tools).

input:
  opening: str            # composer chat passes it; history comes from memory instead

defs:
  turn:                   # body: 'a -> 'a over {exited, reply}
    input:
      exited: bool
      reply: str
    nodes:
      ask:
        kind: human_input       # blocks a worker until the broker returns the message
        prompt: "You:"
        output: str
      route:
        kind: case
        on: ${ask.output}
        cases:
          - when: /exit
            then: exit_turn
          - when: /quit
            then: exit_turn
        else: reply
      exit_turn:
        kind: code
        output: bool
        code: |
          return True
      reply:
        kind: agent
        mode: plain
        system_prompt: You are a helpful conversational assistant.
        long_term_memory: {chat: session}   # the conversation, kept across turns
        input:
          message: ${ask.output}
        output: str
        prompt: ${message}
    # Comparing the optional exit output with true always yields the carried bool,
    # including on a miss; the reply defaults to "" on the exit turn.
    output:
      exited: ${exit_turn.output == true}
      reply: '${reply.output:-""}'

nodes:
  chat:
    kind: loop
    call: turn
    input:
      exited: false                 # CASE sets true for exact /exit or /quit input
      reply: ""
    while: "not ${exited}"
    max: 1000                       # required runaway safety cap
output: ${chat.output.reply}
