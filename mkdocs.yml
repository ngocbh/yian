site_name: Yian - The Agent Composer
site_description: Bridging the trust gap between humans and agents — a readable, Docker-Compose-shaped YAML surface where both people and LLMs compose, inspect, and refine agent workflows.
site_url: https://yian.readthedocs.io
repo_url: https://github.com/ngocbh/yian
repo_name: ngocbh/yian
edit_uri: edit/main/docs/

# This config lives at the repo root; docs sources are in docs/.
docs_dir: docs
site_dir: site
# Design/implementation plans are repository history, not reader documentation.
exclude_docs: |
  plans/

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: installation.md
  - The yian CLI: cli.md
  - Flow syntax: syntax.md
  - Examples: examples.md
  - Internals:
    - Agent: agent.md
    - Learning: learning.md
    - Architecture: architecture.md
    - Compose (YAML → IR): compose.md
    - The engine: engine.md
    - Runtime nodes: nodes.md
    - Types: typing.md
    - Expressions: expressions.md
  - Python API: api.md
  - Defaults and limits: defaults.md
