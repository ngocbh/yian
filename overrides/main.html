{% extends "base.html" %}

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false })</script>
  {{ super() }}
  <script>
    document$.subscribe(() => {
      document.querySelectorAll("pre.mermaid").forEach(diagram => {
        if (diagram.parentElement.classList.contains("mermaid-scroll")) return
        const scroller = document.createElement("div")
        scroller.className = "mermaid-scroll"
        diagram.replaceWith(scroller)
        scroller.append(diagram)
      })
    })
  </script>
{% endblock %}
