[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yian"
version = "0.0.3"
description = "Bridging the trust gap between humans and agents — a readable, Docker-Compose-shaped YAML surface where both people and LLMs compose, inspect, and refine agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ngoc Bui" }]
keywords = ["llm", "agents", "workflow", "orchestration", "langchain", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "langchain-core>=0.3.81",
    "pydantic>=2.11",
    "pyyaml>=6.0.0",
    "lark>=1.1",
    "typing-extensions>=4.14.0",
    # httpx2 2.12.0 is the first release with every 2026-08 advisory fixed (GHSA-8xx6).
    "httpx2>=2.12,<3",
    # CLI
    "typer>=0.21.0",
    "rich>=13.7.0",
    "questionary>=2.1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.15"]
# langchain-openai's request/stream hooks are covered against 1.6.2; verify before upgrading.
# openai 3.4.0 is the first release that drops Azure's `api-key` header on a redirect to
# another origin; this floor holds when yian is installed with the `openai` or `all` extra.
openai = ["langchain-openai==1.6.2", "openai>=3.4.0"]
# langchain-google-genai 4.3.0 is the first release whose `temperature` accepts None, which
# GoogleClient always passes; this floor holds when yian is installed with the `google` or
# `all` extra.
google = ["langchain-google-genai>=4.3.0"]
ollama = ["langchain-ollama>=1.1.0"]
all = [
    "langchain-anthropic>=0.3.15",
    "langchain-openai==1.6.2",
    "openai>=3.4.0",
    "langchain-google-genai>=4.3.0",
    "langchain-ollama>=1.1.0",
]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "black>=24.0"]

[project.scripts]
yian = "yian.cli:main"

[project.urls]
Homepage = "https://github.com/ngocbh/yian"
Repository = "https://github.com/ngocbh/yian"
Documentation = "https://yian.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yian = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
