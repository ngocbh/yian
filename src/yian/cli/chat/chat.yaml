# The default `yian chat` flow — a Yian assistant with flow-op tools.
# Same LOOP-per-turn shape as examples/chat.yaml; the reply agent runs a tool loop.
# A CASE picks each turn's record: exact exit text routes to `exited`, a value
# entry that keeps the transcript and sets `exited`; anything else calls `respond`,
# whose reply agent and transcript fold produce the same record.
id: yian-chat
name: composer_chat
description: An assistant that can discover, read, validate, run, and author Yian flows.

input:
  opening: !str

typedefs:
  Turn:
    transcript: str
    exited: bool

defs:
  respond:                # a CASE result is the routed node's output, so the reply chain is a def
    input:
      transcript: !str
      message: !str
    nodes:
      reply:
        kind: agent
        # The engine default is no cap (-1); bound this interactive agent so a runaway
        # model can't hang the REPL. 100 fits the 5 flow-op tools' exploratory turns.
        env:
          max_tool_iterations: 100
        tools: [list_flows, read_flow, validate_flow, run_flow, write_flow]
        input:
          transcript: ${input.transcript}
          message:    ${input.message}
        output: str
        prompt: |-
          You are Yian's assistant. You help the user discover, read,
          validate, run, and author flows (Compose YAML) using your tools. Prefer
          validate_flow before write_flow, and read_flow before editing.

          Conversation so far:
          ${transcript}

          User: ${message}
      fold:
        kind: code
        input:
          transcript: ${input.transcript}
          message: ${input.message}
          reply: ${reply.output}
        output: Turn
        code: |
          return {
              "transcript": inputs["transcript"]
              + "\n\nUser: " + inputs["message"]
              + "\n\nAssistant: " + inputs["reply"],
              "exited": False,
          }
    output: ${fold.output}

  turn:
    input:
      transcript: !str
      exited: !bool
    nodes:
      ask:
        kind: human_input
        prompt: "You:"
        output: str
      exited: !Turn
        transcript: ${input.transcript}
        exited: true
      route:
        kind: case
        on: ${ask.output}
        cases:
          - when: /exit
            then: exited
          - when: /quit
            then: exited
        else: call(respond, transcript=${input.transcript}, message=${ask.output})
    output: !Turn ${route.output}

nodes:
  chat:
    kind: loop
    call: turn
    input:
      transcript: ${input.opening}
      exited: false
    while: not exited
output: ${chat.output.transcript}
