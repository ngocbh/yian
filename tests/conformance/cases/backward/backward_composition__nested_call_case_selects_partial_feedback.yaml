kind: backward
flow: |
  id: selected-feedback
  name: selected_feedback
  input:
    selected: !bool
    payload: !object
  defs:
    leaf:
      input:
        payload: !object
        local: !str child default
      nodes: {}
      output:
        payload: ${input.payload}
        local: ${input.local}
    wrapper:
      input:
        selected: !bool
        payload: !object
      nodes:
        gate:
          kind: case
          cases:
            - when: input.selected
              then: chosen
          else: unselected
        chosen:
          kind: call
          call: leaf
          input:
            payload: ${input.payload}
        unselected:
          kind: call
          call: leaf
          input:
            payload: ${input.payload}
      output: ${chosen.output | unselected.output}
  nodes:
    outer:
      kind: call
      call: wrapper
      input:
        selected: ${input.selected}
        payload: ${input.payload}
  output: ${outer.output}
inputs:
  selected: true
  payload:
    title: unchanged
    rows:
    - [a]
    - [b, c]
run:
  num_workers: 0
  learnable: true
backward:
- feedback:
    payload:
      rows:
      - null
      - [null]
- feedback:
    payload:
      rows:
      - null
      - [Revise b., null]
    local: Keep the default.
