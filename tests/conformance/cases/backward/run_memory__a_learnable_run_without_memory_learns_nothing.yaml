kind: backward
flow: |
  id: memory-run
  name: memory_run
  long_term_memory: test
  nodes:
    work:
      kind: code
      code: return 7
      output: int
  output: ${work.output}
run:
  num_workers: 0
  learnable: true
backward:
- feedback: null
expect:
  output:
    status: succeeded
    output: 7
  trace:
  - - run_started
    - null
    - learnable: true
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - commit: 6
      forward_capture:
        route: {kind: record}
        scope:
          boundary: start
          flow_path: []
          occurrence_path: []
          static_path: [__start__]
  - [node_started, work]
  - - pool_commit
    - work
    - value: 7
  - - node_succeeded
    - work
    - commit: 9
      forward_capture:
        route: {kind: record}
        scope:
          boundary: null
          flow_path: []
          occurrence_path: []
          static_path: [work]
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 7
  - - node_succeeded
    - __end__
    - commit: 12
      forward_capture:
        evaluated_keys: [result]
        input_names: [result]
        route:
          children:
          - kind: source
            source:
              execution_seq: 8
              path: []
              run_id: <id:1>
          kind: record
          names: [result]
        scope:
          boundary: end
          flow_path: []
          occurrence_path: []
          static_path: [__end__]
  - - backward_started
    - null
    - attempt_id: 1
  - - backward_ready
    - null
    - attempt_id: 1
      attributed_results:
      - attribution: []
        feedback: []
        invoked: false
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 5
          path: []
          run_id: <id:1>
      - attribution: []
        feedback: []
        invoked: false
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 8
          path: []
          run_id: <id:1>
      - attribution: []
        feedback: []
        invoked: false
        result:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        source:
          execution_seq: 11
          path: []
          run_id: <id:1>
      proposals: []
      root_result:
        input_feedback: {}
        self_feedback: []
        variable_feedback: {}
  - - backward_finished
    - null
    - attempt_id: 1
      attributed_results: []
      outcome:
        failure: null
        feedback:
          input_feedback: {}
          self_feedback: []
          variable_feedback: {}
        learning: null
        status: succeeded
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: work
  - - NodeSucceeded
    - node_id: work
      output: 7
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 7
      interrupted: false
  - - RunSucceeded
    - output: 7
  backward:
  - failure: null
    feedback:
      input_feedback: {}
      self_feedback: []
      variable_feedback: {}
    learning: null
    status: succeeded
