kind: cli
files:
  company/main.yaml: |
    id: main
    name: main
    input:
      n: !int
    nodes:
      work:
        kind: call
        call: child
        input:
          n: ${input.n}
    output: ${work.output}
    uses:
      child: lib/missing
args: [check, --root, company, --json, company/main.yaml]
expect:
  exit: 1
  json:
    format: yian.cli.v1
    flows:
      - path: company/main.yaml
        ok: false
        diagnostics:
          - code: compose.load
            frames: [{label: main.yaml, range: [13, 10, 13, 21], note: "uses alias 'child'"}]
