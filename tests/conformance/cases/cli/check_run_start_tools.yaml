kind: cli
flow: |
  id: r
  name: r
  defs:
    greet: {kind: code, code: "return 1", output: !int}
  nodes:
    n: {kind: call, call: gret}
    m: {kind: call, call: {github: search}}
    s: {kind: call, call: sleep, input: {for: 1s}}
    o:
      kind: code
      code: return 1
      output: !int
      input:
        x: call(gret)
args: [check, --json, flow.yaml]
expect:
  exit: 0
  json:
    format: yian.cli.v1
    flows:
      - path: flow.yaml
        ok: true
        id: r
        name: r
        description: null
        inputs: []
        run_start_tools:
          - {node: n, name: gret, hint: did you mean the def greet?}
          - {node: m, name: "{github: search}", hint: null}
          - {node: "node 'o' input 'x' call(gret)", name: gret, hint: did you mean the def greet?}
