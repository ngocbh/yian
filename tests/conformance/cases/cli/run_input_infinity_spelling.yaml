# A `float` input reads infinity in any case, with an optional sign, as `inf` or `infinity`.
kind: cli
flow: |
  id: unbounded
  name: unbounded
  input:
    x: !float
  nodes: {}
  output: ${input.x}
args: [run, flow.yaml, -w, "0", --log, run.jsonl, --json, --input, x=-Infinity]
expect:
  exit: 0
  json:
    format: yian.cli.v1
    status: succeeded
    output: {$float: -inf}
