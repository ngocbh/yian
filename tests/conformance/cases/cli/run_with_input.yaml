kind: cli
flow: |
  id: code-greeting
  name: code_greeting
  input:
    name: !str
  nodes:
    greet:
      kind: code
      input:
        name: ${input.name}
      output: str
      code: |
        return "hi " + inputs.name
  output: ${greet.output}
args: [run, flow.yaml, --input, name=Ada]
expect:
  exit: 0
  stdout: "hi Ada\n"
