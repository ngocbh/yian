# An empty skills list fingerprints the same as no skills key.
kind: fingerprint
flow: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      output: str
  output: ${review.output}
other: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      skills: []
      output: str
  output: ${review.output}
expect:
  fingerprint: same
