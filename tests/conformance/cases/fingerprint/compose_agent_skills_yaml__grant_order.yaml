# The order of granted skills is not identity.
kind: fingerprint
flow: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      skills: [a, b]
      output: !str
  output: ${review.output}
other: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      skills: [b, a]
      output: !str
  output: ${review.output}
expect:
  fingerprint: same
