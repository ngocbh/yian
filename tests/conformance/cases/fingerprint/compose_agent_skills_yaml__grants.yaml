# Granting skills changes the fingerprint of an AGENT with none.
kind: fingerprint
flow: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      output: !str
  output: ${review.output}
other: |
  id: skills
  name: skills
  nodes:
    review:
      kind: agent
      prompt: Review the change.
      skills: [a, b]
      output: !str
  output: ${review.output}
expect:
  fingerprint: different
