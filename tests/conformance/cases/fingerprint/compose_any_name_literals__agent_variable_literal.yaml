# An AGENT variable's default literal is identity, even under a credential-like name.
kind: fingerprint
flow: |
  id: f
  name: f
  nodes:
    writer:
      kind: agent
      variables:
        password: !str hunter2
      prompt: hi
      output: str
  output: ${writer.output}
other: |
  id: f
  name: f
  nodes:
    writer:
      kind: agent
      variables:
        password: !str hunter3
      prompt: hi
      output: str
  output: ${writer.output}
expect:
  fingerprint: different
