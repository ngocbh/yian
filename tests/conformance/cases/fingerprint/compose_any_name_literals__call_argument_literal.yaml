# A literal argument of an inline `call(...)` is identity.
kind: fingerprint
flow: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !Optional(str) null
      nodes:
        run:
          kind: tool
          tool_id: run
          output: !str
      output: ${run.output}
  nodes:
    n:
      kind: tool
      tool_id: n
      input:
        x: call(g, password=hunter2)
      output: !str
  output: ${n.output}
other: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !Optional(str) null
      nodes:
        run:
          kind: tool
          tool_id: run
          output: !str
      output: ${run.output}
  nodes:
    n:
      kind: tool
      tool_id: n
      input:
        x: call(g, password=hunter3)
      output: !str
  output: ${n.output}
expect:
  fingerprint: different
