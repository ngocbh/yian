# A def input's default literal is identity, even under a credential-like name.
kind: fingerprint
flow: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !str hunter2
      nodes:
        run:
          kind: tool
          tool_id: run
          output: !str
      output: ${run.output}
  nodes:
    b:
      kind: call
      call: g
  output: ${b.output}
other: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !str hunter3
      nodes:
        run:
          kind: tool
          tool_id: run
          output: !str
      output: ${run.output}
  nodes:
    b:
      kind: call
      call: g
  output: ${b.output}
expect:
  fingerprint: different
