# A literal flow output is identity, even under a credential-like name.
kind: fingerprint
flow: |
  id: f
  name: f
  nodes:
    step:
      kind: tool
      tool_id: step
      output: str
  output:
    step: ${step.output}
    password: hunter2
other: |
  id: f
  name: f
  nodes:
    step:
      kind: tool
      tool_id: step
      output: str
  output:
    step: ${step.output}
    password: hunter3
expect:
  fingerprint: different
