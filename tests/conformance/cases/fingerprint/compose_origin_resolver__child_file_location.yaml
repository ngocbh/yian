# Identical child text in another file keeps the fingerprint: a child's file and origins are not identity.
kind: fingerprint
flow: |
  id: parent
  name: parent
  nodes:
    first:
      kind: call
      call: left
    second:
      kind: call
      call: right
  output: ${second.output}
  uses:
    left: child
    right: child
other: |
  id: parent
  name: parent
  nodes:
    first:
      kind: call
      call: left
    second:
      kind: call
      call: right
  output: ${second.output}
  uses:
    left: child
    right: twin
files:
  child.yaml: |
    id: child
    name: child
    nodes:
      worker:
        kind: tool
        tool_id: worker
        output: int
    output: ${worker.output}
  twin.yaml: |
    id: child
    name: child
    nodes:
      worker:
        kind: tool
        tool_id: worker
        output: int
    output: ${worker.output}
expect:
  fingerprint: same
