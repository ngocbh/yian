# A type tag on the flow output changes the fingerprint.
kind: fingerprint
flow: |
  id: sized
  name: sized
  typedefs:
    Size:
      qty: int
  nodes:
    size:
      kind: tool
      tool_id: size
  output: ${size.output}
other: |
  id: sized
  name: sized
  typedefs:
    Size:
      qty: int
  nodes:
    size:
      kind: tool
      tool_id: size
  output: !Size ${size.output}
expect:
  fingerprint: different
