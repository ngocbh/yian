# An AGENT's own llm_config is identity.
kind: fingerprint
flow: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      llm_config: {provider: openai}
      output: !str
  output: ${ask.output}
other: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      llm_config: {provider: anthropic}
      output: !str
  output: ${ask.output}
expect:
  fingerprint: different
