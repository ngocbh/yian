# An AGENT's retries are identity.
kind: fingerprint
flow: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      retries: 1
      output: str
  output: ${ask.output}
other: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      retries: 2
      output: str
  output: ${ask.output}
expect:
  fingerprint: different
