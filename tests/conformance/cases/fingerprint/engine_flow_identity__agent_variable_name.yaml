# An AGENT variable's name is identity.
kind: fingerprint
flow: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      variables:
        count: !int(1..12) 4
      output: str
  output: ${ask.output}
other: |
  id: agent
  name: agent
  nodes:
    ask:
      kind: agent
      prompt: p
      variables:
        sentences: !int(1..12) 4
      output: str
  output: ${ask.output}
expect:
  fingerprint: different
