# An ask's prompt is identity.
kind: fingerprint
flow: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      input:
        prompt: first
      output: str
  output: ${node.output}
other: |
  id: human
  name: human
  nodes:
    node:
      kind: tool
      tool_id: ask
      input:
        prompt: second
      output: str
  output: ${node.output}
expect:
  fingerprint: different
