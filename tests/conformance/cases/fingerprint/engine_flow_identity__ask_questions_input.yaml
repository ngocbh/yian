# The reference an ask reads its questions from is identity.
kind: fingerprint
flow: |
  id: human
  name: human
  nodes:
    first:
      kind: tool
      tool_id: src
      output: !list(object)
    second:
      kind: tool
      tool_id: src
      output: !list(object)
    node:
      kind: tool
      tool_id: ask
      input:
        questions: ${first.output}
  output: ${node.output}
other: |
  id: human
  name: human
  nodes:
    first:
      kind: tool
      tool_id: src
      output: !list(object)
    second:
      kind: tool
      tool_id: src
      output: !list(object)
    node:
      kind: tool
      tool_id: ask
      input:
        questions: ${second.output}
  output: ${node.output}
