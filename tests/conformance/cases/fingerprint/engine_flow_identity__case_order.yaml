# The order of CASE branches is identity.
kind: fingerprint
flow: |
  id: case
  name: case
  input:
    x: !bool
    y: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.x}
          then: first
        - when: ${input.y}
          then: second
      else: other
    first:
      kind: call
      call: first
      output: !str
    second:
      kind: call
      call: second
      output: !str
    other:
      kind: call
      call: other
      output: !str
  output: ${first.output | second.output | other.output}
other: |
  id: case
  name: case
  input:
    x: !bool
    y: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.y}
          then: second
        - when: ${input.x}
          then: first
      else: other
    first:
      kind: call
      call: first
      output: !str
    second:
      kind: call
      call: second
      output: !str
    other:
      kind: call
      call: other
      output: !str
  output: ${first.output | second.output | other.output}
expect:
  fingerprint: different
