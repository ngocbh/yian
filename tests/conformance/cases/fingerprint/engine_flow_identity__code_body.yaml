# A CODE body is identity.
kind: fingerprint
flow: |
  id: kind
  name: kind
  nodes:
    leaf:
      kind: code
      output: !str
      code: |
        return "ok"
  output: ${leaf.output}
other: |
  id: kind
  name: kind
  nodes:
    leaf:
      kind: code
      output: !str
      code: |
        return "no"
  output: ${leaf.output}
expect:
  fingerprint: different
