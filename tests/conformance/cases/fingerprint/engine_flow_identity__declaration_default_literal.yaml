# A flow input's default literal is identity.
kind: fingerprint
flow: |
  id: literal-default
  name: literal_default
  input:
    signature: !str 'q -> a'
  nodes:
    step:
      kind: call
      call: step
  output: ${step.output}
other: |
  id: literal-default
  name: literal_default
  input:
    signature: !str 'q -> s'
  nodes:
    step:
      kind: call
      call: step
  output: ${step.output}
expect:
  fingerprint: different
