# A flow assert is identity.
kind: fingerprint
flow: |
  id: asserted
  name: asserted
  input:
    x: !int
  asserts:
    - input.x > 0
  nodes:
    body:
      kind: tool
      tool_id: body
      output: !int
  output: ${body.output}
other: |
  id: asserted
  name: asserted
  input:
    x: !int
  asserts:
    - input.x > 1
  nodes:
    body:
      kind: tool
      tool_id: body
      output: !int
  output: ${body.output}
expect:
  fingerprint: different
