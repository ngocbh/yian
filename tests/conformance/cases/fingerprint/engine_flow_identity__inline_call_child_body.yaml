# A CODE body inside an inline CALL is identity.
kind: fingerprint
flow: |
  id: inline-identity
  name: inline_identity
  nodes:
    wrapper:
      kind: call
      nodes:
        step:
          kind: code
          output: str
          code: |
            return "ok"
      output: ${step.output}
  output: ${wrapper.output}
other: |
  id: inline-identity
  name: inline_identity
  nodes:
    wrapper:
      kind: call
      nodes:
        step:
          kind: code
          output: str
          code: |
            return "no"
      output: ${step.output}
  output: ${wrapper.output}
expect:
  fingerprint: different
