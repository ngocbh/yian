# A flow input's type is identity.
kind: fingerprint
flow: |
  id: stable
  name: stable
  input:
    x: !int
  nodes:
    step:
      kind: tool
      tool_id: step
      input:
        x: ${input.x}
      output: !int
  output: ${step.output}
other: |
  id: stable
  name: stable
  input:
    x: !float
  nodes:
    step:
      kind: tool
      tool_id: step
      input:
        x: ${input.x}
      output: !int
  output: ${step.output}
expect:
  fingerprint: different
