# The def a LOOP calls is identity, even when the defs are alike.
kind: fingerprint
flow: |
  id: loop
  name: loop
  defs:
    first:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: !int
      output: ${bump.output}
    second:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: !int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: first
      input:
        n: 0
      times: 2
  output: ${node.output}
other: |
  id: loop
  name: loop
  defs:
    first:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: !int
      output: ${bump.output}
    second:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: !int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: second
      input:
        n: 0
      times: 2
  output: ${node.output}
expect:
  fingerprint: different
