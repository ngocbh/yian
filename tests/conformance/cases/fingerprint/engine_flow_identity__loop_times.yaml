# A LOOP's `times:` is identity.
kind: fingerprint
flow: |
  id: loop
  name: loop
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: step
      input:
        n: 0
      times: 1
  output: ${node.output}
other: |
  id: loop
  name: loop
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: tool
          tool_id: bump
          input:
            n: ${input.n}
          output:
            n: int
      output: ${bump.output}
  nodes:
    node:
      kind: loop
      call: step
      input:
        n: 0
      times: 2
  output: ${node.output}
expect:
  fingerprint: different
