# A node env literal is identity.
kind: fingerprint
flow: |
  id: literal-env
  name: literal_env
  nodes:
    step:
      kind: call
      call: step
      env:
        token: "first-value"
  output: ${step.output}
other: |
  id: literal-env
  name: literal_env
  nodes:
    step:
      kind: call
      call: step
      env:
        token: "second-value"
  output: ${step.output}
expect:
  fingerprint: different
