# A node input's name is identity.
kind: fingerprint
flow: |
  id: params
  name: params
  input:
    x: !int
  nodes:
    body:
      kind: tool
      tool_id: body
      input:
        x: ${input.x}
  output: ${body.output}
other: |
  id: params
  name: params
  input:
    x: !int
  nodes:
    body:
      kind: tool
      tool_id: body
      input:
        renamed: ${input.x}
  output: ${body.output}
expect:
  fingerprint: different
