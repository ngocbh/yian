# A node's kind is identity: CODE and TOOL with the same output differ.
kind: fingerprint
flow: |
  id: kind
  name: kind
  nodes:
    leaf:
      kind: code
      output: !str
      code: |
        return "ok"
  output: ${leaf.output}
other: |
  id: kind
  name: kind
  nodes:
    leaf:
      kind: tool
      tool_id: leaf
      output: !str
  output: ${leaf.output}
expect:
  fingerprint: different
