# The order of flow output fields is identity.
kind: fingerprint
flow: |
  id: out
  name: out
  nodes:
    a:
      kind: tool
      tool_id: a
      output: !int
    b:
      kind: tool
      tool_id: b
      output: !int
  output:
    a: ${a.output}
    b: ${b.output}
other: |
  id: out
  name: out
  nodes:
    a:
      kind: tool
      tool_id: a
      output: !int
    b:
      kind: tool
      tool_id: b
      output: !int
  output:
    b: ${b.output}
    a: ${a.output}
expect:
  fingerprint: different
