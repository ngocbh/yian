# A flow output field's source is identity.
kind: fingerprint
flow: |
  id: out
  name: out
  nodes:
    a:
      kind: tool
      tool_id: a
      output: !int
    b:
      kind: tool
      tool_id: b
      output: !int
  output:
    value: ${a.output}
other: |
  id: out
  name: out
  nodes:
    a:
      kind: tool
      tool_id: a
      output: !int
    b:
      kind: tool
      tool_id: b
      output: !int
  output:
    value: ${b.output}
expect:
  fingerprint: different
