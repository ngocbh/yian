# A one-field record output fingerprints differently from the plain value output.
kind: fingerprint
flow: |
  id: pin
  name: pin
  nodes:
    step:
      kind: tool
      tool_id: step
      output: !str
  output:
    result: ${step.output}
other: |
  id: pin
  name: pin
  nodes:
    step:
      kind: tool
      tool_id: step
      output: !str
  output: ${step.output}
expect:
  fingerprint: different
