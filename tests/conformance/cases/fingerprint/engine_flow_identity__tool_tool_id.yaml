# A TOOL's tool_id is identity.
kind: fingerprint
flow: |
  id: tool
  name: tool
  nodes:
    node:
      kind: tool
      tool_id: first
  output: ${node.output}
other: |
  id: tool
  name: tool
  nodes:
    node:
      kind: tool
      tool_id: second
  output: ${node.output}
expect:
  fingerprint: different
