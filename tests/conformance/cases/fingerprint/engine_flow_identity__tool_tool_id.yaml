# A TOOL's `call:` is identity.
kind: fingerprint
flow: |
  id: tool
  name: tool
  nodes:
    node:
      kind: call
      call: first
  output: ${node.output}
other: |
  id: tool
  name: tool
  nodes:
    node:
      kind: call
      call: second
  output: ${node.output}
expect:
  fingerprint: different
