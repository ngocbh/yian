# The order of a record type's fields is identity.
kind: fingerprint
flow: |
  id: typed
  name: typed
  nodes:
    body:
      kind: call
      call: body
      output: {first: !int, second: !str}
  output: ${body.output}
other: |
  id: typed
  name: typed
  nodes:
    body:
      kind: call
      call: body
      output: {second: !str, first: !int}
  output: ${body.output}
expect:
  fingerprint: different
