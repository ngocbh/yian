# A record type's field names are identity.
kind: fingerprint
flow: |
  id: typed
  name: typed
  nodes:
    body:
      kind: call
      call: body
      output: {a: !int}
  output: ${body.output}
other: |
  id: typed
  name: typed
  nodes:
    body:
      kind: call
      call: body
      output: {b: !int}
  output: ${body.output}
expect:
  fingerprint: different
