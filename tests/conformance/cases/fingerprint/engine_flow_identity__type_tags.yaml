# A Literal type's tags are identity.
kind: fingerprint
flow: |
  id: typed
  name: typed
  nodes:
    body:
      kind: call
      call: body
      output: !Literal(first)
  output: ${body.output}
other: |
  id: typed
  name: typed
  nodes:
    body:
      kind: call
      call: body
      output: !Literal(second)
  output: ${body.output}
expect:
  fingerprint: different
