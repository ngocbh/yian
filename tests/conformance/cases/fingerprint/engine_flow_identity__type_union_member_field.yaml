# A field type inside a union member's typedef is identity.
kind: fingerprint
flow: |
  id: typed
  name: typed
  typedefs:
    Buy:
      action: Literal(buy)
      qty: int
    Sell:
      action: Literal(sell)
      price: float
  nodes:
    body:
      kind: tool
      tool_id: body
      output: !Union(Buy;Sell)
  output: ${body.output}
