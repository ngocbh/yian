# A value in the flow llm_config is identity as written.
kind: fingerprint
flow: |
  id: f
  name: f
  input: {m: !str , n: !str }
  llm_config: {provider: '${input.m}'}
  nodes:
    a:
      kind: agent
      prompt: Go.
  output: ${a.output}
other: |
  id: f
  name: f
  input: {m: !str , n: !str }
  llm_config: {provider: '${input.n}'}
  nodes:
    a:
      kind: agent
      prompt: Go.
  output: ${a.output}
expect:
  fingerprint: different
