# A value in an AGENT's llm_config is identity as written.
kind: fingerprint
flow: |
  id: f
  name: f
  input: {m: !str , n: !str }
  llm_config: {provider: anthropic, anthropic: {max_tokens: 900}}
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config: {model: '${input.m}'}
  output: ${a.output}
other: |
  id: f
  name: f
  input: {m: !str , n: !str }
  llm_config: {provider: anthropic, anthropic: {max_tokens: 900}}
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config: {model: '${input.n}'}
  output: ${a.output}
expect:
  fingerprint: different
