# A type tag on an llm_config value changes the fingerprint.
kind: fingerprint
flow: |
  id: f
  name: f
  input: {m: !str }
  llm_config: {provider: anthropic, anthropic: {max_tokens: 900}}
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config: {model: '${input.m}'}
  output: ${a.output}
other: |
  id: f
  name: f
  input: {m: !str }
  llm_config: {provider: anthropic, anthropic: {max_tokens: 900}}
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config: {model: !str '${input.m}'}
  output: ${a.output}
expect:
  fingerprint: different
