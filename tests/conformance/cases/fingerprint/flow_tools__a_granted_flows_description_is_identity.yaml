# The model reads a flow tool's description, so changing it changes the fingerprint.
kind: fingerprint
flow: |
  id: f
  name: f
  defs:
    shout:
      description: Shout the text back.
      input:
        text: !str
      nodes:
        loud: !str ${input.text}!
      output: ${loud.output}
  nodes:
    helper:
      kind: agent
      prompt: Help.
      output: !str
      tools: [shout]
  output: ${helper.output}
other: |
  id: f
  name: f
  defs:
    shout:
      description: Repeat the text loudly.
      input:
        text: !str
      nodes:
        loud: !str ${input.text}!
      output: ${loud.output}
  nodes:
    helper:
      kind: agent
      prompt: Help.
      output: !str
      tools: [shout]
  output: ${helper.output}
expect:
  fingerprint: different
