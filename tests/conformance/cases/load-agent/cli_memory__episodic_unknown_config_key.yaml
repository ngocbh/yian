# The message spells the key list as JSON text.
kind: load
flow: |
  id: cli-memory
  name: cli_memory
  long_term_memory: {episodic: {type: episodic, config: {bogus: 1}}}
  nodes:
    work:
      kind: code
      code: return 7
      output: int
  output: ${work.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'long_term_memory ''episodic'': episodic memory config has unknown key(s) ["bogus"] (allowed: max_episodes, recall_limit)'
      frames:
      - label: flow.yaml
        range: [3, 30, 3, 66]
