kind: load
flow: |
  id: cli-memory
  name: cli_memory
  nodes:
    work:
      kind: agent
      long_term_memory: {notes: {type: episodic, config: {storage: x.sqlite}}}
      prompt: hello
      output: str
  output: ${work.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'long_term_memory ''notes'': config key ''storage'' is not allowed: storage belongs to the host (build_memories storage=/root= or yian run --memory-root)'
      frames:
      - label: flow.yaml
        range: [6, 23, 6, 77]
