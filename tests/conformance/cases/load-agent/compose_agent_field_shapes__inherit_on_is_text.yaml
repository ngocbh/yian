# The message spells the rejected value in the text form.
kind: load
flow: |
  id: shapes
  name: shapes
  nodes:
    a:
      kind: agent
      prompt: Help the user.
      llm_config: {inherit: on}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'': llm_config `inherit:` must be true or false, got "on"; `on` is text; write `true`'
      frames:
      - label: flow.yaml
        range: [7, 27, 7, 29]
