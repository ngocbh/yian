kind: load
flow: |
  id: f
  name: f
  nodes:
    a:
      kind: agent
      prompt: Go.
      output: !Decision
  output: ${a.output}
  typedefs:
    Buy:
      action: Literal(buy)
      qty: int
    Hold:
      action: Literal(hold)
      note: str
    Decision: Union(Buy, Hold)
expect:
  load: ok
