kind: load
flow: |
  id: f
  name: f
  env:
    max_tool_iterations: 0
  nodes:
    a:
      kind: agent
      prompt: Go.
      output: str
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: flow `env.max_tool_iterations` must be a positive int or -1 (no cap), got 0
      frames:
      - label: flow.yaml
        range: [4, 24, 4, 25]
