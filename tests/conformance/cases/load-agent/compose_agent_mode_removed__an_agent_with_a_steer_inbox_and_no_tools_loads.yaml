# An agent with a steer inbox and no tools loads (yian #1025 replaced `steerable:`).
kind: load
flow: |
  id: removed
  name: removed
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox: ${input.notes}
      output: !str
  output: ${chat.output}
expect:
  load: ok
