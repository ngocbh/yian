kind: load
flow: |
  id: parent
  name: parent
  defs:
    child:
      nodes:
        inner:
          kind: agent
          mode: plain
          prompt: Say hi.
      output: ${inner.output}
  nodes:
    run_child:
      kind: call
      call: child
  output: ${run_child.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''child'': node ''inner'': `mode:` was removed: an AGENT with tools runs the tool loop, one without tools makes a single call; delete this line'
      frames:
      - label: flow.yaml
        range: [5, 5, 11, 1]
        note: definition 'child'
      - label: flow.yaml
        range: [8, 9, 8, 13]
