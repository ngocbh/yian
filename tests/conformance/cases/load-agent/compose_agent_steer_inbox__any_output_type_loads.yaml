# An agent with a steer inbox may declare any output; at an interrupt the output contract
# decides (Optional(...) takes null, anything else fails agent.interrupted) (yian #1025).
kind: load
flow: |
  id: steer
  name: steer
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox: ${input.notes}
      output: int
  output: ${chat.output}
expect:
  load: ok
