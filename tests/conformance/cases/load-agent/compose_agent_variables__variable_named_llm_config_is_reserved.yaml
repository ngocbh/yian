# A variable can't take the call-time `llm_config` values' reserved key, or any name starting
# with `__`; it would fail every run.
kind: load
flow: |
  id: f
  name: f
  nodes:
    pick:
      kind: agent
      prompt: Pick a model.
      output: !str
    chat:
      kind: agent
      prompt: Go.
      variables:
        __llm_config: !str hello
      llm_config: {model: '${pick.output}', provider: openai}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "variable '__llm_config' starts with '__', which yian keeps for the names it generates; rename it"
      frames:
      - label: flow.yaml
        range: [12, 7, 12, 19]
