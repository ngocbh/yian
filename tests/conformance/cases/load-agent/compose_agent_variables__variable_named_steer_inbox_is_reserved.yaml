# A variable can't take the steer inbox's reserved key, or any name starting with `__`; it would
# fail every run.
kind: load
flow: |
  id: steer
  name: steer
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      prompt: Help the user.
      steer_inbox: ${input.notes}
      variables:
        __steer_inbox: !str hello
      output: str
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "variable '__steer_inbox' starts with '__', which yian keeps for the names it generates; rename it"
      frames:
      - label: flow.yaml
        range: [11, 7, 11, 20]
