# No `message`: the case pins the code and the frame, not the schema error's text.
kind: load
flow: |
  id: f
  name: f
  llm_config:
    provider: anthropic
    anthropic: {max_tokns: 100}
  nodes:
    a: {kind: agent, prompt: hi}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [5, 14, 5, 30]
