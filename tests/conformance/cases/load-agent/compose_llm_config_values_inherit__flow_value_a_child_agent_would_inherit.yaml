kind: load
flow: |
  id: f
  name: f
  input: {m: !str }
  llm_config: {model: '${pick.output}'}
  defs:
    child:
      nodes:
        a:
          kind: agent
          prompt: Go.
      output: ${a.output}
  nodes:
    pick:
      kind: agent
      prompt: Pick a model.
      output: !str
      llm_config: {model: m0}
    c:
      kind: call
      call: child
      input: {}
      depends_on: [pick]
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow llm_config.model: agent ''c/a'' in a child flow would inherit this value, which is read only when the flow runs; pass it to the child as an input and write `${input.model}` in the child''s llm_config'
      frames:
      - label: flow.yaml
        range: [4, 21, 4, 37]
