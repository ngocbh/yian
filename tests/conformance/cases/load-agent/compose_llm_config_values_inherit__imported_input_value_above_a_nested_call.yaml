kind: load
flow: |
  id: parent
  name: parent
  uses:
    mylib: lib
  nodes:
    n:
      kind: call
      call: mylib
      input: {m: x}
  output: ${n.output}
files:
  lib.yaml: |
    id: lib
    name: lib
    input: {m: !str }
    llm_config: {model: '${input.m}'}
    defs:
      inner:
        nodes:
          a: {kind: agent, prompt: Go.}
        output: ${a.output}
    nodes:
      c: {kind: call, call: inner, input: {}}
    output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'llm_config.model of the flow imported through uses: ''mylib'' (called by node ''n''): agent ''n/c/a'' in a child flow would inherit this value, which is read only when the flow runs; pass it to the child as an input and write `${input.model}` in the child''s llm_config'
      frames:
      - label: lib.yaml
        range: [4, 21, 4, 33]
