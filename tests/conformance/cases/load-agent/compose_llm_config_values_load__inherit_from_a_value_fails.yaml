kind: load
flow: |
  id: f
  name: f
  input:
    m: !str
    p: !str
    t: !float
    u: !str
    i: !bool
    a: !object
    cfg: !object
  nodes:
    a:
      kind: agent
      prompt: Go.
      llm_config:
        model: m
        inherit: ${input.i}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'': llm_config `inherit:` must be written as true or false; it decides which layers apply before any value is known'
      frames:
      - label: flow.yaml
        range: [17, 16, 17, 26]
