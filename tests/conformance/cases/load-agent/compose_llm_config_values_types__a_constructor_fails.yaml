kind: load
flow: |
  id: f
  name: f
  typedefs:
    Fine: {model: str}
  input:
    fine: !Fine
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: '${Fine(input.fine).model}'}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''chat'' llm_config.model: Fine(...) is not supported in an llm_config value; compute the value in a CODE node and read its output'
      frames:
      - label: flow.yaml
        range: [11, 25, 11, 52]
