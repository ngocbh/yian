kind: load
flow: |
  id: f
  name: f
  input:
    i: !int
  llm_config: {model: '${input.i}'}
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: m0}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow llm_config.model: must be str, but the value is int'
      frames:
      - label: flow.yaml
        range: [5, 21, 5, 33]
