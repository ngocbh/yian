kind: load
flow: |
  id: f
  name: f
  nodes:
    pick:
      kind: agent
      prompt: Pick a model.
      output: !str
    chat:
      kind: agent
      input: {__llm_config: '${pick.output}'}
      prompt: Go.
      llm_config: {model: '${pick.output}', provider: openai}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'chat' input '__llm_config' starts with '__', which yian keeps for the names it generates; rename it"
      frames:
      - label: flow.yaml
        range: [10, 13, 10, 25]
