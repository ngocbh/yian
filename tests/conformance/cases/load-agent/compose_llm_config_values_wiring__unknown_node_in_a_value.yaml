kind: load
flow: |
  id: f
  name: f
  nodes:
    pick:
      kind: agent
      prompt: Pick a model.
      output: !str
    chat:
      kind: agent
      prompt: Go.
      llm_config: {model: '${nope.output}', provider: openai}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'chat' llm_config: reference ${nope.output} uses unknown namespace 'nope'
      frames:
      - label: flow.yaml
        range: [11, 25, 11, 41]
