kind: load
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: ${input.proj}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config: {api_key: x}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: node 'ask' adaptive_questions.llm_config.api_key is a host credential; pass it in the run's llm_config, not in a flow file
      frames:
      - label: flow.yaml
        range: [12, 29, 12, 30]
