# No `message`: the case pins the code and the frame, not the schema error's text.
kind: load
flow: |
  id: f
  name: f
  defs:
    sub:
      llm_config: {modle: gpt-5}
      nodes:
        a: {kind: agent, prompt: hi}
      output: ${a.output}
  nodes:
    s: {kind: call, call: sub}
  output: ${s.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [5, 25, 5, 30]
