kind: load
flow: |
  id: root
  name: root
  input:
    x: !str
  nodes:
    a: {kind: call, call: my.lib, input: {x: "${input.x}"}}
  output: {y: "${input.x}"}
  uses:
    my.lib: lib
files:
  lib.yaml: |
    id: lib
    name: lib
    long_term_memory: null
    input:
      x: !str
    nodes:
      a: {kind: code, code: ./fixtures/compose_codefns.ts:echo_x, input: {x: "${input.x}"}, output: str}
    output: {y: "${a.output}"}
expect:
  load: ok
