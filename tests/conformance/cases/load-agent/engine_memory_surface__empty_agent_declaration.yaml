kind: load
flow: |
  id: agents
  name: agents
  llm_config: {provider: openai, model: fake-model}
  nodes:
    ask:
      kind: agent
      long_term_memory: {}
      prompt: hi
      output: str
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'long_term_memory: {} declares no memory; remove the key or name one'
      frames:
      - label: flow.yaml
        range: [7, 23, 7, 25]
