# A def named like a built-in tool is refused at its key, before a node can grant it.
kind: load
flow: |
  id: f
  name: f
  defs:
    ask_user:
      description: Ask.
      nodes:
        a: !str hi
      output: ${a.output}
  nodes:
    helper:
      kind: agent
      prompt: Help.
      output: !str
      tools: [ask_user]
  output: ${helper.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''ask_user'': `ask_user` is a name yian reserves; rename the def'
      frames:
      - label: flow.yaml
        range: [4, 3, 4, 11]
