# A flow tool's inputs come from the model, which can't send an inbox.
kind: load
flow: |
  id: f
  name: f
  defs:
    classify:
      description: Sort a ticket.
      input:
        text: !str
        notes: !Inbox(str)
      nodes:
        heard:
          kind: tool
          tool_id: take
          input:
            from: ${input.notes}
            take: all
        pick: !str ${input.text}
      output: ${pick.output}
  nodes:
    helper:
      kind: agent
      prompt: Help.
      output: !str
      tools: [classify]
  output: ${helper.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''helper'': flow `classify` can''t be a tool: its input `notes` is an inbox, which a model can''t send'
      frames:
      - label: flow.yaml
        range: [23, 12, 23, 22]
