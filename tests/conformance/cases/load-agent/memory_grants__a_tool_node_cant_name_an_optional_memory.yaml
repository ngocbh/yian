# A tool call's memory must always be bound, so it can't be Optional.
kind: load
flow: |
  id: f
  name: f
  input:
    notes: !Optional(FileMemory)
  nodes:
    found:
      kind: call
      call: {notes: read}
      input:
        path: notes.md
  output: ${found.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'found': `call: {notes: read}` names `notes`, an Optional memory; a tool call needs one that is always bound"
        frames:
          - label: flow.yaml
            range:
              - 8
              - 11
              - 8
              - 24
