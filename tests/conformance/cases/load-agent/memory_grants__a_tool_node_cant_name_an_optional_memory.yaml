# A TOOL node's memory must always be bound, so it can't be Optional.
kind: load
flow: |
  id: f
  name: f
  input:
    notes: !Optional(FileMemory)
  nodes:
    found:
      kind: tool
      tool_id: {notes: read}
      input:
        path: notes.md
  output: ${found.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'found': `tool_id: {notes: read}` names `notes`, an Optional memory; a TOOL node needs one that is always bound"
        frames:
          - label: flow.yaml
            range:
              - 8
              - 14
              - 8
              - 27
