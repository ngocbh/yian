# A memory grant rides the reserved wiring `__memory_<input>`; no node input may start with `__`.
kind: load
flow: |
  id: f
  name: f
  input:
    lessons: !FileMemory
  nodes:
    a:
      kind: agent
      output: !str
      prompt: hi
      tools: [lessons]
      input:
        __memory_lessons: ${input.lessons}
  output: ${a.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'a' input '__memory_lessons' starts with '__', which yian keeps for the names it generates; rename it"
        frames:
          - label: flow.yaml
            range: [12, 7, 12, 23]
