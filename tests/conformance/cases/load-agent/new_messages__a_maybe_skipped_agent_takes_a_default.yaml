# An agent behind a CASE may be skipped; a reader that must still run gives its new_messages a
# default, as for `.output`.
kind: load
flow: |
  id: f
  name: f
  input:
    go: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: "${input.go}"
          then: reply
      else: other
    reply:
      kind: agent
      prompt: hi
      output: str
    other:
      kind: code
      code: return 1
      output: int
    reader:
      kind: code
      input:
        history: !list(Message) ${reply.new_messages :- []}
      output: int
      code: return inputs['history'].length
  output: ${reader.output}
expect:
  load: ok
