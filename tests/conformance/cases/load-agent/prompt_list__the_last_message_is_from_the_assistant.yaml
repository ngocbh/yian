# A list `prompt:` whose last item is an `assistant:` message is refused at it.
kind: load
flow: |
  id: chat
  name: chat
  typedefs:
    Msg:
      role: Literal(user, assistant)
      text: str
  input:
    history: !list(Msg)
    message: !str
  nodes:
    reply:
      kind: agent
      input:
        history: ${input.history}
        message: ${input.message}
      output: !str
      system_prompt: You are a helpful conversational assistant.
      prompt:
        - ${history}
        - assistant: Sure.
  output: ${reply.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'reply' (kind=agent): the last message of `prompt:` must be from the user"
      frames:
      - label: flow.yaml
        range: [20, 9, 21, 1]
