# The retired AGENT `controls:` field fails at its value, listing the allowed fields as authored
# (`input`, `output`).
kind: load
flow: |
  # e40 — the retired AGENT `controls:` field is rejected at its source range.
  # PARSE: the agent descriptor rejects the field. Fails at load; no inputs needed.
  #
  # Human access is now authored as the ordinary `tools: [ask_user]` grant. Keeping
  # this seed makes a stale `controls:` spelling loud and precisely located.
  id: err-agent-controls-no-range
  name: err_agent_controls_no_range
  input:
    topic: !str
  nodes:
    note:
      kind: agent
      controls: [ask_user, nope_control]    # L13 — THE ERROR (the whole field is retired)
      input:
        topic: ${input.topic}
      output: !str
      prompt: "Rate ${topic}."
  output: ${note.output}
expect:
