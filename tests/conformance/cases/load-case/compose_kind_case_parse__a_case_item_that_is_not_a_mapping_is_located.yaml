kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    gate:
      kind: case
      cases: [done]
    done:
      kind: code
      code: return 1
      output: !int
  output: ${done.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''gate'': `cases[0]` must be a {when:, then:} mapping (got "done")'
      frames:
      - label: flow.yaml
        range: [8, 13, 8, 17]
