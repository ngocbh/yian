kind: load
flow: |2

  id: f
  name: f
  nodes:
    cls:
      kind: code
      output: !Literal(a;b;c)
      code: |
        return "a"
    route:
      kind: case
      on: ${cls.output :- null}
      cases:
        - when: a
          then: na
        - when: b
          then: nb
    na:
      kind: code
      output: !str
      code: |
        return "A"
    nb:
      kind: code
      output: !str
      code: |
        return "B"
  output: ${na.output | nb.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' on ${cls.output :- null}: non-exhaustive — enum tag(s) ["c"] not covered by a case `when:` or an `else:`'
      frames:
      - label: flow.yaml
        range: [10, 3, 10, 8]
