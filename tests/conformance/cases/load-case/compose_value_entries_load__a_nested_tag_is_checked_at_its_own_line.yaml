kind: load
flow: |
  id: f
  name: f
  typedefs:
    Buy:
      action: Literal(buy)
      conviction: float
  input:
    t: !str
  nodes:
    s:
      kind: code
      output: !float
      code: |
        return 0.5
    x: !object
      d: !Buy {action: buy, conviction: x}
  output: ${x.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''x.d'': the value is not a valid Buy: "x" does not match declared type float (at `x.d.conviction`)'
      frames:
      - label: flow.yaml
        range: [16, 8, 16, 41]
