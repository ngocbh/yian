kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    exit_result: !object {exited: true, reply: ""}
    use:
      kind: code
      input:
        c: ${exit_result.output.zz}
      code: |
        return inputs['c']
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'use' input 'c' from: reference ${exit_result.output.zz} reads unknown field 'zz' on record
      frames:
      - label: flow.yaml
        range: [10, 10, 10, 34]
