kind: load
# The argument text is quoted as written, by reprText.
flow: |2

  id: bad
  name: bad
  input:
    score: !float

  defs:
    take:
      input:
        stance: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:took
          input:
            stance: ${input.stance}
          output: str
      output: ${x.output}

  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: call(take, 30)
      else: nope
    nope:
      kind: code
      code: ./fixtures/compose_codefns.ts:took
      input:
        stance: x
      output: str
  output: ${gate.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "case node 'gate' then: a branch target must be a node id or a single call: call(take, ...) passes a positional argument '30'; every argument after the flow id must be a keyword (name=value)"
      frames:
      - label: flow.yaml
        range: [25, 15, 25, 29]
