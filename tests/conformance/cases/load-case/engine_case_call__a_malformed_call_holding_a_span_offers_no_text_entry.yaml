kind: load
flow: |2

  id: bad
  name: bad
  input:
    score: !float

  defs:
    take:
      input:
        stance: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:took
          input:
            stance: ${input.stance}
          output: !str
      output: ${x.output}

  nodes:
    gate:
      kind: case
      cases:
        - when: "input.score >= 0.5"
          then: call(take, stance=${input.score}
      else: call(take, stance="c")
  output: ${gate.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''gate'' then: a branch target must be a node id or a single call: `call(` is never closed (check its parentheses and quotes)'
      frames:
      - label: flow.yaml
        range: [25, 15, 25, 47]
