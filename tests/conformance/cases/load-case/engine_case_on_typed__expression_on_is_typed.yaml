kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    route:
      kind: case
      on: ${input.n > 1}
      cases:
        - when: "x"
          then: one
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: !str
    other:
      kind: code
      code: |
        return "other"
      output: !str
  output: ${one.output | other.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `when: "x"` is text but `on: ${input.n > 1}` is `bool`'
      frames:
      - label: flow.yaml
        range: [10, 15, 10, 18]
