kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: 1
          then: v0
    v0: !str "one"
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' produces a value, so it must be exhaustive: add an `else:` (on: ${input.n} is int, not a Literal or bool)'
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 8]
