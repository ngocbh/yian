kind: load
flow: |
  id: f
  name: f
  input:
    n: !str
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: 1
          then: one
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: str
    other:
      kind: code
      code: |
        return "other"
      output: str
  output: ${one.output | other.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `when: 1` is an int but `on: ${input.n}` is `str`; quote it: `when: "1"`'
      frames:
      - label: flow.yaml
        range: [10, 15, 10, 16]
