kind: load
flow: |
  id: f
  name: f
  input:
    n: !int(1..12)
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: 1
          then: one
        - when: 13
          then: two
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: !str
    two:
      kind: code
      code: |
        return "two"
      output: !str
    other:
      kind: code
      code: |
        return "other"
      output: !str
  output: ${one.output | two.output | other.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `when: 13` is not a value of `on: ${input.n}` (`int(1..12)`): 13 is outside inclusive int bounds (1, 12)'
      frames:
      - label: flow.yaml
        range: [12, 15, 12, 17]
