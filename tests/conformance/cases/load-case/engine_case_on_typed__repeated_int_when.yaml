kind: load
flow: |
  id: f
  name: f
  input:
    n: !int
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: 1
          then: one
        - when: 1
          then: two
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: !str
    two:
      kind: code
      code: |
        return "two"
      output: !str
    other:
      kind: code
      code: |
        return "other"
      output: !str
  output: ${one.output | two.output | other.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `when: 1` duplicates `when: 1` (first at line 10), so it never matches; remove one'
      frames:
      - label: flow.yaml
        range: [12, 15, 12, 16]
