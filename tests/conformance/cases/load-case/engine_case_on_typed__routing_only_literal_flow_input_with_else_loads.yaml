kind: load
flow: |
  id: f
  name: f
  typedefs:
    N: Literal(a, b)
  input:
    n: !N
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: a
          then: one
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: str
    other:
      kind: code
      code: |
        return "other"
      output: str
  output: ${one.output | other.output}
expect:
  load: ok
