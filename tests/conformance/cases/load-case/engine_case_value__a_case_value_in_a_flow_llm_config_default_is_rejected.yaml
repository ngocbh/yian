kind: load
flow: |
  id: f
  name: f
  input:
    big: !bool
  llm_config:
    provider: openai
    model: !str '${gate.output :- "m"}'
  nodes:
    gate:
      kind: case
      cases:
        - when: input.big
          then: slow
      else: fast
    slow: {kind: code, output: !str, code: "return 'model-big'"}
    fast: {kind: code, output: !str, code: "return 'model-small'"}
    chat:
      kind: agent
      prompt: Go.
      llm_config:
        openai: {temperature: 0.5}
  output: ${chat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow llm_config.model: ${gate.output} — a case value can''t be read in a coalesce operand, a default, an expression, a condition, or an assert; read it as a whole binding or inside text'
      frames:
      - label: flow.yaml
        range: [7, 10, 7, 38]
