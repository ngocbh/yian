kind: load
flow: |
  id: f
  name: f
  input:
    x: !int
  defs:
    child:
      inputs:
        x: !int
      nodes:
        n:
          kind: code
          input:
            x: ${input.x}
          output: int
          code: return inputs["x"]
      output: ${n.output}
  nodes:
    c:
      kind: call
      call: child
      input:
        x: ${input.x}
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''child'': unknown key ''inputs'' — defs use `input:` (rename the key)'
      frames:
      - label: flow.yaml
        range: [7, 5, 7, 11]
