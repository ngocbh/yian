kind: load
flow: |2

  id: f
  name: f
  defs:
    step:
      input: {n: !int , exited: !bool }
      nodes:
        s:
          kind: code
          code: "return {n: inputs['n'] + 1, exited: inputs['n'] >= 2}"
          input:
            n: ${input.n}
          output:
            n: int
            exited: bool
      output: ${s.output}
  nodes:
    repeat:
      kind: loop
      call: step
      input:
        n: 0
        exited: false
      while: "upper(exited, 1) == 'A'"
      max: 5
  output: ${repeat.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''repeat'': `while:` is not a valid boolean expression: expression function ''upper'' takes (s): too many positional arguments'
      frames:
      - label: flow.yaml
        range: [24, 12, 24, 37]
