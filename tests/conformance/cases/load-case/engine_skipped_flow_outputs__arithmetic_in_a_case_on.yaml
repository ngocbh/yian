kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        qty: !int
      code: |
        return {"qty": 2}
    rejected:
      kind: code
      output: !str
      code: |
        return "no"
    route:
      kind: case
      on: ${order.output.qty + 1}
      cases:
        - when: 3
          then: three
      else: other
    three:
      kind: code
      output: !str
      code: |
        return "3"
    other:
      kind: code
      output: !str
      code: |
        return "?"
  output:
    v: ${three.output | other.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'route' on: ${order.output.qty} reads field 'qty' of order.output, which may be null (node 'order' may be skipped while 'route' runs); write (order.output?.qty :- <default>)"
        frames:
          - label: flow.yaml
            range: [25, 9, 25, 32]
