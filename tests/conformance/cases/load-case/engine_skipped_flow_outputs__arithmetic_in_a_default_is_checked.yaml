kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: a
      else: b
    a:
      kind: code
      output: int
      code: |
        return 1
    b:
      kind: code
      output: int
      code: |
        return 2
  output:
    v: ${a.output :- (b.output + 1)}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'output ''v'': ${a.output :- (b.output + 1)} does arithmetic on b.output, which is null when node ''b'' is skipped; give it a default with :-, e.g. (b.output :- <default>)'
      frames:
      - label: flow.yaml
        range: [23, 6, 23, 35]
