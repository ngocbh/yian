kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        qty: !int
      code: |
        return {"qty": 2}
    rejected:
      kind: code
      output: !str
      code: |
        return "no"
    use:
      kind: code
      output: !int
      input:
        q: ${order.output.qty * 2}
      code: |
        return inputs["q"]
  output:
    u: ${use.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'use' input 'q': ${order.output.qty} reads field 'qty' of order.output, which may be null (node 'order' may be skipped while 'use' runs); write (order.output?.qty :- <default>)"
        frames:
          - label: flow.yaml
            range: [27, 10, 27, 33]
