kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: a
      else: rejected
    a:
      kind: code
      output:
        n: !int
      code: |
        return {"n": 2}
    rejected:
      kind: code
      output: !str
      code: |
        return "no"
    gate2:
      kind: case
      cases:
        - when: "((a.output.n + 1) :- 0) > 1"
          then: hot
      else: cold
    hot:
      kind: code
      output: !str
      code: |
        return "hot"
    cold:
      kind: code
      output: !str
      code: |
        return "cold"
  output:
    v: ${hot.output | cold.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'gate2' cases[0].when: ${a.output.n} reads field 'n' of a.output, which may be null (node 'a' may be skipped while 'gate2' runs); write (a.output?.n :- <default>)"
        frames:
          - label: flow.yaml
            range: [26, 15, 26, 44]
