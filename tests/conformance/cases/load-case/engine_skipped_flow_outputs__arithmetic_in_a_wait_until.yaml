kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        items: !list(int)
        s: !str
      code: |
        return {"items": [1], "s": "2020"}
    rejected:
      kind: code
      output: !str
      code: |
        return "no"
    w:
      kind: tool
      tool_id: sleep
      input:
        until: ${order.output.s + '-01-01'}
  output:
    r: ${rejected.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'w' input 'until': ${order.output.s} reads field 's' of order.output, which may be null (node 'order' may be skipped while 'w' runs); write (order.output?.s :- <default>)"
        frames:
          - label: flow.yaml
            range: [28, 14, 28, 42]
