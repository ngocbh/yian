kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        qty: int
      code: |
        return {"qty": 2}
    rejected:
      kind: code
      output: str
      code: |
        return "no"
  output:
    q: ${(order.output.qty :- null) + 1}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "output 'q': ${order.output.qty} reads field 'qty' of order.output, which may be null (node 'order' may be skipped); write (order.output?.qty :- <default>)"
        frames:
          - label: flow.yaml
            range: [24, 6, 24, 39]
