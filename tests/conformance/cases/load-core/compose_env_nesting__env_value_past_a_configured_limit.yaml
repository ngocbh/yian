kind: load
flow: |
  id: f
  name: f
  env:
    K: [[[[[[1]]]]]]
  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: x
  output: ${use.output}
env:
  YIAN_MAX_VALUE_NESTING: '5'
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow env ''K'' at [0][0][0][0][0]: value nests deeper than 5 levels, the limit for a yian value (each record and list is a level)'
      frames:
      - label: flow.yaml
        range: [4, 6, 4, 19]
