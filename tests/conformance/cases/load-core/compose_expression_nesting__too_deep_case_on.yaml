kind: load
flow: |
  id: f
  name: f
  input:
    x: !int
    s: !str
  nodes:
    route:
      kind: case
      on: "${-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(-(1)))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))))}"
      cases:
        - when: 1
          then: yes
      else: no
    yes:
      kind: code
      output: !str
      code: |
        return 'yes'
    no:
      kind: code
      output: !str
      code: |
        return 'no'
  output: ${yes.output | no.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'route' on: from: expression nests deeper than 100 levels, the limit for a yian expression (each call, list, unary operator, comparison, and chain of operators is a level); split it into smaller bindings or steps
      frames:
      - label: flow.yaml
        range: [9, 9, 9, 318]
