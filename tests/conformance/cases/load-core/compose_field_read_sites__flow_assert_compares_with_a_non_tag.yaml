# The message spells the compared value as JSON text.
kind: load
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
    Rec3: {a: str, b: Optional(str)}
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)'}
    Order: Union(Buy, Sell)
    Short: {action: 'Literal(short)', qty: int}
    Hold: {action: 'Literal(hold)'}
    Trade: Union(Buy, Short, Hold)
    Sized: Union(Buy, Short)
    A: {x: int}
    B: {y: str}
    AB: Union(A, B)
  input:
    s: !str
    r: !Rec
    o: !Order
    ab: !AB
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: !Rec
      code: "return ({a: \"x\"})"
  output: ${step.output}
  asserts:
    - "input.o.action == 'hold'"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'assert "input.o.action == ''hold''": `input.o.action == "hold"` compares input.o.action with "hold", which is not one of its tags (buy, sell)'
      frames:
      - label: flow.yaml
        range: [30, 5, 30, 31]
