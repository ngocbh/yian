kind: load
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
    Rec3: {a: str, b: Optional(str)}
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)'}
    Order: Union(Buy, Sell)
    Short: {action: 'Literal(short)', qty: int}
    Hold: {action: 'Literal(hold)'}
    Trade: Union(Buy, Short, Hold)
    Sized: Union(Buy, Short)
    A: {x: int}
    B: {y: str}
    AB: Union(A, B)
  input:
    s: !str
    r: !Rec
    o: !Order
    ab: !AB
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Rec
      code: "return ({a: \"x\"})"
  output: ${step.output}
  asserts:
    - "isinstance(o, Rec)"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'assert ''isinstance(o, Rec)'': `isinstance(o, Rec)` can never be true: o is declared Order, and no Order value fits Rec'
      frames:
      - label: flow.yaml
        range: [30, 5, 30, 25]
