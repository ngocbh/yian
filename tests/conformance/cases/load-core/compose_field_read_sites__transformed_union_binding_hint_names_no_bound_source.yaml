kind: load
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
    Rec3: {a: str, b: Optional(str)}
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)'}
    Order: Union(Buy, Sell)
    Wrap: {o: Order}
  input:
    s: !str
    r: !Rec
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Rec
      code: "return ({a: \"x\"})"
    d:
      kind: code
      input:
        s: ${input.s}
      output: Order
      code: "return null"
    ag:
      kind: agent
      input:
        v: ${Wrap(o=d.output)}
      prompt: "${v.o.qty}"
  output: ${ag.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ag' prompt: reference ${v.o.qty} reads field 'qty', which only union members with action buy have; read it inside a case on ${v.o.action}
      frames:
      - label: flow.yaml
        range: [30, 13, 30, 25]
