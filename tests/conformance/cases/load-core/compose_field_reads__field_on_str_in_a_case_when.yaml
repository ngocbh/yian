kind: load
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: !str
      code: "return null"
    a:
      kind: code
      input:
        v: ${input.s}
      output: !str
      code: return 'x'
    route:
      kind: case
      cases:
        - when: ${step.output.order == 'x'}
          then: a
      else: a
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'route' cases[0].when from: reference ${step.output.order} reads field 'order' on type str, which has no fields
      frames:
      - label: flow.yaml
        range: [21, 15, 21, 42]
