# A type written as a YAML list (once a spelling of a record) is refused at the list.
kind: load
flow: |
  id: invalid-output-list-item
  name: invalid-output-list-item
  nodes:
    emit:
      kind: code
      code: 'return {"profile": 7}'
      output:
        - profile: int
        - malformed
  output: ${emit.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "`output:` declares a type, which can't be a YAML list: write a record as a mapping of tagged fields, as in `{a: !int, b: !str}`, and a list type as `!list(T)`"
      frames:
      - label: flow.yaml
        range: [8, 7, 10, 1]
