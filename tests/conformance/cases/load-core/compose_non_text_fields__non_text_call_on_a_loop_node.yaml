kind: load
flow: |
  id: f
  name: f
  input:
    xs: !list(int)
  defs:
    body:
      input:
        v: !int
      nodes:
        one:
          kind: code
          output: {v: int}
          code: "return {'v': 1}"
      output: ${one.output}
  nodes:
    a:
      kind: loop
      times: 2
      call: 1.5
      input: {v: 1}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'' (kind=loop): `call:` must be text, but YAML read it as a float; put it in quotes'
      frames:
      - label: flow.yaml
        range: [19, 11, 19, 14]
