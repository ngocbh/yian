kind: load
flow: |
  id: f
  name: f
  input:
    xs: !list(int)
  defs:
    body:
      input:
        v: !int
      nodes:
        one:
          kind: code
          output: {v: int}
          code: "return {'v': 1}"
      output: ${one.output}
  nodes:
    a:
      kind: map
      over: ${input.xs}
      call: {x: 1}
      input: {v: 1}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''a'' (kind=map): `call:` must be text, but YAML read it as a mapping; put it in quotes'
      frames:
      - label: flow.yaml
        range: [19, 11, 19, 17]
