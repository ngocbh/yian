kind: load
flow: |
  id: f
  name: f
  input:
    xs: !list(int)
  defs:
    body:
      input:
        v: !int
      nodes:
        one:
          kind: code
          output: {v: !int}
          code: "return {'v': 1}"
      output: ${one.output}
  nodes:
    a:
      kind: loop
      times: 2
      while: 5
      call: body
      input: {v: 1}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''a'': `while:` must be an expression string over the carried record, such as `while: not done` (got 5)'
      frames:
      - label: flow.yaml
        range: [19, 12, 19, 13]
