kind: load
flow: |
  id: f
  name: f
  input:
    topic: !str
  defs:
    enrich:
      input:
        topic: !str
      nodes:
        summarize:
          kind: agent
          input:
            topic: ${input.topic}
          output: str
          prompt: 5
      output: ${summarize.output}
  nodes:
    brief:
      kind: call
      call: enrich
      input:
        topic: ${input.topic}
  output: ${brief.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''enrich'': node ''summarize'' (kind=agent): `prompt:` must be text, but YAML read it as an integer; put it in quotes'
      frames:
      - label: flow.yaml
        range: [7, 5, 17, 1]
        note: definition 'enrich'
      - label: flow.yaml
        range: [15, 17, 15, 18]
