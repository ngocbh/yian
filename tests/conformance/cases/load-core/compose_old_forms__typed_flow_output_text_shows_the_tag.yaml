kind: load
flow: |
  id: old_bindings
  name: old_bindings
  typedefs:
    Buy: {action: Literal(buy)}
    Sell: {action: Literal(sell)}
  input:
    n: !int
  nodes:
    size:
      kind: code
      code: "return {'qty': inputs['n']}"
      input:
        n: ${input.n}
      output: {qty: int}
    use:
      kind: code
      code: return inputs['v']
      input:
        v: ${input.n}
      output: str
  output:
    r: int = ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'binding ''r'': write the type as a tag: `r: !int ${use.output}`. If you meant the text, quote it: `r: "int = ${use.output}"`'
      frames:
      - label: flow.yaml
        range: [22, 6, 22, 25]
