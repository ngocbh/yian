kind: load
flow: |
  id: old_variables
  name: old_variables
  nodes:
    ask:
      kind: agent
      prompt: Count to ${n}.
      variables:
        n: 4
      output: !str
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'variable ''n'': a variable is a tag with a default, e.g. `n: !int 4`'
      frames:
      - label: flow.yaml
        range: [8, 10, 8, 11]
