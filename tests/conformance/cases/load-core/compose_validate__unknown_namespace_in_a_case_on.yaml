kind: load
flow: |
  id: f
  name: f
  nodes:
    gate:
      kind: case
      on: ${nope.output}
      cases:
        - when: hi
          then: p
      else: p
    p:
      kind: code
      output: !int
      code: "return {'output': 1}"
  output: ${p.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'gate' on: from: reference ${nope.output} uses unknown namespace 'nope'
      frames:
      - label: flow.yaml
        range: [6, 9, 6, 23]
