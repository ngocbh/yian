kind: load
# p.text on Message parts (a union, not every member has text) loads after a tag check.
flow: |
  id: p
  name: p
  input:
    ms: !list(Message)
  nodes:
    use:
      kind: code
      input:
        checked: '${[p.text for m in input.ms for p in m.parts if p.type == "text"]}'
      code: "return inputs['checked']"
  output: ${use.output}
expect:
  load: ok
