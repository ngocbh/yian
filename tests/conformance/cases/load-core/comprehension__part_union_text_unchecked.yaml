kind: load
# p.text on Message parts with no tag check is a load error: not every member has text.
flow: |
  id: p
  name: p
  input:
    ms: !list(Message)
  nodes:
    use:
      kind: code
      input:
        unchecked: ${[p.text for m in input.ms for p in m.parts]}
      code: "return inputs['unchecked']"
  output: ${use.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'use' input 'unchecked': reference ${p.text} reads field 'text', which only union members with type reasoning, refusal, text have; check the member first with an `if p.type == \"reasoning\"` before the read in the comprehension"
        frames:
          - label: flow.yaml
            range: [9, 18, 9, 64]
