kind: load
# No node is named x: a comprehension variable is no reference, so it mints no edge.
flow: |
  id: p
  name: p
  input:
    xs: !list(int)
  nodes:
    use:
      kind: code
      input:
        out: ${[x for x in input.xs]}
      code: "return inputs['out']"
  output: ${use.output}
expect:
  load: ok
