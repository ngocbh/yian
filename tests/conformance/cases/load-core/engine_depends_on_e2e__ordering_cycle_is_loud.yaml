# The message spells the name list as JSON text.
kind: load
flow: |2

  id: dep-cycle
  name: dep_cycle
  input:
    topic: !str
  nodes:
    a:
      kind: code
      depends_on: [b]
      code: ./fixtures/compose_codefns.ts:pick_pro
      input:
        topic: ${input.topic}
      output: !str
    b:
      kind: code
      runs_after: [a]
      code: ./fixtures/compose_codefns.ts:pick_con
      input:
        topic: ${input.topic}
      output: !str
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'flow has a cycle involving ["a","b"]; flows must be acyclic'
      frames:
      - label: flow.yaml
        range: [7, 3, 7, 4]
      - label: flow.yaml
        range: [14, 3, 14, 4]
      notes: [a depends on b (ordering), b depends on a (ordering)]
