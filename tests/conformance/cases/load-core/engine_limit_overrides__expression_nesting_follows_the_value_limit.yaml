kind: load
flow: |
  id: f
  name: f
  input:
    s: !str
  nodes:
    use:
      kind: code
      input:
        topic: ${upper(upper(upper(upper(input.s))))}
      output: !str
      code: |
        return inputs['topic']
  output: ${use.output}
env:
  YIAN_MAX_VALUE_NESTING: '3'
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'use: expression nests deeper than 3 levels, the limit for a yian expression (each call, list, unary operator, comparison, and chain of operators is a level); split it into smaller bindings or steps'
      frames:
      - label: flow.yaml
        range: [9, 14, 9, 52]
