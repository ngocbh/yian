kind: load
flow: |2

  id: f
  name: f
  input:
    n: !int
  nodes:
    n:
      kind: code
      code: "return inputs['n']"
      input: {n: '${input.n}'}
      output: !int
      asserts:
        - output >= 0
  output: ${n.output}
  asserts:
    - ${input.n} > 0
