# The message spells the name list as JSON text.
kind: load
flow: |
  id: f
  name: f
  input:
    x: !str
  nodes:
    a: {kind: call, call: dup, input: {x: "${input.x}"}}
  output: {y: "${a.output}"}
  uses:
    dup: child
  defs:
    dup:
      input:
        x: !str
      nodes:
        c: {kind: code, code: ./fixtures/seeds.ts:one_line_summary, input: {x: "${x}"}}
      output: {y: "${c.output}"}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'name(s) ["dup"] declared in both defs: and uses: (a callable has one namespace)'
      frames:
      - label: flow.yaml
        range: [12, 5, 17, 1]
