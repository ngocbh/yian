# The message spells the name list as JSON text.
kind: load
flow: |
  id: f
  name: f
  input:
    x: !str
  nodes:
    a: {kind: call, call: a, input: {x: "${input.x}"}}
  output: {y: "${a.output}"}
  uses:
    a: child
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'uses: alias ["a"] collides with a node id'
