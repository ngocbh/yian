# No `message`: the case pins the code and the frame, not the YAML parser's text.
kind: load
flow: |
  id: p
  name: p
  input:
    x: !str
  nodes:
    a: {kind: call, call: ch, input: {x: "${input.x}"}}
  output: {y: "${a.output}"}
  uses:
    ch: child
files:
  child.yaml: 'id: ['
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [9, 7, 9, 12]
        note: uses alias 'ch'
      - label: child.yaml
        range: [1, 5, 1, 6]
