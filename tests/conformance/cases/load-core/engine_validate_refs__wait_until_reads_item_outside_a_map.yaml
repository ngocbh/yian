kind: load
flow: |
  id: wait_refs
  name: wait_refs
  input:
    deadline: !datetime
  nodes:
    clock:
      kind: code
      output: datetime
      code: |
        return "2026-01-01T00:00:00Z"
    settle:
      kind: tool
      tool_id: sleep
      input:
        until: ${item}
  output: ${settle.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'settle' input 'until' from: reference ${item} uses unknown namespace 'item'
      frames:
      - label: flow.yaml
        range: [15, 14, 15, 21]
