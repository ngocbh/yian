# An inbox is never read inside text.
kind: load
flow: |
  id: f
  name: f
  input:
    m: !Inbox(str)
  nodes:
    greet:
      kind: code
      input:
        text: "Hello, ${input.m}"
      code: return inputs.text
  output: null
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'greet' input 'text' from: ${input.m} is an inbox; it is read only whole, bound to a child's Inbox input (not inside text or an expression)
      frames:
      - label: flow.yaml
        range: [9, 13, 9, 32]
