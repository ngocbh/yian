# A named call passes the inbox to a child that takes from it.
kind: load
flow: |
  id: f
  name: f
  input:
    m: !Inbox(str)
  defs:
    listen:
      input:
        m: !Inbox(str)
      nodes:
        heard:
          kind: tool
          tool_id: take
          input:
            from: ${input.m}
            take: all
      output: ${heard.output.events}
  nodes:
    once:
      kind: call
      call: listen
      input:
        m: ${input.m}
  output: ${once.output}
expect:
  load: ok
