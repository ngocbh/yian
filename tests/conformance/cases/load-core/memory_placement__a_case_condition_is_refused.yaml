# A case condition can't read a memory.
kind: load
flow: |
  id: f
  name: f
  input:
    lessons: !FileMemory
  nodes:
    route:
      kind: case
      cases:
        - when: ${input.lessons == null}
          then: done
    done: !int 1
  output: null
expect:
  load:
    diagnostics:
      - code: compose.load
        message: |-
          flow has unresolved references:
            node 'route' cases[0].when from: ${input.lessons} is a memory; use it whole as an agent input, in prompt text, as a child's memory input of the same type, or name it in `tools:`/`tool_id:` (not inside text or an expression)
        frames:
          - label: flow.yaml
            range:
              - 9
              - 15
              - 9
              - 39
