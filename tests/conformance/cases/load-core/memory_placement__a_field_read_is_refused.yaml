# A memory has no fields.
kind: load
flow: |
  id: f
  name: f
  input:
    lessons: !FileMemory
  nodes:
    c:
      kind: code
      code: return 1
      input:
        t: ${input.lessons.text}
  output: null
expect:
  load:
    diagnostics:
      - code: compose.load
        message: |-
          flow has unresolved references:
            node 'c' input 't' from: ${input.lessons} is a memory; use it whole as an agent input, in prompt text, as a child's memory input of the same type, or name it in `tools:`/`tool_id:` (a memory has no fields)
        frames:
          - label: flow.yaml
            range:
              - 10
              - 10
              - 10
              - 31
