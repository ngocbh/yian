# A prompt renders a memory whole: it has no fields.
kind: load
flow: |
  id: f
  name: f
  input:
    lessons: !FileMemory
  nodes:
    a:
      kind: agent
      output: !str
      input:
        lessons: ${input.lessons}
      prompt: "Notes: ${lessons.text}"
  output: ${a.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: |-
          flow has unresolved references:
            node 'a' prompt: ${lessons} is a memory; use it whole as an agent input, in prompt text, as a child's memory input of the same type, or name it in `tools:`/`tool_id:` (a memory has no fields)
        frames:
          - label: flow.yaml
            range:
              - 11
              - 13
              - 11
              - 37
