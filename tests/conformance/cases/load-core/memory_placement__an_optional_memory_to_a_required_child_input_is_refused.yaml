# An Optional memory can't fill a child's memory input that isn't Optional.
kind: load
flow: |
  id: f
  name: f
  input:
    lessons: !Optional(FileMemory)
  defs:
    child:
      input:
        notes: !FileMemory
      nodes:
        g:
          kind: code
          output: str
          code: return "x"
      output: ${g.output}
  nodes:
    c:
      kind: call
      call: child
      input:
        notes: ${input.lessons}
  output: ${c.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "call node 'c': binding 'notes' — child expects `FileMemory`, got `Optional(FileMemory)`"
        frames:
          - label: flow.yaml
            range:
              - 20
              - 7
              - 21
              - 1
