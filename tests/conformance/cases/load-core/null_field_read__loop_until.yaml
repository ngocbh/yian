# A loop predicate reading a field of an Optional carried value is a load error: after a run that
# leaves it null, `until: draft.done` would never end.
kind: load
flow: |
  id: f
  name: f
  typedefs:
    Draft: {done: bool}
  input:
    start: !Optional(Draft)
  defs:
    step:
      input:
        draft: !Optional(Draft)
      nodes:
        get:
          kind: code
          input:
            d: ${input.draft}
          output: !Optional(Draft)
          code: |
            return {"done": 1 == 1}
      output:
        draft: ${get.output}
  nodes:
    loop:
      kind: loop
      until: draft.done
      max: 3
      input:
        draft: ${input.start}
      call: step
  output: ${loop.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: loop node 'loop' `until:` ${draft.done} reads field 'done' of draft, which may be null (it is Optional); write draft?.done, or check draft != null first
        frames:
          - label: flow.yaml
            range: [24, 12, 24, 22]
