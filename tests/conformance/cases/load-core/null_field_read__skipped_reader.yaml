# A node that runs while its producer may be skipped reads the producer's fields through ?.
kind: load
flow: |
  id: f
  name: f
  input:
    approve: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: ${input.approve}
          then: order
      else: rejected
    order:
      kind: code
      output:
        qty: int
      code: |
        return {"qty": 2}
    rejected:
      kind: code
      output: str
      code: |
        return "no"
    use:
      kind: code
      input:
        v: '${order.output.qty} items'
      output: str
      code: |
        return "x"
  output: ${use.output}
expect:
  load:
    diagnostics:
      - code: expr.nullable_field_read
        message: "node 'use' input 'v': ${order.output.qty} reads field 'qty' of order.output, which may be null (node 'order' may be skipped while 'use' runs); write order.output?.qty, or check order.output != null first"
        frames:
          - label: flow.yaml
            range: [26, 10, 26, 37]
