# An unknown node kind fails at the `kind:` value, listing the kinds.
kind: load
flow: |
  # e10 — unknown node kind. COMPILE: "unknown kind 'llm'".
  id: err-unknown-kind
  name: err_unknown_kind
  input:
    topic: !str
  nodes:
    note:
      kind: llm          # ERROR: not a supported node kind
      input:
        topic: ${input.topic}
      output: str
      prompt: "Rate ${topic}."
  output: ${note.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'note': unknown kind 'llm' (allowed: agent, call, case, code, loop, map, tool)"
        frames: [{label: flow.yaml, range: [8, 11, 8, 14]}]
