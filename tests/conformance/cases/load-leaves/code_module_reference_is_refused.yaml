# A `code:` value in the `module:function` shape is not a reference to a TS file; read as TS it
# would be a labeled statement, so the load step refuses it with a hint.
kind: load
flow: |
  id: module-reference
  name: module_reference
  nodes:
    helper:
      kind: code
      output: !str
      code: pkg.mod:helper
  output: ${helper.output}
expect:
  load:
    diagnostics:
      - code: compose.load
        message: "node 'helper': `code:` value 'pkg.mod:helper' looks like a Python `module:function` reference; use `./file.ts:fn`"
        # The `code:` value `pkg.mod:helper` on line 7.
        frames: [{label: flow.yaml, range: [7, 11, 7, 25]}]
