# `return (` is a syntax error; a non-literal `code:` scalar puts the frame on the whole scalar
# (seed_e30 frames a block line).
kind: load
# `output: !str`, a valid type: CODE is checked after assembly, so an invalid output type would be
# reported before the syntax error.
flow: |
  id: syntax-fallback
  name: syntax-fallback
  nodes:
    broken:
      kind: code
      output: !str
      code: "return (\n"
  output: ${broken.output}
expect:
  load:
    diagnostics:
    # No `message`: it is the language runtime's syntax-error text, which yian doesn't write.
    - code: compose.load
      # The whole quoted `code:` scalar on line 7.
      frames:
      - label: flow.yaml
        range: [7, 11, 7, 23]
