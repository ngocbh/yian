kind: load
flow: |
  id: f
  name: f
  nodes:
    a:
      kind: call
      nodes:
        pause:
          kind: tool
          tool_id: sleep
          input:
            until: 5
        worker:
          kind: code
          depends_on: [pause]
          output: int
          code: |
            return 1
      output: ${worker.output}
  output: ${a.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'pause' (tool_id: sleep) input 'until': must be a date or datetime, got 5; write one such as `until: 2026-05-21`, or a reference such as `until: ${input.as_of}`"
      frames:
      - label: flow.yaml
        range: [11, 18, 11, 19]
