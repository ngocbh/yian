# The message spells the list of headers as JSON text.
kind: load
flow: |2

  id: f
  name: f
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        questions:
          - {question: "dup", header: "H"}
          - {question: "dup2", header: "H"}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''ask'' (tool_id: ask) input ''questions'': question headers must be unique, got ["H","H"]'
      frames:
      - label: flow.yaml
        range: [10, 9, 12, 1]
