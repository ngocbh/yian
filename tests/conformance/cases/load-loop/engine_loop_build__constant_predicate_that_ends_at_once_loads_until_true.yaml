# A constant condition that ends the loop at once needs no `max:`.
kind: load
flow: |
  id: f
  name: f
  defs:
    body:
      input:
        xs: !list(int)
      nodes: {}
      output:
        xs: ${input.xs + [1]}
  nodes:
    l:
      kind: loop
      call: body
      input:
        xs: []
      until: "true"
  output: ${l.output}
expect:
  load: ok
