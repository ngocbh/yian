kind: load
flow: |2

  id: loop-union
  name: loop_union
  typedefs:
    Done: {answer: str}
    More: {hint: str}
    Step: Union(Done, More)
  nodes:
    ask:
      kind: loop
      until: isinstance(r, Done) and r.answr == 'ok'
      input:
        n: 0
        r: !object {"hint":"start"}
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: !int
            r: !object
          code: |
            const n = inputs["n"] + 1
            return {"n": n, "r": n >= 3 ? {"answer": "ok"} : {"hint": "again"}}
      output: ${step.output}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''ask'': `until:` reference ${r.answr} reads field ''answr'', which Done doesn''t have; r is Done here, by the checks before this read; did you mean ''answer''?'
      frames:
      - label: flow.yaml
        range: [9, 3, 9, 6]
