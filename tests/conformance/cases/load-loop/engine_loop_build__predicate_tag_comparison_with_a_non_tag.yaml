# The message spells the compared and suggested values as JSON text .
kind: load
flow: |2

  id: loop-union
  name: loop_union
  typedefs:
    Done: {kind: 'Literal(done)', answer: str}
    More: {kind: 'Literal(more)', hint: str}
    Step: Union(Done, More)
  nodes:
    ask:
      kind: loop
      until: r.kind == 'dnoe'
      input:
        n: 0
        r: !Step {"kind":"more","hint":"start"}
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
            r: Step
          code: |
            const n = inputs["n"] + 1
            return {"n": n, "r": n >= 3 ? {"kind": "done", "answer": "ok"} : {"kind": "more", "hint": "again"}}
      output: ${step.output}
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''ask'': `until:` `r.kind == "dnoe"` compares r.kind with "dnoe", which is not one of its tags (done, more); did you mean "done"?'
      frames:
      - label: flow.yaml
        range: [9, 3, 9, 6]
