kind: load
flow: |
  id: p
  name: p
  defs:
    body:
      input:
        n: !int
        k: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
            k: ${input.k}
          output:
            k: !int
          code: 'return {k: inputs["k"] + 1}'
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      times: 1
      input:
        n: "1"
        k: 0
        extra: "abc"
      call: body
  output: ${loop.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''loop'': binding ''n'' — child expects ''int'', but the value "1" does not fit; text is not converted between flows, so write 1 without quotes'
      frames:
      - label: flow.yaml
        range: [23, 7, 26, 5]
