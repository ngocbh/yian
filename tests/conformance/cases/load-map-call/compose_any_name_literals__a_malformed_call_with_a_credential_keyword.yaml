kind: load
flow: |
  id: f
  name: f
  defs:
    g:
      input:
        password: !Optional(str) null
      nodes:
        run:
          kind: code
          output: !str
          code: |
            return 'x'
      output: ${run.output}
  nodes:
    n:
      kind: code
      input:
        x: call(g, password=a b=1)
      output: !str
      code: |
        return 'x'
  output: ${n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'n: call(g, ...) keyword ''password'' value ''a b=1'' looks like two keywords; add the missing comma, or quote the value. If you meant the text, quote the whole value: `"call(g, password=a b=1)"`'
      frames:
      - label: flow.yaml
        range: [18, 10, 18, 33]
