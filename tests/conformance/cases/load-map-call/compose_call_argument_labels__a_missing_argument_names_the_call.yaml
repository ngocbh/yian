kind: load
flow: |2

  id: f
  name: f
  input:
    s: !str

  defs:
    child:
      input:
        y: !int
      nodes:
        x:
          kind: code
          code: "return inputs['y']"
          input:
            y: ${input.y}
          output: !int
      output: ${x.output}

  nodes:
    n:
      kind: code
      code: "return inputs['a']"
      input:
        a: call(child)
      output: !int
  output: ${n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''n'' input ''a'' call(child): required callable input ''y'' is unbound'
      frames:
      - label: flow.yaml
        range: [25, 10, 25, 21]
