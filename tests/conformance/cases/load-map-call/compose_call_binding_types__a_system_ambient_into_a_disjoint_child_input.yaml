kind: load
flow: |
  id: p
  name: p
  defs:
    child:
      input:
        n: !int
      nodes:
        echo:
          kind: code
          input:
            n: ${input.n}
          output: !int
          code: return inputs.n
      output: ${echo.output}
  nodes:
    c:
      kind: call
      call: child
      input:
        n: ${system.run_id}
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "call node 'c': binding 'n' — child expects 'int', source is 'str'"
      frames:
      - label: flow.yaml
        range: [20, 7, 21, 1]
