kind: load
flow: |
  id: p
  name: p
  input:
    m: !Optional(str)
    n: !Optional(int)
    s: !str
    xs: !list(int)
    ds: !list(str)
    rs: !list(R)
    os: !list(Optional(str))
    d: !Optional(date)
  typedefs:
    R:
      a: int
    AB: Literal(a, b)
  defs:
    child:
      input:
        t: !int
      nodes:
        n:
          kind: code
          input:
            t: ${input.t}
          output: str
          code: "return String(inputs[\"t\"])"
      output: ${n.output}
  nodes:
    c:
      kind: map
      over: ["1", "2"]
      call: child
      input:
        t: ${item}
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'map node ''c'': binding ''t'' — child expects ''int'', but the element "1" does not fit; text is not converted between flows, so write 1 without quotes'
      frames:
      - label: flow.yaml
        range: [34, 7, 35, 1]
