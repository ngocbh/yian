kind: load
flow: |
  id: chain
  name: chain
  input:
    x: !str
  defs:
    c0:
      input:
        x: !str
      nodes:
        step:
          kind: call
          call: c1
          input:
            x: ${input.x}
      output: ${step.output}
    c1:
      input:
        x: !str
      nodes:
        step:
          kind: call
          call: c2
          input:
            x: ${input.x}
      output: ${step.output}
    c2:
      input:
        x: !str
      nodes:
        step:
          kind: call
          call: c3
          input:
            x: ${input.x}
      output: ${step.output}
    c3:
      input:
        x: !str
      nodes:
        step:
          kind: code
          code: return inputs["x"]
          input:
            x: ${input.x}
          output: str
      output: ${step.output}
  nodes:
    top:
      kind: call
      call: c0
      input:
        x: ${input.x}
  output: ${top.output}
env:
  YIAN_MAX_CALL_NESTING: '2'
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'defs entry ''c0'': defs entry ''c1'': defs entry ''c2'': call node ''step'': calling callable ''c3'' nests calls more than 2 levels deep, past the call nesting limit of 2 (each call, map, or loop body is a level); flatten the chain'
      frames:
      - label: flow.yaml
        range: [7, 5, 16, 3]
        note: definition 'c0'
      - label: flow.yaml
        range: [17, 5, 26, 3]
        note: definition 'c1'
      - label: flow.yaml
        range: [27, 5, 36, 3]
        note: definition 'c2'
      - label: flow.yaml
        range: [32, 15, 32, 17]
