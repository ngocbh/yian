kind: load
flow: |2

  id: d
  name: d
  input:
    v: !int

  defs:
    checked:
      input:
        n: !int
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:double
          input:
            n: ${input.n}
          output: !int
      output: ${x.output}
      asserts:
        - "input.n >= 0"
        - "x.output < 100"

  nodes:
    call_it:
      kind: call
      call: checked
      input:
        n: ${input.v}
  output: ${call_it.output}
expect:
  load: ok
