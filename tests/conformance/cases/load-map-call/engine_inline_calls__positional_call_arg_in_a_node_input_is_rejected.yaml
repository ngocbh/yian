kind: load
flow: |2

  id: ic_pos
  name: ic_pos
  input:
    topic: !str

  defs:
    enrich:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}

  nodes:
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(enrich, 30)
      output: str
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'use: call(enrich, ...) passes a positional argument ''30''; every argument after the flow id must be a keyword (name=value). If you meant the text, quote the whole value: `"call(enrich, 30)"`'
      frames:
      - label: flow.yaml
        range: [25, 14, 25, 30]
