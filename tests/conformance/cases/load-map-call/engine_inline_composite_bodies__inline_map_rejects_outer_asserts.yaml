kind: load
flow: |
  id: inline-map-asserts
  name: inline_map_asserts
  input:
    items: !list(str)
  nodes:
    each:
      kind: map
      over: ${input.items}
      input:
        value: ${item}
      asserts:
        - output != null
      nodes:
        echo:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo_x
          input:
            x: ${input.value}
          output: str
      output: ${echo.output}
  output: ${each.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has invalid node asserts:
          node 'each': `asserts:` is not allowed on a mapped call (`kind: map`) — assert inside the def, or on a downstream node
      frames:
      - label: flow.yaml
        range: [12, 7, 13, 5]
