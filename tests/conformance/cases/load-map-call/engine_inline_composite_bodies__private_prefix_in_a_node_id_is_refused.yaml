# A node id starting with `__` is refused, as yian generates such names (here inline flows).
kind: load
flow: |
  id: prefix-node
  name: prefix_node
  input:
    x: !str
  nodes:
    __inline_flow_host:
      kind: code
      code: ./fixtures/seeds.ts:one_line_summary
      input:
        x: ${input.x}
  output: ${__inline_flow_host.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node id '__inline_flow_host' starts with '__', which yian keeps for the names it generates; rename it"
      frames:
      - label: flow.yaml
        range: [7, 5, 11, 1]
