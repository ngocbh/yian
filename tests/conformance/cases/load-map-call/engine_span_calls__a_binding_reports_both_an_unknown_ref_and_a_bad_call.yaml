kind: load
flow: |2

  id: f
  name: f
  input: {v: !str }
  nodes:
    x: {kind: code, code: "return inputs['n']", input: {n: '${upper(input.nosuch, 1)}'}, output: str}
  output: ${x.output}
expect:
