      message: |-
        flow has unresolved references:
          node 'x' input 'n' from: reference ${input.nosuch} points to unknown flow input 'nosuch'
          node 'x' input 'n' from: expression function 'upper' takes (s): too many positional arguments
      frames:
      - label: flow.yaml
        range: [6, 58, 6, 85]
