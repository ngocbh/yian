# The removed `kind: tool` naming a library's def shows the `call:` that runs the def.
kind: load
flow: |
  id: orders
  name: orders
  uses:
    billing: lib/billing
  nodes:
    price:
      kind: tool
      tool_id: {billing: quote}
      input:
        qty: 2
  output: ${price.output}
files:
  lib/billing.yaml: |
    id: billing
    name: billing
    defs:
      quote:
        input:
          qty: !int
        kind: code
        code: return inputs.qty * 3
        output: !int
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "node 'price': kind 'tool' was removed; write `kind: call` with `call: {billing: quote}`"
      frames:
      - label: flow.yaml
        range: [7, 11, 7, 15]
