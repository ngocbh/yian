kind: load
flow: |
  id: p
  name: p
  typedefs:
    R: {k: int}
  input:
    n: !int
    r: !R
  nodes:
    c:
      kind: code
      input:
        x: ${upper(input.n)}
        y: ${input.r[0]}
      code: |
        return inputs["x"]
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has expressions that can never succeed:
          node 'c' input 'x' from: upper() takes str, got int
          node 'c' input 'y' from: indexing takes a list or text, got {"k":int}; read a record's field with a dot, as in `r.name`
      frames:
      - label: flow.yaml
        range: [12, 10, 12, 27]
