kind: load
flow: |
  id: a
  name: a
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    ask:
      kind: agent
      input:
        order: ${input.order}
      prompt: "Is it a buy? ${Buy(order)}"
      output: !str
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' prompt: unknown prompt function 'Buy'; prompts call only formatting builtins (join, lower, lstrip, render_as_json, replace, rstrip, str, strip, upper); build or check a typed value with a `typedefs:` constructor `T(...)` in an input binding
      frames:
      - label: flow.yaml
        range: [15, 13, 15, 41]
