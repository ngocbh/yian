kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: !object
      code: |
        return inputs["order"]
    c:
      kind: code
      input:
        x: !Sell ${Buy(d.output)}
      code: |
        return inputs["x"]
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''c'' input ''x'': declared Sell, but the value is {"action":Literal(buy),"conviction":float}'
      frames:
      - label: flow.yaml
        range: [21, 10, 21, 32]
