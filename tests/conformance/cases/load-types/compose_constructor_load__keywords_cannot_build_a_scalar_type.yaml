kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: !object
      code: |
        return inputs["order"]
    c:
      kind: code
      input:
        x: ${Size(name="m")}
      code: |
        return inputs["x"]
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has constructor calls that can never succeed:
          node 'c' input 'x' from: Size is not a record, so Size(...) takes one value to check, as in Size(x)
      frames:
      - label: flow.yaml
        range: [21, 10, 21, 27]
