kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
    Order: Union(Buy, Sell)
    Running: Literal(running)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: Order
      code: |
        return inputs["order"]
    c:
      kind: call
      input:
        is_buy: ${isinstance(d.output, Buy)}
      nodes:
        e:
          kind: code
          input:
            is_buy: ${input.is_buy}
          code: |
            return inputs["is_buy"]
      output: ${e.output}
  output: ${c.output}
expect:
  load: ok
