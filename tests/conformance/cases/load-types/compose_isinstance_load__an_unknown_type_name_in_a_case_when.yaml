kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
    Order: Union(Buy, Sell)
    Running: Literal(running)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: !Order
      code: |
        return inputs["order"]
    route:
      kind: case
      cases:
        - when: isinstance(d.output, Buy)
          then: b
        - when: isinstance(d.output, Ordr)
          then: o
      else: n
    b:
      kind: code
      code: |
        return "buy"
    o:
      kind: code
      code: |
        return "order"
    n:
      kind: code
      code: |
        return "none"
  output: ${b.output | o.output | n.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'' cases[1].when: unknown type ''Ordr''; isinstance takes a typedefs: name or one of str, int, float, bool, date, datetime, object, list, Message'
      frames:
      - label: flow.yaml
        range: [23, 15, 23, 41]
