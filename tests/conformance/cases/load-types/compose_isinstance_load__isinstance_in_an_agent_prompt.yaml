kind: load
flow: |
  id: a
  name: a
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
    Order: Union(Buy, Sell)
    Running: Literal(running)
  input:
    order: !object
  nodes:
    ask:
      kind: agent
      input:
        order: ${input.order}
      prompt: "Is it a buy? ${isinstance(order, Buy)}"
      output: str
  output: ${ask.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'ask' prompt: isinstance is not a prompt function; compute it in an input binding
      frames:
      - label: flow.yaml
        range: [15, 13, 15, 53]
