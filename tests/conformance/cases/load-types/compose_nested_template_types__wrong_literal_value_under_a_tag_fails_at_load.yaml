kind: load
flow: |
  typedefs:
    Rec:
      a: str
      n: int
    Buy:
      conviction: float
    Obj:
      n: int
    Trade:
      action: Literal(buy)
      conviction: float
  id: nested_types
  name: nested_types
  nodes:
    p:
      kind: code
      output: float
      code: |
        return "hi"
    c:
      kind: code
      input:
        x: !Trade {action: sell, conviction: '${p.output}'}
      code: |
        return inputs["x"]
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''c'' input ''x'': declared Trade, but the value is {"action":"sell","conviction":float}'
      frames:
      - label: flow.yaml
        range: [23, 10, 23, 58]
