kind: load
flow: |
  id: f
  name: f
  input:
    score: !str
  nodes:
    route:
      kind: case
      on: ${input.score}
      cases:
        - when: high
          then: !str hot
      else: cold
    hot:
      kind: code
      code: 'return "hot"'
      output: !str
    cold:
      kind: code
      code: 'return "cold"'
      output: !str
  output: ${hot.output | cold.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "case node 'route' then: a branch names a node or calls a flow; put the value in an entry in `nodes:` and name that entry"
      frames:
      - label: flow.yaml
        range: [11, 15, 11, 23]
