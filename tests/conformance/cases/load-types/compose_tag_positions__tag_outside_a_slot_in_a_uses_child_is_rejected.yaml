kind: load
flow: |
  id: parent
  name: parent
  uses:
    child: child
  nodes:
    n:
      kind: call
      call: child
      input:
        x: 1
  output: ${n.output}
files:
  child.yaml: |
    id: child
    name: child
    input:
      x: !int
    nodes:
      echo:
        kind: !str code
        code: ./fixtures/compose_codefns.ts:echo
        input:
          value: !int ${input.x}
        output: int
    output: ${echo.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: a tag types a value — a flow input, a binding, a node or flow output, an agent variable, an `llm_config` value, a value entry in `nodes:`, or a value inside one; `kind:` is not one
      frames:
      - label: flow.yaml
        range: [4, 10, 4, 15]
        note: uses alias 'child'
      - label: child.yaml
        range: [7, 11, 7, 20]
