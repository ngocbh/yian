kind: load
flow: |
  id: f
  name: f
  nodes:
    each:
      kind: map
      over: [1, 2]
      input:
        x: ${item}
      nodes:
        echo:
          kind: !str code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            value: !int ${input.x}
          output: int
      output: !int ${echo.output}
  output: ${each.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: a tag types a value — a flow input, a binding, a node or flow output, an agent variable, an `llm_config` value, a value entry in `nodes:`, or a value inside one; `kind:` is not one
      frames:
      - label: flow.yaml
        range: [11, 15, 11, 24]
