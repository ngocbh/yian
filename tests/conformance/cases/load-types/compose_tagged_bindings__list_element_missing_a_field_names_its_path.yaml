kind: load
flow: |2

  id: nested_buy
  name: nested_buy
  typedefs:
    Buy:
      action: Literal(buy)
      conviction: float
    Order:
      decision: Buy
      qty: int
  nodes:
    score:
      kind: code
      output: !float
      code: |
        return 0.5
    c:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${score.output}
        p: !list(Buy)
          - conviction: ${score.output}
  output: ${c.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''c'' input ''p'': declared list(Buy), but the value is [{"conviction":float}] (missing required `action` at `p[0]`)'
      frames:
      - label: flow.yaml
        range: [22, 10, 24, 1]
