# The message writes the missing-field list in the text form.
# The typedef isn't named `Message`, which is a built-in type.
kind: load
flow: |
  id: tagged_inputs
  name: tagged_inputs
  typedefs:
    Cfg: {kind: Literal(cfg), a: int}
    ChatMsg: {role: str, content: str}
  input:
    qty: !int
    cfg: !Cfg {a: 1}
  kind: code
  output: !object
  code: "return {...inputs}"
expect:
  load:
    diagnostics:
    - code: compose.load
      message: '''cfg'': the value is not a valid Cfg: record missing required fields: ["kind"] (at `cfg.kind`)'
      frames:
      - label: flow.yaml
        range: [8, 8, 8, 19]
