kind: load
flow: |2

  id: checked
  name: checked
  typedefs:
    Buy:
      action: Literal(buy)
      conviction: float
    Conv:
      conviction: str
  nodes:
    d:
      kind: code
      code: |
        return {"conviction": "x"}
      output: Conv
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: !Buy ${d.output}
  output: ${use.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''use'' input ''x'': declared Buy, but the value is {"conviction":str}'
      frames:
      - label: flow.yaml
        range: [20, 10, 20, 26]
