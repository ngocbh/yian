kind: load
flow: |
  id: unions
  name: unions

  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', qty: int, price: float}
    Hold: {action: 'Literal(hold)', note: str}
    Decision: Union(Buy, Sell, Hold)
    BuyOrSell: Union(Buy, Sell)
  input:
    decision: !object
  nodes:
    decide:
      kind: code
      input:
        decision: ${input.decision}
      code: return inputs['decision']
      output: Decision
    use:
      kind: code
      input:
        n: !int ${decide.output}
      code: return 1
  output: ${decide.output.action}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'node ''use'' input ''n'': declared int, but the value is Union({"action":Literal(buy),"qty":int},{"action":Literal(hold),"note":str},{"action":Literal(sell),"price":float,"qty":int})'
      frames:
      - label: flow.yaml
        range: [22, 10, 22, 31]
