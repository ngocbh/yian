kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, note: str}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    xs: !list(Decision)
  defs:
    each:
      input:
        v: !int
      nodes:
        inner:
          kind: code
          input:
            v: ${input.v}
          output: str
          code: return 'x'
      output: ${inner.output}
  nodes:
    m:
      kind: map
      call: each
      over: ${input.xs}
      input:
        v: ${item.qty}
  output: ${m.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'm' map input 'v' from: reference ${item.qty} reads field 'qty', which only union members with action buy, sell have; read it inside a case on ${item.action}
      frames:
      - label: flow.yaml
        range: [31, 10, 31, 21]
