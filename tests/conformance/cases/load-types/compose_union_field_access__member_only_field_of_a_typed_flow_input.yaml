kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, note: str}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
    Num: {num: int}
    Reply: Union(Text, Num)
  input:
    d: !Decision
  nodes:
    step:
      kind: code
      input:
        v: ${input.d.qty}
      output: !str
      code: return 'x'
  output: ${step.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: |-
        flow has unresolved references:
          node 'step' input 'v' from: reference ${input.d.qty} reads field 'qty', which only union members with action buy, sell have; read it inside a case on ${input.d.action}
      frames:
      - label: flow.yaml
        range: [17, 10, 17, 24]
