kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, limit: float}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: !Decision
      code: return 1
    route:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: b
      else: e
    b:
      kind: call
      input:
        q: ${d.output.qty}
      nodes:
        inner:
          kind: code
          input:
            q: ${input.q}
          code: return 1
      output: ${inner.output}
    e:
      kind: code
      code: return 1
  output: ${d.output.action}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'cannot infer type for inline binding ''b.input.q'': reference ${d.output.qty} reads field ''qty'', which only union members with action buy, sell have; read it inside a case on ${d.output.action}; declare its type with a tag (`q: !<type> ...`) or use an explicitly typed named `defs:` body'
      frames:
      - label: flow.yaml
        range: [27, 10, 27, 25]
