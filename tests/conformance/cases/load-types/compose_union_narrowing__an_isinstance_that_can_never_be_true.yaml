kind: load
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int, limit: float}
    Hold: {action: 'Literal(hold)', note: str}
    Sell: {action: 'Literal(sell)', qty: int, price: float, note: str}
    Decision: Union(Buy, Hold, Sell)
    Text: {text: str}
  input:
    s: !str
  nodes:
    d:
      kind: code
      input:
        s: ${input.s}
      output: !Decision
      code: return 1
    route:
      kind: case
      cases:
        - when: input.s == 'x'
          then: b
        - when: "isinstance(d.output, Text)"
          then: b
      else: e
    b:
      kind: code
      code: return 1
    e:
      kind: code
      code: return 1
  output: ${d.output.action}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `cases[1].when`: `isinstance(d.output, Text)` can never be true: d.output is declared Decision, and no Decision value fits Text'
      frames:
      - label: flow.yaml
        range: [23, 15, 23, 43]
