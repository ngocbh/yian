kind: load
flow: |
  id: pages
  name: pages
  input:
    start: !Optional(str)
  defs:
    fetch_page:
      input:
        cursor: !str
      nodes:
        get:
          kind: code
          input:
            cursor: ${input.cursor}
          output: !Optional(str)
          code: |
            if (inputs["cursor"] === null) throw new Error("body saw a null cursor")
            return ({p1: "p2", p2: null})[inputs["cursor"]] ?? null
      output:
        cursor: ${get.output}
  nodes:
    pages:
      kind: loop
      until: cursor == null
      input:
        cursor: p1
      call: fetch_page
  output: ${pages.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'loop node ''pages'': the body ''fetch_page'' returns ''cursor'' as Optional(str), but takes ''cursor'' as str; make the input Optional(str), or tag the seed to leave the check to runtime: `cursor: !str "p1"`'
      frames:
      - label: flow.yaml
        range: [25, 15, 25, 17]
