# A host stop after fetch's first tool call records run_stopped with fetch in
# flight; the resume retries fetch, and its NodeAttemptResumed counts no crashed attempt, since the stop covers
# that start.
kind: resume
flow: |
  id: fetch-once
  name: fetch_once
  nodes:
    fetch:
      kind: tool
      tool_id: lookup
  output: ${fetch.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      parameters: {type: object, properties: {}}
      results:
      - return: F1
      - return: F1
  stop:
    fetch: {after: {tool_call: 1}}
expect:
  output: {status: succeeded, output: F1}
  trace:
  - [run_started, null, {num_workers: 0}]
  - [pool_commit, __start__, {key: system.now}]
  - [pool_commit, __start__, {key: system.run_id, value: r1}]
  - [pool_commit, __start__, {key: system.today}]
  - [pool_commit, __start__, {value: {}}]
  - [node_started, __start__]
  - [pool_commit, __start__, {value: {}}]
  - [node_succeeded, __start__, {commit: 6}]
  - [node_started, fetch]
  - [run_stopped, null, {node_ids: [fetch], reason: signal}]
  - [run_resumed, null, {num_workers: 0, retry_node_ids: [fetch]}]
  - [node_started, fetch]
  - [pool_commit, fetch, {value: F1}]
  - [node_succeeded, fetch, {commit: 12}]
  - [node_started, __end__]
  - [pool_commit, __end__, {value: F1}]
  - [node_succeeded, __end__, {commit: 15}]
  events:
  - [RunResumed]
  - [NodeAttemptResumed, {node_id: fetch, crashed: 0}]
  - [NodeStarted, {node_id: fetch}]
  - [NodeSucceeded, {node_id: fetch, output: F1, interrupted: false}]
  - [NodeStarted, {node_id: __end__}]
  - [NodeSucceeded, {node_id: __end__, output: F1, interrupted: false}]
  - [RunSucceeded, {output: F1}]
  tool_calls:
    lookup:
    - {args: {}, call_id: r1/fetch, attempt: 1, node: fetch}
    - {args: {}, call_id: r1/fetch, attempt: 2, node: fetch}
resume: {}
