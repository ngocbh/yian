# The hook holds `save`; the crash cuts the run right after the hold's step, the agent still in
# flight. The resume replays the hold without asking the hook, pends it again and waits; the
# release then runs the call once, at the first evaluation after it.
kind: resume
flow: |
  id: cuthold
  name: cuthold
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    agent:
      kind: agent
      tools: [save]
      prompt: hi
      output: !str
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  crash_after_record: 10
  tools:
    save: {parameters: {type: object, properties: {}}, results: [{return: saved}]}
  gate:
    save: [{hold: true}]
  sends:
  - {release: r1/agent/1/0}
  models:
    agent:
      agent:
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: tool_call, id: c1, name: save, arguments: {}}]}
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: done}]}
resume: {}
expect:
  output: {status: succeeded, output: done}
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: c1, name: save, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 41da36ba1135cbab58bd3ac89968f1984f4db4d1c40b533b081f4725e0b28030, response_id: null, usage: null}}], [node_step, agent, {n: 2, step: {call_id: r1/agent/1/0, group_end: 0, held: true, index: 0, kind: pending, reply: 1, source: {group: null, kind: host, tool: save}, tool: save, tool_call_id: c1}}], [run_resumed, null, {gated: true, num_workers: 0, retry_node_ids: [agent]}], [node_started, agent], [node_waiting, agent, {call_ids: [r1/agent/1/0]}], [run_waiting, null, {node_ids: [agent]}], [node_step, agent, {n: 3, step: {call_id: r1/agent/1/0, kind: released}}], [node_woken, agent], [node_step, agent, {n: 4, step: {call_id: c1, is_error: false, kind: tool_result, output: saved}}], [node_step, agent, {n: 5, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: 781ba8ba963e6b41c4cf9bf80bd6fecbf8f9bbde38cd38f8962ea35055f157a0, response_id: null, usage: null}}], [pool_commit, agent, {value: done}], [pool_commit, agent, {key: agent.new_messages, steps: [9, 17, 18]}], [node_succeeded, agent, {commit: 19, messages: 20}], [node_started, __end__], [pool_commit, __end__, {value: done}], [node_succeeded, __end__, {commit: 23}]]
  tool_calls: {save: [{args: {}, call_id: r1/agent/1/0, attempt: 1, node: agent}]}
  gate_calls: [{tool: save, call_id: r1/agent/1/0, node: agent, source: {kind: host, group: null, tool: save}, arguments: {}, attempt: 1, scopes: []}]
