# The hook runs `save` (resumable); an interrupt lands while it runs, and the crash cuts the run
# right after the `interrupted` record, before the call's result. The resume would send `save`
# again, but with the interrupt pending it closes the call crashed without asking the hook, and
# the agent ends null.
kind: resume
flow: |
  id: cutresend
  name: cutresend
  llm_config: {provider: anthropic, model: claude-test}
  input:
    notes: !Inbox(str)
  nodes:
    agent:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [save]
      prompt: hi
      output: !Optional(str)
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  crash_after_record: 10
  tools:
    save: {parameters: {type: object, properties: {}}, resumable: true, results: [{return: saved}]}
  gate:
    save: [{run: true}]
  sends:
  - {interrupt: notes, after: {node: agent, tool_call: 1}}
  models:
    agent:
      agent:
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: tool_call, id: c1, name: save, arguments: {}}]}
resume: {}
expect:
  output: {status: succeeded, output: null}
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {notes: {inbox: notes}}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: c1, name: save, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 41da36ba1135cbab58bd3ac89968f1984f4db4d1c40b533b081f4725e0b28030, response_id: null, usage: null}}], [interrupted, null, {inbox: notes, nodes: [agent]}], [run_resumed, null, {gated: true, num_workers: 0, retry_node_ids: [agent]}], [node_started, agent], [node_step, agent, {n: 2, step: {call_id: c1, closed: crashed, is_error: true, kind: tool_result, output: The tool call was interrupted; its outcome is unknown. Check its effect before retrying.}}], [node_step, agent, {n: 3, step: {by: 10, kind: interrupted}}], [pool_commit, agent], [pool_commit, agent, {key: agent.new_messages, steps: [9, 13, 14]}], [node_succeeded, agent, {commit: 15, messages: 16}], [node_started, __end__], [pool_commit, __end__], [node_succeeded, __end__, {commit: 19}]]
  tool_calls: {save: [{args: {}, call_id: r1/agent/1/0, attempt: 1, node: agent}]}
  gate_calls: [{tool: save, call_id: r1/agent/1/0, node: agent, source: {kind: host, group: null, tool: save}, arguments: {}, attempt: 1, scopes: []}]
