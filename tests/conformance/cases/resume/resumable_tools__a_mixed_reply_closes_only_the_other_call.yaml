# One reply calls the resumable `save`, then the plain `note`; they run one at a time. The crash
# cuts the agent after the reply's model_call (record 9), once `save` ran but before its result
# was written, so `note` never ran. The resume sends `save` again (attempt 2) and closes `note`
# `crashed`, in call order: `note` isn't resumable, so the resume can't know whether it ran. The
# next model call reads save's answer and note's closer.
kind: resume
flow: |
  id: resumable-mixed
  name: resumable_mixed
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    writer:
      kind: agent
      tools: [save, note]
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${writer.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    save:
      description: Save a topic.
      resumable: true
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: saved:a
    note:
      description: Note a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      # Never called: the crash came before it ran, and the resume closes it.
      results: []
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: save, arguments: {topic: a}}
          - {type: tool_call, id: c2, name: note, arguments: {topic: b}}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: text, text: done}
  crash_after_record: 9
expect:
  output: {status: succeeded, output: done}
  tool_calls:
    save:
    - args: {topic: a}
      call_id: r1/writer/1/0
      attempt: 1
      node: writer
    - args: {topic: a}
      call_id: r1/writer/1/0
      attempt: 2
      node: writer
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          model: claude-test
          provider: anthropic
          _connection: {method: api_key, source: environment, endpoint: null}
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - arguments: {topic: a}
            id: c1
            name: save
            type: tool_call
          - arguments: {topic: b}
            id: c2
            name: note
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 368da685bf4c7b9097ea0f302da30deb05c9841e7ce6217587922d0d8ceb8844
        response_id: null
        usage: null
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [writer]
  - [node_started, writer]
  - - node_step
    - writer
    - n: 2
      step: {call_id: c1, is_error: false, kind: tool_result, output: saved:a}
  - - node_step
    - writer
    - n: 3
      step: {call_id: c2, closed: crashed, is_error: true, kind: tool_result, output: The tool call was interrupted; its outcome is unknown. Check its effect before retrying.}
  - - node_step
    - writer
    - n: 4
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: done, type: text}
          role: assistant
        purpose: chat
        request_sha256: 1f243bb6d46c4cd4aa2cb1ff9ab39c75c83835e64f07c166327c55377adfb3bf
        response_id: null
        usage: null
  - - pool_commit
    - writer
    - {value: done}
  - - pool_commit
    - writer
    - key: writer.new_messages
      steps: [9, 12, 13, 14]
  - - node_succeeded
    - writer
    - {commit: 15, messages: 16}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: done}
  - - node_succeeded
    - __end__
    - {commit: 19}
