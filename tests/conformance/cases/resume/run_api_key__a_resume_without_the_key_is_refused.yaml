# A resume without the host key is refused before anything is appended, instead of failing the agent at
# its model call; no model is called, and a resume given the key can still run it.
# env: VLLM_API_KEY is set, as in the test, to show the resume doesn't fall back to it.
# Record 8 is agent's node_started: its first model call runs, its result is refused.
kind: resume
flow: |
  id: keyed
  name: keyed
  nodes:
    agent: {kind: agent, prompt: hi}
  output: ${agent.output}
env:
  VLLM_API_KEY: <key:2>
run:
  run_id: r1
  num_workers: 0
  llm_config:
    provider: vllm
    model: served-model
    api_key: <key:1>
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
  crash_after_record: 8
expect:
  raises:
    class: RangeError
    message: 'this run''s vllm API key came from the host''s llmConfig.api_key and is not recorded; pass it again: advance({ log, apiKey })'
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _host_key: true
          model: served-model
          provider: vllm
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  events: []
resume: {}
