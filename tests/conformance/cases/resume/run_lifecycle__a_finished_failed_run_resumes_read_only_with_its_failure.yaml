# Resuming a failed run returns its failure,
# located as before, read-only: nothing is appended and no event fires.
kind: resume
flow: |
  id: lifecycle-located-failure
  name: lifecycle_located_failure
  input:
    window: !int
  nodes:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.window}
      output: !int
  output: ${echo.output}
inputs:
  window: soon
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: end
expect:
  output:
    status: failed
    failure:
      code: contract.input
      message: 'input ''window'': "soon" does not match declared type int'
      frames:
      - label: flow.yaml
        range: [4, 11, 4, 15]
      node: __start__
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {window: soon}
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: contract.input
        message: 'input ''window'': "soon" does not match declared type int'
        frames:
        - label: flow.yaml
          range: [4, 11, 4, 15]
        node: __start__
  events: []
resume: {}
