# resume.num_workers replaces the recorded worker bound in run_resumed, and the resumed run is pooled (results
# grouped by the resumed run's num_workers). Record 8 is a's node_started: a runs, its result is refused.
# Events left out: a resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: lifecycle-parallel
  name: lifecycle_parallel
  input:
    n: !int
  nodes:
    a:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
    b:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
    c:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.n}
      output: int
  output:
    a: ${a.output}
    b: ${b.output}
    c: ${c.output}
inputs:
  n: 7
run:
  run_id: r1
  num_workers: 0
host:
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output:
      a: 7
      b: 7
      c: 7
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - run_resumed
    - null
    - num_workers: 4
      retry_node_ids: [a]
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        a: 7
        b: 7
        c: 7
  - - node_succeeded
    - __end__
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: 7}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: 7
  - - node_succeeded
    - __start__
  - [node_started, a]
  - [node_started, a]
  - - pool_commit
    - a
    - value: 7
  - - node_succeeded
    - a
  - [node_started, b]
  - - pool_commit
    - b
    - value: 7
  - - node_succeeded
    - b
  - [node_started, c]
  - - pool_commit
    - c
    - value: 7
  - - node_succeeded
    - c
resume:
  num_workers: 4
