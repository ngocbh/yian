# The crash refuses lookup's tool_result; a steer is sent while the run is down. The resumed
# agent replays the reply, closes lookup's call as `crashed`, then reads its steer inbox: a
# `steer` step for the send, which joins the first live request after the closer's result (its
# `request` below).
kind: resume
flow: |
  id: replay-steer
  name: replay_steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [lookup]
      system_prompt: Help.
      prompt: Help the user.
      output: str
  output: ${chat.output}
run: {run_id: r1, num_workers: 0}
host:
  sends:
    - {inbox: notes, event: only the 2024 rows, down: true}
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties: {topic: {type: string}}
        required: [topic]
      results:
        - return: found a
  models:
    chat:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts:
              - {type: tool_call, id: call-1, name: lookup, arguments: {topic: a}}
        - reply:
            format: yian.message.v1
            role: assistant
            parts:
              - {type: text, text: Done with 2024.}
          request:
            messages:
              - format: yian.message.v1
                role: system
                parts: [{type: text, text: Help.}]
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: Help the user.}]
              - format: yian.message.v1
                role: assistant
                parts:
                  - {type: tool_call, id: call-1, name: lookup, arguments: {topic: a}}
              - format: yian.message.v1
                role: tool
                parts:
                  - type: tool_result
                    call_id: call-1
                    name: lookup
                    content: The tool call was interrupted; its outcome is unknown. Check its effect before retrying.
                    is_error: true
              - format: yian.message.v1
                role: user
                parts: [{type: text, text: only the 2024 rows}]
            tools:
              - name: lookup
                description: Look up a topic.
                parameters:
                  type: object
                  properties: {topic: {type: string}}
                  required: [topic]
  crash_after_record: 9
expect:
  output: {status: succeeded, output: Done with 2024.}
  tool_calls:
    lookup: [{args: {topic: a}, attempt: 1, call_id: r1/chat/1/0, node: chat}]
  trace:
    - - run_started
      - null
      - effective_llm_by_static_path:
          chat:
            _connection:
              endpoint: https://api.openai.com/v1
              method: api_key
              source: missing
            model: gpt-5.5
            provider: openai
        learnable: false
        num_workers: 0
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {notes: {inbox: notes}}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, chat]
    - - node_step
      - chat
      - n: 1
        step:
          finish: null
          kind: model_call
          model: gpt-5.5
          output:
            format: yian.message.v1
            parts:
              - arguments: {topic: a}
                id: call-1
                name: lookup
                type: tool_call
            role: assistant
          purpose: chat
          request_sha256: b7d9caa4b04860d9400ab6dbcf24314a6f33bc70850cb5d4333791714d0c2ca6
          response_id: null
          usage: null
    - [pool_commit, __start__, {key: __start__.notes, value: only the 2024 rows}]
    - [run_resumed, null, {num_workers: 0, retry_node_ids: [chat]}]
    - [node_started, chat]
    - - node_step
      - chat
      - n: 2
        step:
          call_id: call-1
          closed: crashed
          is_error: true
          kind: tool_result
          output: The tool call was interrupted; its outcome is unknown. Check its effect before retrying.
    - - node_step
      - chat
      - n: 3
        step:
          kind: steer
          from: [10]
          inbox: notes
    - [node_step, chat, {n: 4, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Done with 2024., type: text}], role: assistant}, purpose: chat, request_sha256: 01ab04a8fb9eb9ed3c32031318ee068f498eb7ecedf51b398f196b16caa0d2d4, response_id: null, usage: null}}]
    - [pool_commit, chat, {value: Done with 2024.}]
    - [pool_commit, chat, {key: chat.new_messages, steps: [9, 13, 14, 15]}]
    - [node_succeeded, chat, {commit: 16, messages: 17}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: Done with 2024.}]
    - [node_succeeded, __end__, {commit: 20}]
  stream:
    - {chunk: Done with 2024., final: false, key: text, node_id: chat, n: 4, index: 0}
    - {chunk: '', final: true, key: text, node_id: chat, n: 4, index: 1}
