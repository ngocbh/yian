# An ask that started before the crash is retried and asked again; the consumer binds the answer given
# on resume against its declared type. `use` returns its input (the test doubles it).
# Record 8 is ask's node_started: the first answer is given, its result is refused.
# Events left out: a resume also publishes NodeAttemptResumed for each
# restarted node (decision 20); the trace still pins the resume.
kind: resume
flow: |
  id: typed-gate-replay
  name: typed_gate_replay
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "How many?"
    use:
      kind: code
      input:
        n: !int ${ask.output}
      code: |
        return inputs["n"]
  output: ${use.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: [1, 3]
  crash_after_record: 8
expect:
  output:
    status: succeeded
    output: 3
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - run_resumed
    - null
    - num_workers: 0
      retry_node_ids: [ask]
  - [node_started, ask]
  - - pool_commit
    - ask
    - value: 3
  - - node_succeeded
    - ask
    - {commit: 11}
  - [node_started, use]
  - - pool_commit
    - use
    - value: 3
  - - node_succeeded
    - use
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 3
  - - node_succeeded
    - __end__
    - {commit: 17}
  tool_calls:
    ask:
    - args: {question: "How many?", node_id: ask}
      call_id: r1/ask
      attempt: 1
      node: ask
    - args: {question: "How many?", node_id: ask}
      call_id: r1/ask
      attempt: 2
      node: ask
resume: {}
