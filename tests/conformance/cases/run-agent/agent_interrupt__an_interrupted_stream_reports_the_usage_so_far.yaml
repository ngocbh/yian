# A text-free first chunk carries the input usage; an interrupt delivered once chunk 3 (" big") is
# read cuts the stream, and the one ModelCallFinished reports the usage received so far
# (1000/1/1001) with no error. The agent's output is null.
kind: run
flow: |
  id: steer
  name: steer
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(str)
  nodes:
    chat:
      kind: agent
      steer_inbox: ${input.notes}
      system_prompt: Help.
      prompt: Help the user.
      output: Optional(str)
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {interrupt: notes, after: {node: chat, model_call: 1, chunk: 3}}
  models:
    chat:
      agent:
      - chunks:
        - usage:
            input_tokens: 1000
            output_tokens: 1
            total_tokens: 1001
        - text: hello
        - text: ' big'
        - text: ' world'
        - finish: stop
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {notes: {inbox: notes}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - interrupted
    - null
    - inbox: notes
      nodes: [chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: interrupted
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: hello big, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7de94d825befe72ccf8ab4b0b2607e0d8e52aeda6c2004860876ee65a05e3882
        response_id: null
        usage: {cache_creation_tokens: null, cache_read_tokens: null, input_tokens: 1000, output_tokens: 1, reasoning_tokens: null}
  - - node_step
    - chat
    - n: 2
      step: {by: 9, kind: interrupted}
  - - pool_commit
    - chat
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [10, 11]}
  - - node_succeeded
    - chat
    - {commit: 12, messages: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
  - - node_succeeded
    - __end__
    - {commit: 16}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {notes: {inbox: notes}}
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: chat
      provider: openai
      purpose: chat
      usage:
        cache_creation_tokens: null
        cache_read_tokens: null
        input_tokens: 1000
        output_tokens: 1
        reasoning_tokens: null
        total_tokens: 1001
      n: 1
  - - NodeSucceeded
    - node_id: chat
      interrupted: true
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      interrupted: false
  - - RunSucceeded
  stream:
  - chunk: hello
    final: false
    key: text
    node_id: chat
    n: 1
    index: 0
  - chunk: ' big'
    final: false
    key: text
    node_id: chat
    n: 1
    index: 1
  - chunk: ''
    final: true
    key: text
    node_id: chat
    n: 1
    index: 2
