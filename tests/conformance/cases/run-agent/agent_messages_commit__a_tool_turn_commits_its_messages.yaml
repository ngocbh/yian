# An AGENT's success writes its output commit, then a messages commit holding the seqs
# of the steps its new messages are made of (the reply calling `lookup`, its result, the final
# reply), then `node_succeeded` naming both commits.
kind: run
flow: |
  id: messages
  name: messages
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    writer:
      kind: agent
      tools: [lookup]
      system_prompt: Help.
      prompt: hi
      output: !str
  output: ${writer.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found:x
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: call-x, name: lookup, arguments: {topic: x}}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: text, text: done}
expect:
  output: {status: succeeded, output: done}
  trace:
    - [run_started, null, {effective_llm_by_static_path: {writer: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, writer]
    - [node_step, writer, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {topic: x}, id: call-x, name: lookup, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 987d1b022a6cc1e1143ec13d000eb0a9b95aa885fbf1ac0ede3384aa68a12422, response_id: null, usage: null}}]
    - [node_step, writer, {n: 2, step: {call_id: call-x, is_error: false, kind: tool_result, output: found:x}}]
    - [node_step, writer, {n: 3, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: e635a991e460e1b691ff75235384cc6f48a372e7cac95d1d5fe9750a0dc7b096, response_id: null, usage: null}}]
    - [pool_commit, writer, {value: done}]
    - [pool_commit, writer, {key: writer.new_messages, steps: [9, 10, 11]}]
    - [node_succeeded, writer, {commit: 12, messages: 13}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: done}]
    - [node_succeeded, __end__, {commit: 16}]
