# An AGENT's tool call may wait. The reply calls `hold`, whose handler returns
# pending(), and `lookup`, answered inline: the agent writes `hold`'s pending step and `lookup`'s
# result, then waits (node_waiting, run_waiting). The host's complete answers `hold` by its call
# id; the woken agent replays its steps and the next request reads both results in call order.
kind: run
flow: |
  id: pending
  name: pending
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    agent:
      kind: agent
      tools: [hold, lookup]
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    hold:
      description: Wait for an answer.
      parameters: {type: object, properties: {}}
      pending: true
    lookup:
      description: Look up.
      parameters: {type: object, properties: {}}
      results:
      - return: found
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: call-1, name: hold, arguments: {}}
          - {type: tool_call, id: call-2, name: lookup, arguments: {}}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: text, text: done}
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - {type: text, text: Help.}
          - format: yian.message.v1
            role: user
            parts:
            - {type: text, text: hi}
          - format: yian.message.v1
            role: assistant
            parts:
            - {type: tool_call, id: call-1, name: hold, arguments: {}}
            - {type: tool_call, id: call-2, name: lookup, arguments: {}}
          - format: yian.message.v1
            role: tool
            parts:
            - {type: tool_result, call_id: call-1, name: hold, content: "yes"}
          - format: yian.message.v1
            role: tool
            parts:
            - {type: tool_result, call_id: call-2, name: lookup, content: found}
          tools:
          - {name: hold, description: Wait for an answer., parameters: {type: object, properties: {}}}
          - {name: lookup, description: Look up., parameters: {type: object, properties: {}}}
  sends:
  - {complete: r1/agent/1/0, output: "yes"}
expect:
  output:
    status: succeeded
    output: done
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: call-1, name: hold, type: tool_call}, {arguments: {}, id: call-2, name: lookup, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 1e64b94003fa7ebf74f7960502387643104daee7d8de0ec32b9ef6ae97d6517a, response_id: null, usage: null}}], [node_step, agent, {n: 2, step: {call_id: r1/agent/1/0, index: 0, kind: pending, reply: 1, tool: hold, tool_call_id: call-1}}], [node_step, agent, {n: 3, step: {call_id: call-2, is_error: false, kind: tool_result, output: found}}], [node_waiting, agent, {call_ids: [r1/agent/1/0]}], [run_waiting, null, {node_ids: [agent]}], [node_step, agent, {n: 4, step: {call_id: call-1, is_error: false, kind: tool_result, output: yes}}], [node_woken, agent], [node_step, agent, {n: 5, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: a0222ceca11b442b57473f9770082fbda4fffe119bbda44002bc25fdbb9bdae2, response_id: null, usage: null}}], [pool_commit, agent, {value: done}], [pool_commit, agent, {key: agent.new_messages, steps: [9, 11, 14, 16]}], [node_succeeded, agent, {commit: 17, messages: 18}], [node_started, __end__], [pool_commit, __end__, {value: done}], [node_succeeded, __end__, {commit: 21}]]
  tool_calls: {hold: [{args: {}, call_id: r1/agent/1/0, attempt: 1, node: agent}], lookup: [{args: {}, call_id: r1/agent/1/1, attempt: 1, node: agent}]}
