# A rendered `Message` event keeps its author: the render's text is a user message of its own,
# signed as the unrendered message would be, so the adapter wraps it in that author's label. An
# event with no author joins the read's unsigned user message. Both sends land during the first
# reply, so they join as a late steer.
kind: run
flow: |
  id: relay
  name: relay
  llm_config: {provider: openai, model: gpt-5.5}
  input:
    notes: !Inbox(Message)
  nodes:
    chat:
      kind: agent
      steer_inbox:
        from: ${input.notes}
        render: |-
          Relayed: ${event.parts[0].text}
      system_prompt: Help.
      prompt: Help the user.
      output: !str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - inbox: notes
    event: {role: user, author: 'Ngoc, via Ana', parts: [{type: text, text: use dataset B}]}
    after: {node: chat, model_call: 1}
  - inbox: notes
    event: {role: user, parts: [{type: text, text: be brief}]}
    after: {node: chat, model_call: 1}
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: draft
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: final, with sources
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Help the user.
          - format: yian.message.v1
            role: assistant
            parts:
            - type: text
              text: draft
          - format: yian.message.v1
            role: user
            author: Ngoc, via Ana
            parts:
            - type: text
              text: 'Relayed: use dataset B'
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: 'Relayed: be brief'
expect:
  output:
    status: succeeded
    output: final, with sources
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          model: gpt-5.5
          provider: openai
          _connection:
            method: api_key
            source: missing
            endpoint: https://api.openai.com/v1
      num_workers: 0
  - - pool_commit
    - __start__
    - key: system.now
  - - pool_commit
    - __start__
    - key: system.run_id
      value: r1
  - - pool_commit
    - __start__
    - key: system.today
  - - pool_commit
    - __start__
    - value: {}
  - - node_started
    - __start__
  - - pool_commit
    - __start__
    - value:
        notes:
          inbox: notes
  - - node_succeeded
    - __start__
    - commit: 6
  - - node_started
    - chat
  - - pool_commit
    - __start__
    - key: __start__.notes
      value:
        author: Ngoc, via Ana
        parts:
        - text: use dataset B
          type: text
        role: user
  - - pool_commit
    - __start__
    - key: __start__.notes
      value:
        parts:
        - text: be brief
          type: text
        role: user
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - text: draft
            type: text
          role: assistant
        purpose: chat
        request_sha256: 7de94d825befe72ccf8ab4b0b2607e0d8e52aeda6c2004860876ee65a05e3882
        response_id: null
        usage: null
  - - node_step
    - chat
    - n: 2
      step:
        from:
        - 9
        - 10
        inbox: notes
        kind: steer
  - - node_step
    - chat
    - n: 3
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - text: final, with sources
            type: text
          role: assistant
        purpose: chat
        request_sha256: 9d3708894bbdabd23dfcb7d1c290fe8ab5c6ce2ecdc544ad0628d8b7d94cbc2b
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - value: final, with sources
  - - pool_commit
    - chat
    - key: chat.new_messages
      steps:
      - 11
      - 12
      - 13
  - - node_succeeded
    - chat
    - commit: 14
      messages: 15
  - - node_started
    - __end__
  - - pool_commit
    - __end__
    - value: final, with sources
  - - node_succeeded
    - __end__
    - commit: 18
  events:
  - - RunStarted
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        notes:
          inbox: notes
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - node_id: chat
      n: 1
      purpose: chat
      provider: openai
      model: gpt-5.5
  - - InboxSent
    - inbox: notes
      seq: 9
  - - InboxSent
    - inbox: notes
      seq: 10
  - - ModelCallFinished
    - node_id: chat
      n: 1
      purpose: chat
      provider: openai
      model: gpt-5.5
  - - ModelCallStarted
    - node_id: chat
      n: 3
      purpose: chat
      provider: openai
      model: gpt-5.5
  - - ModelCallFinished
    - node_id: chat
      n: 3
      purpose: chat
      provider: openai
      model: gpt-5.5
  - - NodeSucceeded
    - node_id: chat
      output: final, with sources
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: final, with sources
      interrupted: false
  - - RunSucceeded
    - output: final, with sources
