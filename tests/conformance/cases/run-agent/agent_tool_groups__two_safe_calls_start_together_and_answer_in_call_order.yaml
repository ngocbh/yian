# Two calls of a tool marked concurrency_safe form one group: both start before either finishes.
# The stub tools return at once, so they finish in call order (call a, then b), and the next
# request holds their two tool messages in call order.
kind: run
flow: |
  id: groups
  name: groups
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    writer:
      kind: agent
      tools: [lookup]
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${writer.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      description: Look up a topic.
      concurrency_safe: true
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found:a
      - return: found:b
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-a
            name: lookup
            arguments:
              topic: a
          - type: tool_call
            id: call-b
            name: lookup
            arguments:
              topic: b
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: both found
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: call-a
              name: lookup
              arguments:
                topic: a
            - type: tool_call
              id: call-b
              name: lookup
              arguments:
                topic: b
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-a
              name: lookup
              content: found:a
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-b
              name: lookup
              content: found:b
          tools:
          - name: lookup
            description: Look up a topic.
            parameters:
              type: object
              properties:
                topic:
                  type: string
              required: [topic]
expect:
  output:
    status: succeeded
    output: both found
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-test
          provider: anthropic
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - arguments: {topic: a}
            id: call-a
            name: lookup
            type: tool_call
          - arguments: {topic: b}
            id: call-b
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: 987d1b022a6cc1e1143ec13d000eb0a9b95aa885fbf1ac0ede3384aa68a12422
        response_id: null
        usage: null
  - - node_step
    - writer
    - n: 2
      step: {call_id: call-a, is_error: false, kind: tool_result, output: found:a}
  - - node_step
    - writer
    - n: 3
      step: {call_id: call-b, is_error: false, kind: tool_result, output: found:b}
  - - node_step
    - writer
    - n: 4
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: both found, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7ea3408eeaa5919739af61e023e8d31d2dd49d8da28aadfe8eec1da8238b829b
        response_id: null
        usage: null
  - - pool_commit
    - writer
    - value: both found
  - - pool_commit
    - writer
    - {key: writer.new_messages, steps: [9, 10, 11, 12]}
  - - node_succeeded
    - writer
    - {commit: 13, messages: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: both found
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: writer
  - - ModelCallStarted
    - model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: a
      call_index: 0
      name: lookup
      node_id: writer
      tool_call_id: call-a
      n: 1
  - - ToolCallStarted
    - arguments:
        topic: b
      call_index: 1
      name: lookup
      node_id: writer
      tool_call_id: call-b
      n: 1
  - - ToolCallFinished
    - call_index: 0
      name: lookup
      node_id: writer
      result: found:a
      tool_call_id: call-a
      n: 1
  - - ToolCallFinished
    - call_index: 1
      name: lookup
      node_id: writer
      result: found:b
      tool_call_id: call-b
      n: 1
  - - ModelCallStarted
    - model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
      n: 4
  - - ModelCallFinished
    - model: claude-test
      node_id: writer
      provider: anthropic
      purpose: chat
      n: 4
  - - NodeSucceeded
    - node_id: writer
      output: both found
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: both found
      interrupted: false
  - - RunSucceeded
    - output: both found
  stream:
  - chunk: ''
    final: true
    key: text
    node_id: writer
    n: 1
    index: 0
  - chunk: both found
    final: false
    key: text
    node_id: writer
    n: 4
    index: 0
  - chunk: ''
    final: true
    key: text
    node_id: writer
    n: 4
    index: 1
  tool_calls:
    lookup:
    - args:
        topic: a
      attempt: 1
      call_id: r1/writer/1/0
      node: writer
    - args:
        topic: b
      attempt: 1
      call_id: r1/writer/1/1
      node: writer
