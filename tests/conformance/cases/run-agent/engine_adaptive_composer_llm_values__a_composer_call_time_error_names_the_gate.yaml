kind: run
flow: |
  id: f
  name: f
  input: {proj: !str }
  nodes:
    pick: {kind: code, output: str, code: "return 'nope'"}
    ask:
      kind: tool
      tool_id: ask
      input:
        proj: ${input.proj}
      adaptive_questions:
        prompt: "Q ${proj}"
        llm_config:
          provider: ${pick.output}
          model: m
  output: ${ask.output}
inputs:
  proj: x
run:
  num_workers: 0
# A run with an ask needs the ask handler; the composer fails before the ask asks.
host:
  human: {}
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [14, 19, 14, 33]
      message: 'node ''ask'' adaptive_questions.llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
      node: ask__compose
  trace:
  - - run_started
    - null
    - call_time_llm:
        agents:
          ask__compose: {}
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {proj: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        proj: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - - pool_commit
    - pick
    - value: nope
  - - node_succeeded
    - pick
    - {commit: 9}
  - [node_started, ask__compose]
  - - node_failed
    - ask__compose
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [14, 19, 14, 33]
        message: 'node ''ask'' adaptive_questions.llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: ask__compose
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        proj: x
      interrupted: false
  - - NodeStarted
    - node_id: pick
  - - NodeSucceeded
    - node_id: pick
      output: nope
      interrupted: false
  - - NodeStarted
    - node_id: ask__compose
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [14, 19, 14, 33]
        message: 'node ''ask'' adaptive_questions.llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: ask__compose
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [14, 19, 14, 33]
        message: 'node ''ask'' adaptive_questions.llm_config.provider: not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: ask__compose
