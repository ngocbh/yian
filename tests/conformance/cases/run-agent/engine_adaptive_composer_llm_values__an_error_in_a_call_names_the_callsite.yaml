kind: run
flow: |
  id: f
  name: f
  defs:
    child:
      input: {p: !str }
      nodes:
        ask:
          kind: tool
          tool_id: ask
          adaptive_questions:
            prompt: "Q"
            llm_config:
              provider: ${input.p}
              model: m
      output: ${ask.output}
  nodes:
    pick: {kind: code, output: str, code: "return 'nope'"}
    sub:
      kind: call
      call: child
      input:
        p: ${pick.output}
  output: ${sub.output}
run:
  num_workers: 0
# A run with an ask needs the ask handler; the composer fails before the ask asks.
host:
  human: {}
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [18, 3, 18, 6]
      - label: flow.yaml
        range: [13, 23, 13, 33]
      message: 'node ''ask'' adaptive_questions.llm_config.provider in ''sub'': not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
      node: sub/ask__compose
  trace:
  - - run_started
    - null
    - call_time_llm:
        agents:
          sub/ask__compose: {}
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - - pool_commit
    - pick
    - value: nope
  - - node_succeeded
    - pick
    - {commit: 9}
  - [node_started, sub]
  - - pool_commit
    - sub
    - from: {pick: 9}
      key: sub/__start__
  - - node_expanded
    - sub
    - prune_ids: []
  - [node_started, sub/__start__]
  - - node_succeeded
    - sub/__start__
    - commit: 12
  - [node_started, sub/ask__compose]
  - - node_failed
    - sub/ask__compose
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [18, 3, 18, 6]
        - label: flow.yaml
          range: [13, 23, 13, 33]
        message: 'node ''ask'' adaptive_questions.llm_config.provider in ''sub'': not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: sub/ask__compose
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: pick
  - - NodeSucceeded
    - node_id: pick
      output: nope
      interrupted: false
  - - NodeStarted
    - node_id: sub
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          p: nope
      node_id: sub
  - - NodeStarted
    - node_id: sub/__start__
  - - NodeSucceeded
    - node_id: sub/__start__
      output:
        p: nope
      interrupted: false
  - - NodeStarted
    - node_id: sub/ask__compose
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [18, 3, 18, 6]
        - label: flow.yaml
          range: [13, 23, 13, 33]
        message: 'node ''ask'' adaptive_questions.llm_config.provider in ''sub'': not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: sub/ask__compose
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [18, 3, 18, 6]
        - label: flow.yaml
          range: [13, 23, 13, 33]
        message: 'node ''ask'' adaptive_questions.llm_config.provider in ''sub'': not a known provider; use one of: openai, xai, deepseek, qwen, qwen-cn, glm, glm-cn, minimax, minimax-cn, openrouter, vllm, ollama, anthropic, google, azure'
        node: sub/ask__compose
