kind: run
flow: |
  id: f
  name: f
  input:
    big: !bool
  llm_config: {provider: openai, model: !str '${gate.output}'}
  nodes:
    gate:
      kind: case
      cases:
        - when: input.big
          then: slow
      else: fast
    slow: {kind: code, output: !str, code: "return 'model-big'"}
    fast: {kind: code, output: !str, code: "return 'model-small'"}
    chat:
      kind: agent
      prompt: Go.
  output: ${chat.output}
inputs: {big: false}
run:
  num_workers: 0
host:
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Go.
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - [run_started, null, {call_time_llm: {agents: {chat: {}}}, num_workers: 0}]
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {big: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {big: false}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - {handle: '#else'}
  - [node_started, fast]
  - - pool_commit
    - fast
    - {value: model-small}
  - - node_succeeded
    - fast
    - {commit: 11}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        effective_llm_config:
          _connection: {endpoint: https://api.openai.com/v1, method: api_key, source: missing}
          model: model-small
          provider: openai
        kind: llm_config
  - - node_step
    - chat
    - n: 2
      step:
        finish: null
        kind: model_call
        model: model-small
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7ab958c0188bf3acf07b5575f5269d33d88bda758a5461de755905f02f23cab6
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - {value: ok}
  - - pool_commit
    - chat
    - key: chat.new_messages
      steps: [15]
  - - node_succeeded
    - chat
    - {commit: 16, messages: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: ok}
  - - node_succeeded
    - __end__
    - {commit: 20}
