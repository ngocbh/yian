kind: run
flow: |
  id: f
  name: f
  input: {m: !str }
  nodes:
    chat:
      kind: agent
      prompt: Go.
      llm_config: {provider: openai, model: '${input.m}'}
  output: ${chat.output}
inputs:
  m: gpt-x
run:
  num_workers: 0
host:
  models:
    chat:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: Go.
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-x
          provider: openai
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {m: gpt-x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        m: gpt-x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, chat]
  - - node_step
    - chat
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-x
        output:
          format: yian.message.v1
          parts:
          - {text: ok, type: text}
          role: assistant
        purpose: chat
        request_sha256: 7ab958c0188bf3acf07b5575f5269d33d88bda758a5461de755905f02f23cab6
        response_id: null
        usage: null
  - - pool_commit
    - chat
    - value: ok
  - - pool_commit
    - chat
    - {key: chat.new_messages, steps: [9]}
  - - node_succeeded
    - chat
    - {commit: 10, messages: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ok
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        m: gpt-x
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - ModelCallStarted
    - model: gpt-x
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - ModelCallFinished
    - model: gpt-x
      node_id: chat
      provider: openai
      purpose: chat
      n: 1
  - - NodeSucceeded
    - node_id: chat
      output: ok
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ok
      interrupted: false
  - - RunSucceeded
    - output: ok
  stream:
  - chunk: ok
    final: false
    key: text
    node_id: chat
    index: 0
    n: 1
  - chunk: ''
    final: true
    key: text
    node_id: chat
    index: 1
    n: 1
