kind: run
flow: |
  id: f
  name: f
  nodes:
    pick: {kind: code, output: Optional(str), code: "return null"}
    chat:
      kind: agent
      prompt: Go.
      llm_config: {provider: openai, model: !str '${pick.output :? "no model"}'}
  output: ${chat.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [8, 43, 8, 78]
      message: 'node ''chat'' llm_config.model: no model'
      node: chat
  trace:
  - - run_started
    - null
    - call_time_llm:
        agents:
          chat: {}
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, pick]
  - [pool_commit, pick]
  - - node_succeeded
    - pick
    - {commit: 9}
  - [node_started, chat]
  - - node_failed
    - chat
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 43, 8, 78]
        message: 'node ''chat'' llm_config.model: no model'
        node: chat
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: pick
  - - NodeSucceeded
    - node_id: pick
      interrupted: false
  - - NodeStarted
    - node_id: chat
  - - NodeFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 43, 8, 78]
        message: 'node ''chat'' llm_config.model: no model'
        node: chat
  - - RunFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [8, 43, 8, 78]
        message: 'node ''chat'' llm_config.model: no model'
        node: chat
