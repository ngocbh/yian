kind: run
flow: |
  id: f
  name: f
  input:
    m: !str
    n: !int
  nodes:
    chat:
      kind: agent
      input: {n: "${input.n}"}
      prompt: "Go ${n}."
      llm_config: {provider: openai, model: '${input.m}'}
  output: ${chat.output}
inputs:
  m: gpt-x
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [5, 3, 5, 4]
      message: required input 'n' is unbound
      node: __start__
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        chat:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-x
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {m: gpt-x}
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 4]
        message: required input 'n' is unbound
        node: __start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 4]
        message: required input 'n' is unbound
        node: __start__
  - - RunFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [5, 3, 5, 4]
        message: required input 'n' is unbound
        node: __start__
