kind: run
flow: |
  id: two
  name: two
  defs:
    body:
      nodes:
        nested: {kind: agent, prompt: hi, llm_config: {model: nested-model}}
      output: ${nested.output}
  nodes:
    agent: {kind: agent, prompt: hi}
    child: {kind: call, call: body, depends_on: [agent]}
    other:
      kind: agent
      prompt: hi
      depends_on: [agent]
      llm_config: {provider: anthropic, model: claude-sonnet-4-5}
  output: ${other.output}
run:
  num_workers: 0
  llm_config:
    provider: openai
    model: gpt-5.4
    api_key: <key:1>
    organization: org-abc
    project: proj-abc
    headers:
      X-Gateway: <key:2>
      X-Trace: <key:3>
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
    other:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
    child/nested:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: ok
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
expect:
  output:
    status: succeeded
    output: ok
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: host
          _header_names: [X-Gateway, X-Trace]
          _host_key: true
          model: gpt-5.4
          organization: org-abc
          project: proj-abc
          provider: openai
        child/nested:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: host
          _header_names: [X-Gateway, X-Trace]
          _host_key: true
          model: nested-model
          organization: org-abc
          project: proj-abc
          provider: openai
        other:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: claude-sonnet-4-5
          provider: anthropic
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
