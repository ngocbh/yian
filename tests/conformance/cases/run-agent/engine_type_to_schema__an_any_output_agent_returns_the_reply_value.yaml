# env: YIAN_DEFAULT_MODEL/PROVIDER kept: the flow names no model, and without them the run fails before its model call.
kind: run
flow: |2

  id: guess
  name: guess
  nodes:
    a:
      kind: agent
      prompt: say anything
      output: Any
  output: ${a.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
run:
  num_workers: 0
host:
  models:
    a:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"a": [1, null]}}'
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: You are an analysis agent inside a larger workflow. Follow the instructions precisely, use the available tools to gather any facts you need, and return a clear, self-contained answer. Ask the user only through an explicitly granted tool.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: say anything
          schema:
            properties:
              value:
                anyOf:
                - type: boolean
                - type: integer
                - type: number
                - type: string
                - additionalProperties: true
                  type: object
                - items: {}
                  type: array
            required: [value]
            type: object
expect:
  output:
    status: succeeded
    output:
      a: [1, null]
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        a:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, a]
  - - node_step
    - a
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: '{"value": {"a": [1, null]}}', type: text}
          role: assistant
        purpose: structured_native
        request_sha256: 2002c35e33cdad0381357b41f39f41032ecc26fd1b43f58b03c038838e9e5f78
        response_id: null
        usage: null
  - - pool_commit
    - a
    - value:
        a: [1, null]
  - - pool_commit
    - a
    - {key: a.new_messages, steps: [9]}
  - - node_succeeded
    - a
    - {commit: 10, messages: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        a: [1, null]
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: a
  - - ModelCallStarted
    - model: gpt-5.5
      node_id: a
      provider: openai
      purpose: structured_native
      n: 1
  - - ModelCallFinished
    - model: gpt-5.5
      node_id: a
      provider: openai
      purpose: structured_native
      n: 1
  - - NodeSucceeded
    - node_id: a
      output:
        a: [1, null]
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        a: [1, null]
      interrupted: false
  - - RunSucceeded
    - output:
        a: [1, null]
