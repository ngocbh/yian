# The model entries carry no `request`, so the schema instruction text isn't pinned.
kind: run
flow: |
  id: plain-session
  name: plain_session
  llm_config: {provider: vllm, model: no-structured-sentinel}
  input:
    question: !str
  nodes:
    agent:
      kind: agent
      prompt: ${question}
      input:
        question: ${input.question}
      retries: 1
      output: object
  output: ${agent.output}
inputs:
  question: q
run:
  num_workers: 0
host:
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": "leaf"}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}'
      structured_retry:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: '{"value": {"k": 1}}'
expect:
  output:
    status: succeeded
    output:
      k: 1
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: null
            method: api_key
            source: environment
          model: no-structured-sentinel
          provider: vllm
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {question: q}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        question: q
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: no-structured-sentinel
        output:
          format: yian.message.v1
          parts:
          - {text: '{"value": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": "leaf"}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}', type: text}
          role: assistant
        purpose: structured_fallback
        request_sha256: 7bf43a834834c603167650ddde21875a760198f43b005f55a07f1d36549be062
        response_id: null
        usage: null
  - - node_step
    - agent
    - n: 2
      step:
        finish: null
        kind: model_call
        model: no-structured-sentinel
        output:
          format: yian.message.v1
          parts:
          - {text: '{"value": {"k": 1}}', type: text}
          role: assistant
        purpose: structured_fallback
        request_sha256: e8dbbf53ee5b64ba929423dfaff3e9ff608ff9c8c52ec837a139313d7d0032e0
        response_id: null
        usage: null
  - - pool_commit
    - agent
    - value:
        k: 1
  - - pool_commit
    - agent
    - {key: agent.new_messages, steps: [10]}
  - - node_succeeded
    - agent
    - {commit: 11, messages: 12}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        k: 1
  - - node_succeeded
    - __end__
    - {commit: 15}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        question: q
      interrupted: false
  - - NodeStarted
    - node_id: agent
  - - ModelCallStarted
    - model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
      n: 1
  - - ModelCallFinished
    - model: no-structured-sentinel
      node_id: agent
      provider: vllm
      purpose: structured_fallback
      n: 1
  - - ModelCallStarted
    - {model: no-structured-sentinel, node_id: agent, provider: vllm, purpose: structured_fallback, n: 2}
  - - ModelCallFinished
    - {model: no-structured-sentinel, node_id: agent, provider: vllm, purpose: structured_fallback, n: 2}
  - - NodeSucceeded
    - node_id: agent
      output:
        k: 1
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        k: 1
      interrupted: false
  - - RunSucceeded
    - output:
        k: 1
