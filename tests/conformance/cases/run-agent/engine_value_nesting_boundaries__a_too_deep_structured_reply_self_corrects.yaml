                type: object
            required: [value]
            type: object
expect:
  output:
    status: succeeded
    output:
      k: 1
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-4o
          provider: openai
      learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {question: q}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        question: q
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-4o
        output:
          format: yian.message.v1
          parts:
          - {text: '{"value": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": {"a": "leaf"}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}', type: text}
          role: assistant
        purpose: structured_native
        request_sha256: c78a6f7267a3c30b5edacc2af39c8712e71ab1dd11a7716bb6eb0324a2d5faaf
        response_id: null
        usage: null
  - - node_step
    - agent
    - n: 2
      step:
        finish: null
        kind: model_call
        model: gpt-4o
        output:
          format: yian.message.v1
          parts:
          - {text: '{"value": {"k": 1}}', type: text}
          role: assistant
        purpose: structured_native
        request_sha256: fc5b00dc58cfed8063b9372b7107a818e985a0fcf4756b3c3c90294ed8002d5c
        response_id: null
        usage: null
  - - pool_commit
    - agent
    - value:
        k: 1
  - - pool_commit
    - agent
    - {key: agent.new_messages, steps: [10]}
  - - node_succeeded
    - agent
    - {commit: 11, messages: 12}
  - [node_started, __end__]
  - - pool_commit
