  - - ModelCallFinished
    - {model: gpt-4o, node_id: agent, provider: openai, purpose: structured_native, n: 2}
  - - NodeSucceeded
    - node_id: agent
      output:
        k: 1
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        k: 1
      interrupted: false
  - - RunSucceeded
