    - [pool_commit, frame, {key: frame.new_messages, steps: [9]}]
    - [node_succeeded, frame, {commit: 10, messages: 11}]
    - [node_started, for_case]
    - [node_step, for_case, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: One repo shares tooling and keeps changes atomic., type: text}], role: assistant}, purpose: chat, request_sha256: b037aaef52a6a311769bb44b31bae46998be1729a660d56a3f5e2bca442e1f82, response_id: null, usage: null}}]
