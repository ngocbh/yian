    - [node_step, the_case_against, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Builds slow down as the repo grows., type: text}], role: assistant}, purpose: chat, request_sha256: 63b3ab015142320075243f92fd9212bfc187eebcc78cb738ca0fa001cfb95bb1, response_id: null, usage: null}}]
