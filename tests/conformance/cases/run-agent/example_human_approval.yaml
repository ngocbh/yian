# From examples/human-approval.yaml.
# The human approves the drafted plan, the `case ... on` the answer takes `kickoff`, and the `|`
# join returns its text; `revise_plan` is skipped and gets no model call.
# `tool_calls` pins the `ask` call: its prompt is a wiring template over `draft`'s output.
kind: run
flow: |
  # human-approval — a deterministic human gate with the `ask` built-in.
  #
  # An `ask` TOOL node ALWAYS asks at a fixed point in the graph: the host answers at once, or
  # returns `pending()` and answers later with `complete()`. The answer is validated against
  # the node's declared `output:` type before the flow continues. (Contrast with the
  # `ask_user` tool — see ask-user.yaml — which is model-CHOSEN, not guaranteed.)
  #
  # The flow: an agent drafts a short plan, an `ask` node asks the human to approve or revise
  # it, `case ... on` routes on the typed answer, and whichever branch ran is combined by an
  # n-ary `|` coalesce into the flow output.
  #
  # Exercises: a Literal typedef as the human answer, a TOOL node calling `ask`, `case ... on`
  # with `else`, and a coalesce join.
  #
  # Run it with (the CLI will prompt you for the approval):
  #   yian run examples/human-approval.yaml --input task="Plan a team offsite"

  id: human-approval
  name: human_approval
  description: Draft a plan, ask a human to approve or revise it, then finalize accordingly.

  typedefs:
    Approval: Literal(approve, revise)    # the typed human answer (a tag-only enum)

  input:
    task: !str

  nodes:
    draft:
      kind: agent
      input:
        task: ${input.task}
      output: str
      prompt: "Draft a short, concrete plan (exactly 3 numbered steps) for: ${task}"

    approve:
      kind: tool
      tool_id: ask                         # always asks; the host answers
      input:
        prompt: |-
          Here is the proposed plan:

          ${draft.output}

          Approve it as-is, or send it back to be revised? (approve / revise)
      output: Approval                     # the human's answer, validated against Approval's tags

    gate:
      kind: case                           # route on the human's answer (simple form)
      on: ${approve.output}
      cases:
        - when: approve
          then: kickoff
      else: revise_plan

    kickoff:
      kind: agent
      input:
        plan: ${draft.output}
      output: str
      prompt: "The plan was approved. Write a short, upbeat kickoff message for it:\n\n${plan}"

    revise_plan:
      kind: agent
      input:
        plan: ${draft.output}
      output: str
      prompt: "The plan needs work. Rewrite it tighter and clearer, keeping 3 steps:\n\n${plan}"

  # kickoff runs on approve; revise_plan runs otherwise. Coalesce picks whichever ran.
  output: ${kickoff.output | revise_plan.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {task: Plan a team offsite}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  human:
    approve: [approve]
  models:
    draft:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "1. Pick a date. 2. Book a venue. 3. Send invites."}]
    kickoff:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: "The offsite plan is approved: let's pick a date!"}]
expect:
  output: {status: succeeded, output: "The offsite plan is approved: let's pick a date!"}
  tool_calls:
    ask:
    - args:
        answer_schema:
        - enum: [approve, revise]
          name: answer
          required: true
          type: str
        node_id: approve
        question: |-
          Here is the proposed plan:

          1. Pick a date. 2. Book a venue. 3. Send invites.

          Approve it as-is, or send it back to be revised? (approve / revise)
      attempt: 1
      call_id: r1/approve
      node: approve
  # Run start resolves every AGENT, the skipped ones included; a skipped node writes no record.
  trace:
    - - run_started
      - null
      - num_workers: 0
        effective_llm_by_static_path:
          draft:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          kickoff:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          revise_plan:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {task: Plan a team offsite}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {task: Plan a team offsite}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, draft]
    - [node_step, draft, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: 1. Pick a date. 2. Book a venue. 3. Send invites., type: text}], role: assistant}, purpose: chat, request_sha256: 7f35824f1676806f75b3c91f936231889a3ac10e9c7f378c223f880c0e80b391, response_id: null, usage: null}}]
    - [pool_commit, draft, {value: "1. Pick a date. 2. Book a venue. 3. Send invites."}]
    - [pool_commit, draft, {key: draft.new_messages, steps: [9]}]
    - [node_succeeded, draft, {commit: 10, messages: 11}]
    - [node_started, approve]
    - [pool_commit, approve, {value: approve}]
    - [node_succeeded, approve, {commit: 14}]
    - [node_started, gate]
    - [node_routed, gate, {handle: kickoff}]
    - [node_started, kickoff]
    - [node_step, kickoff, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: "The offsite plan is approved: let's pick a date!", type: text}], role: assistant}, purpose: chat, request_sha256: 86bf0742a82491d26422f5bb2f1177052e3e3a0255c85a52f43336deaabcdbf5, response_id: null, usage: null}}]
    - [pool_commit, kickoff, {value: "The offsite plan is approved: let's pick a date!"}]
    - [pool_commit, kickoff, {key: kickoff.new_messages, steps: [19]}]
    - [node_succeeded, kickoff, {commit: 20, messages: 21}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: "The offsite plan is approved: let's pick a date!"}]
    - [node_succeeded, __end__, {commit: 24}]
