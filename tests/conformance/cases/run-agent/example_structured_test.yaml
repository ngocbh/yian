# From examples/structured-test.yaml.
# Record, int, Literal and list AGENT outputs each read their JSON carrier; the flow bundles all
# four.
# The header names Ollama, but the flow sets no provider; the run gives OpenAI, as elsewhere.
kind: run
flow: |
  # structured-test — exercise structured AGENT output across shapes on a local Ollama model.
  # Four agents without tools, one per output shape; the flow output bundles all four so a single
  # run shows whether structured generation + the write boundary accept each shape.
  #   yian run examples/structured-test.yaml --input text="..."

  id: structured-test
  name: structured_test
  description: Exercise structured AGENT output (record / int / list / enum) on Ollama.

  input:
    text: !str

  nodes:
    person:                                    # record (object) output
      kind: agent
      input:
        text: ${input.text}
      output:
        name: !str
        age: !int
      prompt: |-
        Extract a single person from the text as a name (string) and an age (integer).
        If the age is not stated, make a reasonable guess.
        Text: ${text}

    wordcount:                                 # scalar int output
      kind: agent
      input:
        text: ${input.text}
      output: !int
      prompt: |-
        Return ONLY the number of words in the text as an integer.
        Text: ${text}

    sentiment:                                 # enum (Literal) output
      kind: agent
      input:
        text: ${input.text}
      output: !Literal(positive;neutral;negative)
      prompt: |-
        Classify the sentiment of the text as exactly one of: positive, neutral, negative.
        Text: ${text}

    keywords:                                  # list output
      kind: agent
      input:
        text: ${input.text}
      output: !list(str)
      prompt: |-
        Extract up to 3 short keywords from the text as a list of strings.
        Text: ${text}

  output:
    person: ${person.output}
    wordcount: ${wordcount.output}
    sentiment: ${sentiment.output}
    keywords: ${keywords.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {text: "Ada Lovelace, aged 36, loved mathematics."}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    # A record is its own carrier; an int and a Literal wrap as `{"value": ...}`, a list as
    # `{"items": ...}`.
    person:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"name": "Ada Lovelace", "age": 36}'}]
    wordcount:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"value": 6}'}]
    sentiment:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"value": "positive"}'}]
    keywords:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: '{"items": ["Ada Lovelace", "mathematics"]}'}]
expect:
  output:
    status: succeeded
    output:
      person: {name: Ada Lovelace, age: 36}
      wordcount: 6
      sentiment: positive
      keywords: [Ada Lovelace, mathematics]
  trace:
    - - run_started
      - null
      - num_workers: 0
        effective_llm_by_static_path:
          person:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          wordcount:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          sentiment:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          keywords:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {text: 'Ada Lovelace, aged 36, loved mathematics.'}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {text: "Ada Lovelace, aged 36, loved mathematics."}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, person]
    - [node_step, person, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: '{"name": "Ada Lovelace", "age": 36}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 5bf5a015db2a2ea4840a7074f89496e0d9fa88fec79f12206db7525ffcf6c168, response_id: null, usage: null}}]
    - [pool_commit, person, {value: {name: Ada Lovelace, age: 36}}]
    - [pool_commit, person, {key: person.new_messages, steps: [9]}]
    - [node_succeeded, person, {commit: 10, messages: 11}]
    - [node_started, wordcount]
    - [node_step, wordcount, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: '{"value": 6}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 40a6c87bfb3e92e482d66c4a19bca83793c7fcbb557ff650afc8692a9d300f55, response_id: null, usage: null}}]
    - [pool_commit, wordcount, {value: 6}]
    - [pool_commit, wordcount, {key: wordcount.new_messages, steps: [14]}]
    - [node_succeeded, wordcount, {commit: 15, messages: 16}]
    - [node_started, sentiment]
    - [node_step, sentiment, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: '{"value": "positive"}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 8f3265e2ef919386ac350256607d20edfee667a7db71c2275e6fbc8bea5507e3, response_id: null, usage: null}}]
    - [pool_commit, sentiment, {value: positive}]
    - [pool_commit, sentiment, {key: sentiment.new_messages, steps: [19]}]
    - [node_succeeded, sentiment, {commit: 20, messages: 21}]
    - [node_started, keywords]
    - [node_step, keywords, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: '{"items": ["Ada Lovelace", "mathematics"]}', type: text}], role: assistant}, purpose: structured_native, request_sha256: 5a5980627667ef53e8d6d2b924cb564a652304a0da6307186439f049823275c4, response_id: null, usage: null}}]
    - [pool_commit, keywords, {value: [Ada Lovelace, mathematics]}]
    - [pool_commit, keywords, {key: keywords.new_messages, steps: [24]}]
    - [node_succeeded, keywords, {commit: 25, messages: 26}]
    - [node_started, __end__]
    - - pool_commit
      - __end__
      - value:
          person: {name: Ada Lovelace, age: 36}
          wordcount: 6
          sentiment: positive
          keywords: [Ada Lovelace, mathematics]
    - [node_succeeded, __end__, {commit: 29}]
