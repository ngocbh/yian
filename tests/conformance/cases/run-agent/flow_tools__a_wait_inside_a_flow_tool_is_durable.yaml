helper/approve#0/__end__, {from: {helper/approve#0/sign: 22}}], [node_succeeded, helper/approve#0/__end__, {commit: 25}], [node_woken, helper], [node_step, helper, {n: 3, step: {call_id: c1, is_error: false, kind: tool_result, output: signed}}], [node_step, helper, {n: 4, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: it was signed, type: text}], role: assistant}, purpose: chat, request_sha256: 4595d08419b3bccbcd6e8b9c09a2a1b2c89c6a637cc7c6c1c2c35c83ba73fdd8, response_id: null, usage: null}}], [pool_commit, helper, {value: it was signed}], [pool_commit, helper, {key: helper.new_messages, steps: [9, 28, 29]}], [node_succeeded, helper, {commit: 30, messages: 31}], [node_started, __end__], [pool_commit, __end__, {value: it was signed}], [node_succeeded, __end__, {commit: 34}]]
