# Inside the flow `approve`, a TOOL node calls a host tool that answers later: the run ends
# waiting with the agent waiting on its flow call and the TOOL node on its host call. The host
# answers the TOOL node's call by its id; the flow ends, and its output answers the agent.
kind: run
flow: |
  id: helping
  name: helping
  llm_config: {provider: anthropic, model: claude-test}
  defs:
    approve:
      description: Ask a person to approve an item.
      input:
        item: !str
      nodes:
        sign:
          kind: tool
          tool_id: sign
          input:
            item: ${input.item}
          output: !str
      output: ${sign.output}
  nodes:
    helper:
      kind: agent
      tools: [approve]
      system_prompt: Help.
      prompt: hi
      output: !str
  output: ${helper.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    sign:
      parameters: {type: object, properties: {item: {type: string}}}
      pending: true
  sends:
  - {complete: r1/helper/approve#0/sign, output: signed}
  models:
    helper:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: approve, arguments: {item: the refund}}
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: it was signed}]}
expect:
  output: {status: succeeded, output: it was signed}
