# The flow `research` holds an agent: its model calls are its own (`c/helper/research#0/inner`),
# its settings recorded at run start under its static path, and its answer is the flow's output.
# The granting agent sits in a called def, so the scope nests under the call.
kind: run
flow: |
  id: helping
  name: helping
  llm_config: {provider: anthropic, model: claude-test}
  defs:
    research:
      description: Research a question.
      input:
        question: !str
      nodes:
        inner:
          kind: agent
          input:
            question: ${input.question}
          system_prompt: Research.
          prompt: ${question}
          output: !str
      output: ${inner.output}
    work:
      nodes:
        helper:
          kind: agent
          tools: [research]
          system_prompt: Help.
          prompt: hi
          output: !str
      output: ${helper.output}
  nodes:
    c:
      kind: call
      call: work
  output: ${c.output}
run:
  run_id: r1
  num_workers: 0
host:
  models:
    c/helper:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-a
            name: research
            arguments: {question: why?}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: because
    c/helper/research#0/inner:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: it rained
expect:
  output:
    status: succeeded
    output: because
