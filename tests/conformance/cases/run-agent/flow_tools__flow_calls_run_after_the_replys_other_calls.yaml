# A reply calls [shout, lookup, shout]: the host tool `lookup` runs as the reply's calls are made;
# each flow call grows its own scope (`#0`, `#1`) once the reply's calls are made, and the scopes
# run after it. The model reads the three results in call order.
kind: run
flow: |
  id: helping
  name: helping
  llm_config: {provider: anthropic, model: claude-test}
  defs:
    shout:
      description: Shout the text back.
      input:
        text: !str
      nodes:
        loud:
          kind: code
          input:
            text: ${input.text}
          output: !str
          code: return inputs.text.toUpperCase()
      output: ${loud.output}
  nodes:
    helper:
      kind: agent
      tools: [shout, lookup]
      system_prompt: Help.
      prompt: hi
      output: !str
  output: ${helper.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: found:b
  models:
    helper:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-a
            name: shout
            arguments: {text: a}
          - type: tool_call
            id: call-b
            name: lookup
            arguments: {topic: b}
          - type: tool_call
            id: call-c
            name: shout
            arguments: {text: c}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: all done
        request:
          messages:
          - format: yian.message.v1
            role: system
            parts:
            - type: text
              text: Help.
          - format: yian.message.v1
            role: user
            parts:
            - type: text
              text: hi
          - format: yian.message.v1
            role: assistant
            parts:
            - type: tool_call
              id: call-a
              name: shout
              arguments: {text: a}
            - type: tool_call
              id: call-b
              name: lookup
              arguments: {topic: b}
            - type: tool_call
              id: call-c
              name: shout
              arguments: {text: c}
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-a
              name: shout
              content: A
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-b
              name: lookup
              content: found:b
          - format: yian.message.v1
            role: tool
            parts:
            - type: tool_result
              call_id: call-c
              name: shout
              content: C
          tools:
          - name: shout
            description: Shout the text back.
            parameters:
              additionalProperties: false
              properties:
                text: {title: Text, type: string}
              required: [text]
              type: object
          - name: lookup
            description: Look up a topic.
            parameters:
              type: object
              properties:
                topic: {type: string}
              required: [topic]
expect:
  output:
    status: succeeded
    output: all done
