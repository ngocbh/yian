# The hook runs `lookup` and holds `save`, both in the reply's first group, so `lookup` runs and the
# hold's `pending` step records its source and the group's last call. `send`, in a later group,
# waits unchecked: the node waits on the hold alone. `complete` answers the hold without running
# `save`; the woken agent then checks and runs `send`, and the model reads the host's answer.
kind: run
flow: |
  id: held
  name: held
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    agent:
      kind: agent
      tools: [lookup, save, send]
      system_prompt: Help.
      prompt: hi
      output: !str
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    lookup: {parameters: {type: object, properties: {}}, concurrency_safe: true, results: [{return: found}]}
    save: {parameters: {type: object, properties: {}}, concurrency_safe: true, results: []}
    send: {parameters: {type: object, properties: {}}, results: [{return: sent}]}
  gate:
    lookup: [{run: true}]
    save: [{hold: true}]
    send: [{run: true}]
  sends:
  - {complete: r1/agent/1/1, output: saved by hand}
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: lookup, arguments: {}}
          - {type: tool_call, id: c2, name: save, arguments: {}}
          - {type: tool_call, id: c3, name: send, arguments: {}}
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: done}]}
        request:
          messages:
          - {format: yian.message.v1, role: system, parts: [{type: text, text: Help.}]}
          - {format: yian.message.v1, role: user, parts: [{type: text, text: hi}]}
          - format: yian.message.v1
            role: assistant
            parts:
            - {type: tool_call, id: c1, name: lookup, arguments: {}}
            - {type: tool_call, id: c2, name: save, arguments: {}}
            - {type: tool_call, id: c3, name: send, arguments: {}}
          - {format: yian.message.v1, role: tool, parts: [{type: tool_result, call_id: c1, name: lookup, content: found}]}
          - {format: yian.message.v1, role: tool, parts: [{type: tool_result, call_id: c2, name: save, content: saved by hand}]}
          - {format: yian.message.v1, role: tool, parts: [{type: tool_result, call_id: c3, name: send, content: sent}]}
          tools:
          - {name: lookup, description: "", parameters: {type: object, properties: {}}}
          - {name: save, description: "", parameters: {type: object, properties: {}}}
          - {name: send, description: "", parameters: {type: object, properties: {}}}
expect:
  output: {status: succeeded, output: done}
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: c1, name: lookup, type: tool_call}, {arguments: {}, id: c2, name: save, type: tool_call}, {arguments: {}, id: c3, name: send, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 80ca7a7f4faa1f8643d6af8efd1a03d03f8c13db9302634aabcb0e4e0ecdbd0b, response_id: null, usage: null}}], [node_step, agent, {n: 2, step: {call_id: r1/agent/1/1, group_end: 1, held: true, index: 1, kind: pending, reply: 1, source: {group: null, kind: host, tool: save}, tool: save, tool_call_id: c2}}], [node_step, agent, {n: 3, step: {call_id: c1, is_error: false, kind: tool_result, output: found}}], [node_waiting, agent, {call_ids: [r1/agent/1/1]}], [run_waiting, null, {node_ids: [agent]}], [node_step, agent, {n: 4, step: {call_id: c2, is_error: false, kind: tool_result, output: saved by hand}}], [node_woken, agent], [node_step, agent, {n: 5, step: {call_id: c3, is_error: false, kind: tool_result, output: sent}}], [node_step, agent, {n: 6, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: f6e9a5faec5442459e2d63284eb883fd4146111957348fb6cdb22a893b5c5bdf, response_id: null, usage: null}}], [pool_commit, agent, {value: done}], [pool_commit, agent, {key: agent.new_messages, steps: [9, 11, 14, 16, 17]}], [node_succeeded, agent, {commit: 18, messages: 19}], [node_started, __end__], [pool_commit, __end__, {value: done}], [node_succeeded, __end__, {commit: 22}]]
  events: [[RunStarted], [NodeStarted, {node_id: __start__}], [NodeSucceeded, {node_id: __start__, output: {}, interrupted: false}], [NodeStarted, {node_id: agent}], [ModelCallStarted, {node_id: agent, n: 1, purpose: chat, provider: anthropic, model: claude-test}], [ModelCallFinished, {node_id: agent, n: 1, purpose: chat, provider: anthropic, model: claude-test}], [CallHeld, {node_id: agent, call_id: r1/agent/1/1, tool: save}], [ToolCallStarted, {node_id: agent, n: 1, call_index: 0, tool_call_id: c1, name: lookup, arguments: {}}], [ToolCallFinished, {node_id: agent, n: 1, call_index: 0, tool_call_id: c1, name: lookup, result: found}], [NodeWaiting, {node_id: agent, call_ids: [r1/agent/1/1]}], [RunWaiting, {node_ids: [agent]}], [NodeWoken, {node_id: agent, timed_out: []}], [ToolCallStarted, {node_id: agent, n: 1, call_index: 2, tool_call_id: c3, name: send, arguments: {}}], [ToolCallFinished, {node_id: agent, n: 1, call_index: 2, tool_call_id: c3, name: send, result: sent}], [ModelCallStarted, {node_id: agent, n: 6, purpose: chat, provider: anthropic, model: claude-test}], [ModelCallFinished, {node_id: agent, n: 6, purpose: chat, provider: anthropic, model: claude-test}], [NodeSucceeded, {node_id: agent, output: done, interrupted: false}], [NodeStarted, {node_id: __end__}], [NodeSucceeded, {node_id: __end__, output: done, interrupted: false}], [RunSucceeded, {output: done}]]
  tool_calls: {lookup: [{args: {}, call_id: r1/agent/1/0, attempt: 1, node: agent}], send: [{args: {}, call_id: r1/agent/1/2, attempt: 1, node: agent}]}
