# The hook refuses a memory's tool (`lessons_append`), a granted flow (`review`) and a tool
# module's export (`quote`), each with its own text. None runs: the memory keeps its file, the
# flow call grows no scope, and the module's `execute` isn't called. The model reads each text as
# the call's error. (The conformance host has no MCP server, and `load_skill` is never checked.)
kind: run
flow: |
  id: refusals
  name: refusals
  llm_config: {provider: anthropic, model: claude-test}
  input:
    lessons: !FileMemory
  uses:
    quote: ./tools.ts:quote
  defs:
    review:
      description: Review the text.
      input:
        text: !str
      nodes:
        checker:
          kind: agent
          input:
            text: ${input.text}
          system_prompt: Check.
          prompt: ${text}
          output: !str
      output: ${checker.output}
  nodes:
    helper:
      kind: agent
      input:
        lessons: ${input.lessons}
      tools: [{lessons: [append]}, review, quote]
      system_prompt: Help.
      prompt: hi
      output: !str
  output: ${helper.output}
files:
  tools.ts: |
    export const quote = {
      name: "quote",
      description: "Price an order.",
      parameters: { type: "object", properties: { qty: { type: "integer" } }, required: ["qty"] },
      execute: () => { throw new Error("quote ran"); },
    };
run: {run_id: r1, num_workers: 0}
host:
  memory:
    lessons: {type: FileMemory, id: t/lessons, files: {notes.md: Keep it short.}}
  gate:
    lessons_append: [{refuse: No notes today.}]
    review: [{refuse: No reviews.}]
    quote: [{refuse: No prices.}]
  models:
    helper:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: lessons_append, arguments: {path: notes.md, text: Check sums.}}
          - {type: tool_call, id: c2, name: review, arguments: {text: draft}}
          - {type: tool_call, id: c3, name: quote, arguments: {qty: 3}}
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: done}]}
expect:
  output: {status: succeeded, output: done}
  trace: [[run_started, null, {effective_llm_by_static_path: {helper: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}, helper/review/checker: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {lessons: {memory: {identity: t/lessons, recall: {cut: null, hint: {text: 'Read them with {tool}.', tool: read}, text: 'notes.md: Keep it short.'}, settings: {index: MEMORY.md, max_change_ids: 10000, max_depth: 4, max_file_chars: 100000, max_files: 1000, max_history_chars: 1000000, max_read_chars: 20000, max_recall_chars: 8000, max_results: 100, max_total_chars: 1000000, max_undo: 100}, tools: [{description: "List the memory's files, each with its hash and its size in characters. Pass dir to list one folder.", name: list, parameters: {additionalProperties: false, properties: {dir: {description: A folder of the memory to list; the whole memory when omitted., type: string}}, required: [], type: object}, write: false}, {description: "Read a file of the memory: its text, from line offset for limit lines, and the file's hash, which delete and rewrite take as if_hash.", name: read, parameters: {additionalProperties: false, properties: {limit: {description: The most lines to read; the rest of the file when omitted., minimum: 1.0, type: integer}, offset: {description: 'The first line to read, counting from one; one when omitted.', minimum: 1.0, type: integer}, path: {description: "A file's path in the memory, such as `notes/tools.md`: folders and a file name made of letters, digits, `.`, `_` and `-`, each starting with a letter or digit.", type: string}}, required: [path], type: object}, write: false}, {description: "Find the lines that hold query, ig