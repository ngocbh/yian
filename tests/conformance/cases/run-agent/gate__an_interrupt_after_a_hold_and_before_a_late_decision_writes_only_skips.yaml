# The hook holds `save` at once and answers `send` through a Promise; the interrupt lands while
# that Promise is out. The group's decisions are written only once all are in, so the hold is
# never written: both calls are skipped, and nothing faults.
kind: run
flow: |
  id: m5
  name: m5
  llm_config: {provider: anthropic, model: claude-test}
  input:
    notes: !Inbox(str)
  nodes:
    agent:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [save, send]
      prompt: hi
      output: !Optional(str)
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    save: {parameters: {type: object, properties: {}}, concurrency_safe: true, results: []}
    send: {parameters: {type: object, properties: {}}, concurrency_safe: true, results: []}
  gate:
    save: [{hold: true}]
    send: [{run: true, later: true}]
  sends:
  - {interrupt: notes, after: {node: agent, gate_call: 2}}
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: save, arguments: {}}
          - {type: tool_call, id: c2, name: send, arguments: {}}
expect:
  output: {status: succeeded, output: null}
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {notes: {inbox: notes}}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: c1, name: save, type: tool_call}, {arguments: {}, id: c2, name: send, type: tool_call}], role: assistant}, purpose: chat, request_sha256: b9f9476a52a866c8d5bfc7c677b7cce7186d0d6e67a541f4d3ffcaffb7562e78, response_id: null, usage: null}}], [interrupted, null, {inbox: notes, nodes: [agent]}], [node_step, agent, {n: 2, step: {call_id: c1, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}}], [node_step, agent, {n: 3, step: {call_id: c2, closed: skipped, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}}], [node_step, agent, {n: 4, step: {by: 10, kind: interrupted}}], [pool_commit, agent], [pool_commit, agent, {key: agent.new_messages, steps: [9, 11, 12, 13]}], [node_succeeded, agent, {commit: 14, messages: 15}], [node_started, __end__], [pool_commit, __end__], [node_succeeded, __end__, {commit: 18}]]
  gate_calls: [{tool: save, call_id: r1/agent/1/0, node: agent, source: {kind: host, group: null, tool: save}, arguments: {}, attempt: 1, scopes: []}, {tool: send, call_id: r1/agent/1/1, node: agent, source: {kind: host, group: null, tool: send}, arguments: {}, attempt: 1, scopes: []}]
