# A release, then an interrupt, land on the same wait. The interrupt closes the waiting node's
# released call: it never runs, its closer reads "Not run", and the agent ends null.
kind: run
flow: |
  id: closerelease
  name: closerelease
  llm_config: {provider: anthropic, model: claude-test}
  input:
    notes: !Inbox(str)
  nodes:
    agent:
      kind: agent
      steer_inbox: ${input.notes}
      tools: [save]
      prompt: hi
      output: !Optional(str)
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    save: {parameters: {type: object, properties: {}}, results: []}
  gate:
    save: [{hold: true}]
  sends:
  - {release: r1/agent/1/0, hold: true}
  - {interrupt: notes}
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts: [{type: tool_call, id: c1, name: save, arguments: {}}]
expect:
  output: {status: succeeded, output: null}
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {notes: {inbox: notes}}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: c1, name: save, type: tool_call}], role: assistant}, purpose: chat, request_sha256: 41da36ba1135cbab58bd3ac89968f1984f4db4d1c40b533b081f4725e0b28030, response_id: null, usage: null}}], [node_step, agent, {n: 2, step: {call_id: r1/agent/1/0, group_end: 0, held: true, index: 0, kind: pending, reply: 1, source: {group: null, kind: host, tool: save}, tool: save, tool_call_id: c1}}], [node_waiting, agent, {call_ids: [r1/agent/1/0], steer_inbox: notes}], [run_waiting, null, {node_ids: [agent]}], [node_step, agent, {n: 3, step: {call_id: r1/agent/1/0, kind: released}}], [interrupted, null, {inbox: notes, nodes: [agent]}], [node_woken, agent], [node_step, agent, {n: 4, step: {call_id: c1, closed: interrupted, is_error: true, kind: tool_result, output: 'Not run: interrupted by the user.'}}], [node_step, agent, {n: 5, step: {by: 14, kind: interrupted}}], [pool_commit, agent], [pool_commit, agent, {key: agent.new_messages, steps: [9, 16, 17]}], [node_succeeded, agent, {commit: 18, messages: 19}], [node_started, __end__], [pool_commit, __end__], [node_succeeded, __end__, {commit: 22}]]
  gate_calls: [{tool: save, call_id: r1/agent/1/0, node: agent, source: {kind: host, group: null, tool: save}, arguments: {}, attempt: 1, scopes: []}]
