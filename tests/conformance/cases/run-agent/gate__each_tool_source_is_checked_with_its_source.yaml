# Every model-made call is checked, with where its tool comes from: a host tool (`lookup`), a host
# group's tool (`crm_find`), a memory's tool (`lessons_append`), a granted flow (`review`) and a
# tool module's export (`quote`). The agent inside the flow call is checked too, under its expanded
# node id, with the flow call enclosing it in `scopes`. Each runs, and a note lands on the flow
# call's `pending` step and on the child's result.
kind: run
flow: |
  id: sources
  name: sources
  llm_config: {provider: anthropic, model: claude-test}
  input:
    lessons: !FileMemory
  uses:
    quote: ./tools.ts:quote
  defs:
    review:
      description: Review the text.
      input:
        text: !str
      nodes:
        checker:
          kind: agent
          input:
            text: ${input.text}
          tools: [lookup]
          system_prompt: Check.
          prompt: ${text}
          output: !str
      output: ${checker.output}
  nodes:
    helper:
      kind: agent
      input:
        lessons: ${input.lessons}
      tools: [lookup, crm, {lessons: [append]}, review, quote]
      system_prompt: Help.
      prompt: hi
      output: !str
  output: ${helper.output}
files:
  tools.ts: |
    export const quote = {
      name: "quote",
      description: "Price an order.",
      parameters: { type: "object", properties: { qty: { type: "integer" } }, required: ["qty"] },
      execute: (args) => args.qty * 2,
    };
run: {run_id: r1, num_workers: 0}
host:
  memory:
    lessons: {type: FileMemory, id: t/lessons, files: {notes.md: Keep it short.}}
  tools:
    lookup:
      parameters: {type: object, properties: {q: {type: string}}}
      results:
        helper: [{return: found}]
        helper/review#0/checker: [{return: checked}]
    crm:
      group:
        find:
          parameters: {type: object, properties: {id: {type: string}}}
          results: [{return: Ada}]
  gate:
    lookup:
      helper: [{run: true}]
      helper/review#0/checker: [{run: true, note: inside review}]
    crm_find: [{run: true}]
    lessons_append: [{run: true}]
    review: [{run: true, note: flow granted}]
    quote: [{run: true}]
  models:
    helper:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: lookup, arguments: {q: x}}
          - {type: tool_call, id: c2, name: crm_find, arguments: {id: "7"}}
          - {type: tool_call, id: c3, name: lessons_append, arguments: {path: notes.md, text: Check sums.}}
          - {type: tool_call, id: c4, name: review, arguments: {text: draft}}
          - {type: tool_call, id: c5, name: quote, arguments: {qty: 3}}
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: done}]}
    helper/review#0/checker:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts: [{type: tool_call, id: k1, name: lookup, arguments: {q: draft}}]
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: fine}]}
