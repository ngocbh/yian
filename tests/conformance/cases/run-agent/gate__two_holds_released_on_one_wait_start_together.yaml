# The hook holds `save` (resumable) and `send`, one group; both are released on one wait. The wake
# is the first evaluation after both releases and starts them together. The crash sweep's cuts
# after that wake send `save` again under its call id and close `send` crashed.
kind: run
flow: |
  id: bothreleased
  name: bothreleased
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    agent:
      kind: agent
      tools: [save, send]
      prompt: hi
      output: !str
  output: ${agent.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    save: {parameters: {type: object, properties: {}}, concurrency_safe: true, resumable: true, results: [{return: saved}]}
    send: {parameters: {type: object, properties: {}}, concurrency_safe: true, results: [{return: sent}]}
  gate:
    save: [{hold: true}]
    send: [{hold: true}]
  sends:
  - {release: r1/agent/1/0, hold: true}
  - {release: r1/agent/1/1}
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: save, arguments: {}}
          - {type: tool_call, id: c2, name: send, arguments: {}}
      - reply: {format: yian.message.v1, role: assistant, parts: [{type: text, text: done}]}
expect:
  output: {status: succeeded, output: done}
  trace: [[run_started, null, {effective_llm_by_static_path: {agent: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, gated: true, num_workers: 0}], [pool_commit, __start__, {key: system.now}], [pool_commit, __start__, {key: system.run_id, value: r1}], [pool_commit, __start__, {key: system.today}], [pool_commit, __start__, {value: {}}], [node_started, __start__], [pool_commit, __start__, {value: {}}], [node_succeeded, __start__, {commit: 6}], [node_started, agent], [node_step, agent, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{arguments: {}, id: c1, name: save, type: tool_call}, {arguments: {}, id: c2, name: send, type: tool_call}], role: assistant}, purpose: chat, request_sha256: b9f9476a52a866c8d5bfc7c677b7cce7186d0d6e67a541f4d3ffcaffb7562e78, response_id: null, usage: null}}], [node_step, agent, {n: 2, step: {call_id: r1/agent/1/0, group_end: 1, held: true, index: 0, kind: pending, reply: 1, source: {group: null, kind: host, tool: save}, tool: save, tool_call_id: c1}}], [node_step, agent, {n: 3, step: {call_id: r1/agent/1/1, group_end: 1, held: true, index: 1, kind: pending, reply: 1, source: {group: null, kind: host, tool: send}, tool: send, tool_call_id: c2}}], [node_waiting, agent, {call_ids: [r1/agent/1/0, r1/agent/1/1]}], [run_waiting, null, {node_ids: [agent]}], [node_step, agent, {n: 4, step: {call_id: r1/agent/1/0, kind: released}}], [node_step, agent, {n: 5, step: {call_id: r1/agent/1/1, kind: released}}], [node_woken, agent], [node_step, agent, {n: 6, step: {call_id: c1, is_error: false, kind: tool_result, output: saved}}], [node_step, agent, {n: 7, step: {call_id: c2, is_error: false, kind: tool_result, output: sent}}], [node_step, agent, {n: 8, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: 4fe27899103afcc2fc704cf36be42eaab6fec5cbc59ee341b0192cbd9f7f3149, response_id: null, usage: null}}], [pool_commit, agent, {value: done}], [pool_commit, agent, {key: agent.new_messages, steps: [9, 17, 18, 19]}], [node_succeeded, agent, {commit: 20, messages: 21}], [node_started, __end__], [pool_commit, __end__, {value: done}], [node_succeeded, __end__, {commit: 24}]]
  tool_calls: {save: [{args: {}, call_id: r1/agent/1/0, attempt: 1, node: agent}], send: [{args: {}, call_id: r1/agent/1/1, attempt: 1, node: agent}]}
  gate_calls: [{tool: save, call_id: r1/agent/1/0, node: agent, source: {kind: host, group: null, tool: save}, arguments: {}, attempt: 1, scopes: []}, {tool: send, call_id: r1/agent/1/1, node: agent, source: {kind: host, group: null, tool: send}, arguments: {}, attempt: 1, scopes: []}]
