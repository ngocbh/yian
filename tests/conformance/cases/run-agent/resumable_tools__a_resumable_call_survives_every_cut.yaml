# An AGENT calls the resumable `save` once, then answers. A serial run expecting `output`, so
# `--crash-sweep` cuts it after every record: a cut between the reply's model_call and save's
# tool_result leaves the call with no result, and the resume sends it again rather than closing
# it `crashed`, so every resume ends as this run does.
kind: run
flow: |
  id: resumable-sweep
  name: resumable_sweep
  llm_config: {provider: anthropic, model: claude-test}
  nodes:
    writer:
      kind: agent
      tools: [save]
      system_prompt: Help.
      prompt: hi
      output: str
  output: ${writer.output}
run: {run_id: r1, num_workers: 0}
host:
  tools:
    save:
      description: Save a topic.
      resumable: true
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results:
      - return: saved:a
  models:
    writer:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: tool_call, id: c1, name: save, arguments: {topic: a}}
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: text, text: done}
expect:
  output: {status: succeeded, output: done}
  tool_calls:
    save:
    - args: {topic: a}
      call_id: r1/writer/1/0
      attempt: 1
      node: writer
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          model: claude-test
          provider: anthropic
          _connection: {method: api_key, source: environment, endpoint: null}
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, writer]
  - - node_step
    - writer
    - n: 1
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - arguments: {topic: a}
            id: c1
            name: save
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: bf0473b589bfcd5e9978f2abf632a0d658ba810e929b6b93bb30e2cb4e3f1a9f
        response_id: null
        usage: null
  - - node_step
    - writer
    - n: 2
      step: {call_id: c1, is_error: false, kind: tool_result, output: saved:a}
  - - node_step
    - writer
    - n: 3
      step:
        finish: null
        kind: model_call
        model: claude-test
        output:
          format: yian.message.v1
          parts:
          - {text: done, type: text}
          role: assistant
        purpose: chat
        request_sha256: b0d7e115f7611e626f80100ac6b750553ba8cd22a6f63257cb962532a077c8c4
        response_id: null
        usage: null
  - - pool_commit
    - writer
    - {value: done}
  - - pool_commit
    - writer
    - key: writer.new_messages
      steps: [9, 10, 11]
  - - node_succeeded
    - writer
    - {commit: 12, messages: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: done}
  - - node_succeeded
    - __end__
    - {commit: 16}
