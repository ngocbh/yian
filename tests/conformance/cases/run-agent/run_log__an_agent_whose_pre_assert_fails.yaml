# Pins: an AGENT whose pre-assert fails never renders or calls a model, so the trace shows no
# step before its failure.
kind: run
flow: |
  id: guarded
  name: guarded
  llm_config: {provider: anthropic, model: claude-test}
  input: {n: !int}
  nodes:
    writer:
      kind: agent
      input: {n: '${input.n}'}
      asserts: ['n >= 0']
      prompt: 'Write ${n} lines.'
      output: !str
  output: ${writer.output}
inputs: {n: -1}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: failed
    failure:
      code: assertion.failed
      frames:
      - label: flow.yaml
        range: [9, 15, 9, 23]
      message: "node 'writer' pre-assert failed: n >= 0"
      node: writer
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        writer:
          model: claude-test
          provider: anthropic
          _connection: {method: api_key, source: environment, endpoint: null}
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: -1}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {n: -1}
  - - node_succeeded
    - __start__
    - commit: 6
  - [node_started, writer]
  - - node_failed
    - writer
    - failure:
        code: assertion.failed
        message: "node 'writer' pre-assert failed: n >= 0"
        frames:
        - label: flow.yaml
          range: [9, 15, 9, 23]
        node: writer
