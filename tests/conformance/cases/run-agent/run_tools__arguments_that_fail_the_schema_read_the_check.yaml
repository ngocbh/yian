# A call whose arguments break the tool's schema (`topic` is a string, the model sent an int)
# never reaches the tool: it gets the check's message as its error result, and the agent goes on.
kind: run
flow: |
  id: bad-arguments
  name: bad_arguments
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    agent:
      kind: agent
      tools: [lookup]
      system_prompt: Help.
      prompt: go
      output: str
  output: ${agent.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    lookup:
      description: Look up a topic.
      parameters:
        type: object
        properties:
          topic:
            type: string
        required: [topic]
      results: []
  models:
    agent:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: tool_call
            id: call-1
            name: lookup
            arguments:
              topic: 1
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - type: text
            text: done
expect:
  output:
    status: succeeded
    output: done
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        agent:
          model: gpt-5.5
          provider: openai
          _connection: {method: api_key, source: missing, endpoint: https://api.openai.com/v1}
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, agent]
  - - node_step
    - agent
    - n: 1
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - arguments: {topic: 1}
            id: call-1
            name: lookup
            type: tool_call
          role: assistant
        purpose: chat
        request_sha256: c79a80780e256e80bd7eb9087d9ce53676d782950b9d2ad5252598fa7403acb8
        response_id: null
        usage: null
  - - node_step
    - agent
    - n: 2
      step: {call_id: call-1, is_error: true, kind: tool_result, output: "tool 'lookup' argument 'topic': 1 does not match declared type str"}
  - - node_step
    - agent
    - n: 3
      step:
        finish: null
        kind: model_call
        model: gpt-5.5
        output:
          format: yian.message.v1
          parts:
          - {text: done, type: text}
          role: assistant
        purpose: chat
        request_sha256: 20c92d3caefd2caca1d84633cd9babad7bb00a4e37ff9b9b7ba288802da8fafb
        response_id: null
        usage: null
  - - pool_commit
    - agent
    - {value: done}
  - - pool_commit
    - agent
    - key: agent.new_messages
      steps: [9, 10, 11]
  - - node_succeeded
    - agent
    - {commit: 12, messages: 13}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: done}
  - - node_succeeded
    - __end__
    - {commit: 16}
  events:
  - [RunStarted]
  - - NodeStarted
    - {node_id: __start__}
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - {node_id: agent}
  - - ModelCallStarted
    - {node_id: agent, n: 1, purpose: chat, provider: openai, model: gpt-5.5}
  - - ModelCallFinished
    - {node_id: agent, n: 1, purpose: chat, provider: openai, model: gpt-5.5}
  - - ToolCallStarted
    - node_id: agent
      n: 1
      call_index: 0
      tool_call_id: call-1
      name: lookup
      arguments: {topic: 1}
  - - ToolCallFinished
    - {node_id: agent, n: 1, call_index: 0, tool_call_id: call-1, name: lookup, error: ReportedToolError}
  - - ModelCallStarted
    - {node_id: agent, n: 3, purpose: chat, provider: openai, model: gpt-5.5}
  - - ModelCallFinished
    - {node_id: agent, n: 3, purpose: chat, provider: openai, model: gpt-5.5}
  - - NodeSucceeded
    - {node_id: agent, output: done, interrupted: false}
  - - NodeStarted
    - {node_id: __end__}
  - - NodeSucceeded
    - {node_id: __end__, output: done, interrupted: false}
  - - RunSucceeded
    - {output: done}
