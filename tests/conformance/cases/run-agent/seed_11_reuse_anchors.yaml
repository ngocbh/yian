# Three AGENTs merged from one anchored block share its provider and provider block; `judge`
# reads the other two's text.
kind: run
flow: |
  # 11 — DRY reuse with YAML anchors + x- extension keys.
  #
  # Three near-identical AGENT nodes share one config block via a YAML anchor parked
  # under an x- key. Shows: x-* extension keys (ignored by the strict schema — custom
  # metadata + a holder for the anchor), &anchor / *alias / <<: merge, and llm_config.
  # The merge is pure YAML — the YAML parser expands it before the engine sees the nodes.

  id: reuse-anchors
  name: reuse_anchors
  description: Pro/con/synthesis sharing one node config via a YAML anchor under x-.

  x-owner: ngocbh                  # custom metadata — opaque to the engine
  x-agent-defaults: &agent_defaults    # parked under x- so the strict schema ignores it
    kind: agent
    output: !str
    llm_config:
      provider: anthropic
      anthropic:
        temperature: 0.2

  input:
    topic: !str

  nodes:
    pro:
      <<: *agent_defaults          # merge the shared block in (kind + outputs + llm_config)
      input:
        topic: ${input.topic}
      prompt: "Write a neutral two-sentence pro case for ${topic}. No advice."

    con:
      <<: *agent_defaults
      input:
        topic: ${input.topic}
      prompt: "Write a neutral two-sentence con case for ${topic}. No advice."

    judge:
      <<: *agent_defaults
      input:
        topic: ${input.topic}
        pro:   ${pro.output}
        con:   ${con.output}
      prompt: |-
        Given a pro case (${pro}) and a con case (${con}) for ${topic},
        write a neutral one-paragraph synthesis. No advice.

  output: ${judge.output}
# The merged `llm_config` names `anthropic` with no model, and run start needs one, so
# `run.llm_config` gives it; the node's own provider and `anthropic` block win over that layer.
# With no saved login, a non-OpenAI provider's connection is recorded as from the environment
# with no endpoint, key or no key; the key is set so a real run could authenticate.
env: {ANTHROPIC_API_KEY: "<key:1>"}
inputs: {topic: ACME}
run: {run_id: r1, num_workers: 0, llm_config: {provider: anthropic, model: claude-opus-4-8}}
host:
  models:
    pro:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME grows. Margins widen.}]
    con:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME is costly. Rivals gain.}]
    judge:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: ACME grows while rivals gain.}]
expect:
  output: {status: succeeded, output: ACME grows while rivals gain.}
  # For a provider other than OpenAI, the connection is recorded as `source: environment` and
  # `endpoint: null`; `docs/` doesn't give these fields.
  trace:
    - - run_started
      - null
      - num_workers: 0
        effective_llm_by_static_path:
          pro:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.2}
            _connection: {method: api_key, source: environment, endpoint: null}
          con:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.2}
            _connection: {method: api_key, source: environment, endpoint: null}
          judge:
            provider: anthropic
            model: claude-opus-4-8
            anthropic: {temperature: 0.2}
            _connection: {method: api_key, source: environment, endpoint: null}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: ACME}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: ACME}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, pro]
    - [node_step, pro, {n: 1, step: {finish: null, kind: model_call, model: claude-opus-4-8, output: {format: yian.message.v1, parts: [{text: ACME grows. Margins widen., type: text}], role: assistant}, purpose: chat, request_sha256: 5bdbb405a98118c41c318d785a69ce2b79385ac14cb036aad702b1f35f000432, response_id: null, usage: null}}]
    - [pool_commit, pro, {value: ACME grows. Margins widen.}]
    - [pool_commit, pro, {key: pro.new_messages, steps: [9]}]
    - [node_succeeded, pro, {commit: 10, messages: 11}]
    - [node_started, con]
    - [node_step, con, {n: 1, step: {finish: null, kind: model_call, model: claude-opus-4-8, output: {format: yian.message.v1, parts: [{text: ACME is costly. Rivals gain., type: text}], role: assistant}, purpose: chat, request_sha256: 0f2c27d464f707be51a340f8b604eb02a5d20c669e3a170b8294ce19d84448b6, response_id: null, usage: null}}]
    - [pool_commit, con, {value: ACME is costly. Rivals gain.}]
    - [pool_commit, con, {key: con.new_messages, steps: [14]}]
    - [node_succeeded, con, {commit: 15, messages: 16}]
    - [node_started, judge]
    - [node_step, judge, {n: 1, step: {finish: null, kind: model_call, model: claude-opus-4-8, output: {format: yian.message.v1, parts: [{text: ACME grows while rivals gain., type: text}], role: assistant}, purpose: chat, request_sha256: a73c07e59cf332584a435d6d1dfb48aa933b0b0e84790e6350f90064cc1c1148, response_id: null, usage: null}}]
    - [pool_commit, judge, {value: ACME grows while rivals gain.}]
    - [pool_commit, judge, {key: judge.new_messages, steps: [19]}]
    - [node_succeeded, judge, {commit: 20, messages: 21}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: ACME grows while rivals gain.}]
    - [node_succeeded, __end__, {commit: 24}]
