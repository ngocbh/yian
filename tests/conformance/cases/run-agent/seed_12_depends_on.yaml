# The `depends_on:` edge runs `warm_cache` before `fetch`, though no data flows between them;
# then the AGENT writes the note from `fetch`'s values.
kind: run
flow: |
  # 12 — Explicit run-ordering with depends_on / runs_after.
  #
  # Most edges are inferred from ${...} data bindings. When a node must run AFTER
  # another with no data flowing between them (a side effect — priming a shared
  # cache), an ORDERING edge adds the constraint. Two forms are available:
  #   - `depends_on: [X]` — run after X AND co-skip if X is skipped ("I need X").
  #   - `runs_after:  [X]` — run after X but still run if X is skipped (pure order).
  # Both gate on X settling. This seed uses `depends_on` (the source `warm_cache` is
  # unconditional, so it always runs); the co-skip vs survive distinction only shows
  # when the source sits behind a `case`.
  # Shows: depends_on, a bool output nobody binds, and a CODE side-effect node.

  id: depends-on
  name: depends_on_demo
  description: Run a cache-priming side-effect node before fetch via depends_on (no data binding).

  input:
    topic: !str

  nodes:
    warm_cache:
      kind: code
      input:
        topic: ${input.topic}
      output: !bool               # returns true; nothing binds it
      code: ./fixtures/seeds.ts:prime_cache

    fetch:
      kind: code
      depends_on: [warm_cache]     # ordering edge — run AFTER warm_cache even though we do
      input:                      #   not consume its output (it primed a shared cache)
        topic: ${input.topic}
      output:
        values: !list(float)
        news: !list(str)
      code: ./fixtures/seeds.ts:fetch_facts

    note:
      kind: agent
      input:
        topic: ${input.topic}
        values: ${fetch.output.values}
      output: !str
      prompt: "Write a neutral one-line note on ${topic} given recent closes ${values}. No advice."

  output: ${note.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: rates}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    note:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates closed between 99.75 and 102.25.}]
expect:
  output: {status: succeeded, output: Rates closed between 99.75 and 102.25.}
  trace:
    - - run_started
      - null
      - num_workers: 0
        effective_llm_by_static_path:
          note:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: rates}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: rates}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, warm_cache]
    - [pool_commit, warm_cache, {value: true}]
    - [node_succeeded, warm_cache, {commit: 9}]
    - [node_started, fetch]
    - - pool_commit
      - fetch
      - value:
          news: ['RATES: quarterly update', 'RATES: reviewer note']
          values: [100, 101.5, 99.75, 102.25]
    - [node_succeeded, fetch, {commit: 12}]
    - [node_started, note]
    - [node_step, note, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Rates closed between 99.75 and 102.25., type: text}], role: assistant}, purpose: chat, request_sha256: 6b000b064064803a2ad817123053af251d31619d1be540ae41d22b91947453e5, response_id: null, usage: null}}]
    - [pool_commit, note, {value: Rates closed between 99.75 and 102.25.}]
    - [pool_commit, note, {key: note.new_messages, steps: [15]}]
    - [node_succeeded, note, {commit: 16, messages: 17}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: Rates closed between 99.75 and 102.25.}]
    - [node_succeeded, __end__, {commit: 20}]
