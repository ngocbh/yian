# The human approves, the `case ... on` the answer takes `settle`, the sleep's past deadline returns
# at once with no value, and `confirm` runs after it and returns the answer; `abort` is skipped.
# No `tool_calls`: the form of the `ask_user` tool's `answer_schema` isn't documented, so it isn't pinned.
kind: run
flow: |
  # 17 — Effects: ask + sleep.
  #
  # Propose an action, ask a human to APPROVE it (tool_id: ask, a TYPED answer), route on
  # the answer, SLEEP until a settle time, then confirm (a side effect). Shows:
  # tool_id: ask (input prompt, `output:` the answer validated against a type),
  # tool_id: sleep (input until), `case … on` routing the human's answer, and depends_on: to
  # order a side-effect node after the sleep with no data binding.
  #
  # `ask` goes through the host's ask handler, which answers or holds the call; `sleep` waits
  # until its absolute UTC deadline and then returns None. This seed pins both effects in the
  # Compose surface and proves the human answer feeds an ordinary CASE before the UTC sleep.
  # The answer is validated at the same typed Output boundary as every other node value.

  id: effects
  name: effects_human_wait
  description: Propose an action, get human approval, wait until settle, then confirm.

  typedefs:
    Approval: Literal(approve, reject)    # the typed human answer (a tag-only enum)

  input:
    topic: !str
    settle_at: !date                       # when to confirm

  nodes:
    propose:
      kind: agent
      input:
        topic: ${input.topic}
      output: str
      prompt: "Propose one concrete, neutral action for ${topic} in a single sentence."

    approve:
      kind: tool
      tool_id: ask
      input:
        prompt: "Approve this action? ${propose.output}  (approve / reject)"
      output: Approval                   # the injected answer is validated against Approval's tags

    gate:
      kind: case                          # route on the human's answer (simple form)
      on: ${approve.output}
      cases:
        - when: approve
          then: settle
      else: abort

    settle:
      kind: tool
      tool_id: sleep
      input:
        until: ${input.settle_at}        # a date means midnight UTC
      # `sleep` produces no meaningful value — downstream orders after it via depends_on.

    confirm:
      kind: code
      depends_on: [settle]                # ordering edge — run after the sleep (side effect)
      input:
        action: ${propose.output}
        answer: ${approve.output}
      output: str
      code: ./fixtures/seeds.ts:confirm_action

    abort:
      kind: agent
      input:
        action: ${propose.output}
      output: str
      prompt: "Write one neutral sentence noting this action was NOT approved: ${action}."

  # settle/confirm run only on approve; abort runs otherwise. Coalesce picks whichever ran.
  output: ${confirm.output | abort.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
# A past `settle_at`, so the WAIT doesn't block.
inputs: {topic: rates, settle_at: "2026-01-01"}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  human:
    approve: [approve]
  models:
    propose:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Review the rate outlook on Friday.}]
expect:
  output: {status: succeeded, output: approve}
  # Run start resolves every AGENT, the skipped ones included; a skipped node writes no record.
  trace:
    - - run_started
      - null
      - learnable: false
        num_workers: 0
        effective_llm_by_static_path:
          propose:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
          abort:
            provider: openai
            model: gpt-5.5
            _connection: {method: api_key, source: environment, endpoint: "https://api.openai.com/v1"}
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {settle_at: 2026-01-01, topic: rates}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: rates, settle_at: "2026-01-01"}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, propose]
    - [node_step, propose, {n: 1, step: {finish: null, kind: model_call, model: gpt-5.5, output: {format: yian.message.v1, parts: [{text: Review the rate outlook on Friday., type: text}], role: assistant}, purpose: chat, request_sha256: 7ccf55d9cb98612e7f7b78de5e5b01b74506f38fba0ab63aac2573b811b4e23f, response_id: null, usage: null}}]
    - [pool_commit, propose, {value: Review the rate outlook on Friday.}]
    - [pool_commit, propose, {key: propose.new_messages, steps: [9]}]
    - [node_succeeded, propose, {commit: 10, messages: 11}]
    - [node_started, approve]
    - [pool_commit, approve, {value: approve}]
    - [node_succeeded, approve, {commit: 14}]
    - [node_started, gate]
    - [node_routed, gate, {handle: settle}]
    - [node_started, settle]
    # A WAIT's value is null: the null value is left out, and so is the empty payload.
    - [pool_commit, settle]
    - [node_succeeded, settle, {commit: 19}]
    - [node_started, confirm]
    - [pool_commit, confirm, {value: approve}]
    - [node_succeeded, confirm, {commit: 22}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: approve}]
    - [node_succeeded, __end__, {commit: 25}]
