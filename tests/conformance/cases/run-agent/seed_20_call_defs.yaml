# A `call` to an in-file `defs:` callable grows its CODE and AGENT nodes under `brief/`; the
# child's AGENT reply is the flow's output.
kind: run
flow: |
  # 20 — CALL + defs: an in-file callable (a multi-node sub-flow).
  #
  # `defs:` holds in-file callables — a `call:` resolves DEFS-FIRST, else an external flow.
  # Here `enrich` is a 2-node sub-flow (CODE fetch -> AGENT summarize) that lives in THIS
  # file; the top-level flow calls it. A multi-node def lets a self-contained branch live
  # inline instead of as a separate flow file (and the flow loads resolver-free — the
  # callable is in-file). Shows: a `defs:` section, a multi-node callable (`input:`
  # signature + `nodes:` body + `output:` codomain), and a `call:` resolving to it.

  id: call-defs
  name: call_defs
  description: Call an in-file multi-node `defs:` callable to enrich one topic.

  input:
    topic: !str

  defs:
    enrich:                      # an in-file callable — a 2-node sub-flow
      input:
        topic: !str
      nodes:
        fetch:
          kind: code
          code: ./fixtures/seeds.ts:fetch_facts
          input:
            topic: ${input.topic}
          output:               # the callee's intermediate record
            values: !list(float)
            news: !list(str)
        summarize:
          kind: agent
          input:
            news: ${fetch.output.news}    # dot into the fetch record
          output: !str
          prompt: |-
            Summarize these headlines in one neutral sentence (no recommendations):
            ${news}
      output: ${summarize.output}        # the callee's codomain (its single value)

  nodes:
    brief:
      kind: call
      call: enrich               # resolves to the in-file def above (defs-first)
      input:
        topic: ${input.topic}

  output: ${brief.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: rates}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    brief/summarize:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates had a quarterly update and a reviewer note.}]
expect:
  output: {status: succeeded, output: Rates had a quarterly update and a reviewer note.}
