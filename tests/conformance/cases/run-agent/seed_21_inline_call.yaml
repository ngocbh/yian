# The inline `call(enrich, ...)` runs as the generated CALL node `__call_0`, which grows the
# child's CODE node; `summary` reads the child's headlines.
kind: run
flow: |
  # 21 — inline call(f, ...) directive: a flow call written as a binding's whole value.
  #
  # An inline call is SUGAR: `call(enrich, topic=${input.topic})` written as a node
  # input's whole value desugars AT LOAD into an anonymous `call` node (kind: call), and the host
  # binding becomes `${<synth>.output}` — pure surface sugar, no new runtime kind. It
  # is the applicative form of seed 20's named `call` node: write `f x` inline instead
  # of declaring a separate node for it. Shows: an inline call in a node input, keyword
  # args whose values are full bindings (a `${ref}` here), and resolution DEFS-FIRST
  # (the callee is the in-file `enrich` def, so the flow loads resolver-free).

  id: inline-call
  name: inline_call
  description: Enrich one topic via an INLINE call expression (sugar over a call node).

  input:
    topic: !str

  defs:
    enrich:                      # an in-file callable — a sub-flow (as in seed 20)
      input:
        topic: !str
      nodes:
        fetch:
          kind: code
          code: ./fixtures/seeds.ts:fetch_facts
          input:
            topic: ${input.topic}
          output:
            values: list(float)
            news: list(str)
      output: ${fetch.output.news}     # the callee's codomain (the headlines)

  nodes:
    summary:
      kind: agent
      input:
        # INLINE call directive: desugars to a synth `call` node (call: enrich) whose value
        # (list(str) of headlines) this input then binds — equivalent to declaring a
        # separate `kind: call` node and referencing ${<that node>.output}.
        news: call(enrich, topic=${input.topic})
      output: str
      prompt: |-
        Summarize these headlines in one neutral sentence (no recommendations):
        ${news}

  output: ${summary.output}
# The flow names no provider or model, so `run.llm_config` gives both; run start resolves
# them, and the key makes the recorded connection source `environment`, which the trace pins.
env: {OPENAI_API_KEY: "<key:1>"}
inputs: {topic: rates}
run: {run_id: r1, num_workers: 0, llm_config: {provider: openai, model: gpt-5.5}}
host:
  models:
    summary:
      agent:
        - reply:
            format: yian.message.v1
            role: assistant
            parts: [{type: text, text: Rates had a quarterly update and a reviewer note.}]
expect:
  output: {status: succeeded, output: Rates had a quarterly update and a reviewer note.}
