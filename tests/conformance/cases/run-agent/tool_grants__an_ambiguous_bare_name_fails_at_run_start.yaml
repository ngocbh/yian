# A bare name two groups hold as different tools is ambiguous; run start refuses it with the
# group form as the fix, before any record is written.
kind: run
flow: |
  id: grants
  name: grants
  llm_config: {provider: openai, model: gpt-5.5}
  nodes:
    chat:
      kind: agent
      tools: [search]
      prompt: Find retries.
      output: !str
  output: ${chat.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    docs:
      group:
        search:
          parameters: {type: object}
          results: []
    web:
      group:
        search:
          parameters: {type: object}
          results: []
expect:
  raises:
    class: RangeError
    message: "AGENT node 'chat' grants 'search': 'search' is a tool of groups 'docs' and 'web'; grant one as `{docs: [search]}`"
  trace: []
