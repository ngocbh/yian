kind: run
flow: |
  id: f
  name: f
  input:
    cmd: !str
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: a
          then: __value_0
      else: reply
    reply:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: replied
      output: str
    __value_0:
      kind: code
      code: |
        return 'own'
      output: str
  output: ${route.output}
inputs:
  cmd: a
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: own
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {cmd: a}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        cmd: a
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: __value_0
  - [node_started, __value_0]
  - - pool_commit
    - __value_0
    - value: own
  - - node_succeeded
    - __value_0
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: own
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        cmd: a
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: __value_0
      node_id: route
  - - NodeSkipped
    - node_id: reply
  - - NodeStarted
    - node_id: __value_0
  - - NodeSucceeded
    - node_id: __value_0
      output: own
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: own
      interrupted: false
  - - RunSucceeded
    - output: own
