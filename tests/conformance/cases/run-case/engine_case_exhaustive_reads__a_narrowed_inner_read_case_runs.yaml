kind: run
flow: |
  id: f
  name: f
  typedefs:
    Buy:
      action: Literal(buy)
      qty: int
    Sell:
      action: Literal(sell)
      price: float
  input:
    kind: !str
  nodes:
    d:
      kind: code
      input:
        kind: ${input.kind}
      code: |
        if (inputs["kind"] === "buy")
          return {action: "buy", qty: 3}
        return {action: "sell", price: 1.5}
      output: !Union(Buy;Sell)
    route:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: inner
      else: sold
    inner:
      kind: case
      on: ${d.output.action}
      cases:
        - when: buy
          then: bought
    bought: !str "bought ${d.output.qty}"
    sold: !str sold
  output: ${route.output}
inputs:
  kind: buy
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: bought 3
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {kind: buy}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        kind: buy
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - pool_commit
    - d
    - value:
        action: buy
        qty: 3
  - - node_succeeded
    - d
    - {commit: 9}
  - [node_started, route]
  - - node_routed
    - route
    - handle: inner
  - [node_started, inner]
  - - node_routed
    - inner
    - handle: bought
  - [node_started, bought]
  - - pool_commit
    - bought
    - value: bought 3
  - - node_succeeded
    - bought
    - {commit: 16}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: bought 3
  - - node_succeeded
    - __end__
    - {commit: 19}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        kind: buy
      interrupted: false
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        action: buy
        qty: 3
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: inner
      node_id: route
  - - NodeSkipped
    - node_id: sold
  - - NodeStarted
    - node_id: inner
  - - NodeRouted
    - handle: bought
      node_id: inner
  - - NodeStarted
    - node_id: bought
  - - NodeSucceeded
    - node_id: bought
      output: bought 3
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: bought 3
      interrupted: false
  - - RunSucceeded
    - output: bought 3
