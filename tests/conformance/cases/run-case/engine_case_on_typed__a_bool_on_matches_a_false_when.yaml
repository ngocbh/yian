kind: run
flow: |
  id: f
  name: f
  input:
    n: !bool
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: true
          then: one
        - when: false
          then: two
      else: other
    one:
      kind: code
      code: |
        return "one"
      output: str
    two:
      kind: code
      code: |
        return "two"
      output: str
    other:
      kind: code
      code: |
        return "other"
      output: str
  output: ${one.output | two.output | other.output}
inputs:
  n: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: two
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: two
  - [node_started, two]
  - - pool_commit
    - two
    - value: two
  - - node_succeeded
    - two
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: two
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: false
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: two
      node_id: route
  - - NodeSkipped
    - node_id: one
  - - NodeSkipped
    - node_id: other
  - - NodeStarted
    - node_id: two
  - - NodeSucceeded
    - node_id: two
      output: two
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: two
      interrupted: false
  - - RunSucceeded
    - output: two
