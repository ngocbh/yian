kind: run
flow: |
  id: f
  name: f
  input:
    n: !bool
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: true
          then: v0
        - when: false
          then: v1
    v0: !str "yes"
    v1: !str "no"
  output: ${route.output}
inputs:
  n: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: no
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {n: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        n: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: v1
  - [node_started, v1]
  - - pool_commit
    - v1
    - value: no
  - - node_succeeded
    - v1
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: no
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        n: false
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: v1
      node_id: route
  - - NodeSkipped
    - node_id: v0
  - - NodeStarted
    - node_id: v1
  - - NodeSucceeded
    - node_id: v1
      output: no
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: no
      interrupted: false
  - - RunSucceeded
    - output: no
