kind: run
flow: |2

  id: cvc
  name: case_value_consumer
  input:
    seed: !float
    topic: !str
  nodes:
    s:
      kind: code
      code: ./fixtures/compose_codefns.ts:score
      input:
        seed: ${input.seed}
      output: !float
    gate:
      kind: case
      cases:
        - when: "s.output >= 0.5"
          then: pro
      else: caut
    pro:
      kind: code
      code: ./fixtures/compose_codefns.ts:positive
      input:
        topic: ${input.topic}
      output: !str
    caut:
      kind: code
      code: ./fixtures/compose_codefns.ts:cautious
      input:
        topic: ${input.topic}
      output: !str
    summary:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: ${gate.output}
      output: !str
  output: ${summary.output}
inputs:
  seed: 0.9
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: pro case for ACME
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {seed: 0.9, topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        seed: 0.9
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, s]
  - - pool_commit
    - s
    - value: 0.9
  - - node_succeeded
    - s
    - {commit: 9}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: pro
  - [node_started, pro]
  - - pool_commit
    - pro
    - value: pro case for ACME
  - - node_succeeded
    - pro
    - {commit: 14}
  - [node_started, summary]
  - - pool_commit
    - summary
    - value: pro case for ACME
  - - node_succeeded
    - summary
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: pro case for ACME
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        seed: 0.9
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: s
  - - NodeSucceeded
    - node_id: s
      output: 0.9
      interrupted: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: pro
      node_id: gate
  - - NodeSkipped
    - node_id: caut
  - - NodeStarted
    - node_id: pro
  - - NodeSucceeded
    - node_id: pro
      output: pro case for ACME
      interrupted: false
  - - NodeStarted
    - node_id: summary
  - - NodeSucceeded
    - node_id: summary
      output: pro case for ACME
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: pro case for ACME
      interrupted: false
  - - RunSucceeded
    - output: pro case for ACME
