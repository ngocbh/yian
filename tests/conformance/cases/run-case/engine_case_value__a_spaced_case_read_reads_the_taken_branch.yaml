kind: run
flow: |
  id: f
  name: f
  input:
    big: !bool
  nodes:
    gate:
      kind: case
      cases:
        - when: input.big
          then: slow
      else: fast
    slow: {kind: code, output: {k: str}, code: "return {k: 'b'}"}
    fast: {kind: code, output: {k: str}, code: "return {k: 'a'}"}
  output:
    whole: ${gate . output}
    field: ${gate.output . k}
inputs: {big: true}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: {whole: {k: b}, field: b}
  trace:
  - [run_started, null, {learnable: false, num_workers: 0}]
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {big: true}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {big: true}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - {handle: slow}
  - [node_started, slow]
  - - pool_commit
    - slow
    - value: {k: b}
  - - node_succeeded
    - slow
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        field: b
        whole: {k: b}
  - - node_succeeded
    - __end__
    - {commit: 14}
