kind: run
flow: |2

  id: f
  name: f
  typedefs:
    Small: int(0..9)
  input:
    v: !int
  nodes:
    gate:
      kind: case
      cases:
        - when: "Small(input.v) > 4"
          then: hot
      else: cold
    hot: {kind: code, code: "return 'hot'", output: str}
    cold: {kind: code, code: "return 'cold'", output: str}
  output: ${hot.output | cold.output}
inputs:
  v: 7
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: hot
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {v: 7}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        v: 7
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: hot
  - [node_started, hot]
  - - pool_commit
    - hot
    - value: hot
  - - node_succeeded
    - hot
    - {commit: 11}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: hot
  - - node_succeeded
    - __end__
    - {commit: 14}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        v: 7
      interrupted: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: hot
      node_id: gate
  - - NodeSkipped
    - node_id: cold
  - - NodeStarted
    - node_id: hot
  - - NodeSucceeded
    - node_id: hot
      output: hot
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: hot
      interrupted: false
  - - RunSucceeded
    - output: hot
