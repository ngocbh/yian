kind: run
flow: |2

  id: parent
  name: parent
  input:
    approve: !bool
  defs:
    child:
      input:
        approve: !bool
      nodes:
        gate:
          kind: case
          cases:
            - when: ${input.approve}
              then: order
          else: rejected
        order:
          kind: code
          output: str
          code: |
            return "filled"
        rejected:
          kind: code
          output: str
          code: |
            return "no"
        c:
          kind: code
          input:
            x: {a: '${order.output}', t: 'got ${order.output}'}
          code: |
            return inputs["x"]
      output:
        c: ${c.output}
        r: {b: '${order.output}'}
  nodes:
    k:
      kind: call
      call: child
      input:
        approve: ${input.approve}
  output: ${k.output}
inputs:
  approve: false
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      c: null
      r:
        b: null
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {approve: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        approve: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, k]
  - - pool_commit
    - k
    - from: {__start__: 6}
      key: k/__start__
  - - node_expanded
    - k
    - prune_ids: []
  - [node_started, k/__start__]
  - - node_succeeded
    - k/__start__
    - commit: 9
  - [node_started, k/gate]
  - - node_routed
    - k/gate
    - handle: '#else'
  - [node_started, k/__end__]
  - - pool_commit
    - k/__end__
    - key: k
      from: {}
  - - node_succeeded
    - k/__end__
    - {commit: 16}
  - [node_started, k/rejected]
  - - pool_commit
    - k/rejected
    - value: no
  - - node_succeeded
    - k/rejected
    - {commit: 19}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        c: null
        r:
          b: null
  - - node_succeeded
    - __end__
    - {commit: 22}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        approve: false
      interrupted: false
  - - NodeStarted
    - node_id: k
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          approve: false
      node_id: k
  - - NodeStarted
    - node_id: k/__start__
  - - NodeSucceeded
    - node_id: k/__start__
      output:
        approve: false
      interrupted: false
  - - NodeStarted
    - node_id: k/gate
  - - NodeRouted
    - handle: '#else'
      node_id: k/gate
  - - NodeSkipped
    - node_id: k/order
  - - NodeSkipped
    - node_id: k/c
  - - NodeStarted
    - node_id: k/__end__
  - - NodeSucceeded
    - commit_as: k
      node_id: k/__end__
      output:
        c: null
        r:
          b: null
      interrupted: false
  - - NodeStarted
    - node_id: k/rejected
  - - NodeSucceeded
    - node_id: k/rejected
      output: no
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        c: null
        r:
          b: null
      interrupted: false
  - - RunSucceeded
    - output:
        c: null
        r:
          b: null
