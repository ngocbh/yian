kind: run
flow: |
  id: f
  name: f
  input:
    flip: !bool
  nodes:
    repeat:
      kind: loop
      times: 2
      input:
        n: 0
        note: !str "start"
        flip: ${input.flip}
      nodes:
          gate:
            kind: case
            cases:
              - when: ${input.flip}
                then: mk
          mk:
            kind: code
            output: str
            code: |
              return "made"
          bump:
            kind: code
            input:
              n: ${input.n}
            output: int
            code: |
              return inputs["n"] + 1
      output:
        n: ${bump.output}
        note: ${mk.output}
  output: ${repeat.output}
inputs:
  flip: false
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 9]
      message: 'input ''note'': null does not match declared type str'
      node: repeat#1/__start__
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {flip: false}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        flip: false
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, repeat]
  - - pool_commit
    - repeat
    - from: {__start__: 6}
      key: repeat#0/__start__
  - - node_expanded
    - repeat
    - prune_ids: []
  - [node_started, repeat#0/__start__]
  - - node_succeeded
    - repeat#0/__start__
    - commit: 9
  - [node_started, repeat#0/bump]
  - - pool_commit
    - repeat#0/bump
    - value: 1
  - - node_succeeded
    - repeat#0/bump
    - {commit: 14}
  - [node_started, repeat#0/gate]
  - - node_routed
    - repeat#0/gate
    - handle: '#else'
  - [node_started, repeat#0/__end__]
  - - pool_commit
    - repeat#0/__end__
    - from: {repeat#0/bump: 14}
  - - node_succeeded
    - repeat#0/__end__
    - {commit: 19}
  - [node_started, repeat~1]
  - - node_expanded
    - repeat~1
    - prune_ids:
      - repeat#0/__end__
      - repeat#0/__start__
      - repeat#0/bump
      - repeat#0/gate
      - repeat#0/mk
      - repeat~1
  - [node_started, repeat#1/__start__]
  - - node_failed
    - repeat#1/__start__
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 9]
        message: 'input ''note'': null does not match declared type str'
        node: repeat#1/__start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        flip: false
      interrupted: false
  - - NodeStarted
    - node_id: repeat
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - flip: false
          n: 0
          note: start
        - 0
      node_id: repeat
  - - NodeStarted
    - node_id: repeat#0/__start__
  - - NodeSucceeded
    - node_id: repeat#0/__start__
      output:
        flip: false
        n: 0
        note: start
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/bump
  - - NodeSucceeded
    - node_id: repeat#0/bump
      output: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/gate
  - - NodeRouted
    - handle: '#else'
      node_id: repeat#0/gate
  - - NodeSkipped
    - node_id: repeat#0/mk
  - - NodeStarted
    - node_id: repeat#0/__end__
  - - NodeSucceeded
    - node_id: repeat#0/__end__
      output:
        n: 1
        note: null
      interrupted: false
  - - NodeStarted
    - node_id: repeat~1
  - - NodeExpanded
    - grow:
        prune:
        - repeat#0/__end__
        - repeat#0/__start__
        - repeat#0/bump
        - repeat#0/gate
        - repeat#0/mk
        - repeat~1
        seed:
        - flip: false
          n: 1
          note: null
        - 1
      node_id: repeat~1
  - - NodeStarted
    - node_id: repeat#1/__start__
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 9]
        message: 'input ''note'': null does not match declared type str'
        node: repeat#1/__start__
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 9]
        message: 'input ''note'': null does not match declared type str'
        node: repeat#1/__start__
