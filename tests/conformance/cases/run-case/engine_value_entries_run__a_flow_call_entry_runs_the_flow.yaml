kind: run
flow: |
  id: f
  name: f
  defs:
    f:
      input:
        x: !str
      nodes:
        up:
          kind: code
          input:
            x: ${input.x}
          output: str
          code: |
            return inputs['x'].toUpperCase()
      output: ${up.output}
  input:
    name: !str
  nodes:
    a:
      kind: code
      output: int
      code: |
        return 2
    b:
      kind: code
      output: int
      code: |
        return 3
    x: !str call(f, x=${input.name})
  output: ${x.output}
inputs:
  name: Ada
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ADA
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {name: Ada}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        name: Ada
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, __call_0]
  - - pool_commit
    - __call_0
    - from: {__start__: 6}
      key: __call_0/__start__
  - - node_expanded
    - __call_0
    - prune_ids: []
  - [node_started, a]
  - - pool_commit
    - a
    - value: 2
  - - node_succeeded
    - a
    - {commit: 12}
  - [node_started, b]
  - - pool_commit
    - b
    - value: 3
  - - node_succeeded
    - b
    - {commit: 15}
  - [node_started, __call_0/__start__]
  - - node_succeeded
    - __call_0/__start__
    - commit: 9
  - [node_started, __call_0/up]
  - - pool_commit
    - __call_0/up
    - value: ADA
  - - node_succeeded
    - __call_0/up
    - {commit: 20}
  - [node_started, __call_0/__end__]
  - - pool_commit
    - __call_0/__end__
    - key: __call_0
      from: {__call_0/up: 20}
  - - node_succeeded
    - __call_0/__end__
    - {commit: 23}
  - [node_started, x]
  - - pool_commit
    - x
    - value: ADA
  - - node_succeeded
    - x
    - {commit: 26}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ADA
  - - node_succeeded
    - __end__
    - {commit: 29}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        name: Ada
      interrupted: false
  - - NodeStarted
    - node_id: __call_0
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          x: Ada
      node_id: __call_0
  - - NodeStarted
    - node_id: a
  - - NodeSucceeded
    - node_id: a
      output: 2
      interrupted: false
  - - NodeStarted
    - node_id: b
  - - NodeSucceeded
    - node_id: b
      output: 3
      interrupted: false
  - - NodeStarted
    - node_id: __call_0/__start__
  - - NodeSucceeded
    - node_id: __call_0/__start__
      output:
        x: Ada
      interrupted: false
  - - NodeStarted
    - node_id: __call_0/up
  - - NodeSucceeded
    - node_id: __call_0/up
      output: ADA
      interrupted: false
  - - NodeStarted
    - node_id: __call_0/__end__
  - - NodeSucceeded
    - commit_as: __call_0
      node_id: __call_0/__end__
      output: ADA
      interrupted: false
  - - NodeStarted
    - node_id: x
  - - NodeSucceeded
    - node_id: x
      output: ADA
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ADA
      interrupted: false
  - - RunSucceeded
    - output: ADA
