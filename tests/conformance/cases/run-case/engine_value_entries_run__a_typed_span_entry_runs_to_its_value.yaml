kind: run
flow: |
  id: f
  name: f
  input:
    name: !str
  nodes:
    a:
      kind: code
      output: int
      code: |
        return 2
    b:
      kind: code
      output: int
      code: |
        return 3
    x: !int ${a.output + b.output}
  output: ${x.output}
inputs:
  name: Ada
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 5
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {name: Ada}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        name: Ada
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, a]
  - - pool_commit
    - a
    - value: 2
  - - node_succeeded
    - a
    - {commit: 9}
  - [node_started, b]
  - - pool_commit
    - b
    - value: 3
  - - node_succeeded
    - b
    - {commit: 12}
  - [node_started, x]
  - - pool_commit
    - x
    - value: 5
  - - node_succeeded
    - x
    - {commit: 15}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 5
  - - node_succeeded
    - __end__
    - {commit: 18}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        name: Ada
      interrupted: false
  - - NodeStarted
    - node_id: a
  - - NodeSucceeded
    - node_id: a
      output: 2
      interrupted: false
  - - NodeStarted
    - node_id: b
  - - NodeSucceeded
    - node_id: b
      output: 3
      interrupted: false
  - - NodeStarted
    - node_id: x
  - - NodeSucceeded
    - node_id: x
      output: 5
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 5
      interrupted: false
  - - RunSucceeded
    - output: 5
