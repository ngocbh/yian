kind: run
flow: |
  id: f
  name: f
  input:
    name: !str
  nodes:
    a:
      kind: code
      output: !int
      code: |
        return 2
    b:
      kind: code
      output: !int
      code: |
        return 3
    items: !list(str) [a, b]
    x:
      kind: map
      over: ${items.output}
      input:
        v: ${item}
      nodes:
        wrap: !str got ${input.v}
      output: ${wrap.output}
  output: ${x.output}
inputs:
  name: Ada
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [got a, got b]
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {name: Ada}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        name: Ada
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, a]
  - - pool_commit
    - a
    - value: 2
  - - node_succeeded
    - a
    - {commit: 9}
  - [node_started, b]
  - - pool_commit
    - b
    - value: 3
  - - node_succeeded
    - b
    - {commit: 12}
  - [node_started, items]
  - - pool_commit
    - items
    - value: [a, b]
  - - node_succeeded
    - items
    - {commit: 15}
  - [node_started, x]
  - - pool_commit
    - x
    - from: {items: 15}
      key: x/__start__
  - - pool_commit
    - x
    - from: {items: 15}
      key: x#0/__start__
  - - pool_commit
    - x
    - from: {items: 15}
      key: x#1/__start__
  - - node_expanded
    - x
    - prune_ids: []
  - [node_started, x/__start__]
  - - node_succeeded
    - x/__start__
    - commit: 18
  - [node_started, x#0/__start__]
  - - node_succeeded
    - x#0/__start__
    - commit: 19
  - [node_started, x#1/__start__]
  - - node_succeeded
    - x#1/__start__
    - commit: 20
  - [node_started, x#0/wrap]
  - - pool_commit
    - x#0/wrap
    - value: got a
  - - node_succeeded
    - x#0/wrap
    - {commit: 29}
  - [node_started, x#1/wrap]
  - - pool_commit
    - x#1/wrap
    - value: got b
  - - node_succeeded
    - x#1/wrap
    - {commit: 32}
  - [node_started, x#0/__end__]
  - - pool_commit
    - x#0/__end__
    - from: {x#0/wrap: 29}
  - - node_succeeded
    - x#0/__end__
    - {commit: 35}
  - [node_started, x#1/__end__]
  - - pool_commit
    - x#1/__end__
    - from: {x#1/wrap: 32}
  - - node_succeeded
    - x#1/__end__
    - {commit: 38}
  - [node_started, x/__end__]
  - - pool_commit
    - x/__end__
    - key: x
      from: {x#0/__end__: 35, x#1/__end__: 38}
  - - node_succeeded
    - x/__end__
    - {commit: 41}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [got a, got b]
  - - node_succeeded
    - __end__
    - {commit: 44}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        name: Ada
      interrupted: false
  - - NodeStarted
    - node_id: a
  - - NodeSucceeded
    - node_id: a
      output: 2
      interrupted: false
  - - NodeStarted
    - node_id: b
  - - NodeSucceeded
    - node_id: b
      output: 3
      interrupted: false
  - - NodeStarted
    - node_id: items
  - - NodeSucceeded
    - node_id: items
      output: [a, b]
      interrupted: false
  - - NodeStarted
    - node_id: x
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - v: a
        - v: b
      node_id: x
  - - NodeStarted
    - node_id: x/__start__
  - - NodeSucceeded
    - node_id: x/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: x#0/__start__
  - - NodeSucceeded
    - node_id: x#0/__start__
      output:
        v: a
      interrupted: false
  - - NodeStarted
    - node_id: x#1/__start__
  - - NodeSucceeded
    - node_id: x#1/__start__
      output:
        v: b
      interrupted: false
  - - NodeStarted
    - node_id: x#0/wrap
  - - NodeSucceeded
    - node_id: x#0/wrap
      output: got a
      interrupted: false
  - - NodeStarted
    - node_id: x#1/wrap
  - - NodeSucceeded
    - node_id: x#1/wrap
      output: got b
      interrupted: false
  - - NodeStarted
    - node_id: x#0/__end__
  - - NodeSucceeded
    - node_id: x#0/__end__
      output: got a
      interrupted: false
  - - NodeStarted
    - node_id: x#1/__end__
  - - NodeSucceeded
    - node_id: x#1/__end__
      output: got b
      interrupted: false
  - - NodeStarted
    - node_id: x/__end__
  - - NodeSucceeded
    - commit_as: x
      node_id: x/__end__
      output: [got a, got b]
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [got a, got b]
      interrupted: false
  - - RunSucceeded
    - output: [got a, got b]
