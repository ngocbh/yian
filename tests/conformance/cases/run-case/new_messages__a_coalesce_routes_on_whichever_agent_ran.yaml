# A CASE routes on a coalesce of two AGENTs' new messages, one on each branch. The coalesce
# joins its producers, so the CASE runs once the agent that ran commits, though the other is
# skipped.
kind: run
flow: |
  id: routed
  name: routed
  llm_config: {provider: anthropic, model: claude-test}
  typedefs:
    Who: Literal(left, right, nobody)
  input:
    who: !Who
  nodes:
    pre:
      kind: case
      on: ${input.who}
      cases:
        - when: left
          then: left
        - when: right
          then: right
      else: nobody
    left:
      kind: agent
      system_prompt: Help.
      prompt: hi
      output: str
    right:
      kind: agent
      system_prompt: Help.
      prompt: hi
      output: str
    nobody: !str nobody ran
    gate:
      kind: case
      cases:
        - when: "${len(left.new_messages | right.new_messages) == 1}"
          then: one
      else: many
    one: !str one message
    many: !str many messages
  output: ${one.output | many.output | nobody.output}
inputs: {who: right}
run: {run_id: r1, num_workers: 0}
host:
  models:
    right:
      agent:
      - reply:
          format: yian.message.v1
          role: assistant
          parts:
          - {type: text, text: done}
expect:
  output: {status: succeeded, output: one message}
  trace:
    - [run_started, null, {effective_llm_by_static_path: {left: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}, right: {model: claude-test, provider: anthropic, _connection: {method: api_key, source: environment, endpoint: null}}}, learnable: false, num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {who: right}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {who: right}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, pre]
    - [node_routed, pre, {handle: right}]
    - [node_started, right]
    - [node_step, right, {n: 1, step: {finish: null, kind: model_call, model: claude-test, output: {format: yian.message.v1, parts: [{text: done, type: text}], role: assistant}, purpose: chat, request_sha256: 0c2d612474786e4d309464090eba530c35a97e3b3432cf6da0b668dd13355633, response_id: null, usage: null}}]
    - [pool_commit, right, {value: done}]
    - [pool_commit, right, {key: right.new_messages, steps: [11]}]
    - [node_succeeded, right, {commit: 12, messages: 13}]
    - [node_started, gate]
    - [node_routed, gate, {handle: one}]
    - [node_started, one]
    - [pool_commit, one, {value: one message}]
    - [node_succeeded, one, {commit: 18}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: one message}]
    - [node_succeeded, __end__, {commit: 21}]
