kind: run
flow: |
  id: nested-binding
  name: nested_binding
  defs:
    inner:
      input:
        maybe: !Optional(str)
      nodes:
        leaf:
          kind: code
          input:
            okay: literal
            bad: ${input.maybe:?"missing nested value"}
          output: str
          code: ./fixtures/compose_codefns.ts:echo
      output: ${leaf.output}
  nodes:
    invoke:
      kind: call
      call: inner
      input: {}
  output: ${invoke.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [17, 3, 17, 9]
      - label: flow.yaml
        range: [12, 16, 12, 54]
      message: missing nested value
      node: invoke/leaf
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {}
      key: invoke/__start__
  - - node_expanded
    - invoke
    - prune_ids: []
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 9
  - [node_started, invoke/leaf]
  - - node_failed
    - invoke/leaf
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [17, 3, 17, 9]
        - label: flow.yaml
          range: [12, 16, 12, 54]
        message: missing nested value
        node: invoke/leaf
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: invoke
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: invoke
  - - NodeStarted
    - node_id: invoke/__start__
  - - NodeSucceeded
    - node_id: invoke/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: invoke/leaf
  - - NodeFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [17, 3, 17, 9]
        - label: flow.yaml
          range: [12, 16, 12, 54]
        message: missing nested value
        node: invoke/leaf
  - - RunFailed
    - failure:
        code: binding.evaluate
        frames:
        - label: flow.yaml
          range: [17, 3, 17, 9]
        - label: flow.yaml
          range: [12, 16, 12, 54]
        message: missing nested value
        node: invoke/leaf
