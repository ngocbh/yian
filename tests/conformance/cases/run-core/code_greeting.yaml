kind: run
flow: |
  id: code-greeting
  name: code_greeting
  input:
    name: !str
  nodes:
    greet:
      kind: code
      input:
        name: ${input.name}
      output: !str
      code: |
        return "hi " + inputs.name
  output: ${greet.output}
inputs: {name: Ada}
run: {run_id: r1, num_workers: 0}
expect:
  output: {status: succeeded, output: hi Ada}
  trace:
    - [run_started, null, {num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {name: Ada}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {name: Ada}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, greet]
    - [pool_commit, greet, {value: hi Ada}]
    - [node_succeeded, greet, {commit: 9}]
    - [node_started, __end__]
    - [pool_commit, __end__, {value: hi Ada}]
    - [node_succeeded, __end__, {commit: 12}]
  events:
    - [RunStarted]
    - [NodeStarted, {node_id: __start__}]
    - [NodeSucceeded, {node_id: __start__, output: {name: Ada}, interrupted: false}]
    - [NodeStarted, {node_id: greet}]
    - [NodeSucceeded, {node_id: greet, output: hi Ada, interrupted: false}]
    - [NodeStarted, {node_id: __end__}]
    - [NodeSucceeded, {node_id: __end__, output: hi Ada, interrupted: false}]
    - [RunSucceeded, {output: hi Ada}]
