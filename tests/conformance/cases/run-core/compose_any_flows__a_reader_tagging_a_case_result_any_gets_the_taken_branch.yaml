kind: run
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    route:
      kind: case
      cases:
        - when: ${input.s == 'i'}
          then: one
      else: a
    one: !int 1
    a: !str "a"
    use:
      kind: code
      input:
        v: !Any ${route.output}
      code: return inputs['v']
  output: ${use.output}
inputs:
  s: i
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: 1
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: i}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: i
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, route]
  - - node_routed
    - route
    - handle: one
  - [node_started, one]
  - - pool_commit
    - one
    - value: 1
  - - node_succeeded
    - one
    - {commit: 11}
  - [node_started, use]
  - - pool_commit
    - use
    - value: 1
  - - node_succeeded
    - use
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 1
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: i
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - handle: one
      node_id: route
  - - NodeSkipped
    - node_id: a
  - - NodeStarted
    - node_id: one
  - - NodeSucceeded
    - node_id: one
      output: 1
      interrupted: false
  - - NodeStarted
    - node_id: use
  - - NodeSucceeded
    - node_id: use
      output: 1
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 1
      interrupted: false
  - - RunSucceeded
    - output: 1
