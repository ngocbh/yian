kind: run
flow: |
  id: p
  name: p
  typedefs:
    Buy: {action: Literal(buy), conviction: float}
    Sell: {action: Literal(sell), price: float}
    Decision: Union(Buy, Sell)
    Size: Literal(s, m, l)
  input:
    order: !object
  nodes:
    d:
      kind: code
      input:
        order: ${input.order}
      output: !object
      code: |
        return inputs["order"]
    c:
      kind: code
      input:
        x: ${Buy(action="buy", conviction=d.output.price)}
      code: |
        return inputs["x"]
  output: ${c.output}
inputs:
  order:
    price: high
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [21, 10, 21, 57]
      message: 'Buy(...): "high" does not match declared type float'
      node: c
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        order: {price: high}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        order:
          price: high
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - pool_commit
    - d
    - value:
        price: high
  - - node_succeeded
    - d
    - {commit: 9}
  - [node_started, c]
  - - node_failed
    - c
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 10, 21, 57]
        message: 'Buy(...): "high" does not match declared type float'
        node: c
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        order:
          price: high
      interrupted: false
  - - NodeStarted
    - node_id: d
  - - NodeSucceeded
    - node_id: d
      output:
        price: high
      interrupted: false
  - - NodeStarted
    - node_id: c
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 10, 21, 57]
        message: 'Buy(...): "high" does not match declared type float'
        node: c
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 10, 21, 57]
        message: 'Buy(...): "high" does not match declared type float'
        node: c
