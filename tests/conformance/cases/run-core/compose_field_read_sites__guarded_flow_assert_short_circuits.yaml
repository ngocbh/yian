kind: run
flow: |
  id: p
  name: p
  typedefs:
    Rec: {a: str}
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)'}
    Order: Union(Buy, Sell)
  input:
    s: !str
    o: !Order
  nodes:
    step:
      kind: code
      input:
        x: ${input.s}
      output: Rec
      code: "return ({a: \"x\"})"
  output: ${step.output}
  asserts:
    - "not isinstance(input.o, Buy) or input.o.qty > 0"
inputs:
  s: x
  o:
    action: sell
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      a: x
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        o: {action: sell}
        s: x
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        o:
          action: sell
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, step]
  - - pool_commit
    - step
    - value:
        a: x
  - - node_succeeded
    - step
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        a: x
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        o:
          action: sell
        s: x
      interrupted: false
  - - NodeStarted
    - node_id: step
  - - NodeSucceeded
    - node_id: step
      output:
        a: x
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        a: x
      interrupted: false
  - - RunSucceeded
    - output:
        a: x
