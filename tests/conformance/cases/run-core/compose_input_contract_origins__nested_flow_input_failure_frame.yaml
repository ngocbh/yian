kind: run
flow: |
  id: input-contract-origins
  name: input-contract-origins
  typedefs:
    Profile:
      age: int
      nickname: Optional(str)
    Payload:
      profile: Profile
    Limits:
      count: int
    Flags:
      enabled: bool
      limits: Limits
  input:
    topic: !str
    window: !int 30
    payload: !Payload
    flags: !Flags
  nodes:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: ${input.topic}
      output: !str
  output: ${echo.output}
inputs:
  topic: hello
  payload:
    profile:
      age: not-an-int
  flags:
    enabled: true
    limits:
      count: 1
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [17, 12, 17, 20]
      message: 'input ''payload'' at profile.age: "not-an-int" does not match declared type int'
      node: __start__
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        flags:
          enabled: true
          limits: {count: 1}
        payload:
          profile: {age: not-an-int}
        topic: hello
  - [node_started, __start__]
  - - node_failed
    - __start__
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [17, 12, 17, 20]
        message: 'input ''payload'' at profile.age: "not-an-int" does not match declared type int'
        node: __start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [17, 12, 17, 20]
        message: 'input ''payload'' at profile.age: "not-an-int" does not match declared type int'
        node: __start__
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [17, 12, 17, 20]
        message: 'input ''payload'' at profile.age: "not-an-int" does not match declared type int'
        node: __start__
