kind: run
flow: |
  id: nested-output-contract
  name: nested-output-contract
  nodes:
    emit:
      kind: code
      code: |-
        return {"profile": {"age": "bad", "name": "Ada"}, "ok": true}
      output:
        profile:
          age: int
          name: str
        ok: bool
  output: ${emit.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.output
      frames:
      - label: flow.yaml
        range: [10, 14, 10, 17]
      message: 'output at profile.age: "bad" does not match declared type int'
      node: emit
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, emit]
  - - node_failed
    - emit
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [10, 14, 10, 17]
        message: 'output at profile.age: "bad" does not match declared type int'
        node: emit
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: emit
  - - NodeFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [10, 14, 10, 17]
        message: 'output at profile.age: "bad" does not match declared type int'
        node: emit
  - - RunFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [10, 14, 10, 17]
        message: 'output at profile.age: "bad" does not match declared type int'
        node: emit
