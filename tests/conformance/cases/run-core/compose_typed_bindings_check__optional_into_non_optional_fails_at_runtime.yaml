kind: run
flow: |2

  id: checked
  name: checked
  nodes:
    maybe:
      kind: code
      code: |
        return null
      output: Optional(int)
    use:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_x
      input:
        x: !int ${maybe.output}
  output: ${use.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [14, 10, 14, 30]
      message: 'binding ''x'': null does not match declared type int'
      node: use
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, maybe]
  - [pool_commit, maybe]
  - - node_succeeded
    - maybe
    - {commit: 9}
  - [node_started, use]
  - - node_failed
    - use
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [14, 10, 14, 30]
        message: 'binding ''x'': null does not match declared type int'
        node: use
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: maybe
  - - NodeSucceeded
    - node_id: maybe
      interrupted: false
  - - NodeStarted
    - node_id: use
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [14, 10, 14, 30]
        message: 'binding ''x'': null does not match declared type int'
        node: use
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [14, 10, 14, 30]
        message: 'binding ''x'': null does not match declared type int'
        node: use
