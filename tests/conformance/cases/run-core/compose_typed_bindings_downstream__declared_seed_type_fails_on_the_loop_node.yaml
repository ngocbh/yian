kind: run
flow: |2

  id: downstream-loop
  name: downstream_loop
  defs:
    bump:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: int
          code: |
            return inputs["n"] + 1
      output:
        n: ${step.output}
  nodes:
    opaque:
      kind: code
      code: |
        return "1"
    loop:
      kind: loop
      times: 2
      input:
        n: !int ${opaque.output}
      call: bump
  output: ${loop.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [27, 10, 27, 31]
      message: 'binding ''n'': "1" does not match declared type int'
      node: loop
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, opaque]
  - - pool_commit
    - opaque
    - value: '1'
  - - node_succeeded
    - opaque
    - {commit: 9}
  - [node_started, loop]
  - - node_failed
    - loop
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [27, 10, 27, 31]
        message: 'binding ''n'': "1" does not match declared type int'
        node: loop
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: opaque
  - - NodeSucceeded
    - node_id: opaque
      output: '1'
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [27, 10, 27, 31]
        message: 'binding ''n'': "1" does not match declared type int'
        node: loop
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [27, 10, 27, 31]
        message: 'binding ''n'': "1" does not match declared type int'
        node: loop
