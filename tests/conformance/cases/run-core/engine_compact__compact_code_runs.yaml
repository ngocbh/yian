kind: run
flow: |2

  id: echo_one
  name: echo_one
  input:
    topic: !str
  output: !str
  kind: code
  code: ./fixtures/compose_codefns.ts:echo
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ACME
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, echo_one]
  - - pool_commit
    - echo_one
    - value: ACME
  - - node_succeeded
    - echo_one
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: ACME
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: echo_one
  - - NodeSucceeded
    - node_id: echo_one
      output: ACME
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: ACME
      interrupted: false
  - - RunSucceeded
    - output: ACME
