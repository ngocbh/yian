# 2.0 ** 5000 is inf (infinity is a float value) and inf > 0 holds, so the START assert passes
# and the run succeeds; output only (no trace or events).
kind: run
flow: |2

  id: arith
  name: arith
  input:
    n: !int
  asserts:
    - 2.0 ** input.n > 0
  nodes:
    n:
      kind: code
      output: str
      code: return "ok"
  output: ${n.output}
inputs:
  n: 5000
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: ok
