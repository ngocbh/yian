kind: run
flow: |2

  id: shape
  name: shape
  nodes:
    step:
      kind: code
      output: !str
      code: |
        return "filled"
  output:
    x: 5
    y: ${step.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      x: 5
      y: filled
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, step]
  - - pool_commit
    - step
    - value: filled
  - - node_succeeded
    - step
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        x: 5
        y: filled
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: step
  - - NodeSucceeded
    - node_id: step
      output: filled
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        x: 5
        y: filled
      interrupted: false
  - - RunSucceeded
    - output:
        x: 5
        y: filled
