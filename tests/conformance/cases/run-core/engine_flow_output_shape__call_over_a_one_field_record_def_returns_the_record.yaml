kind: run
flow: |
  id: parent
  name: parent
  defs:
    child:
      nodes:
        step:
          kind: code
          output: str
          code: |
            return "filled"
      output:
        order: ${step.output}
  nodes:
    c:
      kind: call
      call: child
  output: ${c.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      order: filled
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, c]
  - - pool_commit
    - c
    - from: {}
      key: c/__start__
  - - node_expanded
    - c
    - prune_ids: []
  - [node_started, c/__start__]
  - - node_succeeded
    - c/__start__
    - commit: 9
  - [node_started, c/step]
  - - pool_commit
    - c/step
    - value: filled
  - - node_succeeded
    - c/step
    - {commit: 14}
  - [node_started, c/__end__]
  - - pool_commit
    - c/__end__
    - key: c
      from: {c/step: 14}
  - - node_succeeded
    - c/__end__
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        order: filled
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: c
  - - NodeStarted
    - node_id: c/__start__
  - - NodeSucceeded
    - node_id: c/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c/step
  - - NodeSucceeded
    - node_id: c/step
      output: filled
      interrupted: false
  - - NodeStarted
    - node_id: c/__end__
  - - NodeSucceeded
    - commit_as: c
      node_id: c/__end__
      output:
        order: filled
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        order: filled
      interrupted: false
  - - RunSucceeded
    - output:
        order: filled
