kind: run
flow: |2

  id: parent
  name: parent
  defs:
    greet:
      kind: code
      output: str
      code: |
        return "hi"
  nodes:
    c:
      kind: call
      call: greet
  output: ${c.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: hi
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, c]
  - - pool_commit
    - c
    - from: {}
      key: c/__start__
  - - node_expanded
    - c
    - prune_ids: []
  - [node_started, c/__start__]
  - - node_succeeded
    - c/__start__
    - commit: 9
  - [node_started, c/greet]
  - - pool_commit
    - c/greet
    - value: hi
  - - node_succeeded
    - c/greet
    - {commit: 14}
  - [node_started, c/__end__]
  - - pool_commit
    - c/__end__
    - key: c
      from: {c/greet: 14}
  - - node_succeeded
    - c/__end__
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: hi
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c
  - - NodeExpanded
    - grow:
        prune: []
        seed: {}
      node_id: c
  - - NodeStarted
    - node_id: c/__start__
  - - NodeSucceeded
    - node_id: c/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: c/greet
  - - NodeSucceeded
    - node_id: c/greet
      output: hi
      interrupted: false
  - - NodeStarted
    - node_id: c/__end__
  - - NodeSucceeded
    - commit_as: c
      node_id: c/__end__
      output: hi
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: hi
      interrupted: false
  - - RunSucceeded
    - output: hi
