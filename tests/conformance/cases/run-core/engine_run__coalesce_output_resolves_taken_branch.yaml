kind: run
flow: |2

  id: run-case
  name: case_flow
  input:
    topic: !str
    seed: !float
  nodes:
    score:
      kind: code
      code: ./fixtures/compose_codefns.ts:score
      input:
        seed: ${input.seed}
      output: float
    gate:
      kind: case
      cases:
        - when: "score.output >= 0.5"
          then: positive
      else: cautious
    positive:
      kind: code
      code: ./fixtures/compose_codefns.ts:positive
      input:
        topic: ${input.topic}
      output: str
    cautious:
      kind: code
      code: ./fixtures/compose_codefns.ts:cautious
      input:
        topic: ${input.topic}
      output: str
  output: ${positive.output | cautious.output}
inputs:
  topic: BETA
  seed: 0.2
run:
  run_id: r1
  num_workers: 0
expect:
  output:
    status: succeeded
    output: cautious note for BETA
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {seed: 0.2, topic: BETA}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        seed: 0.2
        topic: BETA
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, score]
  - - pool_commit
    - score
    - value: 0.2
  - - node_succeeded
    - score
    - {commit: 9}
  - [node_started, gate]
  - - node_routed
    - gate
    - handle: '#else'
  - [node_started, cautious]
  - - pool_commit
    - cautious
    - value: cautious note for BETA
  - - node_succeeded
    - cautious
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: cautious note for BETA
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        seed: 0.2
        topic: BETA
      interrupted: false
  - - NodeStarted
    - node_id: score
  - - NodeSucceeded
    - node_id: score
      output: 0.2
      interrupted: false
  - - NodeStarted
    - node_id: gate
  - - NodeRouted
    - handle: '#else'
      node_id: gate
  - - NodeSkipped
    - node_id: positive
  - - NodeStarted
    - node_id: cautious
  - - NodeSucceeded
    - node_id: cautious
      output: cautious note for BETA
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: cautious note for BETA
      interrupted: false
  - - RunSucceeded
    - output: cautious note for BETA
