kind: run
flow: |2

  id: run-runid
  name: runid_flow
  input:
    topic: !str
  nodes:
    echo:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo_rid
      input:
        rid: ${system.run_id}
      output: !str
  output: ${echo.output}
inputs:
  topic: ACME
run:
  run_id: rid-123
  num_workers: 0
expect:
  output:
    status: succeeded
    output: rid-123
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: rid-123}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, echo]
  - - pool_commit
    - echo
    - value: rid-123
  - - node_succeeded
    - echo
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: rid-123
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: echo
  - - NodeSucceeded
    - node_id: echo
      output: rid-123
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: rid-123
      interrupted: false
  - - RunSucceeded
    - output: rid-123
