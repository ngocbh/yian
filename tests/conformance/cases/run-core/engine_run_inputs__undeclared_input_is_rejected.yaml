kind: run
flow: |
  id: hello
  name: hello
  input:
    topic: !str "world"
  nodes:
    greet:
      kind: code
      input:
        t: ${input.topic}
      output: !str
      code: |
        return "hello " + inputs["t"]
  output: ${greet.output}
inputs:
  topik: Ada
run:
  num_workers: 0
expect:
  raises:
    class: RangeError
    message: 'unknown input "topik"; declared inputs: topic'
  trace: []
  events: []
