kind: run
flow: |2

  id: seed-call-code
  name: seed_call_code
  nodes:
    probe:
      kind: code
      output: str
      code: |
        return "SECRET"
    mk:
      kind: code
      output: str
      code: |
        return "echo ${probe.output}"
    echo:
      kind: call
      input:
        text: ${mk.output}
      nodes:
        inner:
          kind: code
          input:
            text: ${input.text}
          output: str
          code: |
            return inputs["text"]
      output: ${inner.output}
  output: ${echo.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: echo ${probe.output}
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, mk]
  - - pool_commit
    - mk
    - value: echo ${probe.output}
  - - node_succeeded
    - mk
    - {commit: 9}
  - [node_started, probe]
  - - pool_commit
    - probe
    - value: SECRET
  - - node_succeeded
    - probe
    - {commit: 12}
  - [node_started, echo]
  - - pool_commit
    - echo
    - from: {mk: 9}
      key: echo/__start__
  - - node_expanded
    - echo
    - prune_ids: []
  - [node_started, echo/__start__]
  - - node_succeeded
    - echo/__start__
    - commit: 15
  - [node_started, echo/inner]
  - - pool_commit
    - echo/inner
    - value: echo ${probe.output}
  - - node_succeeded
    - echo/inner
    - {commit: 20}
  - [node_started, echo/__end__]
  - - pool_commit
    - echo/__end__
    - key: echo
      from: {echo/inner: 20}
  - - node_succeeded
    - echo/__end__
    - {commit: 23}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: echo ${probe.output}
  - - node_succeeded
    - __end__
    - {commit: 26}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: mk
  - - NodeSucceeded
    - node_id: mk
      output: echo ${probe.output}
      interrupted: false
  - - NodeStarted
    - node_id: probe
  - - NodeSucceeded
    - node_id: probe
      output: SECRET
      interrupted: false
  - - NodeStarted
    - node_id: echo
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          text: echo ${probe.output}
      node_id: echo
  - - NodeStarted
    - node_id: echo/__start__
  - - NodeSucceeded
    - node_id: echo/__start__
      output:
        text: echo ${probe.output}
      interrupted: false
  - - NodeStarted
    - node_id: echo/inner
  - - NodeSucceeded
    - node_id: echo/inner
      output: echo ${probe.output}
      interrupted: false
  - - NodeStarted
    - node_id: echo/__end__
  - - NodeSucceeded
    - commit_as: echo
      node_id: echo/__end__
      output: echo ${probe.output}
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: echo ${probe.output}
      interrupted: false
  - - RunSucceeded
    - output: echo ${probe.output}
