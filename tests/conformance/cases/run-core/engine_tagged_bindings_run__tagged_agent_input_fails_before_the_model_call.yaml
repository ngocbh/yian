# env keeps the model defaults: the run resolves the AGENT's provider and model before the node binds its inputs.
kind: run
flow: |2

  id: tagged_agent
  name: tagged_agent
  nodes:
    src:
      kind: code
      code: |
        return 'three'
    ask:
      kind: agent
      input:
        count: !int ${src.output}
      prompt: "Count ${count}"
      output: str
  output: ${ask.output}
env:
  YIAN_DEFAULT_MODEL: gpt-5.5
  YIAN_DEFAULT_PROVIDER: openai
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [12, 14, 12, 32]
      message: 'binding ''count'': "three" does not match declared type int'
      node: ask
  trace:
  - - run_started
    - null
    - effective_llm_by_static_path:
        ask:
          _connection:
            endpoint: https://api.openai.com/v1
            method: api_key
            source: missing
          model: gpt-5.5
          provider: openai
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, src]
  - - pool_commit
    - src
    - value: three
  - - node_succeeded
    - src
    - {commit: 9}
  - [node_started, ask]
  - - node_failed
    - ask
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [12, 14, 12, 32]
        message: 'binding ''count'': "three" does not match declared type int'
        node: ask
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: src
  - - NodeSucceeded
    - node_id: src
      output: three
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [12, 14, 12, 32]
        message: 'binding ''count'': "three" does not match declared type int'
        node: ask
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [12, 14, 12, 32]
        message: 'binding ''count'': "three" does not match declared type int'
        node: ask
