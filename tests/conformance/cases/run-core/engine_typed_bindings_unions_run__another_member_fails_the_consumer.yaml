kind: run
flow: |2

  id: narrow
  name: narrow
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', qty: int, price: float}
    Decision: Union(Buy, Sell)
  input:
    decision: !object

  nodes:
    decide:
      kind: code
      input:
        decision: ${input.decision}
      code: return inputs['decision']
      output: Decision
    place:
      kind: code
      input:
        buy: !Buy ${decide.output}
      code: "return 'buy ' + String(inputs['buy']['qty'])"
      output: str
  output: ${place.output}
inputs:
  decision:
    action: sell
    qty: 2
    price: 1.5
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [21, 12, 21, 33]
      message: 'binding ''buy'' at price: record has unknown fields: ["price"]'
      node: place
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        decision: {action: sell, price: 1.5, qty: 2}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        decision:
          action: sell
          price: 1.5
          qty: 2
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, decide]
  - - pool_commit
    - decide
    - value:
        action: sell
        price: 1.5
        qty: 2
  - - node_succeeded
    - decide
    - {commit: 9}
  - [node_started, place]
  - - node_failed
    - place
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 12, 21, 33]
        message: 'binding ''buy'' at price: record has unknown fields: ["price"]'
        node: place
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        decision:
          action: sell
          price: 1.5
          qty: 2
      interrupted: false
  - - NodeStarted
    - node_id: decide
  - - NodeSucceeded
    - node_id: decide
      output:
        action: sell
        price: 1.5
        qty: 2
      interrupted: false
  - - NodeStarted
    - node_id: place
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 12, 21, 33]
        message: 'binding ''buy'' at price: record has unknown fields: ["price"]'
        node: place
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 12, 21, 33]
        message: 'binding ''buy'' at price: record has unknown fields: ["price"]'
        node: place
