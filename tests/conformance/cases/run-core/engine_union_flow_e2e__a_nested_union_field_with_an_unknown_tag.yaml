kind: run
flow: |2

  id: nested
  name: nested
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', qty: int, price: float}
    Decision: Union(Buy, Sell)
    Text: {text: str}
    Num: {num: int}
    Note: Union(Text, Num)
  input:
    value: !object
  nodes:
    d:
      kind: code
      input:
        value: ${input.value}
      code: |
        return inputs["value"]
      output:
        decision: Decision
        notes: list(Note)
  output: ${d.output}
inputs:
  value:
    decision:
      action: bid
      qty: 1
    notes: []
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.output
      frames:
      - label: flow.yaml
        range: [21, 17, 21, 25]
      message: 'output at decision.action: "bid" is not a tag of the union (expected one of ["buy","sell"])'
      node: d
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        value:
          decision: {action: bid, qty: 1}
          notes: []
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        value:
          decision:
            action: bid
            qty: 1
          notes: []
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - node_failed
    - d
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [21, 17, 21, 25]
        message: 'output at decision.action: "bid" is not a tag of the union (expected one of ["buy","sell"])'
        node: d
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        value:
          decision:
            action: bid
            qty: 1
          notes: []
      interrupted: false
  - - NodeStarted
    - node_id: d
  - - NodeFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [21, 17, 21, 25]
        message: 'output at decision.action: "bid" is not a tag of the union (expected one of ["buy","sell"])'
        node: d
  - - RunFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [21, 17, 21, 25]
        message: 'output at decision.action: "bid" is not a tag of the union (expected one of ["buy","sell"])'
        node: d
