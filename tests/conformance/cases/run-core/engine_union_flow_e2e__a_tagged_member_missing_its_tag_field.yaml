kind: run
flow: |
  id: unions
  name: unions
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', qty: int, price: float}
    Hold: {action: 'Literal(hold)', note: str}
    Decision: Union(Buy, Sell, Hold)
  input:
    decision: !object
  nodes:
    d:
      kind: code
      input:
        decision: ${input.decision}
      code: |
        return inputs["decision"]
      output: Decision
  output: ${d.output}
inputs:
  decision:
    qty: 2
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.output
      frames:
      - label: flow.yaml
        range: [17, 13, 17, 21]
      message: 'output at action: missing tag field ''action'' (expected one of ["buy","hold","sell"])'
      node: d
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        decision: {qty: 2}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        decision:
          qty: 2
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, d]
  - - node_failed
    - d
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [17, 13, 17, 21]
        message: 'output at action: missing tag field ''action'' (expected one of ["buy","hold","sell"])'
        node: d
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        decision:
          qty: 2
      interrupted: false
  - - NodeStarted
    - node_id: d
  - - NodeFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [17, 13, 17, 21]
        message: 'output at action: missing tag field ''action'' (expected one of ["buy","hold","sell"])'
        node: d
  - - RunFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [17, 13, 17, 21]
        message: 'output at action: missing tag field ''action'' (expected one of ["buy","hold","sell"])'
        node: d
