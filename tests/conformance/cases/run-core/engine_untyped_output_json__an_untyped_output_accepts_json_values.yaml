kind: run
flow: |
  id: p
  name: p
  input:
    s: !str
  nodes:
    mk:
      kind: code
      input:
        s: ${input.s}
      code: |
        return [1, "a", {"k": 2.5}]
  output: ${mk.output}
inputs:
  s: x
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
    - 1
    - a
    - k: 2.5
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: x}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: x
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, mk]
  - - pool_commit
    - mk
    - value:
      - 1
      - a
      - k: 2.5
  - - node_succeeded
    - mk
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
      - 1
      - a
      - k: 2.5
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: x
      interrupted: false
  - - NodeStarted
    - node_id: mk
  - - NodeSucceeded
    - node_id: mk
      output:
      - 1
      - a
      - k: 2.5
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
      - 1
      - a
      - k: 2.5
      interrupted: false
  - - RunSucceeded
    - output:
      - 1
      - a
      - k: 2.5
