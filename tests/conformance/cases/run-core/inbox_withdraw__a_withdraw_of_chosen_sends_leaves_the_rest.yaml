# Three messages go to the waiting `take: all`. A withdraw of the second alone takes back only it:
# `inbox_withdrawn` names it, and the take keeps the first and the third.
kind: run
flow: |
  id: f
  name: f
  input:
    notes: !Inbox(str)
  nodes:
    heard:
      kind: call
      call: take
      input:
        from: ${input.notes}
        take: all
  output: ${heard.output.events}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {inbox: notes, event: first, hold: true}
  - {inbox: notes, event: second, hold: true}
  - {inbox: notes, event: third, hold: true}
  - {withdraw: notes, sends: [1]}
expect:
  output:
    status: succeeded
    output: [first, third]
  trace:
  - - run_started
    - null
    - {num_workers: 0}
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - {value: {}}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - {value: {notes: {inbox: notes}}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, heard]
  - - node_waiting
    - heard
    - {call_ids: [r1/heard], waits: [{call_id: r1/heard, inbox: notes, mode: all, tool: take}]}
  - - run_waiting
    - null
    - {node_ids: [heard]}
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: first}
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: second}
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: third}
  - - inbox_withdrawn
    - null
    - {events: [12], inbox: notes}
  - [node_woken, heard]
  - - pool_commit
    - heard
    - {closed: false, events: [11, 13], inbox: notes}
  - - node_succeeded
    - heard
    - {commit: 16}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: [first, third]}
  - - node_succeeded
    - __end__
    - {commit: 19}
  events:
  - [RunStarted]
  - - NodeStarted
    - {node_id: __start__}
  - - NodeSucceeded
    - {node_id: __start__, output: {notes: {inbox: notes}}, interrupted: false}
  - - NodeStarted
    - {node_id: heard}
  - - NodeWaiting
    - {node_id: heard, call_ids: [r1/heard]}
  - - RunWaiting
    - {node_ids: [heard]}
  - - NodeWoken
    - {node_id: heard, timed_out: []}
  - - NodeSucceeded
    - {node_id: heard, output: {closed: false, events: [first, third]}, interrupted: false}
  - - NodeStarted
    - {node_id: __end__}
  - - NodeSucceeded
    - {node_id: __end__, output: [first, third], interrupted: false}
  - - RunSucceeded
    - {output: [first, third]}
