# `first` reads the first message; `second` then waits with the second message assigned. A
# withdraw naming both takes back only the second: `inbox_withdrawn` names it, and the first is
# reported as already read. A withdraw naming the second again appends nothing and reports it as
# already withdrawn; the runner checks both reports against the log.
kind: run
flow: |
  id: f
  name: f
  input:
    notes: !Inbox(str)
  nodes:
    first:
      kind: call
      call: take
      input:
        from: ${input.notes}
    second:
      kind: call
      call: take
      runs_after: [first]
      input:
        from: ${input.notes}
        take: all
  output: {first: "${first.output.events}", second: "${second.output.events}"}
run:
  run_id: r1
  num_workers: 0
host:
  sends:
  - {inbox: notes, event: first}
  - {inbox: notes, event: second, hold: true}
  - {withdraw: notes, sends: [0, 1], hold: true}
  - {withdraw: notes, sends: [1], hold: true}
  - {close: notes}
expect:
  output:
    status: succeeded
    output: {first: [first], second: []}
  trace:
  - - run_started
    - null
    - {num_workers: 0}
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - {value: {}}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - {value: {notes: {inbox: notes}}}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, first]
  - - node_waiting
    - first
    - {call_ids: [r1/first], waits: [{call_id: r1/first, inbox: notes, mode: one, tool: take}]}
  - - run_waiting
    - null
    - {node_ids: [first]}
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: first}
  - [node_woken, first]
  - - pool_commit
    - first
    - {closed: false, events: [11], inbox: notes}
  - - node_succeeded
    - first
    - {commit: 13}
  - [node_started, second]
  - - node_waiting
    - second
    - {call_ids: [r1/second], waits: [{call_id: r1/second, inbox: notes, mode: all, tool: take}]}
  - - run_waiting
    - null
    - {node_ids: [second]}
  - - pool_commit
    - __start__
    - {key: __start__.notes, value: second}
  - - inbox_withdrawn
    - null
    - {chosen: true, events: [18], inbox: notes}
  - - inbox_closed
    - null
    - {inbox: notes}
  - [node_woken, second]
  - - pool_commit
    - second
    - {closed: true, events: [], inbox: notes}
  - - node_succeeded
    - second
    - {commit: 22}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - {value: {first: [first], second: []}}
  - - node_succeeded
    - __end__
    - {commit: 25}
  events:
  - [RunStarted]
  - - NodeStarted
    - {node_id: __start__}
  - - NodeSucceeded
    - {node_id: __start__, output: {notes: {inbox: notes}}, interrupted: false}
  - - NodeStarted
    - {node_id: first}
  - - NodeWaiting
    - {node_id: first, call_ids: [r1/first]}
  - - RunWaiting
    - {node_ids: [first]}
  - - NodeWoken
    - {node_id: first, timed_out: []}
  - - NodeSucceeded
    - {node_id: first, output: {closed: false, events: [first]}, interrupted: false}
  - - NodeStarted
    - {node_id: second}
  - - NodeWaiting
    - {node_id: second, call_ids: [r1/second]}
  - - RunWaiting
    - {node_ids: [second]}
  - - NodeWoken
    - {node_id: second, timed_out: []}
  - - NodeSucceeded
    - {node_id: second, output: {closed: true, events: []}, interrupted: false}
  - - NodeStarted
    - {node_id: __end__}
  - - NodeSucceeded
    - {node_id: __end__, output: {first: [first], second: []}, interrupted: false}
  - - RunSucceeded
    - {output: {first: [first], second: []}}
