# An ask whose `questions` input reads a reference sends them validated (defaults filled) and
# returns the answer record; a flow input stands in for the test's CODE source. The ask has a
# `prompt` because a questions-only ask's `question` is undocumented (seed_26 leaves it out).
kind: run
flow: |
  id: manual_ref
  name: manual_ref
  input:
    qs: !list(object)
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        prompt: "Pick one"
        questions: ${input.qs}
  output: ${ask.output}
inputs:
  qs:
  - question: Which option?
    header: H
    options:
    - label: A
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask:
    - H: A
expect:
  output:
    status: succeeded
    output:
      H: A
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        qs:
        - header: H
          options:
          - {label: A}
          question: Which option?
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        qs:
        - header: H
          options:
          - label: A
          question: Which option?
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - pool_commit
    - ask
    - value:
        H: A
  - - node_succeeded
    - ask
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        H: A
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        qs:
        - header: H
          options:
          - label: A
          question: Which option?
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeSucceeded
    - node_id: ask
      output:
        H: A
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        H: A
      interrupted: false
  - - RunSucceeded
    - output:
        H: A
  tool_calls:
    ask:
    - args:
        question: Pick one
        questions:
        - question: Which option?
          header: H
          options:
          - label: A
            description: ''
          multi_select: false
        answer_schema:
        - name: answer
          type: object
          required: true
        node_id: ask
      call_id: r1/ask
      attempt: 1
      node: ask
