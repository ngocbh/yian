# Question headers must be unique: upstream questions with a repeated header fail the ask before it
# asks.
kind: run
flow: |
  id: manual_ref
  name: manual_ref
  input:
    qs: !list(object)
  nodes:
    ask:
      kind: tool
      tool_id: ask
      input:
        questions: ${input.qs}
  output: ${ask.output}
inputs:
  qs:
  - question: a
    header: D
  - question: b
    header: D
run:
  run_id: r1
  num_workers: 0
host:
  human:
    ask: []
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: question headers must be unique, got ["D","D"]
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 6]
      node: ask
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        qs:
        - {header: D, question: a}
        - {header: D, question: b}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        qs:
        - header: D
          question: a
        - header: D
          question: b
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - node_failed
    - ask
    - failure:
        code: node.execute
        message: question headers must be unique, got ["D","D"]
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        qs:
        - header: D
          question: a
        - header: D
          question: b
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeFailed
    - failure:
        code: node.execute
        message: question headers must be unique, got ["D","D"]
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
  - - RunFailed
    - failure:
        code: node.execute
        message: question headers must be unique, got ["D","D"]
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 6]
        node: ask
