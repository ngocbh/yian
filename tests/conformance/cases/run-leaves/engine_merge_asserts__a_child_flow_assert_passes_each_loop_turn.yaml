kind: run
flow: |2

  id: c2loop
  name: c2_loop
  input:
    start: !int
  defs:
    body:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output: {n: !int}
          code: |
            return {"n": inputs["n"] + 1}
      output: ${step.output}
      asserts:
        - "step.output.n >= 1"
  nodes:
    spin:
      kind: loop
      call: body
      input:
        n: ${input.start}
      times: 3
  output: ${spin.output}
inputs:
  start: 5
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: 8
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {start: 5}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        start: 5
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, spin]
  - - pool_commit
    - spin
    - from: {__start__: 6}
      key: spin#0/__start__
  - - node_expanded
    - spin
    - prune_ids: []
  - [node_started, spin#0/__start__]
  - - node_succeeded
    - spin#0/__start__
    - commit: 9
  - [node_started, spin#0/step]
  - - pool_commit
    - spin#0/step
    - value:
        n: 6
  - - node_succeeded
    - spin#0/step
    - {commit: 14}
  - [node_started, spin#0/__end__]
  - - pool_commit
    - spin#0/__end__
    - from: {spin#0/step: 14}
  - - node_succeeded
    - spin#0/__end__
    - {commit: 17}
  - [node_started, spin~1]
  - - pool_commit
    - spin~1
    - from: {spin#0/__end__: 17}
      key: spin#1/__start__
  - - node_expanded
    - spin~1
    - prune_ids: [spin#0/__end__, spin#0/__start__, spin#0/step, spin~1]
  - [node_started, spin#1/__start__]
  - - node_succeeded
    - spin#1/__start__
    - commit: 20
  - [node_started, spin#1/step]
  - - pool_commit
    - spin#1/step
    - value:
        n: 7
  - - node_succeeded
    - spin#1/step
    - {commit: 25}
  - [node_started, spin#1/__end__]
  - - pool_commit
    - spin#1/__end__
    - from: {spin#1/step: 25}
  - - node_succeeded
    - spin#1/__end__
    - {commit: 28}
  - [node_started, spin~2]
  - - pool_commit
    - spin~2
    - from: {spin#1/__end__: 28}
      key: spin#2/__start__
  - - node_expanded
    - spin~2
    - prune_ids: [spin#1/__end__, spin#1/__start__, spin#1/step, spin~2]
  - [node_started, spin#2/__start__]
  - - node_succeeded
    - spin#2/__start__
    - commit: 31
  - [node_started, spin#2/step]
  - - pool_commit
    - spin#2/step
    - value:
        n: 8
  - - node_succeeded
    - spin#2/step
    - {commit: 36}
  - [node_started, spin#2/__end__]
  - - pool_commit
    - spin#2/__end__
    - from: {spin#2/step: 36}
  - - node_succeeded
    - spin#2/__end__
    - {commit: 39}
  - [node_started, spin~3]
  - - pool_commit
    - spin~3
    - key: spin
      from: {spin#2/__end__: 39}
  - - node_succeeded
    - spin~3
    - {commit: 42}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: 8
  - - node_succeeded
    - __end__
    - {commit: 45}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        start: 5
      interrupted: false
  - - NodeStarted
    - node_id: spin
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 5
        - 0
      node_id: spin
  - - NodeStarted
    - node_id: spin#0/__start__
  - - NodeSucceeded
    - node_id: spin#0/__start__
      output:
        n: 5
      interrupted: false
  - - NodeStarted
    - node_id: spin#0/step
  - - NodeSucceeded
    - node_id: spin#0/step
      output:
        n: 6
      interrupted: false
  - - NodeStarted
    - node_id: spin#0/__end__
  - - NodeSucceeded
    - node_id: spin#0/__end__
      output:
        n: 6
      interrupted: false
  - - NodeStarted
    - node_id: spin~1
  - - NodeExpanded
    - grow:
        prune: [spin#0/__end__, spin#0/__start__, spin#0/step, spin~1]
        seed:
        - n: 6
        - 1
      node_id: spin~1
  - - NodeStarted
    - node_id: spin#1/__start__
  - - NodeSucceeded
    - node_id: spin#1/__start__
      output:
        n: 6
      interrupted: false
  - - NodeStarted
    - node_id: spin#1/step
  - - NodeSucceeded
    - node_id: spin#1/step
      output:
        n: 7
      interrupted: false
  - - NodeStarted
    - node_id: spin#1/__end__
  - - NodeSucceeded
    - node_id: spin#1/__end__
      output:
        n: 7
      interrupted: false
  - - NodeStarted
    - node_id: spin~2
  - - NodeExpanded
    - grow:
        prune: [spin#1/__end__, spin#1/__start__, spin#1/step, spin~2]
        seed:
        - n: 7
        - 2
      node_id: spin~2
  - - NodeStarted
    - node_id: spin#2/__start__
  - - NodeSucceeded
    - node_id: spin#2/__start__
      output:
        n: 7
      interrupted: false
  - - NodeStarted
    - node_id: spin#2/step
  - - NodeSucceeded
    - node_id: spin#2/step
      output:
        n: 8
      interrupted: false
  - - NodeStarted
    - node_id: spin#2/__end__
  - - NodeSucceeded
    - node_id: spin#2/__end__
      output:
        n: 8
      interrupted: false
  - - NodeStarted
    - node_id: spin~3
  - - NodeSucceeded
    - commit_as: spin
      node_id: spin~3
      output:
        n: 8
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: 8
      interrupted: false
  - - RunSucceeded
    - output:
        n: 8
