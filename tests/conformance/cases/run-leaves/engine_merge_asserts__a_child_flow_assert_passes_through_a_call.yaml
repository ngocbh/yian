kind: run
flow: |2

  id: c2call
  name: c2_call
  input:
    seed: !int

  defs:
    child:
      input:
        seed: !int
      nodes:
        emit:
          kind: code
          input:
            seed: ${input.seed}
          output: {n: int}
          code: |
            return {"n": inputs["seed"] + 1}
      output: ${emit.output}
      asserts:
        - "emit.output.n >= 1"

  nodes:
    callee:
      kind: call
      call: child
      input:
        seed: ${input.seed}
  output: ${callee.output}
inputs:
  seed: 5
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: 6
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {seed: 5}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        seed: 5
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, callee]
  - - pool_commit
    - callee
    - from: {__start__: 6}
      key: callee/__start__
  - - node_expanded
    - callee
    - prune_ids: []
  - [node_started, callee/__start__]
  - - node_succeeded
    - callee/__start__
    - commit: 9
  - [node_started, callee/emit]
  - - pool_commit
    - callee/emit
    - value:
        n: 6
  - - node_succeeded
    - callee/emit
    - {commit: 14}
  - [node_started, callee/__end__]
  - - pool_commit
    - callee/__end__
    - key: callee
      from: {callee/emit: 14}
  - - node_succeeded
    - callee/__end__
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: 6
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        seed: 5
      interrupted: false
  - - NodeStarted
    - node_id: callee
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          seed: 5
      node_id: callee
  - - NodeStarted
    - node_id: callee/__start__
  - - NodeSucceeded
    - node_id: callee/__start__
      output:
        seed: 5
      interrupted: false
  - - NodeStarted
    - node_id: callee/emit
  - - NodeSucceeded
    - node_id: callee/emit
      output:
        n: 6
      interrupted: false
  - - NodeStarted
    - node_id: callee/__end__
  - - NodeSucceeded
    - commit_as: callee
      node_id: callee/__end__
      output:
        n: 6
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: 6
      interrupted: false
  - - RunSucceeded
    - output:
        n: 6
