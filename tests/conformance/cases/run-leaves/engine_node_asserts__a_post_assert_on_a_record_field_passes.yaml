kind: run
flow: |2

  id: recf
  name: recf
  input:
    topic: !str
  nodes:
    x:
      kind: code
      code: ./fixtures/compose_codefns.ts:make_report
      input:
        topic: ${input.topic}
      output:
        report: !str
        n: !int
      asserts:
        - "output.n >= 0"
  output: ${x.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: 4
      report: report for ACME
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, x]
  - - pool_commit
    - x
    - value:
        n: 4
        report: report for ACME
  - - node_succeeded
    - x
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: 4
        report: report for ACME
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: x
  - - NodeSucceeded
    - node_id: x
      output:
        n: 4
        report: report for ACME
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: 4
        report: report for ACME
      interrupted: false
  - - RunSucceeded
    - output:
        n: 4
        report: report for ACME
