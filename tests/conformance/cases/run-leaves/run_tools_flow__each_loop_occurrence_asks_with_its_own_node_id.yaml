# An ask in a LOOP body asks once per iteration, each request naming its occurrence
# (loop#0/ask, loop#1/ask).
kind: run
flow: |
  id: loop_ask
  name: loop_ask
  defs:
    turn:
      input:
        count: !int
        last: !str
      nodes:
        ask:
          kind: tool
          tool_id: ask
          input:
            prompt: "next turn"
          output: str
      output:
        count: ${input.count + 1}
        last: ${ask.output}
  nodes:
    loop:
      kind: loop
      call: turn
      input:
        count: 0
        last: ""
      while: count < 2
      max: 5
  output: ${loop.output}
run:
  run_id: r1
  num_workers: 0
host:
  human:
    loop#0/ask: [ok]
    loop#1/ask: [ok]
expect:
  output:
    status: succeeded
    output:
      count: 2
      last: ok
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/ask]
  - - pool_commit
    - loop#0/ask
    - value: ok
  - - node_succeeded
    - loop#0/ask
    - {commit: 14}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/__start__: 9, loop#0/ask: 14}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 17}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 17}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/ask, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 20
  - [node_started, loop#1/ask]
  - - pool_commit
    - loop#1/ask
    - value: ok
  - - node_succeeded
    - loop#1/ask
    - {commit: 25}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/__start__: 20, loop#1/ask: 25}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 28}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - key: loop
      from: {loop#1/__end__: 28}
  - - node_succeeded
    - loop~2
    - {commit: 31}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        count: 2
        last: ok
  - - node_succeeded
    - __end__
    - {commit: 34}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - node_id: loop
      grow:
        seed:
        - count: 0
          last: ''
        - 0
        prune: []
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        count: 0
        last: ''
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/ask
  - - NodeSucceeded
    - node_id: loop#0/ask
      output: ok
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        count: 1
        last: ok
      interrupted: false
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - node_id: loop~1
      grow:
        seed:
        - count: 1
          last: ok
        - 1
        prune: [loop#0/__end__, loop#0/__start__, loop#0/ask, loop~1]
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        count: 1
        last: ok
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/ask
  - - NodeSucceeded
    - node_id: loop#1/ask
      output: ok
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        count: 2
        last: ok
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeSucceeded
    - node_id: loop~2
      output:
        count: 2
        last: ok
      commit_as: loop
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        count: 2
        last: ok
      interrupted: false
  - - RunSucceeded
    - output:
        count: 2
        last: ok
  tool_calls:
    ask:
    - args:
        question: next turn
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: loop#0/ask
      call_id: r1/loop#0/ask
      attempt: 1
      node: loop#0/ask
    - args:
        question: next turn
        answer_schema:
        - name: answer
          type: str
          required: true
        node_id: loop#1/ask
      call_id: r1/loop#1/ask
      attempt: 1
      node: loop#1/ask
