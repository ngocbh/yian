# Every input, typed, reaches a reference CODE node, and deep dotted reads build the output.
# Only `output` is checked: the trace holds `summary.total`, an int CODE returns into a float
# slot, which keeps it an int; the output doesn't hold it.
kind: run
flow: |
  # 13 — The type grammar: scalars, lists, objects, nesting.
  #
  # A planning CODE node whose I/O exercises every type form. Shows: all scalars
  # (str / int / float / bool / date), list(X), inline vs block objects (records),
  # nested objects, and deep dotted access (${plan.output.summary.meta.as_of}).

  id: types-objects
  name: types_objects
  description: Exercise the type grammar — scalars, list(X), inline/block/nested objects.

  typedefs:
    Bands: { lower: float, upper: float }   # inline record (flow style)
    Config:                      # a nested record parameter (block style)
      regroup: bool
      bands: Bands
  input:
    topic: !str
    names: !list(str)
    quantity: !int
    budget: !float
    as_of: !date
    dry_run: !bool
    weights: !list(float)
    config: !Config

  nodes:
    plan:
      kind: code
      input:
        topic:  ${input.topic}
        names:   ${input.names}
        quantity:  ${input.quantity}
        budget:  ${input.budget}
        as_of:   ${input.as_of}
        dry_run: ${input.dry_run}
        weights: ${input.weights}
        config:  ${input.config}    # bind the whole nested object
      output:                       # a nested object output
        items: !list(str)
        summary:
          count: !int
          total: !float
          meta: { as_of: !date, dry_run: !bool }   # nested inline object
      code: ./fixtures/seeds.ts:build_outline

  output:
    items: ${plan.output.items}
    count:  ${plan.output.summary.count}         # dot into a nested object output
    as_of:  ${plan.output.summary.meta.as_of}    # two-level dotted access
inputs:
  topic: rates
  names: [a, b]
  quantity: 3
  budget: 12.5
  as_of: "2026-10-01"
  dry_run: true
  weights: [0.25, 0.75]
  config: {regroup: false, bands: {lower: 0.5, upper: 1.5}}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: succeeded
    output: {items: [item a, item b], count: 2, as_of: "2026-10-01"}
