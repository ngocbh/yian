# An inline CODE body with no `return` loads, then fails its node at the `code:` value.
# The flow's header comment (the has-`return` load gate) describes an older CODE form.
kind: run
flow: |
  # e31 — an inline CODE body with no `return`. COMPILE: the has-`return` load gate rejects
  # it with a located LoadError before any node runs — a value-producing node that never
  # returns would silently yield None. Anchored at the `code:` field (a missing return has no
  # single interior line).
  id: err-inline-no-return
  name: err_inline_no_return
  input:
    topic: !str
  nodes:
    silent:
      kind: code
      input:
        topic: ${input.topic}
      output: str
      code: |
        const summary = inputs.topic.toUpperCase()
  output: ${silent.output}
inputs: {topic: X}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: failed
    failure:
      code: node.execute
      message: "CODE body returned no value; return null for no value"
      node: silent
      # The whole `code:` value, from `|` on line 15 to the `output:` key that ends it.
      frames: [{label: flow.yaml, range: [15, 11, 17, 1]}]
  trace:
    - [run_started, null, {num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {topic: X}}]
    - [node_started, __start__]
    - [pool_commit, __start__, {value: {topic: X}}]
    - [node_succeeded, __start__, {commit: 6}]
    - [node_started, silent]
    - - node_failed
      - silent
      - failure:
          code: node.execute
          message: "CODE body returned no value; return null for no value"
          node: silent
          frames: [{label: flow.yaml, range: [15, 11, 17, 1]}]
