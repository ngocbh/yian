# A sleep `until` text outside the date/datetime grammar fails contract.input, naming the accepted
# forms. The text comes from an input: a literal `until:` is checked at load (load-leaves).
# The message shows the resolved `until` text in the text form ("20260102").
kind: run
flow: |
  id: wait_bad
  name: wait_bad
  input:
    t: !str
  nodes:
    settle:
      kind: tool
      tool_id: sleep
      input:
        until: ${input.t}
  output: ${settle.output}
inputs:
  t: '20260102'
run:
  run_id: r1
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      message: 'sleep `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 9]
      node: settle
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {t: '20260102'}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        t: '20260102'
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, settle]
  - - node_failed
    - settle
    - failure:
        code: contract.input
        message: 'sleep `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 9]
        node: settle
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        t: '20260102'
      interrupted: false
  - - NodeStarted
    - node_id: settle
  - - NodeFailed
    - failure:
        code: contract.input
        message: 'sleep `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 9]
        node: settle
  - - RunFailed
    - failure:
        code: contract.input
        message: 'sleep `until` "20260102": must be a date (2026-05-21) or datetime (2026-05-21T14:30[:00][Z|+07:00])'
        frames:
        - label: flow.yaml
          range: [6, 3, 6, 9]
        node: settle
