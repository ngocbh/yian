# A TOOL node in a LOOP body gets one call id per iteration: <run id>/loop#<i>/place.
kind: run
flow: |
  id: loop_ctx
  name: loop_ctx
  defs:
    turn:
      input:
        count: !int
      nodes:
        place:
          kind: tool
          tool_id: place
      output:
        count: ${input.count + 1}
  nodes:
    loop:
      kind: loop
      call: turn
      input:
        count: 0
      while: count < 3
      max: 5
  output: ${loop.output}
run:
  run_id: run-7f3a
  num_workers: 0
host:
  tools:
    place:
      parameters:
        type: object
        properties: {}
      results:
      - return: p0
      - return: p1
      - return: p2
expect:
  output:
    status: succeeded
    output:
      count: 3
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: run-7f3a}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/__start__: 9}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 14}
  - [node_started, loop#0/place]
  - - pool_commit
    - loop#0/place
    - value: p0
  - - node_succeeded
    - loop#0/place
    - {commit: 17}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 14}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/place, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 20
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/__start__: 20}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 25}
  - [node_started, loop#1/place]
  - - pool_commit
    - loop#1/place
    - value: p1
  - - node_succeeded
    - loop#1/place
    - {commit: 28}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - from: {loop#1/__end__: 25}
      key: loop#2/__start__
  - - node_expanded
    - loop~2
    - prune_ids: [loop#1/__end__, loop#1/__start__, loop#1/place, loop~2]
  - [node_started, loop#2/__start__]
  - - node_succeeded
    - loop#2/__start__
    - commit: 31
  - [node_started, loop#2/__end__]
  - - pool_commit
    - loop#2/__end__
    - from: {loop#2/__start__: 31}
  - - node_succeeded
    - loop#2/__end__
    - {commit: 36}
  - [node_started, loop#2/place]
  - - pool_commit
    - loop#2/place
    - value: p2
  - - node_succeeded
    - loop#2/place
    - {commit: 39}
  - [node_started, loop~3]
  - - pool_commit
    - loop~3
    - key: loop
      from: {loop#2/__end__: 36}
  - - node_succeeded
    - loop~3
    - {commit: 42}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        count: 3
  - - node_succeeded
    - __end__
    - {commit: 45}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - node_id: loop
      grow:
        seed:
        - count: 0
        - 0
        prune: []
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        count: 0
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        count: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/place
  - - NodeSucceeded
    - node_id: loop#0/place
      output: p0
      interrupted: false
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - node_id: loop~1
      grow:
        seed:
        - count: 1
        - 1
        prune: [loop#0/__end__, loop#0/__start__, loop#0/place, loop~1]
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        count: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        count: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/place
  - - NodeSucceeded
    - node_id: loop#1/place
      output: p1
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeExpanded
    - node_id: loop~2
      grow:
        seed:
        - count: 2
        - 2
        prune: [loop#1/__end__, loop#1/__start__, loop#1/place, loop~2]
  - - NodeStarted
    - node_id: loop#2/__start__
  - - NodeSucceeded
    - node_id: loop#2/__start__
      output:
        count: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#2/__end__
  - - NodeSucceeded
    - node_id: loop#2/__end__
      output:
        count: 3
      interrupted: false
  - - NodeStarted
    - node_id: loop#2/place
  - - NodeSucceeded
    - node_id: loop#2/place
      output: p2
      interrupted: false
  - - NodeStarted
    - node_id: loop~3
  - - NodeSucceeded
    - node_id: loop~3
      output:
        count: 3
      commit_as: loop
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        count: 3
      interrupted: false
  - - RunSucceeded
    - output:
        count: 3
  tool_calls:
    place:
    - args: {}
      call_id: run-7f3a/loop#0/place
      attempt: 1
      node: loop#0/place
    - args: {}
      call_id: run-7f3a/loop#1/place
      attempt: 1
      node: loop#1/place
    - args: {}
      call_id: run-7f3a/loop#2/place
      attempt: 1
      node: loop#2/place
