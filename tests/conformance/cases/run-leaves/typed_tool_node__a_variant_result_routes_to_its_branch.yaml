# A TOOL return checked against a declared union routes a CASE on its tag; the test's CODE branches
# are value entries here.
kind: run
flow: |
  id: orders
  name: orders
  typedefs:
    Filled: {type: 'Literal(filled)', qty: int}
    Interrupted: {type: 'Literal(interrupted)', by: str, partial: 'Optional(int)'}
    OrderResult: Union(Filled, Interrupted)
  nodes:
    place:
      kind: tool
      tool_id: place_order
      input:
        qty: 5
      output: !OrderResult
    route:
      kind: case
      on: ${place.output.type}
      cases:
        - when: filled
          then: on_filled
        - when: interrupted
          then: on_interrupted
    on_filled: !str "filled ${place.output.qty}"
    on_interrupted: !str "stopped by ${place.output.by}"
  output: ${on_filled.output | on_interrupted.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    place_order:
      parameters:
        type: object
        properties:
          qty:
            type: integer
        required: [qty]
      results:
      - return:
          type: interrupted
          by: owner
          partial: 2
expect:
  output:
    status: succeeded
    output: stopped by owner
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, place]
  - - pool_commit
    - place
    - value:
        by: owner
        partial: 2
        type: interrupted
  - - node_succeeded
    - place
    - {commit: 9}
  - [node_started, route]
  - - node_routed
    - route
    - handle: on_interrupted
  - [node_started, on_interrupted]
  - - pool_commit
    - on_interrupted
    - value: stopped by owner
  - - node_succeeded
    - on_interrupted
    - {commit: 14}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: stopped by owner
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: place
  - - NodeSucceeded
    - node_id: place
      output:
        by: owner
        partial: 2
        type: interrupted
      interrupted: false
  - - NodeStarted
    - node_id: route
  - - NodeRouted
    - node_id: route
      handle: on_interrupted
  - - NodeSkipped
    - node_id: on_filled
  - - NodeStarted
    - node_id: on_interrupted
  - - NodeSucceeded
    - node_id: on_interrupted
      output: stopped by owner
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: stopped by owner
      interrupted: false
  - - RunSucceeded
    - output: stopped by owner
  tool_calls:
    place_order:
    - args:
        qty: 5
      call_id: r1/place
      attempt: 1
      node: place
