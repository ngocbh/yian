# A TOOL input the tool doesn't take fails the run at its start, before the log, naming the inputs
# the tool takes.
kind: run
flow: |
  id: placing
  name: placing
  nodes:
    place:
      kind: tool
      tool_id: place_order
      input:
        qtty: 5
        sym: X
  output: ${place.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    place_order:
      parameters:
        type: object
        properties:
          qty:
            type: integer
          sym:
            type: string
        required: [qty, sym]
      results: []
expect:
  raises:
    class: RangeError
    message: 'TOOL node ''place'' input ''qtty'': tool ''place_order'' takes no such input; it takes ["qty","sym"]'
  trace: []
  events: []
