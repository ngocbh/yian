# A TOOL node may leave out an optional tool parameter: the call's args hold only the bound input.
kind: run
flow: |
  id: placing
  name: placing
  nodes:
    place:
      kind: tool
      tool_id: place_order
      input:
        qty: 5
  output: ${place.output}
run:
  run_id: r1
  num_workers: 0
host:
  tools:
    place_order:
      parameters:
        type: object
        properties:
          qty:
            type: integer
          sym:
            type: string
        required: [qty]
      results:
      - return: 5 AAPL
expect:
  output:
    status: succeeded
    output: 5 AAPL
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, place]
  - - pool_commit
    - place
    - value: 5 AAPL
  - - node_succeeded
    - place
    - {commit: 9}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: 5 AAPL
  - - node_succeeded
    - __end__
    - {commit: 12}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: place
  - - NodeSucceeded
    - node_id: place
      output: 5 AAPL
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: 5 AAPL
      interrupted: false
  - - RunSucceeded
    - output: 5 AAPL
  tool_calls:
    place_order:
    - args:
        qty: 5
      call_id: r1/place
      attempt: 1
      node: place
