kind: run
flow: |2

  id: named
  name: named
  input:
    z: !int
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
          output:
            n: Optional(int)
          code: |
            return {"n": null}
      output: ${bump.output}
  nodes:
    repeat:
      kind: loop
      times: 2
      call: step
      input:
        n: !int ${input.z}
  output: ${repeat.output}
inputs:
  z: 0
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.input
      frames:
      - label: flow.yaml
        range: [21, 3, 21, 9]
      - label: flow.yaml
        range: [9, 10, 9, 14]
      message: 'input ''n'': null does not match declared type int'
      node: repeat#1/__start__
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {z: 0}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        z: 0
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, repeat]
  - - pool_commit
    - repeat
    - from: {__start__: 6}
      key: repeat#0/__start__
  - - node_expanded
    - repeat
    - prune_ids: []
  - [node_started, repeat#0/__start__]
  - - node_succeeded
    - repeat#0/__start__
    - commit: 9
  - [node_started, repeat#0/bump]
  - - pool_commit
    - repeat#0/bump
    - value:
        n: null
  - - node_succeeded
    - repeat#0/bump
    - {commit: 14}
  - [node_started, repeat#0/__end__]
  - - pool_commit
    - repeat#0/__end__
    - from: {repeat#0/bump: 14}
  - - node_succeeded
    - repeat#0/__end__
    - {commit: 17}
  - [node_started, repeat~1]
  - - node_expanded
    - repeat~1
    - prune_ids: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
  - [node_started, repeat#1/__start__]
  - - node_failed
    - repeat#1/__start__
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 9]
        - label: flow.yaml
          range: [9, 10, 9, 14]
        message: 'input ''n'': null does not match declared type int'
        node: repeat#1/__start__
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        z: 0
      interrupted: false
  - - NodeStarted
    - node_id: repeat
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 0
        - 0
      node_id: repeat
  - - NodeStarted
    - node_id: repeat#0/__start__
  - - NodeSucceeded
    - node_id: repeat#0/__start__
      output:
        n: 0
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/bump
  - - NodeSucceeded
    - node_id: repeat#0/bump
      output:
        n: null
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/__end__
  - - NodeSucceeded
    - node_id: repeat#0/__end__
      output:
        n: null
      interrupted: false
  - - NodeStarted
    - node_id: repeat~1
  - - NodeExpanded
    - grow:
        prune: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
        seed:
        - n: null
        - 1
      node_id: repeat~1
  - - NodeStarted
    - node_id: repeat#1/__start__
  - - NodeFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 9]
        - label: flow.yaml
          range: [9, 10, 9, 14]
        message: 'input ''n'': null does not match declared type int'
        node: repeat#1/__start__
  - - RunFailed
    - failure:
        code: contract.input
        frames:
        - label: flow.yaml
          range: [21, 3, 21, 9]
        - label: flow.yaml
          range: [9, 10, 9, 14]
        message: 'input ''n'': null does not match declared type int'
        node: repeat#1/__start__
