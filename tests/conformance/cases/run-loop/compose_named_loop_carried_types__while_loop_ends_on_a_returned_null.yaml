kind: run
flow: |2

  id: named
  name: named
  input:
    z: !int
  defs:
    step:
      input:
        n: !int
      nodes:
        bump:
          kind: code
          input:
            n: ${input.n}
          output:
            n: !Optional(int)
          code: |
            return {"n": inputs["n"] >= 2 ? null : inputs["n"] + 1}
      output: ${bump.output}
  nodes:
    repeat:
      kind: loop
      while: ${n != null}
      max: 10
      call: step
      input:
        n: ${input.z}
  output: ${repeat.output}
inputs:
  z: 0
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: null
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {z: 0}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        z: 0
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, repeat]
  - - pool_commit
    - repeat
    - from: {__start__: 6}
      key: repeat#0/__start__
  - - node_expanded
    - repeat
    - prune_ids: []
  - [node_started, repeat#0/__start__]
  - - node_succeeded
    - repeat#0/__start__
    - commit: 9
  - [node_started, repeat#0/bump]
  - - pool_commit
    - repeat#0/bump
    - value:
        n: 1
  - - node_succeeded
    - repeat#0/bump
    - {commit: 14}
  - [node_started, repeat#0/__end__]
  - - pool_commit
    - repeat#0/__end__
    - from: {repeat#0/bump: 14}
  - - node_succeeded
    - repeat#0/__end__
    - {commit: 17}
  - [node_started, repeat~1]
  - - pool_commit
    - repeat~1
    - from: {repeat#0/__end__: 17}
      key: repeat#1/__start__
  - - node_expanded
    - repeat~1
    - prune_ids: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
  - [node_started, repeat#1/__start__]
  - - node_succeeded
    - repeat#1/__start__
    - commit: 20
  - [node_started, repeat#1/bump]
  - - pool_commit
    - repeat#1/bump
    - value:
        n: 2
  - - node_succeeded
    - repeat#1/bump
    - {commit: 25}
  - [node_started, repeat#1/__end__]
  - - pool_commit
    - repeat#1/__end__
    - from: {repeat#1/bump: 25}
  - - node_succeeded
    - repeat#1/__end__
    - {commit: 28}
  - [node_started, repeat~2]
  - - pool_commit
    - repeat~2
    - from: {repeat#1/__end__: 28}
      key: repeat#2/__start__
  - - node_expanded
    - repeat~2
    - prune_ids: [repeat#1/__end__, repeat#1/__start__, repeat#1/bump, repeat~2]
  - [node_started, repeat#2/__start__]
  - - node_succeeded
    - repeat#2/__start__
    - commit: 31
  - [node_started, repeat#2/bump]
  - - pool_commit
    - repeat#2/bump
    - value:
        n: null
  - - node_succeeded
    - repeat#2/bump
    - {commit: 36}
  - [node_started, repeat#2/__end__]
  - - pool_commit
    - repeat#2/__end__
    - from: {repeat#2/bump: 36}
  - - node_succeeded
    - repeat#2/__end__
    - {commit: 39}
  - [node_started, repeat~3]
  - - pool_commit
    - repeat~3
    - key: repeat
      from: {repeat#2/__end__: 39}
  - - node_succeeded
    - repeat~3
    - {commit: 42}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: null
  - - node_succeeded
    - __end__
    - {commit: 45}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        z: 0
      interrupted: false
  - - NodeStarted
    - node_id: repeat
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 0
        - 0
      node_id: repeat
  - - NodeStarted
    - node_id: repeat#0/__start__
  - - NodeSucceeded
    - node_id: repeat#0/__start__
      output:
        n: 0
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/bump
  - - NodeSucceeded
    - node_id: repeat#0/bump
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat#0/__end__
  - - NodeSucceeded
    - node_id: repeat#0/__end__
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat~1
  - - NodeExpanded
    - grow:
        prune: [repeat#0/__end__, repeat#0/__start__, repeat#0/bump, repeat~1]
        seed:
        - n: 1
        - 1
      node_id: repeat~1
  - - NodeStarted
    - node_id: repeat#1/__start__
  - - NodeSucceeded
    - node_id: repeat#1/__start__
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: repeat#1/bump
  - - NodeSucceeded
    - node_id: repeat#1/bump
      output:
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: repeat#1/__end__
  - - NodeSucceeded
    - node_id: repeat#1/__end__
      output:
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: repeat~2
  - - NodeExpanded
    - grow:
        prune: [repeat#1/__end__, repeat#1/__start__, repeat#1/bump, repeat~2]
        seed:
        - n: 2
        - 2
      node_id: repeat~2
  - - NodeStarted
    - node_id: repeat#2/__start__
  - - NodeSucceeded
    - node_id: repeat#2/__start__
      output:
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: repeat#2/bump
  - - NodeSucceeded
    - node_id: repeat#2/bump
      output:
        n: null
      interrupted: false
  - - NodeStarted
    - node_id: repeat#2/__end__
  - - NodeSucceeded
    - node_id: repeat#2/__end__
      output:
        n: null
      interrupted: false
  - - NodeStarted
    - node_id: repeat~3
  - - NodeSucceeded
    - commit_as: repeat
      node_id: repeat~3
      output:
        n: null
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: null
      interrupted: false
  - - RunSucceeded
    - output:
        n: null
