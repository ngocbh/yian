kind: run
flow: |2

  id: loop-seed
  name: loop_seed
  typedefs:
    Done: {answer: str}
    More: {hint: str}
  defs:
    body:
      input:
        n: !int
      nodes:
        step:
          kind: code
          input:
            n: ${input.n}
          output:
            n: int
            r: Done
          code: |
            return {"n": inputs["n"] + 1, "r": {"answer": "ok"}}
      output: ${step.output}
  nodes:
    ask:
      kind: loop
      call: body
      while: not isinstance(r, Done)
      max: 5
      input:
        n: 0
        r: null
  output: ${ask.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: 1
      r:
        answer: ok
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, ask]
  - - pool_commit
    - ask
    - from: {}
      key: ask#0/__start__
  - - node_expanded
    - ask
    - prune_ids: []
  - [node_started, ask#0/__start__]
  - - node_succeeded
    - ask#0/__start__
    - commit: 9
  - [node_started, ask#0/step]
  - - pool_commit
    - ask#0/step
    - value:
        n: 1
        r:
          answer: ok
  - - node_succeeded
    - ask#0/step
    - {commit: 14}
  - [node_started, ask#0/__end__]
  - - pool_commit
    - ask#0/__end__
    - from: {ask#0/step: 14}
  - - node_succeeded
    - ask#0/__end__
    - {commit: 17}
  - [node_started, ask~1]
  - - pool_commit
    - ask~1
    - key: ask
      from: {ask#0/__end__: 17}
  - - node_succeeded
    - ask~1
    - {commit: 20}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: 1
        r:
          answer: ok
  - - node_succeeded
    - __end__
    - {commit: 23}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: ask
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 0
          r: null
        - 0
      node_id: ask
  - - NodeStarted
    - node_id: ask#0/__start__
  - - NodeSucceeded
    - node_id: ask#0/__start__
      output:
        n: 0
      interrupted: false
  - - NodeStarted
    - node_id: ask#0/step
  - - NodeSucceeded
    - node_id: ask#0/step
      output:
        n: 1
        r:
          answer: ok
      interrupted: false
  - - NodeStarted
    - node_id: ask#0/__end__
  - - NodeSucceeded
    - node_id: ask#0/__end__
      output:
        n: 1
        r:
          answer: ok
      interrupted: false
  - - NodeStarted
    - node_id: ask~1
  - - NodeSucceeded
    - commit_as: ask
      node_id: ask~1
      output:
        n: 1
        r:
          answer: ok
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: 1
        r:
          answer: ok
      interrupted: false
  - - RunSucceeded
    - output:
        n: 1
        r:
          answer: ok
