kind: run
flow: |2

  id: partial-chat
  name: partial_chat
  typedefs:
    Person:
      name: str
  input:
    person: !Person
    talking_to: !str
  defs:
    turn:
      input:
        person: !Person
        talking_to: !str
        n: !int
      nodes:
        step:
          kind: code
          code: |
            if (inputs["person"]["name"] !== "Ada") throw new Error("assert")
            if (inputs["talking_to"] !== "Bob") throw new Error("assert")
            const n = inputs["n"] + 1
            return {"n": n, "done": n >= 3}
          input:
            person: ${input.person}
            talking_to: ${input.talking_to}
            n: ${input.n}
          output:
            n: !int
            done: !bool
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: turn
      input:
        person: ${input.person}
        talking_to: ${input.talking_to}
        n: 0
        done: false
      while: not done
      asserts:
        - "n < 2"
  output: ${loop.output}
inputs:
  person:
    name: Ada
  talking_to: Bob
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: assertion.failed
      frames:
      - label: flow.yaml
        range: [43, 9, 43, 16]
      message: 'node ''loop~2'' pre-assert failed: n < 2'
      node: loop~2
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        person: {name: Ada}
        talking_to: Bob
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        person:
          name: Ada
        talking_to: Bob
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {__start__: 6}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/step]
  - - pool_commit
    - loop#0/step
    - value:
        done: false
        n: 1
  - - node_succeeded
    - loop#0/step
    - {commit: 14}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/step: 14}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 17}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 17}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 20
  - [node_started, loop#1/step]
  - - pool_commit
    - loop#1/step
    - value:
        done: false
        n: 2
  - - node_succeeded
    - loop#1/step
    - {commit: 25}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/step: 25}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 28}
  - [node_started, loop~2]
  - - node_failed
    - loop~2
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [43, 9, 43, 16]
        message: 'node ''loop~2'' pre-assert failed: n < 2'
        node: loop~2
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        person:
          name: Ada
        talking_to: Bob
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - done: false
          n: 0
          person:
            name: Ada
          talking_to: Bob
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        n: 0
        person:
          name: Ada
        talking_to: Bob
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/step
  - - NodeSucceeded
    - node_id: loop#0/step
      output:
        done: false
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        done: false
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
        seed:
        - done: false
          n: 1
          person:
            name: Ada
          talking_to: Bob
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        n: 1
        person:
          name: Ada
        talking_to: Bob
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/step
  - - NodeSucceeded
    - node_id: loop#1/step
      output:
        done: false
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        done: false
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [43, 9, 43, 16]
        message: 'node ''loop~2'' pre-assert failed: n < 2'
        node: loop~2
  - - RunFailed
    - failure:
        code: assertion.failed
        frames:
        - label: flow.yaml
          range: [43, 9, 43, 16]
        message: 'node ''loop~2'' pre-assert failed: n < 2'
        node: loop~2
