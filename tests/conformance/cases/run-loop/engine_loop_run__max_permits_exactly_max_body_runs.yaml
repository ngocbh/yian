  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        exited: false
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeExpanded
    - grow:
        prune: [loop#1/__end__, loop#1/__start__, loop#1/step, loop~2]
        seed:
        - exited: false
          n: 2
        - 2
      node_id: loop~2
  - - NodeStarted
    - node_id: loop#2/__start__
  - - NodeSucceeded
    - node_id: loop#2/__start__
      output:
        exited: false
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#2/step
  - - NodeSucceeded
