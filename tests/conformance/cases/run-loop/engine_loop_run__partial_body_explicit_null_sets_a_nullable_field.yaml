kind: run
flow: |2

  id: partial-note
  name: partial_note
  input:
    note0: !Optional(str)
  defs:
    clear_note:
      input:
        n: !int
      nodes:
        step:
          kind: code
          code: |
            return {"n": inputs["n"] + 1, "note": null}
          input:
            n: ${input.n}
          output:
            n: int
            note: Optional(str)
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: clear_note
      input:
        n: 0
        note: ${input.note0}
      times: 2
  output: ${loop.output}
inputs:
  note0: seed
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      n: 2
      note: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {note0: seed}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        note0: seed
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {__start__: 6}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/step]
  - - pool_commit
    - loop#0/step
    - value:
        n: 1
        note: null
  - - node_succeeded
    - loop#0/step
    - {commit: 14}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/step: 14}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 17}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 17}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 20
  - [node_started, loop#1/step]
  - - pool_commit
    - loop#1/step
    - value:
        n: 2
        note: null
  - - node_succeeded
    - loop#1/step
    - {commit: 25}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/step: 25}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 28}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - key: loop
      from: {loop#1/__end__: 28}
  - - node_succeeded
    - loop~2
    - {commit: 31}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        n: 2
        note: null
  - - node_succeeded
    - __end__
    - {commit: 34}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        note0: seed
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 0
          note: seed
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        n: 0
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/step
  - - NodeSucceeded
    - node_id: loop#0/step
      output:
        n: 1
        note: null
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        n: 1
        note: null
      interrupted: false
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
        seed:
        - n: 1
          note: null
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/step
  - - NodeSucceeded
    - node_id: loop#1/step
      output:
        n: 2
        note: null
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        n: 2
        note: null
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeSucceeded
    - commit_as: loop
      node_id: loop~2
      output:
        n: 2
        note: null
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        n: 2
        note: null
      interrupted: false
  - - RunSucceeded
    - output:
        n: 2
        note: null
