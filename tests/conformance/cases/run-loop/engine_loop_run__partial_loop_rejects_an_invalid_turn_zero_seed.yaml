kind: run
flow: |2

  id: opaque-turn-zero
  name: opaque_turn_zero
  input:
    initial_n: !str
  defs:
    body:
      input:
        n: !int
        note: !str
      nodes: {}
      output:
        n: ${input.n}
        note: ${input.note + "!"}
  nodes:
    loop:
      kind: loop
      call: body
      input:
        n: ${input.initial_n + ""}
        note: seed
      while: "false"
      max: 1
  output: ${loop.output}
inputs:
  initial_n: not-an-int
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: contract.output
      frames:
      - label: flow.yaml
        range: [9, 10, 9, 14]
      message: 'output at n: "not-an-int" does not match declared type int'
      node: loop
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {initial_n: not-an-int}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        initial_n: not-an-int
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - node_failed
    - loop
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [9, 10, 9, 14]
        message: 'output at n: "not-an-int" does not match declared type int'
        node: loop
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        initial_n: not-an-int
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [9, 10, 9, 14]
        message: 'output at n: "not-an-int" does not match declared type int'
        node: loop
  - - RunFailed
    - failure:
        code: contract.output
        frames:
        - label: flow.yaml
          range: [9, 10, 9, 14]
        message: 'output at n: "not-an-int" does not match declared type int'
        node: loop
