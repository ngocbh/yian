# A LOOP `while:` that fails to evaluate (`10 / n` once n is 0) fails the run. It fails
# condition.evaluate.
kind: run
flow: |2

  id: pred-raise
  name: pred_raise
  defs:
    down:
      input:
        n: !int
      nodes:
        step:
          kind: code
          code: ./fixtures/compose_codefns.ts:loop_countdown
          input:
            n: ${input.n}
          output:
            n: !int
      output: ${step.output}
  nodes:
    loop:
      kind: loop
      call: down
      input:
        n: 2
      while: 10 / n > 0
      max: 10
  output: ${loop.output}
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: condition.evaluate
      frames:
      - label: flow.yaml
        range: [18, 3, 18, 7]
      message: 'division by zero: 10 / 0'
      node: loop~2
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/step]
  - - pool_commit
    - loop#0/step
    - value:
        n: 1
  - - node_succeeded
    - loop#0/step
    - {commit: 14}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/step: 14}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 17}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 17}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 20
  - [node_started, loop#1/step]
  - - pool_commit
    - loop#1/step
    - value:
        n: 0
  - - node_succeeded
    - loop#1/step
    - {commit: 25}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/step: 25}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 28}
  - [node_started, loop~2]
  - - node_failed
    - loop~2
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [18, 3, 18, 7]
        message: 'division by zero: 10 / 0'
        node: loop~2
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - n: 2
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        n: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/step
  - - NodeSucceeded
    - node_id: loop#0/step
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/step, loop~1]
        seed:
        - n: 1
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        n: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/step
  - - NodeSucceeded
    - node_id: loop#1/step
      output:
        n: 0
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        n: 0
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeFailed
    - failure:
        code: condition.evaluate
        frames:
        - label: flow.yaml
          range: [18, 3, 18, 7]
        message: 'division by zero: 10 / 0'
        node: loop~2
  - - RunFailed
