kind: run
flow: |2

  id: typed-counter
  name: typed_counter
  nodes:
    loop:
      kind: loop
      times: 3
      input:
        rounds: !int 0
      nodes:
        bump:
          kind: code
          input:
            n: ${input.rounds}
          output: !int
          code: |
            return inputs["n"] + 1
      output:
        rounds: ${bump.output}
  output: ${loop.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output:
      rounds: 3
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, loop]
  - - pool_commit
    - loop
    - from: {}
      key: loop#0/__start__
  - - node_expanded
    - loop
    - prune_ids: []
  - [node_started, loop#0/__start__]
  - - node_succeeded
    - loop#0/__start__
    - commit: 9
  - [node_started, loop#0/bump]
  - - pool_commit
    - loop#0/bump
    - value: 1
  - - node_succeeded
    - loop#0/bump
    - {commit: 14}
  - [node_started, loop#0/__end__]
  - - pool_commit
    - loop#0/__end__
    - from: {loop#0/bump: 14}
  - - node_succeeded
    - loop#0/__end__
    - {commit: 17}
  - [node_started, loop~1]
  - - pool_commit
    - loop~1
    - from: {loop#0/__end__: 17}
      key: loop#1/__start__
  - - node_expanded
    - loop~1
    - prune_ids: [loop#0/__end__, loop#0/__start__, loop#0/bump, loop~1]
  - [node_started, loop#1/__start__]
  - - node_succeeded
    - loop#1/__start__
    - commit: 20
  - [node_started, loop#1/bump]
  - - pool_commit
    - loop#1/bump
    - value: 2
  - - node_succeeded
    - loop#1/bump
    - {commit: 25}
  - [node_started, loop#1/__end__]
  - - pool_commit
    - loop#1/__end__
    - from: {loop#1/bump: 25}
  - - node_succeeded
    - loop#1/__end__
    - {commit: 28}
  - [node_started, loop~2]
  - - pool_commit
    - loop~2
    - from: {loop#1/__end__: 28}
      key: loop#2/__start__
  - - node_expanded
    - loop~2
    - prune_ids: [loop#1/__end__, loop#1/__start__, loop#1/bump, loop~2]
  - [node_started, loop#2/__start__]
  - - node_succeeded
    - loop#2/__start__
    - commit: 31
  - [node_started, loop#2/bump]
  - - pool_commit
    - loop#2/bump
    - value: 3
  - - node_succeeded
    - loop#2/bump
    - {commit: 36}
  - [node_started, loop#2/__end__]
  - - pool_commit
    - loop#2/__end__
    - from: {loop#2/bump: 36}
  - - node_succeeded
    - loop#2/__end__
    - {commit: 39}
  - [node_started, loop~3]
  - - pool_commit
    - loop~3
    - key: loop
      from: {loop#2/__end__: 39}
  - - node_succeeded
    - loop~3
    - {commit: 42}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value:
        rounds: 3
  - - node_succeeded
    - __end__
    - {commit: 45}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: loop
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - rounds: 0
        - 0
      node_id: loop
  - - NodeStarted
    - node_id: loop#0/__start__
  - - NodeSucceeded
    - node_id: loop#0/__start__
      output:
        rounds: 0
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/bump
  - - NodeSucceeded
    - node_id: loop#0/bump
      output: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#0/__end__
  - - NodeSucceeded
    - node_id: loop#0/__end__
      output:
        rounds: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop~1
  - - NodeExpanded
    - grow:
        prune: [loop#0/__end__, loop#0/__start__, loop#0/bump, loop~1]
        seed:
        - rounds: 1
        - 1
      node_id: loop~1
  - - NodeStarted
    - node_id: loop#1/__start__
  - - NodeSucceeded
    - node_id: loop#1/__start__
      output:
        rounds: 1
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/bump
  - - NodeSucceeded
    - node_id: loop#1/bump
      output: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#1/__end__
  - - NodeSucceeded
    - node_id: loop#1/__end__
      output:
        rounds: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop~2
  - - NodeExpanded
    - grow:
        prune: [loop#1/__end__, loop#1/__start__, loop#1/bump, loop~2]
        seed:
        - rounds: 2
        - 2
      node_id: loop~2
  - - NodeStarted
    - node_id: loop#2/__start__
  - - NodeSucceeded
    - node_id: loop#2/__start__
      output:
        rounds: 2
      interrupted: false
  - - NodeStarted
    - node_id: loop#2/bump
  - - NodeSucceeded
    - node_id: loop#2/bump
      output: 3
      interrupted: false
  - - NodeStarted
    - node_id: loop#2/__end__
  - - NodeSucceeded
    - node_id: loop#2/__end__
      output:
        rounds: 3
      interrupted: false
  - - NodeStarted
    - node_id: loop~3
  - - NodeSucceeded
    - commit_as: loop
      node_id: loop~3
      output:
        rounds: 3
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output:
        rounds: 3
      interrupted: false
  - - RunSucceeded
    - output:
        rounds: 3
