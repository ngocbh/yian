kind: run
flow: |
  id: list-none-call
  name: list_none_call
  defs:
    echo:
      input:
        values: !list(Optional(str))
      nodes: {}
      output: ${input.values}
  nodes:
    source:
      kind: code
      code: |
        return [null]
      output: list(None)
    invoke:
      kind: call
      call: echo
      input:
        values: ${source.output}
  output: ${invoke.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [null]
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, source]
  - - pool_commit
    - source
    - value: [null]
  - - node_succeeded
    - source
    - {commit: 9}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {source: 9}
      key: invoke/__start__
  - - node_expanded
    - invoke
    - prune_ids: []
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 12
  - [node_started, invoke/__end__]
  - - pool_commit
    - invoke/__end__
    - key: invoke
      from: {invoke/__start__: 12}
  - - node_succeeded
    - invoke/__end__
    - {commit: 17}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [null]
  - - node_succeeded
    - __end__
    - {commit: 20}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: source
  - - NodeSucceeded
    - node_id: source
      output: [null]
      interrupted: false
  - - NodeStarted
    - node_id: invoke
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          values: [null]
      node_id: invoke
  - - NodeStarted
    - node_id: invoke/__start__
  - - NodeSucceeded
    - node_id: invoke/__start__
      output:
        values: [null]
      interrupted: false
  - - NodeStarted
    - node_id: invoke/__end__
  - - NodeSucceeded
    - commit_as: invoke
      node_id: invoke/__end__
      output: [null]
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [null]
      interrupted: false
  - - RunSucceeded
    - output: [null]
