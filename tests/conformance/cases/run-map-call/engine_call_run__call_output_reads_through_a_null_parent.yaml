kind: run
flow: |
  id: nullable-projection
  name: nullable_projection
  typedefs:
    Payload:
      value: int
  input:
    payload: !Optional(Payload)
  defs:
    pick:
      input:
        payload: !Optional(Payload)
      nodes: {}
      output: ${input.payload?.value}
  nodes:
    invoke:
      kind: call
      call: pick
      input:
        payload: ${input.payload}
  output: ${invoke.output}
inputs:
  payload: null
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: null
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {payload: null}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        payload: null
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, invoke]
  - - pool_commit
    - invoke
    - from: {__start__: 6}
      key: invoke/__start__
  - - node_expanded
    - invoke
    - prune_ids: []
  - [node_started, invoke/__start__]
  - - node_succeeded
    - invoke/__start__
    - commit: 9
  - [node_started, invoke/__end__]
  - - pool_commit
    - invoke/__end__
    - key: invoke
      from: {invoke/__start__: 9}
  - - node_succeeded
    - invoke/__end__
    - {commit: 14}
  - [node_started, __end__]
  - [pool_commit, __end__]
  - - node_succeeded
    - __end__
    - {commit: 17}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        payload: null
      interrupted: false
  - - NodeStarted
    - node_id: invoke
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          payload: null
      node_id: invoke
  - - NodeStarted
    - node_id: invoke/__start__
  - - NodeSucceeded
    - node_id: invoke/__start__
      output:
        payload: null
      interrupted: false
  - - NodeStarted
    - node_id: invoke/__end__
  - - NodeSucceeded
    - commit_as: invoke
      node_id: invoke/__end__
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      interrupted: false
  - [RunSucceeded]
