kind: run
flow: |2

  id: defs-map
  name: defs_map
  input:
    topics: !list(str)
  defs:
    one:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}
  nodes:
    each:
      kind: map
      call: one
      over: ${input.topics}
      input:
        topic: ${item}
  output: ${each.output}
inputs:
  topics: [A, B, C]
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [A, B, C]
  trace:
  - - run_started
    - null
    - learnable: false
      num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        topics: [A, B, C]
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topics: [A, B, C]
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, each]
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each/__start__
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each#0/__start__
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each#1/__start__
  - - pool_commit
    - each
    - from: {__start__: 6}
      key: each#2/__start__
  - - node_expanded
    - each
    - prune_ids: []
  - [node_started, each/__start__]
  - - node_succeeded
    - each/__start__
    - commit: 9
  - [node_started, each#0/__start__]
  - - node_succeeded
    - each#0/__start__
    - commit: 10
  - [node_started, each#1/__start__]
  - - node_succeeded
    - each#1/__start__
    - commit: 11
  - [node_started, each#2/__start__]
  - - node_succeeded
    - each#2/__start__
    - commit: 12
  - [node_started, each#0/x]
  - - pool_commit
    - each#0/x
    - value: A
  - - node_succeeded
    - each#0/x
    - {commit: 23}
  - [node_started, each#1/x]
  - - pool_commit
    - each#1/x
    - value: B
  - - node_succeeded
    - each#1/x
    - {commit: 26}
  - [node_started, each#2/x]
  - - pool_commit
    - each#2/x
    - value: C
  - - node_succeeded
    - each#2/x
    - {commit: 29}
  - [node_started, each#0/__end__]
  - - pool_commit
    - each#0/__end__
    - from: {each#0/x: 23}
  - - node_succeeded
    - each#0/__end__
    - {commit: 32}
  - [node_started, each#1/__end__]
  - - pool_commit
    - each#1/__end__
    - from: {each#1/x: 26}
  - - node_succeeded
    - each#1/__end__
    - {commit: 35}
  - [node_started, each#2/__end__]
  - - pool_commit
    - each#2/__end__
    - from: {each#2/x: 29}
  - - node_succeeded
    - each#2/__end__
    - {commit: 38}
  - [node_started, each/__end__]
  - - pool_commit
    - each/__end__
    - key: each
      from: {each#0/__end__: 32, each#1/__end__: 35, each#2/__end__: 38}
  - - node_succeeded
    - each/__end__
    - {commit: 41}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [A, B, C]
  - - node_succeeded
    - __end__
    - {commit: 44}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topics: [A, B, C]
      interrupted: false
  - - NodeStarted
    - node_id: each
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - topic: A
        - topic: B
        - topic: C
      node_id: each
  - - NodeStarted
    - node_id: each/__start__
  - - NodeSucceeded
    - node_id: each/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: each#0/__start__
  - - NodeSucceeded
    - node_id: each#0/__start__
      output:
        topic: A
      interrupted: false
  - - NodeStarted
    - node_id: each#1/__start__
  - - NodeSucceeded
    - node_id: each#1/__start__
      output:
        topic: B
      interrupted: false
  - - NodeStarted
    - node_id: each#2/__start__
  - - NodeSucceeded
    - node_id: each#2/__start__
      output:
        topic: C
      interrupted: false
  - - NodeStarted
    - node_id: each#0/x
  - - NodeSucceeded
    - node_id: each#0/x
      output: A
      interrupted: false
  - - NodeStarted
    - node_id: each#1/x
  - - NodeSucceeded
    - node_id: each#1/x
      output: B
      interrupted: false
  - - NodeStarted
    - node_id: each#2/x
  - - NodeSucceeded
    - node_id: each#2/x
      output: C
      interrupted: false
  - - NodeStarted
    - node_id: each#0/__end__
  - - NodeSucceeded
    - node_id: each#0/__end__
      output: A
      interrupted: false
  - - NodeStarted
    - node_id: each#1/__end__
  - - NodeSucceeded
    - node_id: each#1/__end__
      output: B
      interrupted: false
  - - NodeStarted
    - node_id: each#2/__end__
  - - NodeSucceeded
    - node_id: each#2/__end__
      output: C
      interrupted: false
  - - NodeStarted
    - node_id: each/__end__
  - - NodeSucceeded
    - commit_as: each
      node_id: each/__end__
      output: [A, B, C]
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [A, B, C]
      interrupted: false
  - - RunSucceeded
    - output: [A, B, C]
