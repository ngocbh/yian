kind: run
flow: |2

  id: nested
  name: nested
  input:
    topic: !str
  defs:
    inner:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:make_report
          input:
            topic: ${input.topic}
          output:
            report: str
            n: int
      output: ${x.output.report}
    outer:
      input:
        topic: !str
      nodes:
        inner_call:
          kind: call
          call: inner
          input:
            topic: ${input.topic}
      output: ${inner_call.output}
  nodes:
    go:
      kind: call
      call: outer
      input:
        topic: ${input.topic}
  output: ${go.output}
inputs:
  topic: ACME
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: report for ACME
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {topic: ACME}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topic: ACME
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, go]
  - - pool_commit
    - go
    - from: {__start__: 6}
      key: go/__start__
  - - node_expanded
    - go
    - prune_ids: []
  - [node_started, go/__start__]
  - - node_succeeded
    - go/__start__
    - commit: 9
  - [node_started, go/inner_call]
  - - pool_commit
    - go/inner_call
    - from: {go/__start__: 9}
      key: go/inner_call/__start__
  - - node_expanded
    - go/inner_call
    - prune_ids: []
  - [node_started, go/inner_call/__start__]
  - - node_succeeded
    - go/inner_call/__start__
    - commit: 14
  - [node_started, go/inner_call/x]
  - - pool_commit
    - go/inner_call/x
    - value:
        n: 4
        report: report for ACME
  - - node_succeeded
    - go/inner_call/x
    - {commit: 19}
  - [node_started, go/inner_call/__end__]
  - - pool_commit
    - go/inner_call/__end__
    - key: go/inner_call
      from: {go/inner_call/x: 19}
  - - node_succeeded
    - go/inner_call/__end__
    - {commit: 22}
  - [node_started, go/__end__]
  - - pool_commit
    - go/__end__
    - key: go
      from: {go/inner_call: 22}
  - - node_succeeded
    - go/__end__
    - {commit: 25}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: report for ACME
  - - node_succeeded
    - __end__
    - {commit: 28}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: go
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: go
  - - NodeStarted
    - node_id: go/__start__
  - - NodeSucceeded
    - node_id: go/__start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: go/inner_call
  - - NodeExpanded
    - grow:
        prune: []
        seed:
          topic: ACME
      node_id: go/inner_call
  - - NodeStarted
    - node_id: go/inner_call/__start__
  - - NodeSucceeded
    - node_id: go/inner_call/__start__
      output:
        topic: ACME
      interrupted: false
  - - NodeStarted
    - node_id: go/inner_call/x
  - - NodeSucceeded
    - node_id: go/inner_call/x
      output:
        n: 4
        report: report for ACME
      interrupted: false
  - - NodeStarted
    - node_id: go/inner_call/__end__
  - - NodeSucceeded
    - commit_as: go/inner_call
      node_id: go/inner_call/__end__
      output: report for ACME
      interrupted: false
  - - NodeStarted
    - node_id: go/__end__
  - - NodeSucceeded
    - commit_as: go
      node_id: go/__end__
      output: report for ACME
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: report for ACME
      interrupted: false
  - - RunSucceeded
    - output: report for ACME
