kind: run
flow: |
  id: omitted-null-default
  name: omitted_null_default
  defs:
    child:
      kind: code
      code: |
        return inputs["maybe"]
      input:
        maybe: !Optional(int) null
      output: !Optional(int)
  nodes:
    go:
      kind: call
      call: child
  output: ${go.output}
