    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, go]
  - - pool_commit
    - go
    - from: {}
      key: go/__start__
  - - node_expanded
    - go
    - prune_ids: []
  - [node_started, go/__start__]
  - - node_succeeded
    - go/__start__
    - commit: 9
  - [node_started, go/child]
