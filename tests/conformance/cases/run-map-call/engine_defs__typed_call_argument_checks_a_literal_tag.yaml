kind: run
flow: |2

  id: str-to-literal
  name: str_to_literal
  typedefs:
    Mode: Literal(a, b)
  input:
    s: !str
  defs:
    child:
      kind: code
      code: |
        return inputs["mode"]
      input:
        mode: !Mode
      output: !str
  nodes:
    go:
      kind: call
      call: child
      input:
        mode: !Mode ${input.s}
  output: ${go.output}
inputs:
  s: c
run:
  num_workers: 0
expect:
  output:
    status: failed
    failure:
      code: binding.type
      frames:
      - label: flow.yaml
        range: [21, 13, 21, 29]
      message: 'binding ''mode'': "c" is not one of Literal(a, b)'
      node: go
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {s: c}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        s: c
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, go]
  - - node_failed
    - go
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 13, 21, 29]
        message: 'binding ''mode'': "c" is not one of Literal(a, b)'
        node: go
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output:
        s: c
      interrupted: false
  - - NodeStarted
    - node_id: go
  - - NodeFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 13, 21, 29]
        message: 'binding ''mode'': "c" is not one of Literal(a, b)'
        node: go
  - - RunFailed
    - failure:
        code: binding.type
        frames:
        - label: flow.yaml
          range: [21, 13, 21, 29]
        message: 'binding ''mode'': "c" is not one of Literal(a, b)'
        node: go
