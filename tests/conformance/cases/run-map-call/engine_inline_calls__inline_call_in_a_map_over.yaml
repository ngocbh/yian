kind: run
flow: |2

  id: ic_over
  name: ic_over
  input:
    topics: !list(str)
  defs:
    one:
      input:
        topic: !str
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: !str
      output: ${x.output}
    producelist:
      input:
        xs: !list(str)
      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.xs}
          output: !list(str)
      output: ${x.output}
  nodes:
    each:
      kind: map
      call: one
      over: call(producelist, xs=${input.topics})
      input:
        topic: ${item}
  output: ${each.output}
inputs:
  topics: [A, B]
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [A, B]
  trace:
