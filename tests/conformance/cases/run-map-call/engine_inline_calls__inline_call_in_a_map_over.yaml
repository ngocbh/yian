    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        topics: [A, B]
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        topics: [A, B]
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, __call_0]
  - - pool_commit
    - __call_0
    - from: {__start__: 6}
