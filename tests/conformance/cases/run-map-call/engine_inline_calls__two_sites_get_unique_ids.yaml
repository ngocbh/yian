      nodes:
        x:
          kind: code
          code: ./fixtures/compose_codefns.ts:echo
          input:
            topic: ${input.topic}
          output: str
      output: ${x.output}

  nodes:
    a:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(enrich, topic=${input.topic})
      output: str
    b:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: call(enrich, topic=${input.topic})
      output: str
  output:
    ra: ${a.output}
    rb: ${b.output}
