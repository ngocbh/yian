kind: run
flow: |
  id: inline-map-literal-over
  name: inline_map_literal_over
  nodes:
    each:
      kind: map
      over: [1, 2]
      input:
        value: ${item}
      nodes:
        echo:
          kind: code
          code: |
            return inputs["value"]
          input:
            value: ${input.value}
          output: !int
      output: ${echo.output}
  output: ${each.output}
run:
  num_workers: 0
expect:
  output:
    status: succeeded
    output: [1, 2]
  trace:
  - - run_started
    - null
    - num_workers: 0
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: <id:1>}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value: {}
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value: {}
  - - node_succeeded
    - __start__
    - {commit: 6}
  - [node_started, each]
  - - pool_commit
    - each
    - from: {}
      key: each/__start__
  - - pool_commit
    - each
    - from: {}
      key: each#0/__start__
  - - pool_commit
    - each
    - from: {}
      key: each#1/__start__
  - - node_expanded
    - each
    - prune_ids: []
  - [node_started, each/__start__]
  - - node_succeeded
    - each/__start__
    - commit: 9
  - [node_started, each#0/__start__]
  - - node_succeeded
    - each#0/__start__
    - commit: 10
  - [node_started, each#1/__start__]
  - - node_succeeded
    - each#1/__start__
    - commit: 11
  - [node_started, each#0/echo]
  - - pool_commit
    - each#0/echo
    - value: 1
  - - node_succeeded
    - each#0/echo
    - {commit: 20}
  - [node_started, each#1/echo]
  - - pool_commit
    - each#1/echo
    - value: 2
  - - node_succeeded
    - each#1/echo
    - {commit: 23}
  - [node_started, each#0/__end__]
  - - pool_commit
    - each#0/__end__
    - from: {each#0/echo: 20}
  - - node_succeeded
    - each#0/__end__
    - {commit: 26}
  - [node_started, each#1/__end__]
  - - pool_commit
    - each#1/__end__
    - from: {each#1/echo: 23}
  - - node_succeeded
    - each#1/__end__
    - {commit: 29}
  - [node_started, each/__end__]
  - - pool_commit
    - each/__end__
    - key: each
      from: {each#0/__end__: 26, each#1/__end__: 29}
  - - node_succeeded
    - each/__end__
    - {commit: 32}
  - [node_started, __end__]
  - - pool_commit
    - __end__
    - value: [1, 2]
  - - node_succeeded
    - __end__
    - {commit: 35}
  events:
  - [RunStarted]
  - - NodeStarted
    - node_id: __start__
  - - NodeSucceeded
    - node_id: __start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: each
  - - NodeExpanded
    - grow:
        prune: []
        seed:
        - value: 1
        - value: 2
      node_id: each
  - - NodeStarted
    - node_id: each/__start__
  - - NodeSucceeded
    - node_id: each/__start__
      output: {}
      interrupted: false
  - - NodeStarted
    - node_id: each#0/__start__
  - - NodeSucceeded
    - node_id: each#0/__start__
      output:
        value: 1
      interrupted: false
  - - NodeStarted
    - node_id: each#1/__start__
  - - NodeSucceeded
    - node_id: each#1/__start__
      output:
        value: 2
      interrupted: false
  - - NodeStarted
    - node_id: each#0/echo
  - - NodeSucceeded
    - node_id: each#0/echo
      output: 1
      interrupted: false
  - - NodeStarted
    - node_id: each#1/echo
  - - NodeSucceeded
    - node_id: each#1/echo
      output: 2
      interrupted: false
  - - NodeStarted
    - node_id: each#0/__end__
  - - NodeSucceeded
    - node_id: each#0/__end__
      output: 1
      interrupted: false
  - - NodeStarted
    - node_id: each#1/__end__
  - - NodeSucceeded
    - node_id: each#1/__end__
      output: 2
      interrupted: false
  - - NodeStarted
    - node_id: each/__end__
  - - NodeSucceeded
    - commit_as: each
      node_id: each/__end__
      output: [1, 2]
      interrupted: false
  - - NodeStarted
    - node_id: __end__
  - - NodeSucceeded
    - node_id: __end__
      output: [1, 2]
      interrupted: false
  - - RunSucceeded
    - output: [1, 2]
