# `call: {billing: quote}` on a call, map and loop node, and `call(billing.quote, ...)`, each run
# a def of the library `billing`, which grows under the calling node as a `defs:` call does.
kind: run
flow: |
  id: orders
  name: orders
  input:
    qtys: !list(int)
  uses:
    billing: lib/billing
  nodes:
    one:
      kind: call
      call: {billing: quote}
      input:
        qty: 2
    each:
      kind: map
      over: ${input.qtys}
      call: {billing: quote}
      input:
        qty: ${item}
    count:
      kind: loop
      call: {billing: step}
      input:
        n: 0
      times: 1
  output:
    one: ${one.output}
    each: ${each.output}
    count: ${count.output.n}
    inline: call(billing.quote, qty=5)
files:
  lib/billing.yaml: |
    id: billing
    name: billing
    defs:
      quote:
        input:
          qty: !int
        kind: code
        code: return inputs.qty * 3
        output: !int
      step:
        input:
          n: !int
        kind: code
        code: "return {n: inputs.n + 1}"
        output: {n: !int}
inputs: {qtys: [4]}
run: {run_id: r1, num_workers: 0}
expect:
  output: {status: succeeded, output: {one: 6, each: [12], count: 1, inline: 15}}
  trace:
    - [run_started, null, {num_workers: 0}]
    - [pool_commit, __start__, {key: system.now}]
    - [pool_commit, __start__, {key: system.run_id, value: r1}]
    - [pool_commit, __start__, {key: system.today}]
    - [pool_commit, __start__, {value: {qtys: [4]}}]
    - [node_started, __start__]
