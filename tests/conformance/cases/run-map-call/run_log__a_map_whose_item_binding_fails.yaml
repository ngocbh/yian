# Pins: a MAP whose second item's binding fails fails at that item's binding, with no growth.
kind: run
flow: |
  id: labels
  name: labels
  input: {xs: !list(Optional(str))}
  defs:
    label:
      input: {line: !str, x: !str}
      nodes:
        echo: {kind: code, input: {line: "${input.line}"}, output: str, code: "return inputs['line']"}
      output: ${echo.output}
  nodes:
    each: {kind: map, over: "${input.xs}", call: label, input: {line: "Item ${item}.", x: '${item :? "no item"}'}}
  output: ${each.output}
inputs: {xs: [a, null]}
run: {run_id: r1, num_workers: 0}
expect:
  output:
    status: failed
    failure:
      code: binding.evaluate
      frames:
      - label: flow.yaml
        range: [11, 89, 11, 111]
      message: no item
      node: each
  trace:
  - - run_started
    - null
    - {num_workers: 0}
  - - pool_commit
    - __start__
    - {key: system.now}
  - - pool_commit
    - __start__
    - {key: system.run_id, value: r1}
  - - pool_commit
    - __start__
    - {key: system.today}
  - - pool_commit
    - __start__
    - value:
        xs: [a, null]
  - [node_started, __start__]
  - - pool_commit
    - __start__
    - value:
        xs: [a, null]
  - - node_succeeded
    - __start__
    - commit: 6
  - [node_started, each]
  - - node_failed
    - each
    - failure:
        code: binding.evaluate
        message: no item
        frames:
        - label: flow.yaml
          range: [11, 89, 11, 111]
        node: each
