# A TOOL node calls a memory's tool by its group form, `tool_id: {lessons: read}`, with the tool's
# arguments as its input. Its output is the read's result: the path, the file's hash and its text.
kind: run
flow: |
  id: read
  name: read
  input:
    lessons: !FileMemory
  nodes:
    found:
      kind: tool
      tool_id: {lessons: read}
      input:
        path: notes/math.md
  output: ${found.output}
run: {run_id: r1, num_workers: 0}
host:
  memory:
    lessons:
      type: FileMemory
      id: t/lessons
      files:
        notes/math.md: |-
          Check sums twice.
          Carry the one.
expect:
  output:
    status: succeeded
    output:
      path: notes/math.md
      hash: 7e1d3795e8e1f6bf115ec25a1d5f9d53c8eac1fa0ea1e08a77c45e12fc5b5dc0
      text: |-
        Check sums twice.
        Carry the one.
