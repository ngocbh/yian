# A map runs a memory's tool per item: the map passes the memory to its generated body, whose node
# reads it, never as an argument.
kind: run
flow: |
  id: f
  name: f
  input:
    lessons: !FileMemory
  nodes:
    found: {kind: map, over: [a.md, b.md], call: {lessons: read}, input: {path: "${item}"}}
  output: ${[found.output[0].text, found.output[1].text]}
run: {run_id: r1, num_workers: 0}
host:
  memory:
    lessons:
      type: FileMemory
      id: t/lessons
      files: {a.md: one, b.md: two}
expect:
  output:
    status: succeeded
    output: [one, two]
