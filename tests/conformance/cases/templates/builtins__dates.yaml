kind: expr
# add_days and days_between count days in UTC; a datetime keeps its time and offset as written,
# and days_between rounds down, as Python's timedelta.days does.
expr: "[add_days('2024-02-28', 1), add_days('2026-01-01', -1), add_days('2026-05-21T14:30+07:00', 10), days_between('2026-01-01', '2026-03-01'), days_between('2026-03-01', '2026-01-01'), days_between('2026-01-02T11:59Z', '2026-01-01T12:00Z')]"
expect:
  value: ["2024-02-29", "2025-12-31", "2026-05-31T14:30+07:00", 59, -59, -1]
