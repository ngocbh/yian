kind: load
flow: |
  id: open_case
  name: open_case
  input:
    n: !int(0..)
  nodes:
    route:
      kind: case
      on: ${input.n}
      cases:
        - when: -1
          then: hit
      else: miss
    hit:
      kind: code
      code: |
        return "hit"
      output: !str
    miss:
      kind: code
      code: |
        return "miss"
      output: !str
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `when: -1` is not a value of `on: ${input.n}` (`int(0..)`): -1 is below the inclusive int minimum 0'
      frames:
      - label: flow.yaml
        range: [10, 15, 10, 17]
