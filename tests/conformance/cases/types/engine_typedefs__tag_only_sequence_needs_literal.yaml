kind: value
# A bad typedef raises when the typedefs are read.
type: Category
typedefs: {Category: [pro, con]}
value: 1
expect:
  raises:
    class: TypeCheckError
    message: "typedef 'Category': a tag-only union must be a Literal(...) enum, not a sequence (e.g. Category: Literal(pro, con))"
    path: [Category]
