kind: load
flow: |
  id: t
  name: t
  typedefs:
    Buy: {action: 'Literal(buy)', qty: int}
    Sell: {action: 'Literal(sell)', price: float}
    Order: 'Buy | Sell'
  input:
    n: !int
  output: !Order
  kind: code
  code: |
    return 1
expect:
  load:
    diagnostics:
    - code: compose.load
      message: "bad typedefs: typedef 'Order': malformed type expression 'Buy | Sell': use Union(Buy, Sell) (| is not a type operator)"
      frames:
      - label: flow.yaml
        range: [6, 3, 6, 8]
