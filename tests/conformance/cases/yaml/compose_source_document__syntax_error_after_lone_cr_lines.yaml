# The parser stops at the line break before the double-quoted scalar's unindented continuation line;
# its line 3 still counts the two lone CRs before it..
kind: load
flow: "id: x\rname: x\rdescription: \"a\rb\"\rnodes: [\r"
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [3, 16, 3, 17]
