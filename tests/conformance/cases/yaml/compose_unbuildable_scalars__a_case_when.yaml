kind: load
flow: |
  id: f
  name: f
  input:
    d: !date
  nodes:
    route:
      kind: case
      on: ${input.d}
      cases:
        - when: 2026-13-45
          then: x
      else: x
    x:
      kind: code
      output: !str
      code: |
        return 'x'
  output: ${route.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      frames:
      - label: flow.yaml
        range: [10, 15, 10, 16]
