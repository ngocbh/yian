kind: load
flow: |
  id: f
  name: f
  typedefs:
    Cmd: Literal(yes, no)
  input:
    cmd: !bool
  nodes:
    route:
      kind: case
      on: ${input.cmd}
      cases:
        - when: yes
          then: agree
      else: refuse
    agree:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: agreed
      output: !str
    refuse:
      kind: code
      code: ./fixtures/compose_codefns.ts:echo
      input:
        topic: refused
      output: !str
  output: ${agree.output | refuse.output}
expect:
  load:
    diagnostics:
    - code: compose.load
      message: 'case node ''route'': `when: yes` is text but `on: ${input.cmd}` is `bool`; `yes` is text; write `true`'
      frames:
      - label: flow.yaml
        range: [12, 15, 12, 18]
