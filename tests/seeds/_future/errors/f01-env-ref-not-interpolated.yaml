# f01 — `env:` values are NEVER interpolated and NEVER validated: this flow LOADS AND RUNS CLEAN.
# No diagnostic captures this behavior, so it remains a future negative fixture.
#
# Both of these pass silently today:
#   env: {API_KEY: ${nope.output}}   -> the ref is not resolved; the literal string "${nope.output}"
#                                       is handed to the node as the env var's value
#   env: {API_KEY: 123}              -> only env KEYS are checked for str-ness
#
# A per-entry range alone cannot create a diagnostic because no validation runs for `env:` values.
# The engine has no failure or semantic origin to attach to this literal pass-through.
#
# No contract defines whether `${...}` in `env:` should interpolate or be rejected, so this remains
# under `_future/errors/` rather than the active `errors/` gallery.
#
#   CURRENT:  loads OK, runs OK, status="succeeded". API_KEY == the literal "${nope.output}".
#   MISSING:  choose interpolation or loud rejection, then add the corresponding validation.
id: fut-env-ref-not-interpolated
name: fut_env_ref_not_interpolated
nodes:
  calc:
    kind: code
    env:
      API_KEY: ${nope.output}      # neither resolved nor rejected — passed through as a literal
      RETRIES: 123                 # not a string; not rejected either
    output: int
    code: |
      return 1
output: ${calc.output}
