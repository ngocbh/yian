# f02 — an unknown AGENT `tools:` entry is NOT checked at load: this flow LOADS CLEAN.
# The load-side check does not exist, so this remains a future negative fixture.
#
# NOT a duplicate of e23: that pins a TOOL node's `tool_id:`, which fails as a recorded node
# failure when the node runs. This is an AGENT node's `tools:` list. The unknown id survives
# compile. At run start, before any log exists, `run_flow` checks every static AGENT grant
# against the run's tools and raises `ValueError` naming the node and the unknown tool or group.
# No model is called, but the error is a raised exception, not a failed `RunResult`, so it fits
# neither fixture shape in `errors/`, and this seed asserts nothing.
#
# A per-entry range alone cannot make this a load error: there is no load-time validation or
# semantic origin carrier for an AGENT `tools:` entry. Only the host knows which names it will
# supply (a name may be a host-filled tool group), so a load-time check needs the run's tools.
#
#   CURRENT:  loads OK. At run start: `ValueError` naming node `note` and the first grant the
#             run's tools lack; no log is created.
#   EXPECTED: a load-time check naming the unknown id, located at its own `tools:` entry.
id: fut-agent-tools-no-load-check
name: fut_agent_tools_no_load_check
input:
  topic: str
nodes:
  note:
    kind: agent
    tools: [web_search, nope_tool]     # `nope_tool` is unregistered — not caught at load
    input:
      topic: ${input.topic}
    output: str
    prompt: "Rate ${topic}."
output: ${note.output}
