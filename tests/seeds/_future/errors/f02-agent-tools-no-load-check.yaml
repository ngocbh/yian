# f02 — an unknown AGENT `tools:` entry is NOT checked at load: this flow LOADS CLEAN.
# No milestone owns this yet — no issue filed. DEFERRED because the load-side check does not exist.
#
# NOT a duplicate of e23: that pins a TOOL node's `tool_id:`, which IS checked. This is an AGENT
# node's `tools:` LIST, which is not. The unknown id survives compile and only surfaces at run time,
# from `resolve_tools` (`tools/registry.py:62`) called deep inside the mode
# (`nodes/agent/modes/tool_calling.py:93`) — as a bare `ValueError`, carrying NO locator, so the
# caret degrades to the node header / kind fallback. Reaching it also requires live model creds,
# which is why this seed asserts nothing.
#
# WHY IT'S HERE: same lesson as f01, one shape over. #88's container table lists `tools:` as a
# sequence we "never descended into," implying an easy win. But a stamp for ("tools", 1) would have
# nothing to ask for it — there is no load-time check to carry a locator, and the runtime failure
# doesn't mint one. Two halves missing, not one.
#
#   CURRENT:  loads OK. At run: bare ValueError from inside the agent mode, no locator, no range.
#   EXPECTED: a load-time check naming the unknown id, located at its own `tools:` entry.
id: fut-agent-tools-no-load-check
name: fut_agent_tools_no_load_check
input:
  topic: str
nodes:
  note:
    kind: agent
    mode: tool_calling
    tools: [web_search, nope_tool]     # `nope_tool` is unregistered — not caught at load
    input:
      topic: ${input.topic}
    output: str
    prompt: "Rate ${topic}."
output: ${note.output}
