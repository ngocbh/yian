# f02 — an unknown AGENT `tools:` entry is NOT checked at load: this flow LOADS CLEAN.
# The load-side check does not exist, so this remains a future negative fixture.
#
# NOT a duplicate of e23: that pins a TOOL node's `tool_id:`, which IS checked. This is an AGENT
# node's `tools:` list, which is not. The unknown id survives compile and only surfaces at run time
# when the agent mode resolves its tools. The node wrapper classifies it as a canonical
# `node.execute` failure at the AGENT node; reaching it still requires live model credentials,
# so this seed asserts nothing.
#
# A per-entry range alone cannot make this a load error: there is no load-time validation or
# semantic origin carrier for an AGENT `tools:` entry.
#
#   CURRENT:  loads OK. At run: canonical node.execute failure at the AGENT node.
#   EXPECTED: a load-time check naming the unknown id, located at its own `tools:` entry.
id: fut-agent-tools-no-load-check
name: fut_agent_tools_no_load_check
input:
  topic: str
nodes:
  note:
    kind: agent
    mode: tool_calling
    tools: [web_search, nope_tool]     # `nope_tool` is unregistered — not caught at load
    input:
      topic: ${input.topic}
    output: str
    prompt: "Rate ${topic}."
output: ${note.output}
