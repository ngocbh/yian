# e25 — a CODE callable that raises INSIDE an EXTERNAL `uses:` flow (a different .yaml).
#
# RUNTIME: the inner `kaboom` node fails with runtime id `go/kaboom`. The composed
# origin resolver presents the outer CALL site in this file followed by the failing
# `code:` scalar in lib_boom.yaml. CODE-only -> no model.
# No child source snapshot or CLI graph walk participates.
#
# Run it with the file resolver pointed at this dir:
#   load_flow(text, search_paths=[<errors dir>]); run_flow(loaded, {...})
id: err-external-raise
name: err_external_raise
input:
  topic: !str

uses:
  boom: lib_boom                # external flow on the search path (this dir)

nodes:
  go:
    kind: call
    call: boom
    input:
      topic: ${input.topic}

output: ${go.output}
