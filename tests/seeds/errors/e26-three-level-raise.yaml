# e26 — a CODE callable that raises THREE levels deep (call -> def -> def).
#
# RUNTIME: the leaf `boom` node fails with runtime id `outer/mid/boom`. Its ordered
# origin trace resolves to THREE frames: `outer:`, the `via:` CALL site inside
# `defs:middle`, and the `boom` `code:` scalar inside `defs:deep`. CODE-only.
# Frame order comes from the trace itself, without parsing the runtime id or
# descending through baked children.
id: err-three-level-raise
name: err_three_level_raise
input:
  topic: str

defs:
  deep:
    input:
      topic: str
    nodes:
      boom:
        kind: code
        code: tests.seeds.fns:fail_always
        input:
          topic: ${input.topic}
        output: str
    output: ${boom.output}
  middle:
    input:
      topic: str
    nodes:
      via:
        kind: call
        call: deep
        input:
          topic: ${input.topic}
    output: ${via.output}

nodes:
  outer:
    kind: call
    call: middle
    input:
      topic: ${input.topic}

output: ${outer.output}
