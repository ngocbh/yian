# e29 — an inline CODE body returns a value with a non-JSON member nested inside (a bare
# object in a dict). RUNTIME: the output boundary rejects the non-JSON member, as it does
# for any node output, before the value is recorded: `contract.output` at `bad`, with the
# member's path (`handle`) on the type-check error.
id: err-inline-nonserializable
name: err_inline_nonserializable
input:
  topic: !str
nodes:
  bad:
    kind: code
    input:
      topic: ${input.topic}
    output: object
    code: |
      return {"topic": inputs["topic"], "handle": object()}
output: ${bad.output}
