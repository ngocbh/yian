# (output is 1), so both fail; the caret must point at the FIRST occurrence (located BY POSITION),
# never collapse to the second occurrence. Run with no inputs.
id: err-dup-assert
name: err_dup_assert
nodes:
  compute:
    kind: code
    output: int
    code: tests.seeds.fns:const_one
    asserts:
      - output < 0
      - output < 0
output: ${compute.output}
