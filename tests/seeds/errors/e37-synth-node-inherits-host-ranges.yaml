# e37 — a SYNTHESIZED node's caret must resolve to its OWN source, not the host's. COMPILE:
# "unresolved references". Pins the CROSS-NODE provenance bug #98's `(kind, key)` tuple could NOT
# fix (#106, formerly folded into #88). Fails at load; no inputs needed.
# Run: `ac run tests/seeds/errors/e37-synth-node-inherits-host-ranges.yaml`.
#
# The inline `call(...)` (line 30) desugars to a synth node `__call_0`. It USED to be handed the HOST
# `summary` node's `field_ranges` verbatim, so both nodes carried the SAME map:
#     summary:   topic->L29  news->L30  inputs->L29  outputs->L31  prompt->L32
#     __call_0:  topic->L29  news->L30  inputs->L29  outputs->L31  prompt->L32
# `__call_0` is a CALL node — no `prompt:`, no `news` input. Its ONE input is `topic`, authored on
# L30 INSIDE the directive; but the inherited `('input','topic')` said L29 — the HOST's `topic:`. Same
# key, two locations, the foreign one won. No key scheme fixes that: the key is correct, the map is
# foreign — the synth node needs its OWN provenance.
#
# The failure is `node '__call_0' input 'topic'`.
#   FIXED (#106): caret L30 — the `call(...)` directive's binding line. The desugar now hands the
#                 synth node the origin range of the binding it came from (empty field_ranges), so a
#                 bad ref inside the directive carets the directive, not the host's like-named input.
#                 (Pre-#104: the whole `inputs:` block L29-31; post-#104 per-entry: L29 alone, a valid
#                 line — confidently wrong. This seed pins the corrected L30.)
id: err-synth-inherits-host-ranges
name: err_synth_inherits_host_ranges
input:
  topic: str
nodes:
  summary:
    kind: agent
    input:
      topic: ${input.topic}                      # L29 — the HOST's topic (VALID)
      news: call(enrich, topic=${nope.output})   # L30 — the SYNTH's topic (THE ERROR)
    output: str
    prompt: "Summarize ${news} for ${topic}."
defs:
  enrich:
    input:
      topic: str
    nodes:
      fetch:
        kind: code
        code: tests.seeds.fns:fetch_facts
        input:
          topic: ${input.topic}
        output:
          values: list[float]
          news: list[str]
    output: ${fetch.output.news}
output: ${summary.output}
