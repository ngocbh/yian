# e37 — a SYNTHESIZED node is handed the HOST's `field_ranges`, so its caret resolves to the host's
# line. COMPILE: "unresolved references". Pins the CROSS-NODE collision that #98's `(kind, key)`
# tuple does NOT fix (#88, reopened). Fails at load; no inputs needed.
#
# The inline `call(...)` (line 30) desugars to a synth node `__call_0`; `_to_call_descriptor`
# (compose/desugar/inline_calls.py:318) hands it `field_ranges=dict(field_ranges)` — the HOST
# `summary` node's map, verbatim. Both nodes end up with the SAME map:
#     summary:   topic->L29  news->L30  inputs->L29  outputs->L31  prompt->L32
#     __call_0:  topic->L29  news->L30  inputs->L29  outputs->L31  prompt->L32
# `__call_0` is a CALL node — it has no `prompt:` and no `news` input. Its ONE input is `topic`,
# authored on L30 inside the directive. Its `('input','topic')` says L29 — the HOST's `topic:`.
# Same key, two source locations; the foreign one wins. A tuple key cannot fix this: the key is
# CORRECT, the map belongs to another node.
#
# The failure is `node '__call_0' input 'topic'`.
#   CURRENT (main):     caret L29,L30,L31 — the `inputs:` BLOCK. Wrong, but CONTAINS the error.
#                       (L31 `output: str` is the separate #99 half-open overshoot, fixed by #105.)
#   CURRENT (PR #104):  caret L29 ALONE — a VALID line marked, the real error on L30 unmarked.
#                       Turning on per-entry resolution makes this case strictly WORSE.
#   EXPECTED:           caret L30 — the `call(...)` directive the synth node came from.
id: err-synth-inherits-host-ranges
name: err_synth_inherits_host_ranges
input:
  topic: str
nodes:
  summary:
    kind: agent
    input:
      topic: ${input.topic}                      # L29 — the HOST's topic (VALID)
      news: call(enrich, topic=${nope.output})   # L30 — the SYNTH's topic (THE ERROR)
    output: str
    prompt: "Summarize ${news} for ${topic}."
defs:
  enrich:
    input:
      topic: str
    nodes:
      fetch:
        kind: code
        code: tests.seeds.fns:fetch_facts
        input:
          topic: ${input.topic}
        output:
          values: list[float]
          news: list[str]
    output: ${fetch.output.news}
output: ${summary.output}
