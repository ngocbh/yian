# e38 — a dangling `${...}` inside a `case` node's `when:` must locate at the offending `when:` line,
# not the NODE HEADER. COMPILE: "unresolved references". Pins the SYNTH-PARAM provenance failure a
# key scheme alone cannot fix (#106, formerly folded into #88). Fails at load; no inputs needed.
#
# `compose/nodes/case.py` hoists each distinct `${...}` in a `when:` into a SYNTHETIC CaseNode input
# `__rN`, rewriting the `when:` to the bare local `${__r1}`. So the ref-scan sees `("input","__r1")`
# — a name that appears NOWHERE in this file — and USED to fall back to the node header, printing the
# synthetic `__r1` the author never wrote.
#
# FIXED (#106): the CASE desugar captures each `cases[N].when` range (positionally) at parse and
# stamps `("input","__rN")` -> that range, plus a `cases[N].when` LABEL, onto the built node. So the
# ref-scan resolves the caret to L36 and names the author's construct instead of the synthetic
# local. The recorded range and author-facing error label remain aligned.
#
# (A CASE node also has no `inputs:` field — its keys are `cases`/`else`/`on` — so the block-range
# fallback `franges.get(("field","inputs"))` always missed; the per-`__rN` stamp now wins ahead of
# it. Contrast e14, where the author's `rid:` survives to error time and can be named directly.)
#
# The failure is `node 'gate' cases[1].when`.
#   FIXED:  caret L36 — the offending `when:` line; the message names `cases[1].when`.
#   (was:   caret L31, the `gate:` header, message leaking `input '__r1'` — a name nowhere authored.)
#
# Run: `ac run tests/seeds/errors/e38-case-when-ref-locates-node-header.yaml`.
id: err-case-when-ref-header
name: err_case_when_ref_header
nodes:
  score:
    kind: code
    code: tests.seeds.fns:const_one
    output: int
  gate:                                    # L31 — the node header (no longer the caret site)
    kind: case
    cases:                                 # L33 — the `cases:` block
      - when: "score.output >= 0.5"        # L34 — valid
        then: positive
      - when: "nope.output >= 0.9"         # L36 — THE ERROR (no node `nope`)
        then: positive
    else: positive
  positive:
    kind: code
    code: tests.seeds.fns:const_one
    output: int
output: ${positive.output}
