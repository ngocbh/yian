# e39 — a bad `llm_config:` entry rejected during descriptor construction.
#
# The authored `llm_config:` mapping is retained as one source range. Its first
# entry is the invalid `provider:` value below, so that range begins at the most
# useful source line for this validation failure.
#
# The descriptor passes that range into the load-time validation boundary. The
# resulting LoadError must keep it instead of relying on the node-header line map.
#
# This fixture therefore covers a build-time error raised below the generic
# descriptor conductor while still preserving its precise authored field site.
#
# Expected: the error range begins on L27, the invalid `provider:` entry. The
# node header on L24 is only the coarser fallback that this regression guards.
#
# The filename retains its historical wording because callers and seed catalogs
# use it as a stable test identifier; the asserted behavior is now range-backed.
#
id: err-llm-config-no-range
name: err_llm_config_no_range
input:
  topic: str
nodes:
  note:
    kind: agent
    llm_config:
      provider: bogus_provider       # L27 — THE ERROR (not a known provider)
      temperature: 0.3
    input:
      topic: ${input.topic}
    output: str
    prompt: "Rate ${topic}."
output: ${note.output}
