# e41 — a STRUCTURED `output:` whose one bad field fails validation: the locator names the WHOLE
# field, and the range resolves to None. RUNTIME: the typed write boundary rejects it. Run with no
# inputs. (e21 is the scalar twin; this one exists for the per-field granularity question.)
#
# TWO defects remain in temporary locator/range compatibility metadata:
#
# 1. GRANULARITY. `score:` is what's bad; `claim:` is fine. The locator is
#    SourceSpan(node='calc', kind='field', key='output') — the whole field — and the message
#    ('not-an-int' does not match declared type int) never says `score`. So even a perfect stamp for
#    ("outputs","score") would go unused: nothing asks for it. Same lesson as e39/e40 — the LOCATOR
#    is the missing half, not the stamp.
#
# 2. THE FUNNEL MISSES ENTIRELY -> range=None. `runtime/engine.py:472` mints key="output" (SINGULAR,
#    the write-boundary vocabulary), but `field_ranges` is keyed "outputs" (PLURAL, after
#    node-signature normalization rewrites the author's `output:` key). So `eval_node.py:149`'s
#    `field_ranges.get(("field","output"))` misses on EVERY output-validation failure:
#        calc.field_ranges keys: [('field','code'), ('field','outputs')]
#          .get(("field","output"))  -> None          <- what the funnel asks for
#          .get(("field","outputs")) -> SourceRange(...)
#    `RunResult.range` therefore remains None. Canonical `Failure.trace` does not use
#    that bridge: output validation selects the exact `score` contract origin, and
#    `ComposedFlow.diagnose()` resolves it directly.
#    This keeps the old carrier defect reproducible while proving it is no longer
#    a presentation fallback or source authority.
#
#   CURRENT compatibility fields: locator key='output' (not `score`); range=None.
#   CANONICAL DIAGNOSIS: the `score:` line through the failure's contract-path origin.
id: err-structured-output-no-range
name: err_structured_output_no_range
nodes:
  calc:
    kind: code
    output:
      claim: str                                        # L34 — fine
      score: int                                        # L35 — the field that fails
    code: |
      return {"claim": "ok", "score": "not-an-int"}
output: ${calc.output.claim}
