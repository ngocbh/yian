# e44 — a literal value under a secret name is rejected at its input line.
# COMPILE: fails at load; no inputs needed. "node 'login': input 'password' is a secret
# name, so its value can't be written in the flow file; pass it as an input
# (${input.password}) or from the host" — located at L16.
#
# Every value written in a flow is part of its identity, so a credential does not belong
# in the file. Under a secret name the value must be a `${...}` reference or `null`; the
# error never repeats the value.
id: err-literal-secret
name: err_literal_secret
nodes:
  login:
    kind: code
    input:
      user: admin
      password: hunter2    # L16 — THE ERROR (a literal under a secret name)
    output: str
    code: |
      return inputs["user"]
output: ${login.output}
