# lib_boom — a tiny EXTERNAL flow whose CODE node always raises.
#
# Imported by e25-external-raise.yaml via `uses:`. The inner `kaboom` node's
# `code:` origin resolves through this document's catalog, so the canonical frame
# uses this filename. CODE-only -> runs locally, no model.
# The parent composes this catalog through its external alias resolver.

id: lib_boom
name: lib_boom
description: An external flow whose only node raises (external-frame traceback fixture).

input:
  topic: !str

nodes:
  kaboom:
    kind: code
    code: tests.seeds.fns:fail_always
    input:
      topic: ${input.topic}
    output: str

output: ${kaboom.output}
